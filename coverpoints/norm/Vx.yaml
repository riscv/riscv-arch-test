# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # The maximum size in bits of a vector element that any operation can produce or
  # consume, ELEN {ge} 8, which must be a power of 2.
  - name: ELEN
    coverpoint: ["Implicit"]

  # The number of bits in a single vector register, VLEN {ge} ELEN, which must be a
  # power of 2, and must be no greater than 2^16^.
  - name: VLEN
    coverpoint:
      [
        "Implicit: a fixed implementation parameter - every other coverpoint's vl/lmul arithmetic implicitly depends on it being correct",
      ]

  # A small implementation supporting ELEN=32 requires only seven bits of state in
  # vtype: two bits for ma and ta, two bits for vsew[1:0] and three bits for
  # vlmul[2:0]. The illegal value represented by vill can be internally encoded
  # using the illegal 64-bit combination in vsew[1:0] without requiring an
  # additional storage bit to hold vill.
  - name: vill_implicit_encoding
    coverpoint:
      [
        "Implicit: internal vill encoding choice is exercised whenever any test produces and checks vill, regardless of how it's internally encoded",
      ]

  # Implementations may also change mstatus.VS or vsstatus.VS from Initial or Clean
  # to Dirty at any time, even when there is no change in vector state.
  - name: HW_MSTATUS_VS_DIRTY_UPDATE
    coverpoint:
      [
        "Untestable: whether an implementation opportunistically marks mstatus.VS/vsstatus.VS Dirty is a permissive implementation choice with no single correct answer to assert",
      ]

  # Implementations may set vill in either case.
  - name: RESERVED_VILL_SET
    coverpoint:
      [
        "Untestable: Implementation Specific, Theoretically Implicit with Correct Sail Config",
      ]

  # The vector extension adds 32 architectural vector registers, v0-v31 to the base
  # scalar RISC-V ISA.
  - name: vreg_count
    coverpoint: ["Vf16_vfmv_f_s_cg/cp_custom_fmv_fs_vs2_all_lmul_regs"]

  # When mstatus.VS is set to Initial or Clean, executing any instruction that
  # changes vector state, including the vector CSRs, will change mstatus.VS to
  # Dirty. Implementations may also change mstatus.VS from Initial or Clean to Dirty
  # at any time, even when there is no change in vector state.
  - name: mstatus_vs_op_initial_clean
    coverpoint:
      [
        "SmV_cg/cp_mstatus_vs_set_dirty_arithmetic",
        "SmV_cg/cp_mstatus_vs_set_dirty_csr",
      ]

  # When V=1, both vsstatus.VS and mstatus.VS are in effect: attempts to execute any
  # vector instruction, or to access the vector CSRs, raise an illegal-instruction
  # exception when either field is set to Off.
  - name: vsstatus_vs_mstatus_vs_op_off
    coverpoint:
      [
        "ExceptionsHV_cg/cp_mstatus_vs_off",
        "ExceptionsHV_cg/cp_vsstatus_vs_off",
      ]

  # When the hypervisor extension is present, a vector context status field, VS, is
  # added to vsstatus[10:9]. It is defined analogously to the floating-point context
  # status field, FS.
  - names: [vsstatus_vs_sz, vsstatus_vs_acc]
    coverpoint: ["ExceptionsHV_cg/cp_vsstatus_vs_off"]

  # Attempts to execute any vector instruction, or to access the vector CSRs, raise
  # an illegal-instruction exception when mstatus.VS is set to Off.
  - name: mstatus_vs_op_off
    coverpoint: ["SmV_cg/cp_mstatus_vs_off_arithmetic"]

  # When V=1 and neither vsstatus.VS nor mstatus.VS is set to Off, executing any
  # instruction that changes vector state, including the vector CSRs, will change
  # both mstatus.VS and vsstatus.VS to Dirty.
  - name: mstatus_vs_op_active
    coverpoint:
      [
        "SmV_cg/cp_mstatus_vs_set_dirty_arithmetic",
        "SmV_cg/cp_mstatus_vs_set_dirty_csr",
      ]

  # A vector context status field, VS, is added to mstatus[10:9] and shadowed in
  # sstatus[10:9]. It is defined analogously to the floating-point context status
  # field, FS.
  - name: sstatus_vs_op
    coverpoint:
      [
        "Untestable: sstatus.VS is a CSR-shadowing/layout fact, not independently observable via a coverpoint",
      ]

  # Similarly, when V=1, both vsstatus.VS and the HS-level sstatus.VS are in effect.
  # Attempts to execute a vector instruction when either field is 0 (Off) raise an
  # illegal-instruction exception. Modifying the vector state when V=1 causes both
  # fields to be set to 3 (Dirty).
  - name: vsstatus_vs_op2
    coverpoint:
      [
        "Untestable: requires the H extension configured; see mstatus_vs_op_off for the non-hypervisor form",
      ]

  # When V=1, both vsstatus.VS and mstatus.VS are in effect: attempts to execute any
  # vector instruction, or to access the vector CSRs, raise an illegal-instruction
  # exception when either field is set to Off.
  - name: vsstatus_vs_op_off
    coverpoint:
      [
        "ExceptionsHV_cg/cp_mstatus_vs_off",
        "ExceptionsHV_cg/cp_vsstatus_vs_off",
      ]

  # When V=1 and neither vsstatus.VS nor mstatus.VS is set to Off, executing any
  # instruction that changes vector state, including the vector CSRs, will change
  # both mstatus.VS and vsstatus.VS to Dirty.
  - name: vsstatus_vs_op_active
    coverpoint:
      [
        "SmV_cg/cp_mstatus_vs_set_dirty_arithmetic",
        "SmV_cg/cp_mstatus_vs_set_dirty_csr",
      ]

  # If vsstatus.VS is Dirty, vsstatus.SD is 1; otherwise, vsstatus.SD is set in
  # accordance with existing specifications.
  - name: vsstatus_sd_op_vs
    coverpoint:
      [
        "Untestable: vsstatus.SD is a CSR-layout consequence of VS state, not independently observable via a coverpoint",
      ]

  # If mstatus.VS is Dirty, mstatus.SD is 1; otherwise, mstatus.SD is set in
  # accordance with existing specifications.
  - name: mstatus_sd_op_vs
    coverpoint:
      [
        "Untestable: mstatus.SD is a CSR-layout consequence of VS state, not independently observable via a coverpoint",
      ]

  # Implementations may have a writable misa.V field.
  - name: MUTABLE_MISA_V
    coverpoint: ["SmV_cg/cp_misa_v_clear_set"]

  # Analogous to the way in which the floating-point unit is handled, the mstatus.VS
  # field may exist even if misa.V is clear.
  - name: MSTATUS_VS_EXISTS
    coverpoint:
      [
        "Untestable: field-existence-independent-of-misa.V is an implementation/config fact, not a runtime coverpoint",
      ]

  # For implementations with a writable misa.V field, the vsstatus.VS field may
  # exist even if misa.V is clear.
  - name: VSSTATUS_VS_EXISTS
    coverpoint:
      [
        "Untestable: field-existence-independent-of-misa.V is an implementation/config fact, not a runtime coverpoint",
      ]

  # The read-only XLEN-wide vector type CSR, vtype provides the default type used to
  # interpret the contents of the vector register file, and can only be updated by
  # vset{i}vl{i} instructions.
  - names: [vtype_sz, vtype_op]
    coverpoint: ["SmV_cg/cp_sew_lmul_vset_i_vli", "SmV_cg/cp_sew_lmul_vsetvl"]

  # The vtype register has five fields, vill, vma, vta, vsew[2:0], and vlmul[2:0].
  # Bits vtype[XLEN-2:8] should be written with zero, and non-zero values in this
  # field are reserved.
  - names:
      [vtype_vill_sz, vtype_vma_sz, vtype_vta_sz, vtype_vsew_sz, vtype_vlmul_sz]
    coverpoint: ["SmV_cg/cp_sew_lmul_vsetvl"]

  # The value in vsew sets the dynamic selected element width (SEW). By default, a
  # vector register is viewed as being divided into VLEN/SEW elements.
  - name: vtype_vsew_op
    coverpoint:
      ["SmV_cg/cp_sew_lmul_vset_i_vli", "Vf16_vfadd_vf_cg/cr_vl_lmul_sew16"]

  # While it is anticipated the larger vsew[2:0] encodings (100-111) will be used to
  # encode larger SEW, the encodings are formally reserved at this point.
  - name: vtype_vsew_rsv
    coverpoint:
      [
        "TODO: SmV_cg's rs2_sew coverpoint explicitly ignore_bins the reserved vsew encodings (100/101/110/111) rather than sampling them, and the one template that would exercise them (cp_vtype_walking1s.sv) is not wired into any generated covergroup",
      ]

  # Implementations must support LMUL integer values of 1, 2, 4, and 8.
  - name: vtype_lmul_val
    coverpoint:
      ["Vf16_vfadd_vf_cg/cr_vl_lmul_sew16", "SmV_cg/cp_sew_lmul_vset_i_vli"]

  # Implementations must provide fractional LMUL settings that allow the narrowest
  # supported type to occupy a fraction of a vector register corresponding to the
  # ratio of the narrowest supported type&#8217;s width to that of the largest
  # supported type&#8217;s width. In general, the requirement is to support LMUL ≥
  # SEWMIN/ELEN, where SEWMIN is the narrowest supported SEW value and ELEN is the
  # widest supported SEW value. In the standard extensions, SEWMIN=8. For standard
  # vector extensions with ELEN=32, fractional LMULs of 1/2 and 1/4 must be
  # supported. For standard vector extensions with ELEN=64, fractional LMULs of 1/2,
  # 1/4, and 1/8 must be supported.
  - name: vtype_lmul_fval
    coverpoint:
      ["Vf16_vfadd_vf_cg/cr_vl_lmul_sew16", "SmV_cg/cp_sew_lmul_vset_i_vli"]

  # For a given supported fractional LMUL setting, implementations must support SEW
  # settings between SEWMIN and LMUL * ELEN, inclusive.
  - name: vtype_sew_val
    coverpoint: ["SmV_cg/cp_sew_lmul_vset_i_vli"]

  # The use of vtype encodings with LMUL &lt; SEWMIN/ELEN is reserved, but
  # implementations can set vill if they do not support these configurations.
  - name: vtype_lmul_fval_rsv
    coverpoint: ["SmV_cg/cp_vtype_vill_set_vl_0"]

  # LMUL is set by the signed vlmul field in vtype (i.e., LMUL = 2vlmul[2:0]).
  - name: LMUL
    coverpoint: ["Vf16_vfadd_vf_cg/cr_vl_lmul_sew16"]

  # The derived value VLMAX = LMUL*VLEN/SEW represents the maximum number of
  # elements that can be operated on with a single vector instruction given the
  # current SEW and LMUL settings as shown in the table below.
  - name: VLMAX
    coverpoint:
      [
        "Vx16_vrgather_vv_cg/cp_custom_vindexCorners_index_ge_vlmax",
        "Vx16_vrgather_vv_cg/cp_custom_vindexCorners_index_gt_vl_lt_vlmax",
      ]

  # Instructions specifying an LMUL=2 vector register group with an odd-numbered
  # vector register are reserved.
  - name: vreg_offgroup_LMUL2_rsv
    coverpoint:
      [
        "Out-of-Scope: reserved behavior that depends on prior CSR state is unspecified and outside Ssstrict's encoding-only methodology",
      ]

  # instructions specifying an LMUL=4 vector register group using vector register
  # numbers that are not multiples of four are reserved.
  - name: vreg_offgroup_LMUL4_rsv
    coverpoint:
      [
        "Out-of-Scope: reserved behavior that depends on prior CSR state is unspecified and outside Ssstrict's encoding-only methodology",
      ]

  # instructions specifying an LMUL=8 vector register group using register numbers
  # that are not multiples of eight are reserved.
  - name: vreg_offgroup_LMUL8_rsv
    coverpoint:
      [
        "Out-of-Scope: reserved behavior that depends on prior CSR state is unspecified and outside Ssstrict's encoding-only methodology",
      ]

  # Mask registers are always contained in a single vector register, regardless of
  # LMUL.
  - name: vreg_mask_LMUL_indp
    coverpoint:
      [
        "Vls16_vlm_v_cg/cp_custom_maskLS_emul_ge_16",
        "Vx16_vmadc_vi_cg/cp_custom_vmask_write_lmulge1",
      ]

  # These two bits modify the behavior of destination tail elements and destination
  # inactive masked-off elements respectively during the execution of vector
  # instructions. The tail and inactive sets contain element positions that are not
  # receiving new results during a vector operation, as defined in .
  - name: vtype_vta_op
    coverpoint: ["Vf16_vfadd_vf_cg/cr_vtype_agnostic"]

  # These two bits modify the behavior of destination tail elements and destination
  # inactive masked-off elements respectively during the execution of vector
  # instructions. The tail and inactive sets contain element positions that are not
  # receiving new results during a vector operation, as defined in .
  - name: vtype_vma_op
    coverpoint: ["Vf16_vfadd_vf_cg/cr_vtype_agnostic"]

  # All systems must support all four options:
  - names: [vtype_vta_val, vtype_vma_val]
    coverpoint: ["Vf16_vfadd_vf_cg/cr_vtype_agnostic"]

  # Mask destination tail elements are always treated as tail-agnostic, regardless
  # of the setting of vta.
  - name: vreg_mask_tail_agn
    coverpoint: ["Vx8_vmor_mm_cg/cr_vtype_agnostic_nomask"]

  # When a set is marked undisturbed, the corresponding set of destination elements
  # in a vector register group retain the value they previously held.
  - name: vreg_mask_op
    coverpoint: ["Vf16_vfadd_vf_cg/cp_masking_edges"]

  # When a set is marked agnostic, the corresponding set of destination elements in
  # any vector destination operand can either retain the value they previously held,
  # or are overwritten with 1s. Within a single vector instruction, each destination
  # element can be either left undisturbed or overwritten with 1s, in any
  # combination, and the pattern of undisturbed or overwritten with 1s is not
  # required to be deterministic when the instruction is executed with the same
  # inputs.
  - name: vreg_agnostic_op
    coverpoint: ["Vf16_vfadd_vf_cg/cp_masking_edges"]

  # In addition, except for mask load instructions, any element in the tail of a
  # mask result can also be written with the value the mask-producing operation
  # would have calculated with vl=VLMAX. Furthermore, for mask-logical instructions
  # and vmsbf.m, vmsif.m, vmsof.m mask-manipulation instructions, any element in the
  # tail of the result can be written with the value the mask-producing operation
  # would have calculated with vl=VLEN, SEW=8, and LMUL=8 (i.e., all bits of the
  # mask register can be overwritten).
  - name: vreg_mask_tail_op
    coverpoint: ["Vx16_vmseq_vv_cg/cr_vtype_agnostic"]

  # If the vill bit is set, then any attempt to execute a vector instruction that
  # depends upon vtype will raise an illegal-instruction exception.
  - name: vtype_vill_op
    coverpoint: ["ExceptionsVx_vsaddu_vv_cg/cp_vill"]

  # The XLEN-bit-wide read-only vl CSR can only be updated by the vset{i}vl{i}
  # instructions, and the fault-only-first vector load instruction variants.
  - name: vl_acc
    coverpoint:
      [
        "SmV_cg/cp_vsetvl_i_rd_nx0_rs1_x0",
        "Vls16_vle16ff_v_cg/cp_custom_ffLS_update_vl",
      ]

  # The vl register holds an unsigned integer specifying the number of elements to
  # be updated with results from a vector instruction, as further detailed in .
  - name: vl_op
    coverpoint:
      ["Vf16_vfadd_vf_cg/cr_vl_lmul_sew16", "Vf16_vfadd_vf_cg/cp_vl_0"]

  # The XLEN-bit-wide read-only CSR vlenb holds the value VLEN/8, i.e., the vector
  # register length in bytes.
  - names: [vlenb_op, vlenb_acc]
    coverpoint: ["SmV_cg/cp_vcsrrswc"]

  # The XLEN-bit-wide read-write vstart CSR specifies the index of the first element
  # to be executed by a vector instruction, as described in .
  - names: [vstart_acc, vstart_sz]
    coverpoint: ["SmV_cg/cp_vcsrs_walking1s", "SmV_cg/cp_vstart_out_of_bounds"]

  # All vector instructions are defined to begin execution with the element number
  # given in the vstart CSR, leaving earlier elements in the destination vector
  # undisturbed
  - name: vstart_op
    coverpoint:
      [
        "Vx16_vcpop_m_cg/cp_custom_gprWriting_vstart_eq_vl",
        "ExceptionsVls_vle8_v_cg/cp_vstart",
      ]

  # reset the vstart CSR to zero at the end of execution.
  - name: vstart_update
    coverpoint:
      [
        "TODO: no coverpoint isolates vstart being reset to zero on successful completion of an instruction",
      ]

  # The vstart CSR is defined to have only enough writable bits to hold the largest
  # element index (one less than the maximum VLMAX).
  - name: vstart_sz_writable
    coverpoint: ["SmV_cg/cp_vstart_out_of_bounds"]

  # The vector fixed-point rounding-mode register holds a two-bit read-write
  # rounding-mode field in the least-significant bits (vxrm[1:0]). The upper bits,
  # vxrm[XLEN-1:2], should be written as zeros.
  - names: [vxrm_acc, vxrm_sz, vxrm_val]
    coverpoint:
      [
        "SmV_cg/cp_vcsrs_walking1s",
        "Vx16_vaadd_vv_cg/cr_vxrm_vs2_vs1_edges",
        "Vx16_vaadd_vx_cg/cr_vxrm_vs2_rs1_edges",
        "Vx16_vssra_vi_cg/cr_vxrm_vs2_imm_edges",
      ]

  # The vector fixed-point rounding-mode is given a separate CSR address to allow
  # independent access, but is also reflected as a field in vcsr.
  - name: vcsr_vxrm_op
    coverpoint: ["SmV_cg/cp_vcsrrswc"]

  # The fixed-point rounding algorithm is specified as follows. Suppose the
  # pre-rounding result is v, and d bits of that result are to be rounded off. Then
  # the rounded result is (v &gt;&gt; d) + r, where r depends on the rounding mode
  # as specified in the following table.
  - name: vxrm_op
    coverpoint:
      [
        "Vx16_vaadd_vx_cg/cr_vxrm_vs2_rs1_edges",
        "Vx16_vssra_vi_cg/cr_vxrm_vs2_imm_edges",
        "Vx16_vaadd_vv_cg/cr_vxrm_vs2_vs1_edges",
      ]

  # The vxsat CSR has a single read-write least-significant bit (vxsat[0]) that
  # indicates if a fixed-point instruction has had to saturate an output value to
  # fit into a destination format. Bits vxsat[XLEN-1:1] should be written as zeros.
  - names: [vxsat_op, vxsat_acc, vxsat_sz]
    coverpoint: ["SmV_cg/cp_vcsrs_walking1s", "Vx16_vsaddu_vv_cg/cp_csr_vxsat"]

  # The vxsat bit is mirrored in vcsr.
  - name: vcsr_vxsat_op
    coverpoint: ["SmV_cg/cp_vcsrrswc"]

  # The vxrm and vxsat separate CSRs can also be accessed via fields in the
  # XLEN-bit-wide vector control and status CSR, vcsr.
  - names: [vcsr_vxsat_acc, vcsr_vxrm_acc]
    coverpoint: ["SmV_cg/cp_vcsrrswc"]

  # When LMUL=1, elements are simply packed in order from the least-significant to
  # most-significant bits of the vector register.
  - name: vreg_lmul1_op
    coverpoint: ["Vx16_vadd_vv_cg/cp_vd"]

  # When LMUL &lt; 1, only the first LMUL*VLEN/SEW elements in the vector register
  # are used. The remaining space in the vector register is treated as part of the
  # tail, and hence must obey the vta setting.
  - name: vreg_flmul_op
    coverpoint: ["Vf16_vfadd_vf_cg/cr_vl_lmul_sew16"]

  # When vector registers are grouped, the elements of the vector register group are
  # packed contiguously in element order beginning with the lowest-numbered vector
  # register and moving to the next-highest-numbered vector register in the group
  # once each vector register is filled.
  - name: vreg_lmulge2_op
    coverpoint:
      [
        "Vx16_vsext_vf2_cg/cp_custom_vext2_overlapping_vd_vs2_lmul4",
        "Vx16_vsext_vf2_cg/cp_custom_vext2_overlapping_vd_vs2_lmul8",
        "Vx64_vsext_vf8_cg/cp_custom_vext8_overlapping_vd_vs2_lmul8",
        "Vx16_vwaddu_vv_cg/cp_custom_vdOverlapTopVs1_vd_vs1_lmul4",
        "Vx16_vwaddu_vv_cg/cp_custom_vdOverlapTopVs2_vd_vs2_lmul4",
        "Vx16_vwadd_vv_cg/cp_custom_allVdOverlapTopVs2_vd_vs2_lmul2",
        "Vf16_vfadd_vf_cg/cr_vl_lmul_sew16",
      ]

  # A vector mask occupies only one vector register regardless of SEW and LMUL.
  - name: vreg_mask_vtype_indp
    coverpoint:
      [
        "Vls16_vlm_v_cg/cp_custom_maskLS_emul_ge_16",
        "Vx16_vmadc_vi_cg/cp_custom_vmask_write_lmulge1",
      ]

  # Each element is allocated a single mask bit in a mask vector register. The mask
  # bit for element i is located in bit i of the mask register, independent of SEW
  # or LMUL.
  - name: vreg_mask_sz
    coverpoint: ["Vf16_vfadd_vf_cg/cp_masking_edges"]

  # Any vector register can be used to hold a scalar regardless of the current LMUL
  # setting.
  - name: vreg_scalar_lmul_indp
    coverpoint:
      [
        "Vf16_vfmv_s_f_cg/cp_custom_fmv_sf_vd_all_lmul_regs",
        "Vf16_vfmv_f_s_cg/cp_custom_fmv_fs_vs2_all_lmul_regs",
        "Vx16_vmv_s_x_cg/cp_custom_voffgroup_vd_lmul2",
        "Vx16_vredand_vs_cg/cp_custom_voffgroup_vs1_lmul2",
        "Vx16_vmv_x_s_cg/cp_custom_voffgroup_vs2_lmul2",
        "Vx16_vmv_s_x_cg/cp_custom_voffgroup_vd_lmul4",
        "Vx16_vmv_s_x_cg/cp_custom_voffgroup_vd_lmul8",
        "Vx16_vwredsum_vs_cg/cp_custom_vreductionw_vd_vs1_emul_16",
      ]

  # Each vector operand has an effective element width (EEW) and an effective LMUL
  # (EMUL) that is used to determine the size and location of all the elements
  # within a vector register group. By default, for most operands of most
  # instructions, EEW=SEW and EMUL=LMUL.
  - name: EEW
    coverpoint:
      [
        "Vx16_vaadd_vv_cg/cp_vs2_edges",
        "Vx16_vwadd_vv_cg/cp_custom_allVdOverlapTopVs2_vd_vs2_lmul2",
      ]

  # Each vector operand has an effective element width (EEW) and an effective LMUL
  # (EMUL) that is used to determine the size and location of all the elements
  # within a vector register group. By default, for most operands of most
  # instructions, EEW=SEW and EMUL=LMUL.
  - name: EMUL
    coverpoint:
      [
        "Vx16_vwadd_wv_cg/cr_vl_lmul_lmul4max_sew16",
        "Vx16_vsext_vf2_cg/cp_custom_vext2_overlapping_vd_vs2_lmul4",
      ]

  # EEW/EMUL = SEW/LMUL.
  - name: EMUL_SEW_LMUL_dep
    coverpoint: ["Vx16_vwadd_wv_cg/cr_vl_lmul_lmul4max_sew16"]

  # EEW/EMUL = SEW/LMUL.
  - name: EEW_SEW_LMUL_dep
    coverpoint:
      [
        "Vx16_vwadd_wv_cg/cr_vl_lmul_lmul4max_sew16",
        "Vx16_vsext_vf2_cg/cp_custom_vext2_overlapping_vd_vs2_lmul4",
      ]

  # Narrowing instructions have a source operand that has EEW=2*SEW and EMUL=2*LMUL
  # but with a destination where EEW=SEW and EMUL=LMUL.
  - name: vnarrowing_EEW
    coverpoint:
      [
        "Vx16_vnclip_wi_cg/cp_custom_vdOverlapBtmVs2_vd_vs2_lmul2",
        "Vx16_vnclip_wi_cg/cp_custom_allVdOverlapBtmVs2_vd_vs2_lmul2",
      ]

  # Narrowing instructions have a source operand that has EEW=2*SEW and EMUL=2*LMUL
  # but with a destination where EEW=SEW and EMUL=LMUL.
  - name: vnarrowing_EMUL
    coverpoint:
      [
        "Vx16_vnclip_wi_cg/cp_custom_vdOverlapBtmVs2_vd_vs2_lmul2",
        "Vx16_vnclip_wi_cg/cr_vl_lmul_lmul4max_sew16",
      ]

  # Using other than the lowest-numbered vector register to specify a vector
  # register group is a reserved encoding.
  - name: EMUL_offgroup_rsv
    coverpoint:
      [
        "Out-of-Scope: this behavior is unspecified even under Ssstrict, which does not cover CSR-state-dependent reserved conditions",
      ]

  # A vector register cannot be used to provide source operands with more than one
  # EEW for a single instruction. A mask register source is considered to have EEW=1
  # for this constraint. An encoding that would result in the same vector register
  # being read with two or more different EEWs, including when the vector register
  # appears at different positions within two or more vector register groups, is
  # reserved.
  - name: vreg_source_EEW_rsv
    coverpoint: ["SsstrictV_vwadd_wv_cg/cp_ssstrictv_widening_source_overlap"]

  # A destination vector register group can overlap a source vector register group
  # only if one of the following holds:
  - name: vreg_overlap_legal
    coverpoint:
      [
        "Vx16_vsext_vf2_cg/cp_custom_vext2_overlapping_vd_vs2_lmul4",
        "Vx32_vsext_vf4_cg/cp_custom_vext4_overlapping_vd_vs2_lmul4",
        "Vx64_vsext_vf8_cg/cp_custom_vext8_overlapping_vd_vs2_lmul8",
        "Vx16_vwaddu_vv_cg/cp_custom_vdOverlapTopVs1_vd_vs1_lmul2",
        "Vx16_vwaddu_vv_cg/cp_custom_vdOverlapTopVs2_vd_vs2_lmul2",
        "Vx16_vwadd_vv_cg/cp_custom_allVdOverlapTopVs1_vd_vs1_lmul2",
        "Vx16_vwadd_vv_cg/cp_custom_allVdOverlapTopVs2_vd_vs2_lmul2",
        "Vx16_vnclip_wi_cg/cp_custom_vdOverlapBtmVs2_vd_vs2_lmul2",
        "Vf16_vfadd_vf_cg/cmp_vd_vs2",
        "Vf16_vfadd_vv_cg/cmp_vd_vs1",
        "Vf16_vfadd_vv_cg/cmp_vs1_vs2",
        "Vf16_vfadd_vv_cg/cmp_vd_vs1_vs2",
        "Vls16_vsoxei16_v_cg/cmp_vs3_vs2_eew_eq_sew",
      ]

  # For the purpose of determining register group overlap constraints, mask elements
  # have EEW=1.
  - name: vreg_mask_overlap
    coverpoint: ["SsstrictV_vwadd_wv_cg/cp_ssstrictv_masking_vd_eq_v0"]

  # Any instruction encoding that violates the overlap constraints is reserved.
  - name: vreg_overlap_rsv
    coverpoint: ["SsstrictV_vwadd_wv_cg/cp_ssstrictv_widening_source_overlap"]

  # When source and destination registers overlap and have different EEW, the
  # instruction is mask- and tail-agnostic, regardless of the setting of the vta and
  # vma bits in vtype.
  - name: vreg_overlap_agn
    coverpoint: ["Vx16_vnclip_wi_cg/cp_masking_edges"]

  # The largest vector register group used by an instruction can not be greater than
  # 8 vector registers (i.e., EMUL≤8), and if a vector instruction would require
  # greater than 8 vector registers in a group, the instruction encoding is
  # reserved. For example, a widening operation that produces a widened vector
  # register group result when LMUL=8 is reserved as this would imply a result
  # EMUL=16.
  - name: EMUL_rsv
    coverpoint:
      ["Out-of-Scope: reserved behavior that is not covered by Ssstrict"]

  # Widened scalar values, e.g., input and output to a widening reduction operation,
  # are held in the first element of a vector register and have EMUL=1.
  - name: vreg_scalar_EMUL
    coverpoint: ["Vx16_vwredsum_vs_cg/cp_custom_vreductionw_vd_vs1_emul_16"]

  # Element operations that are masked off (inactive) never generate exceptions. The
  # destination vector register elements corresponding to masked-off elements are
  # handled with either a mask-undisturbed or mask-agnostic policy depending on the
  # setting of the vma bit in vtype Where available, masking is encoded in a
  # single-bit vm field in the instruction (inst[25]).
  - name: vmask_op
    coverpoint:
      [
        "Vf16_vfrsqrt7_v_cg/cp_custom_vfp_flags_inactive_not_set",
        "Vf16_vfadd_vf_cg/cp_masking_edges",
      ]

  # The mask value used to control execution of a masked vector instruction is
  # always supplied by vector register v0.
  - name: vreg_vmask
    coverpoint:
      [
        "Vls16_vloxei16_v_cg/cp_masking_edges",
        "Vf16_vfadd_vf_cg/cp_masking_edges",
      ]

  # The destination vector register group for a masked vector instruction cannot
  # overlap the source mask register (v0), unless the destination vector register is
  # being written with a mask value (e.g., compares) or the scalar result of a
  # reduction. These instruction encodings are reserved.
  - name: vreg_vmask_rsv
    coverpoint: ["SsstrictV_vadd_vv_cg/cp_ssstrictv_masking_vd_eq_v0"]

  # When vstart ≥ vl, there are no body elements, and no elements are updated in any
  # destination vector register group, including that no tail elements are updated
  # with agnostic values.
  - name: vstart_vl_dep
    coverpoint: ["ExceptionsVx_vsaddu_vv_cg/cp_vstart_gt_vl"]

  # Instructions that write an x register or f register do so even when vstart ≥ vl,
  # including when vl=0.
  - name: vstart_vl_scalar_indp
    coverpoint: ["Vx16_vcpop_m_cg/cp_custom_gprWriting_vstart_eq_vl"]

  # The prestart elements do not raise exceptions and do not update the destination
  # vector register.
  - name: vector_prestart_element
    coverpoint: ["ExceptionsVls_vle8_v_cg/cp_vstart"]

  # The inactive elements do not raise exceptions and do not update any destination
  # vector register group unless masked agnostic is specified (vtype.vma=1), in
  # which case inactive elements may be overwritten with 1s.
  - name: vector_inactive_element
    coverpoint:
      [
        "Vf16_vfadd_vf_cg/cr_vtype_agnostic",
        "Vf16_vfrsqrt7_v_cg/cp_custom_vfp_flags_inactive_not_set",
      ]

  # The tail elements do not raise exceptions, and do not update any destination
  # vector register group unless tail agnostic is specified (vtype.vta=1), in which
  # case tail elements may be overwritten with 1s, or with the result of the
  # instruction in the case of mask-producing instructions except for mask loads.
  # When LMUL &lt; 1, the tail includes the elements past VLMAX that are held in the
  # same vector register.
  - name: vector_tail_element
    coverpoint:
      ["Vf16_vfadd_vf_cg/cp_vl_0", "Vf16_vfadd_vf_cg/cp_masking_edges"]

  # The vset{i}vl{i} instructions set the vtype and vl CSRs based on their
  # arguments, and write the new value of vl into rd.
  - name: vset_op
    coverpoint:
      [
        "SmV_cg/cp_sew_lmul_vsetvl",
        "SmV_cg/cp_sew_lmul_vset_i_vli",
        "SmV_cg/cp_vsetvl_i_avl_eq_vlmax",
        "SmV_cg/cp_vsetivli_avl_edges",
      ]

  # the vl register is also set to zero.
  - name: vtype_vstart_op
    coverpoint:
      [
        "SmV_cg/cp_sew_lmul_vset_i_vli",
        "SmV_cg/cp_sew_lmul_vsetvl",
        "SmV_cg/cp_vtype_vill_set_vl_0",
      ]

  # The new vtype value is encoded in the immediate fields of vsetvli and vsetivli,
  # and in the rs2 register for vsetvl. The read-only XLEN-wide vector type CSR,
  # vtype provides the default type used to interpret the contents of the vector
  # register file, and can only be updated by vset{i}vl{i} instructions.
  - name: vtype_acc
    coverpoint: ["SmV_cg/cp_sew_lmul_vset_i_vli", "SmV_cg/cp_sew_lmul_vsetvl"]

  # If the vtype value is not supported by the implementation, then the vill bit is
  # set in vtype, the remaining bits in vtype are set to zero A vtype value with
  # vill set is treated as an unsupported configuration. Implementations must
  # consider all bits of the vtype value to determine if the configuration is
  # supported. An unsupported value in any location within the vtype value must
  # result in vill being set.
  - name: vtype_vill_set
    coverpoint:
      ["Vls16_vl1re16_v_cg/cp_custom_vwholeRegLS_vill", "SmV_cg/cp_vill_vsetvl"]

  # When rs1 is not x0, the AVL is an unsigned integer held in the x register
  # specified by rs1, and the new vl value is also written to the x register
  # specified by rd. When rs1=x0 but rd≠x0, the maximum unsigned integer value (~0)
  # is used as the AVL, and the resulting VLMAX is written to vl and also to the x
  # register specified by rd. When rs1=x0 and rd=x0, the instructions operate as if
  # the current vector length in vl is used as the AVL, and the resulting value is
  # written to vl, but not to a destination register. This form can only be used
  # when VLMAX and hence vl is not actually changed by the new SEW/LMUL ratio.
  - name: vsetvl_op
    coverpoint:
      [
        "SmV_cg/cp_vsetvl_i_rd_x0_rs1_x0",
        "SmV_cg/cp_vsetvl_i_rd_nx0_rs1_x0",
        "SmV_cg/cp_vsetvl_i_avl_eq_zero",
        "SmV_cg/cp_vsetvl_i_avl_eq_vlmax",
        "SmV_cg/cp_vsetvl_i_avl_lt_2x_vlmax",
        "SmV_cg/cp_vsetvl_i_avl_eq_2x_vlmax",
        "SmV_cg/cp_vsetvl_i_avl_gt_2x_vlmax",
      ]

  # Use of the instructions with a new SEW/LMUL ratio that would result in a change
  # of VLMAX is reserved. Use of the instructions is also reserved if vill was 1
  # beforehand.
  - name: vtype_vset_rsv
    coverpoint:
      [
        "Out-of-Scope: we cannot test reserved behavior that depends on prior vill state; outside Ssstrict's encoding-only methodology",
      ]

  # For the vsetivli instruction, the AVL is encoded as a 5-bit zero-extended
  # immediate (0&#8212;&#8203;31) in the rs1 field.
  - name: vsetivli_op
    coverpoint: ["SmV_cg/cp_vsetivli_avl_edges"]

  # The vset{i}vl{i} instructions first set VLMAX according to their vtype argument,
  # then set vl obeying the following constraints: vl = AVL if AVL ≤ VLMAX ceil(AVL
  # / 2) ≤ vl ≤ VLMAX if AVL &lt; (2 * VLMAX) vl = VLMAX if AVL ≥ (2 * VLMAX)
  # Deterministic on any given implementation for same input AVL and VLMAX values
  # These specific properties follow from the prior rules: vl = 0 if AVL = 0 vl &gt;
  # 0 if AVL &gt; 0 vl ≤ VLMAX vl ≤ AVL a value read from vl when used as the AVL
  # argument to vset{i}vl{i} results in the same value in vl, provided the resultant
  # VLMAX equals the value of VLMAX at the time that vl was read
  - name: vl_val
    coverpoint:
      [
        "SmV_cg/cp_vsetvl_i_avl_eq_vlmax",
        "SmV_cg/cp_vsetvl_i_avl_lt_2x_vlmax",
        "SmV_cg/cp_vsetvl_i_avl_gt_2x_vlmax",
        "SmV_cg/cp_vsetvl_i_avl_eq_zero",
      ]

  # Vector load/store base registers and strides are taken from the GPR x registers.
  - name: vector_ls_base_stride_regtype
    coverpoint: ["Vls16_vlse16_v_cg/cp_rs1_nx0", "Vls16_vlse16_v_cg/cp_rs2"]

  # The base effective address for all vector accesses is given by the contents of
  # the x register named in rs1.
  - name: vector_ls_base
    coverpoint: ["Vls16_vle8_v_cg/cp_rs1_nx0", "Vls16_vse8_v_cg/cp_rs1_nx0"]

  # Vector unit-stride operations access elements stored contiguously in memory
  # starting from the base effective address.
  - name: vector_ls_unit_stride_op
    coverpoint: ["Vls16_vle8_v_cg/cp_vd"]

  # Vector constant-stride operations access the first memory element at the base
  # effective address, and then access subsequent elements at address increments
  # given by the byte offset contained in the x register specified by rs2.
  - name: vector_ls_constant_stride_op
    coverpoint: ["Vls16_vlse8_v_cg/cp_rs2"]

  # For loads, the vd register will hold the first field loaded from the segment.
  # For stores, the vs3 register is read to provide the first field to be stored to
  # each segment.
  - name: vector_ls_seg_unit_stride_vd_vs3
    coverpoint:
      ["Vls16_vlseg2e8_v_cg/cp_vd_lte30", "Vls16_vsseg2e8_v_cg/cp_vs3_lte30"]

  # However, even for the ordered form, accesses to the fields within an individual
  # segment are not ordered with respect to each other.
  - name: vector_ls_seg_indexed_unordered
    coverpoint:
      [
        "Untestable: memory-ordering guarantees are not observable from a single-hart self-checking signature",
      ]

  # If element 0 raises an exception, vl is not modified, and the trap is taken. If
  # an element &gt; 0 raises an exception, the corresponding trap is not taken, and
  # the vector length vl is reduced to the index of the element that would have
  # raised an exception.
  - name: vector_ff_op
    coverpoint: ["Vls16_vle8ff_v_cg/cp_custom_ffLS_update_vl"]

  # Vector indexed operations add the contents of each element of the vector offset
  # operand specified by vs2 to the base effective address to give the effective
  # address of each element. The data vector register group has EEW=SEW, EMUL=LMUL,
  # while the offset vector register group has EEW encoded in the instruction and
  # EMUL=(EEW/SEW)*LMUL.
  - name: vector_ls_indexed_op
    coverpoint:
      ["Vls16_vloxei16_v_cg/cp_vs2", "Vls16_vloxei16_v_cg/cp_vs2_edges_ls"]

  # Indexed operations use the explicit EEW encoding in the instruction to set the
  # size of the indices used, and use SEW/LMUL to specify the data width.
  - name: vector_ls_indexed_EEW
    coverpoint:
      [
        "{Vls8_vloxei16_v_cg,Vls16_vloxei16_v_cg,Vls32_vloxei16_v_cg,Vls64_vloxei16_v_cg}/cp_asm_count",
      ]

  # The vector offset operand is treated as a vector of byte-address offsets.
  - name: vector_ls_bytewise
    coverpoint: ["Vls16_vloxei16_v_cg/cp_vs2_edges_ls"]

  # If the vector offset elements are narrower than XLEN, they are zero-extended to
  # XLEN before adding to the base effective address. If the vector offset elements
  # are wider than XLEN, the least-significant XLEN bits are used in the address
  # calculation.
  - name: vector_ls_XLEN_dep
    coverpoint: ["Vls16_vloxei64_v_cg/cp_custom_ls_indexed_truncated"]

  # Vector unit-stride and constant-stride memory accesses do not guarantee ordering
  # between individual element accesses. The vector indexed load and store memory
  # operations have two forms, ordered and unordered. The indexed-ordered variants
  # preserve element ordering on memory accesses.
  - name: vector_ls_stride_ordered_op
    coverpoint: ["Vls16_vloxei16_v_cg/index_register_data_overlap"]

  # For unordered instructions (mop[1:0]!=11) there is no guarantee on element
  # access order. If the accesses are to a strongly ordered IO region, the element
  # accesses can be initiated in any order.
  - name: vector_ls_stride_unordered_op
    coverpoint:
      [
        "Untestable: memory-ordering guarantees are not observable from a single-hart self-checking signature",
      ]

  # The nf[2:0] field also encodes the number of whole vector registers to transfer
  # for the whole vector register load/store instructions.
  - name: vector_wholels_nf_op
    coverpoint:
      [
        "{Vls16_vl1re8_v_cg,Vls16_vl2re8_v_cg,Vls16_vl4re8_v_cg,Vls16_vl8re8_v_cg}/cp_asm_count",
      ]

  # Vector loads and stores have an EEW encoded directly in the instruction. The
  # corresponding EMUL is calculated as EMUL = (EEW/SEW)*LMUL.
  - name: vector_ls_EEW
    coverpoint:
      [
        "{Vls8_vle8_v_cg,Vls16_vle8_v_cg,Vls32_vle8_v_cg,Vls64_vle8_v_cg}/cp_asm_count",
      ]

  # Vector loads and stores have an EEW encoded directly in the instruction. The
  # corresponding EMUL is calculated as EMUL = (EEW/SEW)*LMUL.
  - name: vector_ls_EMUL
    coverpoint: ["Vls16_vl2re8_v_cg/cp_vd_emul2"]

  # The vector register groups must have legal register specifiers for the selected
  # EMUL, otherwise the instruction encoding is reserved.
  - name: vector_ls_EMUL_offgroup_rsv
    coverpoint: ["SsstrictV_vl8re8_v_cg/cp_ssstrictv_ls_wr_nreg8_vd_unaligned"]

  # Vector unit-stride and constant-stride use the EEW/EMUL encoded in the
  # instruction for the data values, while vector indexed loads and stores use the
  # EEW/EMUL encoded in the instruction for the index values and the SEW/LMUL
  # encoded in vtype for the data values.
  - name: vector_ls_indexed_EMUL
    coverpoint:
      ["Vls16_vloxei16_v_cg/cp_vd", "Vls16_vloxei16_v_cg/cp_vs2_edges_ls"]

  # Additional unit-stride mask load and store instructions are provided to transfer
  # mask values to/from memory. These operate similarly to unmasked byte loads or
  # stores (EEW=8), except that the effective vector length is evl=ceil(vl/8) (i.e.
  # EMUL=1), and the destination register is always written with a tail-agnostic
  # policy.
  - name: vector_ls_unit_stride_mask
    coverpoint: ["Vls16_vlm_v_cg/cp_custom_maskLS_emul_ge_16"]

  # Negative and zero strides are supported.
  - name: vector_ls_neg_stride
    coverpoint: ["Vls16_vlse8_v_cg/cp_rs2_edges_ls_e8"]

  # Negative and zero strides are supported.
  - name: vector_ls_zero_stride
    coverpoint: ["Vls16_vlse8_v_cg/cp_rs2_edges_ls_e8"]

  # Element accesses within a constant-stride instruction are unordered with respect
  # to each other.
  - name: vector_ls_constant_stride_unordered
    coverpoint:
      [
        "Untestable: memory-ordering guarantees are not observable from a single-hart self-checking signature",
      ]

  # When rs2=x0, then an implementation is allowed, but not required, to perform
  # fewer memory operations than the number of active elements, and may perform
  # different numbers of memory operations across different dynamic executions of
  # the same static instruction.
  - name: vector_ls_constant_stride_x0
    coverpoint: ["Vls16_vlse8_v_cg/cp_rs2_edges_ls_e8"]

  # The unit-stride fault-only-first load instructions are used to vectorize loops
  # with data-dependent exit conditions ("while" loops). These instructions execute
  # as a regular load except that they will only take a trap caused by a synchronous
  # exception on element 0.
  - name: vector_ff_trigger
    coverpoint: ["Vls16_vle8ff_v_cg/cp_custom_ffLS_fault_addr"]

  # Similarly, fault-only-first load instructions may update active destination
  # elements past the element that causes trimming of the vector length (but not
  # past the original vector length). The values of these spurious updates do not
  # have to correspond to the values in memory at the addressed memory locations.
  # Non-idempotent memory locations can only be accessed when it is known the
  # corresponding element load operation will not be restarted due to a trap or
  # vector-length trimming.
  - name: vector_ff_past_trap
    coverpoint:
      [
        "Untestable: implementation-defined spurious past-trap updates are not observable from a self-checking signature",
      ]

  # Even when an exception is not raised, implementations are permitted to process
  # fewer than vl elements and reduce vl accordingly, but if vstart=0 and vl&gt;0,
  # then at least one element must be processed.
  - name: vector_ff_no_exception
    coverpoint: ["Vls16_vle8ff_v_cg/cp_custom_ffLS_update_vl"]

  # When the fault-only-first instruction takes a trap due to an interrupt,
  # implementations should not reduce vl and should instead set a vstart value.
  - name: vector_ff_interrupt_behavior
    coverpoint: ["TODO: InterruptsV?"]

  # The three-bit nf field in the vector instruction encoding is an unsigned integer
  # that contains one less than the number of fields per segment, NFIELDS. Each
  # field will be held in successively numbered vector register groups. When
  # EMUL&gt;1, each field will occupy a vector register group held in multiple
  # successively numbered vector registers, and the vector register group for each
  # field must follow the usual vector register alignment constraints (e.g., when
  # EMUL=2 and NFIELDS=4, each field&#8217;s vector register group must start at an
  # even vector register, but does not have to start at a multiple of 8 vector
  # register number).
  - name: NFIELDS
    coverpoint:
      [
        "{Vls16_vlseg2e8_v_cg,Vls16_vlseg4e8_v_cg,Vls16_vlseg8e8_v_cg}/cp_asm_count",
      ]

  # If the vector register numbers accessed by the segment load or store would
  # increment past 31, then the instruction encoding is reserved.
  - name: vector_ls_seg_rsv
    coverpoint: ["SsstrictV_vlseg2e8_v_cg/cp_ssstrictv_ls_seg_vd_overflow"]

  # The vl register gives the number of segments to move, which is equal to the
  # number of elements transferred to each vector register group. Masking is also
  # applied at the level of whole segments.
  - name: vector_ls_seg_op
    coverpoint: ["Vls16_vlseg2e8_v_cg/cr_vl_lmul_e8_emul4max_sew16"]

  # For segment loads and stores, the individual memory accesses used to access
  # fields within each segment are unordered with respect to each other even for
  # ordered indexed segment loads and stores.
  - name: vector_ls_seg_unordered
    coverpoint:
      [
        "Untestable: memory-ordering guarantees are not observable from a single-hart self-checking signature",
      ]

  # If a trap occurs during access to a segment, it is implementation-defined
  # whether a subset of the faulting segment's accesses are performed before the
  # trap is taken.
  - name: vector_ls_seg_partial_access
    coverpoint:
      [
        "Untestable: implementation-defined partial-segment-access behavior is not observable from a self-checking signature",
      ]

  # The vector unit-stride load and store segment instructions move packed
  # contiguous segments into multiple destination vector register groups.
  - name: vector_ls_seg_unit_stride_op
    coverpoint: ["Vls16_vlseg2e8_v_cg/cp_vd_lte30"]

  # For fault-only-first segment loads, if an exception is detected partway through
  # accessing the zeroth segment, the trap is taken. If an exception is detected
  # partway through accessing a subsequent segment, vl is reduced to the index of
  # that segment.
  - name: vector_ls_seg_ff_unit_stride_op
    coverpoint:
      ["ExceptionsVls_vlseg2e8ff_v_cg/cp_exceptionsv_ffLS_first_elm_trap"]

  # In both cases, it is implementation-defined whether a subset of the segment is
  # loaded.
  - name: vector_ff_seg_partial_access
    coverpoint:
      [
        "Untestable: implementation-defined partial-segment-access behavior is not observable from a self-checking signature",
      ]

  # These instructions may overwrite destination vector register group elements past
  # the point at which a trap is reported or past the point at which vector length
  # is trimmed.
  - name: vector_ls_seg_ff_overload
    coverpoint:
      [
        "Untestable: implementation-defined spurious past-trap updates are not observable from a self-checking signature",
      ]

  # Vector constant-stride segment loads and stores move contiguous segments where
  # each segment is separated by the byte-stride offset given in the rs2 GPR
  # argument.
  - name: vector_ls_seg_constant_stride_op
    coverpoint: ["Vls16_vlsseg2e8_v_cg/cp_rs2"]

  # Accesses to the fields within each segment can occur in any order, including the
  # case where the byte stride is such that segments overlap in memory.
  - name: vector_ls_seg_constant_stride_unordered
    coverpoint:
      [
        "Untestable: memory-ordering guarantees are not observable from a single-hart self-checking signature",
      ]

  # Vector indexed segment loads and stores move contiguous segments where each
  # segment is located at an address given by adding the scalar base address in the
  # rs1 field to byte offsets in vector register vs2.
  - name: vector_ls_seg_indexed_op
    coverpoint: ["Vls16_vloxseg2ei8_v_cg/cp_vs2"]

  # The data vector register group has EEW=SEW, EMUL=LMUL, while the index vector
  # register group has EEW encoded in the instruction with EMUL=(EEW/SEW)*LMUL.
  - name: vector_ls_seg_indexed_EMUL_op
    coverpoint: ["Vls16_vloxseg2ei8_v_cg/cr_vl_lmul_e8_emul4max_sew16"]

  # The data vector register group has EEW=SEW, EMUL=LMUL, while the index vector
  # register group has EEW encoded in the instruction with EMUL=(EEW/SEW)*LMUL.
  - name: vector_ls_seg_indexed_EEW_op
    coverpoint: ["Vls16_vloxseg2ei8_v_cg/cr_vl_lmul_e8_emul4max_sew16"]

  # For vector indexed segment loads, the destination vector register groups cannot
  # overlap the source vector register group (specified by vs2), else the
  # instruction encoding is reserved.
  - name: vector_ls_seg_indexed_vreg_rsv
    coverpoint:
      ["SsstrictV_vloxseg2ei8_v_cg/cp_ssstrictv_ls_seg_idx_vd_vs2_overlap"]

  # NFIELDS indicates the number of vector registers to transfer, numbered
  # successively after the base.
  - name: vector_ls_seg_wholereg_op
    coverpoint:
      [
        "{Vls16_vl1re8_v_cg,Vls16_vl2re8_v_cg,Vls16_vl4re8_v_cg,Vls16_vl8re8_v_cg}/cp_asm_count",
      ]

  # Only NFIELDS values of 1, 2, 4, 8 are supported, with other values reserved.
  - name: vector_ls_seg_wholereg_nf_rsv
    coverpoint:
      [
        "{Vls16_vl1re8_v_cg,Vls16_vl2re8_v_cg,Vls16_vl4re8_v_cg,Vls16_vl8re8_v_cg}/cp_asm_count",
      ]

  # When multiple registers are transferred, the lowest-numbered vector register is
  # held in the lowest-numbered memory addresses and successive vector register
  # numbers are placed contiguously in memory.
  - name: vector_ls_seg_wholereg_op_cont
    coverpoint: ["Vls16_vl2re8_v_cg/cp_custom_vwholeRegLS_lmul"]

  # The instructions operate with an effective vector length, evl=NFIELDS*VLEN/EEW,
  # regardless of current settings in vtype and vl. The usual property that no
  # elements are written if vstart ≥ vl does not apply to these instructions.
  # Similarly, the property that the instructions are reserved if vstart exceeds the
  # largest element index for the current vtype setting does not apply. Instead, the
  # instructions are reserved if vstart ≥ evl.
  - name: vector_ls_seg_wholereg_evl
    coverpoint: ["Vls16_vl2re8_v_cg/cr_vl_lmul_lmul4max_sew16"]

  # Vector memory instructions appear to execute in program order on the local hart.
  - name: vector_ls_program_order
    coverpoint:
      [
        "Not Tested: RVWMO program-order guarantees would require a concurrent/multi-hart checking methodology this repo doesn't have yet",
      ]

  # Vector memory instructions follow RVWMO at the instruction level.
  - name: vector_ls_RVWMO
    coverpoint:
      [
        "Not Tested: RVWMO memory-ordering guarantees would require a concurrent/multi-hart checking methodology this repo doesn't have yet",
      ]

  # Except for vector indexed-ordered loads and stores, element operations are
  # unordered within the instruction.
  - name: vector_ls_indexed_ordered_ordered
    coverpoint:
      [
        "Untestable: memory-ordering guarantees are not observable from a single-hart self-checking signature",
      ]

  # Vector indexed-ordered loads and stores read and write elements from/to memory
  # in element order respectively, obeying RVWMO at the element level.
  - name: vector_ls_indexed_ordered_RVWMO
    coverpoint:
      [
        "Not Tested: RVWMO memory-ordering guarantees would require a concurrent/multi-hart checking methodology this repo doesn't have yet",
      ]

  # Instructions affected by the vector length register vl have a control dependency
  # on vl, rather than a data dependency.
  - name: vl_control_dependency
    coverpoint:
      [
        "Not Tested: control-dependency timing is not exercised by any suite yet",
      ]

  # Similarly, masked vector instructions have a control dependency on the source
  # mask register, rather than a data dependency.
  - name: vmask_control_dependency
    coverpoint:
      [
        "Not Tested: control-dependency timing is not exercised by any suite yet",
      ]

  # All vector floating-point operations use the dynamic rounding mode in the frm
  # register.
  - name: V_fp_frm
    coverpoint: ["Vf16_vfadd_vv_cg/cp_csr_frm_v"]

  # Use of the frm field when it contains an invalid rounding mode by any vector
  # floating-point instruction--even those that do not depend on the rounding mode,
  # or when vl=0, or when vstart {ge} vl--is reserved.
  - name: V_inv_frm_rsv
    coverpoint: ["Out-of-Scope: Ssstrict does not apply to CSR values"]

  # Vector-vector operations take two vectors of operands from vector register
  # groups specified by vs2 and vs1 respectively.
  - name: vop-vv_vreg_vs2_vs1
    coverpoint: ["Vx16_vadd_vv_cg/cr_vs2_vs1_edges"]

  # the vector register group operand is specified by vs2.
  - names: [vop-vx_vreg_vs2, vop-vi_vreg_vs2]
    coverpoint: ["{Vx16_vadd_vx_cg,Vx16_vadd_vi_cg}/cp_vs2"]

  # For integer operations, the scalar can be a 5-bit immediate, imm[4:0], encoded
  # in the rs1 field. The value is sign-extended to SEW bits, unless otherwise
  # specified.
  - name: vop-vi_imm_5bit
    coverpoint: ["Vx16_vadd_vi_cg/cp_imm_edges_5bit"]

  # For integer operations, the scalar can be taken from the scalar x register
  # specified by rs1.
  - name: vop-vx_xreg_rs1
    coverpoint: ["Vx16_vadd_vx_cg/cp_rs1"]

  # If XLEN&gt;SEW, the least-significant SEW bits of the x register are used,
  # unless otherwise specified.
  - name: vop-vx_rs1_trunc_lsb_sewbits
    coverpoint: ["Vx16_vadd_vx_cg/cp_rs1_edges"]

  # If XLEN&lt;SEW, the value from the x register is sign-extended to SEW bits.
  - name: vop-vx_rs1_sext_sewbits
    coverpoint: ["Vx64_vadd_vx_cg/cp_rs1_edges"]

  # For floating-point operations, the scalar can be taken from a scalar f register.
  - name: vfop_freg
    coverpoint: ["Vf16_vfadd_vf_cg/cp_fs1"]

  # If FLEN &gt; SEW, the value in the f registers is checked for a valid NaN-boxed
  # value, in which case the least-significant SEW bits of the f register are used,
  # else the canonical NaN value is used.
  - name: vfop_freg_NaNbox_lsb_sewbits
    coverpoint: ["TODO: Needs to be implemented in ACT4"]

  # Vector instructions where any floating-point vector operand's EEW is not a
  # supported floating-point type width (which includes when FLEN &lt; SEW) are
  # reserved.
  - name: V_fp_eew_rsv
    coverpoint: ["ExceptionsVf16_vfadd_vv_cg/cp_vill"]

  # When adding a vector extension to the Zfinx/Zdinx/Zhinx extensions,
  # floating-point scalar arguments are taken from the x registers. NaN-boxing is
  # not supported in these extensions, and so operands narrower than XLEN bits are
  # not checked for a NaN box; bits XLEN-1:EEW are ignored. For RV32_Zdinx, EEW=64
  # scalar arguments are supplied by an x-register pair.
  - name: V_Zfinx_fp_scalar
    coverpoint: ["TODO: Need to implement something like ZfinxV"]

  # Vector arithmetic instructions are masked under control of the vm field.
  - name: V_masked
    coverpoint: ["Vx16_vadd_vv_cg/cp_masking_edges"]

  # A few vector arithmetic instructions are defined to be widening operations where
  # the destination vector register group has EEW=2*SEW and EMUL=2*LMUL.
  - name: vwop_vd_eew_emul
    coverpoint: ["Vx16_vwaddu_vv_cg/cp_vd_emul2"]

  # A few instructions are provided to convert double-width source vectors into
  # single-width destination vectors. These instructions convert a vector register
  # group specified by vs2 with EEW/EMUL=2*SEW/2*LMUL to a vector register group
  # with the current SEW/LMUL setting.
  - names: [vnop_vd_eew_emul, vnop_vs2_eew_emul]
    coverpoint: ["Vx16_vnsrl_wv_cg/cp_vs2_emul2"]

  # Where there is a second source vector register group (specified by vs1), this
  # has the same (narrower) width as the result (i.e., EEW=SEW).
  - name: vnop_vs1_eew_emul
    coverpoint: ["Vx16_vnsrl_wv_cg/cp_vs1_edges"]

  # Vector integer add and subtract are provided.
  - names: [vadd_op, vsub_op]
    coverpoint: ["Vx16_vadd_vv_cg/cp_vd", "Vx16_vsub_vv_cg/cp_vd"]

  # Reverse-subtract instructions are also provided for the vector-scalar forms.
  - name: vrsub_op
    coverpoint: ["Vx16_vrsub_vx_cg/cp_vd"]

  # The widening add/subtract instructions are provided in both signed and unsigned
  # variants, depending on whether the narrower source operands are first sign- or
  # zero-extended before forming the double-width sum.
  - names: [vwaddu_op, vwadd_op, vwsubu_op, vwsub_op]
    coverpoint: ["Vx16_vwaddu_vv_cg/cp_vd_emul2"]

  # The vector integer extension instructions zero- or sign-extend a source vector
  # integer operand with EEW less than SEW to fill SEW-sized elements in the
  # destination.
  - names: [vsext_op, vzext_op]
    coverpoint: ["Vx16_vsext_vf2_cg/cp_vd"]

  # The EEW of the source is 1/2, 1/4, or 1/8 of SEW, while EMUL of the source is
  # (EEW/SEW)*LMUL.
  - names: [vsext_vs_eew_emul, vzext_vs_eew_emul]
    coverpoint: ["Vx16_vsext_vf2_cg/cp_vs2_edges_emulf2"]

  # The destination has EEW equal to SEW and EMUL equal to LMUL.
  - names: [vsext_vd_eew_emul, vzext_vd_eew_emul]
    coverpoint: ["Vx16_vsext_vf2_cg/cp_vd"]

  # If the source EEW is not a supported width, or source EMUL would be below the
  # minimum legal LMUL, the instruction encoding is reserved.
  - names: [vsext_ill_eew_emul_rsv, vzext_ill_eew_emul_rsv]
    coverpoint: ["ExceptionsVx_vsext_vf2_cg/cp_vill"]

  # The carry inputs and outputs are represented using the mask register layout as
  # described in &lt;&lt;sec-mask-register-layout&gt;&gt;. Due to encoding
  # constraints, the carry input must come from the implicit v0 register,
  - names: [vmadc_carry_v0, vmsbc_carry_v0, vadc_carry_v0, vsbc_carry_v0]
    coverpoint: ["Vx16_vadc_vvm_cg/cp_masking_edges"]

  # vadc and vsbc add or subtract the source operands and the carry-in or borrow-in,
  # and write the result to vector register vd.
  - names: [vadc_op, vsbc_op]
    coverpoint: ["Vx16_vadc_vvm_cg/cp_vd_nv0"]

  # These instructions are encoded as masked instructions (vm=0), but they operate
  # on and write back all body elements.
  - names: [vadc_masked_write_all_elem, vsbc_masked_write_all_elem]
    coverpoint: ["Vx16_vadc_vvm_cg/cp_masking_edges"]

  # Encodings corresponding to the unmasked versions (vm=1) are reserved.
  - names: [vadc_unmasked_rsv, vsbc_unmasked_rsv]
    coverpoint:
      [
        "{SsstrictV_vadc_vvm_cg,SsstrictV_vsbc_vvm_cg}/cp_ssstrictv_vadc_vsbc_vm1_reserved",
      ]

  # vmadc and vmsbc add or subtract the source operands, optionally add the carry-in
  # or subtract the borrow-in if masked (vm=0), and write the resulting carry-out or
  # borrow-out back to mask register vd. If unmasked (vm=1), there is no carry-in or
  # borrow-in.
  - name: vmadc_op
    coverpoint: ["Vx16_vmadc_vi_cg/cp_vd"]

  # vmadc and vmsbc add or subtract the source operands, optionally add the carry-in
  # or subtract the borrow-in if masked (vm=0), and write the resulting carry-out or
  # borrow-out back to mask register vd. If unmasked (vm=1), there is no carry-in or
  # borrow-in.
  - name: vmsbc_op
    coverpoint: ["Vx16_vmsbc_vvm_cg/cp_vd"]

  # These instructions operate on and write back all body elements, even if masked.
  - names: [vmadc_masked_write_all_elem, vmsbc_masked_write_all_elem]
    coverpoint: ["Vx16_vmadc_vim_cg/cp_masking_edges"]

  # Because these instructions produce a mask value, they always operate with a
  # tail-agnostic policy.
  - names: [vmadc_tail_agnostic, vmsbc_tail_agnostic]
    coverpoint: ["Vx16_vmadc_vim_cg/cr_vtype_agnostic"]

  # For vmsbc, the borrow is defined to be 1 iff the difference, prior to
  # truncation, is negative.
  - name: vmsbc_borrow_neg
    coverpoint: ["Vx16_vmsbc_vvm_cg/cp_vs2_edges"]

  # For vadc and vsbc, the instruction encoding is reserved if the destination
  # vector register is v0.
  - names: [vadc_vd_v0_rsv, vsbc_vd_v0_rsv]
    coverpoint: ["SsstrictV_vadc_vim_cg/cp_ssstrictv_masking_vd_eq_v0"]

  # # Bitwise logical operations. vand.vv vd, vs2, vs1, vm # Vector-vector vand.vx
  # vd, vs2, rs1, vm # vector-scalar vand.vi vd, vs2, imm, vm # vector-immediate
  # vor.vv vd, vs2, vs1, vm # Vector-vector vor.vx vd, vs2, rs1, vm # vector-scalar
  # vor.vi vd, vs2, imm, vm # vector-immediate vxor.vv vd, vs2, vs1, vm #
  # Vector-vector vxor.vx vd, vs2, rs1, vm # vector-scalar vxor.vi vd, vs2, imm, vm
  # # vector-immediate
  - names: [vand_op, vor_op, vxor_op]
    coverpoint: ["Vx16_vand_vv_cg/cp_vd"]

  # A full set of vector shift instructions are provided, including logical shift
  # left (sll), and logical (zero-extending srl) and arithmetic (sign-extending sra)
  # shift right. The data to be shifted is in the vector register group specified by
  # vs2 and the shift amount value can come from a vector register group vs1, a
  # scalar integer register rs1, or a zero-extended 5-bit immediate.
  - names: [vsll_op, vsrl_op, vsra_op]
    coverpoint: ["Vx16_vsll_vv_cg/cp_vd"]

  # Only the low lg2(SEW) bits of the shift-amount value are used to control the
  # shift amount.
  - names: [vsll_shamt, vsrl_shamt, vsra_shamt]
    coverpoint:
      [
        "Vx16_vsll_vv_cg/cp_custom_vshift_upperbits_vs1_ones",
        "Vx16_vsll_vx_cg/cp_custom_vshift_upperbits_rs1_ones",
      ]

  # The narrowing right shifts extract a smaller field from a wider operand and have
  # both zero-extending (srl) and sign-extending (sra) forms. The shift amount can
  # come from a vector register group, or a scalar x register, or a zero-extended
  # 5-bit immediate.
  - names: [vnsrl_op, vnsra_op]
    coverpoint:
      [
        "{Vx16_vnsrl_wv_cg,Vx16_vnsra_wv_cg}/cp_custom_vshiftn_upperbits_vs1_ones",
      ]

  # The low lg2(2*SEW) bits of the shift-amount value are used (e.g., the low 6 bits
  # for a SEW=64-bit to SEW=32-bit narrowing operation).
  - names: [vnsrl_shamt, vnsra_shamt]
    coverpoint: ["Vx16_vnsrl_wv_cg/cp_custom_vshiftn_upperbits_vs1_ones"]

  # The following integer compare instructions write 1 to the destination mask
  # register element if the comparison evaluates to true, and 0 otherwise. The
  # destination mask vector is always held in a single vector register, with a
  # layout of elements as described in &lt;&lt;sec-mask-register-layout&gt;&gt;.
  - names:
      [
        vmseq_op,
        vmsne_op,
        vmsltu_op,
        vmslt_op,
        vmsleu_op,
        vmsle_op,
        vmsgtu_op,
        vmsgt_op,
      ]
    coverpoint: ["Vx16_vmseq_vv_cg/cp_vd"]

  # The destination mask vector register may be the same as the source vector mask
  # register (v0).
  - names:
      [
        vmseq_vd_v0_legal,
        vmsne_vd_v0_legal,
        vmsltu_vd_v0_legal,
        vmslt_vd_v0_legal,
        vmsleu_vd_v0_legal,
        vmsle_vd_v0_legal,
        vmsgtu_vd_v0_legal,
        vmsgt_vd_v0_legal,
      ]
    coverpoint: ["Vx16_vmseq_vv_cg/cp_custom_vmask_write_v0_masked"]

  # Compares effectively AND in the mask under a mask-undisturbed policy if the
  # destination register is v0,
  - names:
      [
        vmseq_maskundisturbed,
        vmsne_maskundisturbed,
        vmsltu_maskundisturbed,
        vmslt_maskundisturbed,
        vmsleu_maskundisturbed,
        vmsle_maskundisturbed,
        vmsgtu_maskundisturbed,
        vmsgt_maskundisturbed,
      ]
    coverpoint: ["Vx16_vmseq_vv_cg/cp_custom_vmask_write_v0_masked"]

  # Compares write mask registers, and so always operate under a tail-agnostic
  # policy.
  - names:
      [
        vmseq_tail_agnostic,
        vmsne_tail_agnostic,
        vmsltu_tail_agnostic,
        vmslt_tail_agnostic,
        vmsleu_tail_agnostic,
        vmsle_tail_agnostic,
        vmsgtu_tail_agnostic,
        vmsgt_tail_agnostic,
      ]
    coverpoint: ["Vx16_vmseq_vv_cg/cr_vtype_agnostic"]

  # Signed and unsigned integer minimum and maximum instructions are supported.
  - names: [vminu_op, vmin_op, vmaxu_op, vmax_op]
    coverpoint: ["Vx16_vmin_vv_cg/cp_vd"]

  # The single-width multiply instructions perform a SEW-bit*SEW-bit multiply to
  # generate a 2*SEW-bit product, then return one half of the product in the
  # SEW-bit-wide destination. The mul versions write the low word of the product to
  # the destination register, while the mulh versions write the high word of the
  # product to the destination register.
  - names: [vmul_op, vmulh_op, vmulhu_op, vmulhsu_op]
    coverpoint: ["Vx16_vmul_vv_cg/cp_vd"]

  # The divide and remainder instructions are equivalent to the RISC-V standard
  # scalar integer multiply/divides, with the same results for extreme inputs.
  - names: [vdivu_op, vdiv_op, vremu_op, vrem_op]
    coverpoint: ["Vx16_vdiv_vv_cg/cp_vd"]

  # The widening integer multiply instructions return the full 2*SEW-bit product
  # from an SEW-bit*SEW-bit multiply.
  - names: [vwmul_op, vwmulu_op, vwmulsu_op]
    coverpoint: ["Vx16_vwmul_vv_cg/cp_vd_emul2"]

  # The integer multiply-add instructions are destructive and are provided in two
  # forms, one that overwrites the addend or minuend (vmacc, vnmsac) and one that
  # overwrites the first multiplicand (vmadd, vnmsub). The low half of the product
  # is added or subtracted from the third operand.
  - name: vmacc_op
    coverpoint: ["Vx16_vmacc_vv_cg/cp_vd"]

  # The integer multiply-add instructions are destructive and are provided in two
  # forms, one that overwrites the addend or minuend (vmacc, vnmsac) and one that
  # overwrites the first multiplicand (vmadd, vnmsub). The low half of the product
  # is added or subtracted from the third operand.
  - name: vnmsac_op
    coverpoint: ["Vx16_vnmsac_vv_cg/cp_vd"]

  # The integer multiply-add instructions are destructive and are provided in two
  # forms, one that overwrites the addend or minuend (vmacc, vnmsac) and one that
  # overwrites the first multiplicand (vmadd, vnmsub). The low half of the product
  # is added or subtracted from the third operand.
  - name: vmadd_op
    coverpoint: ["Vx16_vmadd_vv_cg/cp_vd"]

  # The integer multiply-add instructions are destructive and are provided in two
  # forms, one that overwrites the addend or minuend (vmacc, vnmsac) and one that
  # overwrites the first multiplicand (vmadd, vnmsub). The low half of the product
  # is added or subtracted from the third operand.
  - name: vnmsub_op
    coverpoint: ["Vx16_vnmsub_vv_cg/cp_vd"]

  # The widening integer multiply-add instructions add the full 2*SEW-bit product
  # from a SEW-bit*SEW-bit multiply to a 2*SEW-bit value and produce a 2*SEW-bit
  # result.
  - names: [vwmaccu_op, vwmacc_op, vwmaccsu_op, vwmaccus_op]
    coverpoint: ["Vx16_vwmaccu_vv_cg/cp_vd_emul2"]

  # The vector integer merge instructions combine two source operands based on a
  # mask. The vmerge instructions are encoded as masked instructions (vm=0). The
  # instructions combine two sources as follows. At elements where the mask value is
  # zero, the first operand is copied to the destination element, otherwise the
  # second operand is copied to the destination element. The first operand is always
  # a vector register group specified by vs2. The second operand is a vector
  # register group specified by vs1 or a scalar x register specified by rs1 or a
  # 5-bit sign-extended immediate.
  - name: vmerge_op
    coverpoint: ["Vx16_vmerge_vvm_cg/cp_vd_nv0"]

  # Unlike regular arithmetic instructions, the merge operates on all body elements
  # (i.e., the set of elements from vstart up to the current vector length in vl).
  - name: vmerge_all_elem
    coverpoint: ["Vx16_vmerge_vvm_cg/cp_masking_edges"]

  # The vector integer move instructions copy a source operand to a vector register
  # group. The vmv.v.v variant copies a vector register group, whereas the vmv.v.x
  # and vmv.v.i variants splat a scalar register or immediate to all active elements
  # of the destination vector register group.
  - name: vmv_op
    coverpoint: ["{Vx16_vmv_v_v_cg,Vx16_vmv_v_x_cg,Vx16_vmv_v_i_cg}/cp_vd"]

  # The first operand specifier (vs2) must contain v0, and any other vector register
  # number in vs2 is reserved.
  - name: vmv_vs2_nv0_rsv
    coverpoint:
      [
        "SsstrictV_vmv_v_v_cg/cp_ssstrictv_vmv_vs2_not_v0_reserved",
        "SsstrictV_vmv_v_x_cg/cp_ssstrictv_vmv_vs2_not_v0_reserved",
        "SsstrictV_vmv_v_i_cg/cp_ssstrictv_vmv_vs2_not_v0_reserved",
      ]

  # Saturating forms of integer add and subtract are provided, for both signed and
  # unsigned integers. If the result would overflow the destination, the result is
  # replaced with the closest representable value, and the vxsat bit is set.
  - name: vsaddu_op
    coverpoint: ["Vx16_vsaddu_vv_cg/cp_csr_vxsat"]

  # Saturating forms of integer add and subtract are provided, for both signed and
  # unsigned integers. If the result would overflow the destination, the result is
  # replaced with the closest representable value, and the vxsat bit is set.
  - name: vsadd_op
    coverpoint: ["Vx16_vsadd_vv_cg/cp_csr_vxsat"]

  # Saturating forms of integer add and subtract are provided, for both signed and
  # unsigned integers. If the result would overflow the destination, the result is
  # replaced with the closest representable value, and the vxsat bit is set.
  - name: vssubu_op
    coverpoint: ["Vx16_vssubu_vv_cg/cp_csr_vxsat"]

  # Saturating forms of integer add and subtract are provided, for both signed and
  # unsigned integers. If the result would overflow the destination, the result is
  # replaced with the closest representable value, and the vxsat bit is set.
  - name: vssub_op
    coverpoint: ["Vx16_vssub_vv_cg/cp_csr_vxsat"]

  # If the result would overflow the destination, the result is replaced with the
  # closest representable value, and the vxsat bit is set.
  - name: vxsat_op_vsaddsub
    coverpoint: ["Vx16_vsaddu_vv_cg/cp_csr_vxsat"]

  # The averaging add and subtract instructions right shift the result by one bit
  # and round off the result according to the setting in vxrm. Computation is
  # performed in infinite precision before rounding and truncating. For vasub and
  # vasubu, overflow is ignored and the result wraps around.
  - name: vaaddu_op
    coverpoint: ["Vx16_vaadd_vv_cg/cr_vxrm_vs2_vs1_edges"]

  # The averaging add and subtract instructions right shift the result by one bit
  # and round off the result according to the setting in vxrm. Computation is
  # performed in infinite precision before rounding and truncating. For vasub and
  # vasubu, overflow is ignored and the result wraps around.
  - name: vaadd_op
    coverpoint: ["Vx16_vaadd_vv_cg/cr_vxrm_vs2_vs1_edges"]

  # The averaging add and subtract instructions right shift the result by one bit
  # and round off the result according to the setting in vxrm. Computation is
  # performed in infinite precision before rounding and truncating. For vasub and
  # vasubu, overflow is ignored and the result wraps around.
  - name: vasubu_op
    coverpoint: ["Vx16_vasubu_vv_cg/cr_vxrm_vs2_vs1_edges"]

  # The averaging add and subtract instructions right shift the result by one bit
  # and round off the result according to the setting in vxrm. Computation is
  # performed in infinite precision before rounding and truncating. For vasub and
  # vasubu, overflow is ignored and the result wraps around.
  - name: vasub_op
    coverpoint: ["Vx16_vasub_vv_cg/cr_vxrm_vs2_vs1_edges"]

  # The signed fractional multiply instruction produces a 2*SEW product of the two
  # SEW inputs, then shifts the result right by SEW-1 bits, rounding these bits
  # according to vxrm, then saturates the result to fit into SEW bits. If the result
  # causes saturation, the vxsat bit is set.
  - name: vsmul_op
    coverpoint: ["Vx16_vsmul_vv_cg/cp_csr_vxrm"]

  # If the result causes saturation, the vxsat bit is set.
  - name: vxsat_op_vsmul
    coverpoint: ["Vx16_vsmul_vv_cg/cp_csr_vxsat"]

  # These instructions shift the input value right, and round off the shifted out
  # bits according to vxrm. The scaling right shifts have both zero-extending
  # (vssrl) and sign-extending (vssra) forms. The data to be shifted is in the
  # vector register group specified by vs2 and the shift amount value can come from
  # a vector register group vs1, a scalar integer register rs1, or a zero-extended
  # 5-bit immediate.
  - names: [vssrl_op, vssra_op]
    coverpoint: ["Vx16_vssrl_vv_cg/cp_csr_vxrm"]

  # Only the low lg2(SEW) bits of the shift-amount value are used to control the
  # shift amount.
  - names: [vssrl_shamt, vssra_shamt]
    coverpoint: ["Vx16_vssrl_vv_cg/cp_custom_vshift_upperbits_vs1_ones"]

  # The vnclip instructions are used to pack a fixed-point value into a narrower
  # destination. The instructions support rounding, scaling, and saturation into the
  # final destination format. The source data is in the vector register group
  # specified by vs2. The scaling shift amount value can come from a vector register
  # group vs1, a scalar integer register rs1, or a zero-extended 5-bit immediate.
  - names: [vnclipu_op, vnclip_op]
    coverpoint: ["Vx16_vnclipu_wv_cg/cp_vd"]

  # The low lg2(2*SEW) bits of the vector or scalar shift-amount value (e.g., the
  # low 6 bits for a SEW=64-bit to SEW=32-bit narrowing operation) are used to
  # control the right shift amount, which provides the scaling.
  - names: [vnclipu_shamt, vnclip_shamt]
    coverpoint: ["Vx16_vnclipu_wv_cg/cp_custom_vshiftn_upperbits_vs1_ones"]

  # For vnclipu, the shifted rounded source value is treated as an unsigned integer
  # and saturates if the result would overflow the destination viewed as an unsigned
  # integer.
  - name: vnclipu_overflow
    coverpoint: ["Vx16_vnclipu_wv_cg/cp_vs2_edges_emul2"]

  # For vnclip, the shifted rounded source value is treated as a signed integer and
  # saturates if the result would overflow the destination viewed as a signed
  # integer.
  - name: vnclip_overflow
    coverpoint: ["Vx16_vnclip_wv_cg/cp_vs2_edges_emul2"]

  # If any destination element is saturated, the vxsat bit is set in the vxsat
  # register.
  - name: vxsat_op_vnclip_u
    coverpoint: ["TODO: add cp_csr_vxsat to vnclip"]

  # If the floating-point unit status field mstatus.FS is Off then any attempt to
  # execute a vector floating-point instruction will raise an illegal-instruction
  # exception.
  - name: mstatus_FS_off_V_fp_ill
    coverpoint: ["ExceptionsVf16_vfadd_vv_cg/cp_mstatus_fs_off"]

  # Any vector floating-point instruction that modifies any floating-point extension
  # state (i.e., floating-point CSRs or f registers) must set mstatus.FS to Dirty.
  - name: mstatus_FS_dirty_V_fp
    coverpoint: ["SmVF_cg/cp_vectorfp_mstatus_fs_state_affecting_register"]

  # If the hypervisor extension is implemented and V=1, the vsstatus.FS field is
  # additionally in effect for vector floating-point instructions. If vsstatus.FS or
  # mstatus.FS is Off then any attempt to execute a vector floating-point
  # instruction will raise an illegal-instruction exception.
  - names:
      [vsstatus_FS_off_hypervisor_V_fp_ill, mstatus_FS_off_hypervisor_V_fp_ill]
    coverpoint:
      [
        "TODO: ExceptionsHV_cg only has mstatus.VS/vsstatus.VS coverpoints (cp_mstatus_vs_off, cp_vsstatus_vs_off), nothing for FS under the hypervisor extension",
      ]

  # Any vector floating-point instruction that modifies any floating-point extension
  # state (i.e., floating-point CSRs or f registers) must set both mstatus.FS and
  # vsstatus.FS to Dirty.
  - names: [vsstatus_FS_dirty_hypervisor_V_fp, mstatus_FS_dirty_hypervisor_V_fp]
    coverpoint:
      [
        "TODO: no coverpoint samples vsstatus.FS/mstatus.FS dirtying under the hypervisor extension; SmVF_cg is M-mode only and ExceptionsHV_cg has no FS coverpoints",
      ]

  # A vector floating-point exception at any active floating-point element sets the
  # standard FP exception flags in the fflags register. Inactive elements do not set
  # FP exception flags.
  - name: fflags_op_V_fp
    coverpoint:
      [
        "Vf16_vfadd_vv_cg/cp_csr_fflags_vdoun_set",
        "Vf16_vfrsqrt7_v_cg/cp_custom_vfp_flags_inactive_not_set",
      ]

  # # Floating-point add vfadd.vv vd, vs2, vs1, vm # Vector-vector vfadd.vf vd, vs2,
  # rs1, vm # vector-scalar # Floating-point subtract vfsub.vv vd, vs2, vs1, vm #
  # Vector-vector vfsub.vf vd, vs2, rs1, vm # Vector-scalar vd[i] = vs2[i] - f[rs1]
  # vfrsub.vf vd, vs2, rs1, vm # Scalar-vector vd[i] = f[rs1] - vs2[i]
  - names: [vfadd_op, vfsub_op, vfrsub_op]
    coverpoint: ["Vf16_vfadd_vv_cg/cp_vd"]

  # # Widening FP add/subtract, 2*SEW = SEW +/- SEW vfwadd.vv vd, vs2, vs1, vm #
  # vector-vector vfwadd.vf vd, vs2, rs1, vm # vector-scalar vfwsub.vv vd, vs2, vs1,
  # vm # vector-vector vfwsub.vf vd, vs2, rs1, vm # vector-scalar # Widening FP
  # add/subtract, 2*SEW = 2*SEW +/- SEW vfwadd.wv vd, vs2, vs1, vm # vector-vector
  # vfwadd.wf vd, vs2, rs1, vm # vector-scalar vfwsub.wv vd, vs2, vs1, vm #
  # vector-vector vfwsub.wf vd, vs2, rs1, vm # vector-scalar
  - name: vfwadd_op
    coverpoint: ["Vf16_vfwadd_vv_cg/cp_vd_emul2"]

  # # Floating-point multiply vfmul.vv vd, vs2, vs1, vm # Vector-vector vfmul.vf vd,
  # vs2, rs1, vm # vector-scalar # Floating-point divide vfdiv.vv vd, vs2, vs1, vm #
  # Vector-vector vfdiv.vf vd, vs2, rs1, vm # vector-scalar # Reverse floating-point
  # divide vector = scalar / vector vfrdiv.vf vd, vs2, rs1, vm # scalar-vector,
  # vd[i] = f[rs1]/vs2[i]
  - names: [vfmul_op, vfdiv_op, vfrdiv_op]
    coverpoint: ["Vf16_vfmul_vv_cg/cp_vd", "Vf16_vfdiv_vv_cg/cp_vd"]

  # # Widening floating-point multiply vfwmul.vv vd, vs2, vs1, vm # vector-vector
  # vfwmul.vf vd, vs2, rs1, vm # vector-scalar
  - name: vfwmul_op
    coverpoint: ["Vf16_vfwmul_vv_cg/cp_vd_emul2"]

  # All four varieties of fused multiply-add are provided, and in two destructive
  # forms that overwrite one of the operands, either the addend or the first
  # multiplicand.
  - names:
      [
        vfmacc_op,
        vfnmacc_op,
        vfmsac_op,
        vfnmsac_op,
        vfmadd_op,
        vfnmadd_op,
        vfmsub_op,
        vfnmsub_op,
      ]
    coverpoint: ["Vf16_vfmacc_vv_cg/cp_vd", "Vf16_vfmadd_vv_cg/cp_vd"]

  # The widening floating-point fused multiply-add instructions all overwrite the
  # wide addend with the result. The multiplier inputs are all SEW wide, while the
  # addend and destination is 2*SEW bits wide.
  - names: [vfwmacc_op, vfwnmacc_op, vfwmsac_op, vfwnmsac_op]
    coverpoint: ["Vf16_vfwmacc_vv_cg/cp_vd_emul2"]

  # # Floating-point square root vfsqrt.v vd, vs2, vm # Vector-vector square root
  - name: vfsqrt_op
    coverpoint: ["Vf16_vfsqrt_v_cg/cp_vd"]

  # This is a unary vector-vector instruction that returns an estimate of 1/sqrt(x)
  # accurate to 7 bits. For the non-exceptional cases, the low bit of the exponent
  # and the six high bits of significand (after the leading one) are concatenated
  # and used to address the following table. The output of the table becomes the
  # seven high bits of the result significand (after the leading one); the remainder
  # of the result significand is zero. Subnormal inputs are normalized and the
  # exponent adjusted appropriately before the lookup. The output exponent is chosen
  # to make the result approximate the reciprocal of the square root of the
  # argument. More precisely, the result is computed as follows. Let the normalized
  # input exponent be equal to the input exponent if the input is normal, or 0 minus
  # the number of leading zeros in the significand otherwise. If the input is
  # subnormal, the normalized input significand is given by shifting the input
  # significand left by 1 minus the normalized input exponent, discarding the
  # leading 1 bit. The output exponent equals floor((3*B - 1 - the normalized input
  # exponent) / 2), where B is the exponent bias. The output sign equals the input
  # sign.
  - name: vfrsqrt7_op
    coverpoint: ["Vf16_vfrsqrt7_v_cg/cp_custom_FpRecSqrtEst_edges"]

  # This is a unary vector-vector instruction that returns an estimate of 1/x
  # accurate to 7 bits. For the non-exceptional cases, the seven high bits of
  # significand (after the leading one) are used to address the following table. The
  # output of the table becomes the seven high bits of the result significand (after
  # the leading one); the remainder of the result significand is zero. Subnormal
  # inputs are normalized and the exponent adjusted appropriately before the lookup.
  # The output exponent is chosen to make the result approximate the reciprocal of
  # the argument, and subnormal outputs are denormalized accordingly. More
  # precisely, the result is computed as follows. Let the normalized input exponent
  # be equal to the input exponent if the input is normal, or 0 minus the number of
  # leading zeros in the significand otherwise. The normalized output exponent
  # equals (2*B - 1 - the normalized input exponent). If the normalized output
  # exponent is outside the range [-1, 2*B], the result corresponds to one of the
  # exceptional cases in the table above. If the input is subnormal, the normalized
  # input significand is given by shifting the input significand left by 1 minus the
  # normalized input exponent, discarding the leading 1 bit. Otherwise, the
  # normalized input significand equals the input significand. The following table
  # gives the seven MSBs of the normalized output significand as a function of the
  # seven MSBs of the normalized input significand; the other bits of the normalized
  # output significand are zero. If the normalized output exponent is 0 or -1, the
  # result is subnormal: the output exponent is 0, and the output significand is
  # given by concatenating a 1 bit to the left of the normalized output significand,
  # then shifting that quantity right by 1 minus the normalized output exponent.
  # Otherwise, the output exponent equals the normalized output exponent, and the
  # output significand equals the normalized output significand. The output sign
  # equals the input sign.
  - name: vfrec7_op
    coverpoint: ["Vf16_vfrec7_v_cg/cp_custom_FpRecipEst_edges"]

  # The vector floating-point vfmin and vfmax instructions have the same behavior as
  # the corresponding scalar floating-point instructions in version 2.2 of the
  # RISC-V F/D/Q extension: they perform the minimumNumber or maximumNumber
  # operation on active elements.
  - names: [vfmin_op, vfmax_op]
    coverpoint: ["Vf16_vfmax_vv_cg/cp_vd"]

  # Vector versions of the scalar sign-injection instructions. The result takes all
  # bits except the sign bit from the vector vs2 operands.
  - names: [vfsgnj_op, vfsgnjn_op, vfsgnjx_op]
    coverpoint: ["Vf16_vfsgnj_vv_cg/cp_vd"]

  # These vector FP compare instructions compare two source operands and write the
  # comparison result to a mask register.
  - names: [vmfeq_op, vmfne_op, vmflt_op, vmfle_op, vmfgt_op, vmfge_op]
    coverpoint: ["Vf16_vmfeq_vv_cg/cp_vd"]

  # The destination mask vector is always held in a single vector register, with a
  # layout of elements as described in &lt;&lt;sec-mask-register-layout&gt;&gt;.
  - names:
      [
        vmfeq_vd_single_vreg,
        vmfne_vd_single_vreg,
        vmflt_vd_single_vreg,
        vmfle_vd_single_vreg,
        vmfgt_vd_single_vreg,
        vmfge_vd_single_vreg,
      ]
    coverpoint:
      ["TODO: These need something like cp_custom_vmask_write_lmulge1"]

  # Compares write mask registers, and so always operate under a tail-agnostic
  # policy.
  - names:
      [
        vmfeq_tail_agnostic,
        vmfne_tail_agnostic,
        vmflt_tail_agnostic,
        vmfle_tail_agnostic,
        vmfgt_tail_agnostic,
        vmfge_tail_agnostic,
      ]
    coverpoint: ["Vf16_vmfeq_vv_cg/cr_vtype_agnostic"]

  # vmfeq and vmfne raise the invalid operation exception only on signaling NaN
  # inputs.
  - names: [vmfeq_sNaN_invalid, vmfne_sNaN_invalid]
    coverpoint: ["Vf16_vmfeq_vv_cg/cp_custom_vfp_NaN_input"]

  # This is a unary vector-vector instruction that operates in the same way as the
  # scalar classify instruction. The 10-bit mask produced by this instruction is
  # placed in the least-significant bits of the result elements. The upper (SEW-10)
  # bits of the result are filled with zeros.
  - name: vfclass_op
    coverpoint: ["Vf16_vfclass_v_cg/cp_custom_vfclass_onehot"]

  # The instruction is only defined for SEW=16b and above, so the result will always
  # fit in the destination elements.
  - name: vfclass_SEWge16
    coverpoint: ["Vf16_vfclass_v_cg/cp_vd"]

  # A vector-scalar floating-point merge instruction is provided, At elements where
  # the mask value is zero, the first vector operand is copied to the destination
  # element, otherwise a scalar floating-point register value is copied to the
  # destination element.
  - name: vfmerge_op
    coverpoint: ["Vf16_vfmerge_vfm_cg/cp_masking_edges"]

  # operates on all body elements from vstart up to the current vector length in vl
  # regardless of mask value.
  - name: vfmerge_all_elem
    coverpoint: ["Vf16_vfmerge_vfm_cg/cp_masking_edges"]

  # The vector floating-point move instruction splats a floating-point scalar
  # operand to a vector register group. The instruction copies a scalar f register
  # value to all active elements of a vector register group.
  - name: vfmv_op
    coverpoint: ["Vf16_vfmv_v_f_cg/cp_vd"]

  # Conversion operations are provided to convert to and from floating-point values
  # and unsigned and signed integers, where both source and destination are SEW
  # wide. The conversions follow the same rules on exceptional conditions as the
  # scalar conversion instructions. The conversions use the dynamic rounding mode in
  # frm, except for the rtz variants, which round towards zero.
  - name: vfcvt_op
    coverpoint: ["Vf16_vfcvt_x_f_v_cg/cp_vd"]

  # A set of conversion instructions is provided to convert between narrower integer
  # and floating-point datatypes to a type of twice the width.
  - name: vfwcvt_op
    coverpoint: ["Vf16_vfwcvt_x_f_v_cg/cp_vd_emul2"]

  # These instructions have the same constraints on vector register overlap as other
  # widening instructions (see &lt;&lt;sec-widening&gt;&gt;).
  - name: vfwcvt_vreg_constr
    coverpoint: ["Vf16_vfwadd_vv_cg/cp_custom_allVdOverlapTopVs2_vd_vs2_lmul1"]

  # A set of conversion instructions is provided to convert wider integer and
  # floating-point datatypes to a type of half the width.
  - name: vfncvt_op
    coverpoint: ["Vf16_vfncvt_x_f_w_cg/cp_vd"]

  # These instructions have the same constraints on vector register overlap as other
  # narrowing instructions (see &lt;&lt;sec-narrowing&gt;&gt;).
  - name: vfncvt_vreg_constr
    coverpoint:
      ["SsstrictV_vfncvt_x_f_w_cg/cp_ssstrictv_vnarrow_overlapping_vd_vs2"]

  # Vector reduction operations take a vector register group of elements and a
  # scalar held in element 0 of a vector register, and perform a reduction using
  # some binary operator, to produce a scalar result in element 0 of a vector
  # register. The scalar input and output operands are held in element 0 of a single
  # vector register, not a vector register group, so any vector register can be the
  # scalar source or destination of a vector reduction regardless of LMUL setting.
  # Inactive elements from the source vector register group are excluded from the
  # reduction, but the scalar operand is always included regardless of the mask
  # values.
  - name: vreduction_scalar
    coverpoint:
      [
        "Vx16_vredsum_vs_cg/cp_custom_voffgroup_vs1_lmul2",
        "Vx16_vredsum_vs_cg/cp_custom_element0Masked",
      ]

  # The destination vector register can overlap the source operands, including the
  # mask register.
  - name: vreduction_vd_overlap_vs
    coverpoint: ["Vx16_vredsum_vs_cg/cmp_vd_vs2"]

  # The other elements in the destination vector register ( 0 &lt; index &lt;
  # VLEN/SEW) are considered the tail and are managed with the current tail
  # agnostic/undisturbed policy.
  - name: vreduction_tail_agnostic
    coverpoint: ["Vx16_vredsum_vs_cg/cr_vtype_agnostic"]

  # If vl=0, no operation is performed and the destination register is not updated.
  - name: vreduction_vl_0
    coverpoint: ["Vx16_vredsum_vs_cg/cp_vl_0"]

  # Traps on vector reduction instructions are always reported with a vstart of 0.
  - name: vreduction_trap
    coverpoint:
      [
        "TODO: no coverpoint checks that vstart is reported as 0 after a trap on vector reduction; cp_vstart only checks that a non-zero vstart raises an illegal-instruction exception",
      ]

  # Vector reduction operations raise an illegal-instruction exception if vstart is
  # non-zero.
  - name: vreduction_vstart_n0_ill
    coverpoint:
      [
        "ExceptionsVx_vredsum_vs_cg/cp_vstart",
        "ExceptionsVx_vwredsum_vs_cg/cp_vstart",
        "ExceptionsVf32_vfredosum_vs_cg/cp_vstart",
        "ExceptionsVf32_vfwredosum_vs_cg/cp_vstart",
      ]

  # All operands and results of single-width reduction instructions have the same
  # SEW width.
  - name: vredsum_op
    coverpoint:
      [
        "Vx8_vredsum_vs_cg/cp_vd",
        "Vx16_vredsum_vs_cg/cp_vd",
        "Vx32_vredsum_vs_cg/cp_vd",
        "Vx64_vredsum_vs_cg/cp_vd",
      ]

  - name: vredmaxu_op
    coverpoint:
      [
        "Vx8_vredmaxu_vs_cg/cp_vd",
        "Vx16_vredmaxu_vs_cg/cp_vd",
        "Vx32_vredmaxu_vs_cg/cp_vd",
        "Vx64_vredmaxu_vs_cg/cp_vd",
      ]

  - name: vredmax_op
    coverpoint:
      [
        "Vx8_vredmax_vs_cg/cp_vd",
        "Vx16_vredmax_vs_cg/cp_vd",
        "Vx32_vredmax_vs_cg/cp_vd",
        "Vx64_vredmax_vs_cg/cp_vd",
      ]

  - name: vredminu_op
    coverpoint:
      [
        "Vx8_vredminu_vs_cg/cp_vd",
        "Vx16_vredminu_vs_cg/cp_vd",
        "Vx32_vredminu_vs_cg/cp_vd",
        "Vx64_vredminu_vs_cg/cp_vd",
      ]

  - name: vredmin_op
    coverpoint:
      [
        "Vx8_vredmin_vs_cg/cp_vd",
        "Vx16_vredmin_vs_cg/cp_vd",
        "Vx32_vredmin_vs_cg/cp_vd",
        "Vx64_vredmin_vs_cg/cp_vd",
      ]

  - name: vredand_op
    coverpoint:
      [
        "Vx8_vredand_vs_cg/cp_vd",
        "Vx16_vredand_vs_cg/cp_vd",
        "Vx32_vredand_vs_cg/cp_vd",
        "Vx64_vredand_vs_cg/cp_vd",
      ]

  - name: vredor_op
    coverpoint:
      [
        "Vx8_vredor_vs_cg/cp_vd",
        "Vx16_vredor_vs_cg/cp_vd",
        "Vx32_vredor_vs_cg/cp_vd",
        "Vx64_vredor_vs_cg/cp_vd",
      ]

  - name: vredxor_op
    coverpoint:
      [
        "Vx8_vredxor_vs_cg/cp_vd",
        "Vx16_vredxor_vs_cg/cp_vd",
        "Vx32_vredxor_vs_cg/cp_vd",
        "Vx64_vredxor_vs_cg/cp_vd",
      ]

  # Overflows wrap around on arithmetic sums.
  - name: vredsum_overflow
    coverpoint:
      [
        "Vx8_vredsum_vs_cg/cr_vs2_vs1_edges",
        "Vx16_vredsum_vs_cg/cr_vs2_vs1_edges",
        "Vx32_vredsum_vs_cg/cr_vs2_vs1_edges",
        "Vx64_vredsum_vs_cg/cr_vs2_vs1_edges",
      ]

  - name: vredmaxu_overflow
    coverpoint:
      [
        "Vx8_vredmaxu_vs_cg/cr_vs2_vs1_edges",
        "Vx16_vredmaxu_vs_cg/cr_vs2_vs1_edges",
        "Vx32_vredmaxu_vs_cg/cr_vs2_vs1_edges",
        "Vx64_vredmaxu_vs_cg/cr_vs2_vs1_edges",
      ]

  - name: vredmax_overflow
    coverpoint:
      [
        "Vx8_vredmax_vs_cg/cr_vs2_vs1_edges",
        "Vx16_vredmax_vs_cg/cr_vs2_vs1_edges",
        "Vx32_vredmax_vs_cg/cr_vs2_vs1_edges",
        "Vx64_vredmax_vs_cg/cr_vs2_vs1_edges",
      ]

  - name: vredminu_overflow
    coverpoint:
      [
        "Vx8_vredminu_vs_cg/cr_vs2_vs1_edges",
        "Vx16_vredminu_vs_cg/cr_vs2_vs1_edges",
        "Vx32_vredminu_vs_cg/cr_vs2_vs1_edges",
        "Vx64_vredminu_vs_cg/cr_vs2_vs1_edges",
      ]

  - name: vredmin_overflow
    coverpoint:
      [
        "Vx8_vredmin_vs_cg/cr_vs2_vs1_edges",
        "Vx16_vredmin_vs_cg/cr_vs2_vs1_edges",
        "Vx32_vredmin_vs_cg/cr_vs2_vs1_edges",
        "Vx64_vredmin_vs_cg/cr_vs2_vs1_edges",
      ]

  - name: vredand_overflow
    coverpoint:
      [
        "Vx8_vredand_vs_cg/cr_vs2_vs1_edges",
        "Vx16_vredand_vs_cg/cr_vs2_vs1_edges",
        "Vx32_vredand_vs_cg/cr_vs2_vs1_edges",
        "Vx64_vredand_vs_cg/cr_vs2_vs1_edges",
      ]

  - name: vredor_overflow
    coverpoint:
      [
        "Vx8_vredor_vs_cg/cr_vs2_vs1_edges",
        "Vx16_vredor_vs_cg/cr_vs2_vs1_edges",
        "Vx32_vredor_vs_cg/cr_vs2_vs1_edges",
        "Vx64_vredor_vs_cg/cr_vs2_vs1_edges",
      ]

  - name: vredxor_overflow
    coverpoint:
      [
        "Vx8_vredxor_vs_cg/cr_vs2_vs1_edges",
        "Vx16_vredxor_vs_cg/cr_vs2_vs1_edges",
        "Vx32_vredxor_vs_cg/cr_vs2_vs1_edges",
        "Vx64_vredxor_vs_cg/cr_vs2_vs1_edges",
      ]

  # The unsigned vwredsumu.vs instruction zero-extends the SEW-wide vector elements
  # before summing them, then adds the 2*SEW-width scalar element, and stores the
  # result in a 2*SEW-width scalar element. For both vwredsumu.vs and vwredsum.vs,
  # overflows wrap around.
  - name: vwredsumu_op
    coverpoint:
      [
        "Vx8_vwredsumu_vs_cg/cr_vs2_vs1_edges_wred",
        "Vx16_vwredsumu_vs_cg/cr_vs2_vs1_edges_wred",
        "Vx32_vwredsumu_vs_cg/cr_vs2_vs1_edges_wred",
      ]

  # The vwredsum.vs instruction sign-extends the SEW-wide vector elements before
  # summing them. For both vwredsumu.vs and vwredsum.vs, overflows wrap around.
  - name: vwredsum_op
    coverpoint:
      [
        "Vx8_vwredsum_vs_cg/cr_vs2_vs1_edges_wred",
        "Vx16_vwredsum_vs_cg/cr_vs2_vs1_edges_wred",
        "Vx32_vwredsum_vs_cg/cr_vs2_vs1_edges_wred",
      ]

  # The vfredosum instruction must sum the floating-point values in element order,
  # starting with the scalar in vs1[0] where each addition operates identically to
  # the scalar floating-point instructions in terms of raising exception flags and
  # generating or propagating special values. When the operation is masked (vm=0),
  # the masked-off elements do not affect the result or the exception flags.
  - name: vfredosum_op
    coverpoint: ["Vf16_vfredosum_vs_cg/cp_custom_vfredosum_ordered_sum"]

  # The implementation must produce a result equivalent to a reduction tree composed
  # of binary operator nodes, with the inputs being elements from the source vector
  # register group (vs2) and the source scalar value (vs1[0]). Each operator in the
  # tree accepts two inputs and produces one result. Each operator first computes an
  # exact sum as a RISC-V scalar floating-point addition with infinite exponent
  # range and precision, then converts this exact sum to a floating-point format
  # with range and precision each at least as great as the element floating-point
  # format indicated by SEW, rounding using the currently active floating-point
  # dynamic rounding mode and raising exception flags as necessary. A different
  # floating-point range and precision may be chosen for the result of each
  # operator. A node where one input is derived only from elements masked-off or
  # beyond the active vector length may either treat that input as the additive
  # identity of the appropriate EEW or simply copy the other input to its output.
  # The rounded result from the root node in the tree is converted (rounded again,
  # using the dynamic rounding mode) to the standard floating-point format indicated
  # by SEW.
  - name: vfredusum_op
    coverpoint: ["Vf16_vfredusum_vs_cg/cp_vd"]

  # The additive identity is +0.0 when rounding down (towards -{inf}) or -0.0 for
  # all other rounding modes.
  - name: vfredusum_additive_impl
    coverpoint:
      [
        "Implicit: the additive-identity sign is whatever the reference model produces and is checked by the ordinary signature comparison, just not isolated by a dedicated coverpoint",
      ]

  # The reduction tree structure must be deterministic for a given value in vtype
  # and vl.
  - name: vfredusum_redtree
    coverpoint:
      [
        "Untestable: reduction-tree determinism across runs is not observable from a single self-checking execution",
      ]

  # The vfredmin and vfredmax instructions reduce the scalar argument in vs1[0] and
  # active elements in vs2 using the minimumNumber and maximumNumber operations,
  # respectively.
  - names: [vfredmin_op, vfredmax_op]
    coverpoint: ["Vf16_vfredmin_vs_cg/cp_vd"]

  # Widening forms of the sum reductions are provided that read and write a
  # double-width reduction result. The reduction of the SEW-width elements is
  # performed as in the single-width reduction case, with the elements in vs2
  # promoted to 2*SEW bits before adding to the 2*SEW-bit accumulator.
  - name: vfwredosum_op
    coverpoint: ["Vf16_vfwredosum_vs_cg/cp_vd_emul2"]

  # Widening forms of the sum reductions are provided that read and write a
  # double-width reduction result. The reduction of the SEW-width elements is
  # performed as in the single-width reduction case, with the elements in vs2
  # promoted to 2*SEW bits before adding to the 2*SEW-bit accumulator.
  - name: vfwredusum_op
    coverpoint: ["Vf16_vfwredusum_vs_cg/cp_vd_emul2"]

  # Vector mask-register logical operations operate on mask registers. Each element
  # in a mask register is a single bit,
  - name: vmask_maskreg
    coverpoint: ["Vx16_vmand_mm_cg/cp_vd"]

  # The destination vector register may be the same as either source vector
  # register.
  - name: vmask_vd_overlap_vs
    coverpoint: ["Vx16_vmand_mm_cg/cmp_vd_vs1"]

  # As with other vector instructions, the elements with indices less than vstart
  # are unchanged, and vstart is reset to zero after execution.
  - name: vmask_vstart
    coverpoint: ["ExceptionsVx_vmand_mm_cg/cp_vstart"]

  # Vector mask logical instructions are always unmasked,
  - name: vmasklogical_unmasked
    coverpoint: ["Vx16_vmand_mm_cg/cr_vtype_agnostic_nomask"]

  # so there are no inactive elements, and the encodings with vm=0 are reserved.
  - name: vmasklogical_masked_rsv
    coverpoint:
      [
        "SsstrictV_vmand_mm_cg/cp_ssstrictv_mask_logical_vm0_reserved",
        "SsstrictV_vmnand_mm_cg/cp_ssstrictv_mask_logical_vm0_reserved",
        "SsstrictV_vmor_mm_cg/cp_ssstrictv_mask_logical_vm0_reserved",
        "SsstrictV_vmxor_mm_cg/cp_ssstrictv_mask_logical_vm0_reserved",
      ]

  # Mask elements past vl, the tail elements, are always updated with a
  # tail-agnostic policy.
  - name: vmasklogical_tail_agnostic
    coverpoint: ["Vx16_vmand_mm_cg/cr_vtype_agnostic_nomask"]

  # vmand.mm vd, vs2, vs1 # vd.mask[i] = vs2.mask[i] &amp;&amp; vs1.mask[i]
  # vmnand.mm vd, vs2, vs1 # vd.mask[i] = !(vs2.mask[i] &amp;&amp; vs1.mask[i])
  # vmandn.mm vd, vs2, vs1 # vd.mask[i] = vs2.mask[i] &amp;&amp; !vs1.mask[i]
  # vmxor.mm vd, vs2, vs1 # vd.mask[i] = vs2.mask[i] ^^ vs1.mask[i] vmor.mm vd, vs2,
  # vs1 # vd.mask[i] = vs2.mask[i] || vs1.mask[i] vmnor.mm vd, vs2, vs1 # vd.mask[i]
  # = !(vs2.mask[i] || vs1.mask[i]) vmorn.mm vd, vs2, vs1 # vd.mask[i] = vs2.mask[i]
  # || !vs1.mask[i] vmxnor.mm vd, vs2, vs1 # vd.mask[i] = !(vs2.mask[i] ^^
  # vs1.mask[i])
  - names:
      [
        vmand_op,
        vmnand_op,
        vmandn_op,
        vmxor_op,
        vmor_op,
        vmnor_op,
        vmorn_op,
        vmxnor_op,
      ]
    coverpoint:
      [
        "Vx16_vmand_mm_cg/cr_vs2_vs1_edges_mm",
        "Vx16_vmnand_mm_cg/cr_vs2_vs1_edges_mm",
        "Vx16_vmandn_mm_cg/cr_vs2_vs1_edges_mm",
        "Vx16_vmxor_mm_cg/cr_vs2_vs1_edges_mm",
        "Vx16_vmor_mm_cg/cr_vs2_vs1_edges_mm",
        "Vx16_vmnor_mm_cg/cr_vs2_vs1_edges_mm",
        "Vx16_vmorn_mm_cg/cr_vs2_vs1_edges_mm",
        "Vx16_vmxnor_mm_cg/cr_vs2_vs1_edges_mm",
      ]

  # The source operand is a single vector register holding mask register values as
  # described in &lt;&lt;sec-mask-register-layout&gt;&gt;.
  - name: vcpop_vs_single_vreg
    coverpoint: ["Vx16_vcpop_m_cg/cp_vs2_edges_eew1"]

  # The vcpop.m instruction counts the number of mask elements of the active
  # elements of the vector source mask register that have the value 1 and writes the
  # result to a scalar x register. The operation can be performed under a mask, in
  # which case only the masked elements are counted.
  - name: vcpop_op
    coverpoint: ["Vx16_vcpop_m_cg/cp_rd"]

  # The vcpop.m instruction writes x[rd] even if vl=0 (with the value 0, since no
  # mask elements are active).
  - name: vcpop_vl0
    coverpoint: ["Vx16_vcpop_m_cg/cp_vl_0"]

  # Traps on vcpop.m are always reported with a vstart of 0.
  - name: vcpop_trap
    coverpoint:
      [
        "TODO: no coverpoint checks that vstart is reported as 0 after a trap on vcpop.m; cp_vstart only checks that a non-zero vstart raises an illegal-instruction exception",
      ]

  # The vcpop.m instruction will raise an illegal-instruction exception if vstart is
  # non-zero.
  - name: vcpop_vstart_n0_ill
    coverpoint:
      [
        "ExceptionsVx_vcpop_m_cg/cp_vstart_gt_vl",
        "ExceptionsVx_vcpop_m_cg/cp_vstart",
      ]

  # The vfirst instruction finds the lowest-numbered active element of the source
  # mask vector that has the value 1 and writes that element's index to a GPR. If no
  # active element has the value 1, -1 is written to the GPR.
  - name: vfirst_op
    coverpoint: ["Vx16_vfirst_m_cg/cp_rd"]

  # The vfirst.m instruction writes x[rd] even if vl=0 (with the value -1, since no
  # mask elements are active).
  - name: vfirst_vl0
    coverpoint: ["Vx16_vfirst_m_cg/cp_vl_0"]

  # Traps on vfirst are always reported with a vstart of 0.
  - name: vfirst_trap
    coverpoint:
      [
        "TODO: no coverpoint checks that vstart is reported as 0 after a trap on vfirst.m; cp_vstart only checks that a non-zero vstart raises an illegal-instruction exception",
      ]

  # The vfirst instruction will raise an illegal-instruction exception if vstart is
  # non-zero.
  - name: vfirst_vstart_n0_ill
    coverpoint:
      [
        "ExceptionsVx_vfirst_m_cg/cp_vstart_gt_vl",
        "ExceptionsVx_vfirst_m_cg/cp_vstart",
      ]

  # The vmsbf.m instruction takes a mask register as input and writes results to a
  # mask register. The instruction writes a 1 to all active mask elements before the
  # first active source element that is a 1, then writes a 0 to that element and all
  # following active elements. If there is no set bit in the active elements of the
  # source vector, then all active elements in the destination are written with a 1.
  - name: vmsbf_op
    coverpoint: ["Vx16_vmsbf_m_cg/cp_vd"]

  # The tail elements in the destination mask register are updated under a
  # tail-agnostic policy.
  - name: vmsbf_tail_agnostic
    coverpoint: ["Vx16_vmsbf_m_cg/cr_vtype_agnostic"]

  # Traps on vmsbf.m are always reported with a vstart of 0.
  - name: vmsbf_trap
    coverpoint:
      [
        "TODO: no coverpoint checks that vstart is reported as 0 after a trap on vmsbf.m; cp_vstart only checks that a non-zero vstart raises an illegal-instruction exception",
      ]

  # The vmsbf instruction will raise an illegal-instruction exception if vstart is
  # non-zero.
  - name: vmsbf_vstart_n0_ill
    coverpoint:
      [
        "ExceptionsVx_vmsbf_m_cg/cp_vstart_gt_vl",
        "ExceptionsVx_vmsbf_m_cg/cp_vstart",
      ]

  # The destination register cannot overlap the source register and, if masked,
  # cannot overlap the mask register ('v0').
  - name: vmsbf_vreg_constr
    coverpoint: ["SsstrictV_vmsbf_m_cg/cp_ssstrictv_masking_vd_eq_v0"]

  # The vector mask set-including-first instruction is similar to set-before-first,
  # except it also includes the element with a set bit.
  - name: vmsif_op
    coverpoint: ["Vx16_vmsif_m_cg/cp_vd"]

  # The tail elements in the destination mask register are updated under a
  # tail-agnostic policy.
  - name: vmsif_tail_agnostic
    coverpoint: ["Vx16_vmsif_m_cg/cr_vtype_agnostic"]

  # Traps on vmsif.m are always reported with a vstart of 0.
  - name: vmsif_trap
    coverpoint:
      [
        "TODO: no coverpoint checks that vstart is reported as 0 after a trap on vmsif.m; cp_vstart only checks that a non-zero vstart raises an illegal-instruction exception",
      ]

  # The vmsif instruction will raise an illegal-instruction exception if vstart is
  # non-zero.
  - name: vmsif_vstart_n0_ill
    coverpoint:
      [
        "ExceptionsVx_vmsif_m_cg/cp_vstart_gt_vl",
        "ExceptionsVx_vmsif_m_cg/cp_vstart",
      ]

  # The destination register cannot overlap the source register and, if masked,
  # cannot overlap the mask register ('v0').
  - name: vmsif_vreg_constr
    coverpoint: ["SsstrictV_vmsif_m_cg/cp_ssstrictv_masking_vd_eq_v0"]

  # The vector mask set-only-first instruction is similar to set-before-first,
  # except it only sets the first element with a bit set, if any.
  - name: vmsof_op
    coverpoint: ["Vx16_vmsof_m_cg/cp_vd"]

  # The tail elements in the destination mask register are updated under a
  # tail-agnostic policy.
  - name: vmsof_tail_agnostic
    coverpoint: ["Vx16_vmsof_m_cg/cr_vtype_agnostic"]

  # Traps on vmsof.m are always reported with a vstart of 0.
  - name: vmsof_trap
    coverpoint:
      [
        "TODO: no coverpoint checks that vstart is reported as 0 after a trap on vmsof.m; cp_vstart only checks that a non-zero vstart raises an illegal-instruction exception",
      ]

  # The vmsof instruction will raise an illegal-instruction exception if vstart is
  # non-zero.
  - name: vmsof_vstart_n0_ill
    coverpoint:
      [
        "ExceptionsVx_vmsof_m_cg/cp_vstart_gt_vl",
        "ExceptionsVx_vmsof_m_cg/cp_vstart",
      ]

  # The destination register cannot overlap the source register and, if masked,
  # cannot overlap the mask register ('v0').
  - name: vmsof_vreg_constr
    coverpoint: ["SsstrictV_vmsof_m_cg/cp_ssstrictv_masking_vd_eq_v0"]

  # The viota.m instruction reads a source vector mask register and writes to each
  # element of the destination vector register group the sum of all the bits of
  # elements in the mask register whose index is less than the element, e.g., a
  # parallel prefix sum of the mask values. This instruction can be masked, in which
  # case only the enabled elements contribute to the sum. The result value is
  # zero-extended to fill the destination element if SEW is wider than the result.
  # If the result value would overflow the destination SEW, the least-significant
  # SEW bits are retained.
  - name: viota_op
    coverpoint: ["Vx16_viota_m_cg/cp_vd"]

  # Traps on viota.m are always reported with a vstart of 0,
  - name: viota_trap
    coverpoint:
      [
        "TODO: no coverpoint checks that vstart is reported as 0 after a trap on viota.m; cp_vstart only checks that a non-zero vstart raises an illegal-instruction exception",
      ]

  # An illegal-instruction exception is raised if vstart is non-zero.
  - name: viota_vstart_n0_ill
    coverpoint:
      [
        "ExceptionsVx_viota_m_cg/cp_vstart_gt_vl",
        "ExceptionsVx_viota_m_cg/cp_vstart",
      ]

  # The destination register group cannot overlap the source register and, if
  # masked, cannot overlap the mask register (v0).
  - name: viota_vreg_constr
    coverpoint:
      [
        "SsstrictV_viota_m_cg/cp_exceptionsv_vd_vs2_overlap",
        "SsstrictV_viota_m_cg/cp_ssstrictv_masking_vd_eq_v0",
      ]

  # The vid.v instruction writes each element's index to the destination vector
  # register group, from 0 to vl-1. The instruction can be masked. Masking does not
  # change the index value written to active elements. The result value is
  # zero-extended to fill the destination element if SEW is wider than the result.
  # If the result value would overflow the destination SEW, the least-significant
  # SEW bits are retained.
  - name: vid_op
    coverpoint: ["Vx16_vid_v_cg/cp_vd"]

  # The vs2 field of the instruction must be set to v0, otherwise the encoding is
  # reserved.
  - name: vid_vs2_nv0_rsv
    coverpoint: ["SsstrictV_vid_v_cg/cp_ssstrictv_vid_vs2_not_v0_reserved"]

  # The instructions ignore LMUL and vector register groups.
  - names: [vmv-x-s_ignoreLMUL, vmv-s-x_ignoreLMUL]
    coverpoint:
      [
        "Vx16_vmv_s_x_cg/cp_custom_voffgroup_vd_lmul2",
        "Vx16_vmv_x_s_cg/cp_custom_voffgroup_vs2_lmul2",
      ]

  # The vmv.x.s instruction copies a single SEW-wide element from index 0 of the
  # source vector register to a destination integer register. If SEW &gt; XLEN, the
  # least-significant XLEN bits are transferred and the upper SEW-XLEN bits are
  # ignored. If SEW &lt; XLEN, the value is sign-extended to XLEN bits.
  - name: vmv-x-s_op
    coverpoint: ["Vx16_vmv_x_s_cg/cp_rd"]

  # vmv.x.s performs its operation even if vstart {ge} vl or vl=0.
  - names: [vmv-x-s_vstart_ge_vl, vmv-x-s_vl0]
    coverpoint:
      [
        "Vx16_vmv_x_s_cg/cp_custom_gprWriting_vstart_eq_vl",
        "Vx16_vmv_x_s_cg/cp_vl_0",
      ]

  # The vmv.s.x instruction copies the scalar integer register to element 0 of the
  # destination vector register. If SEW &lt; XLEN, the least-significant bits are
  # copied and the upper XLEN-SEW bits are ignored. If SEW &gt; XLEN, the value is
  # sign-extended to SEW bits. The other elements in the destination vector register
  # ( 0 &lt; index &lt; VLEN/SEW) are treated as tail elements using the current
  # tail agnostic/undisturbed policy.
  - name: vmv-s-x_op
    coverpoint: ["Vx16_vmv_s_x_cg/cp_rs1_edges"]

  # If vstart {ge} vl, no operation is performed and the destination register is not
  # updated.
  - name: vmv-s-x_vstart_ge_vl
    coverpoint: ["ExceptionsVx_vmv_s_x_cg/cp_vstart_gt_vl"]

  # The encodings corresponding to the masked versions (vm=0) of vmv.x.s and vmv.s.x
  # are reserved.
  - names: [vmv-s-x_masked_rsv, vmv-x-s_masked_rsv]
    coverpoint: ["SsstrictV_vmv_s_x_cg/cp_ssstrictv_vmv_xs_sx_vm0_reserved"]

  # The instructions ignore LMUL and vector register groups.
  - names: [vfmv-f-s_ignoreLMUL, vfmv-s-f_ignoreLMUL]
    coverpoint:
      [
        "Vf16_vfmv_f_s_cg/cp_custom_fmv_fs_vs2_all_lmul_regs",
        "Vf16_vfmv_s_f_cg/cp_custom_fmv_sf_vd_all_lmul_regs",
      ]

  # The vfmv.f.s instruction copies a single SEW-wide element from index 0 of the
  # source vector register to a destination scalar floating-point register.
  - name: vfmv-f-s_op
    coverpoint: ["Vf16_vfmv_f_s_cg/cp_fd"]

  # The vfmv.s.f instruction copies the scalar floating-point register to element 0
  # of the destination vector register. The other elements in the destination vector
  # register ( 0 &lt; index &lt; VLEN/SEW) are treated as tail elements using the
  # current tail agnostic/undisturbed policy.
  - name: vfmv-s-f_op
    coverpoint: ["Vf16_vfmv_s_f_cg/cp_fs1"]

  # If vstart {ge} vl, no operation is performed and the destination register is not
  # updated.
  - name: vfmv-s-f_vstart_ge_vl
    coverpoint: ["ExceptionsVf16_vfmv_s_f_cg/cp_vstart_gt_vl"]

  # For all of the vslideup, vslidedown, v[f]slide1up, and v[f]slide1down
  # instructions, if vstart {ge} vl, the instruction performs no operation and
  # leaves the destination vector register unchanged.
  - names:
      [
        vslideup_vstart_ge_vl,
        vslidedown_vstart_ge_vl,
        vslide1up_vstart_ge_vl,
        vslide1down_vstart_ge_vl,
        vfslide1up_vstart_ge_vl,
        vfslide1down_vstart_ge_vl,
      ]
    coverpoint:
      [
        "ExceptionsVx_vslideup_vx_cg/cp_vstart_gt_vl",
        "ExceptionsVx_vslidedown_vx_cg/cp_vstart_gt_vl",
        "ExceptionsVx_vslide1up_vx_cg/cp_vstart_gt_vl",
        "ExceptionsVx_vslide1down_vx_cg/cp_vstart_gt_vl",
        "ExceptionsVf16_vfslide1up_vf_cg/cp_vstart_gt_vl",
        "ExceptionsVf16_vfslide1down_vf_cg/cp_vstart_gt_vl",
      ]

  # The slide instructions may be masked, with mask element i controlling whether
  # destination element i is written. The mask undisturbed/agnostic policy is
  # followed for inactive elements.
  - names:
      [
        vslideup_mask,
        vslidedown_mask,
        vslide1up_mask,
        vslide1down_mask,
        vfslide1up_mask,
        vfslide1down_mask,
      ]
    coverpoint:
      [
        "Vx16_vslideup_vx_cg/cp_masking_edges",
        "Vx16_vslidedown_vx_cg/cp_masking_edges",
        "Vx16_vslide1up_vx_cg/cp_masking_edges",
        "Vx16_vslide1down_vx_cg/cp_masking_edges",
        "Vf16_vfslide1up_vf_cg/cp_masking_edges",
        "Vf16_vfslide1down_vf_cg/cp_masking_edges",
      ]

  # For vslideup, the value in vl specifies the maximum number of destination
  # elements that are written. The start index (OFFSET) for the destination can be
  # either specified using an unsigned integer in the x register specified by rs1,
  # or a 5-bit immediate, zero-extended to XLEN bits. If XLEN &gt; SEW, OFFSET is
  # not truncated to SEW bits. Destination elements OFFSET through vl-1 are written
  # if unmasked and if OFFSET &lt; vl.
  - name: vslideup_op
    coverpoint: ["Vx16_vslideup_vx_cg/cr_vs2_rs1_edges"]

  # The destination vector register group for vslideup cannot overlap the source
  # vector register group, otherwise the instruction encoding is reserved.
  - name: vslideup_vreg_constr
    coverpoint:
      [
        "SsstrictV_vslideup_vx_cg/cp_ssstrictv_vslideup_vd_vs2_overlap",
        "SsstrictV_vslideup_vi_cg/cp_ssstrictv_vslideup_vd_vs2_overlap",
      ]

  # For vslidedown, the value in vl specifies the maximum number of destination
  # elements that are written. The remaining elements past vl are handled according
  # to the current tail policy (&lt;&lt;sec-agnostic&gt;&gt;). The start index
  # (OFFSET) for the source can be either specified using an unsigned integer in the
  # x register specified by rs1, or a 5-bit immediate, zero-extended to XLEN bits.
  # If XLEN &gt; SEW, OFFSET is not truncated to SEW bits.
  - name: vslidedown_op
    coverpoint: ["Vx16_vslidedown_vx_cg/cr_vs2_rs1_edges"]

  # The vslide1up instruction places the x register argument at location 0 of the
  # destination vector register group, provided that element 0 is active, otherwise
  # the destination element update follows the current mask agnostic/undisturbed
  # policy. If XLEN &lt; SEW, the value is sign-extended to SEW bits. If XLEN &gt;
  # SEW, the least-significant bits are copied over and the high XLEN-SEW bits are
  # ignored. The remaining active vl-1 elements are copied over from index i in the
  # source vector register group to index i+1 in the destination vector register
  # group. The vl register specifies the maximum number of destination vector
  # register elements updated with source values, and remaining elements past vl are
  # handled according to the current tail policy (&lt;&lt;sec-agnostic&gt;&gt;).
  - name: vslide1up-vx_op
    coverpoint: ["Vx16_vslide1up_vx_cg/cr_vs2_rs1_edges"]

  # The vslide1up instruction requires that the destination vector register group
  # does not overlap the source vector register group. Otherwise, the instruction
  # encoding is reserved.
  - name: vslide1up-vx_vreg_constr
    coverpoint:
      ["SsstrictV_vslide1up_vx_cg/cp_ssstrictv_vslide1up_vd_vs2_overlap"]

  # The vfslide1up instruction is defined analogously to vslide1up, but sources its
  # scalar argument from an f register.
  - name: vslide1up-vf_op
    coverpoint: ["Vf16_vfslide1up_vf_cg/cr_vs2_fs1_edges_f_sew16"]

  # The vslide1down instruction copies the first vl-1 active elements values from
  # index i+1 in the source vector register group to index i in the destination
  # vector register group. The vl register specifies the maximum number of
  # destination vector register elements written with source values, and remaining
  # elements past vl are handled according to the current tail policy
  # (&lt;&lt;sec-agnostic&gt;&gt;). The vslide1down instruction places the x
  # register argument at location vl-1 in the destination vector register, provided
  # that element vl-1 is active, otherwise the destination element update follows
  # the current mask agnostic/undisturbed policy. If XLEN &lt; SEW, the value is
  # sign-extended to SEW bits. If XLEN &gt; SEW, the least-significant bits are
  # copied over and the high SEW-XLEN bits are ignored.
  - name: vslide1down-vx_op
    coverpoint: ["Vx16_vslide1down_vx_cg/cr_vs2_rs1_edges"]

  # The vfslide1down instruction is defined analogously to vslide1down, but sources
  # its scalar argument from an f register.
  - name: vslide1down-vf_op
    coverpoint: ["Vf16_vfslide1down_vf_cg/cr_vs2_fs1_edges_f_sew16"]

  # The index values in the second vector are treated as unsigned integers.
  - names: [vrgather_vs2_uint, vrgatherei16_vs2_uint]
    coverpoint:
      [
        "Vx16_vrgather_vv_cg/cp_vs1_edges",
        "Vx16_vrgatherei16_vv_cg/cp_vs1_edges",
      ]

  # The source vector can be read at any index &lt; VLMAX regardless of vl.
  - names: [vrgather_vs_ignore_vl, vrgatherei16_vs_ignore_vl]
    coverpoint:
      [
        "Vx16_vrgather_vv_cg/cp_custom_vindexCorners_index_gt_vl_lt_vlmax",
        "Vx16_vrgatherei16_vv_cg/cp_custom_vindexCorners_index_gt_vl_lt_vlmax",
      ]

  # The maximum number of elements to write to the destination register is given by
  # vl,
  - names: [vrgather_vl, vrgatherei16_vl]
    coverpoint:
      [
        "Vx16_vrgather_vv_cg/cr_vl_lmul_sew16",
        "Vx16_vrgatherei16_vv_cg/cr_vl_lmul_sew16",
      ]

  # and the remaining elements past vl are handled according to the current tail
  # policy (&lt;&lt;sec-agnostic&gt;&gt;).
  - names: [vrgather_tail, vrgatherei16_tail]
    coverpoint:
      [
        "Vx16_vrgather_vv_cg/cr_vtype_agnostic",
        "Vx16_vrgatherei16_vv_cg/cr_vtype_agnostic",
      ]

  # The operation can be masked, and the mask undisturbed/agnostic policy is
  # followed for inactive elements.
  - names: [vrgather_mask, vrgatherei16_mask]
    coverpoint:
      [
        "Vx16_vrgather_vv_cg/cp_masking_edges",
        "Vx16_vrgatherei16_vv_cg/cp_masking_edges",
      ]

  # The vrgather.vv form uses SEW/LMUL for both the data and indices.
  - name: vrgather-vv_sew_lmul
    coverpoint: ["Vx16_vrgather_vv_cg/cr_vl_lmul_sew16"]

  # The vrgatherei16.vv form uses SEW/LMUL for the data in vs2 but EEW=16 and EMUL =
  # (16/SEW)*LMUL for the indices in vs1.
  - name: vrgatherei16-vv_sew_lmul
    coverpoint: ["Vx32_vrgatherei16_vv_cg/cp_vs1_edges"]

  # If an element index is out of range ( vs1[i] {ge} VLMAX ) then zero is returned
  # for the element value.
  - names: [vrgather_id_ge_VLMAX, vrgatherei16_id_ge_VLMAX]
    coverpoint:
      [
        "{Vx16_vrgather_vv_cg,Vx16_vrgatherei16_vv_cg}/cp_custom_vindexCorners_index_ge_vlmax",
      ]

  # Vector-scalar and vector-immediate forms of the register gather are also
  # provided. These read one element from the source vector at the given index, and
  # write this value to the active elements of the destination vector register. The
  # index value in the scalar register and the immediate, zero-extended to XLEN
  # bits, are treated as unsigned integers. If XLEN &gt; SEW, the index value is not
  # truncated to SEW bits.
  - names: [vrgather-vx_op, vrgather-vi_op]
    coverpoint:
      [
        "{Vx16_vrgather_vx_cg,Vx16_vrgather_vi_cg}/cp_vd",
        "Vx16_vrgather_vx_cg/cp_custom_vindexVX_rs1_not_truncated_64",
      ]

  # For any vrgather instruction, the destination vector register group cannot
  # overlap with the source vector register groups, otherwise the instruction
  # encoding is reserved.
  - names: [vrgather_vreg_constr, vrgatherei16_vreg_constr]
    coverpoint:
      [
        "{SsstrictV_vrgather_vv_cg,SsstrictV_vrgatherei16_vv_cg}/cp_ssstrictv_vrgather_vd_vs2_overlap",
      ]

  # The vector mask register specified by vs1 indicates which of the first vl
  # elements of vector register group vs2 should be extracted and packed into
  # contiguous elements at the beginning of vector register vd. The remaining
  # elements of vd are treated as tail elements according to the current tail policy
  # (&lt;&lt;sec-agnostic&gt;&gt;).
  - name: vcompress_op
    coverpoint: ["Vx16_vcompress_vm_cg/cr_vs2_vs1_edges"]

  # T`vcompress` is encoded as an unmasked instruction (vm=1).
  - name: vcompress_enc
    coverpoint:
      [
        "Vx8_vcompress_vm_cg/cp_asm_count",
        "Vx16_vcompress_vm_cg/cp_asm_count",
        "Vx32_vcompress_vm_cg/cp_asm_count",
        "Vx64_vcompress_vm_cg/cp_asm_count",
        "SsstrictV_vcompress_vm_cg/cp_ssstrictv_vcompress_vm0_reserved",
      ]

  # The equivalent masked instruction (vm=0) is reserved.
  - name: vcompress_masked_rsv
    coverpoint:
      ["SsstrictV_vcompress_vm_cg/cp_ssstrictv_vcompress_vm0_reserved"]

  # The destination vector register group cannot overlap the source vector register
  # group or the source mask register, otherwise the instruction encoding is
  # reserved.
  - name: vcompress_vreg_constr
    coverpoint:
      ["SsstrictV_vcompress_vm_cg/cp_ssstrictv_vcompress_vd_vs2_overlap"]

  # A trap on a vcompress instruction is always reported with a vstart of 0.
  - name: vcompress_trap
    coverpoint:
      [
        "TODO: no coverpoint checks that vstart is reported as 0 after a trap on vcompress.vm; cp_vstart only checks that a non-zero vstart raises an illegal-instruction exception",
      ]

  # Executing a vcompress instruction with a non-zero vstart raises an
  # illegal-instruction exception.
  - name: vcompress_vstart_n0_ill
    coverpoint:
      [
        "ExceptionsVx_vcompress_vm_cg/cp_vstart_gt_vl",
        "ExceptionsVx_vcompress_vm_cg/cp_vstart",
      ]

  # The vmv&lt;nr&gt;r.v instructions copy whole vector registers (i.e., all VLEN
  # bits) and can copy whole vector register groups. The nr value in the opcode is
  # the number of individual vector registers, NREG, to copy. The instructions
  # operate as if EEW=SEW, EMUL = NREG, effective length evl= EMUL * VLEN/SEW.
  - name: vmv-nr-r_op
    coverpoint:
      [
        "Vx8_vmv1r_v_cg/cr_vl_lmul_sew8",
        "Vx8_vmv2r_v_cg/cr_vl_lmul_sew8",
        "Vx8_vmv4r_v_cg/cr_vl_lmul_sew8",
        "Vx8_vmv8r_v_cg/cr_vl_lmul_sew8",
      ]

  # The instruction is encoded as an OPIVI instruction. The number of vector
  # registers to copy is encoded in the low three bits of the simm field (simm[2:0])
  # using the same encoding as the nf[2:0] field for memory instructions (Figure
  # &lt;&lt;fig-nf&gt;&gt;), i.e., simm[2:0] = NREG-1.
  - name: vmv-nr-r_enc
    coverpoint:
      [
        "SsstrictV_vmv1r_v_cg/cp_ssstrictv_vmvnr_simm_reserved",
        "Vx8_vmv1r_v_cg/cp_asm_count",
        "Vx8_vmv2r_v_cg/cp_asm_count",
        "Vx8_vmv4r_v_cg/cp_asm_count",
        "Vx8_vmv8r_v_cg/cp_asm_count",
      ]

  # The value of NREG must be 1, 2, 4, or 8, and values of simm[4:0] other than 0,
  # 1, 3, and 7 are reserved.
  - name: vmv-nr-r_nreg_rsv
    coverpoint: ["SsstrictV_vmv1r_v_cg/cp_ssstrictv_vmvnr_simm_reserved"]

  # The source and destination vector register numbers must be aligned appropriately
  # for the vector register group size,
  - name: vmv-nr-r_vreg_constr
    coverpoint: ["SsstrictV_vmv2r_v_cg/cp_ssstrictv_vmv2r_both_unaligned"]

  # encodings with other vector register numbers are reserved.
  - name: vmv-nr-r_unaligned_rsv
    coverpoint: ["SsstrictV_vmv4r_v_cg/cp_ssstrictv_vmv4r_both_unaligned"]

  # On a trap during a vector instruction (caused by either a synchronous exception
  # or an asynchronous interrupt), the existing *epc CSR is written with a pointer
  # to the trapping vector instruction, while the vstart CSR contains the element
  # index on which the trap was taken.
  - names: [epc_op_V_trap, vstart_op_V_trap]
    coverpoint: ["ExceptionsVx_vsaddu_vv_cg/cp_vstart"]

  # Any of these extensions can be added to base ISAs with XLEN=32 or XLEN=64.
  - name: Zve_XLEN
    coverpoint:
      [
        "Implicit: extension-support requirement exercised by the config simply running under that XLEN",
      ]

  # The Zve32f and Zve64x extensions depend on the Zve32x extension.
  - name: Zve32f_Zve64x_dependent_Zve32x
    coverpoint:
      [
        "Implicit: extension-composition fact exercised implicitly whenever the config runs at all",
      ]

  # The Zve64f extension depends on the Zve32f and Zve64x extensions.
  - name: Zve64f_dependent_Zve32f_Zve64x
    coverpoint:
      [
        "Implicit: extension-composition fact exercised implicitly whenever the config runs at all",
      ]

  # The Zve64d extension depends on the Zve64f extension.
  - name: Zve64d_dependent_Zve64f
    coverpoint:
      [
        "Implicit: extension-composition fact exercised implicitly whenever the config runs at all",
      ]

  # All Zve* extensions have precise traps.
  - name: Zve_precise_traps
    coverpoint:
      [
        "Untestable: trap precision is a cross-cutting property of every exception test, not something one coverpoint can isolate",
      ]

  # All Zve* extensions provide support for EEW of 8, 16, and 32, and Zve64*
  # extensions also support EEW of 64.
  - name: Zve_eew
    coverpoint:
      [
        "Implicit: extension-support requirement exercised implicitly by which EEWs the generated suite runs at all",
      ]

  # All Zve* extensions support all vector load and store instructions
  # (&lt;&lt;sec-vector-memory&gt;&gt;), except Zve64* extensions do not support
  # EEW=64 for index values when XLEN=32.
  - name: Zve_nsupport_eew64_xlen32
    coverpoint:
      [
        "Implicit: extension-support exclusion exercised implicitly by config-driven test generation filtering",
      ]

  # All Zve* extensions support all vector integer instructions
  # (&lt;&lt;sec-vector-integer&gt;&gt;), except that the vmulh integer multiply
  # variants that return the high word of the product (vmulh.vv, vmulh.vx,
  # vmulhu.vv, vmulhu.vx, vmulhsu.vv, vmulhsu.vx) are not included for EEW=64 in
  # Zve64*.
  - name: Zve64_eew64_nsupport_vmulh
    coverpoint:
      [
        "Implicit: config-driven instruction exclusion exercised implicitly by test generation filtering",
      ]

  # All Zve* extensions support all vector fixed-point arithmetic instructions
  # (&lt;&lt;sec-vector-fixed-point&gt;&gt;), except that vsmul.vv and vsmul.vx are
  # not included in EEW=64 in Zve64*.
  - name: Zve64_eew64_nsupport_vsmul
    coverpoint:
      [
        "Implicit: config-driven instruction exclusion exercised implicitly by test generation filtering",
      ]

  # All Zve* extensions support all vector permutation instructions
  # (&lt;&lt;sec-vector-permute&gt;&gt;), except that Zve32x and Zve64x do not
  # include those with floating-point operands, and Zve64f does not include those
  # with EEW=64 floating-point operands.
  - name: Zve32x_Zve64x_nsupport_freg
    coverpoint:
      [
        "Implicit: extension-support requirement exercised implicitly by config-driven test generation filtering",
      ]

  # The Zve32x extension depends on the Zicsr extension.
  - name: Zve32x_dependent_Zicsr
    coverpoint: ["SmV_cg/cp_vcsrrswc"]

  # The Zve32f and Zve64f extensions depend upon the F extension, and implement all
  # vector floating-point instructions (&lt;&lt;sec-vector-float&gt;&gt;) for
  # floating-point operands with EEW=32. Vector single-width floating-point
  # reduction operations (&lt;&lt;sec-vector-float-reduce&gt;&gt;) for EEW=32 are
  # supported.
  - names: [Zve32f_dependent_F, Zve64f_dependent_F]
    coverpoint:
      [
        "Implicit: extension-composition fact exercised implicitly whenever the config runs at all",
      ]

  # The misa.v bit is set for implementations providing misa and supporting V.
  - name: misa_v_op
    coverpoint: ["SmV_cg/cp_misa_v_clear_set", "Sm_mcsr_cg/cp_misa_v"]

  # The V vector extension has precise traps.
  - name: V_precise_traps
    coverpoint:
      [
        "Untestable: trap precision is a cross-cutting property of every exception test, not something one coverpoint can isolate",
      ]

  # The V vector extension depends upon the Zvl128b and Zve64d extensions.
  - name: V_dependent_Zvl128b_Zve64d
    coverpoint:
      [
        "Implicit: extension-composition fact exercised implicitly whenever the config runs at all",
      ]

  # The V extension supports EEW of 8, 16, and 32, and 64.
  - name: V_supported_eew
    coverpoint:
      [
        "{Vx8_vadd_vv_cg,Vx16_vadd_vv_cg,Vx32_vadd_vv_cg,Vx64_vadd_vv_cg}/cp_asm_count",
      ]

  # The V extension supports the vector configuration instructions
  # (&lt;&lt;sec-vector-config&gt;&gt;). The V extension supports all vector load
  # and store instructions (&lt;&lt;sec-vector-memory&gt;&gt;), except the V
  # extension does not support EEW=64 for index values when XLEN=32. The V extension
  # supports all vector integer instructions (&lt;&lt;sec-vector-integer&gt;&gt;).
  # The V extension supports all vector fixed-point arithmetic instructions
  # (&lt;&lt;sec-vector-fixed-point&gt;&gt;). The V extension supports all vector
  # integer single-width and widening reduction operations
  # (&lt;&lt;sec-vector-integer-reduce&gt;&gt;,
  # &lt;&lt;sec-vector-integer-reduce-widen&gt;&gt;). The V extension supports all
  # vector mask instructions (&lt;&lt;sec-vector-mask&gt;&gt;). The V extension
  # supports all vector permutation instructions
  # (&lt;&lt;sec-vector-permute&gt;&gt;).
  - name: V_instr
    coverpoint:
      [
        "Implicit: extension-support requirement exercised implicitly by which instructions the generated suite runs at all",
      ]

  # The Zvfhmin extension depends on the Zve32f extension.
  - name: Zvfhmin_dependent_Zve32f
    coverpoint:
      [
        "Implicit: extension-composition fact exercised implicitly whenever the config runs at all",
      ]

  # When the Zvfh extension is implemented, all instructions in
  # &lt;&lt;sec-vector-float&gt;&gt;, &lt;&lt;sec-vector-float-reduce&gt;&gt;,
  # &lt;&lt;sec-vector-float-reduce-widen&gt;&gt;,
  # &lt;&lt;sec-vector-float-move&gt;&gt;, &lt;&lt;sec-vfslide1up&gt;&gt;, and
  # &lt;&lt;sec-vfslide1down&gt;&gt; become defined when SEW=16. Additionally,
  # conversions between 8-bit integers and binary16 values are provided. The
  # floating-point-to-integer narrowing conversions (vfncvt[.rtz].x[u].f.w) and
  # integer-to-floating-point widening conversions (vfwcvt.f.x[u].v) become defined
  # when SEW=8.
  - name: Zvfh_instr
    coverpoint:
      [
        "Implicit: extension-support requirement exercised implicitly by which instructions the generated suite runs at all",
      ]

  # The EEW=16 floating-point operands of these instructions use the binary16
  # format.
  - name: Zvfh_eew16
    coverpoint:
      [
        "Implicit: extension-support requirement exercised implicitly by which EEWs the generated suite runs at all",
      ]

  # The Zvfh extension depends on the Zve32f and Zfhmin extensions.
  - name: Zvfh_dependent_Zve32f_Zfhmin
    coverpoint:
      [
        "Implicit: extension-composition fact exercised implicitly whenever the config runs at all",
      ]

  # Vector instructions with EGS &gt; VLMAX are reserved.
  - name: egs_ge_vlmax_rsv
    coverpoint:
      [
        "Out-of-Scope: no Ssstrict-equivalent suite exists for the vector-crypto (Zvk*) extensions, and this reserved condition depends on CSR state, matching Ssstrict's own encoding-only scope boundary",
      ]

  # When an operand is a vector of element groups, the vl setting must correspond to
  # an integer multiple of the element group size, with other values of vl reserved.
  - name: egs_vl_rsv
    coverpoint:
      [
        "Out-of-Scope: no Ssstrict-equivalent suite exists for the vector-crypto (Zvk*) extensions, and this reserved condition depends on CSR state, matching Ssstrict's own encoding-only scope boundary",
      ]

  # When element group instructions are present, an additional constraint is placed
  # on the setting of vl based on an AVL value (augmenting
  # &lt;&lt;constraints-on-setting-vl&gt;&gt;). EGSMAX is the largest EGS supported
  # by the implementation. When AVL &gt; VLMAX, the value of vl must be set to
  # either VLMAX or a positive integer multiple of EGSMAX.
  - name: egs_vl_avl
    coverpoint:
      [
        "Untestable: AVL-to-vl rounding under EGSMAX is not exercised by any suite and depends on an implementation-chosen EGSMAX",
      ]

  # The vtype SEW can be used to indicate or calculate the effective element size
  # (EEW) of one or more operands of an element group instruction. Where the operand
  # is an element group, SEW and EEW refer to the number of bits in each individual
  # element within a group not the number of bits in the group as a whole.
  - name: egs_sew_eew
    coverpoint: ["Zvknha_vsha2ch_vv_cg/cp_csr_vtype_lmul_egs4_sew32"]

  # The vtype LMUL setting can be used to indicate or calculate the effective length
  # multiplier (EMUL) for one or more operands. Element group instructions tend to
  # exhibit a much wider range of relationships between various operand EEW/EMUL
  # values. For example, an instruction might take a vector of length N of 4-element
  # groups with EEW=8b and reduce each group to produce a vector length N of
  # 1-element groups with EEW=32b. In this case, the input and output EMUL values
  # are equal even though the EEW settings differ by a factor of 4.
  - name: egs_lmul_emul
    coverpoint: ["Zvknha_vsha2ch_vv_cg/cr_vl_lmul_egs4_sew32"]

  # The element group width (EGW) is the number of bits in the element group as a
  # whole. For example, the SHA-256 instructions in the Zvknha extension operate on
  # an EGW of 128, with EGS=4 and EEW=32. It is possible to use LMUL to concatenate
  # multiple vector registers together to support larger EGW&gt;VLEN.
  - name: egs_egw
    coverpoint: ["Zvknha_vsha2ch_vv_cg/cp_vd_egs4"]

  # The active elements can raise exceptions and update the destination vector
  # register group.
  - name: vector_active_element
    coverpoint: ["Vx16_vadd_vv_cg/cp_masking_edges"]

  # If the Ztso extension is implemented, vector memory instructions additionally
  # follow RVTSO at the instruction level.
  - name: vector_ls_rvtso
    coverpoint:
      [
        "Not Tested: no Ztso-configured vector test config exists yet to exercise RVTSO ordering",
      ]

  # For vnclipu/vnclip, the rounding mode is specified in the vxrm CSR. Rounding
  # occurs around the least-significant bit of the destination and before
  # saturation.
  - name: vnclipu_vnclip_rounding
    coverpoint:
      ["{Vx16_vnclip_wv_cg,Vx16_vnclipu_wv_cg}/cr_vxrm_vs2_vs1_edges_wv"]

  # so these instructions all operate on single vector registers regardless of the
  # setting of the vlmul field in vtype. They do not change the value of vlmul.
  - name: instrgrp_vmask_disregard_vlmul
    coverpoint: ["Vx16_vmseq_vv_cg/cp_custom_vmask_write_lmulge1"]

  # execution is always restarted from the beginning when resuming after a trap
  # handler.
  - name: viota_restart
    coverpoint:
      [
        "Not Tested: restart-from-vstart-after-trap sequencing is not generated by this suite yet",
      ]

  # vrgather.vv vd, vs2, vs1, vm # vd[i] = (vs1[i] &gt;= VLMAX) ? 0 : vs2[vs1[i]];
  # vrgatherei16.vv vd, vs2, vs1, vm # vd[i] = (vs1[i] &gt;= VLMAX) ? 0 :
  # vs2[vs1[i]];
  - name: vrgather-vv_op_vrgatherei16-vv_op
    coverpoint:
      ["Vx16_vrgather_vv_cg/cp_custom_vindexCorners_index_gt_vl_lt_vlmax"]

  # Masked vector loads do not update inactive elements in the destination vector register
  # group, unless masked agnostic is specified (vtype.vma=1).
  - name: vector_masked_inactive_behavior
    coverpoint: ["Vx16_vadd_vv_cg/cp_masking_edges"]

  # The vector extension must have a consistent state at reset. In particular, vtype and vl
  # must have values that can be read and then restored with a single vsetvl instruction.
  - name: vector_reset_state
    coverpoint:
      [
        "Untestable: reset-time CSR state is not observable via a coverpoint in a self-checking test that boots past reset",
      ]

  # Zve32f supports all vector floating-point permutation instructions for floating-point
  # operands with EEW=32.
  - name: Zve32f_instr_perm
    coverpoint:
      [
        "Implicit: extension-support requirement exercised implicitly by which instructions the generated suite runs at all",
      ]

  # Zve64d supports all vector floating-point permutation instructions for floating-point
  # operands with EEW=32 or EEW=64.
  - name: Zve64d_instr_perm
    coverpoint:
      [
        "Implicit: extension-support requirement exercised implicitly by which instructions the generated suite runs at all",
      ]
