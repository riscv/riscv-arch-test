# yaml-language-server: $schema=testplan.schema.json
suite: SsnpmSm
title: Ssnpm Coverpoints (M-mode with MPRV)
source: https://docs.google.com/spreadsheets/d/15yJhyhBB5X9cq4SDQ-YCPzo2oPQnDBh5wEIZhi0-9Ps/edit?gid=645084995#gid=645084995
notes: |
  Ssnpm provides pointer masking for U-mode via senvcfg.PMM.
  In this sheet , test plan is for the M-mode part of Ssnpm: M-mode accesses memory as U-mode via MPRV.
  - tests run in M-mode with mstatus.MPRV=1 and mstatus.MPP=U
  - The suite requires Ssnpm because senvcfg.PMM governs the access. mseccfg.PMM is swept only if Smmpm is supported, to show that it does not apply.
coverpoints:
  - name: cp_pm_mprv_mpp_u
    goal: Verify that senvcfg.PMM governs pointer masking when M-mode accesses memory as U-mode via MPRV.
    description: |-
      MPRV affect pointer masking as well, causing the pointer masking settings of the effective privilege mode to be applied.
      With MPP=U the effective privilege mode is U, so senvcfg.PMM applies and mseccfg.PMM does not.

      Test Environment:
       In M-mode set mstatus.MPRV=1 and mstatus.MPP=U
       Set mstatus.SUM=1 so the setup code can access user-space pages.
       Place known value_old in scratch. Let A' = scratch (upper bits = 0x0000).
      Page tables configured for valid mappings under satp.MODE ∈ {Bare, Sv39}, with the data pages user-accessible.
      For each mstatus.MXR in {0, 1}:
      For each mseccfg.PMM in {00, 10, 11} if Smmpm supported:
      For each senvcfg.PMM in {00, 10, 11}:
      For each satp.MODE in {Bare, Sv39}:
      For each A_upper_bits in {0x0000, 0x0001, 0x0200}:
      Set A = A' with upper bits replaced by A_upper_bits
      For read (lw): read directly from A in M-mode with MPRV=1, sigupd(value), record any traps.
      For write (sw): write unique known value_new to A in M-mode with MPRV=1, read back from scratch (A'), sigupd(value), record any traps.
    expectation: "When senvcfg.PMM=10/11 and MXR=0: A patterns whose upper bits fall within PMLEN resolve to scratch, reads return known value_old, write readbacks return known value_new, regardless of mseccfg.PMM. When senvcfg.PMM=00 or MXR=1: masking disabled : only A=0x0000 resolves to scratch; all other patterns cause a trap."
    bins: 2 MXR * 3 mseccfg.PMM * 3 senvcfg.PMM * 1 MPRV * 1 MPP (U) * 2 satp.MODE * 3 addresses * 2 instructions (lw, sw)
    rules:
      - pm_mprv_spvp
