  - name: H_vscsrs_acc_vs
    coverpoint: ["H_vscsr_cg/cp_hcsr_virtualinstructionfault"]

  - name: H_vscsrs_acc_u
    coverpoint: ["H_ucsr_cg/cp_hcsr_inaccessible"]

  - name: H_vscsrs_acc_m_hs
    coverpoint: [" H_mcsr_cg/{cp_hcsr_access, cp_hcsrwalk}, H_hscsr_cg/cp_hcsr_access"]

  - name: H_vscsrs_v1
    coverpoint: ["H_vscsr_cg/cp_replica"]

  - name: H_vscsrs_v0
    coverpoint: ["H_mcsr_cg/cp_replica, H_vscsr_cg/cp_replica"]

  - name: H_scsrs_nomatch
    coverpoint: ["H_vscsr_cg/cp_nonreplica"]

  - names: [hstatus_sz, hstatus_acc, hstatus_op]
    coverpoint: ["H_mcsr_cg/{ cp_hcsr_access , cp_hcsrwalk } , H_hscsr_cg/{cp_hcsr_access , cp_hcsrwalk }"]

  # The VSXL field controls the effective XLEN for VS-mode (known as VSXLEN), which may differ from the XLEN for HS-mode (HSXLEN).
  - name: hstatus_vsxl_op
    coverpoint: ["OUT-OF-SCOPE"]

  # When HSXLEN=32, the VSXL field does not exist, and VSXLEN=32.
  - name: hstatus_vsxl_32
    coverpoint: ["H_hscsr_cg/cp_hcsr_access/hstatus"]

  # When HSXLEN=64,VSXL is a WARL field that is encoded the same as the MXL field of misa
  - name: hstatus_vsxl_64
    coverpoint: ["H_hscsr_cg/cp_hcsr_access/hstatus"]

  # When HSXLEN=64,VSXL is a WARL field that is encoded the same as the MXL field of misa
  - name: hstatus_vsxl_64
    coverpoint: ["OUT-OF-SCOPE"]

  # In particular, an implementation may make VSXL be a read-only field whose value always ensures that VSXLEN=HSXLEN
  - name: vsxl_ro
    coverpoint: ["H_hscsr_cg/cp_hcsr_access/hstatus"]

  # If HSXLEN is changed from 32 to a wider width, and if field VSXL is not restricted to a single value, it gets the value corresponding to the widest supported width not wider than the new HSXLEN.
  - name: hstatus_vsxl_change
    coverpoint: ["OUT-OF-SCOPE"]

  - name: hstatus_vtvm_op
    coverpoint: ["H_vcsr_cg/cp_tvm"]

  - name: hstatus_vgein_op
    coverpoint: ["H_hscsr_cg/cp_hstatus_vgein"]

  - name: hstatus_spv_sret
    coverpoint: ["H_inst_cg/ {cp_sret_hs , cp_sret_m}"]
 
  # Register hedeleg is a 64-bit read/write register
  - name: hedeleg_sz_acc
    coverpoint: ["H_mcsr_cg/cp_hcsr_access/hedeleg, H_hscsr_cg/cp_hcsr_access/hedeleg"]

  - name: hedeleg_acc
    coverpoint: ["H_mcsr_cg/cp_hcsrwalk, H_hscsr_cg/cp_hcsrwalk"]

  # Register hideleg is an HSXLEN-bit read/write register
