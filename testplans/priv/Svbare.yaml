coverpoints:
  - name: cp_satp_bare
    goal: satp.mode = BARE works in S and U modes
    description: read, write, execute address with satp.MODE = BARE in S and U modes
    expectation: Access physical memory
    bins: 3 access * 2 modes
  - name: cp_satp_bare_mprv
    goal: satp.mode = BARE works  in M-mode with MPRV
    description: Read, write, execute address with satp.mode=BARE in M-mode with mstatus.MPRV=1 and mstatus.mpp = U and S
    expectation: Access physical memory
    bins: 3 access * 2 modes
