# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions
#
# Sm1p13 features are tested by Sm.py and Sm_coverage.svh under
# `ifdef SM1P13P0_OR_LATER_SUPPORTED; the coverpoints below live in the Sm suite.
# Software-check exceptions are exercised by Zicfilp/Zicfiss, hardware errors by
# Smrnmi, LCOFI by Sscofpmf, hedelegh by the Hypervisor suites, and the
# misaligned atomicity granule PMA by Zama16b.

normative_rule_definitions:
  # When XLEN=32, csr:medelegh[] is a 32-bit read/write register that aliases bits 63:32
  # of csr:medeleg[].
  - name: medelegh_sz_acc_enc_xlen32
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/medelegh"]

  # The csr::[mxl] (Machine XLEN) field encodes the native base integer ISA width as shown
  # in &lt;&lt;norm:misa_mxl_enc&gt;&gt;.
  - name: misa_mxl_op_isa
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]
  # If csr:misa[] is nonzero, the csr::[mxl] field indicates the effective XLEN in M-mode,
  # a constant termed MXLEN.
  - name: misa_mxl_op_nz
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]
  # XLEN is never greater than MXLEN, but XLEN might be smaller than MXLEN in
  # less-privileged modes.
  - name: xlen_le_mxlen
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # The MXL field is read-only.
  - name: misa_mxl_acc
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # MXL|XLEN === 1|32 2|64 3|Reserved ===
  - name: misa_mxl_enc
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # The Extensions field encodes the presence of the standard extensions, with a single
  # bit per letter of the alphabet (bit 0 encodes presence of extension ext:a[], bit 1
  # encodes presence of extension ext:b[], through to bit 25 which encodes ext:z[]).
  - name: misa_extensions_enc_txt
    coverpoint: ["Sm_mcsr_cg/{cp_misa_b, cp_misa_v}"]
  # Bit|Character|Description === 0|csr::[a]|Atomic extension¶1|csr::[b]|B
  # extension¶2|csr::[c]|Compressed extension¶3|csr::[d]|Double-precision floating-point
  # extension¶4|csr::[e]|RV32E/64E base ISA¶5|csr::[f]|Single-precision floating-point
  # extension¶6|csr::[g]|Reserved¶7|csr::[h]|Hypervisor extension¶8|csr::[i]|RV32I/64I
  # base
  # ISA¶9|csr::[j]|Reserved¶10|csr::[k]|Reserved¶11|csr::[l]|Reserved¶12|csr::[m]|Integer
  # Multiply/Divide extension¶13|csr::[n]|Tentatively reserved for User-Level Interrupts
  # extension¶14|csr::[o]|Reserved¶15|csr::[p]|Tentatively reserved for Packed-SIMD
  # extension¶16|csr::[q]|Quad-precision floating-point
  # extension¶17|csr::[r]|Reserved¶18|csr::[s]|Supervisor mode
  # implemented¶19|csr::[t]|Reserved¶20|csr::[u]|User mode implemented¶21|csr::[v]|Vector
  # extension¶22|csr::[w]|Reserved¶23|csr::[x]|Non-standard extensions
  # implemented¶24|csr::[y]|Reserved¶25|csr::[z]|Reserved ===
  - name: misa_extensions_enc_tbl
    coverpoint: ["Sm_mcsr_cg/{cp_misa_b, cp_misa_v}"]

  # The Extensions field is a WARL field that can contain writable bits where the
  # implementation allows the supported ISA to be modified.
  - name: misa_extensions_warl_op
    coverpoint: ["Sm_mcsr_cg/{cp_misa_b, cp_misa_v}"]

  # mcause accepts software-check (18) and hardware-error (19) exception codes.

  # Interrupt|Exception Code|Description === ... 0|18|Software check 0|19|Hardware
  # error ... ===
  - name: mcause_exccode_enc_img
    coverpoint: ["Sm_mcause_cg/cp_mcause_write_exception"]

  # A hart's memory-mapped csr:msip[] register is a 32-bit read/write register
  - name: msip_sz_acc
    coverpoint: ["Sm_mcsr_cg/cp_msip"]

  # bits 31-1 read as zero and bit 0 contains the MSIP bit.
  - name: msip_enc
    coverpoint: ["Sm_mcsr_cg/cp_msip"]

  # MSIP is read-only in mip, and is written by accesses to memory-mapped control
  # registers, which are used to provide machine-level interprocessor interrupts.
  - name: mip_msip_rdonly
    coverpoint: ["Sm_mcsr_cg/cp_msip"]

  # When the memory-mapped msip register changes, it is guaranteed to be reflected
  # in mip.MSIP eventually, but not necessarily immediately.
  - name: msip_update_max_time
    coverpoint: ["Sm_mcsr_cg/cp_msip"]
