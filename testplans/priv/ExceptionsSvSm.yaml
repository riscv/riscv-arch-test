# yaml-language-server: $schema=testplan.schema.json
suite: ExceptionsSvSm
source: https://docs.google.com/spreadsheets/d/1W95I4jPbuQBnXzDdIZtOG4kae8vi7djpKtJXWCXPxMU/edit?gid=136053911#gid=136053911
coverpoints:
  - heading: "The following coverpoints should be exercised in machine mode."
  - name: cp_instr_page_fault_m
    goal: Instruction Page Fault
    description: jump to address that would cause instruction page fault in non-M-mode because mstatus.MPRV=1 and  mstatus.MPP={01, 00}, but no fault occurs because MPRV should not affect instruction fetch in M-mode.
  - name: cp_load_page_fault_m
    goal: Load Page Fault
    description: load from address that causes load page fault because mstatus.MPRV=1 and  mstatus.MPP={01, 00}
  - name: cp_store_page_fault_m
    goal: Store Page Fault
    description: store to address that causes store page fault because mstatus.MPRV=1 and  mstatus.MPP={01, 00}
  - name: cp_misaligned_priority_m
    goal: Priority of exceptions
    description: Attempt lw and sw and fetch from memory location causing {access fault and page fault}, {page fault and misaligned}, {access fault, page fault, misaligned}
    expectation: M-mode needs MPRV to S or U mode to be able to cause access fault.  No fetch fault occurs because MPRV does not affect fetch privilege.
  - name: cp_medeleg_m
    goal: Machine mode exception not affected by medeleg
    description: Attempt instruction/load/store page faults crossed crossed with medeleg = [ {1011_0011_1111_1111}, {0}, and 13 different walking 1s]
    expectation: medeleg should not affect machine mode exceptions.  No instruction page fault occurs because MPRV does not affect fetch privilege.
  - heading: "The following coverpoints should be exercised in supervisor mode"
  - name: cp_medeleg_s
    goal: Delegation to supervisor mode
    description: Attempt instruction/load/store page faults crossed crossed with medeleg = [ {1011_0011_1111_1111}, {0}, and 13 different walking 1s]
    expectation: Should delegate when a 1 is in the appropriate column.
  - heading: "The following coverpoints should be exercised in user mode"
  - name: cp_medeleg_u
    goal: Delegation to supervisor mode
    description: Attempt instruction/load/store page faults crossed crossed with medeleg = [ {1011_0011_1111_1111}, {0}, and 13 different walking 1s]
    expectation: Should delegate when a 1 is in the appropriate column.
