      ]
  # insn:fmsub.s[] multiplies the values in rs1 and rs2, subtracts the value in rs3, and
  # writes the final result to rd. insn:fmsub.s[] computes (rs1×rs2)−rs3.
  - name: fmsub-s_op
    coverpoint:
      [
        "D_fmsub_d_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4_D, cr_fs1_fs3_edges_frm4_D}",
        "D_fmsub_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S, cp_fs3_badNB_D_S}",
      ]
  - name: fmv-d-x_op
    # FMV.D.X moves the double-precision value encoded in IEEE 754-2008
    # standard encoding from the integer register rs1 to the floating-point
    # register rd
    coverpoint: ["D_fmv_d_x_cg/{cp_rs1, cp_rs1_edges, cp_fd}"]
  - name: fmv-x-d_op
    # FMV.X.D moves
    # the double-precision value in floating-point register rs1 to a
    # representation in IEEE 754-2008 standard encoding in integer register
    # rd
    coverpoint: ["D_fmv_x_d_cg/{cp_rd, cp_fs1, cp_fs1_edges_D}"]
  # insn:fnmadd.s[] multiplies the values in rs1 and rs2, negates the product, subtracts
  # the value in rs3, and writes the final result to rd. insn:fnmadd.s[] computes
  # −(rs1×rs2)−rs3.
  - name: fnmadd-s_op
    coverpoint:
      [
        "D_fnmadd_d_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4_D, cr_fs1_fs3_edges_frm4_D}",
        "D_fnmadd_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S, cp_fs3_badNB_D_S}",
      ]
  # insn:fnmsub.s[] multiplies the values in rs1 and rs2, negates the product, adds the
  # value in rs3, and writes the final result to rd. insn:fnmsub.s[] computes
  # −(rs1×rs2)+rs3.
  - name: fnmsub-s_op
    coverpoint:
      [
        "D_fnmsub_d_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4_D, cr_fs1_fs3_edges_frm4_D}",
        "D_fnmsub_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S, cp_fs3_badNB_D_S}",
      ]
  - name: fsd_op
    # FSD stores a double-precision
    # value from the floating-point registers to memory
    coverpoint: ["D_fsd_cg/{cp_rs1_nx0, cp_imm_edges, cp_fs2, cp_fs2_edges}"]
  # insn:fsgnj.s[], insn:fsgnjn.s[], and insn:fsgnjx.s[] are floating-point to
  # floating-point sign-injection instructions that produce a result that takes all bits
  # except the sign bit from rs1. For insn:fsgnj[], the result's sign bit is rs2's sign
  # bit; for insn:fsgnjn[], the result's sign bit is the opposite of rs2's sign bit; and
  # for insn:fsgnjx[], the sign bit is the XOR of the sign bits of rs1 and rs2.
  # Sign-injection instructions do not set floating-point exception flags, nor do they
  # canonicalize NaNs
  - name: fsgnj-s_fsgnjn-s_fsgnjx-s_op
    coverpoint:
      [
        "D_fsgnj_d_cg/{cp_fs1, cp_fs2, cp_fd, cr_fs1_fs2_edges_D}",
        "D_fsgnjn_d_cg/{cp_fs1, cp_fs2, cp_fd, cr_fs1_fs2_edges_D}",
        "D_fsgnjx_d_cg/{cp_fs1, cp_fs2, cp_fd, cr_fs1_fs2_edges_D}",
        "D_fsgnj_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fsgnjn_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fsgnjx_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
      ]
  # Floating-point to floating-point sign-injection instructions, insn:fsgnj.d[],
  # insn:fsgnjn.d[], and insn:fsgnjx.d[], are defined analogously to the single-precision
  # sign-injection instruction.
  - name: fsgnj-d_fsgnjn-d_fsgnjx-d_op
    coverpoint:
      [
        "D_fsgnj_d_cg/{cp_fs1, cp_fs2, cp_fd, cr_fs1_fs2_edges_D}",
        "D_fsgnjn_d_cg/{cp_fs1, cp_fs2, cp_fd, cr_fs1_fs2_edges_D}",
        "D_fsgnjx_d_cg/{cp_fs1, cp_fs2, cp_fd, cr_fs1_fs2_edges_D}",
      ]
  # insn:fsqrt.s[] computes the square root of rs1
  - name: fsqrt-s_op
    coverpoint:
      [
        "D_fsqrt_d_cg/{cp_fs1, cp_fd, cp_fs1_edges_D, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "D_fsqrt_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S}",
      ]
  # insn:fsub.s[] performs the single-precision floating-point subtraction of rs2 from rs1
  - name: fsub-s_op
    coverpoint:
      [
        "D_fsub_d_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm_D}",
        "D_fsub_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
      ]
  # In each case, the result is written to rd.
  - name: fp_rd
    coverpoint:
      [
        "D_fadd_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fdiv_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fmul_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fsqrt_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S}",
        "D_fsub_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
      ]
  # The 2-bit floating-point format field fmt is encoded as shown in . It is set to S (00)
  # for all instructions in the ext:f[] extension.
  - name: F_fmt_single
    coverpoint:
      [
        "D_fadd_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fcvt_l_s_cg/{cp_fs1_badNB_D_S}",
        "D_fcvt_lu_s_cg/{cp_fs1_badNB_D_S}",
        "D_fcvt_s_l_cg/{cp_NaNBox_D_S}",
        "D_fcvt_s_lu_cg/{cp_NaNBox_D_S}",
        "D_fcvt_s_w_cg/{cp_NaNBox_D_S}",
        "D_fcvt_s_wu_cg/{cp_NaNBox_D_S}",
        "D_fcvt_w_s_cg/{cp_fs1_badNB_D_S}",
        "D_fcvt_wu_s_cg/{cp_fs1_badNB_D_S}",
        "D_fdiv_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fmadd_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S, cp_fs3_badNB_D_S}",
        "D_fmsub_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S, cp_fs3_badNB_D_S}",
        "D_fmul_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fnmadd_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S, cp_fs3_badNB_D_S}",
        "D_fnmsub_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S, cp_fs3_badNB_D_S}",
        "D_fsgnj_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fsgnjn_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fsgnjx_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fsqrt_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S}",
        "D_fsub_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
      ]
  # insn:fcvt.w.s[] or insn:fcvt.l.s[] converts a floating-point number in floating-point
  # register rs1 to a signed 32-bit or 64-bit integer, respectively, in integer register
  # rd
  - name: fcvt-l-s_fcvt-w-s_op
    coverpoint:
      ["D_fcvt_l_s_cg/{cp_fs1_badNB_D_S}", "D_fcvt_w_s_cg/{cp_fs1_badNB_D_S}"]
  # insn:fcvt.l.s[], insn:fcvt.lu.s[], insn:fcvt.s.l[], and insn:fcvt.s.lu[] are RV64-only
  # instructions
  - name: fcvt_long_float_rv64_only
    coverpoint:
      [
        "D_fcvt_l_s_cg/{cp_fs1_badNB_D_S}",
        "D_fcvt_lu_s_cg/{cp_fs1_badNB_D_S}",
        "D_fcvt_s_l_cg/{cp_NaNBox_D_S}",
        "D_fcvt_s_lu_cg/{cp_NaNBox_D_S}",
      ]
  # &lt;&lt;int_conv&gt;&gt; gives the range of valid inputs for insn:fcvt.w.s[],
  # insn:fcvt.wu.s[], insn:fcvt.l.s[], and insn:fcvt.lu.s[] and the behavior of these
  # instructions for invalid inputs
  - name: fcvt_int_float_valid_input
    coverpoint:
      [
        "D_fcvt_l_s_cg/{cp_fs1_badNB_D_S}",
        "D_fcvt_lu_s_cg/{cp_fs1_badNB_D_S}",
        "D_fcvt_w_s_cg/{cp_fs1_badNB_D_S}",
        "D_fcvt_wu_s_cg/{cp_fs1_badNB_D_S}",
      ]
  # insn:fcvt.wu.s[], insn:fcvt.lu.s[], insn:fcvt.s.wu[], and insn:fcvt.s.lu[] variants
  # convert to or from unsigned integer values. For XLEN&gt;32, insn:fcvt.w.s[] and
  # insn:fcvt.wu.s[] sign-extend the 32-bit result to the destination register width
  - name: fcvt-wu-s_fcvt-lu-s_fcvt-s-wu_fcvt-s-lu_op
    coverpoint:
      [
        "D_fcvt_lu_s_cg/{cp_fs1_badNB_D_S}",
        "D_fcvt_s_lu_cg/{cp_NaNBox_D_S}",
        "D_fcvt_s_wu_cg/{cp_NaNBox_D_S}",
        "D_fcvt_wu_s_cg/{cp_fs1_badNB_D_S}",
      ]
  # insn:fcvt.s.w[] or insn:fcvt.s.l[] converts a 32-bit or 64-bit signed integer,
  # respectively, in integer register rs1 into a floating-point number in floating-point
  # register rd
  - name: fcvt-s-w_fcvt-s-l_op
    coverpoint:
      ["D_fcvt_s_l_cg/{cp_NaNBox_D_S}", "D_fcvt_s_w_cg/{cp_NaNBox_D_S}"]
  # Floating-point loads and stores use the same base+offset addressing mode as the
  # integer base ISAs, with a base address in register rs1 and a 12-bit signed byte
  # offset. The insn:flw[] instruction loads a single-precision floating-point value from
  # memory into floating-point register rd. insn:fsw[] stores a single-precision value
  # from floating-point register rs2 to memory.
  - name: fsw_flw_op
    coverpoint: ["D_flw_cg/{cp_NaNBox_D_S}", "D_fsw_cg/{cp_fs2_badNB_D_S}"]
  # Floating-point fused multiply-add (FMA) instructions require a new standard
  # instruction format. R4-type instructions specify three source registers (rs1, rs2, and
  # rs3) and a destination register (rd). This format is only used by the floating-point
  # fused multiply-add instructions.
  - name: fma_rs3
    coverpoint:
      [
        "D_fmadd_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S, cp_fs3_badNB_D_S}",
        "D_fmsub_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S, cp_fs3_badNB_D_S}",
        "D_fnmadd_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S, cp_fs3_badNB_D_S}",
        "D_fnmsub_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S, cp_fs3_badNB_D_S}",
      ]
  # Floating-point minimum-number and maximum-number instructions insn:fmin.s[] and
  # insn:fmax.s[] write, respectively, the smaller or larger of rs1 and rs2 to rd
  - name: fmin-s_fmax-s_op
    coverpoint:
      [
        "D_fmax_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fmin_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
      ]
  - name: fmv-w-x_op
    # FMV.W.X moves the single-precision value encoded in IEEE 754-2008 standard encoding from the lower 32 bits of integer register rs1 to the floating-point register rd. The bits are not modified in the transfer, and in particular, the payloads of non-canonical NaNs are preserved.
    coverpoint: ["D_fmv_w_x_cg/{cp_NaNBox_D_S}"]
  - name: fmv-x-w_op
    # FMV.X.W moves the single-precision value in floating-point register rs1 represented in IEEE 754-2008 encoding to the lower 32 bits of integer register rd. The bits are not modified in the transfer, and in particular, the payloads of non-canonical NaNs are preserved. For RV64, the higher 32 bits of the destination register are filled with copies of the floating-point number's sign bit
    coverpoint: ["D_fmv_x_w_cg/{cp_fs1_badNB_D_S}"]
