# .pre-commit-config.yaml
# jcarlin@hmc.edu 25 April 2025
# Pre-commit hook configuration file for riscv-arch-test

# SPDX-License-Identifier: Apache-2.0

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
minimum_pre_commit_version: "4.0.0"
exclude: norm-rules.json
repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
        args: ["--assume-in-merge"]
        exclude: \.adoc$ # sections titles Level 6 "=======" get flagged otherwise
      # - id: check-json # Doesn't support JSON with comments
      - id: check-toml
      - id: check-yaml

  # Format pyproject.toml files
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 50e0f3aee9dc5747a5f173f79a7417403c18dda6 # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt
        # pyproject-fmt requires Python 3.11+. The CI job for the oldest supported Python pins 3.10.
        language_version: ">=3.11"

  # Ruff Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  # Project-local checks
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: system
        types: [shell]
        require_serial: true

  # Ensure uv lock file is up to date
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: d1df990f871e616da38bb602a2671d5e840b9989 # frozen: 0.13.7
    hooks:
      - id: uv-lock

  # Check GitHub Actions workflows
  - repo: https://github.com/kjanat/actionlint
    rev: 722799fa4b8cc6734debb97bae24aca9e0dbaf59 # frozen: v1.17
    hooks:
      - id: actionlint-shellcheck

  # Find security issues in GitHub Actions workflows
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor

  # Shell script formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 05c1426671b9237fb5e1444dd63aa5731bec0dfb # frozen: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--write, --simplify, --indent, "2"]

  # Use spaces, not tabs
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8 # frozen: v1.5.6
    hooks:
      - id: forbid-tabs
        exclude: '.*\.(diff|dump|patch|svg|mk)|Makefile*'

  # Prettier for json, yaml, markdown, etc. formatting
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # frozen: v3.9.10
    hooks:
      - id: prettier

  # Avoid common misspellings
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell

  # Check links in markdown files
  - repo: https://github.com/tcort/markdown-link-check
    rev: 275c27c5035a5b4a656fe0e21a4c1403c118c767 # frozen: v3.15.0
    hooks:
      - id: markdown-link-check
        args: [-q, -c .markdown-link-check.config]
      # docs.openhwfoundation.org rate-limits CI, so check its links separately and accept HTTP 429 only there
      - id: markdown-link-check
        name: Markdown Link Check (docs.openhwfoundation.org)
        alias: markdown-link-check-openhw
        args: [-q, -c .markdown-link-check-openhw.config]

  # Validate Renovate configuration
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 0194d96b631f518fcfc4ab33145322e4af06dfbe # frozen: 44.199.2
    hooks:
      - id: renovate-config-validator

  # Forbid the ambiguous `.align` assembler directive (its meaning is
  # target-dependent); require the explicit `.p2align` (power-of-two
  # exponent) or `.balign` (byte count) instead.
  - repo: local
    hooks:
      - id: forbid-align-directive
        name: forbid ambiguous .align directive
        language: script
        entry: .github/scripts/check-align-directive.sh
        files: \.(S|s|h|py)$
