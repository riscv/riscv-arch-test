# CI configuration for Whisper simulator

# SsstrictSm, unknown
# Smstateen Sail does not yet support 1P13 bit
# Sdtrig* not yet implemented in Sail
# ZicfissU, ZicfissS, ZicfissSm excluded due to Whisper bugs: SSAMOSWAP in M-mode raises an
# illegal-instruction exception instead of a store/AMO access fault, and an S-mode ordinary store to a
# U=1 shadow stack page with SUM=0 raises a store/AMO access fault instead of the U/SUM page fault
ci_enabled: true
exclude_extensions: "SsstrictSm,Smstateen,SdtrigSm,SdtrigS,SdtrigU,ZicfissU,ZicfissS,ZicfissSm"
exclude_configs:
  - whisper-rv32-max-spike-ref
  - whisper-rv64-max-spike-ref
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 1
config_shards:
  whisper-rv64-max: 2
