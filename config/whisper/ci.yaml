# CI configuration for Whisper simulator

# SsstrictSm: Sail 0.14.1 lacks Smaia and Smrnmi, whose CSRs Whisper implements; Whisper also
#   exposes CSRs that do not exist on the configured hart (ssp without Zicfiss, S-level AIA CSRs
#   without S-mode, hidelegh without H, RV32 mhpmevent<n>h without Sscofpmf)
# Smstateen: Whisper's mstateen0/0h writable mask ignores the configured extensions (RV32 P1P13
#   without H; ENVCFG, CSRIND, AIA, IMSIC, CONTEXT and SRMCFG on the -mu configs); Sail lacks the
#   Sdtrig CONTEXT bit (rv64-max)
# SsstrictS: Sail traps on siselect/stopi accesses that Whisper permits with mstateen0 enabled.
# Sdtrig* not yet implemented in Sail (https://github.com/riscv/sail-riscv/issues/222)
# Svnapot: Whisper accepts N=1 on superpage leaf PTEs instead of page faulting (https://github.com/tenstorrent/whisper/issues/98)
# Ssnpm,SsnpmSm,Smmpm,SmnpmS,SmnpmSSm,SmnpmU,SmnpmUSm : Failing due to mismatch in stval/mtval ,Issue Link (https://github.com/riscv/sail-riscv/issues/1962)
ci_enabled: true
exclude_extensions: "SsstrictSm,SsstrictS,Smstateen,SdtrigSm,SdtrigS,SdtrigU,Svnapot,Ssnpm,SsnpmSm,Smmpm,SmnpmS,SmnpmSSm,SmnpmU,SmnpmUSm"
exclude_configs:
  - whisper-rv32-max-spike-ref
  - whisper-rv64-max-spike-ref
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 1
config_shards:
  whisper-rv64-max: 2
