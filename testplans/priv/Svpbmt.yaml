# yaml-language-server: $schema=testplan.schema.json
suite: Svpbmt
source: https://docs.google.com/spreadsheets/d/1LGwD2e01j4SN9tg85nt6gPwpp7nXyXMF7hqbw3jvXko/edit?gid=53957094#gid=53957094
coverpoints:
  - heading: "General Test Environment (Svpbmt):\n- T-SBI suite: boots to S-mode (BOOT_TO_SMODE) and drives the test from the boot identity map. The page under test is mapped at va_data. S-mode accesses run from the identity map. U-mode accesses use RVTEST_TSBI_GOTO_UMODE / RVTEST_TSBI_GOTO_SMODE; the handler moves execution to the U-accessible code alias va_rvtest_code_begin (registered with SAVE_AREA_SETUP) and back. menvcfg is written through T-SBI CSR calls. Page faults are delegated to S-mode, so causes are sampled from scause/stval.\n- menvcfg.PBMTE is set through T-SBI. RV64 only (Sv39, Sv48, Sv57)."
  - name: nonleaf_PTE_pbmt_exec_s
    goal: Verify PBMT set in a non-leaf PTE raises an instruction page fault on an instruction fetch from S-mode
    description: "S-mode: menvcfg.PBMTE=1 (set through T-SBI). Non-leaf PTE with PBMT = 1, 2 and 3 above a valid leaf with PTE.U=0. Jump (jalr) into the page through va_data."
    expectation: Instruction page fault (scause = 12); stval = faulting virtual address.
    bins: |-
      nonleaf_PTE_pbmt_i x PBMTE_set x PageType_i x jalr x ins_page_fault x mode {S-mode}
      = 15 bins on RV64 (RV64 only)
    id: Svpbmt_nonleaf_pte_pbmt_must_be_zero menvcfg_pbmte_op menvcfg_pbmte_fence
    rules:
      - "[norm:Svpbmt_nonleaf_pte_pbmt_must_be_zero] [norm:menvcfg_pbmte_op] [norm:menvcfg_pbmte_fence]"
  - name: nonleaf_PTE_pbmt_exec_u
    goal: Verify PBMT set in a non-leaf PTE raises an instruction page fault on an instruction fetch from U-mode
    description: "U-mode: menvcfg.PBMTE=1 (set through T-SBI). Non-leaf PTE with PBMT = 1, 2 and 3 above a valid leaf with PTE.U=1. Jump (jalr) into the page through va_data."
    expectation: Instruction page fault (scause = 12); stval = faulting virtual address.
    bins: |-
      nonleaf_PTE_pbmt_i x PBMTE_set x PageType_i x jalr x ins_page_fault x mode {U-mode}
      = 15 bins on RV64 (RV64 only)
    id: Svpbmt_nonleaf_pte_pbmt_must_be_zero menvcfg_pbmte_op menvcfg_pbmte_fence
    rules:
      - "[norm:Svpbmt_nonleaf_pte_pbmt_must_be_zero] [norm:menvcfg_pbmte_op] [norm:menvcfg_pbmte_fence]"
  - name: nonleaf_PTE_pbmt_read_s
    goal: Verify PBMT set in a non-leaf PTE raises a load page fault on a load from S-mode
    description: "S-mode: menvcfg.PBMTE=1 (set through T-SBI). Non-leaf PTE with PBMT = 1, 2 and 3 above a valid leaf with PTE.U=0. Load (lw) from the page through va_data."
    expectation: Load page fault (scause = 13); stval = faulting virtual address.
    bins: |-
      nonleaf_PTE_pbmt_d x PBMTE_set x PageType_d x lw x load_page_fault x mode {S-mode}
      = 15 bins on RV64 (RV64 only)
    id: Svpbmt_nonleaf_pte_pbmt_must_be_zero menvcfg_pbmte_op menvcfg_pbmte_fence
    rules:
      - "[norm:Svpbmt_nonleaf_pte_pbmt_must_be_zero] [norm:menvcfg_pbmte_op] [norm:menvcfg_pbmte_fence]"
  - name: nonleaf_PTE_pbmt_read_u
    goal: Verify PBMT set in a non-leaf PTE raises a load page fault on a load from U-mode
    description: "U-mode: menvcfg.PBMTE=1 (set through T-SBI). Non-leaf PTE with PBMT = 1, 2 and 3 above a valid leaf with PTE.U=1. Load (lw) from the page through va_data."
    expectation: Load page fault (scause = 13); stval = faulting virtual address.
    bins: |-
      nonleaf_PTE_pbmt_d x PBMTE_set x PageType_d x lw x load_page_fault x mode {U-mode}
      = 15 bins on RV64 (RV64 only)
    id: Svpbmt_nonleaf_pte_pbmt_must_be_zero menvcfg_pbmte_op menvcfg_pbmte_fence
    rules:
