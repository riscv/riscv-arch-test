# yaml-language-server: $schema=testplan.schema.json
suite: Svade
source: https://docs.google.com/spreadsheets/d/1LGwD2e01j4SN9tg85nt6gPwpp7nXyXMF7hqbw3jvXko/edit?gid=1346750896#gid=1346750896
coverpoints:
  - name: |-
      Abit_unset_exec
      Abit_unset_read
      Abit_unset_write
    description: |-
      Test in supervisor and user privilege mode for leaf PTE on all levels.
      Test Environment:
       Set satp.mode=sv32, 39, 48 and 57
       All PMP permissions on targated pages if PMP is enabled
       Valid leaf PTE, with no invalid RWX encoding
       Execute sfence.vma before accessign the PTE.

      Test Cases:
       Set PTE.R=1  & pte.a=0 and test the read acces.
       Set PTE.W=1&PTE.R=1 & pte.a=0 and test the write access.
       Set PTE.X=1  & pte.a=0 and test the execute access.

      Note:
       For testing at level0, set all the pte perimssions at higher levels to 0 except PTE.v, so that nonleaf level points to level0.
       Set PTE.U=0 when test in Supervisor mode and Set pte.U=1 when testing in user mode.
    expectation: |-
      Page fault exception should be raised according to {x,r,w} access type.
      m/scause must contain the exception number of:
              instruction page fault for execute access.
               load page fault for read access.
               store/AMO page fault for write access.
      m/sepc must contain the virtual address of the instruction at which the trap occurs.
    check: Check against RM
    coverage: Uncovered
    notes: |-
      feature: Access bit implementation
      functional coverage sv39 and sv48: Done
  - name: Dbit_unset_write
    description: |-
      Test in supervisor and user privilege mode for leaf PTE on all levels.
      Test Environment:
       Set satp.mode=sv32, 39, 48 and 57.
       All PMP permissions on targated pages if PMP is enabled
       PTE.V = 1, PTE.A = 1, with no invalid RWX encoding
       Execute sfence.vma before accessign the PTE.

      Test Case:
       Set PTE.W=1 & PTE.R=1 & PTE.D=0 and test the write access.

      Note:
       For testing at level0, set all the pte perimssions at higher levels to 0 except PTE.V, so that nonleaf level points to level0.
       Set PTE.U=0 when test in Supervisor mode and Set pte.U=1 when testing in user mode.
    expectation: |-
      Store/AMO page fault exception should be raised.
      m/scause must contain the exception number of store/AMO page fault for write access.
      m/sepc must contain the virtual address of the instruction at which the trap occurs.
    check: Check against RM
    coverage: Uncovered
    notes: |-
      feature: Dirty bit Implementation
      functional coverage sv39 and sv48: Done
