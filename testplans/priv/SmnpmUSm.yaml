# yaml-language-server: $schema=testplan.schema.json
suite: SmnpmUSm
title: Smnpm Coverpoints (no S mode, M-mode with MPRV)
source: https://docs.google.com/spreadsheets/d/15yJhyhBB5X9cq4SDQ-YCPzo2oPQnDBh5wEIZhi0-9Ps/edit?gid=645084995#gid=645084995
notes: |
  Smnpm provides pointer masking for U-mode via menvcfg.PMM if S-mode is not supported.
  In this sheet , test plan is for the M-mode part of SmnpmU: M-mode accesses memory as U-mode via MPRV.
  Similar to SmnpmSSm except:
  - tests run in M-mode with mstatus.MPRV=1 and mstatus.MPP=U
  - all addresses are physical, Tests executed only in Bare mode .
  - MXR is not swept because it is read-only 0 if S-mode is not supported
coverpoints:
  - name: cp_pm_mprv_mpp_u
    goal: Verify that menvcfg.PMM governs pointer masking when M-mode accesses memory as U-mode via MPRV on a hart without S-mode.
    description: |-
      MPRV affect pointer masking as well, causing the pointer masking settings of the effective privilege mode to be applied.
      With MPP=U the effective privilege mode is U, so menvcfg.PMM applies and mseccfg.PMM does not.

      Test Environment:
       In M-mode set mstatus.MPRV=1 and mstatus.MPP=U
       Place known value_old in scratch. Let A' = scratch (upper bits = 0x0000).
      For each mseccfg.PMM in {00, 10, 11} if Smmpm supported:
      For each menvcfg.PMM in {00, 10, 11}:
      For each A_upper_bits in {0x0000, 0x0001, 0x0200}:
      Set A = A' with upper bits replaced by A_upper_bits
      For read (lw): read directly from A in M-mode with MPRV=1, sigupd(value), record any traps.
      For write (sw): write unique known value_new to A in M-mode with MPRV=1, read back from scratch (A'), sigupd(value), record any traps.
    expectation: "When menvcfg.PMM=10/11: A patterns whose upper bits fall within PMLEN resolve to scratch, reads return known value_old, write readbacks return known value_new, regardless of mseccfg.PMM. When menvcfg.PMM=00: masking disabled : only A=0x0000 resolves to scratch; all other patterns cause a trap."
    bins: 3 mseccfg.PMM * 3 menvcfg.PMM * 1 MPRV * 1 MPP (U) * 3 addresses * 2 instructions (lw, sw)
    rules:
      - pm_mprv_spvp
