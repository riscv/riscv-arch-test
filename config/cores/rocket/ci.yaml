# CI configuration for the Rocket family (Rocket + Saturn + H, Chipyard 1.14.0).
#
# Measured on act4 2dc36dd2f with the simulator from .github/scripts/install-rocket.sh:
# RC = chipsalliance/rocket-chip@55bcad0f with PR #3820 (d1d2c5e7), the TLB superpage-refill fix
# and htimedelta, SAT = ucb-bar/saturn-vectors@8ef05c9c with the acc_done fix. Of the 3441 tests
# that `make tests` generates for this config, the CI selection (3124 tests) all pass; every
# entry below names a test group that fails.

ci_enabled: true

# Not run in CI, because only `make vector-tests` generates them (last measured on act4 96493a914):
#   ExceptionsVf16, ExceptionsVf32, ExceptionsVf64, ExceptionsVfmin
#                 The vstart != 0 illegal-instruction trap writes the PC to mtval
#                 (SAT frontend/PipelinedFaultCheck.scala:221).
#   ExceptionsVls Passes, but runs about 300 s on its own, at run_tests.py's 300 s per-test limit.
exclude_extensions:
  # vsadd/vsaddu/vssub/vssubu .vx at each SEW: csrr vxsat is not ordered after in-flight vector
  # instructions (RC rocket/RocketCore.scala:1066), so vxsat reads back as 0.
  - Vx8-vsadd.vx
  - Vx8-vsaddu.vx
  - Vx8-vssub.vx
  - Vx8-vssubu.vx
  - Vx16-vsadd.vx
  - Vx16-vsaddu.vx
  - Vx16-vssub.vx
  - Vx16-vssubu.vx
  - Vx32-vsadd.vx
  - Vx32-vsaddu.vx
  - Vx32-vssub.vx
  - Vx32-vssubu.vx
  - Vx64-vsadd.vx
  - Vx64-vsaddu.vx
  - Vx64-vssub.vx
  - Vx64-vssubu.vx
  # vfncvt.x.f.w, vfncvt.xu.f.w and their rtz forms with an 8-bit destination raise an
  # illegal-instruction exception, and vfwcvt.f.x.v from 8-bit integers zero-extends the signed
  # source (-99 converts to +157).
  - Vf8-vfncvt.rtz.x.f.w
  - Vf8-vfncvt.rtz.xu.f.w
  - Vf8-vfncvt.x.f.w
  - Vf8-vfncvt.xu.f.w
  - Vf8-vfwcvt.f.x.v
  # Vf16, Vf32, Vf64 and Zvfhmin: csrr/csrw fflags/fcsr are not ordered after in-flight vector FP
  # instructions (RC rocket/RocketCore.scala:1065). Also: inactive elements set fflags
