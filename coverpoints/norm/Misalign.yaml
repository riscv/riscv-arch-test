# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  - name: lh_op
    # LH loads a 16-bit value from memory, then sign-extends to 32-bits before storing
    # in rd.
    coverpoint: ["Misalign_lh_cg/{cp_misalign}"]
  - name: lhu_op
    # LHU loads a 16-bit value from memory but then zero extends to
    # 32-bits before storing in rd.
    coverpoint: ["Misalign_lhu_cg/{cp_misalign}"]
  - name: lw_op
    # The LW instruction loads a 32-bit value from memory into rd.
    coverpoint: ["Misalign_lw_cg/{cp_misalign}"]
  # The insn:sw[], insn:sh[], and insn:sb[] instructions store 32-bit, 16-bit, and 8-bit
  # values from the low bits of register rs2 to memory.
  - name: sw_sh_sb_op
    coverpoint: ["Misalign_sh_cg/{cp_misalign}", "Misalign_sw_cg/{cp_misalign}"]
  - name: lwu_op
    # The LWU instruction, on the other hand, zero-extends the 32-bit value from
    # memory for RV64I.
    coverpoint: ["Misalign_lwu_cg/{cp_misalign}"]
  - name: ld_op_rv64i
    coverpoint: ["Misalign_ld_cg/{cp_misalign}"]
  - name: sd_sw_sh_sb_op_rv64i
    coverpoint: ["Misalign_sd_cg/{cp_misalign}"]
  # Misalign is the suite that checks that misaligned loads and stores complete and return
  # or write the right bytes. ExceptionsSm maps the same rules to the trapping outcome.
  #
  # Loads and stores whose effective address is not naturally aligned to the
  # referenced datatype (i.e., the effective address is not divisible by the size of
  # the access in bytes) have behavior dependent on the EEI.
  - name: misaligned_ldst_eei_dependent_behavior
    # Representative: every Misalign* covergroup's cp_misalign exercises the same behavior
    coverpoint: ["{Misalign_lw_cg,Misalign_sw_cg}/{cp_misalign}"]
  # misaligned loads and stores can be handled in hardware, or via an invisible trap into
  # the execution environment implementation, or possibly a combination of hardware and
  # invisible trap depending on address.
  - name: misaligned_ldst_hw_support
    # Representative: every Misalign* covergroup's cp_misalign exercises the same behavior
    coverpoint:
      [
        "{Misalign_lw_cg,Misalign_sw_cg,Misalign_ld_cg,Misalign_sd_cg}/{cp_misalign}",
      ]
  # loads and stores that are not naturally aligned may either complete execution
  # successfully or raise an exception.
  - name: misaligned_ldst_exc_type
    # Representative: the completes-successfully branch; every Misalign* covergroup's cp_misalign exercises it
    coverpoint: ["{Misalign_lw_cg,Misalign_sw_cg}/{cp_misalign}"]
