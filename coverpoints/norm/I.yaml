# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  - name: rv32i_xreg_sz
    coverpoint: ["I_add_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  - name: rv32i_rv64i_other_xregs
    coverpoint: ["I_add_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  - name: pcreg_op
    coverpoint: ["I_auipc_cg/{cp_rd, cp_imm_edges_20bit}"]
  # insn:slti[] (set less than immediate) places the value 1 in register rd if register
  # rs1 is less than the sign-extended immediate when both are treated as signed numbers,
  # else 0 is written to rd. insn:sltiu[] is similar but compares the values as unsigned
  # numbers (i.e., the immediate is first sign-extended to XLEN bits then treated as an
  # unsigned number).
  - name: slti_sltiu_op
    coverpoint:
      [
        "I_slti_cg/{cp_rs1, cp_rd_nx0, cr_rs1_imm_edges}",
        "I_sltiu_cg/{cp_rs1, cp_rd_nx0, cr_rs1_imm_edges}",
      ]
  - name: x0eq0
    coverpoint: ["I_add_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  - name: twos_complement_signed_integers
    # Use representative coverpoints; other signed operations apply too
    coverpoint:
      [
        "I_slt_cg/cr_rs1_rs2_edges",
        "I_blt_cg/cr_rs1_rs2_edges_offset",
        "I_sra_cg/cr_rs1_rs2_edges",
      ]
  - name: nop_enc
    coverpoint: ["I_nop_cg/cp_asm_count"]
  - name: nop_op
    coverpoint: ["I_nop_cg/{cp_asm_count}"]
  - name: addi_op
    coverpoint: ["I_addi_cg/{cp_rs1, cp_rd, cr_rs1_imm_edges}"]
  - name: addi_overflow
    coverpoint:
      ["I_addi_cg/cr_rs1_imm_edges.   Cases such as all 1s + all 1s overflow."]
  # insn:andi[], insn:ori[], insn:xori[] are logical operations that perform bitwise AND,
  # OR, and XOR on register rs1 and the sign-extended 12-bit immediate and place the
  # result in rd.
  - name: andi_ori_xori_op
    coverpoint:
      ["{I_andi_cg, I_ori_cg, I_xori_cg}/{cp_rs1, cp_rd, cr_rs1_imm_edges}"]
  - name: slli_op
    coverpoint: ["I_slli_cg/{cp_rs1, cp_rd_nx0, cr_rs1_imm_edges_uimm}"]
  - name: srli_op
    coverpoint: ["I_srli_cg/{cp_rs1, cp_rd_nx0, cr_rs1_imm_edges_uimm}"]
  - name: srai_op
    coverpoint: ["I_srai_cg/{cp_rs1, cp_rd_nx0, cr_rs1_imm_edges_uimm}"]
  - name: lui_op
    coverpoint: ["I_lui_cg/{cp_rd, cp_imm_edges_20bit}"]
  - name: auipc_op
    coverpoint: ["I_auipc_cg/{cp_rd, cp_imm_edges_20bit}"]
  - name: R-type_operands
    # Use representative coverpoints; applies to the other R-type instructions too
    coverpoint: ["I_add_cg/{cp_rs1, cp_rs2, cp_rd, cmp_rd_rs1_rs2}"]
  - name: add_op
    coverpoint: ["I_add_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  - name: sub_op
    coverpoint: ["I_sub_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  # Overflows are ignored and the low XLEN bits of results are written to the destination
  # rd.
  - name: add_sub_overflow
    coverpoint:
      [
        "{I_add_cg, I_sub_cg}/cr_rs1_rs2_edges. Cases such as all 1s + all 1s overflow.",
      ]
  # insn:slt[] and insn:sltu[] perform signed and unsigned compares respectively, writing
  # 1 to rd if rs1 &lt; rs2, 0 otherwise.
  - name: slt_sltu_op
    coverpoint:
      [
        "I_slt_cg/{cp_rs1, cp_rs2, cp_rd_nx0, cr_rs1_rs2_edges}",
        "I_sltu_cg/{cp_rs1, cp_rs2, cp_rd_nx0, cr_rs1_rs2_edges}",
      ]
  # insn:and[], insn:or[], and insn:xor[] perform bitwise logical operations.
  - name: and_or_xor_op
    coverpoint:
      [
        "{I_and_cg, I_or_cg, I_xor_cg}/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}",
      ]
  # insn:sll[], insn:srl[], and insn:sra[] perform logical left, logical right, and
  # arithmetic right shifts on the value in register rs1 by the shift amount held in the
  # lower 5 bits of register rs2.
  - name: sll_srl_sra_op
    coverpoint:
      [
        "{I_sll_cg, I_srl_cg, I_sra_cg}/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}",
      ]
  - name: no_cti_delay_slots
    # Use representative coverpoints; applies to the other branches too
    coverpoint: ["{I_beq_cg, I_jal_cg, I_jalr_cg}/cp_offset"]
  - name: jal_target
    coverpoint: ["I_jal_cg/cp_offset"]
  - name: jal_op
    coverpoint: ["I_jal_cg/{cp_rd}"]
  - name: jalr_target
    coverpoint: ["I_jalr_cg/{cp_imm_edges, cp_offset_lsbs}"]
  - name: jalr_op
    coverpoint: ["I_jalr_cg/{cp_rd}"]
  - name: br_target
    # Use representative coverpoints; applies to the other branches too
    coverpoint: ["{I_beq_cg, I_bne_cg}/{cp_offset, cp_imm_edges_branch}"]
  # insn:beq[] and insn:bne[] take the branch if registers rs1 and rs2 are equal or
  # unequal respectively.
  - name: beq_bne_op
    coverpoint:
      ["{I_beq_cg, I_bne_cg}/{cp_rs1, cp_rs2, cr_rs1_rs2_edges_offset}"]
  # insn:blt[] and insn:bltu[] take the branch if rs1 is less than rs2, using signed and
  # unsigned comparison respectively.
  - name: blt_bltu_op
    coverpoint:
      ["{I_blt_cg, I_bltu_cg}/{cp_rs1, cp_rs2, cr_rs1_rs2_edges_offset}"]
  # insn:bge[] and insn:bgeu[] take the branch if rs1 is greater than or equal to rs2,
  # using signed and unsigned comparison respectively.
  - name: bge_bgeu_op
    coverpoint:
      ["{I_bge_cg, I_bgeu_cg}/{cp_rs1, cp_rs2, cr_rs1_rs2_edges_offset}"]
  - name: ldst_ea
    # Use representative coverpoints; applies to the other loads and stores too
    coverpoint: ["{I_lw_cg, I_sw_cg}/{cp_rs1_nx0, cp_imm_edges}"]
  - name: ldst_no_exc_aligned
    # Use representative coverpoints; applies to the other loads and stores too
    coverpoint:
      [
        "I_lw_cg/cp_align_word",
        "I_lh_cg/cp_align_hword",
        "I_sw_cg/cp_align_word",
        "I_sh_cg/cp_align_hword",
      ]
  - name: load_op
    coverpoint: ["I_lw_cg/{cp_memval_word}"]
  - name: store_op
    coverpoint: ["I_sw_cg/{cp_rs2_edges}"]
  - name: lw_op
    coverpoint: ["I_lw_cg/{cp_rs1_nx0, cp_rd, cp_imm_edges, cp_memval_word}"]
  # insn:lh[] loads a 16-bit value from memory, then sign-extends to 32-bits before
  # storing in rd.
  - name: lh_op
    coverpoint: ["I_lh_cg/{cp_rs1_nx0, cp_rd, cp_imm_edges, cp_memval_hword}"]
  # insn:lhu[] loads a 16-bit value from memory but then zero extends to 32-bits before
  # storing in rd.
  - name: lhu_op
    coverpoint: ["I_lhu_cg/{cp_rs1_nx0, cp_rd, cp_imm_edges, cp_memval_hword}"]
  # insn:lb[] and insn:lbu[] are defined analogously for 8-bit values.
  - name: lb_lbu_op
    coverpoint:
      [
        "I_lb_cg/{cp_rs1_nx0, cp_rd, cp_imm_edges, cp_memval_byte}",
        "I_lbu_cg/{cp_rs1_nx0, cp_rd, cp_imm_edges, cp_memval_byte}",
      ]
  # The insn:sw[], insn:sh[], and insn:sb[] instructions store 32-bit, 16-bit, and 8-bit
  # values from the low bits of register rs2 to memory.
  - name: sw_sh_sb_op
    coverpoint:
      [
        "I_sw_cg/{cp_rs1_nx0, cp_rs2, cp_rs2_edges, cp_imm_edges}",
        "I_sh_cg/{cp_rs1_nx0, cp_rs2, cp_rs2_edges, cp_imm_edges}",
        "I_sb_cg/{cp_rs1_nx0, cp_rs2, cp_rs2_edges, cp_imm_edges}",
      ]
  - name: ldst_atomicity_for_aligned
    # Use representative coverpoints; applies to the other loads and stores too
    coverpoint:
      [
        "{I_lw_cg, I_sw_cg}/cp_align_word",
        "Not tested: atomicity is not observable in single-hart signature tests",
      ]
  - name: fence_op
    coverpoint: ["I_fence_cg/{cp_custom_fence_pred_succ}, ordering not tested"]
  - name: fence-tso_op
    coverpoint: ["I_fence_cg/{cp_custom_fence_reserved}, ordering not tested"]
  - name: fence-tso_ordering_rw_rw_ok
    coverpoint:
      ["I_fence_cg/{cp_custom_fence_reserved}, implementation not tested"]
  - name: fence_unused_flds_rsv
    coverpoint:
      ["I_fence_cg/{cp_custom_fence_reserved, cp_custom_fence_pred_succ}"]
  - name: fence_cons_ok
    coverpoint:
      [
        "I_fence_cg/{cp_custom_fence_reserved, cp_custom_fence_pred_succ}, ordering not tested",
      ]
  # HINTs designated for standard use: cp_rd includes rd = x0. Use representative
  # coverpoints; the other computational instructions with cp_rd apply too.
  - name: hints_enc
    coverpoint:
      [
        "{I_add_cg, I_addi_cg}/cp_rd",
        "I_fence_cg/{cp_custom_fence_pred_succ, cp_custom_fence_reserved}",
      ]
  - name: hints_op
    coverpoint:
      [
        "{I_add_cg, I_addi_cg}/cp_rd",
        "I_fence_cg/{cp_custom_fence_pred_succ, cp_custom_fence_reserved}",
      ]
  # RV64I
  - name: rv64i_xreg_sz
    coverpoint: ["I_addw_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  - name: addiw_op
    coverpoint: ["I_addiw_cg/{cp_rs1, cp_rd, cr_rs1_imm_edges}"]
  - name: addiw_overflow
    coverpoint: ["I_addiw_cg/cr_rs1_imm_edges"]
  # insn:addw[] and insn:subw[] are RV64I-only instructions that are defined analogously
  # to insn:add[] and insn:sub[] but operate on 32-bit values and produce signed 32-bit
  # results.
  - name: addw_subw_op
    coverpoint:
      ["{I_addw_cg, I_subw_cg}/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  # Overflows are ignored, and the low 32-bits of the result is sign-extended to 64-bits
  # and written to the destination register.
  - name: addw_subw_overflow
    coverpoint: ["{I_addw_cg, I_subw_cg}/cr_rs1_rs2_edges"]
  - name: auipc_op_rv64i
    coverpoint: ["I_auipc_cg/{cp_rd, cp_imm_edges_20bit}"]
  # The insn:ld[] instruction loads a 64-bit value from memory into register rd for RV64I.
  - name: ld_op_rv64i
    coverpoint: ["I_ld_cg/{cp_rs1_nx0, cp_rd, cp_imm_edges, cp_memval_double}"]
  # The insn:lw[] instruction loads a 32-bit value from memory and sign-extends this to 64
  # bits before storing it in register rd for RV64I.
  - name: lw_op_rv64i
    coverpoint: ["I_lw_cg/cp_memval_word"]
  # insn:lh[] and insn:lhu[] are defined analogously for 16-bit values, as are insn:lb[]
  # and insn:lbu[] for 8-bit values.
  - name: lh_lhu_lb_lbu_op_rv64i
    coverpoint:
      [
        "I_lb_cg/cp_memval_byte",
        "I_lbu_cg/cp_memval_byte",
        "I_lh_cg/cp_memval_hword",
        "I_lhu_cg/cp_memval_hword",
      ]
  - name: lui_op_rv64i
    coverpoint: ["I_lui_cg/cp_imm_edges_20bit"]
  - name: lwu_op
    coverpoint: ["I_lwu_cg/cp_memval_word"]
  - name: rv64_w_sex
    # Use representative coverpoints; applies to the other *w instructions too
    coverpoint:
      [
        "{I_addw_cg, I_sraw_cg}/cr_rs1_rs2_edges",
        "I_addiw_cg/cr_rs1_imm_edges",
        "I_sraiw_cg/cr_rs1_imm_edges_uimmw",
      ]
  # The insn:sd[], insn:sw[], insn:sh[], and insn:sb[] instructions store 64-bit, 32-bit,
  # 16-bit, and 8-bit values from the low bits of register rs2 to memory respectively.
  - name: sd_sw_sh_sb_op_rv64i
    coverpoint:
      [
        "I_sb_cg/cp_rs2_edges",
        "I_sd_cg/cp_rs2_edges",
        "I_sh_cg/cp_rs2_edges",
        "I_sw_cg/cp_rs2_edges",
      ]
  # In RV64I, only the low 6 bits of rs2 are considered for the shift amount.
  - name: sll_srl_sra_shamt_rv64i
    coverpoint:
      [
        "I_sll_cg/cr_rs1_rs2_edges",
        "I_sra_cg/cr_rs1_rs2_edges",
        "I_srl_cg/cr_rs1_rs2_edges",
      ]
  # insn:slliw[], insn:srliw[], and insn:sraiw[] encodings with imm[5]≠0 are reserved.
  - name: slliw_srliw_sraiw_imm5_rsv
    coverpoint:
      [
        "I_slliw_cg/cp_uimm_5, See also Ssstrict in <<Ssstrict>>",
        "I_sraiw_cg/cp_uimm_5, See also Ssstrict in <<Ssstrict>>",
        "I_srliw_cg/cp_uimm_5, See also Ssstrict in <<Ssstrict>>",
      ]
  # insn:slliw[], insn:srliw[], and insn:sraiw[] are RV64I-only instructions that are
  # analogously defined but operate on 32-bit values and sign-extend their 32-bit results
  # to 64 bits.
  - name: slliw_srliw_sraiw_op
    coverpoint:
      [
        "I_slliw_cg/{cp_rs1, cp_rd_nx0, cp_uimm_5, cr_rs1_imm_edges_uimmw}",
        "I_sraiw_cg/{cp_rs1, cp_rd_nx0, cp_uimm_5, cr_rs1_imm_edges_uimmw}",
        "I_srliw_cg/{cp_rs1, cp_rd_nx0, cp_uimm_5, cr_rs1_imm_edges_uimmw}",
      ]
  # insn:sllw[], insn:srlw[], and insn:sraw[] are RV64I-only instructions that are
  # analogously defined but operate on 32-bit values and sign-extend their 32-bit results
  # to 64 bits. The shift amount is given by rs2[4:0].
  - name: sllw_srlw_sraw_op
    coverpoint:
      [
        "I_sllw_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}",
        "I_sraw_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}",
        "I_srlw_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}",
      ]
