  - name: pmp0_PA_noread_s
    goal: Verify PMP applies to the translated physical address of a load from S-mode
    description: "PMP_NAPOT_SUPPORTED only. S-mode: valid leaf PTE with PTE.U=0 at every page-table level (4 KiB page and each superpage size of the Sv mode); PMP entry 0 removes R from the translated physical page. Load (lw) from the page through va_data."
    expectation: Load access fault (mcause = 5); mtval = faulting virtual address.
    bins: |-
      PTE_d x PageType_d x PMP0_PA x load_acc_fault x read_acc x mode {S-mode}
      = 7 bins on RV64, 2 on RV32
