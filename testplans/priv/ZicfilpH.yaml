# yaml-language-server: $schema=testplan.schema.json
suite: ZicfilpH
source: https://docs.google.com/spreadsheets/d/1ED9ontJZP-Dg2MAF-4mkhqKFgpjf6Fp6yeXKuW61FOY/edit?gid=1715431862#gid=1715431862
coverpoints:
  - heading: "General Test Environment: \n(VS/VU-mode, H-extension)\nsame base environment as ZicfilpU plus H-extension implemented. \nmenvcfg.LPE=1 and henvcfg.LPE=1 unless stated otherwise. \nVU additionally requires senvcfg.LPE=1. \nG-stage translation active (hgatp.MODE != Bare) unless stated otherwise."
  - name: cp_elp_state_preservation_zicflip_vs
    goal: Verify trap in VS-mode saves and restores previous ELP via vsstatus.VSPELP
    description: |-
      Test Environment:
      Execute an indirect branch in VS-mode with rs1 != {x1,x5,x7} to set ELP = LP_EXPECTED.
      Trigger a trap using ECALL. With virtual supervisor delegation enabled, trap is delivered to VS-mode, updating vsstatus.VSPELP with the previous ELP.
    expectation: Trap delivered to VS-mode, vsstatus.VSPELP stores previous ELP value, after executing VSRET, ELP is restored to LP_EXPECTED
    bins: Origin mode (VS-mode) × Trap target (VS-mode) × ELP state
    id: sstatus-spelp_op
    rules:
      - '[norm:sstatus-spelp_op]'
