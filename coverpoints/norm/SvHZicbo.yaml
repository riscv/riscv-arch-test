# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # The Zicbom extension adds the CBIE (Cache Block Invalidate instruction Enable) WARL
  # field to henvcfg. The CBIE field controls execution of the cache block invalidate
  # instruction (CBO.INVAL) in privilege modes VS and VU. The encoding 0b10 is reserved.
  # When the Zicbom extension is not implemented, CBIE is read-only zero.
  - name: henvcfg_cbie
    coverpoint:
      [
        "SvHZicbo_envcfg_cg/{cp_cbie_vs,cp_cbie_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbcfe_vs,cp_cbcfe_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbze_vs,cp_cbze_vu}",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "HSm_mcsr_cg/cp_hcsrwalk_masked",
      ]
  # When V=1, if the CBO.INVAL instruction is not HS-qualified, it raises an
  # illegal-instruction exception. If the instruction is HS-qualified and the CBIE field
  # is set to 0b01 or 0b11, the instruction is enabled for execution; otherwise, it raises
  # a virtual-instruction exception.
  - name: cbo-inval_h_mode_veq1_op
    coverpoint:
      [
        "SvHZicbo_envcfg_cg/{cp_cbie_vs,cp_cbie_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbcfe_vs,cp_cbcfe_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbze_vs,cp_cbze_vu}",
      ]
  # A insn:cbo.inval[] instruction executes or raises either an illegal-instruction
  # exception or a virtual-instruction exception based on the state of the
  # csr:envcfg[cbie] fields:
  - name: cbo-inval
    coverpoint:
      [
        "SvHZicbo_envcfg_cg/{cp_cbie_vs,cp_cbie_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbcfe_vs,cp_cbcfe_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbze_vs,cp_cbze_vu}",
      ]
  # The Zicbom extension adds the CBCFE (Cache Block Clean and Flush instruction Enable)
  # field to henvcfg. When V=1, if the CBO.CLEAN and CBO.FLUSH instructions are not
  # HS-qualified, they raise an illegal-instruction exception. If the instructions are
  # HS-qualified and the CBCFE field is set to 1, the instructions are enabled for
  # execution; otherwise, if the CBCFE field is set to 0, they raise a virtual-instruction
  # exception. When the Zicbom extension is not implemented, CBCFE is read-only zero.
  - name: henvcfg_cbcfe
    coverpoint:
      [
        "SvHZicbo_envcfg_cg/{cp_cbie_vs,cp_cbie_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbcfe_vs,cp_cbcfe_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbze_vs,cp_cbze_vu}",
      ]
  # A insn:cbo.clean[] or insn:cbo.flush[] instruction executes or raises an
  # illegal-instruction or virtual-instruction exception based on the state of the
  # csr:envcfg[cbcfe] bits:
  - name: cbo-clean_cbo-flush
    coverpoint:
      [
        "SvHZicbo_envcfg_cg/{cp_cbie_vs,cp_cbie_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbcfe_vs,cp_cbcfe_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbze_vs,cp_cbze_vu}",
      ]
  # The Zicboz extension adds the CBZE (Cache Block Zero instruction enable) field to
  # henvcfg. The CBZE field applies to execution of the cache block zero instruction
  # (CBO.ZERO) in privilege modes VS and VU, and only when the instruction is
  # HS-qualified. If the instruction is not HS-qualified, it raises an illegal-instruction
  # exception. If the instruction is HS-qualified and the CBZE field is set to 1, the
  # instruction is enabled for execution; otherwise, if the CBZE field is set to 0, it
  # raises a virtual-instruction exception. When the Zicboz extension is not implemented,
  # CBZE is read-only zero.
  - name: henvcfg_cbze
    coverpoint:
      [
        "SvHZicbo_envcfg_cg/{cp_cbie_vs,cp_cbie_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbcfe_vs,cp_cbcfe_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbze_vs,cp_cbze_vu}",
      ]
  # Finally, a insn:cbo.zero[] instruction executes or raises an illegal-instruction or
  # virtual-instruction exception based on the state of the csr:envcfg[cbze] bits:
  - name: cbo-zero_basedon_xenvcfg_cbze
    coverpoint:
      [
        "SvHZicbo_envcfg_cg/{cp_cbie_vs,cp_cbie_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbcfe_vs,cp_cbcfe_vu}",
        "SvHZicbo_envcfg_cg/{cp_cbze_vs,cp_cbze_vu}",
      ]

  # CBO permission and faults under two-stage translation
  - names:
      [
        cbm_access,
        cbm_unperm_fault,
        cbz_access,
        cbz_unperm_fault,
        H_vm_twostage,
      ]
    coverpoint: ["SvHZicbo_cg/{cp_vs_pte,cp_vs_gpa,cp_g_pte}"]

  # With ADUE = 0, a clear A bit, or a clear D bit for cbo.zero, raises a fault in either stage
  - names:
      [
        cbm_unperm_translate,
        cbz_unperm_translate,
        Svadu_disabled_hw_update_falls_back_to_Svade,
      ]
    coverpoint: ["SvHZicbo_cg/{cp_vs_pte,cp_g_pte}"]

  # vsstatus.SUM lets VS-mode CBOs reach user pages; G-stage accesses are user accesses
  - names: [sstatus_sum, H_vm_gpapriv]
    coverpoint: ["SvHZicbo_cg/{cp_vs_sum,cp_g_pte}"]

  # Guest-page faults write mtval2, with a pseudoinstruction in mtinst for implicit VS-stage accesses
  - names:
      [
        mtval2_trapval,
        mtval2_trapval_vstrans,
        H_trap_xtinst_guestpage,
        fault_excep_csr,
      ]
    coverpoint: ["SvHZicbo_cg/{cp_vs_gpa,cp_vs_gpa_implicit,cp_g_pte}"]

  # PMA and PMP apply to the supervisor physical address
  - names: [pma_chk_paddr, H_pmp]
    coverpoint: ["SvHZicbo_cg/{cp_vs_gpa,cp_g_pa,cp_pmp}"]

  # If CBO.INVAL is enabled in HS-mode to perform a flush operation, then when the
  # instruction is enabled in VS- or VU-mode it performs a flush operation, even if CBIE
  # is set to 0b11. Otherwise, when the instruction is enabled for execution, its behavior
  # depends on the CBIE encoding, as follows:
  - name: cbo-inval_h_mode_enabled_op
    coverpoint:
      [
        "Not tested: TODO store to a block, execute cbo.inval in VS-mode and VU-mode with menvcfg.CBIE or henvcfg.CBIE = 01, and check that a load returns the stored data",
      ]
  - name: cbo-inval_h_mode_flush_enc
    coverpoint:
      [
        "Not tested: TODO store to a block, execute cbo.inval in VS-mode and VU-mode with menvcfg.CBIE or henvcfg.CBIE = 01, and check that a load returns the stored data",
      ]
  - name: cbo-inval_h_mode_inval_enc
    coverpoint:
      [
        "Not tested: TODO store to a block, execute cbo.inval in VS-mode and VU-mode with menvcfg.CBIE or henvcfg.CBIE = 01, and check that a load returns the stored data",
      ]
