name: autofix.ci

on:
  pull_request:

# Only run on the latest commit if a PR is updated
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    name: Update generated tests and coverpoints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4

      - name: Regenerate tests and coverpoints
        run: make clean-tests tests

      - name: Apply fixes
        uses: autofix-ci/action@7a166d7532b277f34e16238930461bf77f9d7ed8
