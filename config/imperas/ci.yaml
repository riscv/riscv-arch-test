# CI configuration for Imperas simulator
# Imperas is proprietary and cannot run in public CI.

# These exclusions don't affect CI because it doesn't run, but they help tracking incomplete features
# - SsstrictSm/S/U: on the vector configs, Imperas does not enforce the vector register-group
#   overlap constraints, so it executes reserved widening encodings such as
#   vwmaccu.vv v14, v9, v15, v0.t instead of raising an illegal instruction:
#   https://solvnetplus.synopsys.com/s/case/500WQ0000230O4P/imperas-treats-vwmaccuvv-v14-v9-v15-v0t-as-legal
#   SsstrictSm additionally trips on hcontext (0x6a8) on rv64-max, which Imperas implements
#   and Sail does not. The rv32 configs pass SsstrictS/U entirely, and rv32gck passes all three.
# - InterruptsSm/S now pass: Imperas implements neither machine nor supervisor external
#   interrupts (https://github.com/riscv/sail-riscv/issues/1836), and both are handled without
#   an exclusion -- MEI through UDB_MEI_INTR_IMPL staying clear because rvmodel_macros.h defines
#   no RVMODEL_SET_MEXT_INT, and SEI through the env falling back to mip.SEIP
# - Smstateen: Sail does not implement all state yet to match; also, Imperas lets mstateen0.P1P13
#   be written on RV64: https://solvnetplus.synopsys.com/s/case/500WQ0000289tyxYAA/mstateen0p1p13-should-be-readonly-zero-on-rv64
# - ExceptionsVx: https://solvnetplus.synopsys.com/s/case/500WQ000023l1CPYAY/vmvnrrv-does-not-raise-an-illegalinstruction-exception-when-vtypevill-1
# - Sdtrig*: Sail does not implement Sdtrig yet (https://github.com/riscv/sail-riscv/issues/222)
# - PMPH: hlvx.hu/wu to a PMP region with R but not X succeeds (PMP must grant R and X), and a
#   PMP-denied page-table read by hlvx raises an instruction access fault instead of a load access fault
# - SvH: hlvx with hstatus.SPVP = 1 and vsstatus.SUM = 1 faults on a VS-stage U = 1 page (SUM applies
#   to HLVX as to any guest load: https://github.com/riscv/riscv-isa-manual/issues/1480); with
#   henvcfg.ADUE = 1 a fetch through a VS leaf with A = 0 whose table is G-mapped read-only completes
#   instead of raising an instruction guest-page fault
# - SvHZicbo: a guest-page fault on an implicit VS-stage page-table read writes the table base to
#   mtval2 instead of the faulting guest physical address of the PTE
# - InterruptsH, SstcH, SstcHSm: csrrc/csrrs/csrrw return 0 in the old value for the delegated
#   read-only vsip.STIP/SEIP bits (csrr reads them correctly)
#
ci_enabled: false
exclude_extensions: "SsstrictSm,SsstrictS,SsstrictU,SsstrictV,Smstateen,ExceptionsVx,SdtrigSm,SdtrigS,SdtrigU,PMPH,SvH,SvHZicbo,InterruptsH,SstcH,SstcHSm"
