  - heading: It should be understood that for most coverpoints that are based on arithmetic instructions, the coverpoints will check to make sure they're non-trivial, meaning that vl != 0, vstart=0, vill=0, and they do not trap. It may be useful to know that when using vsetvl{i} instructions if rd != x0 and rs1 = x0, vl = vlmax
  - name: cp_vectorfp_vsstatus_fs_state_affecting_register
    goal: Confirm vector floating point instructions set vsstatus.FS to dirty when modifying floating point register state
    description: Set vsstatus.FS = {initial/clean} and run a fd writing instruction
    expectation: vsstatus.FS is set to dirty
    bins: "1"
    notes: "spec: Any vector floating-point instruction that modifies any floating-point extension state (i.e., floating-point CSRs or f registers) must set mstatus.FS to Dirty."
  - name: cp_vectorfp_vsstatus_fs_state_affecting_csr
    goal: Confirm vector floating point instructions set vsstatus.FS to dirty when modifying floating point csr state
    description: Set vsstatus.FS = {initial/clean} and run an instruction that would raise a fp flag after clearing the fp flags (vfdiv.vv divide by zero, vfadd.vv inf + -inf, and vmflt.vv with a NaN operand, which writes only a mask register)
    expectation: vsstatus.FS is set to dirty
    bins: "1"
    notes: "spec: Any vector floating-point instruction that modifies any floating-point extension state (i.e., floating-point CSRs or f registers) must set mstatus.FS to Dirty."
  - name: cp_vectorfp_vsstatus_fs_state_nonaffecting
    goal: Confirm vector floating point instructions properly set vsstatus.FS when not modifying floating point state
    description: Set vsstatus.FS = {initial/clean} and run a vector fp instruction that does not affect floating point state (chosen situation for coverpoint is a .vv ins where vs1 = vs2 = 0)
    expectation: vsstatus.FS may be set to dirty or not depending on implementation
    bins: "1"
    notes: "spec: Any vector floating-point instruction that modifies any floating-point extension state (i.e., floating-point CSRs or f registers) must set mstatus.FS to Dirty."
  - name: cp_vectorfp_vsstatus_fs_off
    goal: Confirm that vector floating point instructions (even if they dont modify fp state) raise an illegal instruction exception if vsstatus.FS is set to off
    description: Set vsstatus.FS = {off} and run a vector fp instruction that does not affect floating point state  (chosen situation for coverpoint is a .vv ins where vs1 = vs2 = 0)
    expectation: illegal instruction exception
    bins: "1"
    notes: "spec: If the floating-point unit status field mstatus.FS is Off then any attempt to execute a vector floating-point instruction will raise an illegal instruction exception."
