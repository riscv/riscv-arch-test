# yaml-language-server: $schema=testplan.schema.json
suite: PMP_Sv
source: https://docs.google.com/spreadsheets/d/1LGwD2e01j4SN9tg85nt6gPwpp7nXyXMF7hqbw3jvXko/edit?gid=2063348244#gid=2063348244
coverpoints:
  - heading: "General Test Environment (PMP_Sv):\n- Boots to M-mode (legacy mode hops) because each test programs PMP entries, which are M-mode CSRs. Unchanged by the T-SBI conversion. Run for every supported translation mode: Sv32 on RV32; Sv39, Sv48 and Sv57 on RV64, as selected by the UDB configuration."
  - name: mode
    goal: Verify each supported translation mode is exercised with PMP
    description: Sampled while the PMP_Sv tests run under satp.MODE = Sv32, Sv39, Sv48 or Sv57.
    expectation: Every supported mode is observed.
    bins: |-
      mode {sv57, sv48, sv39, sv32}
      = 3 bins on RV64, 1 on RV32
  - name: pmp0_pte_noread_s
    goal: Verify PMP applies to the implicit page-table read of a load from S-mode
    description: "PMP_NAPOT_SUPPORTED only. S-mode: PMP entry 0 (NAPOT) covers the page table used by the walk, at each level, with R=0; the background PMP region allows everything else. Load (lw) from the page through va_data."
    expectation: Load access fault (mcause = 5); mtval = faulting virtual address.
    bins: |-
      PageType_d x PMP0_PTE x load_acc_fault x lw x mode {S-mode}
      = 7 bins on RV64, 2 on RV32
    id: pmp_check_pagetable_access pmp_with_paging pmp_sfence_required
    rules:
      - pmp_check_pagetable_access
      - pmp_with_paging
      - pmp_sfence_required
  - name: pmp_tor_pte_noread_s
    goal: "Verify PMP applies to the implicit page-table read of a load from S-mode (TOR region)"
    description: "PMP_TOR_SUPPORTED only. TOR twin of pmp0_pte_noread_s: the same probes over the same bytes, bounded by a TOR entry i (pmpaddr[i-1] = base, pmpaddr[i] = top) instead of a NAPOT entry. Entry 1 is the TOR region (L=0); entry 0 is OFF and holds its base."
    expectation: "Load access fault (mcause = 5); mtval = faulting virtual address."
    bins: "PageType_d x PMP0_PTE x load_acc_fault x lw x mode {S-mode}\n= 7 bins on RV64, 2 on RV32"
    rules:
      - pmp_check_pagetable_access
      - pmp_with_paging
      - pmp_sfence_required
      - pmp_a_field_tor
  - name: pmp0_pte_noread_u
    goal: Verify PMP applies to the implicit page-table read of a load from U-mode
    description: "PMP_NAPOT_SUPPORTED only. U-mode: PMP entry 0 (NAPOT) covers the page table used by the walk, at each level, with R=0; the background PMP region allows everything else. Load (lw) from the page through va_data."
    expectation: Load access fault (mcause = 5); mtval = faulting virtual address.
    bins: |-
      PageType_d x PMP0_PTE x load_acc_fault x lw x mode {U-mode}
      = 7 bins on RV64, 2 on RV32
    id: pmp_check_pagetable_access pmp_with_paging pmp_sfence_required
    rules:
      - pmp_check_pagetable_access
      - pmp_with_paging
      - pmp_sfence_required
  - name: pmp_tor_pte_noread_u
    goal: "Verify PMP applies to the implicit page-table read of a load from U-mode (TOR region)"
