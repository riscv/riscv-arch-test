# yaml-language-server: $schema=testplan.schema.json
suite: Ziccamoc
description: Ziccamoc requires main memory regions with the coherence and cacheability PMAs to provide AMOCASQ-level PMA support, which includes AMOArithmetic-level support and the compare-and-swap AMOs.
notes: These tests run on a single hart, so they cannot check atomicity, which is only observable when another hart or agent accesses the same memory concurrently. They show basic functionality of the extension and are largely redundant with the Zaamo, Zabha and Zacas suites.
coverpoints:
  - name: cp_ziccamoc
    goal: AMOCASQ-level AMOs on main memory
    description: Every AMO of cp_ziccamoa, plus amocas.w, amocas.d, amocas.q (RV64) and amocas.b/amocas.h (Zabha), each run once on scratch, with the compare value equal to memory so the swap happens
    expectation: The AMO returns the old memory value and leaves the expected result in memory
    bins: "11 (RV32), 21 (RV64), +20 with Zabha"
