  # This register provides access to the trigger selected by tselect.
  - name: Sdtrig_icount
    coverpoint: ["SdtrigSm_sdtrig_cg/cp_sdtrig_csr_access_common"]

  # The reset values listed here apply to every underlying trigger.
  - name: Sdtrig_icount_reset
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # This register is accessible as tdata1 when type is 3.
  - name: Sdtrig_icount_access
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_instr"]

  # An instruction retires after having been fetched in a privilege mode where the
  # trigger is enabled. This explicitly includes all RET instructions from various
  # modes.
  - name: Sdtrig_icount_match1
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_instr"]

  # A trap is taken from a privilege mode where the trigger is enabled. This
  # explicitly includes traps taken due to interrupts.
  - name: Sdtrig_icount_match2
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_trap"]

  # If more than one of the above events occur during a single instruction
  # execution, the trigger still only matches once for that instruction.
  - name: Sdtrig_icount_multiple_match
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_trap"]

  # For use in single step, icount must match for traps where the instruction will
  # not be reexecuted after the handler, such as illegal instructions that are
  # emulated by privileged software and the instruction being emulated never
  # retires.
  - name: Sdtrig_icount_match_non_reexecuted
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_trap"]

  # the rule is simply that all traps match.
  - name: Sdtrig_icount_all_traps_match
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_trap"]

  # When count is greater than 1 and the trigger matches, then count is decremented
  # by 1.
  - name: Sdtrig_icount_match_gt1
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_instr"]

  # When count is 1 and the trigger matches, then pending becomes set. In addition
  # count will become 0 unless it is hard-wired to 1.
  - name: Sdtrig_icount_match_eq1
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_hardwired"]

  # The only exception to the above is when the instruction the trigger matched on
  # is a write to the icount trigger. In that case pending might or might not become
  # set if count was 1. Afterwards count contains the newly written value.
  - name: Sdtrig_icount_exception
    coverpoint: ["WARL write-any-read-legal behavior not separately tested"]

  # When count is 0 it stays at 0 until explicitly written.
  - name: Sdtrig_icount_count_zero
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_eq0"]

  # When pending is set, the trigger fires just before any further instructions are
  # executed in a mode where the trigger is enabled. As the trigger fires, pending
  # is cleared. In addition, if count is hard-wired to 1 then m, s, u, vs, and vu
  # are all cleared.
  - name: Sdtrig_icount_pending
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_instr"]

  # If the trigger fires with action=0 then zero is written to the tval CSR on the
  # breakpoint trap.
  - name: Sdtrig_icount_action0
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_instr"]

  # The intent of pending is to cleanly handle the case where action is 0, m is 0, u
  # is 1, count is 1, and the U-mode instruction being executed causes a trap into
  # M-mode. In that case we want the entire M-mode handler to be executed, and the
  # debug trap to be taken before the next U-mode instruction.
  - name: Sdtrig_icount_case
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # If textra32 or textra64 are implemented for this trigger, it only matches when
  # the conditions set there are satisfied.
  - name: Sdtrig_icount_textra
    coverpoint:
      [
        "SdtrigSm_textra_cg/cp_sdtrig_textra_mcontext",
        "SdtrigSm_textra_cg/cp_sdtrig_textra_scontext",
      ]

  # When set, enable this trigger in VS-mode. This bit is hard-wired to 0 if the
  # hart does not support virtualization mode.
  - name: Sdtrig_icount_vs
    coverpoint: ["Hypervisor extension not implemented, so not testable"]

  # When set, enable this trigger in VU-mode. This bit is hard-wired to 0 if the
  # hart does not support virtualization mode.
  - name: Sdtrig_icount_vu
    coverpoint: ["Hypervisor extension not implemented, so not testable"]

  # If this bit is implemented, the hardware sets it when this trigger fires. The
