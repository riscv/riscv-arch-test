# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # Attempting to execute a load instruction that accesses a physical address within a
  # PMP region without read permissions raises a load access-fault exception.
  # Attempting to execute a load or load-reserved instruction that accesses a physical
  # address within a PMP region without read permissions raises a load access-fault
  # exception.
  # Attempting to execute a load or load-reserved instruction that accesses a physical address
  # within a PMP region without read permissions raises a load access-fault exception.
  - name: pmp_load_fault
    # Representative coverpoints; also PMP_Sm_cg/cp_cfg_Rw*_all and PMP_Sm_cg/cp_cfg_A_*_r
    coverpoint:
      [
        "PMP_F_cg/cp_cfg_R",
        "PMP_S_cg/{cp_cfg_R, cp_mprv_lw}",
        "PMP_Sm_cg/cp_cfg_R",
        "PMP_Zalrsc_cg/cp_cfg_RW",
        "PMP_F_cg/cp_cfg_R",
        "PMP_Zca_cg/cp_cfg_R",
        "PMP_U_cg/{cp_cfg_R, cp_mprv_lw}",
        "PMP_Zalrsc_cg/cp_cfg_RW",
        "PMP_Zca_cg/cp_cfg_R",
      ]

  # Attempting to execute a store instruction which accesses a physical address within
  # a PMP region without write permissions raises a store access-fault exception.
  # Attempting to execute a store, store-conditional, AMO, or cache-block zero
  # instruction which accesses a physical address within a PMP region without write
  # permissions raises a store access-fault exception.
  - name: pmp_store_fault
    # Representative coverpoints; also PMP_Sm_cg/cp_cfg_rW*_all and cp_cfg_W in PMP_F_cg and PMP_Zca_cg
    coverpoint:
      [
        "PMP_F_cg/cp_cfg_W",
        "PMP_S_cg/{cp_cfg_W, cp_mprv_sw}",
        "PMP_Sm_cg/cp_cfg_W",
        "PMP_Zalrsc_cg/cp_cfg_RW",
        "PMP_Zaamo_cg/cp_cfg_RW",
        "PMP_Zicbo_cg/cp_cbo_zero",
        "PMP_U_cg/{cp_cfg_W, cp_mprv_sw}",
        "PMP_Zaamo_cg/cp_cfg_RW",
        "PMP_Zalrsc_cg/cp_cfg_RW",
        "PMP_Zca_cg/cp_cfg_W",
        "PMP_Zicbo_cg/cp_cbo_zero",
      ]

  # When the L bit is set, the R/W/X permissions are enforced for all privilege modes.
  # When the L bit is clear, any M-mode access matching the PMP entry will succeed;
  # the R/W/X permissions apply only to S and U modes.
  # In addition to locking the PMP entry, the L bit indicates whether the R, W/X
  # permissions are additionally enforced on M-mode accesses. When the L bit is set,
  # these permissions are enforced for all privilege modes. When the L bit is clear,
  # any M-mode access matching the PMP entry will succeed; the R/W/X permissions
  # apply only to S and U modes.
  - name: pmp_l_bit_m_mode_enforcement
    # M-mode FP loads and stores to locked entries
    # cp_mprv_* covers M-mode accesses with MPRV = 0 and 1 to unlocked entries
    # Representative coverpoints; also cp_cfg_X1_all and cp_cfg_{Rw,rW}{00,10,11}_all
    # cp_mprv_* covers M-mode accesses with MPRV = 0 and 1 to unlocked entries
    coverpoint:
      [
        "PMP_F_cg/{cp_cfg_R, cp_cfg_W}",
        "PMP_S_cg/{cp_cfg_X, cp_mprv_lw, cp_mprv_sw}",
        "PMP_Sm_cg/{cp_cfg_X0_all, cp_cfg_L_access_exec, cp_cfg_L_access_read, cp_cfg_L_access_write}",
        "PMP_U_cg/{cp_cfg_X, cp_mprv_lw, cp_mprv_sw}",
        "PMP_Zaamo_cg/cp_cfg_RW",
      ]

  # PMP checks are applied to all accesses whose effective privilege mode is S or U,
  # including instruction fetches and data accesses in S and U mode, and data
  # accesses in M-mode when the MPRV bit in mstatus is set and the MPP field in
  # mstatus contains S or U.
  - name: pmp_check_priv_modes
    # Representative coverpoints; also cp_cfg_A_* and cp_mprv_jalr
    # Representative coverpoints; also cp_cfg_A_* and cp_mprv_jalr
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_X, cp_cfg_R, cp_mprv_lw, cp_mprv_sw}",
        "PMP_U_cg/{cp_cfg_X, cp_cfg_R, cp_mprv_lw, cp_mprv_sw}",
      ]

  # PMP CSRs are only accessible to M-mode.
  - name: pmp_csr_mode
    coverpoint:
      [
        "PMP_S_cg/{cp_pmpaddr_access_s, cp_pmpcfg_access_s}",
        "PMP_U_cg/{cp_pmpaddr_access_u, cp_pmpcfg_access_u}",
      ]

  # The PMP address registers are CSRs named pmpaddr0-pmpaddr63.
  - name: pmp_addr_registers
    coverpoint:
      [
        "PMP_S_cg/cp_pmpaddr_access_s",
        "PMP_Sm_cg/{cp_pmpaddr_upper_zero, cp_grain_check_write}",
        "PMP_U_cg/cp_pmpaddr_access_u",
      ]

  # If a PMP entry matches all bytes of a memory operation, then the L, R, W, and X
  # bits determine whether the operation succeeds or fails. If the L bit is set or the
  # privilege mode of the access is S or U, then the operation succeeds only if the R,
  # W, or X bit corresponding to the access type is set.
  # bits determine whether the operation succeeds or fails. If the L bit is clear
  # and the privilege mode of the access is M, the operation succeeds. Otherwise, if
  # the L bit is set or the privilege mode of the access is S or U, then the
  # operation succeeds only if the R, W, or X bit corresponding to the access type
  # is set.
  - name: pmp_rwx_check
    # S-mode accesses with L = 0 and L = 1
    # Representative coverpoints; also cp_cfg_X*_all, cp_cfg_{Rw,rW}*_all and cp_cfg_L_access_*
    # U-mode accesses with L = 0 and L = 1
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W}",
        "PMP_Sm_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_L_access_read}",
        "PMP_U_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W}",
      ]

  # If a PMP entry matches all bytes of a memory operation, then the L, R, W, and X
  # bits determine whether the operation succeeds or fails. If the L bit is set or the
  # privilege mode of the access is S or U, then the operation succeeds only if the R,
  # W, or X bit corresponding to the access type is set.
  # &lt;&lt;pmpcfg&gt;&gt; shows the layout of a PMP configuration register. The R,
  # W, and X bits, when set, indicate that the PMP entry permits read, write, and
  # instruction execution, respectively. When one of these bits is clear, the
  # corresponding access type is denied.
  # The R, W, and X bits, when set, indicate that the PMP entry permits read, write,
  # and instruction execution, respectively. When one of these bits is clear, the
  - name: pmp_cfg_permissions
    # S-mode accesses with L = 0 and L = 1
    # Representative coverpoints; also cp_cfg_X0_all and cp_cfg_{Rw,rW}{00,10,11}_all
    # U-mode accesses with L = 0 and L = 1
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W}",
        "PMP_Sm_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_X1_all}",
        "PMP_U_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W}",
        "PMP_Zca_cg/{cp_cfg_R, cp_cfg_W}",
      ]

  # Failed memory operations generate an instruction, load, or store access-fault
  # exception.
  - name: pmp_access_fault_exception
    # Representative coverpoints; also cp_cfg_X0_all, cp_cfg_A_{napot,tor,na4}_* and cp_priority_*
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W}",
        "PMP_Sm_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_A_napot_all}",
        "PMP_U_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W}",
      ]

  # Attempting to fetch an instruction from a PMP region that does not have execute
  # permissions raises an instruction access-fault exception.
  - name: pmp_exec_fault
    # Representative coverpoints; also cp_cfg_A_na4_x and cp_priority_jalr
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_X, cp_mprv_jalr}",
        "PMP_Sm_cg/{cp_cfg_X, cp_cfg_X0_all, cp_cfg_A_napot_x, cp_cfg_A_tor_x}",
        "PMP_U_cg/{cp_cfg_X, cp_mprv_jalr}",
        "PMP_Zca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4}",
      ]

  # When A=0, this PMP entry is disabled and matches no addresses.
  - name: pmp_a_field_off
    # Representative coverpoints; also cp_priority_off_{sw,jalr} and PMP_Zca_cg/cp_misaligned_off
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_A_off_jalr, cp_cfg_A_off_lw, cp_cfg_A_off_sw}",
        "PMP_Sm_cg/{cp_cfg_A_OFF_all_read, cp_cfg_A_OFF_all_write, cp_cfg_A_OFF_all_exec, cp_priority_off_lw}",
        "PMP_U_cg/{cp_cfg_A_off_jalr, cp_cfg_A_off_lw, cp_cfg_A_off_sw}",
        "PMP_Zca_cg/cp_misaligned_off",
      ]

  # The A field encodes the address-matching mode: TOR, NA4, and NAPOT.
  # If TOR is selected, the associated address register forms the top of the address
  # range, and the preceding PMP address register forms the bottom of the address
  # range. If PMP entry i's A field is set to TOR, the entry matches any address y
  # such that pmpaddr~i-1~{le}y&lt;pmpaddr~i~ (irrespective of the value of
  # pmpcfg~i-1~). If PMP entry 0's A field is set to TOR, zero is used for the lower
  # bound, and so it matches any address y&lt;pmpaddr~0~.
  - name: pmp_a_field_tor
    # Representative coverpoints; also the _jalr and _sw variants
    # Representative coverpoints; also cp_cfg_A_tor_all* and the other cp_cfg_A_tor* coverpoints
    # Representative coverpoints; also the _jalr and _sw variants
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_A_tor_lw, cp_cfg_A_na4_lw, cp_cfg_A_napot_lw}",
        "PMP_Sm_cg/{cp_cfg_A_tor_r, cp_cfg_A_tor0_r, cp_cfg_A_tor_bot_L1_r, cp_cfg_A_tor_nonoverlap2_r}",
        "PMP_U_cg/{cp_cfg_A_tor_lw, cp_cfg_A_na4_lw, cp_cfg_A_napot_lw}",
      ]

  # The A field encodes the address-matching mode: TOR, NA4, and NAPOT.
  # naturally aligned power-of-2 regions (NAPOT), including the special case of
  # naturally aligned four-byte regions (NA4);
  - name: pmp_a_field_napot_na4
    # Representative coverpoints; also the _jalr and _sw variants
    # Representative coverpoints; also cp_cfg_A_napot_{x,w} and cp_cfg_A_na4_{x,w}
    # Representative coverpoints; also the _jalr and _sw variants
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_A_tor_lw, cp_cfg_A_na4_lw, cp_cfg_A_napot_lw}",
        "PMP_Sm_cg/{cp_cfg_A_napot_all, cp_cfg_A_napot_r, cp_cfg_A_NA4_all, cp_cfg_A_na4_r}",
        "PMP_U_cg/{cp_cfg_A_tor_lw, cp_cfg_A_na4_lw, cp_cfg_A_napot_lw}",
      ]

  # The L bit indicates that the PMP entry is locked, i.e., writes to the
  # configuration register and associated address registers are ignored.
  - name: pmp_l_bit_function
    coverpoint: ["PMP_Sm_cg/cp_cfg_L_modify"]

  # Optionally, PMP checks may additionally apply to M-mode accesses, in which case the PMP
  # registers themselves are locked, so that even M-mode software cannot change them until the hart
  # is reset.
  - name: pmp_mmode_locking
    coverpoint: ["PMP_Sm_cg/{cp_cfg_L_modify, cp_cfg_X, cp_cfg_R, cp_cfg_W}"]

  # If PMP entry i is locked, writes to pmpicfg and pmpaddri are ignored.
  # Additionally, if PMP entry i is locked and pmpicfg.A is set to TOR, writes to
  # pmpaddri-1 are ignored.
  - name: pmp_l_bit_write_protection
    coverpoint: ["PMP_Sm_cg/cp_cfg_L_modify"]

  # Locked PMP entries remain locked until the hart is reset.
  - name: pmp_locked_until_reset
    coverpoint: ["PMP_Sm_cg/cp_cfg_L_modify"]

  # When G {ge} 1, the NA4 mode is not selectable.
  - name: pmp_na4_select_restriction
    coverpoint: ["PMP_Sm_cg/{cp_cfg_A_all_even, cp_cfg_A_all_odd}"]

  # The A field in a PMP entry's configuration register encodes the address-matching
  # mode of the associated PMP address register. The encoding of this field is shown
  # in &lt;&lt;pmpcfg-a&gt;&gt;.
  - name: pmp_a_field_encoding
    # Representative coverpoints; also cp_cfg_A_all_odd, cp_cfg_A_OFF_all_*, cp_cfg_A_NA4_all
    coverpoint:
      [
        "PMP_Sm_cg/{cp_cfg_A_all_even, cp_cfg_A_OFF_all_read, cp_cfg_A_napot_all, cp_cfg_A_tor_r}",
      ]

  # NAPOT ranges make use of the low-order bits of the associated address register
  # to encode the size of the range, as shown in &lt;&lt;pmpcfg-napot&gt;&gt;.
  - name: pmp_napot_encoding_low_bits
    # Representative coverpoints; also cp_priority_{lw,sw,jalr}, which use seven NAPOT sizes
    coverpoint:
      [
        "PMP_Sm_cg/{cp_cfg_A_napot_all, cp_cfg_A_napot_x, cp_cfg_A_napot_r, cp_cfg_A_napot_w}",
      ]

  # PMP entries are statically prioritized. The lowest-numbered PMP entry that
  # matches any byte of a memory operation determines whether that operation
  # succeeds or fails.
  - name: pmp_entry_priority
    # Representative coverpoints; also cp_priority_* and PMP_Zca_cg/cp_misaligned_{tor,na4}
    coverpoint:
      [
        "PMP_Sm_cg/{cp_priority_lw, cp_priority_sw, cp_priority_off_lw}",
        "PMP_Zca_cg/cp_misaligned_napot",
        "PMP_Zca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4}",
      ]

  # When G {ge} 2 and pmpcfg~i~.A[1] is set, i.e. the mode is NAPOT, then bits
  # pmpaddr~i~[G-2:0] read as all ones.
  - name: pmp_napot_addr_read_mask
    coverpoint: ["PMP_Sm_cg/{cp_grain_OFF_to_NAPOT, cp_grain_NAPOT_to_NAPOT}"]

  # When G {ge} 1 and pmpcfg~i~.A[1] is clear, i.e. the mode is OFF or TOR, then
  # bits pmpaddr~i~[G-1:0] read as all zeros. Bits pmpaddr~i~[G-1:0] do not affect
  # the TOR address-matching logic.
  - name: pmp_tor_off_addr_read_mask
    coverpoint:
      [
        "PMP_Sm_cg/{cp_grain_OFF_to_OFF, cp_grain_OFF_to_TOR, cp_grain_NAPOT_to_OFF, cp_grain_NAPOT_to_TOR}",
      ]

  # The granularity of PMP access control settings are platform-specific, but the standard PMP
  # encoding supports regions as small as four bytes.
  - name: pmp_granularity
    coverpoint:
      [
        "PMP_Sm_cg/{cp_grain_check_write, cp_grain_check_read, cp_cfg_A_NA4_all}",
      ]

  # Although the PMP mechanism supports regions as small as four bytes, platforms
  # may specify coarser PMP regions. In general, the PMP grain is 2^G+2^ bytes and
  # must be the same across all PMP regions.
  - name: pmp_region_granularity_g
    coverpoint: ["PMP_Sm_cg/{cp_grain_check_write, cp_grain_check_read}"]

  # Certain regions' privileges can be hardwired—for example, some regions might only ever be
  # visible in machine mode but in no lower-privilege layers.
  - name: pmp_mmode_only_regions
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # Not all physical address bits may be implemented, and so the pmpaddr registers
  # are WARL.
  - name: pmp_addr_warl
    coverpoint: ["PMP_Sm_cg/{cp_pmpaddr_upper_zero, cp_grain_check_write}"]

  # All PMP CSR fields are WARL and may be read-only zero.
  - name: pmp_csrs_warl_access
    # Representative coverpoints; also cp_pmpcfg_walk_odd, cp_pmpcfg_zero and cp_grain*
    coverpoint:
      [
        "PMP_Sm_cg/{cp_pmpcfg_walk, cp_cfg_A_all_even, cp_grain_check_write, cp_pmpaddr_upper_zero}",
      ]

  # Each PMP address register encodes bits 33-2 of a 34-bit physical address for RV32. For RV64,
  # each PMP address register encodes bits 55-2 of a 56-bit physical address.
  - name: pmp_addr_encoding
    coverpoint:
      ["PMP_Sm_cg/{cp_pmpaddr_upper_zero, cp_cfg_A_tor_r, cp_cfg_A_napot_r}"]

  # For RV32, sixteen CSRs, pmpcfg0–pmpcfg15, hold the configurations pmp0cfg–pmp63cfg for the 64
  # PMP entries.
  - name: pmp_cfg_rv32_layout
    # Representative coverpoints; also cp_cfg_A_all_*, the other cp_cfg_A_tor_all* and cp_pmp64_*
    coverpoint:
      [
        "PMP_Sm_cg/{cp_pmpcfg_walk, cp_pmpcfg_walk_odd, cp_cfg_A_tor_all3, cp_cfg_A_tor_all4}",
      ]

  # For RV64, eight even-numbered CSRs, pmpcfg0, pmpcfg2, …, pmpcfg14, hold the
  # configurations for the 64 PMP entries, as shown in &lt;&lt;pmpcfg-rv64&gt;&gt;.
  - name: pmp_cfg_rv64_layout
    # Representative coverpoints; also cp_cfg_A_all_even, other cp_cfg_A_tor_all*, cp_pmp64_write
    coverpoint:
      [
        "PMP_Sm_cg/{cp_pmpcfg_walk, cp_cfg_A_tor_all7, cp_cfg_A_tor_all8, cp_pmp64_read}",
      ]

  # For RV64, the odd-numbered configuration registers, pmpcfg1, pmpcfg3, …,
  # pmpcfg15, are illegal.
  - name: pmp_cfg_rv64_illegal
    coverpoint:
      [
        "TODO: access the odd-numbered pmpcfg CSRs on RV64 and check for an illegal-instruction exception",
      ]

  # The R, W, and X fields form a collective WARL field for which the combinations
  # with R=0 and W=1 are reserved.
  - name: pmp_rwx_warl
    coverpoint: ["PMP_Sm_cg/cp_pmpcfg_walk"]

  # The matching PMP entry must match all bytes of a memory operation, or the
  # operation fails, irrespective of the L, R, W, and X bits.
  - name: pmp_full_match_required
    # Representative coverpoints; also cp_misaligned_{napot, na4}
    coverpoint:
      [
        "PMP_Zca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4}",
        "PMP_Zca_cg/{cp_cret_tor, cp_cret_napot, cp_cret_na4, cp_misaligned_tor}",
      ]

  # PMP violations are always trapped precisely at the processor.
  - name: pmp_violation_precise_trap
    # PMPZaamo checks rd after every AMO, and a later AMO's return value shows any write by a
    # faulting one. The PMPSm, PMPS, PMPU, and PMPF store probes do not read memory back.
    # rd is checked after every AMO, and a later AMO's return value shows any write by a faulting one
    coverpoint: ["PMP_Zaamo_cg/cp_cfg_RW", "PMP_Zaamo_cg/cp_cfg_RW"]

  # Up to 64 PMP entries are supported. Implementations may implement zero, 16, or
  # 64 PMP entries; the lowest-numbered PMP entries must be implemented first.
  - name: pmp_entry_count
    coverpoint: ["PMP_Sm_cg/{cp_pmp64_read, cp_pmp64_write}"]

  # On some implementations, misaligned loads, stores, and instruction fetches may
  # be decomposed into multiple memory operations, some of which may succeed before
  # an access-fault exception occurs, as described in the RVWMO specification. PMP
  # checking is performed on each memory operation independently.
  - name: pmp_misaligned_access_behavior
    coverpoint:
      [
        "PMP_Zca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4, cp_misaligned_off}",
        "TODO: misaligned loads and stores that straddle two PMP regions",
      ]

  # If no PMP entry matches an M-mode memory operation, the operation succeeds. If no PMP entry
  # matches an S-mode or U-mode memory operation, the operation fails if at least one PMP entry is
  # implemented and succeeds otherwise.
  - name: pmp_no_entry_match
    coverpoint:
      [
        "PMP_Sm_cg/{cp_none_lw, cp_none_sw, cp_none_jalr}",
        "TODO: S-mode and U-mode accesses that match no PMP entry",
      ]

  # Although changing pmpcfg~i~.A[1] affects the value read from pmpaddr~i~, it does
  # not affect the underlying value stored in that register—in particular,
  # pmpaddr~i~[G-1] retains its original value when pmpcfg~i~.A is changed from
  # NAPOT to TOR/OFF then back to NAPOT.
  - name: pmp_addr_retention_on_mode_change
    coverpoint:
      [
        "PMP_Sm_cg/{cp_grain_OFF_to_NAPOT, cp_grain_NAPOT_to_OFF, cp_grain_NAPOT_to_TOR}",
      ]

  # PMP entries are described by an 8-bit configuration register and one MXLEN-bit
  # address register. Some PMP settings additionally use the address register
  # associated with the preceding PMP entry.
  - name: pmp_entry_structure
    coverpoint: ["PMP_Sm_cg/cp_pmpcfg_walk"]

  # store, store-conditional, and AMO instructions generate store/AMO exceptions.
  - name: mcause_exccode_st_sc_amo
    coverpoint: ["PMP_Zaamo_cg/cp_cfg_RW"]

  # No SC.W instruction shall retire unless it passes memory permission checks
  - name: sc_retire_permission
    # Covers SCs with and without a live reservation
    coverpoint: ["PMP_Zalrsc_cg/cp_cfg_RW"]

  # Load and load-reserved instructions generate load exceptions.
  - name: mcause_exccode_ld_ldrsv
    coverpoint: ["PMP_Zalrsc_cg/cp_cfg_RW"]

  # If mtval is written with a nonzero value when an instruction access-fault, page-fault, or
  # hardware-error exception occurs on a hart with variable-length instructions, then mtval will
  # contain the virtual address of the portion of the instruction that caused the fault
  - name: mtval_varlen_wr
    coverpoint:
      [
        "PMP_Zca_cg/{cp_misaligned_tor, cp_misaligned_napot, cp_misaligned_na4}",
        "TODO: instruction page fault on the second half of a 32-bit instruction that straddles a page",
      ]

  # mepc will point to the beginning of the instruction.
  - name: mepc_varlen_wr
    coverpoint:
      ["PMP_Zca_cg/{cp_misaligned_tor, cp_misaligned_napot, cp_misaligned_na4}"]

  # The Zca extension allows 16-bit instructions to be freely intermixed with 32-bit
  # instructions, with the latter now able to start on any 16-bit boundary, i.e.,
  # IALIGN=16.
  - name: Zca_align16
    # 32-bit instructions that start 2 bytes before a PMP region boundary
    coverpoint: ["PMP_Zca_cg/{cp_misaligned_napot, cp_misaligned_tor}"]

  # If access to the cache block is not permitted, a cache-block management
  # instruction raises a store page-fault or store guest-page-fault exception if
  # address translation does not permit any access or raises a store access-fault
  # exception otherwise.
  # If access to the cache block is not permitted, a cache-block management instruction
  # raises a store page-fault or store guest-page-fault exception if address translation
  # does not permit any access or raises a store access-fault exception otherwise.
  - name: cbm_unperm_fault
    coverpoint:
      [
        "PMP_Zicbo_cg/{cp_cbo_inval, cp_cbo_flush, cp_cbo_clean}",
        "PMP_SvZicbo_cg/{cp_PA_PMP_rw_unset_cbo_s,cp_PA_PMP_rw_unset_cbo_u}",
      ]

  # The permissions required for a cache-block management instruction to access a PMP region are
  # defined in the CMO chapter; when such access is not permitted, the instruction raises a store
  # access-fault exception.
  - name: pmp_cbm_fault
    coverpoint: ["PMP_Zicbo_cg/{cp_cbo_inval, cp_cbo_flush, cp_cbo_clean}"]

  # If access to the cache block is not permitted, a cache-block zero instruction
  # raises a store page-fault or store guest-page-fault exception if address
  # translation does not permit write access or raises a store access-fault
  # exception otherwise.
  # If access to the cache block is not permitted, a cache-block zero instruction raises
  # a store page-fault or store guest-page-fault exception if address translation does
  # not permit write access or raises a store access-fault exception otherwise.
  - name: cbz_unperm_fault
    coverpoint:
      [
        "PMP_Zicbo_cg/cp_cbo_zero",
        "PMP_SvZicbo_cg/{cp_PA_PMP_rw_unset_cbo_s,cp_PA_PMP_rw_unset_cbo_u}",
      ]

  # If access to the cache block is not permitted, a cache-block prefetch
  # instruction does not raise any exceptions and shall not access any caches or
  # memory.
  - name: cbp_unperm_noexcep
    coverpoint: ["PMP_Zicbo_cg/{cp_prefetch_w, cp_prefetch_r, cp_prefetch_i}"]

  # A cache-block management instruction is permitted to access the specified cache
  # block whenever a load instruction or store instruction is permitted to access the
  # corresponding physical addresses.
  - name: cbm_access
    coverpoint: ["PMP_Zicbo_cg/{cp_cbo_clean, cp_cbo_flush, cp_cbo_inval}"]

  # A cache-block zero instruction is permitted to access the specified cache block
  # whenever a store instruction is permitted to access the corresponding physical
  # addresses and when the PMAs indicate that cache-block zero instructions are a
  # supported access type.
  - name: cbz_access
    coverpoint: ["PMP_Zicbo_cg/cp_cbo_zero"]

  # When a page-fault, guest-page-fault, or access-fault exception is taken, the
  # relevant *tval CSR is written with the faulting effective address (i.e. the value
  # of rs1).
  # relevant *tval CSR is written with the faulting effective address (i.e. the value of
  # rs1).
  # rs1 is block aligned in these tests, so a DUT that reports the aligned address also passes.
  - name: fault_excep_csr
    # rs1 is always block-aligned here, so a DUT that reports the block address also passes
    coverpoint:
      [
        "PMP_Zicbo_cg/{cp_cbo_zero, cp_cbo_clean}",
        "PMP_SvZicbo_cg/{cp_PA_PMP_rw_unset_cbo_s,cp_PA_PMP_rw_unset_cbo_u}",
      ]

  # PMP checks are also applied to page-table accesses for virtual-address translation,
  # for which the effective privilege mode is S.
  # If the Svadu extension is implemented, the menvcfg.ADUE field is writable.
  # SvaduPMP sets ADUE=1 and removes PMP write permission from the page table, so the
  # hardware A/D update raises an access fault.
  - name: pmp_check_pagetable_access
    # Representative coverpoints; also pmp0_pte_{noread,nowrite,noexec}_u
    # Representative coverpoints; also the other PMP_Svadu_cg/{Abit,Dbit}_unset_pmpW_unset crosses
    coverpoint:
      [
        "PMP_Sv_cg/pmp0_pte_{noread,nowrite,noexec}_s",
        "PMP_SvZicbo_cg/{cp_PTE_PMP_rw_unset_cbo_s,cp_PTE_PMP_rw_unset_cbo_u}",
        "PMP_Svadu_cg/{Abit_unset_pmpW_unset_exec_s, Abit_unset_pmpW_unset_read_s, Abit_unset_pmpW_unset_write_u, Dbit_unset_pmpW_unset_write_s}",
      ]

  # PMP checks are also applied to page-table accesses for virtual-address translation,
  # for which the effective privilege mode is S.
  - name: pmp_with_paging
    # Representative coverpoints; also pmp0_pte_{noread,nowrite,noexec}_u
    coverpoint:
      [
        "PMP_Sv_cg/pmp0_pte_{noread,nowrite,noexec}_s",
        "PMP_SvZicbo_cg/{cp_PTE_PMP_rw_unset_cbo_s,cp_PTE_PMP_rw_unset_cbo_u}",
      ]

  # Implementations with virtual memory are permitted to perform address translations
  # speculatively and earlier than required by an explicit memory access, and are
  # permitted to cache them in address translation cache structures—including possibly
  # caching the identity mappings from effective address to physical address used in
  # Bare translation modes and M-mode. The PMP settings for the resulting physical
  # address may be checked (and possibly cached) at any point between the address
  # translation and the explicit memory access.
  - name: pmp_speculative_translations
    coverpoint:
      [
        "Not tested: when translations and PMP checks are cached is not observable",
      ]

  # when the PMP settings are modified, M-mode software must synchronize the PMP
  # settings with the virtual memory system and any PMP or address-translation caches.
  # This is accomplished by executing an SFENCE.VMA instruction with rs1=x0 and rs2=x0,
  # after the PMP CSRs are written.
  - name: pmp_sfence_required
    coverpoint:
      [
        "Not tested: the tests always execute SFENCE.VMA after writing the PMP CSRs",
      ]

  # When page-based virtual memory is enabled, mtval is written with the faulting
  # virtual address, even for physical-memory access-fault exceptions.
  - name: mtval_vaddr_not_paddr
    # The trap signature records the trap value CSR.
    # Representative coverpoints; also pmp0_PA_{noread,nowrite,noexec}_u
    coverpoint: ["PMP_Sv_cg/pmp0_PA_{noread,nowrite,noexec}_s"]

  # If the Svadu extension is implemented, the menvcfg.ADUE field is writable.
  # PMP checks are also applied to page-table accesses for virtual-address translation,
  # for which the effective privilege mode is S.
  # SvaduPMP sets ADUE=1 and removes PMP write permission from the page table, so the
  # hardware A/D update raises an access fault.
  - name: Svadu_hw_update_a_d_bits
    # Representative coverpoints; also the other PMP_Svadu_cg/{Abit,Dbit}_unset_pmpW_unset crosses
    coverpoint:
      [
        "PMP_Svadu_cg/{Abit_unset_pmpW_unset_exec_s, Abit_unset_pmpW_unset_read_s, Abit_unset_pmpW_unset_write_u, Dbit_unset_pmpW_unset_write_s}",
      ]
