# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # machine-mode (M-mode), which is the highest privilege mode in a RISC-V hart.
  - name: m_highest_priv_mode
    coverpoint: ["Implicit"]

  # M-mode is used for low-level access to a hardware platform and is the first mode
  # entered at reset.
  - name: m_mode_first_at_reset
    coverpoint:
      ["Sm_mcsr_cg/cp_mcsr_access runs right after booting and requires M-mode"]

  # M-mode code can access all CSRs at lower privilege levels.
  - name: m_access_all_lower_priv_csrs
    coverpoint:
      [
        "Sm_mcsr_cg/cp_scsr_from_m, SmF_cg/cp_fcsr_access, SmV_cg/cp_vcsrrswc, H_mcsr_cg/cp_hcsr_access",
      ]

  # The misa CSR is a WARL read-write register
  - name: misa_acc
    coverpoint: ["Sm_mcsr_cg/{cp_misa_mxl, cp_misa_dependencies}"]

  # This register must be readable in any implementation
  - name: misa_always_rd
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # a value of zero can be returned to indicate the misa register has not been
  # implemented
  - name: misa_csr_implemented
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  - name: misa_enc_img
    coverpoint: ["Sm_mcsr_cg/{cp_misa_mxl, cp_misa_dependencies}"]

  # The csr::[mxl] (Machine XLEN) field encodes the native base integer ISA width as shown
  # in &lt;&lt;norm:misa_mxl_enc&gt;&gt;.
  - name: misa_mxl_op_isa
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]
  # If csr:misa[] is nonzero, the csr::[mxl] field indicates the effective XLEN in M-mode,
  # a constant termed MXLEN.
  - name: misa_mxl_op_nz
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # XLEN is never greater than MXLEN, but XLEN might be smaller than MXLEN in
  # less-privileged modes.
  - name: xlen_le_mxlen
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # The MXL field is read-only.
  - name: misa_mxl_acc
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # MXL|XLEN === 1 2 3|32 64 Reserved ===
  - name: misa_mxl_enc
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # The misa CSR is MXLEN bits wide.
  - name: misa_sz
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # The Extensions field encodes the presence of the standard extensions, with a single
  # bit per letter of the alphabet (bit 0 encodes presence of extension ext:a[], bit 1
  # encodes presence of extension ext:b[], through to bit 25 which encodes ext:z[]).
  - name: misa_extensions_enc_txt
    coverpoint: ["Sm_mcsr_cg/{cp_misa_dependencies, cp_misa_b, cp_misa_v}"]
  # Bit|Character|Description === 0|csr::[a]|Atomic extension¶1|csr::[b]|B
  # extension¶2|csr::[c]|Compressed extension¶3|csr::[d]|Double-precision floating-point
  # extension¶4|csr::[e]|RV32E/64E base ISA¶5|csr::[f]|Single-precision floating-point
  # extension¶6|csr::[g]|Reserved¶7|csr::[h]|Hypervisor extension¶8|csr::[i]|RV32I/64I
  # base
  # ISA¶9|csr::[j]|Reserved¶10|csr::[k]|Reserved¶11|csr::[l]|Reserved¶12|csr::[m]|Integer
  # Multiply/Divide extension¶13|csr::[n]|Tentatively reserved for User-Level Interrupts
  # extension¶14|csr::[o]|Reserved¶15|csr::[p]|Tentatively reserved for Packed-SIMD
  # extension¶16|csr::[q]|Quad-precision floating-point
  # extension¶17|csr::[r]|Reserved¶18|csr::[s]|Supervisor mode
  # implemented¶19|csr::[t]|Reserved¶20|csr::[u]|User mode implemented¶21|csr::[v]|Vector
  # extension¶22|csr::[w]|Reserved¶23|csr::[x]|Non-standard extensions
  # implemented¶24|csr::[y]|Reserved¶25|csr::[z]|Reserved ===
  - name: misa_extensions_enc_tbl
    coverpoint: ["Sm_mcsr_cg/{cp_misa_dependencies, cp_misa_b, cp_misa_v}"]

  # The Extensions field is a WARL field that can contain writable bits where the
  # implementation allows the supported ISA to be modified.
  - name: misa_extensions_warl_op
    coverpoint: ["Sm_mcsr_cg/{cp_misa_dependencies, cp_misa_b, cp_misa_v}"]

  # At reset, the Extensions field shall contain the maximal set of supported extensions,
  # and csr::[i] shall be selected over csr::[e] if both are available.
  - name: misa_extensions_reset_maximal
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]
  # The misa register is reset to enable the maximal set of supported extensions, as
  # described in &lt;&lt;misa&gt;&gt;.
  - name: misa_extensions_reset_ref
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # When a standard extension is disabled by clearing its bit in misa, the
  # instructions and CSRs defined or modified by the extension revert to their
  # defined or reserved behaviors as if the extension is not implemented.
  - name: misa_extensions_disabling
    coverpoint:
      [
        "Out of scope; also untestable without Ssstrict because reserved instructions behavior is UNSPECIFIED",
      ]

  # For a given RISC-V execution environment, an instruction, extension, or other
  # feature of the RISC-V ISA is ordinarily judged to be implemented or not by the
  # observable execution behavior in that environment. For example, the F extension
  # is said to be implemented for an execution environment if and only if the
  # instructions that the RISC-V Unprivileged ISA defines for F execute as
  # specified.
  - name: misa_extensions_impl_def
    coverpoint: ["Tested by executing all of the extensions being certified"]

  # With this definition of implemented, disabling an extension by clearing its bit
  # in misa results in the extension being considered not implemented in M-mode. For
  # example, setting misa.F=0 results in the F extension being not implemented for
  # M-mode, because the F extension&#8217;s instructions will not act as the
  # Unprivileged ISA requires but may instead raise an illegal-instruction
  # exception.
  - name: misa_extensions_disabling_def
    coverpoint:
      [
        "Out of scope; also untestable without Ssstrict because reserved instructions behavior is UNSPECIFIED",
      ]

  # All bits that are reserved for future use must return zero when read.
  - name: misa_extensions_rsv_ret_0
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # The "I" bit will be set for the RV32I and RV64I base ISAs
  - name: misa_i_op
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]
  # the "E" bit will be set for RV32E and RV64E.
  - name: misa_e_op
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # The "X" bit will be set if there are any non-standard extensions.
  - name: misa_x_op
    coverpoint: ["Non-standard extensions are not certified"]

  # When the "B" bit is 1, the implementation supports the instructions provided by
  # the Zba, Zbb, and Zbs extensions.
  - name: misa_B_op
    coverpoint: ["Sm_mcsr_cg/cp_misa_b and tests for Zba, Zbb, Zbs"]

  # When the "M" bit is 1, the implementation supports all multiply and division
  # instructions defined by the M extension.
  - name: misa_m_op
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # When the "S" bit is 1, the implementation supports supervisor mode.
  - name: misa_s_op
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # When the "U" bit is 1, the implementation supports user mode.
  - name: misa_u_op
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # csr:misa[c] must be clear if any of the following holds:
  - name: misa_C_set_line
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]
  # ext:zca[] is not implemented MXLEN=32, ext:f[] is implemented, and ext:zcf[] is not
  # implemented ext:d[] is implemented, and ext:zcd[] is not implemented
  - name: misa_C_set_list
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # Unless misa is all read-only zero, the "E" bit always reads as the complement of
  # the "I" bit.
  - name: misa_e_not_i
    coverpoint: ["Sm_mcsr_cg/cp_misa_mxl"]

  # if the Zmmul extension is supported then the multiply instructions it specifies
  # are supported irrespective of the value of the "M" bit.
  - name: Zmmul_misa_m
    coverpoint:
      ["TODO: execute Zmmul multiply instructions with misa.M cleared"]

  # The "E" bit is read-only.
  - name: misa_e_acc
    coverpoint: ["TODO: write misa.E and check that it does not change"]
  # If an ISA feature x depends on an ISA feature y, then attempting to enable
  # feature x but disable feature y results in both features being disabled.
  - name: misa_extensions_dependencies
    coverpoint: ["Sm_mcsr_cg/cp_misa_dependencies"]

  # An implementation may impose additional constraints on the collective setting of two or more
  # misa fields, in which case they function collectively as a single WARL field. An attempt
  # to write an unsupported combination causes those bits to be set to some supported combination.
  - name: misa_extensions_collective_warl
    coverpoint: ["Sm_mcsr_cg/cp_misa_dependencies"]

  # Writing misa may increase IALIGN, e.g., by disabling the "C" extension. If an
  # instruction that would write misa increases IALIGN, and the subsequent
  # instruction's address is not IALIGN-bit aligned, the write to misa is
  # suppressed, leaving misa unchanged.
  - name: misa_inc_ialign
    coverpoint: ["Out of scope"]

  # When software enables an extension that was previously disabled, then all state uniquely
  # associated with that extension is UNSPECIFIED, unless otherwise specified by that extension.
  - name: misa_extensions_reenable_unspec
    coverpoint: ["Behavior is UNSPECIFIED by the specification; not tested"]

  # The csr:mvendorid[] CSR is a 32-bit read-only register providing the JEDEC
  # manufacturer ID of the provider of the core.
  - name: mvendorid_sz_acc_op
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_ro/mvendorid"]

  # This register must be readable in any implementation, but a value of 0 can be
  # returned to indicate the field is not implemented or that this is a
  # non-commercial implementation.
  - name: mvendorid_always_rd
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_ro/mvendorid"]

  # JEDEC manufacturer IDs are ordinarily encoded as a sequence of one-byte
  # continuation codes 0x7f, terminated by a one-byte ID not equal to 0x7f, with an
  # odd parity bit in the most-significant bit of each byte. mvendorid encodes the
  # number of one-byte continuation codes in the Bank field, and encodes the final
  # byte in the Offset field, discarding the parity bit.
  - name: mvendorid_enc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_ro/mvendorid"]

  # The csr:marchid[] CSR is an MXLEN-bit read-only register encoding the base
  # microarchitecture of the hart.
  - name: marchid_sz_acc_op
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_ro/marchid"]

  # This register must be readable in any implementation, but a value of 0 can be
  # returned to indicate the field is not implemented.
  - name: marchid_always_rd
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_ro/marchid"]

  # The csr:mimpid[] CSR provides a unique encoding of the version of the processor
  # implementation.
  - name: mimpid_op
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_ro/mimpid"]

  # This register must be readable in any implementation, but a value of 0 can be
  # returned to indicate that the field is not implemented.
  - name: mimpid_always_rd
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_ro/mimpid"]

  # The csr:mhartid[] CSR is an MXLEN-bit read-only register containing the integer ID of
  # the hardware thread running the code.
  - name: mhartid_sz_acc_op
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_ro/mhartid"]

  # This register must be readable in any implementation.
  - name: mhartid_always_rd
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_ro/mhartid"]

  # one hart must have a hart ID of zero.
  - name: mhartid_one_is_zero
    coverpoint:
      ["Sm_mcsr_cg/cp_mcsr_access_ro/mhartid but only one hart is tested"]

  # Hart IDs must be unique within the execution environment.
  - name: mhartid_unique
    coverpoint:
      ["Sm_mcsr_cg/cp_mcsr_access_ro/mhartid but only one hart is tested"]

  # The csr:mstatus[] register is an MXLEN-bit read/write register formatted as shown in
  # &lt;&lt;mstatusreg-rv32&gt;&gt; for RV32 and &lt;&lt;mstatusreg&gt;&gt; for RV64.
  # csr:mstatus[] must be implemented.
  - name: mstatus_sz_acc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # For RV32 only, csr:mstatush[] is a 32-bit read/write register formatted as shown in
  # &lt;&lt;mstatushreg&gt;&gt;.
  - name: mstatush_sz_acc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatush"]

  # When executing an xRET instruction, supposing xPP holds the value y, xIE is set to
  # xPIE; the privilege mode is changed to y; xPIE is set to 1; and xPP is set to the
  # least-privileged supported mode (U if U-mode is implemented, else M). If y≠M, xRET
  # also sets csr::[mprv]=0.
  - name: mstatus_xret_op
    coverpoint:
      [
        "Sm_mprivinst_cg/{cp_mret, cp_sret, cp_sret_s}, S_sprivinst_cg/cp_sret_s",
      ]

  # Bits 30:4 of mstatush generally contain the same fields found in bits 62:36 of
  # mstatus for RV64. Fields SD, SXL, and UXL do not exist in mstatush.
  - name: mstatush_enc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatush"]

  # csr::[mie] and csr::[mpie] must be writable. If supervisor mode is not implemented,
  # then csr::[sie] and csr::[spie] are read-only 0; otherwise, they must be writable.
  - name: mstatus_sie_spie_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatush"]

  # The xPP fields can only hold privilege modes up to x
  - name: mstatus_xpp_enc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # MPP is two bits wide
  - name: mstatus_mpp_sz
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # xPP fields are WARL fields that can hold only privilege mode x and any
  # implemented privilege mode lower than x.
  - name: mstatus_xpp_warl
    coverpoint:
      ["Sm_mcsr_cg/{cp_mcsr_access_masked,cp_mcsrwalk_masked}/mstatus"]

  # If privilege mode x is not implemented, then xPP must be read-only 0.
  - name: mstatus_xpp_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # SPP is one bit wide.
  - name: mstatus_spp_sz
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # The M-mode-disable-trap (csr::[mdt]) bit is a WARL field introduced by the
  # ext:smdbltrp[] extension.
  - name: mstatus_mdt_sz_warl
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # For RV64 harts, the csr::[sxl] and csr::[uxl] fields are WARL fields that control the
  # value of XLEN for S-mode and U-mode, respectively.
  - name: mstatus_sxl_uxl_warl_op
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # The encoding of these fields is the same as the csr::[mxl] field of csr:misa[], shown
  # in &lt;&lt;norm:misa_mxl_enc&gt;&gt;.
  - name: mstatus_sxl_uxl_enc
    coverpoint: ["Out of scope"]

  # When MXLEN=32, the csr::[sxl] and csr::[uxl] fields do not exist, and SXLEN=32 and
  # UXLEN=32.
  - name: mstatus_sxl_uxl_sxlen_uxlen_mxlen32
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # When MXLEN=64, if S-mode is not supported, then SXL is read-only zero.
  # Otherwise, it is a WARL field that encodes the current value of SXLEN.
  - name: mstatus_sxl_acc_mxlen64
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # an implementation may make SXL be a read-only field whose value always ensures
  # that SXLEN=MXLEN.
  - name: mstatus_sxl_rdonly_mxlen64
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # When MXLEN=64, if U-mode is not supported, then UXL is read-only zero.
  # Otherwise, it is a WARL field that encodes the current value of UXLEN.
  - name: mstatus_uxl_acc_mxlen64
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # an implementation may make UXL be a read-only field whose value always ensures
  # that UXLEN=MXLEN or UXLEN=SXLEN.
  - name: mstatus_uxl_rdonly_mxlen64
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # If S-mode is implemented, the set of legal values that the UXL field may assume
  # excludes those that would cause UXLEN to be greater than SXLEN.
  - name: mstatus_uxl_legal_vals_smode
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # When MPRV=0, explicit memory accesses behave as normal, using the translation
  # and protection mechanisms of the current privilege mode. When MPRV=1, load and
  # store memory addresses are translated and protected, and endianness is applied,
  # as though the current privilege mode were set to MPP.
  - name: mstatus_mprv_ldst_op
    # Representative coverpoints; also PMPS_cg/cp_mprv_sw, PMPU_cg/cp_mprv_lw, SvSm SUM+MPRV
    coverpoint:
      [
        "SvSm_mstatus_mprv_cg/{cp_mprv_load, cp_mprv_store}",
        "PMPS_cg/cp_mprv_lw",
        "PMPU_cg/cp_mprv_sw",
      ]

  # Instruction address-translation and protection are unaffected by the setting of
  # MPRV.
  - name: mstatus_mprv_inst_xlat_op
    coverpoint:
      [
        "SvSm_mstatus_mprv_cg/{cp_mprv_ins, cp_mprv_upage_smode_sumset_exec}",
        "PMPS_cg/cp_mprv_jalr",
        "PMPU_cg/cp_mprv_jalr",
      ]

  # MPRV is read-only 0 if U-mode is not supported.
  - name: mstatus_mprv_rdonly0_no_umode
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # An MRET or SRET instruction that changes the privilege mode to a mode less
  # privileged than M also sets MPRV=0.
  - name: mstatus_mprv_clr_mret_sret_less_priv
    coverpoint:
      [
        "Sm_mprivinst_cg/{cp_mret, cp_sret, cp_sret_s}, S_sprivinst_cg/cp_sret_s",
      ]

  - name: xret_op
    coverpoint: ["Sm_mprivinst_cg/cp_mret"]

  - name: sret_presence
    coverpoint: ["Sm_mprivinst_cg/cp_sret"]

  - name: sret_ill_inst_exc_rst
    coverpoint: ["TODO"]

  - name: xret_in_higher_mode
    coverpoint: ["Sm_mprivinst_cg/cp_sret"]

  # When MXR=0, only loads from pages marked readable (R=1 in
  # &lt;&lt;sv32pte&gt;&gt;) will succeed. When MXR=1, loads from pages marked
  # either readable or executable (R=1 or X=1) will succeed. MXR has no effect when
  # page-based virtual memory is not in effect.
  - name: mstatus_mxr_op
    coverpoint:
      [
        "Sv_vm_permissions_cg/{cp_xpage_mxrunset_read_s, cp_xpage_mxrunset_read_u}",
        "Sv_vm_permissions_cg/{cp_xpage_mxrset_read_s, cp_xpage_mxrset_read_u}",
      ]

  # MXR is read-only 0 if S-mode is not supported.
  - name: mstatus_mxr_rdonly0_no_smode
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # When SUM=0, S-mode memory accesses to pages that are accessible by U-mode (U=1
  # in &lt;&lt;sv32pte&gt;&gt;) will fault. When SUM=1, these accesses are
  # permitted.
  - name: mstatus_sum_op
    # Representative coverpoints; also Sv_vm_permissions_cg/cp_spage_*, SvSm SUM+MPRV
    coverpoint:
      [
        "Sv_vm_permissions_cg/{cp_upage_smode_sumunset_noread_s, cp_upage_smode_sumunset_nowrite_s}",
        "Sv_vm_permissions_cg/{cp_upage_smode_sumset_read_s, cp_upage_smode_sumset_write_s}",
      ]

  # SUM has no effect when page-based virtual memory is not in effect.
  - name: mstatus_sum_op_no_vm
    coverpoint: ["TODO"]

  # while SUM is ordinarily ignored when not executing in S-mode, it is in effect
  # when MPRV=1 and MPP=S.
  - name: mstatus_sum_op_mprv_mpp
    # Representative coverpoints; also the _noexec and _exec variants
    coverpoint:
      [
        "SvSm_mstatus_mprv_cg/{cp_mprv_upage_smode_sumunset_noread, cp_mprv_upage_smode_sumunset_nowrite}",
        "SvSm_mstatus_mprv_cg/{cp_mprv_upage_smode_sumset_read, cp_mprv_upage_smode_sumset_write}",
      ]

  # SUM is read-only 0 if S-mode is not supported or if satp.MODE is read-only 0.
  - name: mstatus_sum_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # The MXR and SUM mechanisms only affect the interpretation of permissions encoded
  # in page-table entries. In particular, they have no impact on whether
  # access-fault exceptions are raised due to PMAs or PMP.
  - name: mstatus_mxr_sum_op_acc_fault
    coverpoint: ["TODO by UET: add to {PMPSm/PMPS/PMPU}_cg/cp_cfg_RW tests"]

  # The csr::[mbe], csr::[sbe], and csr::[ube] bits in csr:mstatus[] and csr:mstatush[]
  # are WARL fields that control the endianness of memory accesses other than instruction
  # fetches. Each may be read/write or read-only.
  - name: mstatus_mstatush_xbe_warl
    coverpoint:
      [
        "Sm_mcsr_cg/cp_mcsr_access_masked/mstatus",
        "Sm_mcsr_cg/cp_mcsr_access_masked/mstatush",
      ]

  # The TVM (Trap Virtual Memory) bit is a WARL field that supports intercepting
  # supervisor virtual-memory management operations. When TVM=1, attempts to read or
  # write the satp CSR or execute an SFENCE.VMA or SINVAL.VMA instruction while
  # executing in S-mode will raise an illegal-instruction exception. When TVM=0,
  # these operations are permitted in S-mode. TVM is read-only 0 when S-mode is not
  # supported.
  - name: mstatus_tvm_warl
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # The TVM (Trap Virtual Memory) bit is a WARL field that supports intercepting
  # supervisor virtual-memory management operations. When TVM=1, attempts to read or
  # write the satp CSR or execute an SFENCE.VMA or SINVAL.VMA instruction while
  # executing in S-mode will raise an illegal-instruction exception. When TVM=0,
  # these operations are permitted in S-mode. TVM is read-only 0 when S-mode is not
  # supported.
  - name: mstatus_tvm_op
    coverpoint:
      ["SvSm_mstatus_mprv_cg/cp_tvm_exception_s", "Svinval_cg/cp_svinval"]

  # csr::[tvm] is read-only 0 when S-mode is not supported or if satp.MODE is read-only 0;
  # otherwise, it must be writable.
  - name: mstatus_tvm_acc
    coverpoint:
      [
        "Sm_mcsr_cg/cp_mcsr_access_masked/mstatus",
        "Sm_mcsr_cg/cp_mcsrwalk_masked/mstatus",
      ]

  # TW is read-only 0 when there are no modes less privileged than M.
  - name: mstatus_tw_acc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # The TSR (Trap SRET) bit is a WARL field that supports intercepting the
  # supervisor exception return instruction, SRET.
  - name: mstatus_tsr_warl
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # When TSR=1, attempts to execute SRET while executing in S-mode will raise an
  # illegal-instruction exception. When TSR=0, this operation is permitted in
  # S-mode.
  - name: mstatus_tsr_op
    coverpoint: ["Sm_mprivinst_cg/cp_sret_s"]

  # TSR is read-only 0 when S-mode is not supported.
  - name: mstatus_tsr_acc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # The csr::[fs][1:0] and csr::[vs][1:0] WARL fields and the csr::[xs][1:0] read-only
  # field are used to reduce the cost of context save and restore by setting and tracking
  # the current state of the floating-point unit and any other user-mode extensions
  # respectively.
  - name: mstatus_fs_vs_warl
    coverpoint:
      [
        "Sm_mcsr_cg/cp_mcsr_access_masked/mstatus, Sm_mcsr_cg/cp_mcsrwalk_masked/mstatus",
      ]

  # The FS field encodes the status of the floating-point unit state, including the
  # floating-point registers f0–f31 and the CSRs fcsr, frm, and fflags.
  - name: mstatus_fs_op
    coverpoint: ["SmF_cg/cp_mstatus_FS_transition"]

  # The csr::[vs] field encodes the status of the vector extension state, including the
  # vector registers v0&amp;#8205;&amp;#8211;&amp;#8205;v31 and the CSRs csr:vcsr[],
  # csr:vxrm[], csr:vxsat[], csr:vstart[], csr:vl[], csr:vtype[], and csr:vlenb[].
  - name: mstatus_vs_op
    coverpoint: ["TODO: test with vector"]
  # A vector context status field, csr::[vs], is added to csr:mstatus[][10:9] and shadowed
  # in csr:sstatus[][10:9]. It is defined analogously to the floating-point context status
  # field, csr::[fs].
  - name: mstatus_vs_sstatus_vs_op
    coverpoint: ["TODO: test with vector"]

  # The csr::[xs] field encodes the status of additional user-mode extensions and
  # associated state.
  - name: mstatus_xs_encodes_op
    coverpoint: ["Untested"]
  # The csr::[xs] field represents a summary of all extensions' status as shown in
  # &lt;&lt;norm:mstatus_fs_vs_xs_enc&gt;&gt;.
  - name: mstatus_xs_summary_op
    coverpoint: ["Untested"]

  # Status|FS and VS Meaning|XS Meaning === 0|Off|All off¶1|Initial|None dirty or clean,
  # some on¶2|Clean|None dirty, some clean¶3|Dirty|Some dirty ===
  - name: mstatus_fs_vs_xs_enc
    coverpoint:
      [
        "Sm_mcsr_cg/cp_mcsr_access_masked/mstatus, SmF_cg/cp_mstatus_FS_transition",
      ]

  # If the ext:f[] extension is implemented, the csr::[fs] field shall not be read-only
  # zero.
  - name: mstatus_fs_acc1
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]
  # If neither the ext:f[] extension nor S-mode is implemented, then csr::[fs] is
  # read-only zero.
  - name: mstatus_fs_acc2
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # If S-mode is implemented but the F extension is not, FS may optionally be
  # read-only zero.
  - name: mstatus_fs_rdonly0_s_no_F
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # If the v registers are implemented, the csr::[vs] field shall not be read-only zero.
  - name: mstatus_vs_acc1
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]
  # If neither the v registers nor S-mode is implemented, then csr::[vs] is read-only
  # zero.
  - name: mstatus_vs_acc2
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # If S-mode is implemented but the v registers are not, VS may optionally be
  # read-only zero.
  - name: mstatus_vs_rdonly0_s_no_V
    coverpoint: ["TODO"]

  # In harts without additional user extensions requiring new state, the XS field is
  # read-only zero.
  - name: mstatus_xs_acc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_masked/mstatus"]

  # Every additional extension with state provides a CSR field that encodes the
  # equivalent of the XS states.
  - name: mstatus_xs_equiv
    coverpoint: ["Out of scope"]

  # The SD bit is a read-only bit
  - name: mstatus_sd_acc
    coverpoint: ["Sm_mstatus_cg/cp_mstatus_sd_write"]

  # summarizes whether either the csr::[fs], csr::[vs], or csr::[xs] fields signal the
  # presence of some dirty state that will require saving extended user context to memory.
  - name: mstatus_sd_summary_op
    coverpoint: ["Sm_mstatus_cg/cp_mstatus_sd_write"]
  # If csr:mstatus[vs] is Dirty, csr:mstatus[sd] is 1; otherwise, csr:mstatus[sd] is set
  # in accordance with existing specifications.
  - name: mstatus_sd_vs_dirty_op
    coverpoint: ["Sm_mstatus_cg/cp_mstatus_sd_write"]

  # If FS, XS, and VS are all read-only zero, then SD is also always zero.
  - name: mstatus_sd_rdonly0
    coverpoint: ["Sm_mstatus_cg/cp_mstatus_sd_write"]

  # The csr::[sd] bit is read-only and is set when either the csr::[fs], csr::[vs], or csr::[xs]
  # bits encode a Dirty state (i.e., csr::[sd]=(csr::[fs]==0b11 OR csr::[xs]==0b11 OR
  # csr::[vs]==0b11)).
  - name: mstatus_sd_formula
    coverpoint: ["Sm_mstatus_cg/cp_mstatus_sd_write"]

  # When an extension's status is set to Off, any instruction that attempts to read
  # or write the corresponding state will cause an illegal-instruction exception.
  - name: mstatus_fs_vs_xs_off_op
    coverpoint:
      [
        "SmF_cg/{cp_fcsr_access, cp_mstatus_FS_transition}",
        "SmV_cg/{cp_mstatus_vs_off_arithmetic, cp_mstatus_vs_off_csr}",
      ]

  # When the status is Initial, the corresponding state should have an initial
  # constant value.
  - name: mstatus_fs_vs_xs_initial_op
    coverpoint:
      [
        "untested because initial constant value is not specified and can be changed by software",
      ]

  # When the status is Clean, the corresponding state is potentially different from
  # the initial value, but matches the last value stored on a context swap.
  - name: mstatus_fs_vs_xs_clean_op
    coverpoint: ["Untestable"]

  # When the status is Dirty, the corresponding state has potentially been modified
  # since the last context save.
  - name: mstatus_fs_vs_xs_dirty_op
    coverpoint: ["SmF_cg/cp_mstatus_FS_transition"]

  # The status fields will also be updated during execution of instructions,
  # regardless of privilege mode.
  - name: mstatus_fs_vs_xs_update_indep_priv
    coverpoint: ["TODO: test with float, vector"]

  # Changing the setting of FS has no effect on the contents of the floating-point
  # register state. In particular, setting FS=Off does not destroy the state, nor
  # does setting FS=Initial clear the contents.
  - name: mstatus_fs_wr
    coverpoint: ["TODO: test with float"]

  # the setting of VS has no effect on the contents of the vector register state.
  - name: mstatus_vs_wr
    coverpoint: ["TODO: test with vector"]

  # Implementations may choose to track the dirtiness of the floating-point register
  # state imprecisely by reporting the state to be dirty even when it has not been
  # modified. On some implementations, some instructions that do not mutate the
  # floating-point state may cause the state to transition from Initial or Clean to
  # Dirty.
  - name: mstatus_fs_imprecise
    coverpoint:
      [
        "Untestable.  TODO: imprecise dirty tracking could be a problem to match the reference model in cp_mstatus_FS_transition",
      ]

  # dirtiness might not be tracked at all, in which case the valid FS states are Off
  # and Dirty, and an attempt to set FS to Initial or Clean causes it to be set to
  # Dirty.
  - name: mstatus_fs_no_dirty_track
    coverpoint:
      [
        "SmF_cg/cp_mstatus_FS_transition",
        "Sm_mcsr_cg/cp_mcsrwalk_masked/mstatus",
      ]

  # If an instruction explicitly or implicitly writes a floating-point register or
  # the fcsr but does not alter its contents, and FS=Initial or FS=Clean, it is
  # implementation-defined whether FS transitions to Dirty.
  - name: mstatus_fs_no_change_dirty
    coverpoint:
      [
        "Untestable without UDB parameters to control this behavior in the ref model",
      ]

  # Implementations may choose to track the dirtiness of the floating-point register
  # state imprecisely by reporting the state to be dirty even when it has not been
  # modified. On some implementations, some instructions that do not mutate the
  # floating-point state may cause the state to transition from Initial or Clean to
  # Dirty. Implementations may choose to track the dirtiness of the vector register
  # state in an analogous imprecise fashion, including possibly setting VS to Dirty
  # when software attempts to set VS=Initial or VS=Clean.
  - name: mstatus_vs_imprecise
    coverpoint: ["Untestable"]

  # When VS=Initial or VS=Clean, it is implementation-defined whether an instruction
  # that writes a vector register or vector CSR but does not alter its contents
  # causes VS to transition to Dirty.
  - name: mstatus_vs_no_change_dirty
    coverpoint: ["Untestable"]

  - name: mtvec_enc
    coverpoint:
      [
        "TODO: Sm_mcsr_cg has no mtvec bin; Sm.py writes mtvec but checks only bit 1",
      ]

  # The csr:mtvec[] register is an MXLEN-bit WARL read/write register that holds trap
  # vector configuration, consisting of a vector base address (csr::[base]) and a vector
  # mode (csr::[mode]).
  - name: mtvec_sz_warl_acc
    coverpoint:
      [
        "TODO: Sm_mcsr_cg has no mtvec bin; Sm.py writes mtvec but checks only bit 1",
      ]

  # The mtvec register must always be implemented
  - name: mtvec_mandatory
    coverpoint:
      [
        "TODO: Sm_mcsr_cg has no mtvec bin; Sm.py writes mtvec but checks only bit 1",
      ]

  # The mtvec register must always be implemented can contain a read-only value.
  - name: mtvec_rdonly
    coverpoint:
      [
        "TODO: Sm_mcsr_cg has no mtvec bin; Sm.py writes mtvec but checks only bit 1",
      ]

  # The value in the BASE field must always be aligned on a 4-byte boundary
  - name: mtvec_base_align_4b
    coverpoint:
      [
        "TODO: Sm_mcsr_cg has no mtvec bin; Sm.py writes mtvec but checks only bit 1",
      ]

  # the MODE setting may impose additional alignment constraints on the value in the
  # BASE field.
  - name: mtvec_base_align_func_mode
    coverpoint:
      [
        "TODO: Sm_mcsr_cg has no mtvec bin; Sm.py writes mtvec but checks only bit 1",
      ]

  # When XLEN=32, csr:medelegh[] is a 32-bit read/write register that aliases bits 63:32
  # of csr:medeleg[].
  - name: medelegh_sz_acc_enc_xlen32
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/medelegh"]

  # The medelegh register does not exist when XLEN=64.
  - name: medelegh_omit_xlen64
    coverpoint:
      [
        "Untested except in Sstrict* because nonexistent register behavior is UNSPECIFIED",
      ]

  # The machine exception delegation register (csr:medeleg[]) is a 64-bit read/write
  # register.
  - name: medeleg_sz_acc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/medeleg"]

  # The machine interrupt delegation (csr:mideleg[]) register is an MXLEN-bit read/write
  # register.
  - name: mideleg_sz_acc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/mideleg"]

  # In harts with S-mode, the medeleg and mideleg registers must exist
  - name: medeleg_mideleg_mandatory_s_mode
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/{medeleg/mideleg"]

  # In harts without S-mode, the csr:medeleg[] and csr:mideleg[] registers should not
  # exist.
  - name: medeleg_mideleg_omit_wo_s_mode
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/{medeleg/mideleg"]

  # An implementation can choose to subset the delegatable traps, with the supported
  # delegatable bits found by writing one to every bit location, then reading back the
  # value in csr:medeleg[] or csr:mideleg[] to see which bit positions hold a one.
  - name: medeleg_mideleg_warl
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/mideleg"]

  # An implementation shall not have any bits of medeleg be read-only one
  - name: medeleg_no_rd1
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/medeleg"]

  # an implementation shall not fix as read-only one any bits of mideleg
  # corresponding to machine-level interrupts
  - name: mideleg_no_rd1
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/mideleg"]

  # may do so for lower-level interrupts
  - name: mideleg_rd1_lower_level
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/mideleg"]

  # For exceptions that cannot occur in less privileged modes, the corresponding
  # medeleg bits should be read-only zero. In particular, medeleg[11] is read-only
  # zero.
  - name: medeleg_when_rd0
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/medeleg"]

  # The medeleg[16] is read-only zero as double trap is not delegatable.
  - name: medeleg_16_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/medeleg"]

  # The csr:mip[] register is an MXLEN-bit read/write register containing information on
  # pending interrupts
  - name: mip_sz_acc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/mip"]

  # The mip register must always be implemented, but can contain read-only zeros in any
  # position, indicating that interrupt can never become pending.
  - name: mip_mandatory
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/mip", "Sm_mcsr_cg/cp_mcsrwalk/mip"]

  # csr:mie[] is the corresponding MXLEN-bit read/write register containing interrupt
  # enable bits.
  - name: mie_sz_acc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/mie"]

  # The mie register must always be implemented.
  - name: mie_mandatory
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access/mie"]

  # Each individual bit in register mip may be writable or may be read-only.
  - name: mip_bits_wr_or_rdonly
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk/mip"]

  # A bit in mie must be writable if the corresponding interrupt can ever become
  # pending.
  - name: mie_bits_wr
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk/mie"]

  # Bits of mie that are not writable must be read-only zero.
  - name: mie_bits_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk/mie"]

  # If a system has only one hart, or if a platform standard supports the delivery of
  # machine-level interprocessor interrupts through external interrupts (MEI) instead,
  # then csr:mip[msip] and csr:mie[msie] may both be read-only zeros.
  - name: mip_msip_mie_msie_maybe_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk/{mip,mie}"]

  # Each standard machine interrupt type (MEI, MTI, MSI) might not be implemented, in which case the
  # corresponding interrupt-pending and interrupt-enable bits are read-only zeros.
  - name: std_mach_intr_impl
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk/{mip,mie}"]

  # If supervisor mode is not implemented, bits csr::[seip], csr::[stip], and csr::[ssip]
  # of csr:mip[] and csr::[seie], csr::[stie], and csr::[ssie] of csr:mie[] are read-only
  # zeros.
  - name: mip_sxip_mie_sxie_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk/{mip,mie}"]

  # LCOFIP is read-write in mip
  - name: mip_lcofip_acc
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk/{mip,mie}"]

  # If the ext:sscofpmf[] extension is not implemented, csr:mip[lcofip] and
  # csr:mie[lcofie] are read-only zeros.
  - name: mip_lcofip_mie_lcofie_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk/{mip,mie}"]

  # The menvcfg CSR is a 64-bit read/write register, formatted as shown in menvcfg_enc_img
  - name: menvcfg_sz_acc
    coverpoint:
      [
        "Sm_mcsr_cg/cp_mcsr_access_masked/menvcfg",
        "Sm_mcsr_cg/cp_mcsr_access_masked/menvcfgh",
      ]

  # controls certain characteristics of the execution environment for modes less privileged than M.
  - name: menvcfg_op
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  - name: menvcfg_enc_img
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg"]

  # If bit FIOM (Fence of I/O implies Memory) is set to one in menvcfg, FENCE instructions executed
  # in modes less privileged than M are modified so the requirement to order accesses to device I/O
  # implies also the requirement to order main memory accesses. menvcfg_fiom_fence_presuc_op details
  # the modified interpretation of FENCE instruction bits PI, PO, SI, and SO for modes less
  # privileged than M when FIOM=1.
  - name: menvcfg_fiom_fence_op
    coverpoint: ["Untestable: no I/O devices defined in profile"]

  # for modes less privileged than M when FIOM=1, if an atomic instruction that accesses a region
  # ordered as device I/O has its aq and/or rl bit set, then that instruction is ordered as though
  # it accesses both device I/O and memory.
  - name: menvcfg_fiom_atomic_op
    coverpoint: ["Untestable: no I/O devices defined in profile"]

  # If S-mode is not supported, or if satp.MODE is read-only zero (always Bare), the implementation
  # may make FIOM read-only zero.
  - name: menvcfg_fiom_rdonly0_ok
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg"]

  # Instruction bit|Meaning when set === PI PO|Predecessor device input and memory reads (PR
  # implied) Predecessor device output and memory writes (PW implied)¶SI SO|Successor device input
  # and memory reads (SR implied) Successor device output and memory writes (SW implied) ===
  - name: menvcfg_fiom_fence_presuc_op
    coverpoint: ["Untestable: no I/O devices defined in profile"]

  # If Smcdeleg is not implemented, CDE is read-only zero.
  - name: menvcfg_cde_rdonly0
    coverpoint:
      ["TODO: check menvcfg.CDE in the Sm walk once Sail supports Smcdeleg"]

  # The Sstc extension adds the STCE (STimecmp Enable) bit to menvcfg CSR.
  - name: menvcfg_stce_exists
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg"]
  # When the Sstc extension is not implemented, STCE is read-only zero.
  - name: menvcfg_stce_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg"]
  # The STCE bit enables stimecmp for S-mode when set to one.
  - name: menvcfg_stce_enable_op
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg"]
  # When this extension is implemented and STCE in menvcfg is zero, an attempt to access
  # stimecmp or vstimecmp in a mode other than M-mode raises an illegal-instruction
  # exception, STCE in henvcfg is read-only zero, and STIP in mip and sip reverts to its
  # defined behavior as if this extension is not implemented.
  - name: menvcfg_stce_zero_op
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg"]
  # Further, if the H extension is implemented, then hip.VSTIP also reverts its defined
  # behavior as if this extension is not implemented.
  - name: menvcfg_stce_zero_vstip
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg"]

  # The Zicboz extension adds the CBZE (Cache Block Zero instruction enable) field to
  # menvcfg. When the CBZE field is set to 1, it enables execution of the cache block zero
  # instruction, CBO.ZERO, in modes less privileged than M. Otherwise, the instruction
  # raises an illegal-instruction exception in modes less privileged than M.
  - name: menvcfg_cbze_op
    coverpoint:
      [
        "Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg",
        "ExceptionsZicboS_cg/cp_cbze",
        "ExceptionsZicboU_cg/cp_cbze",
      ]
  # When the Zicboz extension is not implemented, CBZE is read-only zero.
  - name: menvcfg_cbze_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg"]

  # The Zicbom extension adds the CBCFE (Cache Block Clean and Flush instruction Enable)
  # field to menvcfg. When the CBCFE field is set to 1, it enables execution of the cache
  # block clean instruction (CBO.CLEAN) and the cache block flush instruction (CBO.FLUSH)
  # in modes less privileged than M. Otherwise, these instructions raise an
  # illegal-instruction exception in modes less privileged than M.
  - name: menvcfg_cbcfe_op
    coverpoint:
      [
        "Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg",
        "ExceptionsZicboS_cg/cp_cbcfe",
        "ExceptionsZicboU_cg/cp_cbcfe",
      ]
  # When the Zicbom extension is not implemented, CBCFE is read-only zero.
  - name: menvcfg_cbcfe_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg"]

  # The Zicbom extension adds the CBIE (Cache Block Invalidate instruction Enable) WARL
  # field to menvcfg to control execution of the cache block invalidate instruction
  # (CBO.INVAL) in modes less privileged than M. When CBIE is set to 0b00, the instruction
  # raises an illegal-instruction exception in modes less privileged than M.
  - name: menvcfg_cbie_warl_op
    coverpoint:
      [
        "Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg",
        "ExceptionsZicboS_cg/cp_cbie",
        "ExceptionsZicboU_cg/cp_cbie",
      ]
  # When the Zicbom extension is not implemented, CBIE is read-only zero.
  - name: menvcfg_cbie_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg"]

  # When CBIE is set to 0b01 or 0b11, and when enabled for execution in modes less
  # privileged than M, it behaves as follows:
  - name: menvcfg_cbie_cbo-inval_op_lead_in
    coverpoint: ["ExceptionsZicboS_cg/cp_cbie", "ExceptionsZicboU_cg/cp_cbie"]
  # 0b01&#8201;&#8212;&#8201;The instruction is executed and performs a flush operation,
  # even if configured by a mode less privileged than M to perform an invalidate
  # operation. 0b11&#8201;&#8212;&#8201;The instruction is executed and performs an
  # invalidate operation, unless configured by a mode less privileged than M to perform a
  # flush operation.
  - name: menvcfg_cbie_cbo-inval_op_list
    coverpoint: ["ExceptionsZicboS_cg/cp_cbie", "ExceptionsZicboU_cg/cp_cbie"]

  # If the Smnpm extension is implemented, the PMM field enables or disables pointer masking (see
  # Zpm) for the next-lower privilege mode (S-/HS-mode if S-mode is implemented, or U-mode
  # otherwise), according to the values in menvcfg_pmm_enc.
  - name: menvcfg_pmm_op
    coverpoint: ["SmnpmS_cg/cp_pmlen_masking", "SmnpmU_cg/cp_pmlen_masking"]

  # If Smnpm is not implemented, PMM is read-only zero. The PMM field is read-only zero for RV32.
  - name: menvcfg_pmm_rdonly0
    coverpoint:
      [
        "Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg",
        "Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfgh",
      ]

  # Value|Description === 00|Pointer masking is disabled (PMLEN = 0)¶01|Reserved¶10|Pointer masking
  # is enabled with PMLEN = XLEN - 57 (PMLEN = 7 on RV64)¶11|Pointer masking is enabled with PMLEN =
  # XLEN - 48 (PMLEN = 16 on RV64) ===
  - name: menvcfg_pmm_enc
    coverpoint:
      [
        "SmnpmS_cg/cp_pmlen_masking",
        "SmnpmU_cg/cp_pmlen_masking",
        "Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg",
      ]

