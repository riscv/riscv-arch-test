  # The reset values listed here apply to every underlying trigger.
  - name: Sdtrig_tmexttrigger_reset
    coverpoint:
      ["External trigger inputs are implementation-specific and unspecified"]

  # This register is accessible as tdata1 when type is 7.
  - name: Sdtrig_tmexttrigger_access
    coverpoint:
      ["External trigger inputs are implementation-specific and unspecified"]

  # This trigger fires when any selected TM external trigger input signals.
  - name: Sdtrig_tmexttrigger_fire
    coverpoint:
      ["External trigger inputs are implementation-specific and unspecified"]

  # Up to 16 TM external trigger inputs coming from other blocks outside the TM,
