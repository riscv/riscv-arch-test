# Mapping of normative rules to coverpoints for a test suite
#
# Zvksed exercises the vector SM4 extension (vsm4k, vsm4r). Both instructions operate on 128-bit
# element groups (EGS=4, EEW=32) and only run at SEW=32 in this suite.

normative_rule_definitions:
  # All of these instructions work on 128-bit element groups comprised of four 32-bit elements.
  - name: Zvksed_egw128b_elem32b
    coverpoint:
      [
        "Zvksed_vsm4k_vi_cg/cp_csr_vtype_lmul_egs4_sew32",
        "Zvksed_vsm4k_vi_cg/cr_vl_lmul_egs4_sew32",
        "Zvksed_vsm4r_vv_cg/cr_vl_lmul_egs4_sew32",
        "Zvksed_vsm4r_vs_cg/cr_vl_lmul_egs4_sew32",
      ]

  # To help avoid side-channel timing attacks, these instructions shall be implemented with data-
  # independent timing.
  - name: Zvksed_dataindeptiming
    coverpoint: ["Untestable: microarchitectural timing"]

  # The number of element groups to be processed is vl/EGS. vl must be set to the number of SEW=32
  # elements to be processed and therefore must be a multiple of EGS=4.
  - name: Zvksed_vl
    coverpoint:
      [
        "Zvksed_vsm4k_vi_cg/cr_vl_lmul_egs4_sew32",
        "Zvksed_vsm4r_vv_cg/cr_vl_lmul_egs4_sew32",
        "Zvksed_vsm4r_vs_cg/cr_vl_lmul_egs4_sew32",
      ]

  # Likewise, vstart must be a multiple of EGS=4.
  - name: Zvksed_vstart
    coverpoint:
      [
        "TODO: no coverpoint samples vstart for this suite yet; nothing wired in coverpoints/unpriv/Zvksed_coverage.svh",
      ]

  # SEW is any value other than 32.
  - name: vsm4k-vi_sewn32_rsv
    coverpoint:
      [
        "Out-of-Scope: reserved because of CSR state (vtype.sew); Zvksed only generates SEW=32 tests and there is no Ssstrict-equivalent suite for vector-crypto",
      ]

  # Four rounds of the SM4 Key Expansion are performed. Four round keys are read in as a 4-element
  # group from vs2. Each of the next four round keys are generated by iteratively XORing the last
  # three round keys with a constant indexed by the Round Group Number, performing a byte-wise
  # substitution, and then XORing rotated versions of this value with the corresponding current
  # round key. The round group number comes from uimm[2:0].
  - name: vsm4k-vi_op
    coverpoint:
      [
        "Zvksed_vsm4k_vi_cg/cp_vd_egs4",
        "Zvksed_vsm4k_vi_cg/cp_imm_5bit_u",
        "Zvksed_vsm4k_vi_cg/cp_vs2_edges_egs4_sm_byte_0",
        "Zvksed_vsm4k_vi_cg/cp_vs2_edges_egs4_sm_byte_3",
        "Zvksed_vsm4k_vi_cg/cr_vl_lmul_egs4_sew32",
      ]

  # SEW is any value other than 32.
  - name: vsm4r_sewn32_rsv
    coverpoint:
      [
        "Out-of-Scope: reserved because of CSR state (vtype.sew); Zvksed only generates SEW=32 tests and there is no Ssstrict-equivalent suite for vector-crypto",
      ]

  # Only for the .vs form: the vd register group overlaps the vs2 register.
  - name: vsm4r-vs_vdoverlapvs2_rsv
    coverpoint:
      [
        "TODO: this is an SsstrictV-style reserved-encoding test; Zvksed_vsm4r_vs_cg has no vd/vs2 register-aliasing coverpoint and there is no Ssstrict-equivalent suite for vector-crypto",
      ]

  # Four rounds of SM4 Encryption/Decryption are performed. The four words of current state are
  # read as a 4-element group from vd and the round keys are read from either the corresponding
  # 4-element group in vs2 (vector-vector form) or the scalar element group in vs2 (vector-scalar
  # form). The next four words of state are generated by iteratively XORing the last three words
  # of the state with the corresponding round key, performing a byte-wise substitution, and then
  # XORing rotated versions of this value with the current state.
  - name: vsm4r_op
    coverpoint:
      [
        "Zvksed_vsm4r_vv_cg/cp_vd_egs4",
        "Zvksed_vsm4r_vv_cg/cr_vs2_vd_edges_egs4_subbytes_sm_0",
        "Zvksed_vsm4r_vv_cg/cr_vl_lmul_egs4_sew32",
        "Zvksed_vsm4r_vs_cg/cr_vs2_vd_edges_egs4_subbytes_sm_0",
        "Zvksed_vsm4r_vs_cg/cr_vl_lmul_egs4_sew32",
      ]

  # This extension (Zvks) is shorthand for the following set of other extensions: Zvksed, Zvksh,
  # Zvkb, Zvkt.
  - name: Zvks_def
    coverpoint: ["Definition, checked through UDB"]

  # This extension (Zvksc) is shorthand for the following set of other extensions: Zvks, Zvbc.
  - name: Zvksc_def
    coverpoint: ["Definition, checked through UDB"]

  # This extension (Zvksg) is shorthand for the following set of other extensions: Zvks, Zvkg.
  - name: Zvksg_def
    coverpoint: ["Definition, checked through UDB"]

  # Four round keys are read in as a 4-element group from vs2. Each of the next four round keys are
  # generated by iteratively XORing the last three round keys with a constant that is indexed by the
  # Round Group Number, performing a byte-wise substitution, and then performing XORs between
  # rotated versions of this value and the corresponding current round key.
  - name: vsm4k-vi_op_sm4k
    coverpoint:
      [
        "Zvksed_vsm4k_vi_cg/{cp_vs2_edges_egs4_sm_byte_0, cp_vs2_edges_egs4_sm_byte_1, cp_vs2_edges_egs4_sm_byte_2, cp_vs2_edges_egs4_sm_byte_3}",
      ]

  # The Round group number comes from uimm[2:0]; the bits in uimm[4:3] are ignored. Round group
  # numbers range from 0 to 7 and indicate which group of four round keys are being generated. Round
  # Keys range from 0–31. For example, if uimm=1, then round keys 4, 5, 6, and 7 are being
  # generated.
  - name: vsm4k-vi_op_rnd
    coverpoint: ["Zvksed_vsm4k_vi_cg/cp_imm_5bit_u"]

  # The four words of current state are read as a 4-element group from vd and the round keys are
  # read from either the corresponding 4-element group in vs2 (vector-vector form) or the scalar
  # element group in vs2 (vector-scalar form). The next four words of state are generated by
  # iteratively XORing the last three words of the state with the corresponding round key,
  # performing a byte-wise substitution, and then performing XORs between rotated versions of this
  # value and the corresponding current state.
  - name: vsm4r_op_sm4encdec
    # Representative coverpoints; also the _sm_1 through _sm_3 byte coverpoints and crosses
    coverpoint:
      [
        "Zvksed_vsm4r_vv_cg/{cp_vd_edges_egs4_sm_byte_0, cr_vs2_vd_edges_egs4_subbytes_sm_0}",
        "Zvksed_vsm4r_vs_cg/{cp_vd_edges_egs4_sm_byte_0, cr_vs2_vd_edges_egs4_subbytes_sm_0}",
      ]
