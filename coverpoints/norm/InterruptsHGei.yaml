# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # mip holds hip.SGEIP, read from M-mode with a guest external interrupt pending
  - names: [mip_mie_vs, mip_mie_alias]
    coverpoint: ["InterruptsHGei_m_cg/cp_mip_gilen"]

  # Simultaneous interrupts destined for HS-mode are taken in the order SEI, SSI, STI, SGEI, VSEI, VSSI, VSTI
  - names: [hsint_priority]
    coverpoint: ["InterruptsHGei_hs_cg/cp_priority_{sgei, sgei_s}"]

  # Bits hip.SGEIP and hie.SGEIE are the interrupt-pending and interrupt-enable bits for
  # guest external interrupts at supervisor level (HS-level). SGEIP is read-only in hip,
  # and is 1 if and only if the bitwise logical-AND of CSRs hgeip and hgeie is nonzero in
  # any bit. (See .)
  - name: hip_sgeip_sgeie_acc_op
    coverpoint: ["InterruptsHGei_hs_cg/cp_{trigger_sgei, hgeie, hgeip0}"]
  # The hgeip register is an HSXLEN-bit read-only register, formatted as shown in
  # &lt;&lt;hgeipreg&gt;&gt;, that indicates pending guest external interrupts for this
  # hart.
  - name: hgeip_sz_acc_op
    coverpoint: ["InterruptsHGei_hs_cg/cp_{trigger_sgei, hgeie, hgeip0}"]
  # The hgeie register is an HSXLEN-bit read/write register, formatted as shown in
  # &lt;&lt;norm:hgeie_img&gt;&gt;, that contains enable bits for the guest external
  # interrupts at this hart.
  - name: hgeie_sz_acc_op
    coverpoint: ["InterruptsHGei_hs_cg/cp_{trigger_sgei, hgeie, hgeip0}"]
  # Register hgeie selects the subset of guest external interrupts that cause a
  # supervisor-level (HS-level) guest external interrupt. The enable bits in hgeie do not
  # affect the VS-level external interrupt signal selected from hgeip by hstatus.VGEIN.
  - name: hgeie_op
    coverpoint: ["InterruptsHGei_hs_cg/cp_{trigger_sgei, hgeie, hgeip0}"]
  # Guest external interrupt number i corresponds with bit i in both hgeip and hgeie.
  - name: hgeip_hgeie_fields
    coverpoint: ["InterruptsHGei_hs_cg/cp_{trigger_sgei, hgeie, hgeip0}"]
  # Each bit of hgeip summarizes all pending interrupts directed to one virtual hart, as
  # collected and reported by an interrupt controller.
  - name: hgeip_bit_op
    coverpoint: ["InterruptsHGei_hs_cg/cp_{trigger_sgei, hgeie, hgeip0}"]

  # hstatus.VGEIN selects the hgeip bit that drives hip.VSEIP
  - names: [hstatus_vgein_op, hip_vseip_vseie_op]
    coverpoint: ["InterruptsHGei_hs_cg/cp_{trigger_vsei_hgeip, hgeip0}"]

  # When VGEIN=0, no guest external interrupt source is selected for VS-level external interrupts
  - names: [hstatus_vgein_zero]
    coverpoint: ["InterruptsHGei_hs_cg/cp_hgeip0"]
