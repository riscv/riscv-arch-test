# CI configuration for Whisper simulator

ci_enabled: true
exclude_extensions:
  # Max configs: Whisper implements tcontrol while using mstatus.MIE/SIE for breakpoint
  # reentrancy, which Sail cannot model (it has tcontrol only with Use_tcontrol,
  # https://github.com/riscv/sail-riscv/issues/2039), so the reference traps on the tcontrol accesses.
  - SdtrigSm_csr_access_common
  - SdtrigSm_csr_access_global
  - SdtrigSm_tcontrol
  - SdtrigS_csr_access_global
  # SSAMOSWAP with rd = rs2 stores the loaded value instead of the original rs2
  # (https://github.com/tenstorrent/whisper/issues/233).
  - Zicfiss_U-
  # With mstatus.TVM = 1, a VS-mode hgatp write (or a VU-mode satp write) raises illegal instead of virtual
  # instruction (https://github.com/tenstorrent/whisper/issues/227). This also skips the TVM cases Whisper
  # passes; remove once the pinned Whisper includes the fix (https://github.com/tenstorrent/whisper/pull/230).
  - Sm_H_tvm
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 2
