# yaml-language-server: $schema=testplan.schema.json
suite: Sv_Exceptions
source: https://docs.google.com/spreadsheets/d/1W95I4jPbuQBnXzDdIZtOG4kae8vi7djpKtJXWCXPxMU/edit?gid=270777025#gid=270777025
description: |
  The following coverpoints should be exercised in supervisor mode
coverpoints:
  - name: cp_instr_page_fault_s
    goal: Instruction Page Fault
    description: jump to address that causes instruction page fault
  - name: cp_load_page_fault_s
    goal: Load Page Fault
    description: load from address that causes load page fault
  - name: cp_store_page_fault_s
    goal: Store Page Fault
    description: store to address that causes store page fault
  - name: cp_misaligned_priority_s
    goal: Priority of exceptions
    description: Attempt lw and sw and fetch from memory location causing {access fault and page fault}, {page fault and misaligned}, {access fault, page fault, misaligned}
  - name: cp_misaligned_load_page_fault_s
    goal: Page fault on each part of a misaligned load that straddles two pages, from S-mode
    description: "S-mode: va_data is a 4 KiB page with PTE.U=0. Map the two pages {both RWX, first invalid (V=0) and next RWX, first RWX and next invalid (V=0), first RWX and next execute-only}. With each mapping, store and then load at every offset from 1 to size - 1 bytes below the page boundary: lh at 1, lw at 1-3, ld at 1-7 (RV64), flh at 1 (Zfhmin), flw at 1-3 (F), fld at 1-7 (D) and flq at 1-15 (Q). On RV64, also lh one byte below the end of a 2 MiB megapage. Both pages faulting is not tested: which part faults first is implementation-defined. A fault with more than one byte in the faulting page runs only with MISALIGNED_SPLIT_STRATEGY = sequential_bytes: stval holds the address of the first byte the hart accesses in the faulting page, which depends on how it splits the access. With one byte there (one byte below the boundary when the first page faults, size - 1 bytes below it when the next page faults) every hart gives the same result. Needs MISALIGNED_LDST; harts that do not perform misaligned accesses run the test and raise an address-misaligned exception instead."
    expectation: With both pages RWX, each load returns the value just stored (the signature checks it). Otherwise every load faults, load page fault (scause = 13), with stval = the access address when the first page faults, and the page or megapage boundary when the next page faults (or 0 on a hart that does not report the address).
    bins: |-
      straddle_load {completes at every offset; faults in the first page and in the next page at every offset with sequential_bytes, otherwise only with one byte in the faulting page} x mode {S-mode}
      = with sequential_bytes, 12 per Sv mode on RV32 and 36 on RV64 with no FP, + 3 (Zfhmin), 9 (F), 21 (D), 45 (Q); otherwise 8 and 20, + 3, 5, 9, 17. Without REPORT_VA_IN_STVAL_ON_LOAD_PAGE_FAULT, stval is 0, so first-page and next-page faults at the same offset are one faults bin.
    id: stval_op_load_store_fault
    rules:
      - "[norm:stval_op_load_store_fault]"
  - name: cp_misaligned_store_page_fault_s
    goal: Page fault on each part of a misaligned store that straddles two pages, from S-mode
    description: "S-mode: va_data is a 4 KiB page with PTE.U=0. Map the two pages {both RWX, first invalid (V=0) and next RWX, first RWX and next invalid (V=0), first RWX and next execute-only}. With each mapping, store and then load at every offset from 1 to size - 1 bytes below the page boundary: sh at 1, sw at 1-3, sd at 1-7 (RV64), fsh at 1 (Zfhmin), fsw at 1-3 (F), fsd at 1-7 (D) and fsq at 1-15 (Q). On RV64, also sh one byte below the end of a 2 MiB megapage. Both pages faulting is not tested: which part faults first is implementation-defined. A fault with more than one byte in the faulting page runs only with MISALIGNED_SPLIT_STRATEGY = sequential_bytes: stval holds the address of the first byte the hart accesses in the faulting page, which depends on how it splits the access. With one byte there (one byte below the boundary when the first page faults, size - 1 bytes below it when the next page faults) every hart gives the same result. Needs MISALIGNED_LDST; harts that do not perform misaligned accesses run the test and raise an address-misaligned exception instead."
    expectation: With both pages RWX, each load returns the value just stored (the signature checks it). Otherwise every store faults, store/AMO page fault (scause = 15), with stval = the access address when the first page faults, and the page or megapage boundary when the next page faults (or 0 on a hart that does not report the address).
    bins: |-
      straddle_store {completes at every offset; faults in the first page and in the next page at every offset with sequential_bytes, otherwise only with one byte in the faulting page} x mode {S-mode}
      = with sequential_bytes, 12 per Sv mode on RV32 and 36 on RV64 with no FP, + 3 (Zfhmin), 9 (F), 21 (D), 45 (Q); otherwise 8 and 20, + 3, 5, 9, 17. Without REPORT_VA_IN_STVAL_ON_STORE_AMO_PAGE_FAULT, stval is 0, so first-page and next-page faults at the same offset are one faults bin.
    id: stval_op_load_store_fault
    rules:
      - "[norm:stval_op_load_store_fault]"
  - name: cp_misaligned_instr_page_fault_s
    goal: Page fault on each part of a misaligned instruction that straddles two pages, from S-mode
    description: "Zca harts, S-mode: va_data is a 4 KiB page with PTE.U=0 whose last two bytes hold the first half of a 32-bit instruction (addi x0, x0, 0), followed in the next page by a return. Map the two pages {both RWX, first invalid (V=0) and next RWX, first RWX and next invalid (V=0), first RWX and next valid but not executable (RW)}. Jump (jalr) to va_data + 0xFFE. On RV64, repeat across the end of a 2 MiB megapage. One parcel is in each page, so the result does not depend on the hart. Both pages faulting is not tested: which half faults first is implementation-defined."
    expectation: With both pages RWX, the instruction executes and returns. Otherwise instruction page fault (scause = 12) with sepc = the jalr target, the start of the instruction; stval = the jalr target when the first page faults, and the page or megapage boundary when the next page faults. stval may instead be 0 on a hart that does not report the address.
    bins: |-
      straddle_fetch_page {kilopage, megapage on RV64} x straddle_fetch_outcome {completes, first_faults, next_faults} x mode {S-mode}
      = 3 per Sv mode on RV32, 6 per Sv mode on RV64 (2 outcomes, completes and faults, without REPORT_VA_IN_STVAL_ON_INSTRUCTION_PAGE_FAULT)
    id: stval_faulting_address_variable_instr
    rules:
      - "[norm:stval_faulting_address_variable_instr]"
  - heading: The following coverpoints should be exercised in user mode
  - name: cp_instr_page_fault_u
