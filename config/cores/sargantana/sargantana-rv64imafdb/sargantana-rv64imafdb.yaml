  # ---------------- F/D ----------------
  # mstatus.FS is a normal two-bit field, forced to Dirty when an FP instruction writes:
  #   csr_bsc.sv#L1842
  HW_MSTATUS_FS_DIRTY_UPDATE: precise
  MSTATUS_FS_LEGAL_VALUES: [0, 1, 2, 3]
  # mstatus.VS is writable (it is in SMODE_STATUS_WRITE_MASK, def_pkg.sv#L115-L121) even
  # though the vector unit is not modelled in this configuration.
  MSTATUS_VS_LEGAL_VALUES: [0, 1, 2, 3]
  # ---------------- A ----------------
  # The HPDcache reserves the naturally aligned 8-byte word (hpdcache_uncached.sv#L285-L286;
  # Sail reservation_set_size_exp = 3).
  LRSC_RESERVATION_STRATEGY: "reserve exactly enough to cover the access"
  LRSC_FAIL_ON_VA_SYNONYM: false
  # A misaligned LR/SC raises the misaligned exception like any other access:
  # load_store_queue.sv#L148-L161 covers AMO/LR/SC through is_amo_store_or_cmo.
  LRSC_MISALIGNED_BEHAVIOR: "always raise misaligned exception"
  LRSC_FAIL_ON_NON_EXACT_LRSC: false
  # ---------------- CBO ----------------
  # "DCacheLineWidth: 512" (drac_pkg.sv#L1310) = 64 bytes.
  CACHE_BLOCK_SIZE: 64
  FORCE_UPGRADE_CBO_INVAL_TO_FLUSH: false
  # ---------------- Zicntr ----------------
  # csr_bsc.sv#L742: "riscv_pkg::CSR_TIME: begin csr_rdata = reg_time_q;"
  TIME_CSR_IMPLEMENTED: true
  # ---------------- S ----------------
  # "parameter ASID_WIDTH = 13" (csr_bsc.sv#L27); satp.asid is masked to that width on
  # write ("satp.asid = satp_temp.asid & {{(16-ASID_WIDTH){1'b0}}, {ASID_WIDTH{1'b1}}};",
  # csr_bsc.sv#L1253).  Note the TLB ties the ASID off
  # ("assign dtlb_comm_o.req.asid = '0;", load_store_queue.sv#L374), so the field is
  # architecturally visible but has no effect on translation.
  ASID_WIDTH: 13
  # "riscv_pkg::CSR_STVEC:              stvec_d     = {csr_wdata[63:2], 1'b0, csr_wdata[0]};"
  #   https://github.com/bsc-loca/csr/blob/c5c8a1d1302b62cbb5fd88863a446bfb3312adb9/rtl/csr_bsc.sv#L1241
  # Unlike mtvec, stvec does NOT force the extra 256-byte alignment in vectored mode,
  # yet the dispatch adder is the same truncated 6-bit add
  # ("trunc_sum_6bits(stvec_q[7:2] + ex_cause_i[5:0])", csr_bsc.sv#L2817-L2820), so a
  # vectored stvec whose base is not 256-byte aligned wraps inside its 256-byte block.
  # The config records what stvec accepts; the wrap is a DUT bug, not a config knob.
  STVEC_MODES: [0, 1]
  STVEC_BASE_ALIGNMENT_VECTORED: 4
  # satp accepts only MODE 0 and MODE 8.
  SATP_MODE_BARE: true
  REPORT_VA_IN_STVAL_ON_BREAKPOINT: true
  REPORT_VA_IN_STVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_LOAD_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_PAGE_FAULT: true
  REPORT_ENCODING_IN_STVAL_ON_ILLEGAL_INSTRUCTION: true
  STVAL_WIDTH: 64
  # mie.SEIE/SSIE/STIE are writable (same mask, csr_bsc.sv#L1565-L1577), mideleg.SEI/SSI/STI
  # are writable ("mask = riscv_pkg::MIP_SSIP | riscv_pkg::MIP_STIP | riscv_pkg::MIP_SEIP | riscv_pkg::MIP_LCOFIP;",
  # https://github.com/bsc-loca/csr/blob/c5c8a1d1302b62cbb5fd88863a446bfb3312adb9/rtl/csr_bsc.sv#L1557-L1563),
  # and M-mode software can set mip.SEIP/SSIP/STIP (csr_bsc.sv#L1600-L1610).  SEIP is also
  # driven by the core's irq_i[1] input, which the standalone testbench ties to zero
  # (core_tile simulator/sim_top.sv#L263-L269); there is no Sstc, so STIP is software-only.
  SEI_INTR_IMPL: true
  SSI_INTR_IMPL: true
  STI_INTR_IMPL: true
  # "riscv_pkg::CSR_SCOUNTEREN:         scounteren_d =  {csr_wdata[31:0]};" (csr_bsc.sv#L1240)
  SCOUNTENABLE_EN:
