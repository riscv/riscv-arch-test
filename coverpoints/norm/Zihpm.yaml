# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # RISC-V ISAs provide a set of up to thirty-two 64-bit performance counters and timers
  - name: Zihpm_op_sz_mode_acc_count
    coverpoint: ["Zihpm_csrrs_cg/{cp_cntr_hpm}"]
  # These counters are divided between the ext:zicntr[] and extlink:zihpm[] extensions.
  - name: Zihpm_op_sz_mode_acc_partition
    coverpoint: ["Zihpm_csrrs_cg/{cp_cntr_hpm}"]
  # accessible via unprivileged XLEN-bit read-only CSR registers 0xC00–0xC1F
  - name: Zihpm_op_sz_mode_acc_priv
    coverpoint: ["Zihpm_csrrs_cg/{cp_cntr_hpm}"]
  # when XLEN=32, the upper 32 bits are accessed via CSR registers 0xC80–0xC9F
  - name: Zihpm_op_sz_mode_acc_xlen32
    coverpoint: ["Zihpm_csrrs_cg/{cp_cntr_hpm}"]

  - name: hpmcounter_op_sz_mode
    coverpoint: ["Zihpm_csrrs_cg/{cp_cntr_hpm}"]
  # When XLEN=32, the upper 32 bits of these performance counters are accessible
  # via additional CSRs hpmcounter3h-hpmcounter31h.
  - name: hpm_counter_op_sz_mode_xlen32
    coverpoint:
      [
        "Zihpm_csrrs_cg/cp_cntr_hpm/{hpmcounter3h, hpmcounter4h, hpmcounter5h, hpmcounter6h, hpmcounter7h, hpmcounter8h, hpmcounter9h, hpmcounter10h, hpmcounter11h, hpmcounter12h, hpmcounter13h, hpmcounter14h, hpmcounter15h, hpmcounter16h, hpmcounter17h, hpmcounter18h, hpmcounter19h, hpmcounter20h, hpmcounter21h, hpmcounter22h, hpmcounter23h, hpmcounter24h, hpmcounter25h, hpmcounter26h, hpmcounter27h, hpmcounter28h, hpmcounter29h, hpmcounter30h, hpmcounter31h}",
      ]

  # The Zihpm extension depends on the Zicsr extension.
  - name: hpm_counter_op_sz_mode_dependency
    coverpoint:
      [
        "Configuration requirement: Zihpm requires Zicsr; checked by UDB (https://github.com/riscv/riscv-unified-db/blob/main/spec/std/isa/ext/Zihpm.yaml[ext/Zihpm.yaml]).",
      ]

  # The implemented number and width of these additional counters, and the set of
  # events they count, are platform-specific.
  - name: hpm_platform_specific_impl
    coverpoint: ["Needs infrastructure: platform-specific event definitions."]

  # If the configuration used to select the events counted by a counter is
  # misconfigured, the counter may return a constant value.
  - name: hpm_misconfigured_event_behavior
    coverpoint:
      [
        "No independent assertion: permits a misconfigured counter to return a constant.",
      ]

  # Not tested: accessing an unimplemented counter is implementation-defined behavior, and the
  # two permitted responses (an illegal-instruction exception, or a constant value) are equally
  # conformant, so a reference signature cannot require either one. cp_cntr_hpm accordingly reads
  # only the counters that HPM_COUNTER_EN says the configuration implements.
  - name: hpm_unimplemented_counter_access
    coverpoint:
      [
        "Needs test: read an unimplemented counter and check that it traps or returns a constant.",
      ]
