  - name: Sdtrig_icount_u
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_instr"]

  # This register provides access to the trigger selected by tselect.
  - name: Sdtrig_itrigger
    coverpoint: ["SdtrigSm_sdtrig_cg/cp_sdtrig_csr_access_common"]

  # The reset values listed here apply to every underlying trigger.
  - name: Sdtrig_itrigger_reset
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # This register is accessible as tdata1 when type is 4.
  - name: Sdtrig_itrigger_access
    coverpoint: ["SdtrigSm_itrigger_cg/cp_sdtrig_itrigger"]

  # This trigger can fire when an interrupt trap is taken.
  - name: Sdtrig_itrigger_fire
    coverpoint: ["SdtrigSm_itrigger_cg/cp_sdtrig_itrigger"]

  # It can be enabled for individual interrupt numbers by setting the bit
  # corresponding to the interrupt number in tdata2. The interrupt number is
  # interpreted in the mode that the trap handler executes in.
  - name: Sdtrig_itrigger_enable_num
    coverpoint: ["SdtrigSm_itrigger_cg/cp_sdtrig_itrigger"]

  # In addition the trigger can be enabled for non-maskable interrupts using nmi.
  - name: Sdtrig_itrigger_enable_nmi
    coverpoint: ["Non-maskable interrupts not defined by the specifications"]

  # If XLEN is 32, then it is not possible to set a trigger for interrupts with
