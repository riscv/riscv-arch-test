[tools]
prek = "0.4.10"
ruby = "3.4.10"
shellcheck = "0.11.0"
uv = "0.11.31"
"gem:bundler" = "4.0.17"

[settings.ruby]
compile = false

[tasks.prek]
description = "Run prek hooks on all files"
run = "prek run --all-files"

[tasks.prek-install]
description = "Install prek git hooks"
run = "prek install"
