# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  - name: A_aq_rl_bits
    coverpoint: ["TODO add coverpoint cp_custom_aqrl like Zalrsc"]

  - name: amo_release_consistency
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  - name: A_domain_specific_ordering
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  - name: A_no_aq_rl
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  - name: A_acquire_semantics
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  - name: A_release_semantics
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  - name: A_seq_cst_semantics
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  # The A extension comprises the Zalrsc and Zaamo extensions, which are
  # defined in the following sections.
  - name: A_comprises
    coverpoint: ["Definition, checked through UDB"]

  # These AMO instructions atomically load a data value from the address in rs1, place the value into
  # register rd, apply a binary operator to the loaded value and the original value in rs2, then store
  # the result back to the original address in rs1.
  - name: amo_op
    # Representative coverpoints; cp_rs2_edges of the other Zaamo covergroups
    coverpoint:
      [
        "{Zaamo_amoswap_w_cg, Zaamo_amoadd_w_cg, Zaamo_amoand_w_cg, Zaamo_amomax_w_cg}/cp_rs2_edges",
        "atomicity OUT-OF-SCOPE for single hart",
      ]

  - name: amo_operand_size
    coverpoint:
      [
        "{Zaamo_amoadd_w_cg, Zaamo_amoadd_d_cg}/cp_rs2_edges",
        "Zaamo_amoadd_w_cg/cp_memval_word",
      ]

  - name: amo_alignment
    coverpoint: ["Zaamo_amoadd_w_cg/cp_align_word"]

  # The operations supported are swap, integer add, bitwise AND, bitwise OR, bitwise XOR, and signed
  # and unsigned integer maximum and minimum.
  - name: amo_ops_supported
    # Representative coverpoints; cp_rs2_edges of the other Zaamo covergroups
    coverpoint:
      [
        "{Zaamo_amoor_w_cg, Zaamo_amoxor_w_cg, Zaamo_amomin_w_cg, Zaamo_amominu_w_cg}/cp_rs2_edges",
      ]

  # For each level of support, naturally aligned AMOs of a given width are supported if the underlying
  # memory region supports reads and writes of that width.
  - name: pma_amo_sz_support
    # Representative coverpoints; cp_asm_count of the other Zaamo covergroups
    coverpoint: ["{Zaamo_amoadd_w_cg, Zaamo_amoadd_d_cg}/cp_asm_count"]
