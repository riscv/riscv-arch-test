  # matching PMP rule, to denied instead of ignored.
  - name: mseccfg_mmwp_op_warl
    coverpoint: ["TODO: Smepmp is not yet tested"]

  # The mseccfg.MML (Machine Mode Lockdown) is a WARL field.
  - name: mseccfg_mml_warl
    coverpoint: ["TODO: Smepmp is not yet tested"]

  # This is a sticky bit, meaning that once set it cannot be unset until a PMP reset.
  - name: mseccfg_mml_sticky
    coverpoint: ["TODO: Smepmp is not yet tested"]

  # When mseccfg.MML is set the system's behavior changes in the following way:
  - name: mseccfg_mml_set
    coverpoint: ["TODO: Smepmp is not yet tested"]

  # The meaning of pmpcfg.L changes: Instead of marking a rule as locked and enforced in all modes,
  # it now marks a rule as M-mode-only when set and S/U-mode-only when unset. The formerly reserved
  # encoding of pmpcfg.RW=01, and the encoding pmpcfg.LRWX=1111, now encode a Shared-Region.
  - name: mseccfg_mml_pmpcfg_l_op
    coverpoint: ["TODO: Smepmp is not yet tested"]

  # An M-mode-only rule is enforced on accesses whose effective privilege mode is Machine and denied
