# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # For AMOs, the Zaamo extension requires that the address held in rs1 be naturally
  # aligned to the size of the operand (i.e., eight-byte aligned for doublewords and
  # four-byte aligned for words).
  - name: amo_alignment
    coverpoint:
      [
        "ExceptionsSvZaamo_cg/{cp_misaligned_priority_s, cp_misaligned_priority_u}",
      ]

  # The misaligned atomicity granule PMA optionally relaxes this alignment requirement.
  # The misaligned amoadd.w lies inside a 16-byte granule, so it does not raise an
  # address-misaligned exception on a Zama16b hart.
  - name: misaligned_atomicity_granule_size
    coverpoint:
      [
        "ExceptionsSvZaamo_cg/{cp_misaligned_priority_s, cp_misaligned_priority_u}",
      ]

  # Priority|Exc.Code|Description === Highest|3|Instruction address breakpoint¶|12,
  # 1|During instruction address translation: First encountered page fault or access
  # fault¶|1|With physical address for instruction: Instruction access fault¶|2 0
  # 8,9,11 3 3|Illegal instruction Instruction address misaligned Environment call
  # Environment break Load/store/AMO address breakpoint¶|4,6|Optionally:
  # Load/store/AMO address misaligned¶|13, 15, 5, 7|During address translation for
  # an explicit memory access: First encountered page fault or access
  # fault¶|5,7|With physical address for an explicit memory access: Load/store/AMO
  # access fault¶Lowest|4,6|If not higher priority: Load/store/AMO address
  # misaligned ===
  - name: exc_priority
    coverpoint:
      [
        "ExceptionsSvZaamo_cg/{cp_misaligned_priority_s, cp_misaligned_priority_u}",
      ]

  # Load/store/AMO address-misaligned exceptions may have either higher or lower
  # priority than load/store/AMO page-fault and access-fault exceptions.
  - name: mcause_exccode_priority_misaligned
    coverpoint:
      [
        "ExceptionsSvZaamo_cg/{cp_misaligned_priority_s, cp_misaligned_priority_u}",
      ]
