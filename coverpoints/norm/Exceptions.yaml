  - name: hstatus_vtvm_op
    coverpoint: ["Exceptions_H_cg/cp_virtual_instr_vs_{s_vma_instr, satp}"]

  # Attempts to execute a virtual-machine load/store instruction (HLV, HLVX, or HSV) when
