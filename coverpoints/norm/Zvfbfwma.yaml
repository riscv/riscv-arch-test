# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # This extension depends upon the Zvfbfmin and Zfbfmin extensions.
  - name: Zvfbfwma_depends
    coverpoint: ["Definition, checked through UDB"]
  # Encoding (Vector-Vector) (vfwmaccbf16.vv)
  - name: vfwmaccbf16_encoding_vv
    coverpoint: ["Zvfbfwma_vfwmaccbf16_vv_cg/cp_asm_count"]
  # Encoding (Vector-Scalar) (vfwmaccbf16.vf)
  - name: vfwmaccbf16_encoding_vf
    coverpoint: ["Zvfbfwma_vfwmaccbf16_vf_cg/cp_asm_count"]
  # This instruction performs a widening fused multiply-accumulate operation, where each
  # pair of BF16 values are multiplied and their unrounded product is added to the
  # corresponding FP32 accumulate value. The sum is rounded according to the frm register.
  - name: vfwmaccbf16_op
    coverpoint: [""]
  # The vector-scalar version is similar, but instead of reading elements from vs1, a
  # scalar BF16 value is read from the FPU register rs1.
  - name: vfwmaccbf16-vf
    coverpoint: []
  # BF16 computational instructions defined in this chapter support all IEEE 754-2008
  # features, including all rounding modes, subnormal inputs and outputs, overflow and
  # underflow, and default exception handling. Tininess is detected after rounding.
  - name: bf16_subnorm
    coverpoint: [""]
  # SEW is any value other than 16
  - name: vfwmaccbf16_sew_rsv
    coverpoint: [""]
  # In the vector-vector version, the BF16 elements are read from vs1 and vs2 and FP32
  # accumulate value is read from vd. The FP32 result is written to the destination
  # register vd.
  - name: vfwmaccbf16-vv
    coverpoint: []
