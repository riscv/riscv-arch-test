# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # The Svade extension: when a virtual page is accessed and the A bit is clear, or is
  # written and the D bit is clear, a page-fault exception is raised.
  - name: Svade_access_ad_bit_clear
    coverpoint:
      [
        "Svade_cg/Abit_unset_{exec,read,write}_{s,u}",
        "Svade_cg/Dbit_unset_write_{s,u}",
      ]

  # When hardware updating of A/D bits is disabled, the Svade extension, which mandates
  # exceptions when A/D bits need be set, instead takes effect.
  - name: Svadu_disabled_hw_update_falls_back_to_Svade
    coverpoint:
      [
        "Svade_cg/Abit_unset_{exec,read,write}_{s,u}",
        "Svade_cg/Dbit_unset_write_{s,u}",
      ]

  # If the Svadu extension is implemented, the ADUE bit controls whether hardware
  # updating of PTE A/D bits is enabled for S-mode and G-stage address translations.
  # When ADUE=1, hardware updating of PTE A/D bits is enabled during S-mode address
  # translation, and the implementation behaves as though the Svade extension were not
  # implemented for S-mode address translation. When the hypervisor extension is
  # implemented, if ADUE=1, hardware updating of PTE A/D bits is enabled during G-stage
  # address translation, and the implementation behaves as though the Svade extension
  # were not implemented for G-stage address translation. When ADUE=0, the
  # implementation behaves as though Svade were implemented for S-mode and G-stage
  # address translation.
  - name: menvcfg_adue_op
    coverpoint: ["Svade_cg/Svade_enabled"]
