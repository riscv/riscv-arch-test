# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # RV32|RV64|Mnemonic|Instruction === ✓|✓|czero.eqz rd, rs1, rs2|<<insns-czero-eqz>>¶ ✓|✓|czero.nez
  # rd, rs1, rs2|<<insns-czero-nez>> ===
  - name: Zicond_insns_tbl
    coverpoint: ["Zicond_{czero_eqz,czero_nez}_cg/cp_asm_count"]

  - name: czero-eqz_op
    # If rs2 contains the value zero, this instruction writes the value zero to rd.  Otherwise, this instruction copies the contents of rs1 to rd.
    coverpoint:
      ["Zicond_czero_eqz_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  # Furthermore, if the Zkt extension is implemented, this instruction's timing is independent of the
  # data values in rs1 and rs2.
  - name: czero-eqz_inst_ctime
    coverpoint: ["Needs infrastructure: execution-latency measurement."]
  - name: czero-nez_op
    # If rs2 contains a nonzero value, this instruction writes the value zero to rd.  Otherwise, this instruction copies the contents of rs1 to rd.
    coverpoint:
      ["Zicond_czero_nez_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  # Furthermore, if the Zkt extension is implemented, this instruction's timing is independent of the
  # data values in rs1 and rs2.
  - name: czero-nez_Zkt_timing
    coverpoint: ["Needs infrastructure: execution-latency measurement."]
