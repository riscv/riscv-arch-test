# CI configuration for QEMU simulator
# Shared across all QEMU configs

# SsstrictS & SsstrictU excluded as they are not supported by the old trap handler
# SsstrictSm excluded because of Sail bugs
# 1. incorrect decoding of add.uw instruction) Link: https://github.com/riscv/sail-riscv/issues/1711
# 2. vmv<nr>r.v instructions fail to trap when vill=1 Link: https://github.com/riscv/sail-riscv/issues/1709
# 3. Add configuration parameter for vsetvli/vsetvl behavior on reserved vtype values Link: https://github.com/riscv/sail-riscv/issues/1699
# 4. Spike mtval reports cache-block-aligned address on CBO access fault instead of faulting virtual address, Link: https://github.com/riscv-software-src/riscv-isa-sim/issues/2296
# 5. RISC-V: CBO instructions (cbo.clean/flush/inval) decoded as `lq` instead of cache block operations, Link: https://gitlab.com/qemu-project/qemu/-/work_items/3480
# 6. RISC-V: Reserved opcode 1111111 (op31) causes infinite trap loop instead of illegal instruction trap, Link: https://gitlab.com/qemu-project/qemu/-/work_items/3479
# 7. QEMU is not Ssstrict compliant, and does not raise illegal exceptions on M-mode read only CSRs, which causes some tests to fail.
ci_enabled: true
# Status as of QEMU v11.0.2:
# Sm: medeleg WARL parameter mismatch (config issue, not a QEMU bug)
# S: sstatus WARL mismatch (QEMU supports dynamic XLEN)
# Zacas/ZacasZabha: amocas with rd=x0 corrupts subsequent branch on x0 (https://gitlab.com/qemu-project/qemu/-/work_items/3526)
# PMPSm: pmpcfg bits [6:5] writable (https://gitlab.com/qemu-project/qemu/-/work_items/3531);
#        causes pmpsm_csr_walk-* to fail on real QEMU (10/54 pmp64/PMPSm tests,
#        4/36 pmp32/PMPSm tests).
# ExceptionsZalrsc/ExceptionsSvZalrsc: sc.w to no-permission region returns failure instead of raising
#        store/AMO access fault (https://gitlab.com/qemu-project/qemu/-/work_items/3323, closed upstream but not in v11.0.2)
# ExceptionsZicboU/S, SvZicbo: Zicbom CBOs skip PMA/PMP permission checks (https://gitlab.com/qemu-project/qemu/-/work_items/3501);
# SvaduPMP: hardware A/D update ignores PMP write permission on PTE (https://gitlab.com/qemu-project/qemu/-/work_items/3495)
# Svinval: sfence.w.inval/sfence.inval.ir don't raise illegal instruction in U-mode
#        (https://gitlab.com/qemu-project/qemu/-/work_items/3493); also hangs Svinval.elf
# ExceptionsZaamo/Zama16b: QEMU zama16b handling is incomplete: misaligned Zabha/Zacas AMOs fault,
#        but cross-granule word/doubleword AMOs execute instead of trapping.
# TODO: Remove SsstrictV when sail SsstrictV is implemented
# Smstateen will be added back once sail starts supporting SM1P13 too
# ZawrsU and ZawrsS fail on qemu due to stval mismatching, filed QEMU issue https://gitlab.com/qemu-project/qemu/-/work_items/4080
# ZicntrS and ZicntrU fail on qemu because ecall increments instret. Filed QEMU issue: https://gitlab.com/qemu-project/qemu/-/work_items/4087
exclude_extensions: "Sm,S,SsstrictSm,SsstrictS,SsstrictU,Zacas,ZacasZabha,PMPSm,ExceptionsZalrsc,ExceptionsZicboU,ExceptionsZicboS,SvaduPMP,SvZicbo,Svinval,ExceptionsZaamo,ExceptionsSvZalrsc,Zama16b,SsstrictV,Smstateen,Zkr,ZawrsS,ZawrsU,SdtrigSm,SdtrigS,SdtrigU,ZicntrS,ZicntrU"
install_script: ".github/scripts/install-qemu.sh"
apt_packages: "libglib2.0-dev libfdt-dev libpixman-1-dev zlib1g-dev ninja-build"
shards: 1
config_shards:
  qemu-rv64-max: 2
