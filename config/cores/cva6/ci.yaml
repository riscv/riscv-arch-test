# SPDX-License-Identifier: Apache-2.0
# CI configuration for the OpenHW CVA6 Verilator testharness.
# cv32a65x, cv32a60x and cv32a6_imac_sv32 share this file: one ci.yaml covers every run_cmd.txt
# in this directory.

ci_enabled: true

exclude_extensions:
  # PMP_Sm_cfg_A_tor_zero stores to, loads from and jumps to address 0. In the testharness
  # address 0 is the debug module (DebugBase=0x0, DebugLength=0x1000), which answers every
  # access with OKAY, while Sail expects an access fault because there is no memory at 0.
  # CVA6 has no data-side PMA check, so the DUT raises no fault and the load returns 0.
  # Remove this exclusion once riscv-arch-test#2963 drops the address-0 probes.
  # The exclusion is preemptive: both configs declare NUM_PMP_ENTRIES: 0, so no PMP test
  # runs yet. It takes effect once cv32a65x declares its PMP entries (riscv-arch-test#2904).
  # https://github.com/openhwfoundation/cva6/blob/81245a47fad8fe1a5d562d953ef2662e099def76/corev_apu/tb/ariane_soc_pkg.sv#L58
  # https://github.com/riscv/riscv-arch-test/issues/2963
  - PMP_Sm_cfg_A_tor_zero

# device-tree-compiler and the Boost libraries are required by CVA6's Spike build
# (verif/regress/install-spike.sh). Without them fesvr is not installed and the
# testharness fails to compile with "fesvr/dtm.h: No such file or directory".
apt_packages: "autoconf flex bison help2man libfl-dev ccache zlib1g-dev device-tree-compiler libboost-regex-dev libboost-system-dev"
install_script: ".github/scripts/install-cva6.sh"
setup_script: ".github/scripts/setup-cva6.sh"
