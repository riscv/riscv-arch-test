# CI configuration for the Hazard3 core

ci_enabled: true

# Wren6991/Hazard3 @ ba0c83c (develop):
#   Sm                11 tests: mtval is read-only zero and mhpmcounter3..31/mhpmevent3..31 are
#                     read-only zero; both are legal, but sail.json cannot express them.
#   ExceptionsZalrsc  sc.w to an address with no memory retires with rd = 1 instead of raising a
#                     store access fault.
#   InterruptsSm      InterruptsSm_wfi_U hangs: the timer interrupt arrives before the test reads
#                     the trap count it waits on.
exclude_extensions: "ExceptionsZalrsc,InterruptsSm,Sm"

apt_packages: "autoconf flex bison help2man libfl-dev ccache"
install_script: ".github/scripts/install-hazard3.sh"
setup_script: ".github/scripts/setup-hazard3.sh"
