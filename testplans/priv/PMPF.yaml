# yaml-language-server: $schema=testplan.schema.json
suite: PMPF
source: https://docs.google.com/spreadsheets/d/1VuBt-H9VVWh8k-USAJEplrgEJETjQ-iNjD4Iq_ZOnN0/edit?gid=1472001893#gid=1472001893
coverpoints:
  - heading: "See PMPM for general information.\nTests run in M mode.\nIn this suite, loads = flw, fld, flh\nstores = fsw, fsd, fsh\nSome loads/stores throw illegal instruction trap if not supported"
  - name: cp_cfg_RW
    goal: The R, W, ...bits, when set, indicate that the PMP entry permits read, write
    description: |-
      Check that WR bits control write/read access for every type of load and store.
      mstatus.FS = nonzero. Attempt all types of reads and writes with pmpcfg_i.L=1, all legal pmpcfg_i.XWR
      Observe proper access faults for restricted read/write regions
    bins: 6 XWR * (3 loads + 3 stores)
