# CI configuration for CORE-V Wally (CVW)
# Requires Verilator and the CVW repository

# SsstrictSm excluded because of Sail bug (incorrect decoding of add.uw instruction)
# Sail Issue Link: https://github.com/riscv/sail-riscv/issues/1711
# ExceptionsZicboS/ExceptionsZicboU excluded due to Wally bug (to be reported upstream):
# the CMO spec normatively requires that a page-fault/guest-page-fault/access-fault
# taken by a CBO write the faulting effective address (the rs1 value) to *tval
# [#norm:fault_excep_csr], but Wally writes 0. The suites' misaligned access-fault
# probes (cbo.* at ACCESS_FAULT_ADDR+1) catch this: sail records EA in the trap
# signature, Wally records 0 -> selfcheck mismatch.
ci_enabled: true
exclude_extensions: "Sm,SsstrictSm,SsstrictS,SsstrictU,InterruptsS,InterruptsU,InterruptsSstc,ExceptionsZalrsc,ExceptionsZaamo,ExceptionsSvZalrsc,ExceptionsSvZaamo,ExceptionsZicboS,ExceptionsZicboU,Sv,Svpbmt,Zicsr"
apt_packages: "autoconf flex bison help2man libfl-dev ccache"
install_script: ".github/scripts/install-cvw.sh"
setup_script: ".github/scripts/setup-cvw.sh"
# Default to a single shard; only the heavyweight ``gc`` configs benefit
# from sharding. ``imc`` runs the full implemented test set quickly enough
# in a single job, so paying the extra runner cost there isn't worth it.
shards: 1
config_shards:
  cvw-rv32gc: 5
  cvw-rv64gc: 5
