# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # If the Svrsw60t59b extension is implemented, then bits 60-59 of the page table
  # entries (PTEs) are reserved for use by supervisor software and are ignored by the
  # implementation.
  - names: [Svrsw60t59b_reserved_bits_60_59, Svrsw60t59b_depends_on_Sv39]
    coverpoint:
      [
        "Svrsw60t59b_cg/cp_{load, store, fetch}",
        "Svrsw60t59b_H_cg/cp_vsatp_{load, store, fetch}",
      ]

  # If the Hypervisor (H) extension is also implemented, then bits 60-59 of the G-stage
  # PTEs are reserved for use by supervisor software and are ignored by the
  # implementation.
  - name: Svrsw60t59b_H_g_stage_reserved_bits
    coverpoint: ["Svrsw60t59b_H_cg/cp_hgatp_{load, store, fetch}"]
