# CI configuration for Spike simulator
# Shared across all Spike configs

ci_enabled: true
# Smstateen will be added back once sail starts supporting Sscsrind too
# Sdtrig* not yet supported in Sail reference (https://github.com/riscv/sail-riscv/issues/222)
# ZicfissU: Spike treats every shadow stack access as a store when walking the page table (mmu.cc,
# ss_access), so SSPOPCHK from a shadow stack page with pte.D=0 raises a store/AMO page fault under Svade
# instead of reading it. The store/AMO type only selects the reported cause; SSPOPCHK does not write.
# Not yet reported upstream.
exclude_extensions: "Smstateen,SdtrigSm,SdtrigS,SdtrigU,ZicfissU"
install_script: ".github/scripts/install-spike.sh"
apt_packages: "device-tree-compiler libboost-regex-dev libboost-system-dev"
shards: 1
config_shards:
  spike-rv64-max: 2
