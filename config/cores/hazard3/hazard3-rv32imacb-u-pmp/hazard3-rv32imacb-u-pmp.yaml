  # ------------------------------------------------------------------ Zicntr
  # There is no time/timeh CSR. ACT reacts to this by emulating time reads from the
  # platform's memory-mapped mtime (RVMODEL_MTIME_ADDRESS) through the invisible trap
  # handler, which is what makes the Zicntr suites and the whole machine-timer-interrupt
  # family runnable on this core.
  #   Quote: "No hardware effect, as the `time`/`timeh` CSRs are not implemented."
  #   https://github.com/Wren6991/Hazard3/blob/8af992930f71a69b0e06c38734c1094f41a05ca0/doc/sections/csr.adoc#L276
  TIME_CSR_IMPLEMENTED: false
