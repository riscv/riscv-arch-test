# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
# UDB architecture configuration for XiangShan Kunminghu V2 (KunminghuV2Config), run as the
# SimTop difftest emulator built with Verilator.
#
# Written against OpenXiangShan/XiangShan @ e7bab53e66dfb3c4a1d11cf9519b0396f8576cae (branch
# kunminghu-v2) and the XiangShan User Guide @ 015f7d3402cc989d10dbca6ad6c0c8f07805dfa0 (branch
# kunminghu-v2). kunminghu-v2 is the branch the maintainers call "the stable rva23 version"
# (OpenXiangShan/XiangShan#6545); master is kunminghu-v3 and still in development.
#
# The extension list is XiangShan's own ISA string, minus the extensions noted below:
#   https://github.com/OpenXiangShan/XiangShan/blob/e7bab53e66dfb3c4a1d11cf9519b0396f8576cae/src/main/scala/xiangshan/Parameters.scala#L357-L371
#   https://github.com/OpenXiangShan/XiangShan-User-Guide/blob/015f7d3402cc989d10dbca6ad6c0c8f07805dfa0/docs/en/instruction-set.md#L10-L19
# Parameters marked (measured) were read back from this emulator with the riscv-arch-test UDB
# feature extractor (tests-dev/priv/UDBFeatureExtractor); the others cite the RTL.
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: xiangshan-kmhv2
description: XiangShan Kunminghu V2 (KunminghuV2Config), RV64GCBVH, VLEN 128

implemented_extensions:
  # RV64 with every single-letter extension in the ISA string: i, m, a, f, d, c, b, v, h.
  # misa is read-only (measured: MUTABLE_MISA_* all false below).
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: A, version: "= 2.1.0" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  - { name: Zacas, version: "= 1.0.0" }
  # LR reserves a naturally aligned 64-byte block (measured), so both Za64rs and Za128rs hold.
  - { name: Za64rs, version: "= 1.0.0" }
  - { name: Za128rs, version: "= 1.0.0" }
  - { name: Zawrs, version: "= 1.0.0" }
  - { name: F, version: "= 2.2.0" }
  - { name: D, version: "= 2.2.0" }
  - { name: Zfa, version: "= 1.0.0" }
  - { name: Zfh, version: "= 1.0.0" }
  - { name: Zfhmin, version: "= 1.0.0" }
  - { name: C, version: "= 2.0" }
  - { name: Zca, version: "= 1.0.0" }
  - { name: Zcd, version: "= 1.0.0" }
  - { name: Zcb, version: "= 1.0.0" }
  - { name: Zcmop, version: "= 1.0.0" }
  - { name: B, version: "= 1.0.0" }
  - { name: Zba, version: "= 1.0.0" }
  - { name: Zbb, version: "= 1.0.0" }
  - { name: Zbs, version: "= 1.0.0" }
  - { name: Zbc, version: "= 1.0.0" }
  # Scalar crypto: zbkb, zbkc, zbkx, zkn (zknd, zkne, zknh), zksed, zksh and zkt, i.e. Zkn and Zks.
  - { name: Zbkb, version: "= 1.0.0" }
  - { name: Zbkc, version: "= 1.0.0" }
  - { name: Zbkx, version: "= 1.0.0" }
  - { name: Zkn, version: "= 1.0.0" }
  - { name: Zknd, version: "= 1.0.0" }
  - { name: Zkne, version: "= 1.0.0" }
  - { name: Zknh, version: "= 1.0.0" }
  - { name: Zks, version: "= 1.0.0" }
  - { name: Zksed, version: "= 1.0.0" }
  - { name: Zksh, version: "= 1.0.0" }
  - { name: Zkt, version: "= 1.0.0" }
  # V 1.0 with VLEN = 128 and ELEN = 64.
  #   Quote: "VLEN: Int = 128," / "ELEN: Int = 64,"
  #   https://github.com/OpenXiangShan/XiangShan/blob/e7bab53e66dfb3c4a1d11cf9519b0396f8576cae/src/main/scala/xiangshan/Parameters.scala#L60-L61
  # Zvbc and the other Zvk* extensions are not implemented (OpenXiangShan/XiangShan#6601).
  - { name: V, version: "= 1.0.0" }
  - { name: Zve32x, version: "= 1.0.0" }
  - { name: Zve32f, version: "= 1.0.0" }
  - { name: Zve64x, version: "= 1.0.0" }
  - { name: Zve64f, version: "= 1.0.0" }
  - { name: Zve64d, version: "= 1.0.0" }
  - { name: Zvl32b, version: "= 1.0.0" }
  - { name: Zvl64b, version: "= 1.0.0" }
  - { name: Zvl128b, version: "= 1.0.0" }
  - { name: Zvfh, version: "= 1.0.0" }
  - { name: Zvfhmin, version: "= 1.0.0" }
  - { name: Zvbb, version: "= 1.0.0" }
  - { name: Zvkb, version: "= 1.0.0" }
  - { name: Zvkt, version: "= 1.0.0" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zifencei, version: "= 2.0.0" }
  - { name: Zicntr, version: "= 2.0" }
  - { name: Zihpm, version: "= 2.0.0" }
  - { name: Zicond, version: "= 1.0" }
  - { name: Zimop, version: "= 1.0.0" }
  - { name: Zihintntl, version: "= 1.0.0" }
  - { name: Zihintpause, version: "= 2.0.0" }
  - { name: Zicbom, version: "= 1.0.0" }
  - { name: Zicbop, version: "= 1.0.0" }
  - { name: Zicboz, version: "= 1.0.0" }
  - { name: Zic64b, version: "= 1.0.0" }
  - { name: Ziccamoa, version: "= 1.0.0" }
  - { name: Ziccif, version: "= 1.0.0" }
  - { name: Zicclsm, version: "= 1.0.0" }
  - { name: Ziccrse, version: "= 1.0.0" }
  # Privileged 1.13 (ss1p13 in the ISA string). The extractor reports at most 1.12.
  - { name: Sm, version: "= 1.13.0" }
  - { name: U, version: "= 1.0.0" }
  - { name: S, version: "= 1.13.0" }
  - { name: H, version: "= 1.0.0" }
  # Smrnmi is implemented but not declared: ACT then writes mnstatus at boot, which the Sail
  # reference model (0.14.1) does not implement, so the reference and the DUT would take different
  # boot traps. The emulator's default flash image already sets mnstatus.NMIE before jumping to the
  # test, which is the state ACT establishes.
  #   https://github.com/OpenXiangShan/difftest/blob/3729300ae233816d332d057f170472ebe35147b0/src/test/csrc/common/flash.cpp#L64-L74
  # Smdbltrp is declared because the hart sets mstatus.MDT on every trap into M-mode, and ACT's
  # trap handler must clear it when it returns without mret.
  - { name: Smaia, version: "= 1.0.0" }
  - { name: Ssaia, version: "= 1.0.0" }
  - { name: Smcsrind, version: "= 1.0.0" }
  - { name: Sscsrind, version: "= 1.0.0" }
  - { name: Smdbltrp, version: "= 1.0.0" }
  - { name: Ssdbltrp, version: "= 1.0.0" }
  - { name: Smstateen, version: "= 1.0.0" }
  - { name: Ssstateen, version: "= 1.0.0" }
  - { name: Smmpm, version: "= 1.0.0" }
  - { name: Smnpm, version: "= 1.0.0" }
  - { name: Ssnpm, version: "= 1.0.0" }
  - { name: Sspm, version: "= 1.0.0" }
  - { name: Supm, version: "= 1.0.0" }
  - { name: Ssccptr, version: "= 1.0.0" }
  - { name: Sscofpmf, version: "= 1.0.0" }
  - { name: Sscounterenw, version: "= 1.0.0" }
  - { name: Ssstrict, version: "= 1.0.0" }
  - { name: Sstc, version: "= 1.0.0" }
  - { name: Sstvala, version: "= 1.0.0" }
  - { name: Sstvecd, version: "= 1.0.0" }
  - { name: Ssu64xl, version: "= 1.0.0" }
  - { name: Sha, version: "= 1.0.0" }
  - { name: Shcounterenw, version: "= 1.0.0" }
  - { name: Shgatpa, version: "= 1.0.0" }
  - { name: Shlcofideleg, version: "= 1.0.0" }
  - { name: Shtvala, version: "= 1.0.0" }
  - { name: Shvsatpa, version: "= 1.0.0" }
  - { name: Shvstvala, version: "= 1.0.0" }
  - { name: Shvstvecd, version: "= 1.0.0" }
  - { name: Sv39, version: "= 1.0.0" }
  - { name: Sv48, version: "= 1.0.0" }
  - { name: Svade, version: "= 1.0.0" }
  - { name: Svbare, version: "= 1.0.0" }
  - { name: Svinval, version: "= 1.0.0" }
  - { name: Svnapot, version: "= 1.0.0" }
  - { name: Svpbmt, version: "= 1.0.0" }
  - { name: Sdtrig, version: "= 1.0.0" }

