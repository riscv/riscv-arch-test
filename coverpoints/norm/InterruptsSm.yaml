normative_rule_definitions:
  # When a trap is taken into M-mode, mepc is written with the virtual address of
  # the instruction that was interrupted or that encountered the exception.
  # Otherwise, mepc is never written by the implementation, though it may be
  # explicitly written by software.
  - name: mepc_op
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_trigger_tsbi}"]

  # When a trap is taken into M-mode, mcause is written with a code indicating the
  # event that caused the trap. Otherwise, mcause is never written by the
  # implementation, though it may be explicitly written by software.
  - name: mcause_op
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_trigger_tsbi}"]

  # The Interrupt bit in the mcause register is set if the trap was caused by an
  # interrupt.
  - name: mcause_intr_op
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_trigger_tsbi}"]

  # The Exception Code field contains a code identifying the last exception or
  # interrupt.
  - name: mcause_exccode_op
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_trigger_tsbi}"]

  - name: mcause_exccode_enc_img
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_trigger_tsbi}"]

  # By default, all traps at any privilege level are handled in machine mode
  - name: trap_def_m_mode
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_trigger_tsbi}"]

  # Value|Name|Description === 0 1 ≥2|Direct Vectored ---|All traps set pc to BASE.
  # Asynchronous interrupts set pc to BASE+4×cause. Reserved ===
  - name: mtvec_mode_enc
    coverpoint: ["InterruptsSm_cg/cp_trigger"]

  # When MODE=Direct, all traps into machine mode cause the pc to be set to the
  # address in the BASE field.
  - name: mtvec_mode_direct_op
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_trigger_tsbi}"]

  # When MODE=Vectored, all synchronous exceptions into machine mode cause the pc to
  # be set to the address in the BASE field, whereas interrupts cause the pc to be
  # set to the address in the BASE field plus four times the interrupt cause number.
  - name: mtvec_mode_vectored_op
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_trigger_tsbi}"]

  # Global interrupt-enable bits, csr::[mie] and csr::[sie], are provided for M-mode and
  # S-mode respectively.
  - name: mstatus_mie_sie_exist
    coverpoint: ["InterruptsSm_cg/cp_trigger"]

  # When a hart is executing in privilege mode x, interrupts are globally enabled when
  # xIE=1 and globally disabled when xIE=0.
  - name: mstatus_mie_sie_op
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_wfi_m}"]

  # Interrupts for lower-privilege modes, w<x, are always globally disabled
  # regardless of the setting of any global wIE bit for the lower-privilege mode.
  # Interrupts for higher-privilege modes, y>x, are always globally enabled
  # regardless of the setting of the global yIE bit for the higher-privilege mode.
  - name: mstatus_xie_intr_en_dis
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_trigger_tsbi}"]

  # each privilege mode x that can respond to interrupts has a two-level stack of
  # interrupt-enable bits and privilege modes. xPIE holds the value of the
  # interrupt-enable bit active prior to the trap, and xPP holds the previous privilege
  # mode.
  - name: mstatus_xpie_xpp_op
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_trigger_tsbi}"]

  # When a trap is taken from privilege mode y into privilege mode x, xPIE is set to the
  # value of xIE; xIE is set to 0; and xPP is set to y.
  - name: mstatus_xpie_xie_xpp_trap_op
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_trigger_tsbi}"]

  # The TW (Timeout Wait) bit is a WARL field that supports intercepting the WFI
  # instruction (see &lt;&lt;wfi&gt;&gt;).
  - name: mstatus_tw_warl
    coverpoint: ["InterruptsSm_cg/{cp_wfi_m, cp_wfi_timeout}"]

  # When TW=0, the WFI instruction may execute in modes less privileged than M when not
  # prevented for some other reason. When TW=1, then if WFI is executed in any
  # less-privileged mode, and it does not complete within an implementation-specific,
  # bounded time limit, the WFI instruction causes an illegal-instruction exception.
  - name: mstatus_tw_op
    coverpoint: ["InterruptsSm_cg/{cp_wfi, cp_wfi_timeout}"]

  # When S-mode is implemented, then executing WFI in U-mode causes an
  # illegal-instruction exception, regardless of the value of the TW bit, unless the
  # instruction completes within an implementation-specific, bounded time limit.
  - name: mstatus_tw_umode_op
    coverpoint: ["InterruptsSm_cg/{cp_wfi_timeout, cp_wfi_timeout_tw_zero}"]

  # An implementation may have WFI always raise an illegal-instruction exception in
  # modes less privileged than M when TW=1, even if there are pending
  # globally-disabled interrupts when the instruction is executed.
  - name: mstatus_tw_always_illegal
    coverpoint:
      [
        "Not tested: permission; no test executes WFI below M-mode with TW=1 while an interrupt is pending, so both behaviors pass",
      ]

  # Interrupt cause number i (as reported in CSR csr:mcause[], &lt;&lt;mcause&gt;&gt;)
  # corresponds with bit i in both csr:mip[] and csr:mie[]. Bits 15:0 are allocated to
  # standard interrupt causes only, while bits 16 and above are designated for platform
  # use.
  - name: mip_mie_enc_txt
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_enable_one}"]

  - name: mip_enc_img
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_priority_mip}"]

  - name: mie_enc_img
    coverpoint: ["InterruptsSm_cg/{cp_enable_one, cp_priority_mie}"]

  # The standard portions (bits 15:0) of the csr:mip[] and csr:mie[] registers are
  # formatted as shown in &lt;&lt;norm:mip_std_enc_img&gt;&gt; and
  # &lt;&lt;norm:mie_std_enc_img&gt;&gt; respectively.
  - name: mip_mie_std_enc_txt
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_enable_one}"]

  - name: mip_std_enc_img
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_priority_mip}"]

  - name: mie_std_enc_img
    coverpoint: ["InterruptsSm_cg/{cp_enable_one, cp_priority_mie}"]

  # If interrupt i can become pending but bit i in mip is read-only, the
  # implementation must provide some other mechanism for clearing the pending
  # interrupt.
  - name: mip_bits_rdonly_op
    # MEIP, MTIP, and MSIP are cleared through the platform after each cp_trigger case
    coverpoint: ["InterruptsSm_cg/cp_trigger"]

  # When bit i in mip is writable, a pending interrupt i can be cleared by writing 0
  # to this bit.
  - name: mip_bits_wr_op
    coverpoint:
      ["InterruptsSm_cg/{cp_trigger_reg_mip_ssip, cp_trigger_reg_mip_seip}"]

  # Bits csr:mip[meip] and csr:mie[meie] are the interrupt-pending and interrupt-enable
  # bits for machine-level external interrupts.
  - name: mip_meip_mie_meie_op
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_enable_one, cp_enable_zero}"]

  # MEIP is read-only in mip, and is set and cleared by a platform-specific
  # interrupt controller.
  - name: mip_meip_rdonly
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk/mip", "InterruptsSm_cg/cp_trigger"]

  # Bits csr:mip[mtip] and csr:mie[mtie] are the interrupt-pending and interrupt-enable
  # bits for machine timer interrupts.
  - name: mip_mtip_mie_mtie_op
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_enable_one, cp_enable_zero}"]

  # MTIP is read-only in the mip register, and is cleared by writing to the
  # memory-mapped machine-mode timer compare register.
  - name: mip_mtip_rdonly
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk/mip", "InterruptsSm_cg/cp_trigger"]

  # Bits csr:mip[msip] and csr:mie[msie] are the interrupt-pending and interrupt-enable
  # bits for machine-level software interrupts.
  - name: mip_msip_mie_msie_op
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_enable_one, cp_enable_zero}"]

  # MSIP is read-only in mip, and is written by accesses to memory-mapped control
  # registers, which are used to provide machine-level interprocessor interrupts.
  - name: mip_msip_rdonly
    coverpoint:
      [
        "Sm_mcsr_cg/cp_mcsrwalk/mip",
        "Sm_mcsr_cg/cp_msip",
        "InterruptsSm_cg/cp_trigger",
      ]

  # A hart's memory-mapped csr:msip[] register is a 32-bit read/write register
  - name: msip_sz_acc
    coverpoint: ["Sm_mcsr_cg/cp_msip", "InterruptsSm_cg/cp_trigger"]

  # bits 31--1 read as zero and bit 0 contains the MSIP bit.
  - name: msip_enc
    coverpoint: ["Sm_mcsr_cg/cp_msip"]

  # When the memory-mapped msip register changes, it is guaranteed to be reflected
  # in mip.MSIP eventually, but not necessarily immediately.
  - name: msip_update_max_time
    coverpoint: ["Sm_mcsr_cg/cp_msip", "InterruptsSm_cg/cp_trigger"]

  # A machine timer interrupt becomes pending whenever mtime contains a value greater
  # than or equal to mtimecmp, treating the values as unsigned integers. The interrupt
  # remains posted until mtimecmp becomes greater than mtime
  - name: mtime_intr_pending
    # The tests raise MTI by writing mtimecmp below mtime (or mtime + delay for WFI) and
    # clear it by writing mtimecmp above mtime
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_wfi_m}"]

  # The interrupt will only be taken if interrupts are enabled and the MTIE bit is set
  # in the mie register.
  - name: mtime_intr_taken
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_enable_zero, cp_wfi_m}"]

  # If the result of the comparison between mtime and mtimecmp changes, it is
  # guaranteed to be reflected in MTIP eventually, but not necessarily immediately.
  - name: mtime_intr_mtip_visibility
    # Tests wait for mip.MTIP to change after each mtimecmp write
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_wfi_m}"]

  # If supervisor mode is implemented, bits mip.SEIP and mie.SEIE are the
  # interrupt-pending and interrupt-enable bits for supervisor-level external interrupts.
  - name: mip_seip_mie_seie_op
    coverpoint:
      ["InterruptsSm_cg/{cp_trigger, cp_trigger_reg_mip_seip, cp_enable_one}"]

  # SEIP is writable in mip
  - name: mip_seip_acc
    coverpoint: ["InterruptsSm_cg/cp_trigger_reg_mip_seip"]

  # Supervisor-level external interrupts are made pending based on the logical-OR of
  # the software-writable SEIP bit and the signal from the external interrupt
  # controller.
  - name: intr_sei_op
    # Each source is raised alone; the OR of both at once is not tested
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_trigger_reg_mip_seip}"]

  # If supervisor mode is implemented, its mip.STIP and mie.STIE are the
  # interrupt-pending and interrupt-enable bits for supervisor-level timer interrupts.
  - name: mip_stip_mie_stie_op
    coverpoint:
      ["InterruptsSm_cg/{cp_trigger, cp_trigger_sti_sstc, cp_enable_one}"]

  # If the stimecmp register is not implemented, STIP is writable in mip, and may be
  # written by M-mode software to deliver timer interrupts to S-mode.
  - names: [mip_stip_no_stimecmp_acc, mip_stip_no_stimecmp_mmode_write]
    # cp_trigger raises STI by writing mip.STIP from M-mode (menvcfg.STCE = 0 with Sstc)
    coverpoint: ["InterruptsSm_cg/cp_trigger"]

  # If the stimecmp register is implemented, STIP is read-only in mip and reflects the
  # supervisor-level timer interrupt signal resulting from stimecmp. This timer
  # interrupt signal is cleared by writing stimecmp with a value greater than the
  # current time value.
  - name: mip_stip_stimecmp_acc
    coverpoint:
      ["InterruptsSm_cg/{cp_write_stip_sstc_csrrs, cp_write_stip_sstc_csrrc}"]

  - names: [mip_stip_reflects_stimecmp, mip_stip_stimecmp_clr]
    coverpoint:
      ["InterruptsSm_cg/{cp_trigger_sti_sstc, cp_trigger_sti_sstc_tsbi}"]

  # If supervisor mode is implemented, bits mip.SSIP and mie.SSIE are the
  # interrupt-pending and interrupt-enable bits for supervisor-level software
  # interrupts. SSIP is writable in mip and may also be set to 1 by a
  # platform-specific interrupt controller.
  - name: mip_ssip_mie_ssie_op
    coverpoint:
      ["InterruptsSm_cg/{cp_trigger, cp_trigger_reg_mip_ssip, cp_enable_one}"]

  - name: mip_ssip_acc
    coverpoint:
      ["InterruptsSm_cg/{cp_trigger_reg_mip_ssip, cp_trigger_reg_sip_ssip}"]

  - name: mip_ssip_intr_ctrl
    # cp_trigger raises SSI through RVMODEL_SET_SSW_INT when the DUT defines it
    coverpoint: ["InterruptsSm_cg/cp_trigger"]

  # An interrupt i will trap to M-mode (causing the privilege mode to change to
  # M-mode) if all of the following are true: (a) either the current privilege mode
  # is M and the MIE bit in the mstatus register is set, or the current privilege
  # mode has less privilege than M-mode; (b) bit i is set in both mip and mie; and
  # (c) if register mideleg exists, bit i is not set in mideleg.
  - name: intr_mip_mie_op
    coverpoint:
      [
        "InterruptsSm_cg/{cp_trigger, cp_enable_one, cp_enable_zero, cp_priority_mideleg}",
      ]

  # These conditions for an interrupt trap to occur must be evaluated in a bounded
  # amount of time from when an interrupt becomes, or ceases to be, pending in mip,
  - name: intr_mip_mie_bounded_time
    coverpoint: ["InterruptsSm_cg/{cp_trigger, cp_wfi_m}"]

  # These conditions must be evaluated immediately following the execution of an xRET
  # instruction or an explicit write to a CSR on which these interrupt trap conditions
  # expressly depend (including mip, mie, mstatus, and mideleg).
  - name: intr_mip_mie_xret_csrwr
    coverpoint:
      [
        "InterruptsSm_cg/{cp_trigger_tsbi, cp_trigger_reg_mip_ssip, cp_trigger_reg_mip_seip, cp_enable_one_tsbi}",
      ]

  # Multiple simultaneous interrupts destined for M-mode are handled in the
  # following decreasing priority order: MEI, MSI, MTI, SEI, SSI, STI, LCOFI.
  - name: intr_m_mode_pri
    coverpoint:
      [
        "InterruptsSm_cg/{cp_priority_mip, cp_priority_mie, cp_priority_mip_tsbi, cp_priority_mie_tsbi}",
      ]

  # Interrupts to M-mode take priority over any interrupts to lower privilege modes.
  - name: intr_m_mode_highest_pri
    coverpoint:
      ["InterruptsSm_cg/{cp_priority_mideleg, cp_priority_mideleg_tsbi}"]

  # The Wait for Interrupt instruction (WFI) informs the implementation that the
  # current hart can be stalled until an interrupt might need servicing.
  - name: wfi_op
    coverpoint: ["InterruptsSm_cg/{cp_wfi_m, cp_wfi}"]

  - name: wfi_enc_img
    coverpoint: ["InterruptsSm_cg/cp_wfi_m"]

  # WFI is available in all privileged modes
  - name: wfi_all_privileged_modes
    coverpoint: ["InterruptsSm_cg/{cp_wfi_m, cp_wfi}"]

  # optionally available to U-mode.
  - name: wfi_opt_u_mode
    # cp_wfi runs in U-mode when S-mode is not implemented; with S-mode, U-mode WFI times out
    coverpoint: ["InterruptsSm_cg/{cp_wfi, cp_wfi_timeout_tw_zero}"]

  # This instruction may raise an illegal-instruction exception when TW=1 in mstatus.
  - name: wfi_ill_exc
    coverpoint: ["InterruptsSm_cg/cp_wfi_timeout"]

  # If an enabled interrupt is present or later becomes present while the hart is
  # stalled, the interrupt trap will be taken on the following instruction, i.e.,
  # execution resumes in the trap handler and mepc = pc + 4.
  - name: wfi_mepc_val
    # mepc is not recorded for interrupts; a wrong mepc returns to the WFI, which has nothing left to wake it
    coverpoint: ["InterruptsSm_cg/{cp_wfi_m, cp_wfi}"]

  # Implementations are permitted to resume execution for any reason, even if an
  # enabled interrupt has not become pending. Hence, a legal implementation is to
  # simply implement the WFI instruction as a NOP.
  - name: wfi_resume_reason
    # The cp_wfi tests repeat WFI until the interrupt arrives, so an early resume or a NOP passes
    coverpoint: ["InterruptsSm_cg/{cp_wfi_m, cp_wfi}"]

  # The WFI instruction can also be executed when interrupts are disabled.
  - name: wfi_intr_dis
    coverpoint: ["InterruptsSm_cg/cp_wfi_m"]

  # The operation of WFI must be unaffected by the global interrupt bits in mstatus
  # (MIE and SIE) and the delegation register mideleg (i.e., the hart must resume if a
  # locally enabled interrupt becomes pending, even if it has been delegated to a
  # less-privileged mode), but should honor the individual interrupt enables (e.g,
  # MTIE) (i.e., implementations should avoid resuming the hart if the interrupt is
  # pending but not locally enabled).
  - name: wfi_unaffected_conditions
    # Covers mstatus.MIE = 0/1 with mideleg = 0; WFI with a delegated interrupt is not tested,
    # and the "should" on local enables cannot be checked because WFI may resume for any reason
    coverpoint: ["InterruptsSm_cg/{cp_wfi_m, cp_wfi}"]

  # WFI is also required to resume execution for locally enabled interrupts pending at
  # any privilege level, regardless of the global interrupt enable at each privilege
  # level.
  - name: wfi_resume_any_priv
    # Only the machine timer interrupt wakes WFI in these tests
    coverpoint: ["InterruptsSm_cg/{cp_wfi_m, cp_wfi}"]

  # If the event that causes the hart to resume execution does not cause an interrupt
  # to be taken, execution will resume at pc + 4
  - name: wfi_no_intr_pc
    # M-mode WFI with mstatus.MIE = 0 wakes on the pending timer without taking it
    coverpoint: ["InterruptsSm_cg/cp_wfi_m"]
