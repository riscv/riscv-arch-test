# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: sargantana-rv64imafdb
description: >-
  BSC Sargantana as delivered in the bsc-loca/core_tile tile.
  Written against core_tile 2528e7df6507fa06d372f001e55cfd46efae4a4b, whose
  rtl/core/sargantana submodule is pinned at
  403975c8a3c64c8eb369021a1ac2a374e5df441b.  Every parameter below is taken
  from that RTL; `sargantana` permalinks are into bsc-loca/sargantana and
  `core_tile` permalinks into bsc-loca/core_tile.
#
# The ISA string comes from the misa constant, def_pkg::ISA_CODE:
#   "| (1   <<  8)  // I - RV32I/64I/128I base ISA
#    | (1   << 12)  // M - Integer Multiply/Divide extension
#    | (1   <<  1)  // B - Bit Manipulation extension
#    | (0   <<  2)  // C - Compressed extension
#    | (1   << 18)  // S - Supervisor mode implemented
#    | (1   << 20)  // U - User mode implemented
#    | (1   << 63); // RV64"
#   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/includes/def_pkg.sv#L81-L94
# with RVA = RVF = RVD = 1:
#   "localparam bit RVF = 1'b1; ... localparam bit RVD = 1'b1; ... localparam bit RVA = 1'b1;"
#   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/includes/def_pkg.sv#L30-L34
#
# Two misa bits are deliberately NOT claimed here:
#   * V (bit 21).  RVV 1.0 encodings are decoded, but only a subset: no segment
#     loads/stores, mew must be 0, only the 1-register whole-register forms, and one
#     non-standard opcode ("F6_VCNT = 6'b010001, //Custom instruction",
#     https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/includes/riscv_pkg.sv#L380).
#   * H (bit 7).  The hypervisor CSRs and HLV/HSV exist, but nothing in the vendor
#     flow tests them, and ACT's invisible trap handler rejects H outright
#     ("Invisible trap emulation does not support traps from VS or VU mode yet.",
#     tests/env/check_defines.h).
# Both are recorded in the discrepancy notes rather than modelled here.
implemented_extensions:
  # "localparam logic [63:0] ISA_CODE = ... | (1 << 8) // I ... | (1 << 63); // RV64"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/includes/def_pkg.sv#L81-L94
  - { name: I, version: "= 2.1" }
  # "{F7_MUL_DIV, F3_MUL}: begin ... decode_instr_int.instr_type = MUL;" plus the
  # RV64 *W forms at decoder.sv#L786-L808
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/datapath/rtl/id_stage/rtl/decoder.sv#L626-L628
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  # LR/SC and the full AMO set, both .W and .D:
  #   "LR_W: begin ... decode_instr_int.instr_type = AMO_LRW;"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/datapath/rtl/id_stage/rtl/decoder.sv#L359-L439
  - { name: A, version: "= 2.1.0" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  # FPNew instance with FP32 and FP64 enabled; OP-FP and the FMA opcodes are decoded
  # at decoder.sv#L3242-L3491 and gated on mstatus.FS.
  - { name: F, version: "= 2.2.0" }
  - { name: D, version: "= 2.2.0" }
  # flh/fsh plus the FP16<->FP32/FP64 conversions:
  #   "assign valid_zfhmin_i = ((op == fpnew_pkg::F2F) & ((src_fmt == fpnew_pkg::FP16) |
  #    (dst_fmt == fpnew_pkg::FP16))) | ..."
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/datapath/rtl/exe_stage/rtl/fpu/old_fpu/fpu_drac_wrapper.sv#L350-L351
  # Zfh (FP16 arithmetic) is NOT claimed: "localparam bit XF16    = 1'b0;"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/includes/def_pkg.sv#L44
  - { name: Zfhmin, version: "= 1.0.0" }
  # "// Floating-point Zfa instructions
  #  FMINM_MAXM, FLEQ_FLTQ, FROUND, FROUNDNX, FLI, FCVTMOD,"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/includes/drac_pkg.sv#L377-L378
  # (fmvh.x.d / fmvp.d.x are RV32-only Zfa instructions, so their absence is correct here.)
  - { name: Zfa, version: "= 1.0.0" }
  # misa.B is hardwired 1 and all three component extensions decode completely.
  # Zba: "{F7_SHADD, F3_SH1ADD}: begin ... decode_instr_int.instr_type = SH1ADD;" (decoder.sv#L661)
  # Zbb: clz/ctz/cpop/sext/rev8/orc.b/andn/orn/xnor/rol/ror/min/max and the *W forms
  # Zbs: "// Zbs bit-manip
  #       BCLR, BEXT, BINV, BSET,"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/includes/drac_pkg.sv#L421-L422
  - { name: B, version: "= 1.0.0" }
  - { name: Zba, version: "= 1.0.0" }
  - { name: Zbb, version: "= 1.0.0" }
  - { name: Zbs, version: "= 1.0.0" }
  # "// Zicond
  #  {F7_CZERO, F3_SRL_SRA}: begin ... decode_instr_int.instr_type = CZ_EQZ;"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/datapath/rtl/id_stage/rtl/decoder.sv#L694-L699
  - { name: Zicond, version: "= 1.0.0" }
  # All six CSR instruction forms: decoder.sv#L3191-L3218
  - { name: Zicsr, version: "= 2.0" }
  # "F3_FENCE_I: begin ... decode_instr_int.instr_type = FENCE_I;" (decoder.sv#L2896), and
  # the I-cache and fetch buffer are invalidated when it commits:
  #   "assign invalidate_icache_o = (commit_cu_i.valid && commit_cu_i.fence_i);"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/control_unit/rtl/control_unit.sv#L323
  # This contradicts the decoder specification, which says "Also, ZicFenceI extension is
  # not supported at the moment."
  #   (doc/specifications/decoder_specification/7-Section.tex:54); the RTL wins.
  - { name: Zifencei, version: "= 2.0.0" }
  # cycle, time and instret are all directly readable, not trapped and emulated:
  #   "riscv_pkg::CSR_CYCLE:              csr_rdata = cycle_q;
  #    riscv_pkg::CSR_TIME: begin csr_rdata = reg_time_q;
  #    riscv_pkg::CSR_INSTRET:            csr_rdata = instret_q;"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/csr/rtl/csr_bsc.sv#L741-L749
  # NOTE: `time` is driven by a top-level port that the standalone testbench ties to
  # zero ("// No support for timer, interrupts, etc in simulation / .time_i(64'd0),",
  # core_tile simulator/sim_top.sv#L263-L268), so in this environment `time` never
  # advances.  Zicntr is still claimed because the CSR exists and is architecturally
  # accessible; the resulting Zicntr failures are listed in ci.yaml.
  - { name: Zicntr, version: "= 2.0" }
  # 29 unprivileged hpmcounter shadows, readable from S/U when mcounteren/scounteren
  # permit ("privilege_violation = ~mcounteren_q[csr_addr.address[4:0]];",
  # csr_bsc.sv#L2554-L2560):
  #   "// This module implements the Zihpm (v2.0) ... extensions" / "parameter HPM_NUM_COUNTERS = 29"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/csr/rtl/hpm_counters.sv#L22-L27
  - { name: Zihpm, version: "= 2.0.0" }
  # "F3_CBO: begin //Zicbom extension (CMO instructions)" (decoder.sv#L2900) and cbo.zero
  # at decoder.sv#L2985; prefetch.r/.w at decoder.sv#L469-L487.  menvcfg/senvcfg
  # implement exactly the CBIE/CBCFE/CBZE bits:
  #   "csr_rdata = {56'b0, menvcfg_q[7:4], 3'b0, menvcfg_q[0]}; // only FIOM & CMO bits implemented"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/csr/rtl/csr_bsc.sv#L693
  - { name: Zicbom, version: "= 1.0.0" }
  - { name: Zicbop, version: "= 1.0.0" }
  - { name: Zicboz, version: "= 1.0.0" }
  # HPDcache line width is 512 bits = 64 bytes ("DCacheLineWidth: 512",
  # https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/includes/drac_pkg.sv#L1310)
  - { name: Zic64b, version: "= 1.0.0" }
  # "mstateen0-3" and "sstateen0-3" are implemented with the SE and ENVCFG bits writable:
  #   "mask = riscv_pkg::MSTATEEN0_SE | riscv_pkg::MSTATEEN0_ENVCFG;"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/csr/rtl/csr_bsc.sv#L1612-L1631
  - { name: Smstateen, version: "= 1.0.0" }
  - { name: Ssstateen, version: "= 1.0.0" }
  # "| (1   << 20)  // U - User mode implemented" / "| (1   << 18)  // S - Supervisor mode implemented"
  - { name: U, version: "= 1.0.0" }
  - { name: S, version: "= 1.12.0" }
  # menvcfg exists, so the hart is at least Sm/Ss 1.12; the CSR README claims
  # "- Privilege-Level ISA  v1.11"
  # (https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/csr/README.md#L3-L9)
  # but that predates the menvcfg/mstateen/mcountinhibit support now in the file.
  # RV64 means mstatush does not exist to be read, so the 1.12-vs-1.11 choice cannot
  # misfire the way it does on RV32 cores.
  - { name: Sm, version: "= 1.12.0" }
  # "localparam logic [3:0] MODE_SV39 = 4'h8; ... localparam logic [3:0] MODE_OFF = 4'h0;"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/includes/def_pkg.sv#L160-L162
  # and satp only accepts those two modes:
  #   "// only update if we actually support this mode
  #    if ((satp.mode == def_pkg::MODE_OFF) || (satp.mode == def_pkg::MODE_SV39)) satp_d = satp;"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/csr/rtl/csr_bsc.sv#L1248-L1260
  # No Sv48/Sv57 (grep for Sv48|Sv57 over rtl/ returns nothing).
  - { name: Sv39, version: "= 1.0.0" }
  - { name: Svbare, version: "= 1.0.0" }
  # The page-table walker only ever issues reads ("assign ptw_dmem_comm_o.req.cmd = M_XRD;",
  # https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/mmu/rtl/ptw/ptw.sv#L386)
  # so A/D are never set by hardware: this is Svade, not Svadu.
  - { name: Svade, version: "= 1.0.0" }

params:
  # ---------------- Sm ----------------
  # "| (1 << 63); // RV64"
  MXLEN: 64
  # "+define+CONF_SARGANTANA_PHY_ADDR_SIZE=42"
  #   https://github.com/bsc-loca/core_tile/blob/2528e7df6507fa06d372f001e55cfd46efae4a4b/standalone_config.f#L4
  PHYS_ADDR_WIDTH: 42
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_ECALL_FROM_S: true
  TRAP_ON_ECALL_FROM_U: true
  TRAP_ON_EBREAK: true
  # "riscv_pkg::CSR_MVENDORID:          csr_rdata = 64'b0; // not implemented"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/csr/rtl/csr_bsc.sv#L694
  VENDOR_ID_BANK: 0
  VENDOR_ID_OFFSET: 0
  # "riscv_pkg::CSR_MARCHID:            csr_rdata = 64'd51;"  (csr_bsc.sv#L695)
  MARCHID_IMPLEMENTED: true
  ARCH_ID_VALUE: 51
  # "riscv_pkg::CSR_MIMPID:             csr_rdata = 64'h300; //v3.0.0"  (csr_bsc.sv#L696)
  MIMPID_IMPLEMENTED: true
  IMP_ID_VALUE: 0x300
  # "riscv_pkg::CSR_MCONFIGPTR:         csr_rdata = 64'b0; // not implemented"  (csr_bsc.sv#L698)
  CONFIG_PTR_ADDRESS: 0
  # misa reads the ISA_CODE constant and writes are dropped without trapping:
  #   "// MISA is WARL (Write Any Value, Reads Legal Value)
  #    riscv_pkg::CSR_MISA:;"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/csr/rtl/csr_bsc.sv#L1532-L1533
  MISA_CSR_IMPLEMENTED: true
  MUTABLE_MISA_A: false
  MUTABLE_MISA_B: false
  MUTABLE_MISA_D: false
  MUTABLE_MISA_F: false
  MUTABLE_MISA_M: false
  MUTABLE_MISA_S: false
  MUTABLE_MISA_U: false
  # mstatus.UBE/SBE/MBE are all inside the WPRI clear mask
  # ("localparam logic [63:0] MSTATUS64_WPRI = 64'h7fffff35ff800044;",
  # https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/includes/riscv_pkg.sv#L1427
  # — 0x44 clears bit 6 = UBE and 0x35 in the upper word clears bits 36 = SBE and
  # 37 = MBE), so every mode is fixed little-endian.
  M_MODE_ENDIANNESS: little
  S_MODE_ENDIANNESS: little
  U_MODE_ENDIANNESS: little
  # UXL and SXL are re-forced to 64 every cycle
  # ("mstatus_set = ... | {30'b0,riscv_pkg::XLEN_64,32'b0} | {28'b0,riscv_pkg::XLEN_64,34'b0};",
  # csr_bsc.sv#L1008-L1012)
  SXLEN: [64]
  UXLEN: [64]
  # "mtvec_d = {csr_wdata[63:2], 1'b0, csr_wdata[0]};
  #  // we are in vector mode, this implementation requires the additional
  #  // alignment constraint of 64 * 4 bytes
  #  if (csr_wdata[0]) mtvec_d = {csr_wdata[63:8], 7'b0, csr_wdata[0]};"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/csr/rtl/csr_bsc.sv#L1580-L1585
  # Bit 1 is hardwired 0, so MODE is 0 (direct) or 1 (vectored) and nothing else; a
  # write of MODE=2 reads back 0 and MODE=3 reads back 1, i.e. the illegal value is
  # legalized rather than retained.
  MTVEC_ACCESS: rw
  MTVEC_MODES: [0, 1]
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_BASE_ALIGNMENT_VECTORED: 256
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom
  # Misaligned scalar loads and stores always trap; there is no splitter and no
  # hardware misalignment support:
  #   "translated_instr.ex.cause = (instr_to_translate.is_amo_store_or_cmo && ~is_load_reserved)
  #    ? ST_AMO_ADDR_MISALIGNED : LD_ADDR_MISALIGNED;"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/datapath/rtl/exe_stage/rtl/load_store_queue.sv#L148-L161
  # The vendor's own test runner skips the misaligned suites for the same reason:
  #   '"rv64ui-p-ma_data": "Core doesn't support misaligned load/stores",'
  #   https://github.com/bsc-loca/core_tile/blob/2528e7df6507fa06d372f001e55cfd46efae4a4b/tb/tb_isa_tests/run-tests.py#L15-L18
  MISALIGNED_LDST: false
  # The alignment check happens in the load/store queue before the access is handed to
  # the MMU (load_store_queue.sv#L148-L161 runs on instr_to_translate), so a misaligned
  # access reports cause 4/6 even when the address would also have page-faulted.
  MISALIGNED_LDST_EXCEPTION_PRIORITY: high
  MISALIGNED_AMO: false
  # An unknown CSR address falls through to
  #   "default: read_access_exception = 1'b1;"   (csr_bsc.sv#L903)
  #   "default: update_access_exception = 1'b1;" (csr_bsc.sv#L1822)
  TRAP_ON_UNIMPLEMENTED_CSR: true
  # "By default, it is followed the RISCV ISA in a strict manner to mark as illegal
  #  instruction if for example, there is a combination of opcode and funct7 code that
  #  is not legal." (doc/specifications/decoder_specification/7-Section.tex:6)
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  # WLRL fields (mtvec.MODE, satp.MODE, mcause) are masked or dropped on write, never
  # trapped — see MTVEC_ILLEGAL_WRITE_BEHAVIOR above and the satp arm at csr_bsc.sv#L1259.
  TRAP_ON_ILLEGAL_WLRL: false
  # xtval sourcing, csr_bsc.sv#L2003-L2019:
  #   address faults (misaligned / access fault / page fault, load, store and fetch):
  #     "ex_tval = ex_origin_i;" where ex_origin_i is the faulting virtual address
  #     ("translated_instr.ex.origin = instr_to_translate.data_rs1;", load_store_queue.sv#L157)
  #   illegal instruction: the 32-bit encoding, zero-extended
  #     ("decode_instr_o.ex.origin = {32'd0, decode_i.inst};", decoder.sv#L3616-L3619)
  #   breakpoint: "ex_tval = pc_i;"  (csr_bsc.sv#L2016-L2017)
  #   everything else: "ex_tval = 64'b0;"
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: true
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_LOAD_PAGE_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_PAGE_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_PAGE_FAULT: true
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true
  MTVAL_WIDTH: 64
  # PMP is not implemented at all.  pmpcfg0-3 and pmpaddr0-15 exist only as empty case
  # arms that neither drive csr_rdata (so they read the default 64'b0) nor set an
  # exception:
  #   "riscv_pkg::CSR_PMPCFG_0:;  ...  riscv_pkg::CSR_PMPADDR_15:;"
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/rtl/csr/rtl/csr_bsc.sv#L881-L903
  # There is no address matcher anywhere in rtl/, and no mseccfg.
  NUM_PMP_ENTRIES: 0
  # "InitMappedBase: {40'h0040000000, ...}" — the address decoder works on whole
  # regions, not on an architectural PMA granule; 3 (8 bytes) is the smallest value
  # that cannot over-claim.
  PMA_GRANULARITY: 3
  # 29 hpm counters, indices 3..31:  "parameter HPM_NUM_COUNTERS = 29"
  HPM_COUNTER_EN:
    [
      false,
      false,
      false,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
    ]
  # "Event 0 is hardwired to always zero, as per the spec."
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/events.md#L47
  HPM_EVENTS: [0]
  # "riscv_pkg::CSR_MCOUNTINHIBIT:      mcountinhibit_d = csr_wdata[31:0];" (csr_bsc.sv#L1588)
  # read back with bit 1 forced to zero, as the spec requires:
  #   "csr_rdata = {{32{1'b0}}, mcountinhibit_q[31:2], 1'b0, mcountinhibit_q[0]};" (csr_bsc.sv#L679)
  MCOUNTINHIBIT_IMPLEMENTED: true
  COUNTINHIBIT_EN:
    [
      true,
      false,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
    ]
  # "riscv_pkg::CSR_MCOUNTEREN:         mcounteren_d = {csr_wdata[31:0]};" (csr_bsc.sv#L1587)
  # — all 32 bits are writable, unmasked.
  MCOUNTENABLE_EN:
    [
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
