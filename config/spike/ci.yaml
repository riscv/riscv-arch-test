# CI configuration for Spike simulator
# Shared across all Spike configs

ci_enabled: true
# Smstateen will be added back once sail starts supporting Sscsrind too
# Sdtrig* not yet supported in Sail reference
# InterruptsU fail on spike because wfi is not supported in U-mode. Filed issue to add UDB parameter support to exclude these tests on DUTs that don't support U-mode wfi: https://github.com/riscv/riscv-unified-db/issues/2520
exclude_extensions: "Sm,Smstateen,SdtrigSm,SdtrigS,SdtrigU,InterruptsU"
install_script: ".github/scripts/install-spike.sh"
apt_packages: "device-tree-compiler libboost-regex-dev libboost-system-dev"
shards: 1
config_shards:
  spike-rv64-max: 2
