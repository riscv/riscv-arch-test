# CI configuration for Whisper simulator

# Sm: menvcfg.SSE=0 (whisper#46), mstatush not writable (whisper#47)
# SsstrictSm, SsstrictS, SsstrictU excluded because of sail-riscv#1882, sail-riscv#1880
#   Should be fixed in Sail 0.14
# Smstateen Sail does not yet support 1P13 bit
# ExceptionsSvZalrsc: Whisper reports page faults where Sail expects access faults.
# Vx excluded because of https://github.com/tenstorrent/whisper/issues/35
# Sdtrig* not yet implemented in Sail
ci_enabled: true
# TODO: Remove SsstrictV when sail SsstrictV is implemented
exclude_extensions: "Sm,SsstrictSm,SsstrictS,SsstrictU,ExceptionsSvZalrsc,SsstrictV,Smstateen,Vx8,Vx16,Vx32,Vx64,SdtrigSm,SdtrigS,SdtrigU"
exclude_configs:
  - whisper-rv32-max-spike-ref
  - whisper-rv64-max-spike-ref
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 1
config_shards:
  whisper-rv64-max: 2
