# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # &lt;&lt;pmpcfg&gt;&gt; shows the layout of a PMP configuration register. The R, W,
  # and X bits, when set, indicate that the PMP entry permits read, write, and
  # instruction execution, respectively. When one of these bits is clear, the
  # corresponding access type is denied.
  - name: pmp_cfg_permissions
    coverpoint: ["PMPZca_cg/{cp_cfg_R, cp_cfg_W}"]

  # Attempting to fetch an instruction from a PMP region that does not have execute
  # permissions raises an instruction access-fault exception.
  - name: pmp_exec_fault
    coverpoint:
      ["PMPZca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4}"]

  # Attempting to execute a load or load-reserved instruction that accesses a physical
  # address within a PMP region without read permissions raises a load access-fault
  # exception.
  - name: pmp_load_fault
    coverpoint: ["PMPZca_cg/cp_cfg_R"]

  # Attempting to execute a store, store-conditional, AMO, or cache-block zero
  # instruction that accesses a physical address within a PMP region without write
  # permissions raises a store access-fault exception.
  - name: pmp_store_fault
    coverpoint: ["PMPZca_cg/cp_cfg_W"]

  # When A=0, this PMP entry is disabled and matches no addresses.
  - name: pmp_a_field_off
    coverpoint: ["PMPZca_cg/cp_misaligned_off"]

  # In addition to locking the PMP entry, the L bit indicates whether the R/W/X
  # permissions are additionally enforced on M-mode accesses. When the L bit is set,
  # these permissions are enforced for all privilege modes. When the L bit is clear, any
  # M-mode access matching the PMP entry will succeed; the R/W/X permissions apply only
  # to S and U modes.
  - name: pmp_l_bit_m_mode_enforcement
    coverpoint: ["PMPZca_cg/{cp_cfg_R, cp_cfg_W}"]

  # On some implementations, misaligned loads, stores, and instruction fetches may be
  # decomposed into multiple memory operations, some of which may succeed before an
  # access-fault exception occurs, as described in the RVWMO specification. PMP checking
  # is performed on each memory operation independently.
  - name: pmp_misaligned_access_behavior
    # Representative coverpoints; also cp_misaligned_na4
    coverpoint:
      [
        "PMPZca_cg/{cp_misaligned_mag16, cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_off}",
      ]

  # PMP entries are statically prioritized. The lowest-numbered PMP entry that matches
  # any byte of a memory operation determines whether that operation succeeds or fails.
  - name: pmp_entry_priority
    # Representative coverpoints; also cp_cret_{tor, na4}
    coverpoint:
      [
        "PMPZca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4, cp_cret_napot}",
      ]

  # The matching PMP entry must match all bytes of a memory operation, or the operation
  # fails, irrespective of the L, R, W, and X bits.
  - name: pmp_full_match_required
    # Representative coverpoints; also cp_misaligned_na4, cp_cret_{tor, na4}
    coverpoint:
      [
        "PMPZca_cg/{cp_misaligned_mag16, cp_misaligned_napot, cp_misaligned_tor, cp_cret_napot}",
      ]

  # If a PMP entry matches all bytes of a memory operation, then the L, R, W, and X bits
  # determine whether the operation succeeds or fails. If the L bit is clear and the
  # privilege mode of the access is M, the operation succeeds. Otherwise, if the L bit
  # is set or the privilege mode of the access is S or U, then the operation succeeds
  # only if the R, W, or X bit corresponding to the access type is set.
  - name: pmp_rwx_check
    coverpoint: ["PMPZca_cg/{cp_cfg_R, cp_cfg_W}"]

  # Failed memory operations generate an instruction, load, or store access-fault
  # exception.
  - name: pmp_access_fault_exception
    coverpoint:
      ["PMPZca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4}"]

  # if all accessed bytes lie within the same misaligned atomicity granule, the
  # instruction will not raise an exception for reasons of address alignment, and the
  # instruction will give rise to only one memory operation for the purposes of RVWMO--
  # i.e., it will execute atomically.
  - name: pma_mag_op_within
    coverpoint: ["PMPZca_cg/cp_misaligned_mag16"]

  # The misaligned atomicity granule PMA applies only to AMOs defined in the
  # ext:zaamo[], ext:zabha[], and ext:zacas[] extensions; loads and stores defined in
  # the base ISAs; loads and stores of no more than XLEN bits defined in the ext:f[],
  # ext:d[], and ext:q[] extensions; the load-acquire and store-release instructions
  # defined in the ext:zalasr[] extension; and compressed encodings of the foregoing
  # loads and stores.
  - name: pma_mag_insts
    coverpoint: ["PMPZca_cg/cp_misaligned_mag16"]

  # The ext:zca[] extension allows 16-bit instructions to be freely intermixed with
  # 32-bit instructions, with the latter now able to start on any 16-bit boundary, i.e.,
  # IALIGN=16.
  - name: Zca_align16
    # Representative coverpoints; also cp_cret_{tor, na4}
    coverpoint:
      [
        "PMPZca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4, cp_cret_napot}",
      ]

  # mepc will point to the beginning of the instruction.
  - name: mepc_varlen_wr
    coverpoint:
      ["PMPZca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4}"]

  # If mtval is written with a nonzero value when an instruction access-fault, page-
  # fault, or hardware-error exception occurs on a hart with variable-length
  # instructions, then mtval will contain the virtual address of the portion of the
  # instruction that caused the fault
  - name: mtval_varlen_wr
    coverpoint:
      [
        "PMPZca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4}",
        "TODO: instruction page fault on the second half of a 32-bit instruction that straddles a page",
      ]
