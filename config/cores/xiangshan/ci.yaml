# CI configuration for the XiangShan core
#
# XiangShan cannot run in the hosted CI: Chisel elaboration of KunminghuV2Config needs about 22 GB of
# memory, and the emulator runs at a few hundred cycles per second, so one ACT run takes days.
# These exclusions do not affect CI; they record the suites that fail and why.

ci_enabled: false

exclude_extensions: ""

apt_packages: "autoconf flex bison help2man libfl-dev ccache clang"
install_script: ".github/scripts/install-xiangshan.sh"
setup_script: ".github/scripts/setup-xiangshan.sh"
