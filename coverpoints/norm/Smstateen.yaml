# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions
#
# The rules about the supervisor-level sstateen CSRs are in Ssstateen.yaml.  The rules that
# apply to every level of stateen CSR (stateen_*, stateen0_*) stay here, as does
# sstateen_vsmode_access_roz, which is about hstateen gating sstateen in VS-mode.
#

normative_rule_definitions:
  - name: mstateen_rv64_csrs
    coverpoint: ["{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}"]

  - name: hstateen_rv64_csrs
    coverpoint: ["Ssstateen_cg/cp_hstateen_walking_ones"]

  - name: stateen_rv32_upper_bits_csrs
    coverpoint: ["{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}"]

  - name: stateen_op
    coverpoint:
      [
        "{Smstateen_cg,Ssstateen_cg}/{cp_csr_illegal_accesses}",
        "Smstateen_cg/cp_mstateen_se_controls_sstateen",
      ]

  - name: stateen_illegal_state_access
    coverpoint:
      [
        "{Smstateen_cg,Ssstateen_cg}/{cp_csr_illegal_accesses}",
        "Smstateen_cg/{cp_mstateen_se_controls_sstateen, cp_mstateen_se_controls_hstateen}",
      ]

  - name: stateen_implicit_state_update
    coverpoint: ["Not tested: either behavior is permitted"]

  - name: mstateen_bit_correspondence
    coverpoint: ["{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}"]

  - name: hstateen_encoding
    coverpoint:
      ["Ssstateen_cg/{cp_hstateen_walking_ones, cp_hstateen_illegal_accesses}"]

  - name: stateen_warl_access
    coverpoint: ["{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}"]

  - name: stateen_unimplemented_state_roz
    coverpoint: ["{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}"]

  - name: stateen_reserved_roz
    coverpoint:
      [
        "{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}",
        "Smstateen_cg/cp_mstateen_se_controls_sstateen",
      ]

  # For every bit in an mstateen CSR that is zero (whether read-only zero or set to
  # zero), the same bit appears as read-only zero in the matching hstateen and sstateen
  # CSRs.
  - name: mstateen_lower_priv_roz
    coverpoint:
      [
        "Smstateen_cg/{cp_mstateen0_se0_only_sstateen0, cp_mstateen0_se0_only_hstateen0}",
      ]

  - name: sstateen_vsmode_access_roz
    coverpoint:
      [
        "Smstateen_cg/cp_mstateen_se_controls_sstateen",
        "Ssstateen_cg/cp_hstateen_se_controls_sstateen",
      ]

  - name: hstateen_ro1_bits
    coverpoint: ["Ssstateen_cg/cp_hstateen_walking_ones"]

  - name: mstateen_zero_initialization
    coverpoint:
      [
        "TODO: record the writable mstateen bits before the boot code writes them",
      ]

  - name: mstateen_bit_63_op
    coverpoint:
      [
        "Smstateen_cg/{cp_mstateen_se_controls_sstateen, cp_mstateen_se_controls_hstateen}",
      ]

  - name: hstateen_bit_63_op
    coverpoint: ["Ssstateen_cg/cp_hstateen_se_controls_sstateen"]

  # The mstateen1-3 walks check bit 63 against the configured SE1-SE3 (writable or
  # read-only zero), and the sstateen1-3 walks check that those CSRs are all zeros.
  - name: mstateen_bit_63_roz
    coverpoint: ["{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}"]

  - name: hstateen_bit_63_writable
    coverpoint: ["Ssstateen_cg/cp_hstateen_walking_ones"]

  # Figure: Machine State Enable 0 Register (mstateen0).
  - name: mstateen0_enc_img
    coverpoint: ["Smstateen_cg/cp_walking_ones"]

  # Figure: Hypervisor State Enable 0 Register (hstateen0).
  - name: hstateen0_enc_img
    coverpoint: ["Ssstateen_cg/cp_hstateen_walking_ones"]

  - name: stateen0_c_op
    coverpoint: ["Not tested: custom state is non-standard and not certified"]

  - name: stateen0_fcsr_op
    coverpoint: ["Smstateen_cg/cp_fcsr", "Ssstateen_cg/cp_fcsr"]

  - name: mstateen0_fcsr_roz
    coverpoint: ["Smstateen_cg/cp_walking_ones"]

  - name: stateen0_fcsr0_misa_f0_illegal_fpu_instr
    coverpoint: ["{Smstateen_cg,Ssstateen_cg}/{cp_fcsr, cp_fcsr_fp_instrs}"]

  - name: stateen0_jvt_op
    coverpoint: ["Smstateen_cg/cp_jvt_access", "Ssstateen_cg/cp_jvt"]

  - name: mstateen0_se0_op
    coverpoint: ["Smstateen_cg/cp_mstateen_se_controls_sstateen"]

  - name: hstateen0_se0_op
    coverpoint: ["Ssstateen_cg/cp_hstateen_se_controls_sstateen"]

  - name: mstateen0_envcfg_op
    coverpoint: ["Smstateen_cg/cp_envcfg"]

  - name: hstateen0_envcfg_op
    coverpoint: ["Ssstateen_cg/cp_hstateen_envcfg"]

  - name: mstateen0_csrind_op
    coverpoint: ["Smstateen_cg/cp_csrind"]

  - name: hstateen0_csrind_op
    coverpoint: ["Ssstateen_cg/cp_hstateen_csrind"]

  - name: mstateen0_imsic_op
    coverpoint: ["Smstateen_cg/cp_imsic"]

  - name: hstateen0_imsic_op
    coverpoint: ["Ssstateen_cg/cp_hstateen_imsic"]

  - name: mstateen0_aia_op
    coverpoint: ["Smstateen_cg/cp_aia"]

  - name: hstateen0_aia_op
    coverpoint: ["Ssstateen_cg/cp_hstateen_aia"]

  - name: mstateen0_context_op
    coverpoint: ["Smstateen_cg/cp_context"]

  - name: hstateen0_context_op
    coverpoint: ["Ssstateen_cg/cp_hstateen_context"]

  - name: mstateen0_p1p13_op
    coverpoint: ["Smstateen_cg/cp_p1p13"]

  - name: mstateen0_srmcfg_op
    coverpoint: ["Smstateen_cg/cp_srmcfg"]

  - name: mstateen_ctr1
    coverpoint: ["Smstateen_cg/cp_ctr"]

  - name: mstateen_ctr0
    coverpoint: ["Smstateen_cg/cp_ctr"]
