# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # An attempt to execute SINVAL.VMA or HINVAL.GVMA in S-mode or HS-mode when
  # mstatus.TVM=1 also raises an illegal-instruction exception.
  - name: Svinval_illegal_instruction_tvm
    coverpoint: ["SvinvalHSm_cg/cp_svinval_tvm"]

  # SFENCE.W.INVAL and SFENCE.INVAL.IR are unaffected by the mstatus.TVM and hstatus.VTVM
  # fields and hence are always permitted in S-mode and VS-mode.
  - name: Svinval_sfence_w_inval_inval_s_vs_mode
    coverpoint: ["SvinvalHSm_cg/cp_svinval_tvm"]

  # These have the same semantics as SINVAL.VMA, except that they combine with
  # SFENCE.W.INVAL and SFENCE.INVAL.IR to replace HFENCE.VVMA and HFENCE.GVMA,
  # respectively, instead of SFENCE.VMA.
  - name: Svinval_hinval_vvma_gvma
    coverpoint:
      [
        "SvinvalHSm_cg/cp_svinval_m",
        "SvinvalHSm_cg/cp_svinval_tvm (HINVAL.VVMA in HS-mode)",
      ]

  # An attempt to execute HINVAL.VVMA or HINVAL.GVMA in VS-mode or VU-mode, or to execute
  # SINVAL.VMA in VU-mode, raises a virtual-instruction exception.
  - names:
      [
        Svinval_virtual_instruction_vu_vs,
        Svinval_virtual_instruction_vtvms,
        Svinval_illegal_instruction_u_mode,
      ]
    coverpoint: ["SvinvalHSm_cg/cp_svinval_tvm"]
