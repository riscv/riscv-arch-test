# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # If the Shvstvala extension is implemented, vstval must be written in all cases described
  # in Sstvala for stval.  Each exception is delegated to VS-mode by hedeleg.  Virtual-instruction
  # exceptions are never taken in VS-mode.
  - names: [Shvstvala_vstval_written, hedeleg_op]
    # Representative coverpoints; also the other Shvstvala_cg coverpoints, one for each exception that
    # writes vstval
    coverpoint:
      [
        "Shvstvala_cg/cp_load_access_fault",
        "Shvstvala_cg/cp_store_address_misaligned",
        "Shvstvala_cg/cp_illegal_instruction",
        "Shvstvala_cg/cp_instr_page_fault",
      ]
