# Parameter mappings
#
# Implementation-defined behaviors that affect the Exceptions coverpoints.
# The trap signature records xcause and xtval for each trap.
# The U, Zc, F, Zaamo, Zalrsc and ZicboU groups take their traps in S-mode when S is implemented,
# and in M-mode otherwise. The Sm medeleg coverpoints take their traps in M-mode or in S-mode.

parameter_definitions:
  # Trap delivery
  - name: MTVEC_ACCESS
    coverpoint: ["All coverpoints that take a trap to M-mode"]
    effect:
      [
        "The framework writes `mtvec` to install the M-mode trap handler that records the trap signature. The tests need `rw`.",
      ]
  - name: MTVEC_BASE_ALIGNMENT_DIRECT
    coverpoint: ["All coverpoints that take a trap to M-mode"]
    effect: ["The framework aligns the M-mode trap handler to this boundary."]
  - name: MTVAL_WIDTH
    coverpoint: ["Untested"]
    effect:
      [
        "The tests report only test addresses and instruction encodings of 32 bits or fewer in `mtval`. A legal width holds all of them, so the width does not change the results.",
      ]
  - name: STVAL_WIDTH
    coverpoint: ["Untested"]
    effect:
      [
        "The tests report only test addresses and instruction encodings of 32 bits or fewer in `stval`. A legal width holds all of them, so the width does not change the results.",
      ]

  # Misaligned loads and stores
  - name: MISALIGNED_LDST
