  - name: Sdtrig_itrigger_xlen32
    coverpoint: ["XLEN-dependent behavior not tested; single XLEN assumed"]

  # When the trigger matches, it fires after the trap occurs, just before the first
  # instruction of the trap handler is executed.
  - name: Sdtrig_itrigger_timing
    coverpoint: ["SdtrigSm_itrigger_cg/cp_sdtrig_itrigger"]

  # If action=0, the standard CSRs are updated for taking the breakpoint trap, and
  # zero is written to the relevant tval CSR.
  - name: Sdtrig_itrigger_action0
    coverpoint: ["SdtrigSm_itrigger_cg/cp_sdtrig_itrigger"]

  # If textra32 or textra64 are implemented for this trigger, it only matches when
  # the conditions set there are satisfied.
  - name: Sdtrig_itrigger_textra
    coverpoint:
      [
        "SdtrigSm_textra_cg/cp_sdtrig_textra_mcontext",
        "SdtrigSm_textra_cg/cp_sdtrig_textra_scontext",
        "SdtrigSm_textra_cg/cp_sdtrig_textra_asid",
      ]

  # If this bit is implemented, the hardware sets it when this trigger matches. The
