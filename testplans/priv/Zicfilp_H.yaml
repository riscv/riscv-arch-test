# yaml-language-server: $schema=testplan.schema.json
suite: Zicfilp_H
source: https://docs.google.com/spreadsheets/d/1ED9ontJZP-Dg2MAF-4mkhqKFgpjf6Fp6yeXKuW61FOY/edit?gid=1715431862#gid=1715431862
notes: |
  The H group boots to HS-mode and sets the landing pad enables from there: menvcfg.LPE through T-SBI, henvcfg.LPE and
  senvcfg.LPE directly.  henvcfg.LPE enables landing pads in VS-mode and senvcfg.LPE in VU-mode.  hedeleg = 0, so
  software-check exceptions are taken in HS-mode unless a test delegates them to VS-mode.  The trap record does not
  hold SPELP, so the tests observe it through the instruction after the handler returns, which raises a
  software-check exception exactly when ELP was restored to LP_EXPECTED.  The number of traps is recorded after each
  case.
  The Zicfilp_S tests also run in VS-mode and in VU-mode, where henvcfg.LPE and senvcfg.LPE are the landing pad
  enables.  Their traps are taken in HS-mode, which saves ELP in sstatus.SPELP.
coverpoints:
  - name: |-
      cp_zicfilp_indirect_elp_state_update
      cp_zicfilp_indirect_elp_state_update_c
      cp_zicfilp_direct_ct_no_elp
      cp_zicfilp_lpad_zero_label_bypass
      cp_zicfilp_lpad_valid_execution
      cp_zicfilp_lpad_missing_instruction_exception
      cp_zicfilp_lpad_label_mismatch
      cp_zicfilp_lpad_label_match_mismatch
      cp_zicfilp_lpad_label_exception_delivery
      cp_disabled_zicfilp
      cp_lpad_no_sw_exception_elp_clear_zicfilp
      cp_exception_priority_zicfilp
      cp_lpad_nop_no_lp_expected_zicfilp
      cp_lpad_alignment_exception_zicfilp
      cp_pelp_trap_entry_zicfilp
      cp_pelp_trap_entry_guarded_zicfilp
      cp_pelp_trap_entry_guarded_zicfilp_c
    goal: Re-run the common Zicfilp coverpoints and the S-mode trap entry coverpoints in VS-mode and VU-mode
    description: |-
      The coverpoints described in the Zicfilp Common Coverpoints table, and the trap entry coverpoints of the Zicfilp_S sheet, executed in VS-mode and in VU-mode.
      The landing pad enable is henvcfg.LPE in VS-mode and senvcfg.LPE in VU-mode.  Software-check, illegal-instruction and instruction access-fault exceptions are taken in HS-mode, so sstatus.SPELP holds the previous ELP and stval the software-check code.
    expectation: As in the Common table and the Zicfilp_S sheet, with the trap taken in HS-mode.
    bins: priv_mode {VS, VU} x (the bins of each re-run coverpoint)
  - name: cp_vs_lpe
    goal: henvcfg.LPE, not menvcfg.LPE, enables landing pads in VS-mode
    description: |-
      For each value of henvcfg.LPE and menvcfg.LPE, in VS-mode, with x7[31:12] holding the expected label:
      jalr, c.jr and c.jalr (Zca) through a register other than x1, x5 and x7 to a non-LPAD instruction, and to an LPAD whose nonzero label does not match x7[31:12].
    expectation: Software-check exception (cause 18), taken in HS-mode, exactly when henvcfg.LPE = 1, whatever menvcfg.LPE holds.  With henvcfg.LPE = 0, ELP stays NO_LP_EXPECTED and the LPAD executes as a no-op.
    bins: |-
      priv_mode VS x henvcfg.LPE {0, 1} x menvcfg.LPE {0, 1} x {jalr, c.jr, c.jalr} x target {not_lpad, lpad_mismatch}
      = 24 bins (8 without Zca)
  - name: cp_vu_lpe
    goal: senvcfg.LPE, not henvcfg.LPE, enables landing pads in VU-mode
    description: |-
      For each value of senvcfg.LPE and henvcfg.LPE, in VU-mode, with x7[31:12] holding the expected label:
      jalr, c.jr and c.jalr (Zca) through a register other than x1, x5 and x7 to a non-LPAD instruction, and to an LPAD whose nonzero label does not match x7[31:12].
    expectation: Software-check exception (cause 18), taken in HS-mode, exactly when senvcfg.LPE = 1, whatever henvcfg.LPE holds.  With senvcfg.LPE = 0, ELP stays NO_LP_EXPECTED and the LPAD executes as a no-op.
    bins: |-
      priv_mode VU x senvcfg.LPE {0, 1} x henvcfg.LPE {0, 1} x {jalr, c.jr, c.jalr} x target {not_lpad, lpad_mismatch}
      = 24 bins (8 without Zca)
  - name: cp_trap_entry_spelp
    goal: A trap from VS-mode or VU-mode saves ELP in vsstatus.SPELP when taken in VS-mode and in sstatus.SPELP when taken in HS-mode
    description: |-
      henvcfg.LPE = senvcfg.LPE = 1.  Trap into VS-mode (hedeleg[3] = hedeleg[18] = 1) or into HS-mode (hedeleg = 0), from VS-mode and from VU-mode:
      - ELP = LP_EXPECTED: jalr through a non-link register to a non-LPAD instruction, which raises a software-check exception.
      - ELP = NO_LP_EXPECTED: an ebreak that no indirect jump precedes.
    expectation: The trap saves ELP in the SPELP of the handler's mode and the handler's SRET restores it.  After an LP_EXPECTED trap the next non-LPAD instruction traps again before the LPAD that resumes the test; after a NO_LP_EXPECTED trap the instruction after the ebreak does not trap.
    bins: |-
      priv_mode {VS, VU} x LPE of the mode enabled x ELP {lp_expected, no_lp_expected} x handler {HS, VS}
      = 8 bins
  - name: cp_vs_sret_spelp
    goal: SRET executed in VS-mode restores ELP from vsstatus.SPELP and clears it
    description: |-
      For each value of henvcfg.LPE, senvcfg.LPE and SPELP, and a return to VS-mode or VU-mode: HS-mode sets sstatus.SPELP to the opposite of SPELP.  In VS-mode, write vsstatus.SPP and vsstatus.SPELP through sstatus, set sepc to a non-LPAD instruction and execute sret.
    expectation: Software-check exception exactly when vsstatus.SPELP = 1 and the LPE of the new mode (henvcfg.LPE for VS-mode, senvcfg.LPE for VU-mode) is 1.  After the SRET, vsstatus.SPELP reads 0, read as sstatus in VS-mode and through T-SBI in VU-mode.
    bins: |-
      priv_mode VS x sret x new mode {VU, VS} x henvcfg.LPE {0, 1} x senvcfg.LPE {0, 1} x vsstatus.SPELP {0, 1}
      = 16 bins
  - name: cp_hs_sret_spelp
    goal: SRET executed in HS-mode into VS-mode or VU-mode restores ELP from sstatus.SPELP, not vsstatus.SPELP
    description: |-
      For each value of henvcfg.LPE, senvcfg.LPE and sstatus.SPELP, and a return to VS-mode or VU-mode: in HS-mode set hstatus.SPV = 1, sstatus.SPP for the new mode, sstatus.SPELP, and vsstatus.SPELP to the opposite value, set sepc to a non-LPAD instruction and execute sret.
    expectation: Software-check exception exactly when sstatus.SPELP = 1 and the LPE of the new mode (henvcfg.LPE for VS-mode, senvcfg.LPE for VU-mode) is 1.  Back in HS-mode, vsstatus.SPELP is unchanged.
    bins: |-
      priv_mode HS x sret x new mode {VU, VS} x henvcfg.LPE {0, 1} x senvcfg.LPE {0, 1} x sstatus.SPELP {0, 1} x vsstatus.SPELP differs
      = 16 bins
  - name: cp_vs_sstatus_spelp
    goal: sstatus.SPELP accessed in VS-mode is vsstatus.SPELP
    description: In VS-mode, set and then clear sstatus.SPELP with csrrs and csrrc, and read sstatus back.  After each write, HS-mode reads vsstatus.SPELP.
    expectation: sstatus.SPELP read in VS-mode and vsstatus.SPELP read in HS-mode both hold the value VS-mode wrote.
    bins: |-
      priv_mode VS x {csrrs, csrrc} sstatus x rs1 bit 23 (SPELP) set
      = 2 bins
  - name: cp_hs_sret_to_hs_spelp
    goal: SRET from HS-mode to HS-mode restores ELP from sstatus.SPELP and clears it, leaving vsstatus.SPELP alone
    description: |-
      For each value of menvcfg.LPE and sstatus.SPELP: in HS-mode set hstatus.SPV = 0, sstatus.SPP = 1, sstatus.SPELP, and vsstatus.SPELP to the opposite value, set sepc to a non-LPAD instruction and execute sret.
    expectation: Software-check exception exactly when sstatus.SPELP = 1 and menvcfg.LPE = 1.  After the SRET, sstatus.SPELP reads 0 and vsstatus.SPELP is unchanged.
    bins: |-
      priv_mode HS x sret x new mode HS x menvcfg.LPE {0, 1} x sstatus.SPELP {0, 1} x vsstatus.SPELP differs
      = 4 bins
  - name: cp_elp_async_interrupt
    goal: An interrupt taken after an SRET that set ELP = LP_EXPECTED, before the target is decoded, saves SPELP = LP_EXPECTED
    description: |-
      henvcfg.LPE = senvcfg.LPE = 1, sstatus.SIE = 0.  In HS-mode raise a VS-level software interrupt (hvip.VSSIP = 1, hie.VSSIE = 1), with hideleg.VSSI = 0 so it is taken in HS-mode, or hideleg.VSSI = 1 and vsstatus.SIE = 1 so it is taken in VS-mode.  SRET with sstatus.SPELP = 1 to a non-LPAD instruction in VS-mode or VU-mode.
    expectation: The interrupt is taken right after the SRET and saves SPELP = LP_EXPECTED in sstatus or vsstatus.  The handler's SRET restores ELP, so the non-LPAD target then raises a software-check exception, taken in HS-mode.  Two traps in all.
    bins: |-
      priv_mode HS x sret x new mode {VU, VS} x sstatus.SPELP = 1 x LPE of the new mode = 1 x interrupt taken in {HS, VS}
      = 4 bins
  - name: cp_vs_trap_delivery
    goal: A software-check exception delegated to VS-mode reports its cause in vscause and vstval and saves ELP in vsstatus.SPELP
    description: |-
      hedeleg[18] = 1, with henvcfg.LPE = 1 in VS-mode or senvcfg.LPE = 1 in VU-mode, and x7[31:12] holding the expected label.  From VS-mode and VU-mode, jalr, c.jr and c.jalr (Zca) through a register other than x1, x5 and x7 to a non-LPAD instruction, and to an LPAD whose nonzero label does not match x7[31:12].  Record the trap count after each case.
    expectation: Software-check exception taken in VS-mode with vscause = 18, vstval = 2 when the hart reports the landing pad fault code in stval and 0 otherwise, and vsstatus.SPELP = LP_EXPECTED.  The VS-mode handler's SRET restores ELP, so the next non-LPAD instruction traps again before the LPAD.
    bins: |-
      priv_mode {VS, VU} x LPE of the mode enabled x {jalr, c.jr, c.jalr} x target {not_lpad, lpad_mismatch} x vscause software check x vstval x vsstatus.SPELP = 1
      = 12 bins (4 without Zca)
