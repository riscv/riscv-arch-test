# CI configuration for the XuanTie OpenE906

ci_enabled: true

# Each suite below fails at T-head-Semi/opene906 c5b8789. RTL paths are relative to
# https://github.com/T-head-Semi/opene906/blob/c5b878958e73e0b8f324a8132943f184a7831c07/E906_RTL_FACTORY/gen_rtl/
exclude_extensions:
  # fmin/fmax return the canonical NaN when one operand is a signaling NaN (F 2.0 behavior; F 2.2 returns the other
  # operand).
  - F-fmax.s
  - F-fmin.s
  # Fused multiply-add misses UF when the exact result is tiny but rounds up to the smallest normal.
  - F-fmadd.s
  - F-fmsub.s
  - F-fnmadd.s
  - F-fnmsub.s
  - ZicsrF
  # mtvec.MODE is hardwired to 3, CLIC mode (cp0/rtl/pa_cp0_trap_csr.v#L624). In that mode mcause bits 29:27 alias
  # mstatus.MPP and MPIE, so a trap from M-mode writes mcause = 0x3000_000x (cp0/rtl/pa_cp0_trap_csr.v#L879-L882) and
  # the trap signature's xcause word differs from Sail's 0x0000_000x. This is not permitted by the ratified privileged
  # spec: mtvec.MODE values of 2 and above are reserved (norm:mtvec_mode_enc), and the mcause Exception Code is all
  # of bits MXLEN-2:0 (norm:mcause_exccode_op), in which only codes 24-31 and 48-63 are designated for custom use, so
  # 0x3000_000x is a reserved code. Only the unratified CLIC extension (Smclic, riscv/riscv-fast-interrupt) defines
  # CLIC mode and the mcause mpp/mpie fields; neither Sail nor UDB models it. If ACT chooses to accept CLIC-only
  # harts, these tests would pass without a CLIC model if the trap handler recorded xcause masked to the Interrupt bit
  # and cause[11:0], as it already does to dispatch ecalls (tests/env/rvtest_trap_handler.h, "strips CLIC extension
  # bits").
  - InterruptsSm_wfi_timeout_U
  - PMP_F_cfg_wr
  - PMP_Sm_all_entries_check
  - PMP_Sm_cfg_A_tor_bot
  - PMP_Sm_cfg_napot_all
  - PMP_Sm_cfg_tor_all
  - PMP_Sm_cfg_XWR_all
  - PMP_Sm_napot_legal_lxwr
  - PMP_Sm_priority
  - PMP_Sm_tor_legal_lxwr-02
  - PMP_U_mprv_check-01
  - PMP_Zaamo_cfg_wr
  - PMP_Zca_legal_lwrx
  - PMP_Zca_misaligned_napot
  - PMP_Zca_misaligned_tor
  - PMP_Zca_zcf_legal_lxwr
  - Sm_csr_insufficient_priv
  - Sm_csr_ro
  - Sm_F
  - Sm_inst
  # A store bus error is imprecise even with mhint.AEE = 1: mepc is a later instruction (rtu/rtl/pa_rtu_retire.v#L476).
  - Exceptions_F
  - Exceptions_Sm-
  - Exceptions_U
  - Exceptions_Zc
  # LR raises the store causes 6 and 7 for a misaligned or faulting access instead of 4 and 5
  # (lsu/rtl/pa_lsu_ag.v#L1501).
  - Exceptions_Zalrsc
  - PMP_Zalrsc_cfg_wr
  # mstatus.MPP takes the unsupported value 1 (cp0/rtl/pa_cp0_trap_csr.v#L508), and mtvec.MODE reads 3
  # (cp0/rtl/pa_cp0_trap_csr.v#L624).
  - Sm_mcsr_walk
  # mstatus.TW is read-only 0 although U-mode exists (cp0/rtl/pa_cp0_trap_csr.v#L556-L557).
  - Sm_mcsr_access
  # A csrw to minstret also counts itself.
  - Sm_mcsr_cntr
  # minstret counts ECALL, which does not retire.
  - Sm_Zicntr
  - U_Zicntr
  # mret leaves mstatus.MPRV set when MPP is U, as privileged 1.11 allows; Sail applies the 1.12 rule that clears it.
  - Sm_xret

apt_packages: "autoconf flex bison help2man libfl-dev ccache patch"
install_script: ".github/scripts/install-e906.sh"
setup_script: ".github/scripts/setup-e906.sh"
