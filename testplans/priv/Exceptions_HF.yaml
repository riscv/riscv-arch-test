# yaml-language-server: $schema=testplan.schema.json
suite: Exceptions_HF
source: https://docs.google.com/spreadsheets/d/1DWBEoprndjQzLTXQTzPI8jW1HydtkYRR3tg58q59fdk/edit?gid=1859267821#gid=1859267821
coverpoints:
  - name: cp_exceptionsHF_fs
    goal: mstatus.FS and vsstatus.FS are selected correctly according to the privilege level to disable floating-point instructions when off.
    description: Cross mstatus.FS = {00, 01, 10, 11}, vsstatus.FS = {00, 01, 10, 11}, mode = {HS/VS/VU/U}.  Attempt csrr fcsr and fadd.s.  Read back mstatus.FS and vsstatus.FS.
    expectation: |-
      Illegal instruction if mstatus.FS = 00 or ((mode = VS or VU) and vsstatus.FS = 00).  Otherwise, fadd.s sets mstatus.FS to 11, and also sets vsstatus.FS to 11 if mode = VS or VU.
      A field written Initial (01) or Clean (10) and not dirtied reads back exactly only on configurations with precise dirty tracking that support Initial and Clean; otherwise the check is only that it is not Off.
    bins: 4 modes * 4 mstatus.FS * 4 vsstatus.FS * 2 instructions
    notes: |-
      The suite requires F: with Zfinx, mstatus.FS and vsstatus.FS are read-only 0.  M-mode is left out: with V = 0, vsstatus.FS has no effect, and ExceptionsF and Sm cover mstatus.FS in M-mode.
