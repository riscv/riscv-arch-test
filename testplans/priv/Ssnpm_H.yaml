  - name: cp_hlvx_hs_pmm
    goal: HLVX in HS-mode is never masked
    description: |-
      With every PMM field enabled (henvcfg.PMM = senvcfg.PMM = hstatus.HUPMM), hlvx.wu in HS-mode for
      hstatus.SPVP = 0 and 1 at the test data with each tag set.

      Test Environment:
       Identity map the test image in both stages, with the data page executable (X = 1) in both stages so the
       untagged HLVX succeeds; the VS-stage page has PTE.U = 1 when SPVP = 0 and PTE.U = 0 when SPVP = 1.
       Seed pm_lo_page with value_old.
      For each PMM in {10, 11} under (vsatp.MODE, hgatp.MODE) in {BARE_PAIR, PAGED_PAIR}:
      For each hstatus.SPVP in {0, 1}:
      For each A_upper_bits in the 5 tag patterns:
      Set A = A' with upper bits replaced by A_upper_bits
       hlvx.wu: read from A, sigupd(value) + record any traps.
    expectation: |-
      Tag 0x0000 returns the data (the control: without it a hart where HLVX always faults would pass).
      Every other tag is used unmasked: the access faults or reaches a page other than A'.  When the faulting address
      is valid, stval holds it untransformed; for an invalid address stval may be a different invalid address and is
      not checked.
    bins: |-
      priv_mode HS x hlvx.wu x hstatus.SPVP {0, 1} x henvcfg.PMM = senvcfg.PMM = hstatus.HUPMM {10, 11} x tag {5 patterns} x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - hlsv_mode
      - hlsv_op
      - hlvx-wu_valid32
    notes: The HLVX sentence in hypervisor.adoc ("not subject to pointer masking") has no normative tag.
