# UDB Architecture Configuration for the CHIPS Alliance VeeR EH2 core.
#
# Written against Cores-VeeR-EH2 commit a7203d02d4774c9b8aa08b4827ec300d2c80a388.
# Every parameter below cites the supporting text and a permalink to the original.
# Sources, in order of preference: the PRM markdown under docs/source/ (the source of
# the published "RISC-V VeeR EH2 Programmer's Reference Manual", Revision 1.9), then
# configs/veer.config, then the RTL under design/.
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: veer-eh2-rv32imacb
description: CHIPS Alliance VeeR EH2 - RV32IMAC with Zba, Zbb, Zbc, Zbs, Zbkb, Zbkc and Zbkx, machine mode only, single hart

# misa reads 0x4000_1105: MXL=1 (RV32), plus A (bit 0), C (bit 2), I (bit 8) and M (bit 12).
#   Quote: "0x4000_1105 (with atomics support [^57]) 0x4000_1104 (without atomics support [^57])"
#   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/csrs.md#L20-L27
# Quote: "RV32IMAC-compliant RISC-V core with branch predictor"
#   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/overview.md#L12
# The bundled tests are built -march=rv32imac_zicsr_zifencei, confirming Zicsr and Zifencei.
#   Quote: "ABI = -mabi=ilp32 -march=rv32imac_zicsr_zifencei"
#   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/tools/Makefile#L22
# EH2 has no F/D and no U-mode.
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: C, version: "= 2.0" }
  # EH2 adds the A extension, on by default and enabled in this build (ATOMIC_ENABLE=1).
  #   Quote: "0x4000_1105 (with atomics support) 0x4000_1104 (without atomics support)"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/csrs.md#L27
  #   Quote: "Atomics support is selected with the ATOMIC_ENABLE build argument when the VeeR
  #   EH2 core is built."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/csrs.md#L476
  # NOTE: AMOs are illegal outside the DCCM on this core, and the ACT image lives in system
  # memory, so every AMO the tests execute is expected to fault.
  #   Quote: "# Make atomic instructions illegal outside of DCCM."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/configs/veer.config#L2604
  - { name: A, version: "= 2.1" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  - { name: Zca, version: "= 1.0.0" }
  # Bit manipulation, all enabled in this build (bitmanip_*=1). Zbkc is the clmul/clmulh
  # subset of Zbc. misa.B reads 0 whatever the bitmanip options, so B itself is not claimed.
  #   Quote: "the Zba, Zbb, Zbc, Zbs, Zbkb and Zbkx bit manipulation extensions"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/README.md#L7
  #   Quote: "((pt.ATOMIC_ENABLE==0) ? (pt.XLEN)'('h40001104) : (pt.XLEN)'('h40001105))"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/design/dec/eh2_dec_tlu_top.sv#L893
  - { name: Zba, version: "= 1.0.0" }
  - { name: Zbb, version: "= 1.0.0" }
  - { name: Zbc, version: "= 1.0.0" }
  - { name: Zbs, version: "= 1.0.0" }
  - { name: Zbkb, version: "= 1.0.0" }
  - { name: Zbkc, version: "= 1.0.0" }
  - { name: Zbkx, version: "= 1.0.0" }
  - { name: Zicsr, version: "= 2.0" }
  # Zihpm is NOT implemented: it provides the unprivileged hpmcounter3..31 shadows for
  # S/U-mode access, and EH2 is machine-mode only. The M-mode mhpmcounter3..6 /
  # mhpmevent3..6 that EH2 does implement belong to Sm, and which of them exist is
  # carried by HPM_COUNTER_EN below.
  #   Quote: "VeeR EH2 is a machinemode (M-mode) only, 32-bit CPU core"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/overview.md#L5
  - { name: Zifencei, version: "= 2.0" }
  # VeeR EH2 implements privileged spec 1.11, not 1.12. mstatush, which 1.12 added, does
  # not exist on this core, and ACT already guards every mstatush access behind
  # SM1P12P0_OR_LATER_SUPPORTED, so declaring 1.11 is both accurate and necessary.
  #   Quote: "The RISC-V Instruction Set Manual Volume II: Privileged Architecture |
  #   20190608-Priv-MSU-Ratified | Specification ratified"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/intro.md#L115-L118
  - { name: Sm, version: "= 1.11.0" }

params:
  # XLEN
  # Quote: "VeeR EH2 is a machinemode (M-mode) only, 32-bit CPU core"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/overview.md#L5
  MXLEN: 32
  # Quote: "The 32-bit address space is subdivided into sixteen fixed-sized, contiguous
  #   256MB regions."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/memory-map.md#L8
  PHYS_ADDR_WIDTH: 32

  # MISA: implemented but read-only ("writes ignored"), so no extension can be
  # turned off through misa.
  #   Quote: "writes ignored"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/csrs.md#L20-L27
  MISA_CSR_IMPLEMENTED: true
  MUTABLE_MISA_M: false
  MUTABLE_MISA_C: false
  MUTABLE_MISA_A: false
  # misa.X is 0 in the fixed misa value (0x4000_1105 has bit 23 clear). EH2's custom CSRs
  # (mrac, mcpc, ...) are not a non-standard instruction extension.
  #   Quote: "0x4000_1105 (with atomics support [^57]) 0x4000_1104 (without atomics support [^57])"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/csrs.md#L27
  NON_STANDARD_EXTENSION_IMPLEMENTED: false

  # Endianness: RISC-V little-endian; EH2 implements no mstatus.MBE/SBE/UBE fields.
  M_MODE_ENDIANNESS: little

  # Trap behavior.
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  # A CSR access is legal only if the address decodes in csrdecode; otherwise the
  # instruction is illegal.
  #   Quote: "assign i0_legal = i0_dp.legal & (~i0_any_csr_d | i0_csr_legal_d) & i0_bitmanip_legal & i0_atomic_legal;"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/design/dec/eh2_dec_decode_ctl.sv#L1903
  TRAP_ON_UNIMPLEMENTED_CSR: true
  TRAP_ON_ILLEGAL_WLRL: false

  # MTVAL reporting. The TLU writes the PC for ebreak and instruction access faults, the
  # encoding for illegal instructions, the access address for load/store misaligned and
  # access faults, and zero otherwise. The core raises no instruction-address-misaligned
  # exception, since C is always enabled.
  #   Quote: "assign mtval_capture_pc_wb = exc_or_int_valid_wb & (ebreak_wb | (inst_acc_wb & ~inst_acc_second_wb) | mepc_trigger_hit_sel_pc_wb) & ~take_nmi_wb;"
  #   Quote: "assign mtval_capture_lsu_wb = exc_or_int_valid_wb & lsu_exc_valid_wb & ~take_nmi_wb;"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/design/dec/eh2_dec_tlu_ctl.sv#L1469-L1481
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: true
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true
  MTVAL_WIDTH: 32

  # Misaligned load/store: handled in hardware for ordinary (idempotent) memory.
  #   Quote: "The core performs a misalignment check during the address calculation."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/memory-map.md#L352
  # Known deviation, accepted for this configuration: misaligned accesses to
  # side-effect regions raise a misaligned exception where the priv spec recommends an
  # access fault.
  #   Quote: "The RISC-V Privileged specification recommends that misaligned accesses
  #   to regions with potential side-effects should trigger an access fault exception,
  #   instead of a misaligned exception ... Note that VeeR EH2 triggers a misaligned
  #   exception in this case."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/memory-map.md#L1350-L1351
  MISALIGNED_LDST: true
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low
  MISALIGNED_MAX_ATOMICITY_GRANULE_SIZE: 0 # AMOs are DCCM-only; no wider atomicity guarantee
  MISALIGNED_SPLIT_STRATEGY: custom

  # Machine ID CSRs.
  #   Quote: "0xF11 | MRO | mvendorid | Vendor ID | 0x0000_0045"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/csrs.md#L28-L33
  # UDB splits mvendorid into (BANK << 7) | OFFSET; 0x45 has no continuation bytes.
  VENDOR_ID_BANK: 0x0
  VENDOR_ID_OFFSET: 0x45
  #   Quote: "0xF12 | MRO | marchid | Architecture ID | 0x0000_0011"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/csrs.md#L34-L39
  MARCHID_IMPLEMENTED: true
  ARCH_ID_VALUE: 0x11
  #   Quote: "0xF13 | MRO | mimpid | Implementation ID | 0x0000_0003"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/csrs.md#L40-L45
  MIMPID_IMPLEMENTED: true
  IMP_ID_VALUE: 0x3

  # MTVEC. The TLU stores bits [31:2] and bit [0], dropping bit 1, so both Direct
  # (MODE=0) and Vectored (MODE=1) are representable and BASE is 4-byte aligned.
  #   Quote: "assign mtvec_ns[pt.XLEN-2:0] = {dec_i0_csr_wrdata_wb[pt.XLEN-1:2], dec_i0_csr_wrdata_wb[0]} ;"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/design/dec/eh2_dec_tlu_ctl.sv#L1253
  # Vectored mode is used by the PRM's own interrupt example.
  #   Quote: "trap_vector: // Interrupt trap starts here when MTVEC[mode]=1"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/interrupts.md#L1265
  MTVEC_MODES: [0, 1]
  MTVEC_ACCESS: rw
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom # bit 1 of a write is discarded, not retained
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_BASE_ALIGNMENT_VECTORED: 4

  # Sm parameters.
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true

  # WFI is a NOP, so it always resumes after a finite time. There is no U-mode, so WFI can
  # never execute in U-mode.
  #   Quote: "Currently, the WFI instruction is implemented as NOP, which is a fully
  #   RISC-V-compliant option."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/power.md#L750
  WFI_FINITE: true
  WFI_U_MODE: false

  # The core implements all three standard machine interrupts: mie.MEIE/MTIE/MSIE are
  # R/W and are latched from write-data bits 11/7/3.
  #   Quote: "meie | 11 | Machine external interrupt enable | R/W", "mtie | 7 | Machine timer
  #   interrupt enable | R/W", "msie | 3 | Machine software interrupt enable | R/W"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/adaptations.md#L55-L79
  #   Quote: "assign mie_ns[5:0] = wr_mie_wb ? {dec_i0_csr_wrdata_wb[30:28], dec_i0_csr_wrdata_wb[11], dec_i0_csr_wrdata_wb[7], dec_i0_csr_wrdata_wb[3]} : mie[5:0];"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/design/dec/eh2_dec_tlu_ctl.sv#L1282
  # The testbench ties the timer_int, soft_int and extintsrc_req inputs to 0, so none of
  # these interrupts can actually be raised in this configuration's runs.
  #   Quote: ".timer_int ( '0 ), .extintsrc_req ( '0 ), ... .soft_int ('0),"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/testbench/tb_top.sv#L785-L833
  # ACT reads {MEI,MTI,MSI}_INTR_IMPL as the machine interrupts the platform can raise
  # (tests/env/check_defines.h), so each is true only where rvmodel_macros.h can raise it.
  MEI_INTR_IMPL: false
  MSI_INTR_IMPL: false
  MTI_INTR_IMPL: false
  # No PMA hardware: region attributes come from mrac, whose granularity is one
  # 256 MB region, but the natural access granule on the 64-bit AHB/AXI bus is 8 bytes.
  PMA_GRANULARITY: 3
  # CONFIG_PTR_ADDRESS is omitted: mconfigptr was added in privileged spec 1.12 and this
  # core implements 1.11, so UDB does not define the parameter for this config.

  # PMP: EH2 has no RISC-V PMP at all. Memory protection is a non-standard MPU of
  # 8 instruction and 8 data access windows configured by build arguments, not CSRs.
  #   Quote: "If at least one data access window is enabled, non-speculative load/store
  #   requests which are not within the address range of any enabled data access window
  #   cause a precise load/store address misaligned or access fault exception."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/memory-map.md#L190
  NUM_PMP_ENTRIES: 0

  # Hardware performance monitors: mhpmcounter3-6 / mhpmevent3-6 only (4 counters).
  #   Quote: "0xB03 ... mhpmcounter3" through "0xB06 ... mhpmcounter6"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/csrs.md#L192-L215
  HPM_EVENTS: [0]
  HPM_COUNTER_EN:
    [
      false,
      false,
      false,
      true,
      true,
      true,
      true,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]
  # Each mhpmcounter is a full 64-bit counter: the low word plus an mhpmcounterNh upper
  # word that the 64-bit increment carries into.
  #   Quote: "assign mhpmc3_incr[63:0] = {mhpmc3h[31:0],mhpmc3[31:0]} + ..."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/design/dec/eh2_dec_tlu_ctl.sv#L2127
  #   Quote: "mhpmcounter3h | Upper 32 bits of `mhpmcounter3`, RV32I only"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/csrs.md#L230-L231
  HPM_COUNTER3_WIDTH: 64
  HPM_COUNTER4_WIDTH: 64
  HPM_COUNTER5_WIDTH: 64
  HPM_COUNTER6_WIDTH: 64

  # mcountinhibit (0x320) exists on EH2, unlike EH1 which had the non-standard mgpmc.
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/csrs.md#L84-L89
  MCOUNTINHIBIT_IMPLEMENTED: true

  # mcounteren (0x306) does not exist on EH2: it is absent from the CSR map, and with
  # no U-mode there is no lower privilege level whose counter access it could gate.
  # UDB still requires the parameter, so every bit is false.
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/docs/source/csrs.md
  MCOUNTENABLE_EN:
    [
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]

  # Atomics parameters. EH2 permits AMOs and LR/SC only inside the DCCM, and a misaligned
  # AMO or LR/SC raises an access fault.
  #   Quote: "assign amo_access_fault_dc2 = (lsu_pkt_dc2.atomic & (start_addr_dc2[1:0] != 2'b0)) | ... (lsu_pkt_dc2.valid & lsu_pkt_dc2.atomic & ~addr_in_dccm_dc2);"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/a7203d02/design/lsu/eh2_lsu_addrcheck.sv#L199-L200
  MISALIGNED_AMO: false
  LRSC_MISALIGNED_BEHAVIOR: "always raise access fault"
  LRSC_RESERVATION_STRATEGY: "reserve exactly enough to cover the access"
  LRSC_FAIL_ON_VA_SYNONYM: false
  LRSC_FAIL_ON_NON_EXACT_LRSC: false

  # mcountinhibit exists on EH2 (EH1 used the non-standard mgpmc). Bit 1 (TM) is read-only zero
  # per the spec; bits 3..6 track the four implemented mhpmcounters.
  COUNTINHIBIT_EN:
    [
      true,
      false,
      true,
      true,
      true,
      true,
      true,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]
