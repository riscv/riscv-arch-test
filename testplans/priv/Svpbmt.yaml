  - name: leaf_PTE_pbmt_exec_s
    goal: Verify an instruction fetch through a leaf PTE with PBMT = NC or IO succeeds from S-mode
    description: "S-mode: menvcfg.PBMTE=1. Leaf PTE with PBMT = 1 (NC) and 2 (IO) and PTE.U=0, at every page-table level (4 KiB page and each superpage size of the Sv mode). Jump (jalr) into the page through va_data."
    expectation: No fault.
    bins: |-
