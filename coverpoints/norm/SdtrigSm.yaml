# Normative rule to coverpoint mappings
# Generated from the Sdtrig normative rules and SdtrigSm test plan

normative_rule_definitions:
  # If Sdtrig is implemented, the Trigger Module must support at least one trigger.
  - name: Sdtrig_num_trigs_ge1
    coverpoint:
      [
        "SdtrigSm_sdtrig_cg/cp_sdtrig_csr_access_common",
        "SdtrigSm_csr_cg/cp_sdtrig_tselect_trigs",
      ]

  # Accessing trigger CSRs that are not used by any of the implemented triggers must
  # result in an illegal instruction exception.
  - name: Sdtrig_unimp_csr_illegal
    coverpoint: ["Implementation-specific behavior; not tested in this suite"]

  # M-Mode and Debug Mode accesses to trigger CSRs that are used by any of the
  # implemented triggers must succeed, regardless of the current type of the
  # currently selected trigger.
  - name: Sdtrig_csr_mode
    coverpoint: ["SdtrigSm_sdtrig_cg/cp_sdtrig_csr_access_common"]

  # Triggers do not fire while in Debug Mode.
  - name: Sdtrig_no_debug_fires
    coverpoint: ["Requires Sdext external debug support; not implemented"]

  # Triggers can be configured to take one of several actions when they fire. lists
  # all options.
  - name: Sdtrig_actions
    coverpoint: ["Only action 0 (breakpoint) supported in this suite"]

  # Raise a breakpoint exception. (Used when software wants to use the trigger
  # module without an external debugger attached.) xepc must contain the virtual
  # address of the next instruction that must be executed to preserve the program
  # flow.
  - name: Sdtrig_action0
    coverpoint: ["SdtrigSm_mcontrol6_cg/cp_sdtrig_mcontrol6_priv_mode"]

  # Enter Debug Mode. dpc must contain the virtual address of the next instruction
  # that must be executed to preserve the program flow. This action is only legal
  # when the trigger's dmode is 1. Since tdata1 is WARL, hardware must prevent it
  # from containing dmode=0 and action=1. This action can only be supported if Sdext
  # is implemented on the hart.
  - name: Sdtrig_action1
    coverpoint: ["Requires Sdext external debug support; not implemented"]

  # Trace on, described in the trace specification.
  - name: Sdtrig_action2
    coverpoint: ["Trace action defined by the separate trace specification"]

  # Trace off, described in the trace specification.
  - name: Sdtrig_action3
    coverpoint: ["Trace action defined by the separate trace specification"]

  # Trace notify, described in the trace specification.
  - name: Sdtrig_action4
    coverpoint: ["Trace action defined by the separate trace specification"]

  # Reserved for use by the trace specification.
  - name: Sdtrig_action5_rsv
    coverpoint: ["Trace action defined by the separate trace specification"]

  # Send a signal to TM external trigger output 0 or 1 (respectively).
  - name: Sdtrig_action8_9
    coverpoint:
      ["Requires tmexttrigger external trigger inputs; implementation specific"]

  # Reserved for future use.
  - name: Sdtrig_action_rsv
    coverpoint: ["Reserved encoding for future use; nothing to test"]

  # Priorities in the table are separated by horizontal lines, so e.g. etrigger and
  # itrigger have the same priority. If this table contradicts the table in the
  # Privileged Spec, then the latter takes precedence.
  - name: Sdtrig_priority
    coverpoint: ["Trigger priority not tested; triggers assumed imprecise"]

  # This table only applies if triggers are precise. Otherwise triggers will fire
  # some indeterminate time after the event, and the priority is irrelevant.
  - name: Sdtrig_non_precise_priority
    coverpoint: ["Trigger priority not tested; triggers assumed imprecise"]

  # When triggers are chained, the priority is the lowest priority of the triggers
  # in the chain.
  - name: Sdtrig_chain_priority
    coverpoint: ["Trigger priority not tested; triggers assumed imprecise"]

  # When multiple triggers in the same priority fire at once, hit (if implemented)
  # is set for all of them.
  - name: Sdtrig_multiple_fires
    coverpoint: ["Trigger priority not tested; triggers assumed imprecise"]

  # If more than one of these triggers has action=0 then tval is updated in
  # accordance with one of them, but which one is UNSPECIFIED.
  - name: Sdtrig_tval
    coverpoint: ["Trigger priority not tested; triggers assumed imprecise"]

  # If one of these triggers has the "enter Debug Mode" action (1) and another
  # trigger has the "raise a breakpoint exception" action (0), the preferred
  # behavior is to have both actions take place. It is implementation-dependent
  # which of the two happens first. This ensures both that the presence of an
  # external debugger doesn't affect execution and that a trigger set by user code
  # doesn't affect the external debugger.
  - name: Sdtrig_debug_breakpoint
    coverpoint: ["Trigger priority not tested; triggers assumed imprecise"]

  # If this is not implemented, then the hart must enter Debug Mode and ignore the
  # breakpoint exception.
  - name: Sdtrig_simul_debug_breakpoint_fallback
    coverpoint: ["Trigger priority not tested; triggers assumed imprecise"]

  # In the latter case, hit of the trigger whose action is 0 must still be set,
  # giving a debugger an opportunity to handle this case.
  - name: Sdtrig_hit_set_on_action0
    coverpoint: ["Trigger priority not tested; triggers assumed imprecise"]

  # Since triggers that have an action other than 0 or 1 don't affect the execution
  # of the hart, they are not mentioned in the priority table. Such triggers fire
  # independently from those that have an action of 0 or 1.
  - name: Sdtrig_independent_trigs
    coverpoint: ["Trigger priority not tested; triggers assumed imprecise"]

  # That breakpoint exception can either be taken in M-mode or it can be delegated
  # to a less privileged mode. However, it is possible for triggers to fire in the
  # same mode that the resulting exception will be handled in.
  - name: Sdtrig_breakpoint_delegated
    coverpoint: ["SdtrigSm_native_triggers_cg/cp_sdtrig_breakpoint_delegate"]

  # lr instructions are loads.
  - name: Sdtrig_Aext_lr_op
    coverpoint:
      ["SdtrigSm_a_cg/cp_sdtrig_lrsc_addr", "SdtrigSm_a_cg/cp_sdtrig_lrsc_data"]

  # Successful sc instructions are stores.
  - name: Sdtrig_Aext_sc_op
    coverpoint:
      ["SdtrigSm_a_cg/cp_sdtrig_lrsc_addr", "SdtrigSm_a_cg/cp_sdtrig_lrsc_data"]

  # It is UNSPECIFIED whether failing sc instructions are stores or not.
  - name: Sdtrig_Aext_sc_fail
    coverpoint: ["Behavior is UNSPECIFIED by the specification; not tested"]

  # Each AMO instruction is a load for the read portion of the operation.
  - name: Sdtrig_AMO_read
    coverpoint: ["SdtrigSm_a_cg/cp_sdtrig_amo"]

  # The address is always available to trigger on
  - name: Sdtrig_AMO_read_addr
    coverpoint: ["SdtrigSm_a_cg/cp_sdtrig_amo"]

  # Each AMO instruction is a store for the write portion of the operation.
  - name: Sdtrig_AMO_store
    coverpoint: ["SdtrigSm_a_cg/cp_sdtrig_amo"]

  # The address is always available to trigger on.
  - name: Sdtrig_AMO_store_addr
    coverpoint: ["SdtrigSm_a_cg/cp_sdtrig_amo"]

  # Whether data store triggers match on AMOs is UNSPECIFIED.
  - name: Sdtrig_AMO_store_match
    coverpoint: ["Behavior is UNSPECIFIED by the specification; not tested"]

  # If the destination register of any load or AMO is zero then it is UNSPECIFIED
  # whether a data load trigger will match.
  - name: Sdtrig_load_zero_rd
    coverpoint: ["Behavior is UNSPECIFIED by the specification; not tested"]

  # Some instructions lead a hart to perform multiple memory accesses. This includes
  # vector loads and stores, as well as cm.push and cm.pop instructions. The Trigger
  # Module should match such accesses as if they all happened individually. E.g. a
  # vector load should be treated as if it performed multiple loads of size SEW
  # (selected element width), and cm.push should be treated as if it performed
  # multiple stores of size XLEN.
  - name: Sdtrig_mult_mem_access
    coverpoint:
      [
        "SdtrigSm_combined_accesses_cg/cp_sdtrig_vector_load_store",
        "SdtrigSm_combined_accesses_cg/cp_sdtrig_vector_accesses",
        "SdtrigSm_combined_accesses_cg/cp_sdtrig_cm_pop_push",
      ]

  # For the purposes of debug triggers, two classes of cache operations must match
  # as stores: Cache operations that enable software to maintain coherence between
  # otherwise non-coherent implicit and explicit memory accesses. Cache operations
  # that perform block writes of constant data.
  - name: Sdtrig_caches_stores
    coverpoint:
      [
        "SdtrigSm_cache_operations_cg/cp_sdtrig_cache_zicbom",
        "SdtrigSm_cache_operations_cg/cp_sdtrig_cache_zicboz",
      ]

  # Only triggers with size=0 and select=0 will match. Since cache operations affect
  # multiple addresses, there are multiple possible values to compare against.
  # Implementations must implement one of the following options.
  - name: Sdtrig_cache_compare
    coverpoint:
      [
        "SdtrigSm_cache_operations_cg/cp_sdtrig_cache_zicbom",
        "SdtrigSm_cache_operations_cg/cp_sdtrig_cache_zicboz",
      ]

  # . Every address from the effective address rounded down to the nearest cache
  # block boundary (inclusive) to the effective address rounded up to the nearest
  # cache block boundary (exclusive) is a compare value. . The effective address
  # rounded down to the nearest cache block boundary is a compare value. . The
  # effective address of the instruction is a compare value.
  - name: Sdtrig_cache_compare_opts
    coverpoint: ["Implementation may choose among several options; not tested"]

  # Cache operations encoded as HINTs do not match debug triggers.
  - name: Sdtrig_cache_hints
    coverpoint: ["SdtrigSm_cache_operations_cg/cp_sdtrig_cache_zicbop"]

  # cbo.clean, cbo.flush, and cbo.inval match as if they are stores because they
  # affect consistency.
  - name: Sdtrig_cache_clears
    coverpoint: ["SdtrigSm_cache_operations_cg/cp_sdtrig_cache_zicbom"]

  # cbo.zero matches as if it is a store because it performs a block write of
  # constant data.
  - name: Sdtrig_cbo_zero
    coverpoint: ["SdtrigSm_cache_operations_cg/cp_sdtrig_cache_zicboz"]

  # The prefetch instructions don't match at all.
  - name: Sdtrig_prefetch
    coverpoint: ["SdtrigSm_cache_operations_cg/cp_sdtrig_cache_zicbop"]

  # For address matches without a mask, tdata2 must be able to hold all valid
  # addresses in all supported translation modes. That means that after writing any
  # of these valid addresses, the exact same value XLEN-wide value is read back,
  # including any high bits. An implementation may be able to optimize the storage
  # required, depending on the widest addresses it supports.
  - name: Sdtrig_tdata2_addr_sz1
    coverpoint: ["SdtrigSm_address_matches_cg/cp_sdtrig_tdata2_translate"]

  # If physical addresses are less than XLEN bits wide, they are zero-extended.
  - name: Sdtrig_pmem
    coverpoint: ["SdtrigSm_address_matches_cg/cp_sdtrig_tdata2_translate"]

  # If virtual addresses are less than XLEN bits wide, they are sign-extended.
  - name: Sdtrig_vmem
    coverpoint: ["SdtrigSm_address_matches_cg/cp_sdtrig_tdata2_translate"]

  # tdata2 must be implemented with enough bits of storage to represent the full
  # range of supported physical and virtual address values when read by software and
  # used by hardware.
  - name: Sdtrig_csr_tdata2_sz2
    coverpoint: ["SdtrigSm_address_matches_cg/cp_sdtrig_tdata2_translate"]

  # If tdata2 can hold any invalid addresses, then writes of an invalid address that
  # can not be represented as-is should be converted to a different invalid address
  # that can be represented.
  - name: Sdtrig_csr_tdata2_invalid
    coverpoint: ["WARL write-any-read-legal behavior not separately tested"]

  # An instruction that performs multiple architectural state changes (e.g.,
  # register updates and/or memory accesses) might cause a trigger to fire at an
  # intermediate point in its execution. As a result, architectural state changes up
  # to that point might have been performed, while subsequent state changes,
  # starting from the event that activated the trigger, might not have been. The
  # definition of such an instruction will specify the order in which architectural
  # state changes take place. Alternatively, it may state that partial execution is
  # not allowed, implying that a mid-execution trigger must prevent any
  # architectural state changes from occurring.
  - name: Sdtrig_multistate_change
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # All tdata registers follow write-any-read-legal semantics.
  - name: Sdtrig_tdata_warl
    coverpoint: ["WARL write-any-read-legal behavior not separately tested"]

  # Writes to one tdata register must not modify the contents of other tdata
  # registers, nor the configuration of any trigger besides the one that is
  # currently selected.
  - name: Sdtrig_tdata_write
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_tdata_write"]

  # To help with this situation, it is guaranteed that writing 0 to tdata1 disables
  # the trigger, and leaves it in a state where tdata2 and tdata3 can be written
  # with any value that makes sense for any trigger type supported by this trigger.
  - name: Sdtrig_disable_trig
    coverpoint: ["Unpredictable behavior on this access; not tested"]

  # Attempts to access an unimplemented Trigger Module Register raise an illegal
  # instruction exception.
  - name: Sdtrig_unimplemented_register
    coverpoint: ["Unpredictable behavior on this access; not tested"]

  # The Trigger Module registers, except mscontext, scontext, and hcontext, are only
  # accessible in machine and Debug Mode to prevent untrusted user code from causing
  # entry into Debug Mode without the OS's permission.
  - name: Sdtrig_trigger_modes
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_csr_access"]

  # On systems where XLEN values can differ between modes, this is handled as
  # follows.
  - name: Sdtrig_xlen_handling
    coverpoint: ["XLEN-dependent behavior not tested; single XLEN assumed"]

  # Fields retain their values regardless of XLEN, which only affects where in the
  # register these fields appear
  - name: Sdtrig_fields
    coverpoint: ["XLEN-dependent behavior not tested; single XLEN assumed"]

  # Some fields are wider when XLEN is 64 than when it is 32 (e.g. svalue). The high
  # bits in such fields retain their value but are not readable when XLEN is 32.
  - name: Sdtrig_fields_high
    coverpoint: ["XLEN-dependent behavior not tested; single XLEN assumed"]

  # A modification of a register when XLEN is 32 clears any inaccessible bits in
  # that register.
  - name: Sdtrig_xlen_modification
    coverpoint: ["XLEN-dependent behavior not tested; single XLEN assumed"]

  # This register determines which trigger is accessible through the other Trigger
  # Module registers.
  - name: Sdtrig_tselect
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_tselect_trigs"]

  # The set of accessible triggers must start at 0, and be contiguous.
  - name: Sdtrig_tselect_access
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_tselect_trigs"]

  # This register is WARL.
  - name: Sdtrig_tselect_warl
    coverpoint: ["WARL write-any-read-legal behavior not separately tested"]

  # This register provides access to the trigger selected by tselect.
  - name: Sdtrig_tdata1
    coverpoint: ["SdtrigSm_sdtrig_cg/cp_sdtrig_csr_access_common"]

  # The reset values listed here apply to every underlying trigger.
  - name: Sdtrig_tdata1_reset
    coverpoint: ["Reset values not tested in this suite"]

  # Writing 0 to this register must result in a trigger that is disabled.
  - name: Sdtrig_tdata1_write0
    coverpoint: ["WARL write-any-read-legal behavior not separately tested"]

  # If this trigger supports multiple types, then the hardware should disable it by
  # changing type to 15.
  - name: Sdtrig_tdata1_multiple_types
    coverpoint: ["WARL write-any-read-legal behavior not separately tested"]

  # The trigger is an address/data match trigger. The remaining bits in this
  # register act as described in mcontrol.
  - name: Sdtrig_tdata1_type_mcontrol
    coverpoint: ["Deprecated mcontrol type 2 trigger; not implemented"]

  # The trigger is an instruction count trigger. The remaining bits in this register
  # act as described in icount.
  - name: Sdtrig_tdata1_type_icount
    coverpoint:
      [
        "SdtrigSm_icount_cg/cp_sdtrig_icount_instr",
        "SdtrigSm_icount_cg/cp_sdtrig_icount_trap",
      ]

  # The trigger is an interrupt trigger. The remaining bits in this register act as
  # described in itrigger.
  - name: Sdtrig_tdata1_type_itrigger
    coverpoint: ["SdtrigSm_itrigger_cg/cp_sdtrig_itrigger"]

  # The trigger is an exception trigger. The remaining bits in this register act as
  # described in etrigger.
  - name: Sdtrig_tdata1_type_etrigger
    coverpoint: ["SdtrigSm_etrigger_cg/cp_sdtrig_etrigger"]

  # The trigger is an address/data match trigger. The remaining bits in this
  # register act as described in mcontrol6.
  - name: Sdtrig_tdata1_type_mcontrol6
    coverpoint: ["SdtrigSm_mcontrol6_cg/cp_sdtrig_mcontrol6_priv_mode"]

  # The trigger is a trigger source external to the TM. The remaining bits in this
  # register act as described in tmexttrigger.
  - name: Sdtrig_tdata1_type_tmexttrigger
    coverpoint:
      ["Tmexttrigger relies on implementation-specific external inputs"]

  # This trigger is disabled.
  - name: Sdtrig_tdata1_type_disabled
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # In this state, tdata2 and tdata3 can be written with any value that is supported
  # for any of the types this trigger implements.
  - name: Sdtrig_tdata1_disabled_write
    coverpoint: ["WARL write-any-read-legal behavior not separately tested"]

  # Other values are reserved for future use.
  - name: Sdtrig_tdata1_type_rsv
    coverpoint: ["Reserved encoding for future use; nothing to test"]

  # If type is 0, then this bit is hard-wired to 0.
  - name: Sdtrig_tdata1_dmode_type_0
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_tdata1_mode_hardwired"]

  # Both Debug and M-mode can write the tdata registers at the selected tselect.
  - name: Sdtrig_tdata1_dmode_0
    coverpoint: ["Requires Sdext external debug support; not implemented"]

  # Only Debug Mode can write the tdata registers at the selected tselect. Writes
  # from other modes are ignored.
  - name: Sdtrig_tdata1_dmode_1
    coverpoint: ["Requires Sdext external debug support; not implemented"]

  # This bit is only writable from Debug Mode.
  - name: Sdtrig_tdata1_dmode_writable
    coverpoint: ["Requires Sdext external debug support; not implemented"]

  # If type is 0, then this field is hard-wired to 0.
  - name: Sdtrig_tdata1_data
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_tdata1_mode_hardwired"]

  # This register provides access to the trigger selected by tselect.
  - name: Sdtrig_tdata2
    coverpoint: ["SdtrigSm_sdtrig_cg/cp_sdtrig_csr_access_common"]

  # The reset values listed here apply to every underlying trigger.
  - name: Sdtrig_tdata2_reset
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # If the trigger is disabled, then this register can be written with any value
  # supported by any of the trigger types supported by this trigger.
  - name: Sdtrig_tdata2_disabled
    coverpoint: ["WARL write-any-read-legal behavior not separately tested"]

  # If XLEN is less than DXLEN, writes to this register are sign-extended.
  - name: Sdtrig_tdata2_sign_extend
    coverpoint: ["XLEN-dependent behavior not tested; single XLEN assumed"]

  # This register provides access to the trigger selected by tselect.
  - name: Sdtrig_tdata3
    coverpoint: ["SdtrigSm_sdtrig_cg/cp_sdtrig_csr_access_common"]

  # The reset values listed here apply to every underlying trigger.
  - name: Sdtrig_tdata3_reset
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # If the trigger is disabled, then this register can be written with any value
  # supported by any of the trigger types supported by this trigger.
  - name: Sdtrig_tdata3_disabled
    coverpoint: ["WARL write-any-read-legal behavior not separately tested"]

  # If XLEN is less than DXLEN, writes to this register are sign-extended.
  - name: Sdtrig_tdata3_sign_extend
    coverpoint: ["XLEN-dependent behavior not tested; single XLEN assumed"]

  # This register provides access to the trigger selected by tselect.
  - name: Sdtrig_tinfo
    coverpoint: ["SdtrigSm_sdtrig_cg/cp_sdtrig_csr_access_common"]

  # The reset values listed here apply to every underlying trigger.
  - name: Sdtrig_tinfo_reset
    coverpoint: ["Reset values not tested in this suite"]

  # This register is optional if no triggers are implemented, or if type is not
  # writable and version would be 0. In this case the debugger can read the only
  # supported type from tdata1.
  - name: Sdtrig_tinfo_optional
    coverpoint: ["Only ratified version 1.0 supported; version assumed"]

  # Contains the version of the Sdtrig extension implemented.
  - name: Sdtrig_tinfo_version
    coverpoint: ["Only ratified version 1.0 supported; version assumed"]

  # Supports triggers as described in this spec at commit 5a5c078, made on February
  # 2, 2023.
  - name: Sdtrig_tinfo_version_0
    coverpoint: ["Only ratified version 1.0 supported; version assumed"]

  # Supports triggers as described in the ratified version 1.0 of this document.
  - name: Sdtrig_tinfo_version_1
    coverpoint: ["Only ratified version 1.0 supported; version assumed"]

  # One bit for each possible type enumerated in tdata1. Bit N corresponds to type
  # N. If the bit is set, then that type is supported by the currently selected
  # trigger.
  - name: Sdtrig_tinfo_support
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_tinfo_read_only"]

  # If the currently selected trigger doesn't exist, this field contains 1.
  - name: Sdtrig_tinfo_no_trigger
    coverpoint: ["WARL tselect; nonexistent-trigger reporting not tested"]

  # This optional register is only accessible in M-mode and Debug Mode and provides
  # various control bits related to triggers.
  - name: Sdtrig_trigger_modes_1
    coverpoint: ["SdtrigSm_sdtrig_cg/cp_sdtrig_csr_access_common"]

  # When any trap into M-mode is taken, mpte is set to the value of mte.
  - name: Sdtrig_tcontrol_mpte
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_tcontrol_mtrap"]

  # Triggers with action=0 do not match/fire while the hart is in M-mode.
  - name: Sdtrig_tcontrol_mte_disabled
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_tcontrol_enable"]

  # Triggers do match/fire while the hart is in M-mode.
  - name: Sdtrig_tcontrol_mte_enabled
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_tcontrol_enable"]

  # When any trap into M-mode is taken, mte is set to 0.
  - name: Sdtrig_tcontrol_mte
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_tcontrol_mtrap"]

  # When mret is executed, mte is set to the value of mpte.
  - name: Sdtrig_tcontrol_mte_mret
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_tcontrol_mret"]

  # This optional register may be implemented only if the H extension is
  # implemented. If it is implemented, mcontext must also be implemented.
  - name: Sdtrig_hcontext_implemented
    coverpoint: ["Hypervisor extension not implemented, so not testable"]

  # This register is only accessible in HS-Mode, M-mode and Debug Mode.
  - name: Sdtrig_hcontext_access
    coverpoint: ["Hypervisor extension not implemented, so not testable"]

  # If Smstateen is implemented, then accessibility of in HS-Mode is controlled by
  # mstateenzero[57].
  - name: Sdtrig_hcontext_smstateen
    coverpoint: ["Hypervisor extension not implemented, so not testable"]

  # This register is an alias of the mcontext register, providing access to the
  # hcontext field from HS-Mode.
  - name: Sdtrig_hcontext
    coverpoint: ["Hypervisor extension not implemented, so not testable"]

  # This optional register is only accessible in S/HS-mode, VS-mode, M-mode and
  # Debug Mode.
  - name: Sdtrig_scontext_access
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_csr_access"]

  # Accessibility of this CSR is controlled by mstateenzero[57] and hstateenzero[57]
  # in the Smstateen extension.
  - name: Sdtrig_scontext_accessibility
    coverpoint: ["State-enable accessibility tested in the Smstateen suite"]

  # Supervisor mode software can write a context number to this register, which can
  # be used to set triggers that only fire in that specific context.
  - name: Sdtrig_scontext_data
    coverpoint: ["SdtrigSm_sdtrig_cg/cp_sdtrig_csr_access_common"]

  # This register must be implemented if hcontext is implemented, and is optional
  # otherwise.
  - name: Sdtrig_mcontext_implementation
    coverpoint: ["Hypervisor extension not implemented, so not testable"]

  # It is only accessible in M-mode and Debug mode.
  - name: Sdtrig_mcontext_access
    coverpoint: ["SdtrigSm_csr_cg/cp_sdtrig_mcontext_smode"]

  # M-Mode or HS-Mode (using hcontext) software can write a context number to this
  # register, which can be used to set triggers that only fire in that specific
  # context.
  - name: Sdtrig_mcontext_hcontext_data
    coverpoint: ["SdtrigSm_sdtrig_cg/cp_sdtrig_csr_access_common"]

  # This optional register is an alias for scontext.
  - name: Sdtrig_mscontext
    coverpoint: ["Optional register, not required by Sdtrig 1.0; not tested"]

  # It is only accessible in S/HS-mode, M-mode and Debug Mode.
  - name: Sdtrig_mscontext_access
    coverpoint: ["Optional register, not required by Sdtrig 1.0; not tested"]

  # This register provides access to the trigger selected by tselect.
  - name: Sdtrig_mcontrol
    coverpoint: ["Deprecated mcontrol type 2 trigger; not implemented"]

  # The reset values listed here apply to every underlying trigger.
  - name: Sdtrig_mcontrol_reset
    coverpoint: ["Deprecated mcontrol type 2 trigger; not implemented"]

  # This register is accessible as tdata1 when type is 2.
  - name: Sdtrig_mcontrol_access
    coverpoint: ["Deprecated mcontrol type 2 trigger; not implemented"]

  # Specifies the largest naturally aligned powers-of-two (NAPOT) range supported by
  # the hardware when match is 1. The value is the logarithm base 2 of the number of
