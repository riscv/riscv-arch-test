# yaml-language-server: $schema=testplan.schema.json
suite: Svrsw60t59b
coverpoints:
  - heading: "General Test Environment (Svrsw60t59b):\n- T-SBI suite: boots to S-mode (BOOT_TO_SMODE) and drives the test from the boot identity map. The page under test is mapped at va_data. S-mode accesses run from the identity map. U-mode accesses use RVTEST_TSBI_GOTO_UMODE / RVTEST_TSBI_GOTO_SMODE; the handler moves execution to the U-accessible code alias va_rvtest_code_begin and back.\n- RV64 only: Svrsw60t59b depends on Sv39. Run for every supported translation mode (Sv39, Sv48, Sv57), as selected by the UDB configuration.\n- PTE under test, for each privilege mode: the leaf PTE at every level (the 4 KiB page and each superpage size), and each non-leaf PTE above a 4 KiB leaf. Each is tried with bit 59 set, bit 60 set, and both set.\n- The trace reports the leaf PTE of a walk that completes, so the coverpoints sample the leaf cases; the signature checks the non-leaf cases."
  - name: cp_load
    goal: Verify a load through a PTE with bits 60:59 set completes (Svrsw60t59b)
    description: "S-mode and U-mode (PTE.U=1 on the leaf for U-mode): set bit 59, bit 60 or both in the leaf or non-leaf PTE under test and run SFENCE.VMA. Load (lw) from va_data."
    expectation: "No fault; the load returns the word in the page."
    bins: |-
      rsw60t59b_PTE_d x load_ok x satp_mode x priv_mode_s_u
      = 3 x 1 x (up to 3) x 2 = up to 18 bins
  - name: cp_store
    goal: Verify a store through a PTE with bits 60:59 set completes (Svrsw60t59b)
    description: "S-mode and U-mode (PTE.U=1 on the leaf for U-mode): set bit 59, bit 60 or both in the leaf or non-leaf PTE under test and run SFENCE.VMA. Store (sw) to va_data and load the word back."
    expectation: "No fault; the load returns the stored value."
    bins: |-
      rsw60t59b_PTE_d x store_ok x satp_mode x priv_mode_s_u
      = 3 x 1 x (up to 3) x 2 = up to 18 bins
  - name: cp_fetch
    goal: Verify an instruction fetch through a PTE with bits 60:59 set completes (Svrsw60t59b)
    description: "S-mode and U-mode (PTE.U=1 on the leaf for U-mode): set bit 59, bit 60 or both in the leaf or non-leaf PTE under test and run SFENCE.VMA. Jump (jalr) to va_data; the code there writes the result register and returns."
    expectation: "No fault; the code in the page runs and writes the result register."
    bins: |-
      rsw60t59b_PTE_i x fetch_ok x satp_mode x priv_mode_s_u
      = 3 x 1 x (up to 3) x 2 = up to 18 bins
