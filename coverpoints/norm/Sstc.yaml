normative_rule_definitions:
  # This extension adds the S-level stimecmp CSR
  - name: stimecmp_exist
    coverpoint: ["Sstc_cg/{cp_supervisor_stce, cp_supervisor_tm}"]
  # This extension adds the STCE bit to the menvcfg and henvcfg CSRs.
  - name: stce_bit_exist
    # henvcfg.STCE is covered by SstcH_vs_cg/cp_vs_stimecmp_accessible
    coverpoint:
      [
        "Sstc_cg/{cp_supervisor_stce, cp_user_stce}",
        "SstcH_vs_cg/cp_vs_stimecmp_accessible",
      ]

  # menvcfg_stce_exists and menvcfg_stce_rdonly0 are mapped in Sm.yaml (menvcfg walk).

  # The STCE bit enables stimecmp for S-mode when set to one.
  - name: menvcfg_stce_enable_op
    coverpoint:
      ["Sstc_cg/cp_supervisor_stce", "InterruptsSm_cg/cp_trigger_sti_sstc"]
  # When this extension is implemented and STCE in menvcfg is zero, an attempt to access
  # stimecmp or vstimecmp in a mode other than M-mode raises an illegal-instruction
  # exception, STCE in henvcfg is read-only zero, and STIP in mip and sip reverts to its
  # defined behavior as if this extension is not implemented.
  - name: menvcfg_stce_zero_op
    # cp_trigger_sti_sstc covers the STIP half with STCE = 0; henvcfg.STCE needs H (SstcH)
    coverpoint:
      [
        "Sstc_cg/{cp_supervisor_stce, cp_user_stce}",
        "InterruptsSm_cg/cp_trigger_sti_sstc",
      ]
  # Further, if the H extension is implemented, then hip.VSTIP also reverts its defined
  # behavior as if this extension is not implemented.
  - name: menvcfg_stce_zero_vstip
    # TODO: hip.VSTIP with menvcfg.STCE = 0 needs the hypervisor tests (SstcH)
    coverpoint: [""]

  # when the TM bit in the mcounteren register is clear, attempts to access the
  # stimecmp or vstimecmp register while executing in a mode less privileged than M
  # will cause an illegal-instruction exception.
  - name: mcounteren_tm_clr
    # U-mode accesses to stimecmp trap whatever TM is, so only S-mode exercises TM; vstimecmp needs SstcH
    coverpoint: ["Sstc_cg/cp_supervisor_tm"]

  # When this bit is set, access to the stimecmp or vstimecmp register is permitted
  # in S-mode if implemented, and access to the vstimecmp register (via stimecmp) is
  # permitted in VS-mode if implemented and not otherwise prevented by the TM bit in
  # hcounteren.
  - name: mcounteren_tm_set
    coverpoint: ["Sstc_cg/cp_supervisor_tm"]

  # The stimecmp CSR is a 64-bit register and has 64-bit precision on all RV32 and
  # RV64 systems. In RV32 only, accesses to the stimecmp CSR access the low 32 bits,
  # while accesses to the stimecmph CSR access the high 32 bits of stimecmp.
  - name: stimecmp_stimecmph_sz_acc
    coverpoint:
      [
        "Sstc_cg/cp_supervisor_tm",
        "Sstc_cg/cp_supervisor_tm_h",
        "Sstc_cg/cp_supervisor_stce",
      ]

  # mip_sip_stip_op and sip_stip_sie_stie are mapped in SstcSm.yaml (InterruptsSm_cg).
