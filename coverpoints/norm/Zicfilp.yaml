# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions
#
# The Zicfilp landing pad tests run once per privilege mode: ZicfilpSm in M-mode, ZicfilpS in S-mode, ZicfilpU in
# U-mode. ZicfilpSm additionally covers M-mode trap entry and MRET, which need medeleg=0 and direct mstatus writes.

normative_rule_definitions:
  # The term call is used to refer to a jal, jalr or c.jal instruction with a link register as destination,
  # i.e., rd≠x0. Conventionally, the link register is x1 or x5. A c.jalr expands to jalr x1,0(rs1) and thus it
  # is a call. A call using jalr or c.jalr is termed an indirect call.
  - name: cfi_call_term
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_indirect_elp_state_update,cp_zicfilp_indirect_elp_state_update_c} (jalr with rd=x1, c.jalr)",
      ]

  # The term return is used to refer to a jalr instruction with rd=x0 and with rs1=x1 or rs1=x5. A c.jr
  # instruction expands to jalr x0,0(rs1) and is a return if rs1=x1 or rs1=x5.
  - name: cfi_return_term
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_indirect_elp_state_update,cp_zicfilp_indirect_elp_state_update_c} (jalr with rd=x0, c.jr)",
      ]

  # The term indirect jump is used to refer to a jalr instruction with rd=x0 and where the rs1 is not x1 or x5
  # (i.e., not a return). A c.jr instruction where rs1 is not x1 or x5 (i.e., not a return) is an indirect jump.
  - name: cfi_indirect-jump_term
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_indirect_elp_state_update,cp_zicfilp_indirect_elp_state_update_c} (jalr with rd=x0, c.jr)",
      ]

  # The lpad instruction is encoded using the auipc major opcode with rd=x0. The lpad instruction is encoded
  # with a 20-bit immediate value called the landing-pad-label (LPL) that is matched to the expected landing
  # pad label. When LPL is encoded as zero, the lpad instruction does not perform the label check.
  - name: Zicflip_lpad_enc
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_lpad_zero_label_bypass,cp_zicfilp_lpad_valid_execution}",
      ]

  # The Zicfilp extension, when enabled, determines if an indirect call or an indirect jump must land on a
  # landing pad. If is_lp_expected is 1, then the hart updates the ELP to LP_EXPECTED.
  - name: Zicflip_lpad_expected
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_indirect_elp_state_update,cp_zicfilp_indirect_elp_state_update_c}",
      ]

  # An indirect branch using jalr, c.jalr, or c.jr with rs1 as x7 is termed a software-guarded branch. Such
  # branches do not need to land on a lpad instruction and thus do not set ELP to LP_EXPECTED.
  - name: Zicflip_indirect_branch_lpad
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_indirect_elp_state_update,cp_zicfilp_indirect_elp_state_update_c} (rs1 = x1, x5, x7 bins)",
        "ZicfilpSm_cg/{cp_pelp_trap_entry_m_guarded_zicfilp,cp_pelp_trap_entry_m_guarded_zicfilp_c}",
      ]

  # To support labeled landing pads, the indirect call/jump sites establish an expected landing pad label
  # (e.g., using the lui instruction) in the bits 31:12 of the x7 register.
  - name: Zicflip_lpad_label
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_lpad_label_match_mismatch,cp_zicfilp_lpad_valid_execution}",
      ]

  # When ELP is set to LP_EXPECTED, if the next instruction in the instruction stream is not 4-byte aligned,
  # or is not lpad, or if the landing pad label encoded in lpad is not zero and does not match the expected
  # landing pad label in bits 31:12 of the x7 register, then a software-check exception (cause=18) with xtval
  # set to landing pad fault (code=2) is raised else the ELP is updated to NO_LP_EXPECTED.
  - name: Zicflip_elp_lpad_expected
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_lpad_valid_execution,cp_zicfilp_lpad_missing_instruction_exception,cp_zicfilp_lpad_label_mismatch,cp_lpad_no_sw_exception_elp_clear_zicfilp,cp_lpad_nop_no_lp_expected_zicfilp}",
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/cp_lpad_alignment_exception_zicfilp (Zca only: without Zca a target that is not 4-byte aligned raises an instruction-address-misaligned exception first)",
      ]

  # When Zicfilp is enabled, lpad is the only instruction allowed to execute when the ELP state is
  # LP_EXPECTED. If Zicfilp is not enabled then the instruction is a no-op.
  - name: Zicflip_lpad_enabled_instr_allowed
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_lpad_missing_instruction_exception,cp_disabled_zicfilp}",
      ]

  # If Zicfilp is enabled, the lpad instruction causes a software-check exception with xtval set to landing
  # pad fault (code=2) if the pc is not 4-byte aligned and ELP is LP_EXPECTED, or ELP is LP_EXPECTED and the
  # LPL is not zero and does not match the expected landing pad label in bits 31:12 of the x7 register. If a
  # software-check exception is not caused then the ELP is updated to NO_LP_EXPECTED.
  - name: Zicflip_lpad_exception
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_lpad_label_mismatch,cp_zicfilp_lpad_label_exception_delivery,cp_lpad_no_sw_exception_elp_clear_zicfilp,cp_lpad_nop_no_lp_expected_zicfilp}",
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/cp_lpad_alignment_exception_zicfilp (Zca only)",
      ]

  # A trap may need to be delivered to the same or to a higher privilege mode upon completion of
  # jalr/c.jalr/c.jr, but before the instruction at the target of indirect call/jump was decoded, due to
  # asynchronous interrupts or synchronous exceptions with priority higher than that of a software-check
  # exception with xtval set to landing pad fault (code=2).
  - name: Zicfilp_forward_traps
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/cp_exception_priority_zicfilp (instruction access fault)",
        "The asynchronous interrupt case is not tested",
      ]

  # The software-check exception caused by Zicfilp has higher priority than an illegal-instruction exception
  # but lower priority than instruction access-fault.
  - name: Zicfilp_exception_priority
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/cp_exception_priority_zicfilp (instruction access fault and illegal instruction bins)",
      ]

  # The software-check exception due to the instruction not being an lpad instruction when ELP is LP_EXPECTED
  # or a software-check exception caused by the lpad instruction itself leads to a trap being delivered to the
  # same or to a higher privilege mode.
  - name: lpad_sw_exception
    coverpoint:
      [
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_lpad_missing_instruction_exception,cp_zicfilp_lpad_label_exception_delivery}",
        "ZicfilpSm_cg/cp_elp_state_preservation_zicfilp (from S/U-mode to M-mode)",
        "ZicfilpS_cg/cp_elp_state_preservation_s_zicfilp (from U-mode to S-mode)",
      ]

  # To store the previous ELP state on trap delivery to S/HS-mode, an SPELP bit is provided in the mstatus
  # CSR. The SPELP bit in mstatus can be accessed through the sstatus CSR.
  - name: Zicfilp_forward_traps_s_hs_mode
    coverpoint:
      [
        "{ZicfilpS_cg,ZicfilpU_cg}/cp_zicfilp_lpad_label_exception_delivery",
        "ZicfilpS_cg/{cp_pelp_trap_entry_s_zicfilp,cp_elp_state_preservation_s_zicfilp,cp_pelp_trap_return_s_zicfilp}",
      ]

  # To store the previous ELP state on traps to VS-mode, a SPELP bit is defined in the vsstatus (VS-modes
  # version of sstatus).
  - name: vsstatus_spelp_op2
    coverpoint: ["Hypervisor: belongs to ZicfilpH"]

  # To store the previous ELP state on transition to Debug Mode, a pelp bit is defined in the dcsr register.
  # Upon entry into Debug Mode, the pelp bit in dcsr is updated with the ELP at the privilege level the hart
  # was previously in, and the ELP is set to NO_LP_EXPECTED. When a hart resumes from Debug Mode, if the new
  # privilege mode is y, then ELP is set to the value of pelp if yLPE is 1; otherwise, it is set to
  # NO_LP_EXPECTED.
  - name: Zicfilp_forward_traps_debug_mode
    coverpoint: ["Debug Mode: belongs to the Sdext testplan"]

  # When a trap is taken into privilege mode x, the xPELP is set to ELP and ELP is set to NO_LP_EXPECTED.
  - name: Zicfilp_pelp_trap
    coverpoint:
      [
        "ZicfilpSm_cg/{cp_pelp_trap_entry_m_zicfilp,cp_pelp_trap_entry_m_guarded_zicfilp,cp_pelp_trap_entry_m_guarded_zicfilp_c,cp_elp_state_preservation_zicfilp}",
        "ZicfilpS_cg/{cp_pelp_trap_entry_s_zicfilp,cp_pelp_trap_entry_s_guarded_zicfilp,cp_pelp_trap_entry_s_guarded_zicfilp_c,cp_elp_state_preservation_s_zicfilp}",
        "{ZicfilpSm_cg,ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_lpad_label_exception_delivery,cp_exception_priority_zicfilp}",
      ]

  # An mret or sret instruction is used to return from a trap in M-mode or S-mode, respectively. When executing
  # an xret instruction, if the new privilege mode is y, then ELP is set to the value of xPELP if yLPE is 1;
  # otherwise, it is set to NO_LP_EXPECTED; xPELP is set to NO_LP_EXPECTED.
  - name: Zicfilp_pelp_trap_return
    coverpoint:
      [
        "ZicfilpSm_cg/cp_pelp_trap_return_m_zicfilp (MRET)",
        "ZicfilpS_cg/cp_pelp_trap_return_s_zicfilp (SRET)",
        "xPELP=NO_LP_EXPECTED after an xRET to the same mode is checked in the signature",
      ]

  # The Zicfilp extension adds the SPELP and MPELP fields that hold the previous ELP, and are updated as
  # specified in ZICFILP_FORWARD_TRAPS. To store the previous ELP state on trap delivery to S/HS-mode, an
  # SPELP bit is provided in the mstatus CSR.
  - name: mstatus_spelp_op
    coverpoint:
      [
        "{ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_lpad_label_exception_delivery,cp_exception_priority_zicfilp}",
        "ZicfilpS_cg/{cp_pelp_trap_entry_s_zicfilp,cp_elp_state_preservation_s_zicfilp,cp_pelp_trap_return_s_zicfilp}",
      ]

  # The Zicfilp extension adds the SPELP and MPELP fields that hold the previous ELP, and are updated as
  # specified in ZICFILP_FORWARD_TRAPS. To store the previous ELP state on trap delivery to M-mode, an MPELP
  # bit is provided in the mstatus CSR.
  - name: mstatus_mpelp_op
    coverpoint:
      [
        "ZicfilpSm_cg/{cp_zicfilp_lpad_label_exception_delivery,cp_pelp_trap_entry_m_zicfilp,cp_elp_state_preservation_zicfilp,cp_pelp_trap_return_m_zicfilp}",
      ]

  # The xPELP fields are encoded as follows: 0 - NO_LP_EXPECTED - no landing pad instruction expected.
  # 1 - LP_EXPECTED - a landing pad instruction is expected.
  - names: [mstatus_spelp_enc, mstatus_mpelp_enc]
    coverpoint:
      [
        "ZicfilpSm_cg/{cp_pelp_trap_entry_m_zicfilp,cp_elp_state_preservation_zicfilp}",
        "ZicfilpS_cg/{cp_pelp_trap_entry_s_zicfilp,cp_pelp_trap_return_s_zicfilp}",
        "{ZicfilpS_cg,ZicfilpU_cg}/cp_zicfilp_lpad_label_exception_delivery",
      ]

  # The Zicfilp extension adds the LPE field in menvcfg. When the LPE field is set to 1 and S-mode is
  # implemented, the Zicfilp extension is enabled in S-mode. If LPE field is set to 1 and S-mode is not
  # implemented, the Zicfilp extension is enabled in U-mode. When the LPE field is 0 the hart does not update
  # the ELP state; it remains as NO_LP_EXPECTED. The LPAD instruction operates as a no-op.
  - name: menvcfg_lpe_op
    coverpoint:
      [
        "ZicfilpS_cg/{cp_zicfilp_indirect_elp_state_update,cp_zicfilp_indirect_elp_state_update_c,cp_disabled_zicfilp}",
        "ZicfilpU_cg/{cp_zicfilp_indirect_elp_state_update,cp_zicfilp_indirect_elp_state_update_c,cp_disabled_zicfilp} (S-mode not implemented)",
      ]

  # The Zicfilp extension adds the MLPE field in mseccfg.
  - name: mseccfg_mlpe_presence
    coverpoint: ["ZicfilpSm_cg/cp_zicfilp_indirect_elp_state_update"]

  # When MLPE field is 1, Zicfilp extension is enabled in M-mode.
  - name: mseccfg_mlpe_set_op
    coverpoint:
      [
        "ZicfilpSm_cg/{cp_zicfilp_indirect_elp_state_update,cp_zicfilp_indirect_elp_state_update_c}",
      ]

  # When the MLPE field is 0, the Zicfilp extension is not enabled in M-mode. The hart does not update the ELP
  # state; it remains as NO_LP_EXPECTED. The LPAD instruction operates as a no-op.
  - name: mseccfg_mlpe_clr_op
    coverpoint:
      [
        "ZicfilpSm_cg/{cp_zicfilp_indirect_elp_state_update,cp_zicfilp_indirect_elp_state_update_c,cp_disabled_zicfilp}",
      ]

  # If the Zicfilp extension is implemented, the mseccfg.MLPE field is reset to 0.
  - name: mseccfg_mlpe_rst
    coverpoint: ["Reset values are not tested"]

  # Access to the SPELP field, added by Zicfilp, accesses the homonymous fields of mstatus when V=0, and the
  # homonymous fields of vsstatus when V=1.
  - names:
      [
        sstatus_spelp_sz,
        sstatus_spelp_acc,
        sstatus_spelp_op,
        sstatus_spelp_Zicfilp,
      ]
    coverpoint:
      [
        "{ZicfilpS_cg,ZicfilpU_cg}/cp_zicfilp_lpad_label_exception_delivery (V=0)",
        "ZicfilpS_cg/cp_pelp_trap_return_s_zicfilp (SPELP written through sstatus)",
      ]

  # The Zicfilp extension adds the LPE field in senvcfg. When the LPE field is set to 1, the Zicfilp extension
  # is enabled in VU/U-mode. When the LPE field is 0, the Zicfilp extension is not enabled in VU/U-mode.
  - names: [senvcfg_lpe_Zicfilp_acc, senvcfg_lpe_Zicfilp_op]
    coverpoint:
      [
        "ZicfilpU_cg/{cp_zicfilp_indirect_elp_state_update,cp_zicfilp_indirect_elp_state_update_c,cp_disabled_zicfilp}",
      ]

  # The Zicfilp extension adds the LPE field in henvcfg. When the LPE field is set to 1, the Zicfilp extension
  # is enabled in VS-mode.
  - name: henvcfg_lpe_op
    coverpoint: ["Hypervisor: belongs to ZicfilpH"]

  # The Zicfilp extension adds the SPELP field that holds the previous ELP.
  - name: vsstatus_spelp_op
    coverpoint: ["Hypervisor: belongs to ZicfilpH"]

  # On a trap caused by a software-check exception, the mtval register holds the cause for the exception.
  - name: mtval_swchk
    coverpoint:
      [
        "ZicfilpSm_cg/{cp_zicfilp_lpad_missing_instruction_exception,cp_zicfilp_lpad_label_mismatch,cp_zicfilp_lpad_label_exception_delivery}",
      ]

  # On a trap caused by a software-check exception, the stval register holds the cause for the exception.
  - name: stval_exception_info
    coverpoint:
      [
        "{ZicfilpS_cg,ZicfilpU_cg}/{cp_zicfilp_lpad_missing_instruction_exception,cp_zicfilp_lpad_label_mismatch,cp_zicfilp_lpad_label_exception_delivery}",
      ]

  # If the Zicfilp extension is implemented, mnstatus also holds the MNPELP field, which on entry to the RNMI
  # trap handler holds the previous ELP state.
  - name: mnstatus_mnpelp_op
    coverpoint: ["Deferred: Smrnmi (RNMI) is not yet tested"]

  # When an RNMI trap is taken, MNPELP is set to ELP and ELP is set to 0.
  - name: mnstatus_mnpelp_update
    coverpoint: ["Deferred: Smrnmi (RNMI) is not yet tested"]

  # If the Zicfilp extension is implemented, then if the new privileged mode is y, MNRET sets ELP to the logical
  # AND of yLPE and mnstatus.MNPELP.
  - name: mnret_zicfilp
    coverpoint: ["Deferred: Smrnmi (RNMI) is not yet tested"]
