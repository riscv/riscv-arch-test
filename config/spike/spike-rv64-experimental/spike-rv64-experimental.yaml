# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: spike-rv64-experimental
description: rv64 with all experimental extensions enabled, along with a minimal set of their dependencies
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: Sm, version: "= 1.13.0" }
  - { name: S, version: "= 1.13.0" }
  - { name: U, version: "= 1.0.0" }
  - { name: Sv39, version: "= 1.0.0" }
  - { name: Svbare, version: "= 1.0.0" }
  - { name: Zibi, version: "= 0.7" }
  - { name: Zvabd, version: "= 0.9" }
  - { name: Zve32x, version: "= 1.0" }
  - { name: Zve64x, version: "= 1.0" }
  - { name: Zvl32b, version: "= 1.0" }
  - { name: Zvl64b, version: "= 1.0" }
  - { name: Zicsr, version: "= 2.0" }
params:
