    # Representative coverpoints; also the register coverpoints of the other E covergroups, and
    # cp_upperreg_rs2/rd and the Ssstrict_S and Ssstrict_U instr covergroups for the reserved x16-x31
    coverpoint:
      [
        "E_add_cg/{cp_rs1, cp_rs2, cp_rd}",
        "Ssstrict_Sm_instr_cg/cp_upperreg_rs1",
      ]
