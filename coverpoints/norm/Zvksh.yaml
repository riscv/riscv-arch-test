# Mapping of normative rules to coverpoints for a test suite
#
# Zvksh exercises the vector SM3 extension (vsm3c, vsm3me). Both instructions operate on 256-bit
# element groups (EGS=8, EEW=32) and only run at SEW=32 in this suite.

normative_rule_definitions:
  # All of these instructions work on 256-bit element groups comprised of eight 32-bit elements.
  - name: Zvksh_egw256b_elem32b
    coverpoint: ["Zvksh_vsm3c_vi_cg/cp_csr_vtype_lmul_egs8_sew32"]

  # To help avoid side-channel timing attacks, these instructions shall be implemented with data-
  # independent timing.
  - name: Zvksh_dataindeptiming
    coverpoint:
      [
        "TODO: data-independent execution timing (a side-channel-resistance property) is not observable from a self-checking signature comparison",
      ]

  # The number of element groups to be processed is vl/EGS. vl must be set to the number of SEW=32
  # elements to be processed and therefore must be a multiple of EGS=8.
  - name: Zvksh_vl
    coverpoint:
      [
        "TODO: no coverpoint verifies vl is rejected when not a multiple of EGS - the functional suite only ever generates compliant values",
      ]

  # Likewise, vstart must be a multiple of EGS=8.
  - name: Zvksh_vstart
    coverpoint:
      [
        "TODO: no coverpoint samples vstart for this suite yet; nothing wired in coverpoints/unpriv/Zvksh_coverage.svh",
      ]

  # SEW is any value other than 32.
  - name: vsm3c-vi_sewn32_rsv
    coverpoint:
      [
        "Out-of-Scope: reserved because of CSR state (vtype.sew); Zvksh only generates SEW=32 tests and there is no Ssstrict-equivalent suite for vector-crypto",
      ]

  # The vd register group overlaps with the vs2 register group (reserved)
  - name: vsm3c-vi_vdoverlapvs2_rsv
    coverpoint:
      [
        "TODO: this is an SsstrictV-style reserved-encoding test; Zvksh_vsm3c_vi_cg has no vd/vs2 register-aliasing coverpoint and there is no Ssstrict-equivalent suite for vector-crypto",
      ]

  # Two rounds of SM3 compression are performed. The current state of eight 32-bit words is read
  # in as an element group from vd. Eight 32-bit message words are read in as an element group
  # from vs2, although only four of them are used. All of the 32-bit input words are byte-swapped
  # from big endian to little endian. The next state of eight 32-bit words is generated, swapped
  # back to big endian, and returned as an eight-element group. The round number is provided by
  # the 5-bit uimm unsigned immediate.
  - name: vsm3c-vi_op
    coverpoint: ["Zvksh_vsm3c_vi_cg/cp_vd_egs8"]

  # SEW is any value other than 32.
  - name: vsm3me-vv_sewn32_rsv
    coverpoint:
      [
        "Out-of-Scope: reserved because of CSR state (vtype.sew); Zvksh only generates SEW=32 tests and there is no Ssstrict-equivalent suite for vector-crypto",
      ]

  # The vd register group overlaps with the vs2 register group.
  - name: vsm3me-vv_vdoverlapvs2_rsv
    coverpoint:
      [
        "TODO: this is an SsstrictV-style reserved-encoding test; Zvksh_vsm3me_vv_cg has no vd/vs2 register-aliasing coverpoint (only vd/vs1 and vs1/vs2) and there is no Ssstrict-equivalent suite for vector-crypto",
      ]

  # Eight rounds of SM3 message expansion are performed. The sixteen most recent 32-bit message
  # words are read in as two eight-element groups from vs1 and vs2. Each of these words is swapped
  # from big endian to little endian. The next eight 32-bit message words are generated, swapped
  # back to big endian, and returned in an eight-element group.
  - name: vsm3me-vv_op
    coverpoint: ["Zvksh_vsm3me_vv_cg/cp_vd_egs8"]
