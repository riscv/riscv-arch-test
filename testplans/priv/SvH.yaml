  - name: mprv_sum_effect_hs_two_stage
    goal: effect of mstatus.MPRV with MPP=HS on accesses to user pages (two-stage on)
    description: With virtualization enabled and two-stage translation active (hgatp.MODE = Sv32x4/Sv39x4), set mstatus.MPRV=1, mstatus.{MPP,MPV}={M, HS, VS, U, VU}, current privilege is M. Suitable VS and G-Stage page tables with all combinations of {RWX = 111/000 and U = 1/0}.  Perform read, write, execute.
    expectation: "For data accesses: when sstatus.SUM=0, HS data access to a U page must fault with page fault of the corresponding type (load page fault for load; store/AMO page fault for store). When sstatus.SUM=1, data access succeeds subject to normal PTE permissions. Instruction fetch is unaffected by MPRV/SUM (fetch uses current mode translation); executing test code does not require setting guest code PTEs. Trap PC (mepc) points to faulting instruction; cause (mcause) matches access type. ***update"
    bins: 3 Access type × 5 MPP/MPV × 2 SUM × 4 VS permissions x 4 G-stage permissions = 480
    id: H_vm_gpatrans
  - name: VM_permission_invalid
    goal: that invalid permission in a guest PTE (pte.V=0) during 2-stage translation triggers correct page fault exceptions for instruction fetch, load, and store/AMO accesses across privilege modes.*** update
    description: With two-stage transnslation active, in each of {HS, VS, U, VU}, with each pages size {kilo/mega/giga} in VS and G stages, with leaf page V={0/1} in each stage, perform {read/write/execute}.
    expectation: "The following guest page faults must be raised depending on access type: - Instruction page fault for execute. - Load page fault for read. - Store/AMO page fault for write. Trap information: mtval must contain the faulting guest virtual address; scause must report the correct exception cause. ***update"
