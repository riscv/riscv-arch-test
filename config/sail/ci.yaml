# CI configuration for Sail reference model

ci_enabled: true
# Sscofpmf* will be added back in CI once Sail increments HPM counters:
#   https://github.com/riscv/sail-riscv/issues/1733
exclude_extensions: "SdtrigSm,SdtrigS,SdtrigU,SscofpmfSm,SscofpmfS,SscofpmfU"
shards: 1
config_shards:
  sail-RVA22S64-optional: 2
  sail-RVA23S64: 2
  sail-RVA23S64-optional: 2
  sail-RVB23S64-optional: 2
  sail-rv32-max: 4
  sail-rv32-max-clang: 4
  sail-rv64-max: 4
  sail-rv64-max-clang: 4
