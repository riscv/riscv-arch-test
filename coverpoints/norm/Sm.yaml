  # The mconfigptr register is an MXLEN-bit read-only CSR formatted as shown in mconfigptr_enc_img
  - name: mconfigptr_sz_acc
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_ro/mconfigptr"]

  # holds the physical address of a configuration data structure.
  - name: mconfigptr_op
    coverpoint: ["Definition, checked through UDB"]

  - name: mconfigptr_enc_img
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access_ro/mconfigptr"]

  # The pointer alignment in bits must be no smaller than MXLEN: i.e., if MXLEN is 8×n, then
