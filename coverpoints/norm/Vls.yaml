# Mapping of normative rules to coverpoints for a test suite
#
# Vls exercises the vector load/store test suite. General V-extension state (vtype,
# masking, tail/mask-agnostic policy) is homed in Vx.yaml; the entries below are the
# normative rules specific to vector memory instruction encoding and semantics.

normative_rule_definitions:
  # Vector loads and stores move values between vector registers and memory.
  - name: vector_load_store_semantics
    coverpoint:
      [
        "Vls16_vle8_v_cg/cp_vd",
        "Vls8_vle8_v_cg/cr_vl_lmul_e8_sew8",
        "Vls8_vse8_v_cg/cr_vl_lmul_e8_sew8",
        "Vls64_vle64_v_cg/cr_vl_lmul_e64_sew64",
        "Vls64_vse64_v_cg/cr_vl_lmul_e64_sew64",
      ]

  # Vector loads and stores can be masked, and they only access memory or raise exceptions
  # for active elements.
  - name: vector_masked_memory_access
    coverpoint: ["Vls16_vle8_v_cg/cp_masking_edges"]

  # Vector memory unit-stride and constant-stride operations directly encode EEW of the data
  # to be transferred statically in the instruction to reduce the number of vtype changes
  # when accessing memory in a mixed-width routine.
  - name: vector_ls_strided_eew
    coverpoint:
      ["{Vls16_vlse16_v_cg,Vls32_vlse32_v_cg,Vls64_vlse64_v_cg}/cp_asm_count"]

  # Implementations must provide vector loads and stores with EEWs corresponding to all
  # supported SEW settings.
  - name: vector_ls_ins_req
    coverpoint:
      [
        "{Vls8_vle8_v_cg,Vls16_vle16_v_cg,Vls32_vle32_v_cg,Vls64_vle64_v_cg}/cp_asm_count",
      ]

  # Vector load/store encodings for unsupported EEW widths are reserved.
  - name: vector_ls_ins_rsv
    coverpoint: ["SsstrictV_vle8_v_cg/cp_ssstrictv_ls_eew_lt_sewmin"]

  # If the implementation does not support the EEW of the offset elements, the instruction
  # is reserved.
  - name: vector_ls_eew_rsv
    coverpoint: ["ExceptionsVls_vloxei16_v_cg/cp_exceptionsv_index_eew16"]

  # The nf[2:0] field encodes the number of fields in each segment. For regular vector loads
  # and stores, nf=0, indicating that a single value is moved between a vector register
  # group and memory at each element position. Larger values in the nf field are used to
  # access multiple contiguous fields within a segment as described below in .
  - name: vector_ls_nf_op
    coverpoint: ["Vls16_vlseg2e8_v_cg/cp_asm_count"]

  # If the EMUL would be out of range (EMUL>8 or EMUL<1/8), the instruction encoding is
  # reserved.
  - name: vector_ls_emul_rsv
    coverpoint: ["ExceptionsVls_vloxei16_v_cg/cp_exceptionsv_index_eew16"]

  # The mew bit (inst[28]) when set is expected to be used to encode expanded memory sizes
  # of 128 bits and above, but these encodings are currently reserved.
  - name: vector_ls_mew_rsv
    coverpoint: ["SsstrictV_vle8_v_cg/cp_ssstrictv_ls_mew_reserved"]

  # The EMUL setting must be such that EMUL * NFIELDS ≤ 8, otherwise the instruction
  # encoding is reserved.
  - name: emul_nfields_rsv
    coverpoint: ["SsstrictV_vlseg2e8_v_cg/cp_ssstrictv_ls_seg_vd_overflow"]

  # The EMUL * NFIELDS ≤ 8 constraint applies to the data vector register group.
  - name: vector_ls_seg_indexed_emul_nfields_val
    coverpoint: ["SsstrictV_vlseg2e8_v_cg/cp_ssstrictv_ls_seg_vd_overflow"]

  # The load instructions have an EEW encoded in the mew and width fields following the
  # pattern of regular unit-stride loads.
  - name: vector_ls_seg_wholereg_eew
    coverpoint:
      [
        "Vls16_vl1re16_v_cg/cp_custom_vwholeRegLS_lmul",
        "Vls16_vl1re8_v_cg/cp_asm_count",
        "Vls16_vl1re16_v_cg/cp_asm_count",
        "Vls16_vl1re32_v_cg/cp_asm_count",
        "Vls16_vl1re64_v_cg/cp_asm_count",
        "Vls16_vl2re8_v_cg/cp_asm_count",
        "Vls16_vl2re16_v_cg/cp_asm_count",
        "Vls16_vl2re32_v_cg/cp_asm_count",
        "Vls16_vl2re64_v_cg/cp_asm_count",
        "Vls16_vl4re8_v_cg/cp_asm_count",
        "Vls16_vl4re16_v_cg/cp_asm_count",
        "Vls16_vl4re32_v_cg/cp_asm_count",
        "Vls16_vl4re64_v_cg/cp_asm_count",
        "Vls16_vl8re8_v_cg/cp_asm_count",
        "Vls16_vl8re16_v_cg/cp_asm_count",
        "Vls16_vl8re32_v_cg/cp_asm_count",
        "Vls16_vl8re64_v_cg/cp_asm_count",
      ]

  # Masked vector loads do not update inactive elements in the destination vector register group,
  # unless masked agnostic is specified (vtype.vma=1).
  - name: vector_masked_inactive_behavior
    # Representative coverpoints; cr_vtype_agnostic in every maskable Vls load covergroup
    coverpoint:
      [
        "Vls8_vle8_v_cg/cr_vtype_agnostic_e8",
        "Vls16_vle16_v_cg/cr_vtype_agnostic_e16",
        "Vls32_vle32_v_cg/cr_vtype_agnostic_e32",
        "Vls64_vle64_v_cg/cr_vtype_agnostic_e64",
      ]
