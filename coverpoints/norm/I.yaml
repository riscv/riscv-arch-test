  # AUIPC
  - name: auipc_enc
    coverpoint: ["I_auipc_cg/cp_asm_count"]
  # JAL
  - name: jal_enc
    coverpoint: ["I_jal_cg/cp_asm_count"]
  # JALR
  - name: jalr_enc
