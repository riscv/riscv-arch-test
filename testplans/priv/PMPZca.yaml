      pmp_access_fault_exception
  - name: cp_misaligned_off
    goal: "Off: Null region (disabled)"
    description: |-
      Check that misaligned 32-bit fetches that cross a OFF PMP boundary still succeed.
      Set up a 3 standard consecutive OFF PMP regions with L=1, XWR=111.
      Place an uncompressed ret = jalr ra inside first region, inside second region, and misaligned straddling the start and end of the second regions.
      Attempt jalr to each ret.
      All fetches match default region and succeed.
    bins: 4 addresses
    id: |-
      pmp_a_field_off

      pmp_misaligned_access_behavior

      pmp_access_fault_exception
