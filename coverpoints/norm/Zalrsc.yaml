# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  - name: A_aq_rl_bits
    coverpoint: ["Zalrsc_lr_w_cg/cp_custom_aqrl"]

  - name: A_domain_specific_ordering
    coverpoint: ["OUT-OF-SCOPE for single hart without defined I/O domains"]

  - name: A_no_aq_rl
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  - name: A_acquire_semantics
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  - name: A_release_semantics
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  - name: A_seq_cst_semantics
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  # The A extension comprises the Zalrsc and Zaamo extensions, which are
  # defined in the following sections.
  - name: A_comprises
    coverpoint: ["Definition, checked through UDB"]

  - name: lr-w_op
    coverpoint: ["Zalrsc_lr_w_cg/{cp_rs1_nx0, cp_rd}"]

  - name: sc-w_success
    coverpoint: ["Zalrsc_sc_w_cg/cp_sc_pass_fail"]

  - name: sc-w_failure
    coverpoint: ["Zalrsc_sc_w_cg/cp_sc_pass_fail"]

  - name: sc_failed_side_effects
    coverpoint: ["NONE: Behavior is UNSPECIFIED and OUT-OF-SCOPE"]

  - name: sc_reservation_invalidate
    coverpoint: ["Zalrsc_sc_w_cg/cp_custom_sc_after_sc"]

  - name: lr_sc_rv64
    coverpoint:
      ["Zalrsc_lr_d_cg/{cp_rs1_nx0, cp_rd}, Zalrsc_sc_d_cg/cp_sc_pass_fail"]

  - name: sc_failure_code
    coverpoint: ["Zalrsc_sc_w_cg/cp_sc_pass_fail"]

  - name: lr_reservation_set_size
    coverpoint: ["Zalrsc_sc_w_cg/cp_custom_sc_addresses"]

  - name: sc_pairs_latest_lr
    coverpoint: ["Zalrsc_sc_w_cg/cp_custom_sc_lr"]

  - name: sc_success_conditions
    coverpoint: ["Zalrsc_sc_w_cg/cp_custom_sc_after_sc; multihart not tested"]

  - name: sc_device_write_failure
    coverpoint: ["OUT-OF-SCOPE: device writes not modeled"]

  - name: sc_addr_not_in_reservation_fail
    coverpoint: ["Zalrsc_sc_w_cg/cp_sc_pass_fail"]

  - name: sc_other_hart_store_fail
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  - name: sc_other_device_write_fail
    coverpoint: ["OUT-OF-SCOPE: device writes not modeled"]

  - name: sc_intervening_sc_fail
    coverpoint: ["Zalrsc_sc_w_cg/cp_custom_sc_after_sc"]

  # An unsuccessful SC instruction does not give rise to any memory operations.
  - name: rvwmo_sc_fail_no_memop
    coverpoint: ["{Zalrsc_sc_w_cg, Zalrsc_sc_d_cg}/cp_custom_sc_after_sc"]

  - name: lr_sc_atomicity_axiom
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  - name: sc_not_observable_before_lr
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  - name: constrained_lrsc_loop_size
    coverpoint: ["Untested"]

  - name: constrained_lrsc_instruction_set
    coverpoint: ["Untested"]

  - name: constrained_lrsc_compressed_allowed
    coverpoint: ["Untested"]

  - name: constrained_lrsc_retry_code
    coverpoint: ["Untested"]

  - name: lrsc_eventuality_region
    coverpoint: ["PMAs not tested"]

  - name: lrsc_same_address_and_size
    coverpoint: ["Zalrsc_sc_w_cg/cp_custom_sc_addresses"]

  - name: unconstrained_lrsc_no_progress
    coverpoint: ["Behavior is unconstrained"]

  # If a hart H enters a constrained LR/SC loop, the execution environment must
  # guarantee that one of the following events eventually occurs
  - name: constrained_lrsc_forward_progress_intro
    # The sc tests retry each constrained loop up to 100 times and require the sc to succeed
    coverpoint:
      [
        "{Zalrsc_sc_w_cg, Zalrsc_sc_d_cg}/cp_custom_sc_lr",
        "other harts and devices OUT-OF-SCOPE for single hart",
      ]

  # H or some other hart executes a successful SC to the reservation set of the LR
  # instruction in H's constrained LR/SC loops.
  - name: constrained_lrsc_forward_progress_sc
    coverpoint:
      [
        "{Zalrsc_sc_w_cg, Zalrsc_sc_d_cg}/cp_custom_sc_lr",
        "other harts OUT-OF-SCOPE for single hart",
      ]

  # Some other hart executes an unconditional store or AMO instruction to the reservation set of the
  # LR instruction in H's constrained LR/SC loop, or some other device in the
  # system writes to that reservation set.
  - name: constrained_lrsc_forward_progress_store_amo
    coverpoint: ["OUT-OF-SCOPE for single hart"]

  # H executes a branch or jump that exits the constrained LR/SC loop.
  - name: constrained_lrsc_forward_progress_branch
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # H traps.
  - name: constrained_lrsc_forward_progress_trap
    coverpoint: ["Descriptive spec text with no separately testable behavior"]
