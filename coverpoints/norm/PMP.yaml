# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # &lt;&lt;pmpcfg&gt;&gt; shows the layout of a PMP configuration register. The R, W,
  # and X bits, when set, indicate that the PMP entry permits read, write, and
  # instruction execution, respectively. When one of these bits is clear, the
  # corresponding access type is denied.
  - name: pmp_cfg_permissions
    # Representative coverpoints; also cp_cfg_X1_all, cp_cfg_Rw00_all, cp_cfg_Rw10_all, cp_cfg_Rw11_all,
    # cp_cfg_rW00_all, cp_cfg_rW10_all, cp_cfg_rW11_all, cp_pmp64_{write, read}
    coverpoint:
      [
        "PMP_F_cg/{cp_cfg_R, cp_cfg_W}",
        "PMP_S_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W}",
        "PMP_Sm_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_X0_all}",
        "PMP_U_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W}",
        "PMP_Zaamo_cg/cp_cfg_RW",
        "PMP_Zalrsc_cg/cp_cfg_RW",
        "PMP_Zca_cg/{cp_cfg_R, cp_cfg_W}",
      ]

  # Attempting to execute a load or load-reserved instruction that accesses a physical
  # address within a PMP region without read permissions raises a load access-fault
  # exception.
  - name: pmp_load_fault
    # Representative coverpoints; also cp_cfg_A_tor_lw
    # Representative coverpoints; also cp_cfg_Rw10_all, cp_cfg_Rw11_all, cp_cfg_A_NA4_all, cp_cfg_A_na4_r,
    # cp_cfg_A_tor_all{0..14}, cp_cfg_A_tor_r
    # Representative coverpoints; also cp_cfg_A_tor_lw
    coverpoint:
      [
        "PMP_F_cg/cp_cfg_R",
        "PMP_S_cg/{cp_cfg_R, cp_cfg_A_napot_lw, cp_cfg_A_na4_lw, cp_mprv_lw}",
        "PMP_Sm_cg/{cp_cfg_R, cp_cfg_Rw00_all, cp_cfg_A_napot_all, cp_cfg_A_napot_r}",
        "PMP_U_cg/{cp_cfg_R, cp_cfg_A_napot_lw, cp_cfg_A_na4_lw, cp_mprv_lw}",
        "PMP_Zalrsc_cg/cp_cfg_RW",
        "PMP_Zca_cg/cp_cfg_R",
      ]

  # Attempting to execute a store, store-conditional, AMO, or cache-block zero
  # instruction that accesses a physical address within a PMP region without write
  # permissions raises a store access-fault exception.
  - name: pmp_store_fault
    # Representative coverpoints; also cp_cfg_A_tor_sw
    # Representative coverpoints; also cp_cfg_rW10_all, cp_cfg_rW11_all, cp_cfg_A_na4_w, cp_cfg_A_tor_w,
    # cp_cfg_A_tor_bot_L0_w, cp_cfg_A_tor_bot_L1_w, cp_pmp64_write
    # Representative coverpoints; also cp_cfg_A_tor_sw
    coverpoint:
      [
        "PMP_F_cg/cp_cfg_W",
        "PMP_S_cg/{cp_cfg_W, cp_cfg_A_napot_sw, cp_cfg_A_na4_sw, cp_mprv_sw}",
        "PMP_Sm_cg/{cp_cfg_W, cp_cfg_rW00_all, cp_cfg_A_napot_w, cp_priority_off_sw}",
        "PMP_U_cg/{cp_cfg_W, cp_cfg_A_napot_sw, cp_cfg_A_na4_sw, cp_mprv_sw}",
        "PMP_Zaamo_cg/cp_cfg_RW",
        "PMP_Zalrsc_cg/cp_cfg_RW",
        "PMP_Zca_cg/cp_cfg_W",
        "PMP_Zicbo_cg/cp_cbo_zero",
      ]

  # In addition to locking the PMP entry, the L bit indicates whether the R/W/X
  # permissions are additionally enforced on M-mode accesses. When the L bit is set,
  # these permissions are enforced for all privilege modes. When the L bit is clear, any
  # M-mode access matching the PMP entry will succeed; the R/W/X permissions apply only
  # to S and U modes.
  - name: pmp_l_bit_m_mode_enforcement
    # Representative coverpoints; also cp_mprv_{lw, sw}
    # Representative coverpoints; also cp_cfg_X1_all, cp_cfg_Rw00_all, cp_cfg_Rw10_all, cp_cfg_Rw11_all,
    # cp_cfg_rW00_all, cp_cfg_rW10_all, cp_cfg_rW11_all, cp_cfg_L_access_{exec, read, write}
    # Representative coverpoints; also cp_mprv_{lw, sw}
    coverpoint:
      [
        "PMP_F_cg/{cp_cfg_R, cp_cfg_W}",
        "PMP_S_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_mprv_jalr}",
        "PMP_Sm_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_X0_all}",
        "PMP_U_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_mprv_jalr}",
        "PMP_Zaamo_cg/cp_cfg_RW",
        "PMP_Zalrsc_cg/cp_cfg_RW",
        "PMP_Zca_cg/{cp_cfg_R, cp_cfg_W}",
      ]

  # On some implementations, misaligned loads, stores, and instruction fetches may be
  # decomposed into multiple memory operations, some of which may succeed before an
  # access-fault exception occurs, as described in the RVWMO specification. PMP checking
  # is performed on each memory operation independently.
  - name: pmp_misaligned_access_behavior
    # Representative coverpoints; also cp_misaligned_na4
    coverpoint:
      [
        "PMP_F_cg/cp_misaligned_mag16",
        "PMP_S_cg/cp_misaligned_partial",
        "PMP_Sm_cg/{cp_partial_match, cp_misaligned_mag16, cp_misaligned_partial}",
        "PMP_U_cg/cp_misaligned_partial",
        "PMP_Zaamo_cg/cp_misaligned_mag16",
        "PMP_Zacas_cg/cp_misaligned_mag16",
        "PMP_Zca_cg/{cp_misaligned_mag16, cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_off}",
      ]

  # The matching PMP entry must match all bytes of a memory operation, or the operation
  # fails, irrespective of the L, R, W, and X bits.
  - name: pmp_full_match_required
    # Representative coverpoints; also cp_misaligned_na4, cp_cret_{tor, na4}
    coverpoint:
      [
        "PMP_F_cg/cp_misaligned_mag16",
        "PMP_S_cg/cp_misaligned_partial",
        "PMP_Sm_cg/{cp_partial_match, cp_partial_covered, cp_misaligned_mag16, cp_misaligned_partial}",
        "PMP_U_cg/cp_misaligned_partial",
        "PMP_Zaamo_cg/{cp_partial_match, cp_misaligned_mag16}",
        "PMP_Zacas_cg/{cp_partial_match_d, cp_partial_match_q, cp_misaligned_mag16}",
        "PMP_Zalrsc_cg/cp_partial_match",
        "PMP_Zca_cg/{cp_misaligned_mag16, cp_misaligned_napot, cp_misaligned_tor, cp_cret_napot}",
      ]

  # If a PMP entry matches all bytes of a memory operation, then the L, R, W, and X bits
  # determine whether the operation succeeds or fails. If the L bit is clear and the
  # privilege mode of the access is M, the operation succeeds. Otherwise, if the L bit
  # is set or the privilege mode of the access is S or U, then the operation succeeds
  # only if the R, W, or X bit corresponding to the access type is set.
  - name: pmp_rwx_check
    # Representative coverpoints; also cp_cfg_A_napot_{lw, sw}, cp_cfg_A_na4_{jalr, lw, sw},
    # cp_cfg_A_tor_{jalr, lw, sw}, cp_mprv_{jalr, lw, sw}
    # Representative coverpoints; also cp_cfg_X1_all, cp_cfg_Rw00_all, cp_cfg_Rw10_all, cp_cfg_Rw11_all,
    # cp_cfg_rW00_all, cp_cfg_rW10_all, cp_cfg_rW11_all, cp_cfg_L_access_{exec, read, write},
    # cp_cfg_A_napot_{x, r, w}, cp_cfg_A_na4_{x, r, w}, cp_cfg_A_tor_{x, r, w}, cp_cfg_A_tor_bot_L0_{x, w, r},
    # cp_cfg_A_tor_bot_L1_{x, w, r}, cp_priority_{lw, sw, jalr}, cp_misaligned_partial
    # Representative coverpoints; also cp_cfg_A_napot_{lw, sw}, cp_cfg_A_na4_{jalr, lw, sw},
    # cp_cfg_A_tor_{jalr, lw, sw}, cp_mprv_{jalr, lw, sw}
    coverpoint:
      [
        "PMP_F_cg/{cp_cfg_R, cp_cfg_W}",
        "PMP_S_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_A_napot_jalr}",
        "PMP_Sm_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_X0_all}",
        "PMP_U_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_A_napot_jalr}",
        "PMP_Zaamo_cg/cp_cfg_RW",
        "PMP_Zca_cg/{cp_cfg_R, cp_cfg_W}",
      ]

  # if all accessed bytes lie within the same misaligned atomicity granule, the
  # instruction will not raise an exception for reasons of address alignment, and the
  # instruction will give rise to only one memory operation for the purposes of RVWMO--
  # i.e., it will execute atomically.
  - name: pma_mag_op_within
    coverpoint:
      [
        "PMP_F_cg/cp_misaligned_mag16",
        "PMP_Sm_cg/cp_misaligned_mag16",
        "PMP_Zaamo_cg/cp_misaligned_mag16",
        "PMP_Zacas_cg/cp_misaligned_mag16",
        "PMP_Zca_cg/cp_misaligned_mag16",
      ]

  # The misaligned atomicity granule PMA applies only to AMOs defined in the
  # ext:zaamo[], ext:zabha[], and ext:zacas[] extensions; loads and stores defined in
  # the base ISAs; loads and stores of no more than XLEN bits defined in the ext:f[],
  # ext:d[], and ext:q[] extensions; the load-acquire and store-release instructions
  # defined in the ext:zalasr[] extension; and compressed encodings of the foregoing
  # loads and stores.
  - name: pma_mag_insts
    coverpoint:
      [
        "PMP_F_cg/cp_misaligned_mag16",
        "PMP_Sm_cg/cp_misaligned_mag16",
        "PMP_Zaamo_cg/cp_misaligned_mag16",
        "PMP_Zacas_cg/cp_misaligned_mag16",
        "PMP_Zca_cg/cp_misaligned_mag16",
      ]

  # PMP checks are applied to all accesses whose effective privilege mode is S or U,
  # including instruction fetches and data accesses in S and U mode, and data accesses
  # in M-mode when the MPRV bit in mstatus is set and the MPP field in mstatus contains
  # S or U.
  - name: pmp_check_priv_modes
    # Representative coverpoints; also cp_cfg_A_off_{lw, sw}, cp_cfg_A_napot_{jalr, lw, sw},
    # cp_cfg_A_na4_{jalr, lw, sw}, cp_cfg_A_tor_{jalr, lw, sw}, cp_mprv_{jalr, lw, sw}, cp_none_{jalr, lw, sw}
    # Representative coverpoints; also cp_cfg_A_off_{lw, sw}, cp_cfg_A_napot_{jalr, lw, sw},
    # cp_cfg_A_na4_{jalr, lw, sw}, cp_cfg_A_tor_{jalr, lw, sw}, cp_mprv_{jalr, lw, sw}, cp_none_{jalr, lw, sw}
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_A_off_jalr}",
        "PMP_U_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_A_off_jalr}",
      ]

  # PMP CSRs are only accessible to M-mode.
  - name: pmp_csr_mode
    coverpoint:
      [
        "PMP_S_cg/{cp_pmpaddr_access_s, cp_pmpcfg_access_s}",
        "PMP_U_cg/{cp_pmpaddr_access_u, cp_pmpcfg_access_u}",
      ]

  # The PMP address registers are CSRs named pmpaddr0-pmpaddr63.
  - name: pmp_addr_registers
    coverpoint:
      [
        "PMP_S_cg/cp_pmpaddr_access_s",
        "PMP_Sm_cg/{cp_pmpaddr_upper_zero, cp_pmp64_read, cp_pmp64_write}",
        "PMP_U_cg/cp_pmpaddr_access_u",
      ]

  # Attempting to fetch an instruction from a PMP region that does not have execute
  # permissions raises an instruction access-fault exception.
  - name: pmp_exec_fault
    # Representative coverpoints; also cp_cfg_A_tor_jalr
    # Representative coverpoints; also cp_cfg_X1_all, cp_cfg_A_tor_x
    # Representative coverpoints; also cp_cfg_A_tor_jalr
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_X, cp_cfg_A_napot_jalr, cp_cfg_A_na4_jalr, cp_mprv_jalr}",
        "PMP_Sm_cg/{cp_cfg_X, cp_cfg_X0_all, cp_cfg_A_napot_x, cp_cfg_A_na4_x}",
        "PMP_U_cg/{cp_cfg_X, cp_cfg_A_napot_jalr, cp_cfg_A_na4_jalr, cp_mprv_jalr}",
        "PMP_Zca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4}",
      ]

  # When A=0, this PMP entry is disabled and matches no addresses.
  - name: pmp_a_field_off
    # Representative coverpoints; also cp_cfg_A_OFF_all_exec, cp_priority_off_{sw, jalr}, cp_none_{sw, jalr}
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_A_off_jalr, cp_cfg_A_off_lw, cp_cfg_A_off_sw}",
        "PMP_Sm_cg/{cp_cfg_A_OFF_all_read, cp_cfg_A_OFF_all_write, cp_priority_off_lw, cp_none_lw}",
        "PMP_U_cg/{cp_cfg_A_off_jalr, cp_cfg_A_off_lw, cp_cfg_A_off_sw}",
        "PMP_Zca_cg/cp_misaligned_off",
      ]

  # naturally aligned power-of-2 regions (NAPOT), including the special case of
  # naturally aligned four-byte regions (NA4);
  - name: pmp_a_field_napot_na4
    # Representative coverpoints; also cp_cfg_A_na4_{lw, sw}
    # Representative coverpoints; also cp_cfg_A_napot_{r, w}, cp_cfg_A_na4_{r, w}
    # Representative coverpoints; also cp_cfg_A_na4_{lw, sw}
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_A_napot_jalr, cp_cfg_A_napot_lw, cp_cfg_A_napot_sw, cp_cfg_A_na4_jalr}",
        "PMP_Sm_cg/{cp_cfg_A_napot_all, cp_cfg_A_napot_x, cp_cfg_A_NA4_all, cp_cfg_A_na4_x}",
        "PMP_U_cg/{cp_cfg_A_napot_jalr, cp_cfg_A_napot_lw, cp_cfg_A_napot_sw, cp_cfg_A_na4_jalr}",
      ]

  # NAPOT ranges make use of the low-order bits of the associated address register to
  # encode the size of the range, as shown in &lt;&lt;pmpcfg-napot&gt;&gt;.
  - name: pmp_napot_encoding_low_bits
    # Representative coverpoints; also cp_cfg_A_napot_w, cp_priority_{sw, jalr}
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_A_napot_jalr, cp_cfg_A_napot_lw, cp_cfg_A_napot_sw}",
        "PMP_Sm_cg/{cp_cfg_A_napot_all, cp_cfg_A_napot_x, cp_cfg_A_napot_r, cp_priority_lw}",
        "PMP_U_cg/{cp_cfg_A_napot_jalr, cp_cfg_A_napot_lw, cp_cfg_A_napot_sw}",
      ]

  # If TOR is selected, the associated address register forms the top of the address
  # range, and the preceding PMP address register forms the bottom of the address range.
  # If PMP entry i's A field is set to TOR, the entry matches any address y such that
  # pmpaddr~i-1~≤y&lt;pmpaddr~i~ (irrespective of the value of pmpcfg~i-1~). If PMP
  # entry 0's A field is set to TOR, zero is used for the lower bound, and so it matches
  # any address y&lt;pmpaddr~0~.
  - name: pmp_a_field_tor
    # Representative coverpoints; also cp_none_{lw, sw}
    # Representative coverpoints; also cp_cfg_A_tor_all{1..14}, cp_cfg_A_tor_{r, w}, cp_cfg_A_tor0_{w, x},
    # cp_cfg_A_tor_bot_L0_{w, r}, cp_cfg_A_tor_bot_L1_{x, w, r}, cp_cfg_A_tor_nonoverlap1_{x, w, r},
    # cp_cfg_A_tor_nonoverlap2_{x, w, r}, cp_cfg_A_tor_nonoverlap3_{x, w, r}
    # Representative coverpoints; also cp_none_{lw, sw}
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_A_tor_jalr, cp_cfg_A_tor_lw, cp_cfg_A_tor_sw, cp_none_jalr}",
        "PMP_Sm_cg/{cp_cfg_A_tor_all0, cp_cfg_A_tor_x, cp_cfg_A_tor0_r, cp_cfg_A_tor_bot_L0_x}",
        "PMP_U_cg/{cp_cfg_A_tor_jalr, cp_cfg_A_tor_lw, cp_cfg_A_tor_sw, cp_none_jalr}",
      ]

  # If no PMP entry matches an M-mode memory operation, the operation succeeds. If no
  # PMP entry matches an S-mode or U-mode memory operation, the operation fails if at
  # least one PMP entry is implemented and succeeds otherwise.
  - name: pmp_no_entry_match
    coverpoint:
      [
        "PMP_S_cg/{cp_none_jalr, cp_none_lw, cp_none_sw, cp_misaligned_partial}",
        "PMP_Sm_cg/{cp_none_lw, cp_none_sw, cp_none_jalr}",
        "PMP_U_cg/{cp_none_jalr, cp_none_lw, cp_none_sw, cp_misaligned_partial}",
      ]

  # Failed memory operations generate an instruction, load, or store access-fault
  # exception.
  - name: pmp_access_fault_exception
    # Representative coverpoints; also cp_none_{lw, sw}
    # Representative coverpoints; also cp_cfg_X0_all, cp_cfg_X1_all, cp_priority_{lw, sw, jalr},
    # cp_partial_match
    # Representative coverpoints; also cp_none_{lw, sw}
    coverpoint:
      [
        "PMP_S_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_none_jalr}",
        "PMP_Sm_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_A_napot_all}",
        "PMP_U_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_none_jalr}",
        "PMP_Zca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4}",
      ]

  # If mtval is written with a nonzero value when a misaligned load or store causes an
  # access-fault, page-fault, or hardware-error exception, then mtval will contain the
  # virtual address of the portion of the access that caused the fault.
  - name: mtval_vaddr_wr_misaligned_addr
    coverpoint:
      [
        "TODO: cp_misaligned_partial does not record mtval (IMPRECISE_ACCESS_FAULT_XTVAL); check that it holds the address of a faulting portion of the access",
        "TODO: cp_misaligned_partial does not record mtval (IMPRECISE_ACCESS_FAULT_XTVAL); check that it holds the address of a faulting portion of the access",
        "TODO: cp_misaligned_partial does not record mtval (IMPRECISE_ACCESS_FAULT_XTVAL); check that it holds the address of a faulting portion of the access",
      ]

  # The granularity of PMP access control settings are platform-specific, but the
  # standard PMP encoding supports regions as small as four bytes.
  - name: pmp_granularity
    coverpoint:
      [
        "PMP_Sm_cg/{cp_cfg_A_NA4_all, cp_grain_check_write, cp_grain_check_read}",
      ]

  # Optionally, PMP checks may additionally apply to M-mode accesses, in which case the
  # PMP registers themselves are locked, so that even M-mode software cannot change them
  # until the hart is reset.
  - name: pmp_mmode_locking
    coverpoint: ["PMP_Sm_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_L_modify}"]

  # PMP entries are described by an 8-bit configuration register and one MXLEN-bit
  # address register. Some PMP settings additionally use the address register associated
  # with the preceding PMP entry.
  - name: pmp_entry_structure
    # Representative coverpoints; also cp_cfg_A_tor_all{0, 2..14}, cp_cfg_A_tor_bot_L0_{x, w},
    # cp_cfg_A_tor_bot_L1_{x, w}, cp_pmpcfg_walk_odd, cp_pmpcfg_zero
    coverpoint:
      [
        "PMP_Sm_cg/{cp_pmpcfg_walk, cp_cfg_A_tor_all1, cp_cfg_A_tor_bot_L0_r, cp_cfg_A_tor_bot_L1_r}",
      ]

  # Up to 64 PMP entries are supported. Implementations may implement zero, 16, or 64
  # PMP entries; the lowest-numbered PMP entries must be implemented first.
  - name: pmp_entry_count
    coverpoint: ["PMP_Sm_cg/{cp_pmp64_write, cp_pmp64_read}"]

  # All PMP CSR fields are WARL and may be read-only zero.
  - name: pmp_csrs_warl_access
    # Representative coverpoints; also cp_pmpcfg_walk_odd, cp_pmpcfg_zero
    coverpoint:
      [
        "PMP_Sm_cg/{cp_cfg_A_all_even, cp_cfg_A_all_odd, cp_pmpaddr_upper_zero, cp_pmpcfg_walk}",
      ]

  # For RV32, sixteen CSRs, pmpcfg0–pmpcfg15, hold the configurations pmp0cfg–pmp63cfg
  # for the 64 PMP entries, as shown in &lt;&lt;pmpcfg-rv32&gt;&gt;.
  - name: pmp_cfg_rv32_layout
    # Representative coverpoints; also cp_cfg_A_all_even, cp_cfg_A_tor_all{0..2, 5..14}, cp_pmpcfg_{walk,
    # zero}, cp_pmp64_{write, read}
    # entries 3/4 straddle pmpcfg0/pmpcfg1 on RV32
    coverpoint:
      [
        "PMP_Sm_cg/{cp_pmpcfg_walk_odd, cp_cfg_A_all_odd, cp_cfg_A_tor_all3, cp_cfg_A_tor_all4}",
      ]

  # For RV64, eight even-numbered CSRs, pmpcfg0, pmpcfg2, …, pmpcfg14, hold the
  # configurations for the 64 PMP entries, as shown in &lt;&lt;pmpcfg-rv64&gt;&gt;.
  - name: pmp_cfg_rv64_layout
    # Representative coverpoints; also cp_cfg_A_all_{even, odd}, cp_cfg_A_tor_all{0..6, 9..14},
    # cp_pmpcfg_walk_odd, cp_pmpcfg_zero, cp_pmpcfg_odd_rv64, cp_pmp64_write
    # entries 7/8 straddle pmpcfg0/pmpcfg2 on RV64
    coverpoint:
      [
        "PMP_Sm_cg/{cp_pmpcfg_walk, cp_cfg_A_tor_all7, cp_cfg_A_tor_all8, cp_pmp64_read}",
      ]

  # For RV64, the odd-numbered configuration registers, pmpcfg1, pmpcfg3, …, pmpcfg15,
  # are illegal.
  - name: pmp_cfg_rv64_illegal
    coverpoint: ["PMP_Sm_cg/cp_pmpcfg_odd_rv64"]

  # Each PMP address register encodes bits 33-2 of a 34-bit physical address for RV32,
  # as shown in &lt;&lt;pmpaddr-rv32&gt;&gt;. For RV64, each PMP address register
  # encodes bits 55-2 of a 56-bit physical address, as shown in &lt;&lt;pmpaddr-
  # rv64&gt;&gt;.
  - name: pmp_addr_encoding
    # Representative coverpoints; also cp_cfg_A_napot_w, cp_cfg_A_tor_{r, w}
    coverpoint:
      [
        "PMP_Sm_cg/{cp_cfg_A_napot_x, cp_cfg_A_napot_r, cp_cfg_A_tor_x, cp_pmpaddr_upper_zero}",
      ]

  # Not all physical address bits may be implemented, and so the pmpaddr registers are
  # WARL.
  - name: pmp_addr_warl
    coverpoint:
      [
        "PMP_Sm_cg/{cp_grain_check_write, cp_grain_check_read, cp_pmpaddr_upper_zero}",
      ]

  # The R, W, and X fields form a collective WARL field for which the combinations with
  # R=0 and W=1 are reserved.
  - name: pmp_rwx_warl
    coverpoint:
      ["PMP_Sm_cg/{cp_pmpcfg_walk, cp_pmpcfg_walk_odd, cp_pmpcfg_zero}"]

  # The A field in a PMP entry's configuration register encodes the address-matching
  # mode of the associated PMP address register. The encoding of this field is shown in
  # &lt;&lt;pmpcfg-a&gt;&gt;.
  - name: pmp_a_field_encoding
    # Representative coverpoints; also cp_cfg_A_all_odd, cp_cfg_A_OFF_all_{write, exec}
    coverpoint:
      [
        "PMP_Sm_cg/{cp_cfg_A_all_even, cp_cfg_A_OFF_all_read, cp_cfg_A_napot_all, cp_cfg_A_NA4_all}",
      ]

  # Although the PMP mechanism supports regions as small as four bytes, platforms may
  # specify coarser PMP regions. In general, the PMP grain is 2^G+2^ bytes and must be
  # the same across all PMP regions.
  - name: pmp_region_granularity_g
    # Representative coverpoints; also cp_grain_NAPOT_to_{OFF, NAPOT, TOR}, cp_grain_OFF_to_TOR
    coverpoint:
      [
        "PMP_Sm_cg/{cp_grain_OFF_to_OFF, cp_grain_OFF_to_NAPOT, cp_grain_check_write, cp_grain_check_read}",
      ]

  # When G ≥ 1, the NA4 mode is not selectable.
  - name: pmp_na4_select_restriction
    coverpoint: ["PMP_Sm_cg/{cp_cfg_A_all_even, cp_cfg_A_all_odd}"]

  # When G ≥ 2 and pmpcfg~i~.A[1] is set, i.e. the mode is NAPOT, then bits
  # pmpaddr~i~[G-2:0] read as all ones.
  - name: pmp_napot_addr_read_mask
    # Representative coverpoints; also cp_grain_OFF_to_TOR, cp_grain_NAPOT_to_TOR
    coverpoint:
      [
        "PMP_Sm_cg/{cp_grain_OFF_to_OFF, cp_grain_OFF_to_NAPOT, cp_grain_NAPOT_to_OFF, cp_grain_NAPOT_to_NAPOT}",
      ]

  # When G ≥ 1 and pmpcfg~i~.A[1] is clear, i.e. the mode is OFF or TOR, then bits
  # pmpaddr~i~[G-1:0] read as all zeros. Bits pmpaddr~i~[G-1:0] do not affect the TOR
  # address-matching logic.
  - name: pmp_tor_off_addr_read_mask
    # Representative coverpoints; also cp_grain_NAPOT_to_{OFF, NAPOT, TOR}, cp_grain_OFF_to_TOR
    coverpoint:
      [
        "PMP_Sm_cg/{cp_grain_OFF_to_OFF, cp_grain_OFF_to_NAPOT, cp_grain_check_write, cp_grain_check_read}",
      ]

  # Although changing pmpcfg~i~.A[1] affects the value read from pmpaddr~i~, it does not
  # affect the underlying value stored in that register—in particular, pmpaddr~i~[G-1]
  # retains its original value when pmpcfg~i~.A is changed from NAPOT to TOR/OFF then
  # back to NAPOT.
  - name: pmp_addr_retention_on_mode_change
    # Representative coverpoints; also cp_grain_OFF_to_TOR, cp_grain_NAPOT_to_TOR
    coverpoint:
      [
        "PMP_Sm_cg/{cp_grain_OFF_to_OFF, cp_grain_OFF_to_NAPOT, cp_grain_NAPOT_to_OFF, cp_grain_NAPOT_to_NAPOT}",
      ]

  # The L bit indicates that the PMP entry is locked, i.e., writes to the configuration
  # register and associated address registers are ignored.
  - name: pmp_l_bit_function
    coverpoint: ["PMP_Sm_cg/cp_cfg_L_modify"]

  # Locked PMP entries remain locked until the hart is reset.
  - name: pmp_locked_until_reset
    coverpoint: ["PMP_Sm_cg/cp_cfg_L_modify"]

  # If PMP entry i is locked, writes to pmpicfg and pmpaddri are ignored. Additionally,
  # if PMP entry i is locked and pmpicfg.A is set to TOR, writes to pmpaddri-1 are
  # ignored.
  - name: pmp_l_bit_write_protection
    coverpoint: ["PMP_Sm_cg/cp_cfg_L_modify"]

  # PMP entries are statically prioritized. The lowest-numbered PMP entry that matches
  # any byte of a memory operation determines whether that operation succeeds or fails.
  - name: pmp_entry_priority
    # Representative coverpoints; also cp_cfg_X0_all, cp_cfg_X1_all, cp_cfg_Rw00_all, cp_cfg_Rw10_all,
    # cp_cfg_Rw11_all, cp_cfg_rW00_all, cp_cfg_rW10_all, cp_cfg_rW11_all, cp_priority_off_{sw, jalr},
    # cp_partial_{match, covered}
    # Representative coverpoints; also cp_cret_{tor, na4}
    coverpoint:
      [
        "PMP_Sm_cg/{cp_priority_lw, cp_priority_sw, cp_priority_jalr, cp_priority_off_lw}",
        "PMP_Zaamo_cg/cp_partial_match",
        "PMP_Zca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4, cp_cret_napot}",
      ]

  # Each aligned memory instruction that accesses XLEN or fewer bits gives rise to
  # exactly one memory operation, unless specified otherwise.
  - name: rvwmo_aligned_memop
    coverpoint: ["PMP_Sm_cg/cp_partial_match"]

  # memory accesses affected by the misaligned atomicity granule PMA that lie within a
  # misaligned atomicity granule are not decomposed.
  - name: rvwmo_misaligned_in_atomic_pma
    coverpoint: ["PMP_Sm_cg/cp_misaligned_mag16"]

  # Certain regions’ privileges can be hardwired—for example, some regions might only
  # ever be visible in machine mode but in no lower-privilege layers.
  - name: pmp_mmode_only_regions
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # PMP violations are always trapped precisely at the processor.
  - name: pmp_violation_precise_trap
    # rd is checked after every AMO, and a later AMO's return value shows any write by a faulting one
    coverpoint: ["PMP_Zaamo_cg/cp_cfg_RW"]

  # store, store-conditional, and AMO instructions generate store/AMO exceptions.
  - name: mcause_exccode_st_sc_amo
    coverpoint:
      [
        "PMP_Zaamo_cg/{cp_cfg_RW, cp_partial_match, cp_misaligned_mag16}",
        "PMP_Zacas_cg/{cp_partial_match_d, cp_partial_match_q, cp_misaligned_mag16}",
        "PMP_Zalrsc_cg/{cp_cfg_RW, cp_partial_match}",
      ]

  # An aligned AMO gives rise to a single memory operation that is both a load operation
  # and a store operation simultaneously.
  - name: rvwmo_aligned_amo_memop
    coverpoint:
      [
        "PMP_Zaamo_cg/cp_partial_match",
        "PMP_Zacas_cg/{cp_partial_match_d, cp_partial_match_q}",
      ]

  # No insn:sc.w[] instruction shall retire unless it passes memory permission checks,
  - name: sc_retire_permission
    coverpoint: ["PMP_Zalrsc_cg/{cp_cfg_RW, cp_partial_match}"]

  # Note that load and load-reserved instructions generate load exceptions
  - name: mcause_exccode_ld_ldrsv
    coverpoint: ["PMP_Zalrsc_cg/{cp_cfg_RW, cp_partial_match}"]

  # The ext:zca[] extension allows 16-bit instructions to be freely intermixed with
  # 32-bit instructions, with the latter now able to start on any 16-bit boundary, i.e.,
  # IALIGN=16.
  - name: Zca_align16
    # Representative coverpoints; also cp_cret_{tor, na4}
    coverpoint:
      [
        "PMP_Zca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4, cp_cret_napot}",
      ]

  # mepc will point to the beginning of the instruction.
  - name: mepc_varlen_wr
    coverpoint:
      ["PMP_Zca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4}"]

  # If mtval is written with a nonzero value when an instruction access-fault, page-
  # fault, or hardware-error exception occurs on a hart with variable-length
  # instructions, then mtval will contain the virtual address of the portion of the
  # instruction that caused the fault
  - name: mtval_varlen_wr
    coverpoint:
      [
        "PMP_Zca_cg/{cp_misaligned_napot, cp_misaligned_tor, cp_misaligned_na4}",
        "TODO: instruction page fault on the second half of a 32-bit instruction that straddles a page",
      ]

  # The permissions required for a cache-block management instruction to access a PMP
  # region are defined in &lt;&lt;cmo&gt;&gt;; when such access is not permitted, the
  # instruction raises a store access-fault exception.
  - name: pmp_cbm_fault
    coverpoint: ["PMP_Zicbo_cg/{cp_cbo_clean, cp_cbo_flush, cp_cbo_inval}"]

  # A cache-block zero instruction is permitted to access the specified cache block
  # whenever a store instruction is permitted to access the corresponding physical
  # addresses and when the PMAs indicate that cache-block zero instructions are a
  # supported access type.
  - name: cbz_access
    coverpoint: ["PMP_Zicbo_cg/cp_cbo_zero"]

  # If access to the cache block is not permitted, a cache-block zero instruction raises
  # a store page-fault or store guest-page-fault exception if address translation does
  # not permit write access or raises a store access-fault exception otherwise.
  - name: cbz_unperm_fault
    coverpoint:
      [
        "PMP_Zicbo_cg/cp_cbo_zero",
        "PMP_SvZicbo_cg/{cp_PA_PMP_rw_unset_cbo_s,cp_PA_PMP_rw_unset_cbo_u}",
      ]

  # When a page-fault, guest-page-fault, or access-fault exception is taken, the
  # relevant *tval CSR is written with the faulting effective address (i.e. the value of
  # rs1).
  # rs1 is block aligned in these tests, so a DUT that reports the aligned address also passes.
  - name: fault_excep_csr
    # rs1 is always block-aligned here, so a DUT that reports the block address also passes
    coverpoint:
      [
        "PMP_Zicbo_cg/{cp_cbo_zero, cp_cbo_clean, cp_cbo_flush, cp_cbo_inval}",
        "PMP_SvZicbo_cg/{cp_PA_PMP_rw_unset_cbo_s,cp_PA_PMP_rw_unset_cbo_u}",
      ]

  # A cache-block management instruction is permitted to access the specified cache
  # block whenever a load instruction or store instruction is permitted to access the
  # corresponding physical addresses.
  - name: cbm_access
    coverpoint: ["PMP_Zicbo_cg/{cp_cbo_clean, cp_cbo_flush, cp_cbo_inval}"]

  # If access to the cache block is not permitted, a cache-block management instruction
  # raises a store page-fault or store guest-page-fault exception if address translation
  # does not permit any access or raises a store access-fault exception otherwise.
  - name: cbm_unperm_fault
    coverpoint:
      [
        "PMP_Zicbo_cg/{cp_cbo_clean, cp_cbo_flush, cp_cbo_inval}",
        "PMP_SvZicbo_cg/{cp_PA_PMP_rw_unset_cbo_s,cp_PA_PMP_rw_unset_cbo_u}",
      ]

  # If access to the cache block is not permitted, a cache-block prefetch instruction
  # does not raise any exceptions and shall not access any caches or memory.
  - name: cbp_unperm_noexcep
    coverpoint: ["PMP_Zicbo_cg/{cp_prefetch_i, cp_prefetch_r, cp_prefetch_w}"]

  # PMP checks are also applied to page-table accesses for virtual-address translation,
  # for which the effective privilege mode is S.
  # If the Svadu extension is implemented, the menvcfg.ADUE field is writable.
  # SvaduPMP sets ADUE=1 and removes PMP write permission from the page table, so the
  # hardware A/D update raises an access fault.
  - name: pmp_check_pagetable_access
    # Representative coverpoints; also pmp0_pte_{noread,nowrite,noexec}_u
    # Representative coverpoints; also the other PMP_Svadu_cg/{Abit,Dbit}_unset_pmpW_unset crosses
    coverpoint:
      [
        "PMP_Sv_cg/pmp0_pte_{noread,nowrite,noexec}_s",
        "PMP_SvZicbo_cg/{cp_PTE_PMP_rw_unset_cbo_s,cp_PTE_PMP_rw_unset_cbo_u}",
        "PMP_Svadu_cg/{Abit_unset_pmpW_unset_exec_s, Abit_unset_pmpW_unset_read_s, Abit_unset_pmpW_unset_write_u, Dbit_unset_pmpW_unset_write_s}",
      ]

  # PMP checks are also applied to page-table accesses for virtual-address translation,
  # for which the effective privilege mode is S.
  - name: pmp_with_paging
    # Representative coverpoints; also pmp0_pte_{noread,nowrite,noexec}_u
    coverpoint:
      [
        "PMP_Sv_cg/pmp0_pte_{noread,nowrite,noexec}_s",
        "PMP_SvZicbo_cg/{cp_PTE_PMP_rw_unset_cbo_s,cp_PTE_PMP_rw_unset_cbo_u}",
      ]

  # Implementations with virtual memory are permitted to perform address translations
  # speculatively and earlier than required by an explicit memory access, and are
  # permitted to cache them in address translation cache structures—including possibly
  # caching the identity mappings from effective address to physical address used in
  # Bare translation modes and M-mode. The PMP settings for the resulting physical
  # address may be checked (and possibly cached) at any point between the address
  # translation and the explicit memory access.
  - name: pmp_speculative_translations
    coverpoint:
      [
        "Not tested: when translations and PMP checks are cached is not observable",
      ]

  # when the PMP settings are modified, M-mode software must synchronize the PMP
  # settings with the virtual memory system and any PMP or address-translation caches.
  # This is accomplished by executing an SFENCE.VMA instruction with rs1=x0 and rs2=x0,
  # after the PMP CSRs are written.
  - name: pmp_sfence_required
    coverpoint:
      [
        "Not tested: the tests always execute SFENCE.VMA after writing the PMP CSRs",
      ]

  # When page-based virtual memory is enabled, mtval is written with the faulting
  # virtual address, even for physical-memory access-fault exceptions.
  - name: mtval_vaddr_not_paddr
    # The trap signature records the trap value CSR.
    # Representative coverpoints; also pmp0_PA_{noread,nowrite,noexec}_u
    coverpoint: ["PMP_Sv_cg/pmp0_PA_{noread,nowrite,noexec}_s"]

  # If the Svadu extension is implemented, the menvcfg.ADUE field is writable.
  # PMP checks are also applied to page-table accesses for virtual-address translation,
  # for which the effective privilege mode is S.
  # SvaduPMP sets ADUE=1 and removes PMP write permission from the page table, so the
  # hardware A/D update raises an access fault.
  - name: Svadu_hw_update_a_d_bits
    # Representative coverpoints; also the other PMP_Svadu_cg/{Abit,Dbit}_unset_pmpW_unset crosses
    coverpoint:
      [
        "PMP_Svadu_cg/{Abit_unset_pmpW_unset_exec_s, Abit_unset_pmpW_unset_read_s, Abit_unset_pmpW_unset_write_u, Dbit_unset_pmpW_unset_write_s}",
      ]
