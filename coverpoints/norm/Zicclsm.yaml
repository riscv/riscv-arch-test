# Mapping of normative rules to coverpoints for a test suite
#
# Zicclsm (Main Memory Misaligned Accesses) has a single normative rule. It is
# exercised by every suite that performs misaligned loads and stores to main
# memory and expects them to complete: the Misalign* suites (scalar integer,
# compressed, F/D floating point, and vector loads/stores at misaligned
# addresses), and the misaligned-load/store coverpoints of the exception suites,
# which check that no address-misaligned exception is raised. In UDB, Zicclsm
# requires MISALIGNED_LDST=true, which is the parameter those suites key on.
# The rule excludes AMOs, LR/SC and other Za* accesses, so ExceptionsZaamo,
# ExceptionsZalrsc and Zama16b are deliberately not listed.

normative_rule_definitions:
  # If the Zicclsm extension is implemented, then misaligned loads and stores to main memory
  # regions with both the coherence and cacheability PMAs must be supported.
  - name: zicclsm_misaligned_support
    coverpoint: [
        # Misalign: scalar integer loads and stores (lb/sb need no alignment and are not tested)
        "{Misalign_lh_cg,Misalign_lhu_cg,Misalign_lw_cg,Misalign_lwu_cg,Misalign_ld_cg,Misalign_sh_cg,Misalign_sw_cg,Misalign_sd_cg}/{cp_misalign}",
        # MisalignZca: compressed loads and stores
        "{MisalignZca_c_lw_cg,MisalignZca_c_lwsp_cg,MisalignZca_c_ld_cg,MisalignZca_c_ldsp_cg,MisalignZca_c_sw_cg,MisalignZca_c_swsp_cg,MisalignZca_c_sd_cg,MisalignZca_c_sdsp_cg}/{cp_misalign}",
        # MisalignF / MisalignD: floating-point loads and stores (no MisalignQ coverage exists yet)
        "{MisalignF_flw_cg,MisalignF_fsw_cg}/{cp_misalign}",
        "{MisalignD_fld_cg,MisalignD_fsd_cg}/{cp_misalign}",
        # MisalignV: whole-register vector loads and stores with a misaligned base
        "{MisalignV_vl1re16_v_cg,MisalignV_vl1re32_v_cg,MisalignV_vl1re64_v_cg,MisalignV_vl1re8_v_cg,MisalignV_vl2re16_v_cg,MisalignV_vl2re32_v_cg,MisalignV_vl2re64_v_cg,MisalignV_vl2re8_v_cg,MisalignV_vl4re16_v_cg,MisalignV_vl4re32_v_cg,MisalignV_vl4re64_v_cg,MisalignV_vl4re8_v_cg,MisalignV_vl8re16_v_cg,MisalignV_vl8re32_v_cg,MisalignV_vl8re64_v_cg,MisalignV_vl8re8_v_cg,MisalignV_vs1r_v_cg,MisalignV_vs2r_v_cg,MisalignV_vs4r_v_cg,MisalignV_vs8r_v_cg}/{cp_misalignv_ls_wholereg_misaligned}",
        # MisalignV: unit-stride, strided, indexed, fault-only-first, mask and segment
        # vector loads and stores with element-misaligned addresses
        "{MisalignV_vle16_v_cg,MisalignV_vle32_v_cg,MisalignV_vle64_v_cg,MisalignV_vle8_v_cg}/{cp_misalignv_ls_element_misaligned}",
        "{MisalignV_vse16_v_cg,MisalignV_vse32_v_cg,MisalignV_vse64_v_cg,MisalignV_vse8_v_cg}/{cp_misalignv_ls_element_misaligned}",
        "{MisalignV_vlm_v_cg}/{cp_misalignv_ls_element_misaligned}",
        "{MisalignV_vlse16_v_cg,MisalignV_vlse32_v_cg,MisalignV_vlse64_v_cg,MisalignV_vlse8_v_cg}/{cp_misalignv_ls_element_misaligned}",
        "{MisalignV_vsm_v_cg}/{cp_misalignv_ls_element_misaligned}",
        "{MisalignV_vsse16_v_cg,MisalignV_vsse32_v_cg,MisalignV_vsse64_v_cg,MisalignV_vsse8_v_cg}/{cp_misalignv_ls_element_misaligned}",
        "{MisalignV_vle16ff_v_cg,MisalignV_vle32ff_v_cg,MisalignV_vle64ff_v_cg,MisalignV_vle8ff_v_cg}/{cp_misalignv_ls_element_misaligned}",
