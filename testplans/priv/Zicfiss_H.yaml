# yaml-language-server: $schema=testplan.schema.json
suite: Zicfiss_H
source: https://docs.google.com/spreadsheets/d/1ED9ontJZP-Dg2MAF-4mkhqKFgpjf6Fp6yeXKuW61FOY/edit?gid=1673462063#gid=1673462063
notes: |
  The H group boots to HS-mode and runs its guests under two-stage translation.  The VS-stage tables are the ones the
  Zicfiss_U tests build for satp, with vsatp pointing at them, and the G-stage maps the test image to itself.  For
  VU-mode the test body and data are user pages; for VS-mode the image is one supervisor superpage.  menvcfg is
  written through T-SBI; henvcfg, senvcfg, hedeleg, hstatus and vsstatus are written from HS-mode.  hedeleg = 0, so
  traps from a guest are taken in HS-mode unless a test delegates them.
  A two-stage walk does not report which stage's leaf PTE it ended on, so each VS-stage or G-stage variation maps the
  shadow stack page again at its own guest virtual address, and the coverpoints identify the page by that address:
  ssp for SSPUSH and SSPOPCHK, rs1 for SSAMOSWAP, HLV/HSV and ordinary accesses.  A coverpoint whose name ends in
  _swap is the SSAMOSWAP half of the coverpoint without the suffix.
  The software-check exception's delegation through medeleg[18] and hedeleg[18] is a trap-delegation property, so it
  is with the other causes in Exceptions_Sm cp_medeleg_msu_softwarecheck, Exceptions_H cp_hedeleg_software_check and
  Exceptions_HSm cp_software_check_to_m, which raise it with a missing landing pad.  This suite covers the shadow stack
  fault code that such a trap reports in stval or vstval.
coverpoints:
  - name: |-
      cp_ssp_access
      cp_ssp_low_bits_ro_zero
      cp_sspush
      cp_sspopchk_match
      cp_sspopchk_mismatch
      cp_sspopchk_fault_priority
      cp_ssrdp
      cp_ssamoswap
      cp_ssamoswap_aqrl
      cp_ssamoswap_reg_edges
      cp_ss_address_alignment_ssp
      cp_ss_address_alignment_pop
      cp_ss_address_alignment_swap
      cp_ss_page_crossing
      cp_ss_page_access_store
      cp_ss_page_access_load
      cp_ss_page_access_amo
      cp_ss_page_access_cbo
      cp_ss_page_access_cboz
      cp_ss_page_access_lrsc
      cp_ss_page_access_amocas
      cp_ss_page_fetch
      cp_ss_page_access_store_misaligned
    goal: Re-run the Zicfiss_U instruction and page-access coverpoints in VS-mode and VU-mode
    description: |-
      The coverpoints of the Zicfiss_U sheet with these names, executed in VS-mode and in VU-mode with menvcfg.SSE, henvcfg.SSE and senvcfg.SSE set.  The shadow stack page is a VS-stage xwr=010 page, a user page for VU-mode, over a G-stage read-write user page.
      vsstatus.MXR takes the place of sstatus.MXR.  The CBOs run with henvcfg.CBIE, CBCFE and CBZE set as well as the menvcfg and senvcfg fields.
    expectation: |-
      As on the Zicfiss_U sheet, with the traps taken in HS-mode.  A fetch from the shadow stack page raises an instruction access fault (1), and a CBO on it a store/AMO access fault (7), as the implicit-access and cache-block rules require at any level.
    bins: priv_mode {VS, VU} x (the bins of each re-run coverpoint, with the shadow stack page identified by its guest virtual address)
  - name: |-
      cp_ssp_csr_gating_vs
      cp_ssp_csr_gating_vu
      cp_ssamoswap_sse_gating_vs
      cp_ssamoswap_sse_gating_vu
    goal: Verify ssp CSR access and SSAMOSWAP from VS-mode and VU-mode under every reachable SSE state
    description: |-
      With ssp set from HS-mode while it is accessible, set {menvcfg.SSE, henvcfg.SSE, senvcfg.SSE} to 0xx, 100, 101, 110 and 111, enter VS-mode or VU-mode, and execute SSAMOSWAP.W, SSAMOSWAP.D (RV64) and every ssp CSR instruction (csrrw, csrrs, csrrc and the immediate forms).  Each records rd.
    expectation: |-
      menvcfg.SSE=0: illegal-instruction exception, even at V=1.
      VS-mode with henvcfg.SSE=0, and VU-mode with henvcfg.SSE=0 or senvcfg.SSE=0: virtual-instruction exception.  senvcfg.SSE reads 0 at V=1 while henvcfg.SSE=0, so VU-mode cannot be enabled by senvcfg.SSE alone.
      Otherwise the access is allowed and the swap completes.
    bins: priv_mode {VS, VU} x op {ssp CSR ops, SSAMOSWAP.W/D} x {menvcfg.SSE, senvcfg.SSE, henvcfg.SSE} {000, 100, 101, 110, 111}
    rules:
      - Zicfiss_ssp_csr
      - Zicfiss_m_menvcfg_sse
      - Zicfiss_vs_henvcfg_sse
      - Zicfiss_vu_senvcfg_sse
      - Zicfiss_sse_access
      - henvcfg_sse_op
      - senvcfg_sse_Zicfiss
  - name: cp_ss_enable_chain_cross
    goal: Verify which SSE bits each mode consults, for every SS instruction
    description: |-
      For each of the five reachable SSE states above, execute every SS instruction (SSPUSH x1/x5, C.SSPUSH x1, SSPOPCHK x1/x5, C.SSPOPCHK x5, SSRDP, SSAMOSWAP.W/D) from HS-mode, VS-mode and VU-mode.  HS-mode runs with satp translating, because an SS instruction faults while satp.MODE is Bare.  The link registers are zero, so while the instructions are active each pop matches what the pushes stored.
    expectation: |-
      HS-mode consults menvcfg.SSE alone: henvcfg.SSE and senvcfg.SSE make no difference.
      VS-mode consults menvcfg.SSE and henvcfg.SSE: senvcfg.SSE makes no difference.
      VU-mode consults menvcfg.SSE, henvcfg.SSE and senvcfg.SSE.
      While active the instructions execute; while inactive the MOP-encoded ones are no-ops (SSRDP writes 0) and SSAMOSWAP traps as in cp_ssamoswap_sse_gating_vs/vu.
    bins: priv_mode {HS, VS, VU} x instr {SSPUSH x1/x5, C.SSPUSH x1, SSPOPCHK x1/x5, C.SSPOPCHK x5, SSRDP, SSAMOSWAP.W/D} x {menvcfg.SSE, senvcfg.SSE, henvcfg.SSE} {000, 100, 101, 110, 111}
    rules:
      - henvcfg_sse_op
      - senvcfg_sse_Zicfiss
      - menvcfg_sse_op_list
  - name: cp_envcfg_sse_rdonly0_virt
    goal: Verify that henvcfg.SSE=0 makes senvcfg.SSE read-only zero at V=1
    description: With menvcfg.SSE=1, and henvcfg.SSE=0 and then 1 as the positive control, VS-mode sets and clears senvcfg.SSE with csrrs and csrrc and reads senvcfg back after each.
    expectation: |-
      henvcfg.SSE=0: senvcfg.SSE reads 0 after every write.  No exception -- the write is discarded.
      henvcfg.SSE=1: senvcfg.SSE reads back what was written.
      Together with cp_senvcfg_sse_rdonly0_s (Zicfiss_S), cp_envcfg_sse_rdonly0_{senvcfg, henvcfg} (Zicfiss_Sm) and cp_henvcfg_sse_rdonly0_hs this closes the menvcfg -> henvcfg -> senvcfg chain.
    bins: henvcfg.SSE {0, 1} x csr_op {csrrs, csrrc} of senvcfg.SSE, from VS-mode
    rules:
      - henvcfg_sse_op
  - name: cp_henvcfg_sse_rdonly0_hs
    goal: Verify henvcfg.SSE reads back 0 from HS-mode whenever menvcfg.SSE is 0
    description: |-
      Through T-SBI, clear menvcfg.SSE.  From HS-mode, set henvcfg.SSE with csrrs and clear it with csrrc, reading henvcfg back after each write.
      Repeat the same sequence with menvcfg.SSE=1 as the positive control.
      This is the HS-mode counterpart of cp_envcfg_sse_rdonly0_henvcfg on the Zicfiss_Sm sheet, which drives the same field from M-mode, so a configuration without Sm, such as RVA23, still checks this half of the rule.
    expectation: |-
      menvcfg.SSE=0: henvcfg.SSE reads back 0 after every write. No exception is raised -- SSE is a WARL field, so the write is discarded rather than rejected.
      menvcfg.SSE=1: henvcfg.SSE is writable and reads back what was written.
    bins: menvcfg.SSE {0,1} x csr_op {csrrs, csrrc} of henvcfg.SSE
  - name: cp_ssp_shared
    goal: Verify that there is one ssp CSR, which V does not switch
    description: HS-mode writes ssp and the guest reads it, then the guest writes ssp and HS-mode reads it, for VS-mode and for VU-mode.
    expectation: Each read returns the value the other mode wrote.  The hypervisor extension adds no VS copy of ssp.
    bins: priv_mode {HS, VS, VU} x op {csrr, csrw} of ssp
    rules:
      - Zicfiss_ssp_csr
  - name: cp_ss_page_enc_virt
    goal: Verify the VS-stage pte.xwr=010 encoding is an SS page only while menvcfg.SSE and henvcfg.SSE are both 1
    description: |-
      With the shadow stack page a VS-stage xwr=010 page, and {menvcfg.SSE, henvcfg.SSE} = 00, 10 and 11, execute an ordinary load (LW, LD on RV64), store (SW) and fetch (JALR to the page) from VS-mode and VU-mode.
      SS instructions cannot show the encoding: whenever it is reserved, Zicfiss is inactive in the mode and they are no-ops.
    expectation: |-
      Reserved (menvcfg.SSE=0 or henvcfg.SSE=0): the load, store and fetch raise the page fault of their type (13, 15, 12).
      SS page: the load reads the page, the store raises a store/AMO access fault (7) and the fetch an instruction access fault (1).
      senvcfg.SSE does not change the encoding.
    bins: priv_mode {VS, VU} x access {LW, LD, SW, JALR} x {menvcfg.SSE, henvcfg.SSE} {00, 10, 11}
    rules:
      - ssmp_henvcfg_sse
      - ssmp_menvcfg_sse
      - ssmp_ss_load
      - ssmp_ss_page_access_fault
      - ssmp_ss_implicit_access_fault
  - name: cp_ss_sse_change_no_fence
    goal: Verify that a change of henvcfg.SSE takes effect without an address-translation fence
    description: |-
      From VS-mode, load from a VS-stage SS page, so that its walk may be cached.  Through T-SBI, HS-mode clears henvcfg.SSE and returns without any HFENCE, and VS-mode loads from the same address again; then henvcfg.SSE is set the same way and the load repeated.
    expectation: |-
      The privileged specification states that changes to xSSE take effect immediately, with no SFENCE.VMA, HFENCE.GVMA or HFENCE.VVMA needed.  The second load raises a load page fault (13), because the encoding is now reserved, and the third reads the page again.
    bins: VS-mode x LW x henvcfg.SSE {1, 0}
    rules:
      - henvcfg_sse_op
  - name: |-
      cp_ss_instr_target_page
      cp_ss_instr_target_page_swap
      cp_ss_page_ad_bits
      cp_ss_page_ad_bits_swap
    goal: Verify SS instructions against VS-stage pages of every pte.xwr encoding and every A/D pair
    description: |-
      Aliases of the shadow stack page carry each of the eight VS-stage pte.xwr encodings, and each A/D combination of the SS encoding.  Execute every push and pop form and SSAMOSWAP against each, from VS-mode and VU-mode.
    expectation: |-
      As cp_ss_instr_target_page and cp_ss_page_ad_bits on the Zicfiss_U sheet, at the VS-stage: an SS page is accessed; a read-only page raises a store/AMO page fault (15); any other valid page a store/AMO access fault (7); the reserved encodings (non-leaf at the last level, xwr=110) page faults.  A=0, or D=0 for the writing instructions, either has hardware set the bit or raises a store/AMO page fault, by henvcfg.ADUE.
    bins: priv_mode {VS, VU} x instr {push/pop forms} x VS-stage pte.xwr {000..111}, and the SSAMOSWAP forms; likewise x {A, D} {00, 01, 10, 11}
    rules:
      - ssmp_ss_page_illegal_access
      - ssmp_ss_read_only_page
      - ss_fault_exception_code
  - name: |-
      cp_ss_page_perm_priority
      cp_ss_page_perm_priority_swap
      cp_ss_page_perm_priority_load
      cp_ss_page_perm_priority_store
    goal: Verify that pte.U, vsstatus.SUM and vsstatus.MXR apply to shadow stack accesses as to any other
    description: |-
      For each of vsstatus.SUM and vsstatus.MXR, execute the SS instructions, LW and SW against the shadow stack page with the pte.U the mode needs, and against an alias with pte.U flipped: a user page from VS-mode, a supervisor page from VU-mode.
    expectation: |-
      The U and SUM checks are performed normally: a VU-mode access to a supervisor page, and a VS-mode access to a user page while vsstatus.SUM=0, raise the page fault of the access type (15 for SS instructions and stores, 13 for loads).  A VS-mode access to a user page with vsstatus.SUM=1 follows the shadow stack rules.
      vsstatus.MXR has no effect: an SS page is readable by every load, and an SS instruction needs no read permission.
    bins: priv_mode {VS, VU} x access {SS instructions, LW, SW} x pte.U {own, flipped} x vsstatus.SUM {0,1} x vsstatus.MXR {0,1}
    rules:
      - ssmp_ss_load
      - ssmp_ss_page_access_fault
  - name: |-
      cp_ss_g_stage
      cp_ss_g_stage_swap
      cp_ss_gpf_tval
      cp_ss_gpf_tval_swap
    goal: Verify the G-stage permissions SS instructions need, and the guest-page fault they report
    description: |-
      VS-stage SS pages lie over G-stage leaves that are read-write, read-only, execute-only, read-write without U, invalid, and xwr=010.  Execute every push and pop form and SSAMOSWAP against each from VS-mode and VU-mode.
      Repeat at a guest virtual address whose VS-stage leaf table is at a guest physical address the G-stage does not map, so the walk's own table read faults.
    expectation: |-
      Only the read-write user G-stage leaf is accessed.  Every other leaf, xwr=010 included, raises a store/AMO guest-page fault (23), even for the pops, which only read.  The trap reports the guest virtual address in stval, GVA=1, htval the guest physical address >> 2 (or 0 where allowed), and htinst 0.
      The table-read fault is also a store/AMO guest-page fault, with htinst 0 or the pseudoinstruction for an implicit VS-stage table read.
    bins: priv_mode {VS, VU} x instr {push/pop forms, SSAMOSWAP.W/D} x G-stage leaf {rw, r, x, rw without U, invalid, xwr=010}; and x fault {explicit, VS-stage table read}
    rules:
      - active_g_stage_pte
      - ss_fault_exception_code
      - H_guest_page_fault
      - htval_trapval
      - hstatus_gva_op
      - H_trap_xtinst_zero_ok
      - H_trap_xtinst_guestpage
  - name: cp_ss_g_stage_page_enc
    goal: Verify pte.xwr=010 stays reserved in the G-stage for every access type and SSE setting
    description: |-
      A VS-stage read-write-execute page lies over a G-stage leaf with xwr=010.  Execute LW, LD (RV64), SW and a fetch (JALR) to it from VS-mode and VU-mode, with henvcfg.SSE=1 and with henvcfg.SSE=0.  The SS instructions on that leaf are in cp_ss_g_stage.
    expectation: The G-stage encoding is reserved whatever menvcfg.SSE and henvcfg.SSE are, so each access raises the guest-page fault of its type -- load (21), store/AMO (23) and instruction (20).
    bins: priv_mode {VS, VU} x access {LW, LD, SW, JALR} x henvcfg.SSE {0, 1}
    rules:
      - active_g_stage_pte
      - H_vm_gstagetrans
      - H_guest_page_fault
  - name: cp_ss_vsatp_bare
    goal: Verify SS instructions raise a store/AMO access fault while vsatp.MODE is Bare
    description: With vsatp.MODE=Bare, and hgatp translating and then Bare, execute every SS memory instruction from VS-mode and VU-mode, with ssp and the swap address at the shadow stack page's guest physical address.
    expectation: Store/AMO access fault (7), with no guest-page fault; ssp and rd unchanged.
    bins: priv_mode {VS, VU} x instr {SSPUSH x1/x5, C.SSPUSH x1, SSPOPCHK x1/x5, C.SSPOPCHK x5, SSAMOSWAP.W/D} x hgatp.MODE {Bare, Sv39x4/Sv32x4}
    rules:
      - satp_mode_bare
      - ss_fault_exception_code
  - name: |-
      cp_ss_non_idempotent_virt
      cp_ss_non_idempotent_virt_swap
      cp_ss_non_idempotent_virt_vu
      cp_ss_non_idempotent_virt_pbmte
    goal: Verify SS instructions fault on memory that two-stage Svpbmt makes non-idempotent
    description: |-
      Requires Svpbmt (RV64).  Nine aliases put each VS-stage PBMT {PMA, NC, IO} of an SS page over each G-stage PBMT {PMA, NC, IO}.
      With menvcfg.PBMTE=1 and henvcfg.PBMTE=1, execute every push and pop form from VS-mode against each, and SSAMOSWAP where the final type is not NC, for the reason given in cp_ss_non_idempotent on the Zicfiss_U sheet; VU-mode executes the push forms.
      Then SSPUSH x1 against each from VS-mode with henvcfg.PBMTE=0, and with menvcfg.PBMTE=0 as well.
    expectation: |-
      The final memory type is the VS-stage PBMT if nonzero, else the G-stage PBMT if nonzero, else the PMA.  Where it is IO the memory is non-idempotent and the instruction raises a store/AMO access fault (7); NC and PMA memory is accessed.  In particular a VS-stage NC page over a G-stage IO page is idempotent.
      henvcfg.PBMTE=0: a nonzero VS-stage PBMT is reserved, a store/AMO page fault (15).  menvcfg.PBMTE=0: a nonzero G-stage PBMT is reserved too, a store/AMO guest-page fault (23).
    bins: VS-mode x {push/pop forms} x VS-stage PBMT {PMA, NC, IO} x G-stage PBMT {PMA, NC, IO}, SSAMOSWAP on the non-NC results, VU-mode pushes, and SSPUSH x1 x {menvcfg.PBMTE, henvcfg.PBMTE} {11, 10, 00}
    rules:
      - ssmp_ss_idempotent_memory
      - Svpbmt_hgatp_stage_override_rule
      - Svpbmt_vsatp_stage_override_rule
  - name: |-
      cp_ss_hlv_hsv_load
      cp_ss_hlv_hsv_store
      cp_ss_hlv_hsv_u_load
      cp_ss_hlv_hsv_u_store
      cp_ss_hlv_hsv_hu0_load
      cp_ss_hlv_hsv_hu0_store
    goal: Verify HLV, HLVX and HSV against a VS-stage shadow stack page
    description: |-
      From HS-mode, with hstatus.SPVP=1 and then 0 (the page a supervisor page, then a user page) and henvcfg.SSE=1 and then 0, execute HLV.B/BU/H/HU/W, HLV.WU and HLV.D (RV64), HLVX.HU, HLVX.WU and HSV.B/H/W, HSV.D (RV64) against the page.
      From U-mode with hstatus.HU=1, repeat with henvcfg.SSE=1 and 0; and with hstatus.HU=0, execute them once more.
    expectation: |-
      henvcfg.SSE=1: HLV reads the page, which any load may.  HLVX needs execute permission in place of read permission, and an SS page is not executable, so it raises a load page fault (13).  HSV raises a store/AMO access fault (7): only SS instructions may write an SS page.
      henvcfg.SSE=0: the encoding is reserved at the VS-stage, so HLV and HLVX raise load page faults (13) and HSV a store/AMO page fault (15).
      From U-mode with hstatus.HU=1 the accesses are VU-level, as from HS-mode with SPVP=0.  With hstatus.HU=0 they raise illegal-instruction exceptions; V=0, so the exception is not a virtual-instruction one.
    bins: priv_mode {HS} x {HLV, HLVX, HSV forms} x hstatus.SPVP {0,1} x henvcfg.SSE {0,1}; U-mode x forms x hstatus.HU=1 x henvcfg.SSE {0,1}; U-mode x forms x hstatus.HU=0
    rules:
      - hlsv_op
      - hlsv_u_op
      - hlsv_priv
      - hlsv_illegalinst
      - ssmp_ss_load
      - ssmp_ss_page_access_fault
      - ssmp_henvcfg_sse
  - name: |-
      cp_sspopchk_mismatch_virt
      cp_sspopchk_mismatch_vs
    goal: Verify the software-check exception of a mismatching SSPOPCHK in a guest, and the code it reports
    description: From VS-mode and VU-mode, push a value and pop with a different one in the link register, for each pop form, with hedeleg[18]=0 and then 1.
    expectation: |-
      A software-check exception (18): in HS-mode with hedeleg[18]=0, where stval holds the shadow stack fault code (3); in VS-mode with hedeleg[18]=1, where vscause=18 and vstval holds the code, or 0, by REPORT_CAUSE_IN_VSTVAL_ON_SHADOW_STACK_SOFTWARE_CHECK.  ssp is unchanged.
    bins: priv_mode {VS, VU} x {SSPOPCHK x1/x5, C.SSPOPCHK x5} x hedeleg[18] {0, 1}, and vscause x vstval when delegated
    rules:
      - sspop_exception
      - mtval_swchk_list
      - hedeleg_op
  - name: |-
      cp_ss_fault_delegation
      cp_ss_fault_delegation_vs
    goal: Verify SS instructions' access and page faults reach VS-mode through hedeleg as store/AMO faults
    description: From VS-mode and VU-mode, execute the push forms against a read-only page and a read-write page, with hedeleg[15] and hedeleg[7] clear and then set.
    expectation: The read-only page raises a store/AMO page fault (15) and the read-write page a store/AMO access fault (7), taken in HS-mode or, when delegated, in VS-mode with the same vscause.
    bins: priv_mode {VS, VU} x push forms x page {read-only, read-write} x hedeleg[15,7] {00, 11}, and vscause {7, 15} when delegated
    rules:
      - ss_fault_exception_code
      - hedeleg_op
  - goal: "Software-check delegation through medeleg[18] and hedeleg[18], swept across HS, VS and VU, is a trap-delegation property: Exceptions_H cp_hedeleg_software_check (medeleg[18] = 1) and Exceptions_HSm cp_software_check_to_m (medeleg = 0) cover it with the other exception causes, and Exceptions_Sm cp_medeleg_msu_softwarecheck covers medeleg[18] from M, S and U."
    description: Be sure software check extension is delegated appropriately with hedeleg as well as medeleg.
