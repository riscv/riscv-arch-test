# yaml-language-server: $schema=testplan.schema.json
suite: PMPZaamo
source: https://docs.google.com/spreadsheets/d/1VuBt-H9VVWh8k-USAJEplrgEJETjQ-iNjD4Iq_ZOnN0/edit?gid=343093009#gid=343093009
notes: |-
  General Test Environment (PMPZaamo):
  - Runs when Zaamo and Sm are implemented and NUM_PMP_ENTRIES > 0. M-mode only.
  - AMOs = amoswap, amoadd, amoxor, amoand, amoor, amomin, amomax, amominu, amomaxu (.w; also .d on RV64).
  - rd is checked after every AMO, and a later AMO's return value shows whether a faulting AMO wrote memory.
  - Standard region and L=1 XWR walk as in PMPSm cp_cfg_X/R/W.
coverpoints:
  - name: cp_cfg_RW
    goal: Verify that an AMO needs both R and W, and otherwise raises a store/AMO access fault without side effects.
    description: Six legal XWR with L=1, one entry each. Every AMO with rs1 at the start of the region.
    expectation: "XWR = 011 or 111: the AMO completes. Otherwise: store/AMO access fault (mcause = 7); rd and memory are unchanged."
    bins: 6 XWR × 9 AMOs = 54 (108 on RV64)
    rules:
      - pmp_store_fault
      - mcause_exccode_st_sc_amo
      - pmp_violation_precise_trap
      - pmp_cfg_permissions
      - pmp_rwx_check
      - pmp_l_bit_m_mode_enforcement
  - name: cp_partial_match
    goal: Verify that an aligned AMO fails when the deciding entry matches only part of it.
    description: RV64, G = 0, as in PMPSm cp_partial_match. Every .d AMO on the doubleword from M-mode.
    expectation: "Store/AMO access fault in every case, including L=0 from M-mode: an aligned AMO is one memory operation."
    bins: 2 modes × 2 L × 3 placements × 9 AMOs = 108
    rules:
      - pmp_full_match_required
      - rvwmo_aligned_amo_memop
      - mcause_exccode_st_sc_amo
      - pmp_entry_priority
  - name: cp_misaligned_mag16
    goal: Verify that a misaligned AMO inside a 16-byte granule fails when the deciding entry matches only part of it.
    description: Zama16b, as in PMPSm cp_misaligned_mag16. Every .w AMO 2 bytes, and every .d AMO on RV64 4 bytes, below the middle of the granule.
    expectation: "Store/AMO access fault: the AMO is a single memory operation."
    bins: 3 placements × 2 L × 9 AMOs (18 on RV64)
    rules:
      - pmp_full_match_required
      - pmp_misaligned_access_behavior
      - pma_mag_op_within
      - pma_mag_insts
      - mcause_exccode_st_sc_amo
