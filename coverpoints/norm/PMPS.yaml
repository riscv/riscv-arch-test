# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # PMP checks are applied to all accesses whose effective privilege mode is S or U,
  # including instruction fetches and data accesses in S and U mode, and data accesses
  # in M-mode when the MPRV bit in mstatus is set and the MPP field in mstatus contains
  # S or U.
  - name: pmp_check_priv_modes
    # Representative coverpoints; also cp_cfg_A_off_{lw, sw}, cp_cfg_A_napot_{jalr, lw, sw},
    # cp_cfg_A_na4_{jalr, lw, sw}, cp_cfg_A_tor_{jalr, lw, sw}, cp_mprv_{jalr, lw, sw}, cp_none_{jalr, lw, sw}
    coverpoint: ["PMPS_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_A_off_jalr}"]

  # PMP CSRs are only accessible to M-mode.
  - name: pmp_csr_mode
    coverpoint: ["PMPS_cg/{cp_pmpaddr_access_s, cp_pmpcfg_access_s}"]

  # The PMP address registers are CSRs named pmpaddr0-pmpaddr63.
  - name: pmp_addr_registers
    coverpoint: ["PMPS_cg/cp_pmpaddr_access_s"]

  # &lt;&lt;pmpcfg&gt;&gt; shows the layout of a PMP configuration register. The R, W,
  # and X bits, when set, indicate that the PMP entry permits read, write, and
  # instruction execution, respectively. When one of these bits is clear, the
  # corresponding access type is denied.
  - name: pmp_cfg_permissions
    coverpoint: ["PMPS_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W}"]

  # Attempting to fetch an instruction from a PMP region that does not have execute
  # permissions raises an instruction access-fault exception.
  - name: pmp_exec_fault
    # Representative coverpoints; also cp_cfg_A_tor_jalr
    coverpoint:
      [
        "PMPS_cg/{cp_cfg_X, cp_cfg_A_napot_jalr, cp_cfg_A_na4_jalr, cp_mprv_jalr}",
      ]

  # Attempting to execute a load or load-reserved instruction that accesses a physical
  # address within a PMP region without read permissions raises a load access-fault
  # exception.
  - name: pmp_load_fault
    # Representative coverpoints; also cp_cfg_A_tor_lw
    coverpoint:
      ["PMPS_cg/{cp_cfg_R, cp_cfg_A_napot_lw, cp_cfg_A_na4_lw, cp_mprv_lw}"]

  # Attempting to execute a store, store-conditional, AMO, or cache-block zero
  # instruction that accesses a physical address within a PMP region without write
  # permissions raises a store access-fault exception.
  - name: pmp_store_fault
    # Representative coverpoints; also cp_cfg_A_tor_sw
    coverpoint:
      ["PMPS_cg/{cp_cfg_W, cp_cfg_A_napot_sw, cp_cfg_A_na4_sw, cp_mprv_sw}"]

  # When A=0, this PMP entry is disabled and matches no addresses.
  - name: pmp_a_field_off
    coverpoint:
      ["PMPS_cg/{cp_cfg_A_off_jalr, cp_cfg_A_off_lw, cp_cfg_A_off_sw}"]

  # naturally aligned power-of-2 regions (NAPOT), including the special case of
  # naturally aligned four-byte regions (NA4);
  - name: pmp_a_field_napot_na4
    # Representative coverpoints; also cp_cfg_A_na4_{lw, sw}
    coverpoint:
      [
        "PMPS_cg/{cp_cfg_A_napot_jalr, cp_cfg_A_napot_lw, cp_cfg_A_napot_sw, cp_cfg_A_na4_jalr}",
      ]

  # NAPOT ranges make use of the low-order bits of the associated address register to
  # encode the size of the range, as shown in &lt;&lt;pmpcfg-napot&gt;&gt;.
  - name: pmp_napot_encoding_low_bits
    coverpoint:
      ["PMPS_cg/{cp_cfg_A_napot_jalr, cp_cfg_A_napot_lw, cp_cfg_A_napot_sw}"]

  # If TOR is selected, the associated address register forms the top of the address
  # range, and the preceding PMP address register forms the bottom of the address range.
  # If PMP entry i's A field is set to TOR, the entry matches any address y such that
  # pmpaddr~i-1~≤y&lt;pmpaddr~i~ (irrespective of the value of pmpcfg~i-1~). If PMP
  # entry 0's A field is set to TOR, zero is used for the lower bound, and so it matches
  # any address y&lt;pmpaddr~0~.
  - name: pmp_a_field_tor
    # Representative coverpoints; also cp_none_{lw, sw}
    coverpoint:
      [
        "PMPS_cg/{cp_cfg_A_tor_jalr, cp_cfg_A_tor_lw, cp_cfg_A_tor_sw, cp_none_jalr}",
      ]

  # In addition to locking the PMP entry, the L bit indicates whether the R/W/X
  # permissions are additionally enforced on M-mode accesses. When the L bit is set,
  # these permissions are enforced for all privilege modes. When the L bit is clear, any
  # M-mode access matching the PMP entry will succeed; the R/W/X permissions apply only
  # to S and U modes.
  - name: pmp_l_bit_m_mode_enforcement
    # Representative coverpoints; also cp_mprv_{lw, sw}
    coverpoint: ["PMPS_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_mprv_jalr}"]

  # On some implementations, misaligned loads, stores, and instruction fetches may be
  # decomposed into multiple memory operations, some of which may succeed before an
  # access-fault exception occurs, as described in the RVWMO specification. PMP checking
  # is performed on each memory operation independently.
  - name: pmp_misaligned_access_behavior
    coverpoint:
      [
        "TODO: cp_misaligned_partial: misaligned load/store from S-mode partly in a region, rest unmatched (MISALIGNED_LDST)",
      ]

  # The matching PMP entry must match all bytes of a memory operation, or the operation
  # fails, irrespective of the L, R, W, and X bits.
  - name: pmp_full_match_required
    coverpoint:
      [
        "TODO: cp_misaligned_partial: misaligned load/store from S-mode partly in a region, rest unmatched (MISALIGNED_LDST)",
      ]

  # If a PMP entry matches all bytes of a memory operation, then the L, R, W, and X bits
  # determine whether the operation succeeds or fails. If the L bit is clear and the
  # privilege mode of the access is M, the operation succeeds. Otherwise, if the L bit
  # is set or the privilege mode of the access is S or U, then the operation succeeds
  # only if the R, W, or X bit corresponding to the access type is set.
  - name: pmp_rwx_check
    # Representative coverpoints; also cp_cfg_A_napot_{lw, sw}, cp_cfg_A_na4_{jalr, lw, sw},
    # cp_cfg_A_tor_{jalr, lw, sw}, cp_mprv_{jalr, lw, sw}
    coverpoint: ["PMPS_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_cfg_A_napot_jalr}"]

  # If no PMP entry matches an M-mode memory operation, the operation succeeds. If no
  # PMP entry matches an S-mode or U-mode memory operation, the operation fails if at
  # least one PMP entry is implemented and succeeds otherwise.
  - name: pmp_no_entry_match
    coverpoint: ["PMPS_cg/{cp_none_jalr, cp_none_lw, cp_none_sw}"]

  # Failed memory operations generate an instruction, load, or store access-fault
  # exception.
  - name: pmp_access_fault_exception
    # Representative coverpoints; also cp_none_{lw, sw}
    coverpoint: ["PMPS_cg/{cp_cfg_X, cp_cfg_R, cp_cfg_W, cp_none_jalr}"]

  # If mtval is written with a nonzero value when a misaligned load or store causes an
  # access-fault, page-fault, or hardware-error exception, then mtval will contain the
  # virtual address of the portion of the access that caused the fault.
  - name: mtval_vaddr_wr_misaligned_addr
    coverpoint:
      [
        "TODO: cp_misaligned_partial: misaligned load/store from S-mode partly in a region, rest unmatched (MISALIGNED_LDST)",
      ]
