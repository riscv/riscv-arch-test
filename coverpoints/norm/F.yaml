# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # The F extension adds computational instructions compliant with the IEEE 754-2008 arithmetic
  # standard's binary32 format and operations.
  - name: F_ieee_compliance
    coverpoint:
      [
        "TODO: full IEEE 754-2008 binary32 compliance needs IBM FP coverpoints; F edge crosses give partial coverage",
      ]
  # The F extension depends on the Zicsr extension.
  - name: F_depends_Zicsr
    coverpoint: ["Definition, checked through UDB"]
  # FLEN can be 32, 64, or 128 depending on which of the F, D, and Q extensions are
  # supported.
  - name: flen_def
    coverpoint: ["Definition, checked through UDB"]
  # These extensions, intended for lower-cost systems, are incompatible with the F and D
  # extensions.
  - name: Zfinx_Zdinx_incompatible_F_D
    coverpoint: ["Definition, checked through UDB"]
  # insn:fadd.s[] and insn:fmul.s[] perform single-precision floating-point addition and
  # multiplication respectively, between rs1 and rs2
  - name: fadd-s_fmul-s_op
    coverpoint:
      [
        "F_fadd_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm} TODO: Use IBM coverpoints on all FP tests regarding detecting tininess after rounding",
        "F_fmul_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
      ]
  # In each case, the result is written to rd.
  - name: fp_rd
    coverpoint:
      [
        "F_fadd_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm} TODO: Use IBM coverpoints on all FP tests regarding detecting tininess after rounding",
        "F_fdiv_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_vdoun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
        "F_fmul_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
        "F_fsqrt_s_cg/{cp_fs1, cp_fd, cp_fs1_edges, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fsub_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm}",
      ]
  # The 2-bit floating-point format field fmt is encoded as shown in . It is set to S (00)
  # for all instructions in the ext:f[] extension.
  - name: F_fmt_single
    coverpoint:
      [
        "F_fadd_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm} TODO: Use IBM coverpoints on all FP tests regarding detecting tininess after rounding",
        "F_fcvt_l_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_lu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_s_l_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_lu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_w_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_wu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_w_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_wu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fdiv_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_vdoun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
        "F_fmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fmul_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
        "F_fnmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fnmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fsgnj_s_cg/{cp_fs1, cp_fs2, cp_fd, cr_fs1_fs2_edges}",
        "F_fsgnjn_s_cg/{cp_fs1, cp_fs2, cp_fd, cr_fs1_fs2_edges}",
        "F_fsgnjx_s_cg/{cp_fs1, cp_fs2, cp_fd, cr_fs1_fs2_edges}",
        "F_fsqrt_s_cg/{cp_fs1, cp_fd, cp_fs1_edges, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fsub_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm}",
      ]
  # Operations on subnormal numbers are handled in accordance with IEEE 754-2008.
  - name: ieee_std_subnormal
    coverpoint:
      [
        "F_fadd_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm} TODO: Use IBM coverpoints on all FP tests regarding detecting tininess after rounding",
        "F_fcvt_l_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_lu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_s_l_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_lu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_w_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_wu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_w_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_wu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fdiv_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_vdoun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
        "F_fmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fmul_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
        "F_fnmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fnmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fsqrt_s_cg/{cp_fs1, cp_fd, cp_fs1_edges, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fsub_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm}",
      ]
  # In the parlance of IEEE 754-2008, tininess is detected after rounding.
  - name: ieee_std_tininess
    coverpoint:
      [
        "F_fadd_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm} TODO: Use IBM coverpoints on all FP tests regarding detecting tininess after rounding",
        "F_fcvt_l_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_lu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_s_l_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_lu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_w_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_wu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_w_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_wu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fdiv_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_vdoun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
        "F_fmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fmul_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
        "F_fnmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fnmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fsqrt_s_cg/{cp_fs1, cp_fd, cp_fs1_edges, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fsub_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm}",
      ]
  # Rounding Mode|Mnemonic|Meaning === 000|RNE|Round to Nearest, ties to
  # Even¶001|RTZ|Round towards Zero¶010|RDN|Round Down (towards −∞)¶011|RUP|Round Up
  # (towards +∞)¶100|RMM|Round to Nearest, ties to Max Magnitude¶101||Reserved for future
  # use.¶110||Reserved for future use.¶111|DYN|In instruction&#8217;s rm field, selects
  # dynamic rounding mode; In Rounding Mode register, reserved. ===
  - name: dyn_round_enc
    coverpoint:
      [
        "F_fadd_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm} TODO: Use IBM coverpoints on all FP tests regarding detecting tininess after rounding",
        "F_fcvt_l_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_lu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_s_l_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_lu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_w_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_wu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_w_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_wu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fdiv_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_vdoun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
        "F_fmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fmul_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
        "F_fnmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fnmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fsqrt_s_cg/{cp_fs1, cp_fd, cp_fs1_edges, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fsub_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm}",
      ]
  # Floating-point operations use either a static rounding mode encoded in the
  # instruction, or a dynamic rounding mode held in frm. Rounding modes are encoded as
  # shown in &lt;&lt;norm:dyn_round_enc&gt;&gt;. A value of 111 in the instruction's rm
  # field selects the dynamic rounding mode held in frm
  - name: roundingmode_dynamic
    coverpoint:
      [
        "F_fadd_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm} TODO: Use IBM coverpoints on all FP tests regarding detecting tininess after rounding",
        "F_fcvt_l_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_lu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_s_l_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_lu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_w_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_wu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_w_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_wu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fdiv_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_vdoun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
        "F_fmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fmul_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
        "F_fnmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fnmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fsqrt_s_cg/{cp_fs1, cp_fd, cp_fs1_edges, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fsub_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm}",
      ]
  # Except when otherwise stated, if the result of a floating-point operation is NaN, it is the
  # canonical NaN.
  - name: canonical_nan
    # Representative coverpoints; also the NaN-producing edge coverpoints of the other F covergroups
    coverpoint:
      [
        "{F_fadd_s_cg, F_fdiv_s_cg}/cr_fs1_fs2_edges_frm",
        "F_fsqrt_s_cg/cp_fs1_edges",
        "F_fmin_s_cg/cr_fs1_fs2_edges",
      ]
  # For single-precision floating-point, the canonical NaN has a positive sign and all significand
  # bits clear except the MSB, the quiet bit. In other words, for single-precision floating-point, the
  # canonical NaN corresponds to the pattern 0x7fc00000.
  - name: F_canonical_nan
    # Representative coverpoints; also the NaN-producing edge coverpoints of the other F covergroups
    coverpoint:
      [
        "{F_fadd_s_cg, F_fdiv_s_cg}/cr_fs1_fs2_edges_frm",
        "F_fsqrt_s_cg/cp_fs1_edges",
        "F_fmin_s_cg/cr_fs1_fs2_edges",
      ]
  # All floating-point operations that perform rounding can select the rounding mode using the rm
  # field with the encoding shown in the dyn_round_enc table.
  - name: F_rm_field
    # Representative coverpoints; also the cp_frm_* and cr_*_frm coverpoints of the other F covergroups
    coverpoint:
      [
        "F_fadd_s_cg/cr_fs1_fs2_edges_frm",
        "F_fmadd_s_cg/cr_fs1_fs2_edges_frm4",
        "F_fsqrt_s_cg/cr_fs1_edges_frm",
        "F_fcvt_w_s_cg/cr_fs1_edges_frm",
      ]
  - name: fclass-s_op
    # The FCLASS.S instruction examines the value in floating-point register rs1 and writes to integer register rd a 10-bit mask that indicates the class of the floating-point number. The format of the mask is described in . The corresponding bit in rd will be set if the property is true and clear otherwise. All other bits in rd are cleared. Note that exactly one bit in rd will be set. FCLASS.S does not set the floating-point exception flags.
    coverpoint: ["F_fclass_s_cg/{cp_rd, cp_fs1, cp_fs1_edges, cp_fclass}"]
  # insn:fcvt.w.s[] or insn:fcvt.l.s[] converts a floating-point number in floating-point
  # register rs1 to a signed 32-bit or 64-bit integer, respectively, in integer register
  # rd
  - name: fcvt-l-s_fcvt-w-s_op
    coverpoint:
      [
        "F_fcvt_l_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_w_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
      ]
  # All floating-point to integer and integer to floating-point conversion instructions
  # round according to the rm field.
  - name: fcvt_round
    coverpoint:
      [
        "F_fcvt_l_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_lu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_s_l_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_lu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_w_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_wu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_w_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_wu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
      ]
  # insn:fcvt.l.s[], insn:fcvt.lu.s[], insn:fcvt.s.l[], and insn:fcvt.s.lu[] are RV64-only
  # instructions
  - name: fcvt_long_float_rv64_only
    coverpoint:
      [
        "F_fcvt_l_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_lu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_s_l_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_lu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
      ]
  # &lt;&lt;int_conv&gt;&gt; gives the range of valid inputs for insn:fcvt.w.s[],
  # insn:fcvt.wu.s[], insn:fcvt.l.s[], and insn:fcvt.lu.s[] and the behavior of these
  # instructions for invalid inputs
  - name: fcvt_int_float_valid_input
    coverpoint:
      [
        "F_fcvt_l_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_lu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_w_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_wu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
      ]
  # All floating-point conversion instructions set the Inexact exception flag if the
  # rounded result differs from the operand value and the Invalid exception flag is not
  # set.
  - name: fcvt_nx
    coverpoint:
      [
        "F_fcvt_l_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_lu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_s_l_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_lu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_w_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_wu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_w_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_wu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
      ]
  # If the rounded result is not representable in the destination format, it is clipped to
  # the nearest value and the invalid flag is set
  - name: fcvt_unrepresentable_nv
    coverpoint:
      [
        "F_fcvt_l_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_lu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_s_l_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_lu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_w_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_wu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_w_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_wu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
      ]
  # insn:fcvt.wu.s[], insn:fcvt.lu.s[], insn:fcvt.s.wu[], and insn:fcvt.s.lu[] variants
  # convert to or from unsigned integer values. For XLEN&gt;32, insn:fcvt.w.s[] and
  # insn:fcvt.wu.s[] sign-extend the 32-bit result to the destination register width
  - name: fcvt-wu-s_fcvt-lu-s_fcvt-s-wu_fcvt-s-lu_op
    coverpoint:
      [
        "F_fcvt_lu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
        "F_fcvt_s_lu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_wu_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_wu_s_cg/{cp_rd, cp_fs1, cr_fs1_edges_frm, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
      ]
  # insn:fcvt.s.w[] or insn:fcvt.s.l[] converts a 32-bit or 64-bit signed integer,
  # respectively, in integer register rs1 into a floating-point number in floating-point
  # register rd
  - name: fcvt-s-w_fcvt-s-l_op
    coverpoint:
      [
        "F_fcvt_s_l_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
        "F_fcvt_s_w_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_n, cp_csr_frm}",
      ]
  # insn:fdiv.s[] performs the single-precision floating-point division of rs1 by rs2
  - name: fdiv-s_op
    coverpoint:
      [
        "F_fdiv_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_vdoun, cp_csr_frm, cr_fs1_fs2_edges_frm}",
      ]
  # Floating-point compare instructions (insn:feq.s[], insn:flt.s[], insn:fle.s[]) perform
  # the specified comparison between floating-point registers (rs1 = rs2, rs1 &lt; rs2,
  # rs1 ≤ rs2) writing 1 to the integer register rd if the condition holds, and 0
  # otherwise.
  - name: feq-s_flt-s_fle-s_op
    coverpoint:
      [
        "F_feq_s_cg/{cp_rd, cp_fs1, cp_fs2, cp_csr_fflags_v, cr_fs1_fs2_edges}",
        "F_fle_s_cg/{cp_rd, cp_fs1, cp_fs2, cp_csr_fflags_v, cr_fs1_fs2_edges}",
        "F_flt_s_cg/{cp_rd, cp_fs1, cp_fs2, cp_csr_fflags_v, cr_fs1_fs2_edges}",
      ]
  # Floating-point loads and stores use the same base+offset addressing mode as the
  # integer base ISAs, with a base address in register rs1 and a 12-bit signed byte
  # offset. The insn:flw[] instruction loads a single-precision floating-point value from
  # memory into floating-point register rd. insn:fsw[] stores a single-precision value
  # from floating-point register rs2 to memory.
  - name: fsw_flw_op
    coverpoint:
      [
        "F_flw_cg/{cp_rs1_nx0, cp_imm_edges, cp_fd}",
        "F_fsw_cg/{cp_rs1_nx0, cp_imm_edges, cp_fs2, cp_fs2_edges}",
      ]
  # FLW and FSW are only guaranteed to execute atomically if the effective address is
  # naturally aligned.
  - name: fsw_flw_atomic_align
    coverpoint: ["OUT-OF-SCOPE for single hart"]
  # FLW and FSW do not modify the bits being transferred; in particular, the payloads of
  # non-canonical NaNs are preserved.
  - name: fsw_flw_bits_maintained
    coverpoint: ["F_flw_cg/cp_fd_edges", "F_fsw_cg/cp_fs2_edges"]
  # insn:fmadd.s[] multiplies the values in rs1 and rs2, adds the value in rs3, and writes
  # the final result to rd. insn:fmadd.s[] computes (rs1×rs2)+rs3.
  - name: fmadd-s_op
    coverpoint:
      [
        "F_fmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
      ]
  # Floating-point fused multiply-add (FMA) instructions require a new standard
  # instruction format. R4-type instructions specify three source registers (rs1, rs2, and
  # rs3) and a destination register (rd). This format is only used by the floating-point
  # fused multiply-add instructions.
  - name: fma_rs3
    coverpoint:
      [
        "F_fmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fnmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fnmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
      ]
  # The fused multiply-add instructions must set the invalid operation exception flag when
  # the multiplicands are ∞ and zero, even when the addend is a quiet NaN.
  - name: fma_nv_flag
    coverpoint:
      [
        "F_fmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fnmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
        "F_fnmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
      ]
  # Floating-point minimum-number and maximum-number instructions insn:fmin.s[] and
  # insn:fmax.s[] write, respectively, the smaller or larger of rs1 and rs2 to rd
  - name: fmin-s_fmax-s_op
    coverpoint:
      [
        "F_fmax_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_csr_fflags_v, cr_fs1_fs2_edges}",
        "F_fmin_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_csr_fflags_v, cr_fs1_fs2_edges}",
      ]
  # For the purposes of these instructions only, the value −0.0 is considered to be less than the
  # value +0.0
  - name: fmin-s_fmax-s_zero_compare
    coverpoint: ["{F_fmin_s_cg, F_fmax_s_cg}/cr_fs1_fs2_edges"]
  # If both inputs are NaNs, the result is the canonical NaN
  - name: fmin-s_fmax-s_both_nan_input
    coverpoint: ["{F_fmin_s_cg, F_fmax_s_cg}/cr_fs1_fs2_edges"]
  # If only one operand is a NaN, the result is the non-NaN operand
  - name: fmin-s_fmax-s_one_nan_input
    coverpoint: ["{F_fmin_s_cg, F_fmax_s_cg}/cr_fs1_fs2_edges"]
  # Signaling NaN inputs set the invalid operation exception flag, even when the result is not NaN
  - name: fmin-s_fmax-s_signaling_nan_nv
    coverpoint:
      ["{F_fmin_s_cg, F_fmax_s_cg}/{cr_fs1_fs2_edges, cp_csr_fflags_v}"]
  # insn:fmsub.s[] multiplies the values in rs1 and rs2, subtracts the value in rs3, and
  # writes the final result to rd. insn:fmsub.s[] computes (rs1×rs2)−rs3.
  - name: fmsub-s_op
    coverpoint:
      [
        "F_fmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
      ]
  - name: fmv-w-x_op
    # FMV.W.X moves the single-precision value encoded in IEEE 754-2008 standard encoding from the lower 32 bits of integer register rs1 to the floating-point register rd. The bits are not modified in the transfer, and in particular, the payloads of non-canonical NaNs are preserved.
    coverpoint: ["F_fmv_w_x_cg/{cp_rs1, cp_rs1_edges, cp_fd}"]
  - name: fmv-x-w_op
    # FMV.X.W moves the single-precision value in floating-point register rs1 represented in IEEE 754-2008 encoding to the lower 32 bits of integer register rd. The bits are not modified in the transfer, and in particular, the payloads of non-canonical NaNs are preserved. For RV64, the higher 32 bits of the destination register are filled with copies of the floating-point number's sign bit
    coverpoint: ["F_fmv_x_w_cg/{cp_rd, cp_fs1, cp_fs1_edges}"]
  # insn:fnmadd.s[] multiplies the values in rs1 and rs2, negates the product, subtracts
  # the value in rs3, and writes the final result to rd. insn:fnmadd.s[] computes
  # −(rs1×rs2)−rs3.
  - name: fnmadd-s_op
    coverpoint:
      [
        "F_fnmadd_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
      ]
  # insn:fnmsub.s[] multiplies the values in rs1 and rs2, negates the product, adds the
  # value in rs3, and writes the final result to rd. insn:fnmsub.s[] computes
  # −(rs1×rs2)+rs3.
  - name: fnmsub-s_op
    coverpoint:
      [
        "F_fnmsub_s_cg/{cp_fs1, cp_fs2, cp_fs3, cp_fd, cp_frm_4, cp_csr_fflags_voun, cp_csr_frm, cr_fs1_fs2_edges_frm4, cr_fs1_fs3_edges_frm4}",
      ]
  # insn:fsgnj.s[], insn:fsgnjn.s[], and insn:fsgnjx.s[] are floating-point to
  # floating-point sign-injection instructions that produce a result that takes all bits
  # except the sign bit from rs1. For insn:fsgnj[], the result's sign bit is rs2's sign
  # bit; for insn:fsgnjn[], the result's sign bit is the opposite of rs2's sign bit; and
  # for insn:fsgnjx[], the sign bit is the XOR of the sign bits of rs1 and rs2.
  # Sign-injection instructions do not set floating-point exception flags, nor do they
  # canonicalize NaNs
  - name: fsgnj-s_fsgnjn-s_fsgnjx-s_op
    coverpoint:
      [
        "F_fsgnj_s_cg/{cp_fs1, cp_fs2, cp_fd, cr_fs1_fs2_edges}",
        "F_fsgnjn_s_cg/{cp_fs1, cp_fs2, cp_fd, cr_fs1_fs2_edges}",
        "F_fsgnjx_s_cg/{cp_fs1, cp_fs2, cp_fd, cr_fs1_fs2_edges}",
      ]
  # insn:fsqrt.s[] computes the square root of rs1
  - name: fsqrt-s_op
    coverpoint:
      [
        "F_fsqrt_s_cg/{cp_fs1, cp_fd, cp_fs1_edges, cp_frm_2, cp_csr_fflags_vn, cp_csr_frm}",
      ]
  # insn:fsub.s[] performs the single-precision floating-point subtraction of rs2 from rs1
  - name: fsub-s_op
    coverpoint:
      [
        "F_fsub_s_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm}",
      ]
