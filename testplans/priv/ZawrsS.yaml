# yaml-language-server: $schema=testplan.schema.json
suite: ZawrsS
source: https://docs.google.com/spreadsheets/d/1LpZQ1LwAInN2jjq_oDn_r8xIuPU7h_R_SpbgVbmUf54/edit?gid=0#gid=0
notes: |
  covergroup Zawrs
coverpoints:
  - heading: tests for single core
  - name: cp_wrs_sto_timeout
    goal: WRS.STO waits till timeout
    description: |-
      cross lr instruction to set up reservation.
      mstatus.TW = {0/1}
      mstatus.MIE = 0
      mstatus.SIE = 0
      mie=all zeros 0 to disable interrupts
      Execute WRS.STO in S mode
    expectation: no exception, next instruction executes normally after WRS.STO finish execution
    bins: 2 bins
    rules:
      - Zawrs_wrs-sto_stall_duration
  - name: cp_wrs_no_res
    goal: WRS behaves as nop when no reservation is established
    description: |-
      mstatus.TW =0
      mstatus.MIE = 0
      mstatus.SIE = 0
      mie=all 0s to disable interrupts
      Clear all reservation with sc.w, then execute {WRS.STO, WRS.NTO} with no reservation created in S mode
    expectation: WRS behaves as nop
    bins: 2 bins
    notes: TW = 1 can not be tested because the DUT may trigger illegal instruction immediately, where SAIL allows the instruction to retire successfully
  - name: cp_wrs_resume
    goal: WRS follows the rules of WFI for resuming on interrupts
    description: |-
      cross lr instruction to set up reservation.
      mstatus.TW = 0
      cross with mie.MTIE=1
      (if SSTC supporrted use STIP, cross menvcfg.STCE = 1)
      mstatus.MIE = {0/1}
      mstatus.SIE = {0/1}
      Set up timer to interrupt soon
      execute {WRS.NTO/WRS.STO} in S mode
    expectation: WRS resumes when interrupt is pending, MIE should not affect result, trap in all cases other than in S mode with SIE = 0 (still resumes)
    bins: 2 x 2 x 2  bins
    rules:
      - Zawrs_exec_resume_rules
      - LA(t0, zawrs_resume_trap_handler)
      - "csrrw t0, stvec, t0 # save old trap vector"
      - "1: wrs.nto  # keep doing nto until timeout"
      - if in S mode version of test with SIE=0 and sip.STIP, exit with success
      - j 1b
      - "zawrs_resume_trap_handler:"
      - csrr t1, scause
      - SIGUPD t1
      - "csrw stvec, t0 # restore trap handler"
      - "done:"
      - "*** need to use mtvec and mcause if S not supported"
  - name: cp_wrs_nto_timeout
    goal: WRS.NTO timeout when TW = 1
    description: |-
      cross lr instruction to set up reservation.
      mstatus.TW = 1
      mstatus.MIE = 0
      mstatus.SIE = 0
      mie=all 0s to disable interrupts
      execute WRS.NTO in S mode
    expectation: WRS causes illegal instruction exception when timed out if TW = 1
    bins: "1"
    rules:
      - Zawrs_priv_illegal_instr_excp
      - will retire or timeout with illegal instruction
      - "*** need to use mtvec and mcause if S not supported"
      - "*** make sure of delegation if S is supported (part of boot code)"
      - "#ifdef UDB_ZAWRS_NTO_IS_NOP"
      - wrs.nto
      - "#else"
      - LA(t0, zawrs_trap_handler)
      - "csrrw t0, stvec, t0 # save old trap vector"
      - "1: wrs.nto  # keep doing nto until timeout"
      - j 1b
      - "zawrs_trap_handler:"
      - csrr t1, scause
      - SIGUPD t1
      - "csrw stvec, t0 # restore trap handler"
      - "done:"
      - "#endif"
      - "Sail: Zawrs.nto.is_nop, Zawrs.sto.is_nop"
  - name: cp_wrs_nto_timeout_h
    goal: WRS.NTO timeout causing virtual instruction exception in H mode
    description: |-
      #ifdef H_SUPPORTED
      cross lr instruction to set up reservation
      mstatus.MIE = 0
      mstatus.SIE = 0
      mie=all 0s to disable interrupts
      mstatus.TW = {0/1},
      hstatus.VTW = 1
      execute WRS.NTO in VS/VU mode
      hedeleg = 0s - do not delegate exception to VS mode
    expectation: WRS causes virtual instruction exception when timed out if mstatus.tw = 0
    bins: 2 x 2 bins
    rules:
      - Zawrs_virtual_instr_excp
      - same as above, expect illegal instruction if TW=1 and virtual instruction if TW=0 and not NOP.
  - name: cp_wrs_no_mie
    description: |-
      cross lr instruction to set up reservation
      mstatus.MIE = 1
      mstatus.SIE = 1
      mie = all 0s
      mstatus.TW = 1
      mip.mtip = {SSIP + SEIP + STIP + MSIP + MEIP + MTIP}
      execute WRS.NTO and WRS.STO in S mode
    expectation: WRS does not stop when interrupt pending, WRS.NTO causes illegal instruction
    bins: 2 bins
    rules:
      - same as above
  - name: "Can not be tested with single core:"
    description: "Untested things:"
  - name: norm
    description: Since the timeout limit can be different across platforms, cannot test WRS.STO with a timer interrupt soon
    status: Zawrs_wrs-nto_stall_exec
  - heading: "spec:"
  - heading: As implementations are free to implement WFI as a NOP, software must explicitly check for
  - heading: any relevant pending but disabled interrupts in the code following an WFI, and should loop
  - heading: back to the WFI if no suitable interrupt was detected. The mip or sip registers can be
  - heading: interrogated to determine the presence of any interrupt in machine or supervisor mode
  - heading: respectively.
