# CI configuration for the SERV core

ci_enabled: true

# olofk/serv @ f200eb2e:
#   Zicsr         mepc bit 0 is writable; the spec requires it to read zero.
#   Zifencei      fence.i is not decoded as a fence; it executes as a halfword load and can take a
#                 load-address-misaligned exception.
#   Sm            No illegal-instruction exceptions; mstatus.MPIE not implemented; mie is
#                 write-only; mip, misa, mcycle, minstret, mvendorid, marchid, mimpid are absent
#                 and alias onto other CSRs.
#   ExceptionsSm  No illegal-instruction exception (cause 2).
#   ExceptionsZc  No illegal-instruction exception (cause 2).
#   InterruptsSm  mie is write-only, mip aliases onto mscratch and mstatus.MPIE is not implemented.
exclude_extensions: "Zicsr,Zifencei,Sm,ExceptionsSm,ExceptionsZc,InterruptsSm"

apt_packages: "autoconf flex bison help2man libfl-dev ccache"
install_script: ".github/scripts/install-serv.sh"
setup_script: ".github/scripts/setup-serv.sh"
