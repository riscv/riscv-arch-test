# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # If the ext:c[] or ext:zca[] extension is provided, compressed variants of these HINTs
  # are also provided: insn:c.ntl.p1[] is encoded as insn:c.add[x0,x2]; insn:c.ntl.pall[]
  # is encoded as insn:c.add[x0,x3]; insn:c.ntl.s1[] is encoded as insn:c.add[x0,x4]; and
  # insn:c.ntl.all[] is encoded as insn:c.add[x0,x5].
  - name: ntl_compressed_variants
    coverpoint:
      [
        "ZihintntlZca_c_ntl_p1_cg/cp_asm_count",
        "ZihintntlZca_c_ntl_pall_cg/cp_asm_count",
        "ZihintntlZca_c_ntl_s1_cg/cp_asm_count",
        "ZihintntlZca_c_ntl_all_cg/cp_asm_count",
        "{ZihintntlZca_c_ntl_p1_cg, ZihintntlZca_c_ntl_pall_cg, ZihintntlZca_c_ntl_s1_cg, ZihintntlZca_c_ntl_all_cg}/cp_asm_count",
      ]
