# CI configuration for Whisper simulator

ci_enabled: true
exclude_extensions:
  # Sail lacks Ssaia/Sscsrind, so expects illegal instead of virtual instruction for their CSRs from VU-mode.
  - H_vucsr
  # Sail 0.16 lacks Smaia and Smrnmi, whose CSRs Whisper implements
  - Ssstrict_Sm_CSR
  # Sail traps on siselect/stopi accesses that Whisper permits with mstateen0 enabled.
  - Ssstrict_S_CSR
  # The -mu configs pass. On the max configs Whisper implements Sscsrind and Ssaia, so
  # mstateen0.CSRIND, AIA and IMSIC are writable, but Sail does not model those extensions
  # (https://github.com/riscv/sail-riscv/issues/1134, https://github.com/riscv/sail-riscv/pull/1874).
  - Smstateen
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 2
