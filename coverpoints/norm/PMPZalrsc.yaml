# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # &lt;&lt;pmpcfg&gt;&gt; shows the layout of a PMP configuration register. The R, W,
  # and X bits, when set, indicate that the PMP entry permits read, write, and
  # instruction execution, respectively. When one of these bits is clear, the
  # corresponding access type is denied.
  - name: pmp_cfg_permissions
    coverpoint: ["PMPZalrsc_cg/cp_cfg_RW"]

  # Attempting to execute a load or load-reserved instruction that accesses a physical
  # address within a PMP region without read permissions raises a load access-fault
  # exception.
  - name: pmp_load_fault
    coverpoint: ["PMPZalrsc_cg/cp_cfg_RW"]

  # Attempting to execute a store, store-conditional, AMO, or cache-block zero
  # instruction that accesses a physical address within a PMP region without write
  # permissions raises a store access-fault exception.
  - name: pmp_store_fault
    coverpoint: ["PMPZalrsc_cg/cp_cfg_RW"]

  # In addition to locking the PMP entry, the L bit indicates whether the R/W/X
  # permissions are additionally enforced on M-mode accesses. When the L bit is set,
  # these permissions are enforced for all privilege modes. When the L bit is clear, any
  # M-mode access matching the PMP entry will succeed; the R/W/X permissions apply only
  # to S and U modes.
  - name: pmp_l_bit_m_mode_enforcement
    coverpoint: ["PMPZalrsc_cg/cp_cfg_RW"]

  # No insn:sc.w[] instruction shall retire unless it passes memory permission checks,
  - name: sc_retire_permission
    coverpoint: ["PMPZalrsc_cg/cp_cfg_RW"]

  # Note that load and load-reserved instructions generate load exceptions
  - name: mcause_exccode_ld_ldrsv
    coverpoint: ["PMPZalrsc_cg/cp_cfg_RW"]

  # store, store-conditional, and AMO instructions generate store/AMO exceptions.
  - name: mcause_exccode_st_sc_amo
    coverpoint: ["PMPZalrsc_cg/cp_cfg_RW"]
