# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # loads and stores whose effective addresses are naturally aligned shall not raise an
  # address-misaligned exception.
  - name: ldst_no_exc_aligned
    coverpoint:
      ["ExceptionsF_cg/cp_{load_address_misaligned, store_address_misaligned}"]
  # loads and stores that are not naturally aligned may either complete execution
  # successfully or raise an exception. The exception raised can be either an
  # address-misaligned exception or an access-fault exception. For a memory access that
  # would otherwise be able to complete except for the misalignment, an access-fault
  # exception can be raised instead of an address-misaligned exception if the misaligned
  # access should not be emulated, e.g., if accesses to the memory region have side
  # effects.
  - name: misaligned_ldst_exc_type
    coverpoint:
      [
        "ExceptionsF_cg/cp_{load_address_misaligned, store_address_misaligned, load_access_fault, store_access_fault}",
      ]
  # When an extension's status is set to Off, any instruction that attempts to read or
  # write the corresponding state will cause an illegal-instruction exception.
  - name: mstatus_fs_vs_xs_off_op
    coverpoint:
      ["ExceptionsF_cg/{cp_mstatus_fs_illegal_instr, cp_mstatus_fs_csr_access}"]
  # Changing the setting of csr::[fs] has no effect on the contents of the
  # floating-point register state. In particular, setting csr::[fs]=Off does not destroy
  # the state, nor does setting csr::[fs]=Initial clear the contents.
  - name: mstatus_fs_wr
    # f0-f31 are initialized before the FS=Off cases and used unchanged as sources at
    # FS=Initial/Clean, so clearing them on an FS write changes the results
    coverpoint: ["ExceptionsF_cg/cp_mstatus_fs_legal"]
  # The Exception Code field contains a code identifying the last exception or
  # interrupt.
  - name: mcause_exccode_op
    coverpoint:
      [
        "ExceptionsF_cg/cp_{load_address_misaligned, store_address_misaligned, load_access_fault, store_access_fault}",
      ]
  # Note that load and load-reserved instructions generate load exceptions
  - name: mcause_exccode_ld_ldrsv
    coverpoint:
      ["ExceptionsF_cg/cp_{load_address_misaligned, load_access_fault}"]
