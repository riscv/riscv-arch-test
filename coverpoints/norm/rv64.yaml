# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  - name: addiw_op
    coverpoint: ["I_addiw_cg/{cp_rs1, cp_rd, cr_rs1_imm_edges}"]
  - name: addiw_overflow
    coverpoint: ["I_addiw_cg/cr_rs1_imm_edges"]
  # insn:addw[] and insn:subw[] are RV64I-only instructions that are defined analogously
  # to insn:add[] and insn:sub[] but operate on 32-bit values and produce signed 32-bit
  # results.
  - name: addw_subw_op
    coverpoint:
      ["{I_addw_cg, I_subw_cg}/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  # Overflows are ignored, and the low 32-bits of the result is sign-extended to 64-bits
  # and written to the destination register.
  - name: addw_subw_overflow
    coverpoint: ["I_addw_cg/cr_rs1_rs2_edges", "I_subw_cg/cr_rs1_rs2_edges"]
  - name: auipc_op_rv64i
    coverpoint: ["I_auipc_cg/{cp_rd, cp_imm_edges_20bit}"]
  # The insn:ld[] instruction loads a 64-bit value from memory into register rd for RV64I.
  - name: ld_op_rv64i
    coverpoint:
      [
        "I_lb_cg/cp_memval_byte",
        "I_lbu_cg/cp_memval_byte",
        "I_ld_cg/cp_memval_double",
        "I_lh_cg/cp_memval_hword",
        "I_lhu_cg/cp_memval_hword",
      ]
  # The insn:lw[] instruction loads a 32-bit value from memory and sign-extends this to 64
  # bits before storing it in register rd for RV64I.
  - name: lw_op_rv64i
    coverpoint:
      [
        "I_lb_cg/cp_memval_byte",
        "I_lbu_cg/cp_memval_byte",
        "I_lh_cg/cp_memval_hword",
        "I_lhu_cg/cp_memval_hword",
        "I_lw_cg/cp_memval_word",
      ]
  # insn:lh[] and insn:lhu[] are defined analogously for 16-bit values, as are insn:lb[]
  # and insn:lbu[] for 8-bit values.
  - name: lh_lhu_lb_lbu_op_rv64i
    coverpoint:
      [
        "I_lb_cg/cp_memval_byte",
        "I_lbu_cg/cp_memval_byte",
        "I_lh_cg/cp_memval_hword",
        "I_lhu_cg/cp_memval_hword",
      ]
  - name: lui_op_rv64i
    coverpoint: ["I_lui_cg/cp_imm_edges_20bit"]
  - name: lwu_op
    coverpoint: ["I_lwu_cg/cp_memval_word"]
  - name: rv64_w_sex
    coverpoint:
      [
        "{I_addw_cg, I_subw_cg, I_sllw_cg, I_srlw_cg, I_sraw_cg}/cr_rs1_rs2_edges",
      ]
  - name: rv32i_rv64i_other_xregs
    coverpoint: ["I_addw_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  - name: rv64i_xreg_sz
    coverpoint: ["I_addw_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  # The insn:sd[], insn:sw[], insn:sh[], and insn:sb[] instructions store 64-bit, 32-bit,
  # 16-bit, and 8-bit values from the low bits of register rs2 to memory respectively.
  - name: sd_sw_sh_sb_op_rv64i
    coverpoint:
      [
        "I_sb_cg/cp_rs2_edges",
        "I_sd_cg/cp_rs2_edges",
        "I_sh_cg/cp_rs2_edges",
        "I_sw_cg/cp_rs2_edges",
      ]
  # In RV64I, only the low 6 bits of rs2 are considered for the shift amount.
  - name: sll_srl_sra_shamt_rv64i
    coverpoint:
      [
        "I_sll_cg/cr_rs1_rs2_edges",
        "I_sra_cg/cr_rs1_rs2_edges",
        "I_srl_cg/cr_rs1_rs2_edges",
      ]
  # insn:slliw[], insn:srliw[], and insn:sraiw[] encodings with imm[5]≠0 are reserved.
  - name: slliw_srliw_sraiw_imm5_rsv
    coverpoint:
      [
        "I_slliw_cg/cp_uimm_5, See also Ssstrict in <<Ssstrict>>",
        "I_sraiw_cg/cp_uimm_5, See also Ssstrict in <<Ssstrict>>",
        "I_srliw_cg/cp_uimm_5, See also Ssstrict in <<Ssstrict>>",
      ]
  # insn:slliw[], insn:srliw[], and insn:sraiw[] are RV64I-only instructions that are
  # analogously defined but operate on 32-bit values and sign-extend their 32-bit results
  # to 64 bits.
  - name: slliw_srliw_sraiw_op
    coverpoint:
      [
        "I_slliw_cg/{cp_rs1, cp_rd_nx0, cp_uimm_5, cr_rs1_imm_edges_uimmw}",
        "I_sraiw_cg/{cp_rs1, cp_rd_nx0, cp_uimm_5, cr_rs1_imm_edges_uimmw}",
        "I_srliw_cg/{cp_rs1, cp_rd_nx0, cp_uimm_5, cr_rs1_imm_edges_uimmw}",
      ]
  # insn:sllw[], insn:srlw[], and insn:sraw[] are RV64I-only instructions that are
  # analogously defined but operate on 32-bit values and sign-extend their 32-bit results
  # to 64 bits. The shift amount is given by rs2[4:0].
  - name: sllw_srlw_sraw_op
    coverpoint:
      [
        "I_sllw_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}",
        "I_sraw_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}",
        "I_srlw_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}",
      ]

  # RV64I Base Instruction Set encodings (RV32/64G Instruction Set Listings)

  # LWU
  - name: lwu_enc
    coverpoint: ["I_lwu_cg/cp_asm_count"]
  # LD
  - name: ld_enc
    coverpoint: ["I_ld_cg/cp_asm_count"]
  # SD
  - name: sd_enc
    coverpoint: ["I_sd_cg/cp_asm_count"]
  # ADDIW
  - name: addiw_enc
    coverpoint: ["I_addiw_cg/cp_asm_count"]
  # SLLIW
  - name: slliw_enc
    coverpoint: ["I_slliw_cg/cp_asm_count"]
  # SRLIW
  - name: srliw_enc
    coverpoint: ["I_srliw_cg/cp_asm_count"]
  # SRAIW
  - name: sraiw_enc
    coverpoint: ["I_sraiw_cg/cp_asm_count"]
  # ADDW
  - name: addw_enc
    coverpoint: ["I_addw_cg/cp_asm_count"]
  # SUBW
  - name: subw_enc
    coverpoint: ["I_subw_cg/cp_asm_count"]
  # SLLW
  - name: sllw_enc
    coverpoint: ["I_sllw_cg/cp_asm_count"]
  # SRLW
  - name: srlw_enc
    coverpoint: ["I_srlw_cg/cp_asm_count"]
  # SRAW
  - name: sraw_enc
    coverpoint: ["I_sraw_cg/cp_asm_count"]
