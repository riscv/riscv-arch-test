    coverpoint: ["I_addi_cg/cp_asm_count"]
  # SLTI
  - name: slti_enc
    coverpoint: ["I_slti_cg/cp_asm_count"]
  # SLTIU
  - name: sltiu_enc
    coverpoint: ["I_sltiu_cg/cp_asm_count"]
  # XORI
  - name: xori_enc
