# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  - name: pause_op
    # The PAUSE instruction is a HINT that indicates the current hart's rate
    # of instruction retirement should be temporarily reduced or paused. The
    # duration of its effect must be bounded and may be zero.
    coverpoint: ["Zihintpause_pause_cg/cp_asm_count"]
  # PAUSE is encoded as a FENCE instruction with pred=W, succ=0, fm=0, rd=x0, and
  # rs1=x0.
  - name: pause_enc_fence
    coverpoint: ["Zihintpause_pause_cg/cp_asm_count"]
  # PAUSE
  - name: pause_enc
    coverpoint: ["Zihintpause_pause_cg/cp_asm_count"]
