# yaml-language-server: $schema=testplan.schema.json
suite: U
source: https://docs.google.com/spreadsheets/d/10NX0T4MgueqA4p7JNg4whCq2k3YZ9R73UCV88MtcIUA/edit?gid=1720466356#gid=1720466356
coverpoints:
  - name: cp_uprivinst
    description: Execute ecall and ebreak, mret, uret in user mode
    rules:
      - ecall throws environment call.  ebreak throws breakpoint.  mret and sret throw illegal instructions.
  - name: cp_csrr_insufficient_priv
    description: Read Machine, Hypervisor, Supervisor CSRS100-3FF, 500-7FF, 900-BFF, D000-FFF
  - name: cp_csr_ro
    description: Write User read-only CSRs C00-CFF
  - heading: User-mode access to the F and V CSRs is tested in the U_F and U_V rows below, and to the counters in Zicntr and Zihpm.
  # U_F rows converted from https://docs.google.com/spreadsheets/d/10NX0T4MgueqA4p7JNg4whCq2k3YZ9R73UCV88MtcIUA/edit?gid=242878857#gid=242878857
  - heading: "U_F tests (U_F-NN.S): the floating-point CSRs and xstatus.FS from U-mode, run when F is also supported. xstatus.FS is written and read through T-SBI, in sstatus when S-mode is supported and otherwise in mstatus."
  - name: cp_fcsr_access
    goal: |-
      Writing to the CSR field
      (WARL)
    description: Write 0s and 1s to fcsr, frm, fflags cross with mstatus.FS init/clean/dirty
  - name: cp_mstatus_FS_transition
    goal: |-
      Writing to the CSR field
      (WARL)
    description: Each different type of floating-point instruction crossed with four values of FS
    rules:
      - check FS becomes dirty where appropriate
  - name: cp_mstatus_FS_transition_nondeterministic
    goal: |-
      Writing to the CSR field
      (WARL)
    description: Floating-point instructions that need not modify floating-point state (fsw, fcvt.w.s, feq.s, fmv.x.w, fclass.s, csrr of the FP CSRs, fmvh.x.d) crossed with mstatus.FS = Off and Dirty
    expectation: Illegal-instruction trap when FS = Off; FS stays Dirty when Dirty. Initial and Clean are omitted because these instructions may dirty FS imprecisely.
  - name: cp_ufcsr_access
    goal: CSR access
    description: csr read, write all 1s, write all 0s, set all 1s, clear all 1s, write back initial value of each register below
  - name: cp_ufcsrwalk
    goal: CSR access
    description: "Set and clear each bit of each writable CSR to exercise bitfields: fcsr, frm, fflags"
  # U_V rows converted from https://docs.google.com/spreadsheets/d/10NX0T4MgueqA4p7JNg4whCq2k3YZ9R73UCV88MtcIUA/edit?gid=1488477674#gid=1488477674
  - heading: "U_V tests (U_V_*-NN.S): the vector CSRs, vset{i}vl{i}, vstart and xstatus.VS from U-mode, run when Zve32x is also supported. xstatus.VS is written and read through T-SBI, in sstatus when S-mode is supported and otherwise in mstatus."
  - name: cp_vcsrrswc
    goal: Confirm that all vector CSR properties are properly set with regards to read write, clear, and set privileges with the csr instructions
    description: With each of the vector CSRs conduct a read, write, clear, and set operation on the CSR
    expectation: Will abide by spec's read and write permissions for each csr
    bins: 3 csr instructions * 7 CSRs
    notes: |-
      test written: yes
      spec: The vector extension adds 32 vector registers, and seven unprivileged CSRs (vstart, vxsat, vxrm, vcsr, vtype, vl, vlenb) to a base scalar RISC-V ISA.
      read-only CSR vlenb
      The XLEN-bit-wide read-only vl CSR can only be updated by the vset{i}vl{i} instructions, and the fault-only-first vector load instruction variants.
      read-only XLEN-wide vector type CSR, vtype provides the default type used to interpret the contents of the vector register file, and can only be updated by vset{i}vl{i}
  - name: cp_vcsrs_walking1s
    goal: Confirm that that all writable vector CSRs have the correct bits writeable
    description: With each of the vector CSRs that are writable, write all XLEN 1-hot values to the csr
    expectation: csrs will be updated based on which bits they support to be writable
    bins: 4 CSRs * XLEN 1-hot values
    notes: |-
      test written: yes
      spec: vstart, vxrm, vxsat, vcsr are all writable
  - name: cp_mstatus_vs_set_dirty_arithmetic
    goal: Confirm that after running an arithmetic vector instruction that mstatus.VS is set to dirty when set to "clean" or "initial"
    description: Run a .vv vector arithmetic instruction with mstatus.VS = {clean, initial}
    expectation: mstatus.VS is set to dirty
    bins: 2 mstatus.VS bins
    notes: |-
      test written: yes
      spec: When mstatus.VS is set to Initial or Clean, executing any instruction that changes vector state, including the vector CSRs, will change mstatus.VS to Dirty.
  - name: cp_mstatus_vs_set_dirty_csr
    goal: Confirm that after running a vsetvli instruction that mstatus.VS is set to dirty when set to "clean" or "initial"
    description: Run a vsetvli instruction with mstatus.VS = {clean, initial}
    expectation: mstatus.VS is set to dirty
    bins: 2 mstatus.VS bins
    notes: |-
      test written: yes
      spec: When mstatus.VS is set to Initial or Clean, executing any instruction that changes vector state, including the vector CSRs, will change mstatus.VS to Dirty.
  - description: Analogous to the way in which the floating-point unit is handled, the mstatus.VS field may exist even if misa.V is clear.
    notes: "feature (coverpoint written): Untestable"
  - name: cp_mstatus_vs_off_arithmetic
    goal: Confirm that when when misa.V is 1 and mstatus.VS is off, an arithmetic vector instruction raises an illegal instruction exception
    description: With misa.V = 1 (misa is not writable in U-mode), set mstatus.VS = {00} and run a .vv vector instruction
    expectation: illegal instruction exception
    bins: "1"
    notes: |-
      test written: yes, confirm sig
      spec: Attempts to execute any vector instruction, or to access the vector CSRs, raise an illegal-instruction exception when mstatus.VS is set to Off.
  - name: cp_mstatus_vs_off_csr
    goal: Confirm that when when misa.V is 1 and mstatus.VS is off, an csr vector instruction raises an illegal instruction exception
    description: With misa.V = 1 (misa is not writable in U-mode), set mstatus.VS = {00} and run a vsetvli
    expectation: illegal instruction exception
    bins: "1"
    notes: |-
      test written: yes, confirm sig
      spec: Attempts to execute any vector instruction, or to access the vector CSRs, raise an illegal-instruction exception when mstatus.VS is set to Off.
  - description: For implementations with a writable misa.V field, the vsstatus.VS field may exist even if misa.V is clear.
    notes: "feature (coverpoint written): Untestable"
  - heading: Vset{i}vl{i}
  - name: cp_sew_lmul_vset_i_vli
    goal: Confirm that all combinations of lmul crossed with sew correctly set the vtype register in accordance with the vill field
    description: Use all vset{i}vli instructions to cross eSEW={8/16/32/64} with mLMUL = {f8/f4/f2/1/2/4/8} rd and uimm can be any nonzero value
    expectation: vtype.vill becomes 1 and other bits become 0 on illegal combinations, such as sew = 1xx.
    bins: 2 instructions * 7 lmul bins * 4 sew bins
    notes: |-
      test written: yes
      spec: Implementations must consider all bits of the vtype value to determine if the configuration is supported. An unsupported value in any location within the vtype value must result in vill being set. In particular, all XLEN bits of the register vtype argument to the vsetvl instruction must be checked. Implementations cannot ignore fields they do not implement. All bits must be checked to ensure that new code assuming unsupported vector features in vtype traps instead of executing incorrectly on an older implementation....The supported element width may vary with LMUL
      The use of vtype encodings with LMUL < SEWMIN/ELEN is reserved, but implementations can set vill if they do not support these configurations.
  - name: cp_sew_lmul_vsetvl
    goal: Confirm that all combinations of lmul crossed with sew correctly set the type register in accordance with the vill field
    description: |-
      Use vsetvl to cross rs2.sew= [3'b000:3'b011] with rs2.lmul = [000, 001, 010, 011, 101, 110, 111]. rd and uimm can be any nonzero value. Make sure rs2_val[`XLEN-1:8] = 0

      rs2 must be this way to be a legal setting
    expectation: vtype.vill becomes 1 and other bits become 0 on illegal combinations, such as sew = 1xx.
    bins: 7 lmul bins * 4 sew bins
    notes: |-
      test written: yes
      spec: Implementations must consider all bits of the vtype value to determine if the configuration is supported. An unsupported value in any location within the vtype value must result in vill being set. In particular, all XLEN bits of the register vtype argument to the vsetvl instruction must be checked. Implementations cannot ignore fields they do not implement. All bits must be checked to ensure that new code assuming unsupported vector features in vtype traps instead of executing incorrectly on an older implementation....The supported element width may vary with LMUL
      The use of vtype encodings with LMUL < SEWMIN/ELEN is reserved, but implementations can set vill if they do not support these configurations.
  - name: cp_sew_lmul_vset_i_vli / cp_sew_lmul_vsetvl
    goal: Confirm on the supported values of lmul are recognized as legal
    description: Use vsetivli rd, 1, sew={supported}, vlmul={supported(mf8/mf4/mf2/)m1/m2/m4/m8}, tu, mu to attempt to set all values of lmul
    expectation: Expect vill is set for all values of lmul that aren't legal, otherwise the correct lmul is set
    bins: "0"
    notes: |-
      feature (coverpoint written): Covered by coverpoint above
      spec: Implementations must support LMUL integer values of 1, 2, 4, and 8....Implementations must provide fractional LMUL settings that allow the narrowest supported type to occupy a fraction of a vector register corresponding to the ratio of the narrowest supported type’s width to that of the largest supported type’s width
  - name: cp_sew_lmul_vset_i_vli / cp_sew_lmul_vsetvl
    goal: Check all values of sew to Confirm only correctly supported values are recognized as legal
    description: Use vsetivli rd, 1, sew={e8/e16/e32/e64}, vlmul={m1}, tu, mu to attempt to set all values of lmul
    expectation: Expect vill will be set when an attempted unsupported sew values are attempted to be written, otherwise vtype will contain supported sew
    bins: "0"
    notes: |-
      feature (coverpoint written): Covered by coverpoint above
      spec: Implementations must support LMUL integer values of 1, 2, 4, and 8....Implementations must provide fractional LMUL settings that allow the narrowest supported type to occupy a fraction of a vector register corresponding to the ratio of the narrowest supported type’s width to that of the largest supported type’s width
  - name: cp_vill_vset_i_vli
    goal: Check that vset{i}vli instructions properly clear the vill bit when writing a valid vtype configuration
    description: |-
      Run vsetvli and vsetivli with eSEW = {8/16/32/64} with mLMUL = {8} and vtype.vill = {1}

      we set lmul to 8 to write a non-zero value to the CSR
    expectation: expect vill bit is cleared and vtype written when sew is legal
    bins: 2 instructions * 4 sew bins
    notes: |-
      test written: yes
      spec: If the vill bit is set, then any attempt to execute a vector instruction that depends upon vtype will raise an illegal-instruction exception [except]....vset{i}vl{i} .... [does] not depend upon vtype
  - name: cp_vill_vsetvl
    goal: Check that vsetvl instruction properly clears the vill bit when writing a valid vtype configuration
    description: |-
      Run vsetvl with rs2.sew = {8/16/32/64} with rs2.lmul = {8} and vtype.vill = {1} making sure rs2_val[`XLEN-1:8] = 0

      we set lmul to 8 to write a non-zero value to the CSR. rs2 must be in this manner to be a legal setting
    expectation: expect vill bit is cleared and vtype written when sew is legal
    bins: 4 sew bins
    notes: |-
      test written: yes
      spec: If the vill bit is set, then any attempt to execute a vector instruction that depends upon vtype will raise an illegal-instruction exception [except]....vset{i}vl{i} .... [does] not depend upon vtype
  - name: cp_vill_vsetvl_rs2_vill
    goal: Check that when attempting to set a valid configuration but with the rs2.vill bit set, and the vtype.vill bit set, that the register remains all zeros besides the vill bit
    description: |-
      Run vsetvl with rs2.sew = {8/16/32/64} with vtype.lmul = {8} and vtype.vill = {1} making sure rs2_val[`XLEN-2:8] = 0 and rs2[XLEN-1] = 1

      we set lmul to 8 to attempt to write a non-zero value to the CSR. rs2 must be in this manner to be a legal setting.
    expectation: vtype register remains unchanged
    bins: 4 sew bins
    notes: |-
      test written: yes
      spec: If the vill bit is set, then any attempt to execute a vector instruction that depends upon vtype will raise an illegal-instruction exception [except]....vset{i}vl{i} .... [does] not depend upon vtype
  - name: cp_vsetvl_rs2_vill
    goal: Confirm that with vsetvl if rs2 has the vill bit set that it is treated as an unsupported configuration
    description: |-
      run a vsetvl with rs2[XLEN-1] = 1, rs2[XLEN-2:8]=0 and rs2.sew = {supported} and rs2.lmul = 1 and vtype.vill = {0}

      sew must be supported and rs2[XLEN-2:8] zero to verify the configuration is illegal due to the vill bit being set
    expectation: vill bit should be set
    notes: "spec: A vtype value with vill set is treated as an unsupported configuration."
  - name: cp_vset_vill
    goal: Confirm that writing 1 to vill clears other bits of vtype
    description: Set rs1 nonzero, rs1 = 1 in XLEN-1, 11 in 7:6 (vma/vta). vsetvl rd, rs1, rs2 and vtype.vill = {0}
    expectation: vtype.vill becomes 1 and other bits become 0
    bins: "1"
    notes: |-
      feature (coverpoint written): covered by coverpoint above
      spec: When the vill bit is set, the other XLEN-1 bits in vtype shall be zero.
  - name: cp_vtype_vill_set_vl_0
    goal: Confirm that if an unsupported configuration is set, that vl is set to zero
    description: Run vsetvl with rs1 non-zero and rs2 vill bit set and vl =! 0
    expectation: vl should be set to zero
    bins: "1"
    notes: |-
      test written: yes
      spec: If the vtype value is not supported by the implementation, then the vill bit is set in vtype, the remaining bits in vtype are set to zero, and the vl register is also set to zero.
  - name: cp_vsetvl_rd_nx0_rs1_x0
    goal: Confirm that when running a vsetvl instruction with rd != x0 and rs1 = x0 that vl is set to vlmax
    description: |-
      with vl != vlmax, conduct vsetvl with rd != x0 and rs1 = x0. Cross with sew = {8/16/32/64} and respective supported lmul {supported(f8,f4,f2,)1,2,4,8}

      we want vl != vlmax since similar syntax leaves vl unmodified.
    expectation: vl csr is set to vlmax
    bins: 4 sew bins * 7 lmul bins
    notes: |-
      test written: yes
      spec: When rs1=x0 but rd≠x0, the maximum unsigned integer value (~0) is used as the AVL, and the resulting VLMAX is written to vl and also to the x register specified by rd.
  - name: cp_vsetvli_rd_nx0_rs1_x0
    goal: Confirm that when running a vsetvli instruction with rd != x0 and rs1 = x0 that vl is set to vlmax
    description: |-
      with vl != vlmax, conduct vsetvli with rd != x0 and rs1 = x0. Cross with sew = {8/16/32/64} and respective supported lmul {supported(f8,f4,f2,)1,2,4,8}

      we want vl != vlmax since similar syntax leaves vl unmodified.
    expectation: vl csr is set to vlmax
    bins: 4 sew bins * 7 lmul bins
    notes: |-
      test written: yes
      spec: When rs1=x0 but rd≠x0, the maximum unsigned integer value (~0) is used as the AVL, and the resulting VLMAX is written to vl and also to the x register specified by rd.
  - name: cp_vsetvl_rd_x0_rs1_x0
    goal: Confirm that when running a vsetvl instruction with rd = x0 and rs1 = x0 that vl is unchanged
    description: |-
      with vl != 0, conduct vsetvl with rd = x0 and rs1 = x0. sew and lmul must be such that vlmax does not change

      vlmax must not change for the instruction to not be reserved.
    expectation: vl is unchanged
    bins: "1"
    notes: |-
      test written: yes
      spec: When rs1=x0 and rd=x0, the instruction operates as if the current vector length in vl is used as the AVL, and the resulting value is written to vl, but not to a destination register. This form can only be used when VLMAX and hence vl is not actually changed by the new SEW/LMUL ratio.
  - name: cp_vsetvli_rd_x0_rs1_x0
    goal: Confirm that when running a vsetvli instruction with rd = x0 and rs1 = x0 that vl is unchanged
    description: |-
      with vl != 0, conduct vsetvli with rd = x0 and rs1 = x0. sew and lmul must be such that vlmax does not change

      vlmax must not change for the instruction to not be reserved.
    expectation: vl is unchanged
    bins: "1"
    notes: |-
      test written: yes
      spec: When rs1=x0 and rd=x0, the instruction operates as if the current vector length in vl is used as the AVL, and the resulting value is written to vl, but not to a destination register. This form can only be used when VLMAX and hence vl is not actually changed by the new SEW/LMUL ratio.
  - heading: AVL
  - name: cp_vsetvl_i_avl_eq_zero
    goal: Confirm that vsetvl{i} instructions follow vl requirements when avl is zero
    description: Run vsetvli and vsetvl with rs1 = 0
    expectation: vl = 0
    bins: "1"
    notes: |-
      test written: yes
      spec: The vset{i}vl{i} instructions first set VLMAX according to their vtype argument, then set vl obeying the following constraints:

      These specific properties follow from the prior rules: vl = 0 if AVL = 0
  - name: cp_vsetvl_i_avl_eq_vlmax
    goal: Confirm that vsetvl{i} instructions follow avl requirements when equal to vlmax
    description: Run vsetvli and vsetvl with rs1 = vlmax
    expectation: vl = avl
    bins: "1"
    notes: |-
      test written: yes
      spec: The vset{i}vl{i} instructions first set VLMAX according to their vtype argument, then set vl obeying the following constraints:

      vl = AVL if AVL ≤ VLMAX
  - name: cp_vsetvl_i_avl_lt_2x_vlmax
    goal: Confirm that vsetvl{i} instructions follow avl requirements when greater than vlmax and less than equal to 2*vlmax (if avl is less than 2* vlmax)
    description: Run vsetvli and vsetvl with vlmax < rs1 < 2 *vlmax
    expectation: ceil(AVL / 2) ≤ vl ≤ VLMAX
    bins: "1"
    notes: |-
      test written: yes, is a chance that sig don't match
      spec: The vset{i}vl{i} instructions first set VLMAX according to their vtype argument, then set vl obeying the following constraints:

      ceil(AVL / 2) ≤ vl ≤ VLMAX if AVL < (2 * VLMAX)
  - name: cp_vsetvl_i_avl_eq_2x_vlmax
    goal: Confirm that vsetvl{i} instructions follow avl requirements when greater than 2 * vlmax (when avl is greater than equal to 2 * vlmax)
    description: Run vsetvli and vsetvl with rs1 ≥ 2 *vlmax
    expectation: vl = VLMAX
    bins: "1"
    notes: |-
      test written: yes
      spec: The vset{i}vl{i} instructions first set VLMAX according to their vtype argument, then set vl obeying the following constraints:

      vl = VLMAX if AVL ≥ (2 * VLMAX)
  - name: cp_vsetvl_i_avl_gt_2x_vlmax
    goal: Confirm that vsetvl{i} instructions follow avl requirements when greater than 2 * vlmax (when avl is greater than equal to 2 * vlmax)
    description: Run vsetvli and vsetvl with rs1 ≥ 2 *vlmax
    expectation: vl = VLMAX
    bins: "1"
    notes: |-
      test written: yes
      spec: The vset{i}vl{i} instructions first set VLMAX according to their vtype argument, then set vl obeying the following constraints:

      vl = VLMAX if AVL ≥ (2 * VLMAX)
  - name: cp_vsetivli_avl_corners
    goal: Confirm that vsetivli abides by the avl corners
    description: Run vsetivli with all values of imm = {[0:31]} with sew = {all_supported} and lmul = 1
    expectation: Abides by avl rules depending on
    bins: 4 sew bins * 32 imm bins
    notes: |-
      test written: yes
      spec: The vset{i}vl{i} instructions first set VLMAX according to their vtype argument, then set vl obeying the following constraints:
  - heading: vstart
  - name: cp_vstart_out_of_bounds
    goal: Confirm that the vstart CSR only has enough writeable bits to hold the largest element index (2^16-1)
    description: conduct a csr write with rs1 = 2^16 on the vstart register
    expectation: Not defined in spec, either vstart takes the bottom bits or sets to vlmax-1
    bins: "1"
    notes: |-
      test written: yes
      spec: The vstart CSR is defined to have only enough writable bits to hold the largest element index (one less than the maximum VLMAX). Try to write a number greater than what is legal
  - name: cp_sew_illegal
    description: Cannot set SEW < 8, all set SEW must be powers of 2 (can accomplish this by looping and setting sew of 2x until vill bit is set and then confirm that vill bit is set whenever setting a non power of 2 sew in that range)
    notes: "feature (coverpoint written): can't be tested"
  - name: cp_vl_walking1s_sew_lmul
    goal: Confirm that all vl CSR bit fields are correctly set for all combinations of sew and lmul (thus all VLMAX)
    description: |-
      Running the vsetvli instruction, cross all sew = {8/16/32/64} lmul = {f8, f4,f2, 1, 2, 4, 8} with rs1 ={XLEN 1-hot values}

      This is done by conducting a vsetivli every time followed by a walking one csr write to ensure the target sew and lmul were attempted to be written
    expectation: vl register will be set in accordance with vlmax
    bins: 4sew * 7 lmul * XLEN 1-hot values
  - name: cp_vlen_illegal
    description: Cannot set VLEN greater than 2^16, can check vl with eew = 8
    expectation: |-
      vsetvli rs1={0, 1, 2, 3, 4, 7, 8, 9, 16, 32, 64... 2^16}
      corners: (rs1 - 1)
    notes: "feature (coverpoint written): covered by csr writing tests"
  - description: The vector extension must have a consistent state at reset. In particular, vtype and vl must have values that can be read and then restored with a single vsetvl instruction. (make sure reset is called)
    notes: "feature (coverpoint written): untestable"
  - name: cp_uvcsrwalk
    goal: CSR access
    description: "Set and clear each bit of each writable CSR to exercise bitfields: vxrm, vxsat, vcsr. vstart"
  - name: cp_uvcsr_access
    goal: CSR access
    description: "csr read, write all 1s, write all 0s, set all 1s, clear all 1s, write back initial value of each register: vxrm, vxsat, vcsr, vstart, vtype, vlenb, vl"
    expectation: vtype, vlenb, vl are read-only and will throw illegal instruction if written
  - heading: "U_VF tests (U_VF-NN.S): vector floating-point instructions and xstatus.FS from U-mode, run when Zve32f is also supported. xstatus.FS and xstatus.VS are written and read through T-SBI, in sstatus when S-mode is supported and otherwise in mstatus."
  - heading: It should be understood that for most coverpoints that are based on arithmetic instructions, the coverpoints will check to make sure they're non-trivial, meaning that vl != 0, vstart=0, vill=0, and they do not trap. It may be useful to know that when using vsetvl{i} instructions if rd != x0 and rs1 = x0, vl = vlmax
  - name: cp_vectorfp_mstatus_fs_state_affecting_register
    goal: Confirm vector floating point instructions set mstatus.FS to dirty when modifying floating point register state
    description: Set mstatus.FS = {initial/clean} and run a fd writing instruction
    expectation: mstatus.FS is set to dirty
    bins: "1"
    notes: "spec: Any vector floating-point instruction that modifies any floating-point extension state (i.e., floating-point CSRs or f registers) must set mstatus.FS to Dirty."
  - name: cp_vectorfp_mstatus_fs_state_affecting_csr
    goal: Confirm vector floating point instructions set mstatus.FS to dirty when modifying floating point csr state
    description: Set mstatus.FS = {initial/clean} and run an instruction that would raise a fp flag after clearing the fp flags
    expectation: mstatus.FS is set to dirty
    bins: "1"
    notes: "spec: Any vector floating-point instruction that modifies any floating-point extension state (i.e., floating-point CSRs or f registers) must set mstatus.FS to Dirty."
  - name: cp_vectorfp_mstatus_fs_state_nonaffecting
    goal: Confirm vector floating point instructions properly set mstatus.FS when not modifying floating point state
    description: Set mstatus.FS = {initial/clean} and run a vector fp instruction that does not affect floating point state (chosen situation for coverpoint is a .vv ins where vs1 = vs2 = 0)
    expectation: mstatus.FS may be set to dirty or not depending on implementation
    bins: "1"
    notes: "spec: Any vector floating-point instruction that modifies any floating-point extension state (i.e., floating-point CSRs or f registers) must set mstatus.FS to Dirty."
  - name: cp_vectorfp_mstatus_fs_off
    goal: Confirm that vector floating point instructions (even if they dont modify fp state) raise an illegal instruction exception if mstatus.FS is set to off
    description: Set mstatus.FS = {off} and run a vector fp instruction that does not affect floating point state  (chosen situation for coverpoint is a .vv ins where vs1 = vs2 = 0)
    expectation: illegal instruction exception
    bins: "1"
    notes: "spec: If the floating-point unit status field mstatus.FS is Off then any attempt to execute a vector floating-point instruction will raise an illegal instruction exception."
