# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # And if the hypervisor extension is implemented, another set of CSRs is added:
  # hstateen0, hstateen1, hstateen2, and hstateen3.
  - name: hstateen_rv64_csrs
    coverpoint: ["SsstateenH_hs_cg/{cp_hs_hstateen0_walk, cp_hs_stateen123}"]
  # For RV32, there are CSR addresses for accessing the upper 32 bits of corresponding
  # machine-level and hypervisor CSRs.
  - name: stateen_rv32_upper_bits_csrs
    coverpoint: ["SsstateenH_hs_cg/{cp_hs_hstateen0_walk, cp_hs_stateen123}"]
  # The stateen registers at each level control access to state at all less-privileged
  # levels, but not at its own level.
  - name: stateen_op
    coverpoint:
      [
        "SsstateenH_hs_cg/{cp_hs_sstateen0, cp_hs_senvcfg}",
        "SsstateenH_vs_cg/{cp_vs_sstateen0, cp_vs_senvcfg}",
      ]
  # ... raises an illegal-instruction exception, or, if executing in VS or VU mode and
  # the circumstances for a virtual-instruction exception apply, raises a
  # virtual-instruction exception instead of an illegal-instruction exception.
  - name: stateen_illegal_state_access
    coverpoint:
      [
        "SsstateenH_vs_cg/{cp_vs_sstateen0, cp_vs_senvcfg, cp_vs_stateen123}",
        "SsstateenH_vu_cg/{cp_vu_sstateen0, cp_vu_senvcfg, cp_vu_stateen123}",
      ]
  # With the hypervisor extension, the hstateen CSRs have identical encodings to the
  # mstateen CSRs, except controlling accesses for a virtual machine (from VS and VU modes).
  - name: hstateen_encoding
    coverpoint:
      [
        "SsstateenH_hs_cg/cp_hs_hstateen0_walk",
        "SsstateenH_vs_cg/{cp_vs_sstateen0, cp_vs_senvcfg}",
      ]
  # Each standard-defined bit of a stateen CSR is WARL and may be read-only zero or one.
  - name: stateen_warl_access
    coverpoint: ["SsstateenH_hs_cg/cp_hs_hstateen0_walk"]
  # Bits in any stateen CSR that are defined to control state that a hart doesn't
  # implement are read-only zeros for that hart.
  - name: stateen_unimplemented_state_roz
    coverpoint: ["SsstateenH_hs_cg/cp_hs_hstateen0_walk"]
  # Likewise, all reserved bits not yet given a defined meaning are also read-only zeros.
  - name: stateen_reserved_roz
    coverpoint: ["SsstateenH_hs_cg/cp_hs_hstateen0_walk"]
  # For every bit in an hstateen CSR that is zero (whether read-only zero or set to zero),
  # the same bit appears as read-only zero in sstateen when accessed in VS-mode.
  - name: sstateen_vsmode_access_roz
    coverpoint: ["SsstateenH_vs_cg/cp_vs_sstateen0_roz"]
  # Likewise, bit 63 of each hstateen correspondingly controls access to the matching
  # sstateen CSR.
  - name: hstateen_bit_63_op
    coverpoint: ["SsstateenH_vs_cg/{cp_vs_sstateen0, cp_vs_stateen123}"]
  # Bit 63 of each hstateen CSR is always writable (not read-only).
  - name: hstateen_bit_63_writable
    coverpoint: ["SsstateenH_hs_cg/cp_hs_hstateen0_walk"]
  # Figure: Hypervisor State Enable 0 Register (hstateen0).
  - name: hstateen0_enc_img
    coverpoint: ["SsstateenH_hs_cg/cp_hs_hstateen0_walk"]
  # The SE0 bit in hstateen0 controls access to the sstateen0 CSR.
  - name: hstateen0_se0_op
    coverpoint: ["SsstateenH_vs_cg/cp_vs_sstateen0"]
  # The ENVCFG bit in hstateen0 controls access to the senvcfg CSRs.
  - name: hstateen0_envcfg_op
    coverpoint: ["SsstateenH_vs_cg/cp_vs_senvcfg"]
  # in VS-mode or VU-mode, attempts to access an implemented non-high-half hypervisor CSR
  # or VS CSR when the same access (read/write) would be allowed in HS-mode, assuming
  # mstatus.TVM=0;
  - name: H_virtinst_vu_vs_nonhigh_allowedhs_tvm0
    coverpoint: ["SsstateenH_{vs,vu}_cg/cp_{vs,vu}_{hstateen0, stateen123}"]
  # in VS-mode or VU-mode, if XLEN=32, attempts to access an implemented high-half
  # hypervisor CSR or high-half VS CSR when the same access (read/write) to the CSR's
  # low-half partner would be allowed in HS-mode, assuming mstatus.TVM=0;
  - name: H_virtinst_vu_vs32_high_allowedhs_tvm0
    coverpoint: ["SsstateenH_{vs,vu}_cg/cp_{vs,vu}_{hstateen0, stateen123}"]
  # in VU-mode, attempts to access an implemented non-high-half supervisor CSR when the
  # same access (read/write) would be allowed in HS-mode, assuming mstatus.TVM=0;
  - name: H_virtinst_vu_nonhigh_supervisor_allowedhs_tvm0
    coverpoint:
      ["SsstateenH_vu_cg/{cp_vu_sstateen0, cp_vu_senvcfg, cp_vu_stateen123}"]
