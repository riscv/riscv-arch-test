# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions
#
# The rules about the supervisor-level sstateen CSRs are in Ssstateen.yaml.  The rules that
# apply to every level of stateen CSR (stateen_*, stateen0_*) stay here, as does
# sstateen_vsmode_access_roz, which is about hstateen gating sstateen in VS-mode.  The hstateen
# rules map to the H groups: Smstateen_H_cg for the effects of mstateen and Ssstateen_H_cg for the
# effects of hstateen.

normative_rule_definitions:
  - name: mstateen_rv64_csrs
    coverpoint: ["{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}"]

  - name: hstateen_rv64_csrs
    coverpoint: ["Ssstateen_H_cg/{cp_hs_hstateen0_walk, cp_hs_stateen123}"]

  - name: stateen_rv32_upper_bits_csrs
    coverpoint:
      [
        "{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}",
        "Ssstateen_H_cg/{cp_hs_hstateen0_walk, cp_hs_stateen123}",
      ]

  - name: stateen_op
    coverpoint:
      [
        "{Smstateen_cg,Ssstateen_cg}/{cp_csr_illegal_accesses}",
        "Smstateen_cg/{cp_mstateen0_se0_controls_sstateen0, cp_mstateen_se_controls_sstateen123}",
        "Ssstateen_H_cg/{cp_hs_sstateen0, cp_hs_senvcfg, cp_vs_sstateen0, cp_vs_senvcfg}",
      ]

  - name: stateen_illegal_state_access
    coverpoint:
      [
        "{Smstateen_cg,Ssstateen_cg}/{cp_csr_illegal_accesses}",
        "Smstateen_cg/{cp_mstateen0_se0_controls_sstateen0, cp_mstateen_se_controls_sstateen123}",
        "Smstateen_H_cg/cp_{hs,vs,vu}_mstateen0_{se0, envcfg}",
        "Smstateen_H_cg/cp_{vs,vu}_mstateen0_p1p13",
        "Smstateen_H_cg/cp_{hs,vs,vu}_mstateen123",
        "Ssstateen_H_cg/{cp_vs_sstateen0, cp_vs_senvcfg, cp_vs_stateen123}",
        "Ssstateen_H_cg/{cp_vu_sstateen0, cp_vu_senvcfg, cp_vu_stateen123}",
      ]

  - name: stateen_implicit_state_update
    coverpoint: ["Not tested: either behavior is permitted"]

  - name: mstateen_bit_correspondence
    coverpoint: ["{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}"]

  - name: hstateen_encoding
    coverpoint:
      ["Ssstateen_H_cg/{cp_hs_hstateen0_walk, cp_vs_sstateen0, cp_vs_senvcfg}"]

  - name: stateen_warl_access
    coverpoint:
      [
        "{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}",
        "Smstateen_H_cg/{cp_hs_hstateen0_roz, cp_hs_hstateen0_walk}",
        "Ssstateen_H_cg/cp_hs_hstateen0_walk",
      ]

  - name: stateen_unimplemented_state_roz
    coverpoint:
      [
        "{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}",
        "Ssstateen_H_cg/cp_hs_hstateen0_walk",
      ]

  - name: stateen_reserved_roz
    coverpoint:
      [
        "{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}",
        "Smstateen_cg/cp_mstateen_se_controls_sstateen123",
        "Smstateen_H_cg/{cp_hs_hstateen0_roz, cp_hs_hstateen0_walk}",
        "Ssstateen_H_cg/{cp_hs_hstateen0_walk, cp_hs_stateen123, cp_vs_stateen123}",
      ]

  # For every bit in an mstateen CSR that is zero (whether read-only zero or set to
  # zero), the same bit appears as read-only zero in the matching hstateen and sstateen
  # CSRs.
  - name: mstateen_lower_priv_roz
    coverpoint:
      [
        "TODO: clear an mstateen0 bit (e.g. FCSR or JVT) and check that the matching sstateen0 bit reads zero",
        "Smstateen_H_cg/{cp_hs_hstateen0_roz, cp_m_hstateen123_bit63}",
      ]

  - name: sstateen_vsmode_access_roz
    coverpoint: ["Ssstateen_H_cg/cp_vs_sstateen0_roz"]

  - name: hstateen_ro1_bits
    coverpoint: ["Smstateen_H_cg/cp_hs_hstateen0_roz"]

  - name: mstateen_zero_initialization
    coverpoint:
      [
        "TODO: record the writable mstateen bits before the boot code writes them",
      ]

  # The hstateen half of this rule needs hypervisor tests.
  - name: mstateen_bit_63_op
    coverpoint:
      [
        "Smstateen_cg/{cp_mstateen0_se0_controls_sstateen0, cp_mstateen_se_controls_sstateen123}",
        "Smstateen_H_cg/{cp_{hs,vs,vu}_mstateen0_se0, cp_{hs,vs,vu}_mstateen123}",
      ]

  - name: hstateen_bit_63_op
    coverpoint: ["Ssstateen_H_cg/{cp_vs_sstateen0, cp_vs_stateen123}"]

  # The mstateen1-3 walks check bit 63 against the configured SE1-SE3 (writable or
  # read-only zero), and the sstateen1-3 walks check that those CSRs are all zeros.
  - name: mstateen_bit_63_roz
    coverpoint:
      [
        "{Smstateen_cg,Ssstateen_cg}/{cp_walking_ones}",
        "Smstateen_H_cg/cp_m_hstateen123_bit63",
      ]

  - name: hstateen_bit_63_writable
    coverpoint:
      [
        "Smstateen_H_cg/{cp_hs_hstateen0_roz, cp_hs_hstateen0_walk, cp_m_hstateen123_bit63}",
        "Ssstateen_H_cg/{cp_hs_hstateen0_walk, cp_hs_stateen123}",
      ]

  # Figure: Machine State Enable 0 Register (mstateen0).
  - name: mstateen0_enc_img
    coverpoint: ["Smstateen_cg/cp_walking_ones"]

  # Figure: Hypervisor State Enable 0 Register (hstateen0).
  - name: hstateen0_enc_img
    coverpoint:
      [
        "Smstateen_H_cg/cp_hs_hstateen0_walk",
        "Ssstateen_H_cg/cp_hs_hstateen0_walk",
      ]

  - name: stateen0_c_op
    coverpoint: ["Not tested: custom state is non-standard and not certified"]

  - name: stateen0_fcsr_op
    coverpoint:
      ["Smstateen_cg/{cp_fcsr, cp_fcsr_lower}", "Ssstateen_cg/cp_fcsr_lower"]

  - name: mstateen0_fcsr_roz
    coverpoint: ["Smstateen_cg/cp_fcsr_ro_zero"]

  - name: stateen0_fcsr0_misa_f0_illegal_fpu_instr
    coverpoint:
      ["{Smstateen_cg,Ssstateen_cg}/{cp_fcsr_lower, cp_fcsr_fp_instrs}"]

  - name: stateen0_jvt_op
    coverpoint: ["Smstateen_cg/cp_jvt_access", "Ssstateen_cg/cp_jvt"]

  - name: mstateen0_se0_op
    coverpoint:
      [
        "Smstateen_cg/cp_mstateen0_se0_controls_sstateen0",
        "Smstateen_H_cg/cp_{hs,vs,vu}_mstateen0_se0",
      ]

  - name: hstateen0_se0_op
    coverpoint:
      ["Smstateen_H_cg/cp_vs_mstateen0_se0", "Ssstateen_H_cg/cp_vs_sstateen0"]

  - name: mstateen0_envcfg_op
    coverpoint:
      [
        "Smstateen_cg/cp_envcfg",
        "Smstateen_H_cg/cp_{hs,vs,vu}_mstateen0_envcfg",
      ]

  - name: hstateen0_envcfg_op
    coverpoint:
      ["Smstateen_H_cg/cp_vs_mstateen0_envcfg", "Ssstateen_H_cg/cp_vs_senvcfg"]

  - name: mstateen0_csrind_op
    coverpoint:
      [
        "TODO: mstateen0.CSRIND gating of siselect, sireg*, vsiselect, and vsireg*",
      ]

  - name: hstateen0_csrind_op
    coverpoint:
      [
        "Not tested: Sail does not model Sscsrind, and its hstateen0 has no CSRIND bit",
      ]

  - name: mstateen0_imsic_op
    coverpoint: ["Smstateen_cg/cp_imsic"]

  - name: hstateen0_imsic_op
    coverpoint:
      [
        "Not tested: Sail does not model Ssaia or an IMSIC, and its hstateen0 has no IMSIC bit",
      ]

  - name: mstateen0_aia_op
    coverpoint: ["Smstateen_cg/cp_aia"]

  - name: hstateen0_aia_op
    coverpoint:
      [
        "Not tested: Sail does not model Ssaia, and its hstateen0 has no AIA bit",
      ]

  - name: mstateen0_context_op
    coverpoint: ["Smstateen_cg/cp_context"]

  - name: hstateen0_context_op
    coverpoint:
      [
        "Needs Sdtrig with H; deferred to the SdtrigH suite on the hypervisor branch",
      ]

  - name: mstateen0_p1p13_op
    coverpoint:
      ["Smstateen_cg/cp_p1p13", "Smstateen_H_cg/cp_{vs,vu}_mstateen0_p1p13"]

  - name: mstateen0_srmcfg_op
    coverpoint: ["Smstateen_cg/cp_srmcfg"]

  - name: mstateen_ctr1
    coverpoint: ["Smstateen_cg/cp_ctr"]

  - name: mstateen_ctr0
    coverpoint: ["Smstateen_cg/cp_ctr"]

  # in VS-mode or VU-mode, attempts to access an implemented non-high-half hypervisor CSR
  # or VS CSR when the same access (read/write) would be allowed in HS-mode, assuming
  # mstatus.TVM=0;
  - name: H_virtinst_vu_vs_nonhigh_allowedhs_tvm0
    coverpoint:
      [
        "Smstateen_H_cg/cp_{vs,vu}_mstateen0_{se0, envcfg}",
        "Ssstateen_H_cg/cp_{vs,vu}_{hstateen0, stateen123}",
      ]

  # in VS-mode or VU-mode, if XLEN=32, attempts to access an implemented high-half
  # hypervisor CSR or high-half VS CSR when the same access (read/write) to the CSR's
  # low-half partner would be allowed in HS-mode, assuming mstatus.TVM=0;
  - name: H_virtinst_vu_vs32_high_allowedhs_tvm0
    coverpoint:
      [
        "Smstateen_H_cg/cp_{vs,vu}_mstateen0_{se0, envcfg, p1p13}",
        "Ssstateen_H_cg/cp_{vs,vu}_{hstateen0, stateen123}",
      ]

  # in VU-mode, attempts to access an implemented non-high-half supervisor CSR when the
  # same access (read/write) would be allowed in HS-mode, assuming mstatus.TVM=0;
  - name: H_virtinst_vu_nonhigh_supervisor_allowedhs_tvm0
    coverpoint:
      [
        "Smstateen_H_cg/cp_vu_mstateen0_{se0, envcfg}",
        "Ssstateen_H_cg/{cp_vu_sstateen0, cp_vu_senvcfg, cp_vu_stateen123}",
      ]

  # If the H extension is implemented and mstateen0.CTR=1, the hstateen0.CTR bit controls access to supervisor
  # CTR state when V=1; VS-mode accesses with hstateen0.CTR=0 raise a virtual-instruction exception, and qualified
  # control transfers keep updating the entry registers.
  - names: [hstateen_ctr, hstateen_vs, hstateen0_ctr0_v1_op]
    coverpoint: ["Not tested: Sail does not model Smctr or Ssctr"]
