      Same as above, but s/mstatus.MXR=0 applies for VS mode

      Test Case: Attempt read access in VS mode with PTE: R=0, W=0, X=1 Set PTE.U=1 to allow user mapping under VS
    expectation: Load page fault expected at VS-stage Trap visible in HS as virtual instruction trap
  - name: Execute-only PTE read access with MXR=0, VU-stage, VS-mode
    goal: Ensure exception behavior is consistent across all supported virtual memory configurations.
    description: |-
      Ensures guest user access follows VS-stage semantics
      Same test setup as above

      Test Case: In VU mode, attempt read access on execute-only mapping
    expectation: Load page fault raised at VS-stage Propagates to HS
    bins: |-
      Read (should fault)

      Execute (should succeed, no trap)
  - name: Second stage translation of GPA with execute-only mapping and MXR=0, HS-mode, G-stage
    goal: Confirm that read attempts raise an exception while execute works fine.
    description: |-
      Ensures G-stage honors MXR restrictions when translating GPAs for HS-mode
      - hgatp.mode = sv32x4, sv39x4 - Leaf G-stage PTE with R=0, W=0, X=1 - hstatus.MXR=0

      HS attempts to read GPA mapped execute-only
    expectation: Load page fault raised at G-stage Trap in HS with correct mcause
    bins: |-
      PTE.U=0 with access from Supervisor/HS/VS

      PTE.U=1 with access from U/VU
