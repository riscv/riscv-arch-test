# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # Floating-point operations use either a static rounding mode encoded in the
  # instruction, or a dynamic rounding mode held in frm. Rounding modes are encoded as
  # shown in &lt;&lt;norm:dyn_round_enc&gt;&gt;. A value of 111 in the instruction's rm
  # field selects the dynamic rounding mode held in frm
  - name: roundingmode_dynamic
    # Representative: static rm (cp_frm_*) and dyn with every frm value (cp_csr_frm)
    coverpoint:
      [
        "D_fadd_d_cg/{cp_frm_3, cp_csr_frm}",
        "{D_fsqrt_d_cg, D_fcvt_s_d_cg}/cp_csr_frm",
      ]
  # Rounding Mode|Mnemonic|Meaning === 000|RNE|Round to Nearest, ties to
  # Even¶001|RTZ|Round towards Zero¶010|RDN|Round Down (towards −∞)¶011|RUP|Round Up
  # (towards +∞)¶100|RMM|Round to Nearest, ties to Max Magnitude¶101||Reserved for
  # future use.¶110||Reserved for future use.¶111|DYN|In instruction&#8217;s rm field,
  # selects dynamic rounding mode; In Rounding Mode register, reserved. ===
  - name: dyn_round_enc
    # Representative: every legal rm and frm encoding with double-precision operations
    coverpoint:
      [
        "D_fadd_d_cg/{cp_frm_3, cp_csr_frm}",
        "D_fmadd_d_cg/{cp_frm_4, cp_csr_frm}",
      ]
  # Operations on subnormal numbers are handled in accordance with IEEE 754-2008.
  - name: ieee_std_subnormal
    # Representative coverpoints; apply to the other D covergroups' subnormal edges too
    coverpoint:
      [
        "{D_fadd_d_cg, D_fmul_d_cg}/cr_fs1_fs2_edges_frm_D",
        "D_fclass_d_cg/cp_fclass",
        "ZicsrF_cg/cp_underflow_after_rounding_fma_d",
      ]
  # In the parlance of IEEE 754-2008, tininess is detected after rounding.
  - name: ieee_std_tininess
    # D's edge crosses have no result that is tiny before but not after rounding; ZicsrF has directed cases
    coverpoint:
      [
        "ZicsrF_cg/{cp_underflow_after_rounding_fma_d, cp_underflow_after_rounding_fmul_d, cp_underflow_after_rounding_fcvt_s_d}",
      ]
  # If the rounded result is not representable in the destination format, it is clipped
  # to the nearest value and the invalid flag is set
  - name: fcvt_unrepresentable_nv
    # Only double-to-integer conversions apply: every integer is representable in binary64
    coverpoint:
      [
        "{D_fcvt_w_d_cg, D_fcvt_wu_d_cg, D_fcvt_l_d_cg, D_fcvt_lu_d_cg}/cr_fs1_edges_frm_D",
      ]
  # All floating-point to integer and integer to floating-point conversion instructions
  # round according to the rm field.
  - name: fcvt_round
    # Representative: fcvt.d.w and fcvt.d.wu are exact and never round
    coverpoint:
      [
        "{D_fcvt_w_d_cg, D_fcvt_l_d_cg}/cr_fs1_edges_frm_D",
        "{D_fcvt_d_l_cg, D_fcvt_d_lu_cg}/cp_frm_2",
      ]
  # All floating-point conversion instructions set the Inexact exception flag if the
  # rounded result differs from the operand value and the Invalid exception flag is not
  # set.
  - name: fcvt_nx
    # Representative coverpoints; apply to the other conversions too
    coverpoint:
      [
        "D_fcvt_w_d_cg/{cr_fs1_edges_frm_D, cp_csr_fflags_vn}",
        "D_fcvt_s_d_cg/{cr_fs1_edges_frm_D, cp_csr_fflags_voun}",
      ]
  # For double-precision floating-point, the canonical NaN corresponds to the pattern
  # 0x7ff8000000000000.
  - name: D_canonical_nan
    # Representative coverpoints; apply to the other D covergroups' NaN-producing edges too
    coverpoint:
      [
        "{D_fadd_d_cg, D_fdiv_d_cg}/cr_fs1_fs2_edges_frm_D",
        "D_fsqrt_d_cg/cp_fs1_edges_D",
        "D_fmin_d_cg/cr_fs1_fs2_edges_D",
      ]
  # The ext:d[] extension widens the 32 floating-point registers,
  # f0&amp;#8205;&amp;#8211;&amp;#8205;f31, to 64 bits, i.e., FLEN=64.
  - name: D_flen_64
    coverpoint:
      ["D_fadd_d_cg/cr_fs1_fs2_edges_frm_D", "D_fld_cg/cp_memval_fp_double"]
  # When multiple floating-point precisions are supported, then valid values of narrower
  # n-bit types, n&lt;FLEN, are represented in the lower n bits of an FLEN-bit NaN
  # value, in a process termed NaN-boxing. The upper bits of a valid NaN-boxed value
  # must be all 1s. Valid NaN-boxed n-bit values therefore appear as negative quiet NaNs
  # (qNaNs) when viewed as any wider m-bit value, n &lt; m ≤ FLEN. Any operation that
  # writes a narrower result to an f register must write all 1s to the uppermost FLEN-n
  # bits to yield a legal NaN-boxed value.
  - name: fp_nan_boxing
    # Representative coverpoints; apply to the other cp_NaNBox_D_S coverpoints too
    coverpoint:
      ["{D_fadd_s_cg, D_fcvt_s_d_cg, D_flw_cg, D_fmv_w_x_cg}/cp_NaNBox_D_S"]
  # A narrower n-bit transfer, n&lt;FLEN, into the f registers will create a valid
  # NaN-boxed value
  - name: fp_transfer_instrs_narrow_transfer_in
    coverpoint: ["{D_flw_cg, D_fmv_w_x_cg}/cp_NaNBox_D_S"]
  # A narrower n-bit transfer out of the floating-point registers will transfer the
  # lower n bits of the register ignoring the upper FLEN-n bits
  - name: fp_transfer_instrs_narrow_transfer_out
    coverpoint: ["D_fsw_cg/cp_fs2_badNB_D_S", "D_fmv_x_w_cg/cp_fs1_badNB_D_S"]
  # Apart from transfer operations described in the previous paragraph, all other
  # floating-point operations on narrower n-bit operations, n&lt;FLEN, check if the
  # input operands are correctly NaN-boxed, i.e., all upper FLEN-n bits are 1. If so,
  # the n least-significant bits of the input are used as the input value, otherwise the
  # input value is treated as an n-bit canonical NaN.
  - name: fp_nontransfer_instrs_improper_nan_boxed_input
    # Representative coverpoints; apply to the other cp_fs*_badNB_D_S coverpoints too
    coverpoint:
      [
        "D_fadd_s_cg/{cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "D_fmadd_s_cg/cp_fs3_badNB_D_S",
        "D_fsqrt_s_cg/cp_fs1_badNB_D_S",
      ]
  # The insn:fld[] instruction loads a double-precision floating-point value from memory
  # into floating-point register rd
  - name: fld_op
    coverpoint:
      ["D_fld_cg/{cp_rs1_nx0, cp_imm_edges, cp_fd, cp_memval_fp_double}"]
  # insn:fsd[] stores a double-precision value from the floating-point registers to
  # memory
  - name: fsd_op
    coverpoint: ["D_fsd_cg/{cp_rs1_nx0, cp_imm_edges, cp_fs2, cp_fs2_edges}"]
  # insn:fld[] and insn:fsd[] are only guaranteed to execute atomically if the effective
  # address is naturally aligned and XLEN≥64.
  - name: fld_fsd_atomic_align
    coverpoint:
      ["Not tested: atomicity is not observable in single-hart signature tests"]
  # insn:fld[] and insn:fsd[] do not modify the bits being transferred; in particular,
  # the payloads of non-canonical NaNs are preserved.
  - name: fld_fsd_bits_maintained
    # Every D result is stored with fsd, so the fld NaN payloads also pass through fsd
    coverpoint: ["D_fld_cg/cp_memval_fp_double"]
  # The double-precision floating-point computational instructions are defined
  # analogously to their single-precision counterparts, but operate on double-precision
  # operands and produce double-precision results.
  - name: D_computational_instrs
    # Representative coverpoints; apply to the other D computational covergroups too
    coverpoint:
      [
        "{D_fadd_d_cg, D_fdiv_d_cg}/cr_fs1_fs2_edges_frm_D",
        "D_fmadd_d_cg/cr_fs1_fs2_edges_frm4_D",
        "D_fsqrt_d_cg/cp_fs1_edges_D",
      ]
  # insn:fcvt.w.d[] or insn:fcvt.l.d[] converts a double-precision floating-point number
  # in floating-point register rs1 to a signed 32-bit or 64-bit integer, respectively,
  # in integer register rd
  - name: fcvt-w-d_fcvt-l-d_op
    coverpoint: ["{D_fcvt_w_d_cg, D_fcvt_l_d_cg}/{cp_rd, cr_fs1_edges_frm_D}"]
  # insn:fcvt.d.w[] or insn:fcvt.d.l[] converts a 32-bit or 64-bit signed integer,
  # respectively, in integer register rs1 into a double-precision floating-point number
  # in floating-point register rd
  - name: fcvt-d-w_fcvt-d-l_op
    coverpoint: ["{D_fcvt_d_w_cg, D_fcvt_d_l_cg}/{cp_fd, cp_rs1_edges}"]
  # insn:fcvt.wu.d[], insn:fcvt.lu.d[], insn:fcvt.d.wu[], and insn:fcvt.d.lu[] variants
  # convert to or from unsigned integer values
  - name: fcvt-wu-d_fcvt-lu-d_fcvt-d-wu_fcvt-d-lu_op
    coverpoint:
      [
        "{D_fcvt_wu_d_cg, D_fcvt_lu_d_cg}/cr_fs1_edges_frm_D",
        "{D_fcvt_d_wu_cg, D_fcvt_d_lu_cg}/cp_rs1_edges",
      ]
  # For RV64, insn:fcvt.w.d[] and insn:fcvt.wu.d[] sign-extend the 32-bit result
  - name: fcvt-w-d_fcvt-wu-d_sign_ext
    coverpoint: ["{D_fcvt_w_d_cg, D_fcvt_wu_d_cg}/cr_fs1_edges_frm_D"]
  # insn:fcvt.l.d[], fcvt.lu.d[], fcvt.d.l[], and fcvt.d.lu[] are RV64-only
  # instructions.
  - name: fcvt_long_double_rv64_only
    # These covergroups exist only on RV64
    coverpoint:
      [
        "{D_fcvt_l_d_cg, D_fcvt_lu_d_cg, D_fcvt_d_l_cg, D_fcvt_d_lu_cg}/cp_asm_count",
      ]
  # The range of valid inputs for insn:fcvt.w.d[], insn:fcvt.wu.d[], insn:fcvt.l.d[],
  # and insn:fcvt.lu.d[] and the behavior of these instructions for invalid inputs are
  # the same as for insn:fcvt.w.s[], insn:fcvt.wu.s[], insn:fcvt.l.s[], and
  # insn:fcvt.lu.s[]
  - name: fcvt_int_double_valid_input
    coverpoint:
      [
        "{D_fcvt_w_d_cg, D_fcvt_wu_d_cg, D_fcvt_l_d_cg, D_fcvt_lu_d_cg}/cr_fs1_edges_frm_D",
      ]
  # The double-precision to single-precision and single-precision to double-precision
  # conversion instructions, insn:fcvt.s.d[] and insn:fcvt.d.s[], are encoded in the
  # OP-FP major opcode space and both the source and destination are floating-point
  # registers. The rs2 field encodes the datatype of the source, and the fmt field
  # encodes the datatype of the destination
  - name: fcvt-s-d_fcvt-d-s_op
    coverpoint:
      [
        "D_fcvt_s_d_cg/{cp_fd, cr_fs1_edges_frm_D}",
        "D_fcvt_d_s_cg/{cp_fd, cp_fs1_edges}",
      ]
  # insn:fcvt.s.d[] rounds according to the rm field; insn:fcvt.d.s[] will never round
  - name: fcvt_float_rounding
    coverpoint:
      [
        "D_fcvt_s_d_cg/cr_fs1_edges_frm_D",
        "D_fcvt_d_s_cg/{cp_fs1_edges, cp_csr_fflags_v}",
        "ZicsrF_cg/cp_underflow_after_rounding_fcvt_s_d",
      ]
  # Floating-point to floating-point sign-injection instructions, insn:fsgnj.d[],
  # insn:fsgnjn.d[], and insn:fsgnjx.d[], are defined analogously to the
  # single-precision sign-injection instruction.
  - name: fsgnj-d_fsgnjn-d_fsgnjx-d_op
    coverpoint:
      ["{D_fsgnj_d_cg, D_fsgnjn_d_cg, D_fsgnjx_d_cg}/cr_fs1_fs2_edges_D"]
  # insn:fmv.x.d[] moves the double-precision value in floating-point register rs1 to a
  # representation in the IEEE 754-2008 encoding in integer register rd
  - name: fmv-x-d_op
    coverpoint: ["D_fmv_x_d_cg/{cp_rd, cp_fs1, cp_fs1_edges_D}"]
  # insn:fmv.d.x[] moves the double-precision value encoded in the IEEE 754-2008
  # encoding from the integer register rs1 to the floating-point register rd
  - name: fmv-d-x_op
    coverpoint: ["D_fmv_d_x_cg/{cp_rs1, cp_rs1_edges, cp_fd}"]
  # insn:fmv.x.d[] and insn:fmv.d.x[] do not modify the bits being transferred; in
  # particular, the payloads of non-canonical NaNs are preserved.
  - name: fmv_bits_preserved
    coverpoint: ["D_fmv_x_d_cg/cp_fs1_edges_D", "D_fmv_d_x_cg/cp_rs1_edges"]
  # The double-precision floating-point compare instructions are defined analogously to
  # their single-precision counterparts, but operate on double-precision operands.
  - name: D_compare_instrs
    coverpoint:
      [
        "{D_feq_d_cg, D_flt_d_cg, D_fle_d_cg}/cr_fs1_fs2_edges_D",
        "D_feq_d_cg/cp_csr_fflags_v",
      ]
  # The double-precision floating-point classify instruction, insn:fclass.d[], is
  # defined analogously to its single-precision counterpart, but operates on
  # double-precision operands.
  - name: fclass-d_op
    coverpoint: ["D_fclass_d_cg/{cp_rd, cp_fs1, cp_fs1_edges_D, cp_fclass}"]
