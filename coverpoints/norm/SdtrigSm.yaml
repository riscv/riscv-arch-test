  - name: Sdtrig_etrigger_vu
    coverpoint: ["Hypervisor extension not implemented, so not testable"]

  # When set, enable this trigger for exceptions that are taken from M mode.
  - name: Sdtrig_etrigger_m
    coverpoint: ["SdtrigSm_etrigger_cg/cp_sdtrig_etrigger"]

  # When set, enable this trigger for exceptions that are taken from S/HS mode. This
  # bit is hard-wired to 0 if the hart does not support S-mode.
  - name: Sdtrig_etrigger_s
    coverpoint: ["SdtrigSm_etrigger_cg/cp_sdtrig_etrigger"]

  # When set, enable this trigger for exceptions that are taken from U mode. This
  # bit is hard-wired to 0 if the hart does not support U-mode.
  - name: Sdtrig_etrigger_u
    coverpoint: ["SdtrigSm_etrigger_cg/cp_sdtrig_etrigger"]

  # This register provides access to the trigger selected by tselect.
  - name: Sdtrig_tmexttrigger
    coverpoint:
