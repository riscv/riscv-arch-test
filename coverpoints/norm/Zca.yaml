# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # The C extension depends upon the Zca extension.
  - name: C_dep_Zca
    coverpoint:
      [
        "Configuration requirement: C requires Zca; checked by UDB (https://github.com/riscv/riscv-unified-db/blob/main/spec/std/isa/ext/C.yaml[ext/C.yaml]).",
      ]
  - name: Zca_offsets_mul2
    # Representative: offsets that are multiples of 2 but not 4, for jumps and branches
    coverpoint:
      [
        "Zca_c_j_cg/{cp_imm_edges_c_jal}",
        "Zca_c_beqz_cg/{cp_imm_edges_c_branch}",
      ]

  # === inst[15:13] inst[1:0]|000|001|010|011|100|101|110|111|¶ 00|ADDI4SPN|FLD FLD|LW|FLW
  # LD|Reserved|FSD FSD|SW|FSW SD|RV32 RV64¶ 01|ADDI|JAL
  # ADDIW|LI|LUI/ADDI16SP|MISC-ALU|J|BEQZ|BNEZ|RV32 RV64¶ 10|SLLI|FLDSP FLDSP|LWSP|FLWSP
  # LDSP|J[AL]R/MV/ADD|FSDSP FSDSP|SWSP|FSWSP SDSP|RV32 RV64¶ 11|>16b ===
  - name: Zca_opcode_map_tbl
    # cp_compressed00 executes the reserved encodings in quadrant 0
    coverpoint:
      [
        "Zca_c_*_cg/cp_asm_count",
        "Zc{d,f}_c_*_cg/cp_asm_count",
        "Ssstrict_S_comp_instr_cg/cp_compressed00",
      ]

  # Instruction|Constraints|Code Points|Purpose === insn:c.nop[]|imm≠0|63|Designated for future
  # standard use¶ insn:c.addi[]|rd≠x0, imm=0|31¶ insn:c.li[]|rd=x0|64¶ insn:c.lui[]|rd=x0, imm≠0|63¶
  # insn:c.mv[]|rd=x0, rs2≠x0|31¶ insn:c.add[]|rd=x0, rs2≠x0, rs2≠x2-x5|27¶ insn:c.add[]|rd=x0,
  # rs2=x2-x5|4|(rs2=x2) insn:c.ntl.p1[] (rs2=x3) insn:c.ntl.pall[] (rs2=x4) insn:c.ntl.s1[]
  # (rs2=x5) insn:c.ntl.all[]¶ insn:c.slli[]|rd=x0 or shamt=0|63 (RV32), 95 (RV64)|Designated for
  # custom use¶ insn:c.srli[]|shamt=0|8¶ insn:c.srai[]|shamt=0|8 ===
  - name: Zca_hints_tbl
    coverpoint:
      [
        "Zca_c_add_cg/cp_c_hint_add",
        "Zca_c_addi_cg/cp_c_hint_addi",
        "Zca_c_li_cg/cp_c_hint_li",
        "Zca_c_lui_cg/cp_c_hint_lui",
        "Zca_c_mv_cg/cp_c_hint_mv",
        "Zca_c_nop_cg/cp_c_hint_nop",
        "Needs test: the custom-use HINTs C.SLLI with rd=x0 or shamt=0, and C.SRLI and C.SRAI with shamt=0.",
      ]

  - name: Zca_regs8
    # Use a representative coverpoint; applies to others too
    coverpoint: ["Zca_c_and_cg/{cp_rs1_p, cp_rs2_p}"]
  - name: c-add_op
    coverpoint: ["Zca_c_add_cg/{cp_rs1_nx0, cp_rs2_nx0, cr_rs1_rs2_edges}"]
  - name: c-add_val
    coverpoint: ["Zca_c_add_cg/{cp_rs1_nx0, cp_rs2_nx0}"]
  - name: c-addi16sp_op
    coverpoint: ["Zca_c_addi16sp_cg/{cp_imm_mul_addi16sp}"]
  - name: c-addi4spn_op
    coverpoint: ["Zca_c_addi4spn_cg/{cp_imm_mul_addi4spn}"]
  - name: c-addi_nop
    coverpoint: ["Zca_c_nop_cg/{cp_asm_count_nop, cp_c_hint_nop}"]
  - name: c-addi_op
    coverpoint: ["Zca_c_addi_cg/{cp_rs1_nx0, cr_rs1_imm_edges_6bit_n0}"]
  - name: c-addiw_op
    coverpoint: ["Zca_c_addiw_cg/{cp_rs1_nx0, cr_rs1_imm_edges_6bit}"]
  - name: c-addw_op
    coverpoint: ["Zca_c_addw_cg/{cp_rs1_p, cp_rs2_p, cr_rs1_rs2_edges}"]
  - name: c-and_op
    coverpoint: ["Zca_c_and_cg/{cp_rs1_p, cp_rs2_p, cr_rs1_rs2_edges}"]
  - name: c-andi_op
    coverpoint: ["Zca_c_andi_cg/{cp_rs1_p, cr_rs1_imm_edges_6bit}"]
  - name: c-beqz_op
    coverpoint:
      [
        "Zca_c_beqz_cg/{cp_rs1_p, cp_rs1_edges, cp_offset, cp_imm_edges_c_branch}",
      ]
  - name: c-bnez_op
    coverpoint:
      [
        "Zca_c_bnez_cg/{cp_rs1_p, cp_rs1_edges, cp_offset, cp_imm_edges_c_branch}",
      ]
  - name: c-j_op
    coverpoint: ["Zca_c_j_cg/{cp_imm_edges_c_jal}"]
  - name: c-jal_op
    coverpoint: ["Zca_c_jal_cg/{cp_imm_edges_c_jal}"]
  - name: c-jalr_op
    coverpoint: ["Zca_c_jalr_cg/{cp_rs1_nx0, cp_offset_lsbs}"]
  - name: c-jr_op
    coverpoint: ["Zca_c_jr_cg/{cp_rs1_nx0, cp_offset_lsbs}"]
  - name: c-ld_op
    coverpoint:
      ["Zca_c_ld_cg/{cp_rs1_p, cp_rd_p, cp_imm_mul_8, cp_memval_double}"]
  - name: c-ldsp_op
    coverpoint: ["Zca_c_ldsp_cg/{cp_rd_nx0, cp_imm_mul_8sp, cp_memval_double}"]
  - name: c-li_op
    coverpoint: ["Zca_c_li_cg/{cp_rs1_nx0, cp_imm_edges_6bit}"]
  - name: c-lui_op
    coverpoint: ["Zca_c_lui_cg/{cp_rs1_nx2, cp_imm_edges_6bit_n0}"]
  - name: c-lw_op
    coverpoint: ["Zca_c_lw_cg/{cp_rs1_p, cp_rd_p, cp_imm_mul, cp_memval_word}"]
  - name: c-lwsp_op
    coverpoint: ["Zca_c_lwsp_cg/{cp_rd_nx0, cp_imm_mul_4sp, cp_memval_word}"]
  - name: c-mv_jr
    coverpoint: ["Zca_c_jr_cg/{cp_rs1_nx0, cp_offset_lsbs}"]
  - name: c-mv_op
    coverpoint: ["Zca_c_mv_cg/{cp_rd_nx0, cp_rs2_nx0}"]
  - name: c-nop_op
    coverpoint: ["Zca_c_nop_cg/{cp_asm_count_nop}"]
  - name: c-or_op
    coverpoint: ["Zca_c_or_cg/{cp_rs1_p, cp_rs2_p, cr_rs1_rs2_edges}"]
  - name: c-sd_op
    coverpoint: ["Zca_c_sd_cg/{cp_rs1_p, cp_rs2_p, cp_rs2_edges, cp_imm_mul_8}"]
  - name: c-sdsp_op
    coverpoint: ["Zca_c_sdsp_cg/{cp_rs2, cp_rs2_edges, cp_imm_mul_8sp}"]
  - name: c-slli_op
    coverpoint: ["Zca_c_slli_cg/{cp_rs1_nx0, cr_rs1_imm_edges_c}"]
  - name: c-slli_shamt5
    coverpoint: ["Zca_c_slli_cg/{cp_uimm_n0}"]
  - name: c-srai_op
    coverpoint: ["Zca_c_srai_cg/{cp_rs1_p, cr_rs1_imm_edges_c}"]
  - name: c-srli_op
    coverpoint: ["Zca_c_srli_cg/{cp_rs1_p, cr_rs1_imm_edges_c}"]
  - name: c-srli_shamt5
    coverpoint: ["Zca_c_srli_cg/{cp_uimm_n0}"]
  - name: c-sub_op
    coverpoint: ["Zca_c_sub_cg/{cp_rs1_p, cp_rs2_p, cr_rs1_rs2_edges}"]
  - name: c-subw_op
    coverpoint: ["Zca_c_subw_cg/{cp_rs1_p, cp_rs2_p, cr_rs1_rs2_edges}"]
  - name: c-sw_op
    coverpoint: ["Zca_c_sw_cg/{cp_rs1_p, cp_rs2_p, cp_rs2_edges, cp_imm_mul}"]
  - name: c-swsp_op
    coverpoint: ["Zca_c_swsp_cg/{cp_rs2, cp_rs2_edges, cp_imm_mul_4sp}"]
  - name: c-xor_op
    coverpoint: ["Zca_c_xor_cg/{cp_rs1_p, cp_rs2_p, cr_rs1_rs2_edges}"]

  # compressed Zca_hints
  - name: Zca_hints
    coverpoint: ["Zca_c_add_cg/{cp_c_hint_add}"] # representative
  - name: c-add_hint
    coverpoint: ["Zca_c_add_cg/{cp_c_hint_add}"]
  - name: c-addi_hint
    coverpoint: ["Zca_c_addi_cg/{cp_c_hint_addi}"]
  - name: c-li_hint
    coverpoint: ["Zca_c_li_cg/{cp_c_hint_li}"]
  - name: c-lui_hint
    coverpoint: ["Zca_c_lui_cg/{cp_c_hint_lui}"]
  - name: c-mv_hint
    coverpoint: ["Zca_c_mv_cg/{cp_c_hint_mv}"]
  - name: c-nop_hint
    coverpoint: ["Zca_c_nop_cg/{cp_c_hint_nop}"]
  - name: c-slli_hint
    coverpoint:
      [
        "Needs test: execute these HINT encodings and check that they change no register or memory state.",
      ]
  # The insn:c.srli[] code points with shamt=0 are HINTs.
  - name: c-srli_hint
    coverpoint:
      [
        "Needs test: execute these HINT encodings and check that they change no register or memory state.",
      ]
