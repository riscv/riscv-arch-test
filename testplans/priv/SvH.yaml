    id: H_vm_gpatrans
  - name: RWX access on Umode pages in Umode
    goal: RWX access permissions when U=1 in user mode across both guest (Stage-1) and host (Stage-2) translations.
    description: |-
      Stage-1 (Guest PTEs):• If PTE.U=1, user mode can access the page.• Access type must match granted permissions (R, W, X).• If disallowed, raise a Stage-1 page fault:– Instruction page fault (exec)– Load page fault (read)– Store/AMO page fault (write).• Valid for leaf PTEs at all levels (L0–L3 depending on satp.mode).• Test with both granted and denied RWX combinations.

      Stage-2 (Host PTEs for Guest Physical → Host Physical):• Even if Stage-1 grants permission, Stage-2 translation must also allow RWX access.• Stage-2 applies permission checks independently (e.g., R/W/X bits in VS-level PTE).• If Stage-2 denies, trap must occur even if Stage-1 allows.• Test at all levels with valid leaf PTE, ensuring PTE.U in guest context is honored only if Stage-2 permits corresponding access.• Both Stage-1 and Stage-2 faults are possible.
    expectation: |-
      • Access succeeds if Stage-1 PTE grants permission and the U=1 condition matches user mode.• Faults raised if permission bit is 0.• m/scause = page fault exception according to access type.• m/sepc = virtual address of trapping instruction.

      • Even if Stage-1 succeeds, access only completes if Stage-2 allows.• If Stage-2 denies, fault occurs with exception type tied to access (instruction/load/store page fault).• Serves as an extra permission filter on top of Stage-1.
    bins: RWX bins (for each stage):1. Read allowed (R=1), denied (R=0).2. Write allowed (W=1 & R=1), denied (W=0).3. Exec allowed (X=1), denied (X=0).4. Combinations where Stage-1 allows but Stage-2 denies (mismatched permissions).5. Different satp.modes (sv32, sv39, sv48, sv57).6. Faults at leaf level with higher levels cleared except V=1.
  - name: PTE with only X=1 and MXR=0, VS-stage, HS-mode
    goal: enforcement of MXR=0 across all relevant privilege modes.
    description: |-
      Verifies that supervisor attempts to read from execute-only page cause load page fault at VS-stage translation
      - satp.mode = sv32, sv39 - Valid leaf PTE (R=0, W=0, X=1) - s/mstatus.MXR=0 - PMP permissions allow access if enabled

      Test Case: Attempt read access in HS mode - For leaf PTEs at all levels - Set higher-level PTEs to only V=1 so resolution reaches target leaf
    expectation: Load page fault must be raised m/scause = Load Page Fault m/sepc = faulting VA instruction
  - name: PTE with only X=1 and MXR=0, VS-stage, VS-mode
