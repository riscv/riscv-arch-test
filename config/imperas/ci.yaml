# CI configuration for Imperas simulator
# Imperas is proprietary and cannot run in public CI.

ci_enabled: false
# These exclusions don't affect CI because it doesn't run, but they help tracking incomplete features.
# The list is for the Imperas-HMC101126-eng-build of the Imperas RISC-V model (HMC's fixes for the Solvnet cases
# below; at HMC: export IMPERAS_VLNV=/proj/wally/imperas/Imperas-HMC101126-eng-build/lib/Linux64/ImperasLib).
# Entries marked "fixed in Imperas-HMC101126-eng-build" fail on stock ImperasDV Y-2026.06-DEV-20261106 but pass with
# that engineering build, so they are commented out. Uncomment them when running stock ImperasDV. Cases fixed in
# Y-2026.06-DEV-20261106 are no longer listed; Y-2026.09 still needs their exclusions.
exclude_extensions:
  # rv64-max, rv32gck, rv32gcv: no scontext/hcontext bits, but Sail 0.16 has fixed context widths
  # (https://github.com/riscv/sail-riscv/issues/2054); drop after the Sail bump sets the widths.
  - Smstateen
  - Ssstateen
  # https://solvnetplus.synopsys.com/s/case/500WQ00002CEtpVYAT/vmvnrrv-interprets-vstart-in-8bit-elements-instead-of-sew-elements-when-sew-8
  # vmv<nr>r.v counts vstart in bytes instead of SEW elements (ExceptionsVx, cp_vstart, SEW=16 bins)
  # (fixed in Imperas-HMC101126-eng-build)
  # - ExceptionsVx
  # Stock only: an icount trigger that fires with action=0 writes the PC to xtval
  # instead of zero (norm:Sdtrig_icount_action0), so tests in which an icount trigger fires fail:
  # https://solvnetplus.synopsys.com/s/case/500WQ00002BsufNYAR/an-icount-trigger-that-fires-with-action0-writes-the-pc-to-mtval-instead-of-zero
  # (fixed in Imperas-HMC101126-eng-build). rv64-max/-m/-mu: select=1 data triggers on narrow loads compare
  # sign-extended data against tdata2 cut to the access size, so mcontrol6_match_size_load fails:
  # https://solvnetplus.synopsys.com/s/case/500WQ00002IaoaoYAB/sdtrig-select1-data-triggers-compare-a-signextended-value-and-tdata2-truncated-to-the-access-size
  # (fixed in Imperas-HMC101126-eng-build). The imperas.ic files set amo_trigger=T, because AMOs must fire
  # load/store address triggers, and tcontrol_undefined=T, because Sail cannot model tcontrol with a delegable
  # medeleg[3].
  # - SdtrigSm
  # - SdtrigS
  # - SdtrigU
  # Zicfiss_{U,S,Sm}, seen on imperas-rv64-max and imperas-rv32gck. Two model bugs remain from
  # https://solvnetplus.synopsys.com/s/case/500WQ000028qjufYAA/zicfiss-discrepancies
  # 1. With satp.MODE=Bare below M-mode, SSPUSH and SSPOPCHK do not raise the store/AMO access fault
  #    (Zicfiss_Sm, cp_ss_satp_bare).
  # 2. CBO.CLEAN/FLUSH/INVAL on a shadow stack page do not raise the store/AMO access fault
  #    (Zicfiss_U, cp_ss_page_access).
  # SS instructions also complete on a PBMT=IO (non-idempotent) page instead of raising a store/AMO
  # access fault (Zicfiss_U, cp_ss_non_idempotent; Zicfiss_S, cp_ss_non_idempotent_s; Zicfiss_Sm,
  # cp_ssamoswap_mprv_non_idempotent):
  # https://solvnetplus.synopsys.com/s/case/500WQ00002CElbsYAD/zicfiss-shadow-stack-instructions-do-not-fault-on-nonidempotent-memory-pbmtio-pages-io-pma-regions
  # All of these are fixed in Imperas-HMC101126-eng-build.
  # - Zicfiss_U
  # - Zicfiss_S
  # - Zicfiss_Sm
  # Zicfiss_H: Sail completes HLVX on a VS-stage shadow stack page, which is not executable
  # (https://github.com/riscv/sail-riscv/issues/2081), and keeps a TLB-cached VS-stage shadow stack page valid
  # after henvcfg.SSE is cleared without a fence (cp_ss_sse_change_no_fence,
  # https://github.com/riscv/sail-riscv/issues/2083), so the model's faults mismatch.
  # The model also raises a load access fault on the HLVX, where Spike and Whisper raise a load page fault:
  # https://solvnetplus.synopsys.com/s/case/500WQ00002HTRtGYAX/hlvx-on-a-vsstage-shadow-stack-page-raises-an-access-fault-instead-of-a-load-page-fault
  # (fixed in Imperas-HMC101126-eng-build; Zicfiss_H still fails there because of the Sail bugs above).
  - Zicfiss_H-
  # Zicfiss_H_g_stage and Zicfiss_Sm, seen on stock Y-2026.09: with vsatp.MODE=Bare at V=1 (VS-mode, or M-mode
  # with MPRV=1 and MPV=1), SS instructions complete instead of raising a store/AMO access fault once hgatp is
  # translating (cp_ss_vsatp_bare, cp_ssamoswap_mprv_virt):
  # https://solvnetplus.synopsys.com/s/case/500WQ00002HSWlRYAX/zicfiss-shadow-stack-accesses-with-vsatpmode-bare-at-v1-complete-when-hgatp-is-not-bare
  # and SSAMOSWAP from M-mode with MPRV=1, MPV=1 raises a virtual-instruction exception while henvcfg.SSE=0, where
  # the reserved VS-stage SS encoding gives a store/AMO page fault (only the real mode, M, gates SSAMOSWAP):
  # https://solvnetplus.synopsys.com/s/case/500WQ00002HTuKB/mmode-ssamoswap-with-mprv-1-mpv-1-raises-a-virtualinstruction-exception-while-henvcfgsse-0
  # (fixed in Imperas-HMC101126-eng-build)
  # - Zicfiss_H_g_stage
  # - Zicfiss_Sm
# Not excluded:
# - Zama16b is not declared. The model has no misaligned atomicity granule: Zam=T performs every
#   misaligned AMO, including SSAMOSWAP (riscv-isa-manual#3426), so the configs use Zam=F, where
#   misaligned AMOs, SSAMOSWAP and LR/SC raise store/AMO access faults.
# - Ssstrict passes on imperas-rv32gcv only because its imperas.ic sets Zvqmac=F: the RV32GCV variant
#   still executes the draft Zvqmac encodings in VectorInstr-00/-03 with vector_version=1.0-ratified:
#   https://solvnetplus.synopsys.com/s/case/500WQ00002CEtKrYAL/the-vqmacc-draft-zvqmac-encodings-execute-on-named-v-variants-with-vectorversion10ratified
# - SsstrictV passes on stock Y-2026.09 and is no longer excluded.
