# yaml-language-server: $schema=testplan.schema.json
suite: Ssnpm_H
title: Ssnpm_H Coverpoints (pointer masking in VS-mode, VU-mode)
source: https://docs.google.com/spreadsheets/d/1DWBEoprndjQzLTXQTzPI8jW1HydtkYRR3tg58q59fdk/edit?gid=669410459#gid=669410459
description: |-
  Ssnpm with the H extension provides pointer masking for VS-mode (henvcfg.PMM), VU-mode (senvcfg.PMM), and for the
  explicit accesses of HLV.* and HSV.* (henvcfg.PMM as VS; senvcfg.PMM from HS-mode or hstatus.HUPMM from U-mode as VU).
  HLVX.* and accesses with MXR in effect are never masked.

  Whether the ignore transformation zero-extends or sign-extends is chosen by vsatp.MODE (not satp, not hgatp):
  vsatp = Bare means the address is a guest physical address (GPA) and is zero-extended.  When vsatp is not Bare, the
  address in rs1 is a guest virtual address (GVA), and the sequence is:

  * Mask: the top PMLEN bits are replaced with copies of bit XLEN-PMLEN-1 (bit 56 for PMLEN 7, bit 47 for PMLEN 16),
    the same sign extension as in Ssnpm with Sv39/48/57.
  * VS stage: the masked GVA is translated to a GPA using vsatp.
  * G stage: that GPA is translated to a host physical address using hgatp.
notes: |-
  *Groups.*  Ssnpm_H boots to HS-mode (BOOT_TO_SMODE) and enters VS/VU with RVTEST_TSBI_GOTO_VSMODE/VUMODE.
  Every coverpoint is RV64 only (pm_rv64_only).  PMM = 10 bins exist only with UDB_SUPPORTED_PMLEN_SSNPM_7 and
  PMM = 11 bins only with UDB_SUPPORTED_PMLEN_SSNPM_16.

  *PMM fields.*  The fields are henvcfg.PMM, senvcfg.PMM, hstatus.HUPMM, menvcfg.PMM (Smnpm) and mseccfg.PMM (Smmpm).
  menvcfg.PMM and mseccfg.PMM are set only when the extension is implemented, and only to PMLENs that Smnpm
  (UDB_SUPPORTED_PMLEN_SMNPM_*) and Smmpm (UDB_SUPPORTED_PMLEN_SMMPM_*) support, not Ssnpm's.  The fields not under
  test are set to a different value, so reading the wrong field changes the result: the largest supported value (11,
  else 10) when the field under test is 00, and 00 otherwise.  The HLVX and MXR coverpoints enable every field; the
  HFENCE coverpoints leave the others at 00.  PMM values are the outermost loop because menvcfg and mseccfg need a
  T-SBI call.

  *Translation modes.*  (vsatp.MODE, hgatp.MODE) is swept over seven pairs, each bin guarded by its own support macro.
  With vsatp = Bare the tag bits are GPA bits, so hgatp decides what an unmasked tag does: Bare, Sv39x4, Sv48x4 and Sv57x4
  are swept.  With vsatp paged, an unmasked tag is stopped by the VS stage before the G stage, so hgatp cannot change the
  masking result and only the matching width is used: (Sv39, Sv39x4), (Sv48, Sv48x4), (Sv57, Sv57x4).
  Only cp_vs_pmm and cp_vu_pmm sweep all seven pairs.  The other
  coverpoints use two pairs, each the widest the DUT supports, so they always run once:

  * BARE_PAIR: the first supported of (Bare, Sv57x4), (Bare, Sv48x4), (Bare, Sv39x4), (Bare, Bare).
  * PAGED_PAIR: the first supported of (Sv57, Sv57x4), (Sv48, Sv48x4), (Sv39, Sv39x4).  Absent when the DUT has no
    paged vsatp mode.

  The support guards are mutually exclusive, so a narrower pair adds no bin when a wider one is supported.  A tag bit
  beyond the chosen width faults instead of reaching the alias page, and the expectations already allow both.

  *Tag patterns (A_upper_bits) (bits 63:48 replaced in the base address).*  Five patterns:

  * 0x0000 - no tag (the untagged control)
  * 0x0002 - bit 49: masked by PMLEN 16 only; extra GPA bit of Sv48x4, inside Sv57x4
  * 0x0400 - bit 58: masked by PMLEN 7 and 16; extra GPA bit of Sv57x4
  * 0xFF00 - bits 63:56: all masked by PMLEN 16, only 63:57 by PMLEN 7
  * 0xFFFF - bits 63:48: all masked by PMLEN 16, only 63:57 by PMLEN 7

  The partially masked patterns (0xFFFF and 0xFF00 with PMLEN 7) keep some tag bits after masking.  Those bits can lie
  inside the Sv57 address width.  The test leaves those addresses unmapped, so the access faults, or maps them to the
  alias page.  The faulting address is invalid, and stval for an invalid address may legally be a different invalid
  address, so the stval/htval coverpoints (pm_csr_hw_apply) use only 0x0000 and fully masked tags.

  *Expected traps.*  Counted per tagged access.  A tagged access whose tag is fully masked never traps.  An access whose
  tag is not cleared by masking traps at most once, and does not trap when it reaches pm_gpa_alias_page.  The readback
  from A' is untagged and never traps.

  * cp_*_pmm, cp_*_pmlen_masking, cp_*_pmlen_zicfiss_*, cp_hlv_*_pmm: PMM 00 traps only
    for the unmasked tags (all but 0x0000); PMM 10 traps for 0x0002, 0xFF00 and 0xFFFF; PMM 11 never traps.
  * cp_*_mxr_pmm, cp_hlvx_*_pmm, cp_*_pmm_jalr: no masking, so every tag except 0x0000 is unmasked.  Tag 0x0000 never
    traps.
  * cp_*_pmlen_misaligned_word: the tags are fully masked, so no trap is expected.
  * cp_*_hardware_csr_writes_fault: every access traps, once per lw and once per sw.  The tags are 0x0000 and fully masked
    tags only.
  * cp_henvcfg_pmm_change_no_hfence: with PMM 00 the Ti access traps, except tag 0x0002 in case 5, which reaches alias_i;
    with PMM 10 or 11 it never traps.
  * cp_vs_gstage_no_pmm, cp_henvcfg_pmm_change_hfence, cp_hupmm_change_hfence: no traps.

  *Why do we need a different page than the test data page?*

  A' = pm_lo_page, the test data page (tag bits = 0x0000), pre-loaded with value_old.
  A tagged address whose tag is NOT cleared by masking must never reach A'.  It is either left unmapped (so the
  access faults), or mapped to a separate page, pm_gpa_alias_page, pre-loaded with value_diff.
  If both the tagged and the untagged address reached A', a read would return value_old whether or not the
  hardware masked the tag, so the test could not tell the difference.

  With a separate page holding a distinct value, the outcome is unambiguous: value_old proves the tag was stripped
  and A' was reached through masking; value_diff or a fault proves the tag was used as-is.

  This matters most when the tag bits are inside the GPA width (bits 49:48 with Sv48x4, bits 58:48 with Sv57x4).
  There the unmasked tagged GPA is a valid address, so the G-stage page tables decide where it goes, and they must
  not send it to A'.  With vsatp paged, the VS stage does the same job: a tagged VA must not translate to A'.

  With (vsatp, hgatp) = (Bare, Bare) there is no table to leave unmapped.  A tagged address is a host physical address, so
  an unmasked tag bit must lie outside the PA width or in a PMA hole.  The access then raises an access fault and cannot
  alias DRAM.  A tag is therefore used with (Bare, Bare) only if every bit it leaves unmasked is at or above the PA width:
  0x0002 (bit 49) needs PA width <= 49, and 0xFFFF with PMLEN 7 (bits 56:48) needs PA width <= 48.  Otherwise the tag is
  dropped for (Bare, Bare).  0x0400 (bit 58) and 0xFF00 with PMLEN 7 (bit 56) are used with every PA width up to 56.

coverpoints:
  - name: cp_vs_pmm
    goal: henvcfg.PMM masks loads and stores in VS-mode, for guest physical (vsatp = Bare) and guest virtual (vsatp paged) addresses
    description: |-
      Test Environment:
       In HS-mode, identity map the test image in both stages.  Seed pm_lo_page with value_old.
       Set henvcfg.PMM and the other PMM fields as in the notes, then HFENCE.GVMA x0, x0 and HFENCE.VVMA x0, x0.
       Switch to VS-mode and execute the following loop:
      For each henvcfg.PMM in {00, 10, 11} (outermost loop; the other PMM fields as in the notes) under (vsatp.MODE, hgatp.MODE) in {(Bare, Bare), (Bare, Sv39x4), (Bare, Sv48x4), (Bare, Sv57x4), (Sv39, Sv39x4), (Sv48, Sv48x4), (Sv57, Sv57x4)}:
      For each A_upper_bits:
      Set A = A' with upper bits replaced by A_upper_bits
       ld from A, sigupd(value) + record any traps.
       sd unique value_new to A, then read back from A' (untagged), sigupd(value) + record any traps.
    expectation: |-
      When henvcfg.PMM = 10/11 and every tag bit is within PMLEN: the access reaches A' (ld returns value_old, the readback
      returns value_new), no trap.
       vsatp = Bare: A is a guest physical address, so the top PMLEN bits are zero-extended.
       vsatp paged: A is a guest virtual address, so the top PMLEN bits are sign-extended from bit XLEN-PMLEN-1.
      Otherwise (PMM = 00, or a tag bit outside PMLEN): the access faults, or reaches a page other than A':
       vsatp = Bare: load or store/AMO guest-page fault (hgatp paged), or load or store/AMO access fault (hgatp Bare).
       vsatp paged: load or store/AMO page fault (non-canonical or unmapped VA).
    bins: |-
      priv_mode VS x {ld, sd} x henvcfg.PMM {00, 10, 11} x tag {5 patterns} x (vsatp, hgatp) {(Bare, Bare), (Bare, Sv39x4), (Bare, Sv48x4), (Bare, Sv57x4), (Sv39, Sv39x4), (Sv48, Sv48x4), (Sv57, Sv57x4)}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - henvcfg_pmm_op
      - ssnpm_definition
      - pm_ignore_upper_bits
      - pm_ignore_pa
      - pm_ignore_va
      - pm_apply_explicit
      - pm_per_mode_control
      - pm_config_next_higher
      - pm_mode_only_dependency
      - pm_deterministic_effect
      - pmlen_mode_depend
      - pmlen_supported_values
      - pm_csr_hw_apply
  - name: cp_vu_pmm
    goal: senvcfg.PMM masks loads and stores in VU-mode, for guest physical (vsatp = Bare) and guest virtual (vsatp paged) addresses
    description: |-
      Same test environment and loop as cp_vs_pmm, except:
       - the field under test is senvcfg.PMM;
       - the VS-stage data pages have PTE.U = 1;
       - the accesses run in VU-mode.

      The VS-writer bins use tag 0x0400, which both PMLENs mask.  Tag 0xFFFF is not used there: with PMM 10, PMLEN 7
      sign-extends it from bit 56 back to 0xFFFF, so masking would change nothing.

      Writer {HS-mode, VS-mode}: senvcfg has no VS copy, so a csrw senvcfg in VS-mode writes the real senvcfg.PMM.
      With writer HS-mode, HS-mode sets senvcfg.PMM as in cp_vs_pmm.  With writer VS-mode:
       1. HS-mode sets senvcfg.PMM to a value different from the one under test (the opposite rule of the notes).  When
          Ssstateen is implemented, it also sets mstateen0.ENVCFG = 1 and hstateen0.ENVCFG = 1, since VS-mode can write
          senvcfg only with hstateen0.ENVCFG = 1.  It then switches to VS-mode.
       2. VS-mode executes csrw senvcfg with the PMM under test, reads senvcfg back, and sigupd(value).
          This write does not change the masking of VS-mode itself, which follows henvcfg.PMM.
       3. VS-mode switches to VU-mode (RVTEST_TSBI_GOTO_VUMODE) and runs the loop.
    expectation: |-
      As cp_vs_pmm, with the PMLEN of senvcfg.PMM.  With writer VS-mode, the csrw does not trap, senvcfg.PMM reads back
      the value written, and the VU accesses follow it, not the value HS-mode set.
    bins: |-
      priv_mode VU x writer HS-mode x {ld, sd} x senvcfg.PMM {00, 10, 11} x tag {5 patterns} x (vsatp, hgatp) {(Bare, Bare), (Bare, Sv39x4), (Bare, Sv48x4), (Bare, Sv57x4), (Sv39, Sv39x4), (Sv48, Sv48x4), (Sv57, Sv57x4)}
      priv_mode VU x writer VS-mode x {ld, sd} x senvcfg.PMM {00, 10, 11} x tag {0x0000, 0x0400} x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - senvcfg_pmm_ssnpm
      - senvcfg_pmm_enc
      - ssnpm_definition
      - pm_ignore_pa
      - pm_ignore_va
      - pm_per_mode_control
      - pmlen_mode_depend
  - name: cp_vs_gstage_no_pmm
    goal: henvcfg.PMM masks the address of a VS-mode access, never the guest physical address that the VS stage produces
    description: |-
      Pointer masking applies to the address an instruction computes.  The GPA that the VS stage produces and the G stage
      that translates it are implicit steps, so neither is masked.  The test maps an untagged guest virtual address to a GPA
      whose top bit b lies in the masked range.  If the GPA were masked, bit b would be cleared and the access would reach
      A' instead of the alias page.

      Test Environment:
       In HS-mode, vsatp paged.  b is the top GPA bit: 49 for Sv48x4, 58 for Sv57x4.
       G = GPA(A') with bit b set.  The VS stage maps the untagged VA V to G.
       The G stage maps GPA(A') to pm_lo_page (value_old) and G to pm_gpa_alias_page (value_diff).
       Set henvcfg.PMM and the other PMM fields as in the notes, then HFENCE.GVMA x0, x0 and HFENCE.VVMA x0, x0.
       Switch to VS-mode and execute the following loop:
      For each (vsatp.MODE, hgatp.MODE) in {(Sv48, Sv48x4), (Sv57, Sv57x4)}:
      For each henvcfg.PMM in {10, 11} (outermost loop; the other PMM fields as in the notes):
       ld from V, sigupd(value) + record any traps.
       sd unique value_new to V, then read back from A' and from the alias page, sigupd(value) + record any traps.
    expectation: |-
      No trap.  ld returns value_diff, sd writes the alias page, and A' still holds value_old.  A hart that masks the GPA
      would clear bit b, reach A', and return value_old.
    bins: |-
      priv_mode VS x {ld, sd} x henvcfg.PMM {11 (Sv48x4: bit 49), 10 and 11 (Sv57x4: bit 58)} x (vsatp, hgatp) {(Sv48, Sv48x4), (Sv57, Sv57x4)}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_not_apply_implicit
      - henvcfg_pmm_op
    notes: With PMLEN 7, bit 49 is not masked, so Sv48x4 is tested with PMM = 11 only.
  - name: cp_hlv_hs_spvp1_pmm
    goal: HLV and HSV in HS-mode with hstatus.SPVP = 1 (access as VS) take henvcfg.PMM
    description: |-
      With hstatus.SPVP = 1, for each henvcfg.PMM value, hlv.d and hsv.d in HS-mode at the test data with each tag set.

      Test Environment:
       In HS-mode, identity map the test image in both stages; the VS-stage data pages have PTE.U = 0.
       Seed pm_lo_page with value_old.
       HLV/HSV run with V = 0, but the address type (GPA or GVA) still comes from vsatp.
       HFENCE.GVMA x0, x0 and HFENCE.VVMA x0, x0 after each PMM, vsatp or hgatp change.
      For each henvcfg.PMM in {00, 10, 11} (outermost loop; the other PMM fields as in the notes) under (vsatp.MODE, hgatp.MODE) in {BARE_PAIR, PAGED_PAIR}:
      For each A_upper_bits in the 5 tag patterns:
      Set A = A' with upper bits replaced by A_upper_bits
       hlv.d from A, sigupd(value) + record any traps.
       hsv.d value_new to A, then hlv.d from A' (untagged), sigupd(value) + record any traps.
    expectation: |-
      As cp_vs_pmm, with the PMLEN of henvcfg.PMM: when every tag bit is within PMLEN, hlv.d returns value_old
      and the readback after hsv.d returns value_new; otherwise the access faults or reaches a
      page other than A'.  Faults are taken in HS-mode with hstatus.GVA = 1.
    bins: |-
      priv_mode HS x {hlv.d, hsv.d} x hstatus.SPVP = 1 x henvcfg.PMM {00, 10, 11} x tag {5 patterns} x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_mprv_spvp
      - henvcfg_pmm_op
      - pm_ignore_pa
      - pm_ignore_va
      - pm_apply_explicit
  - name: cp_hlv_hs_spvp1_mxr_pmm
    goal: vsstatus.MXR = 1 or sstatus.MXR = 1 turns henvcfg.PMM pointer masking off for HLV and HSV in HS-mode with hstatus.SPVP = 1 (access as VS)
    description: |-
      Same test environment and loop as cp_hlv_hs_spvp1_pmm, except:
       - all PMM fields are set to the same value, the largest supported (11, else 10), so a masked result can only mean MXR was ignored (outermost);
       - inside it, for each (vsstatus.MXR, sstatus.MXR) in {(0,1), (1,0), (1,1)}, HS-mode sets both bits;
       - A_upper_bits is in {0x0000, 0x0400} (PMM 10) or {0x0000, 0xFFFF} (PMM 11) and (vsatp.MODE, hgatp.MODE) is in {BARE_PAIR, PAGED_PAIR}.
    expectation: |-
      No masking for every MXR combination.  Tag 0x0000 reaches the test data (the control).  Every other tag is used
      unmasked: the access faults or reaches a page other than A'.
    bins: |-
      priv_mode HS x {hlv.d, hsv.d} x hstatus.SPVP = 1 x (vsstatus.MXR, sstatus.MXR) {(0,1), (1,0), (1,1)} x henvcfg.PMM {largest supported of 10, 11} x tag (PMM 10 {0x0000, 0x0400}, PMM 11 {0x0000, 0xFFFF}) x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 11 when PMLEN 16 is supported, otherwise 10 when PMLEN 7 is supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_mxr_exception
      - pm_mprv_spvp
    notes: vsstatus.MXR = 0 and sstatus.MXR = 0 is cp_hlv_hs_spvp1_pmm.
  - name: cp_hlv_hs_spvp0_pmm
    goal: HLV and HSV in HS-mode with hstatus.SPVP = 0 (access as VU) take senvcfg.PMM
    description: |-
      Same test environment and loop as cp_hlv_hs_spvp1_pmm, except:
       - hstatus.SPVP = 0;
       - the field under test is senvcfg.PMM;
       - the VS-stage data pages have PTE.U = 1.
    expectation: As cp_hlv_hs_spvp1_pmm, with the PMLEN of senvcfg.PMM.
    bins: |-
      priv_mode HS x {hlv.d, hsv.d} x hstatus.SPVP = 0 x senvcfg.PMM {00, 10, 11} x tag {5 patterns} x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_mprv_spvp
      - senvcfg_pmm_ssnpm
      - pm_ignore_pa
      - pm_ignore_va
      - pm_apply_explicit
  - name: cp_hlv_hs_spvp0_mxr_pmm
    goal: vsstatus.MXR = 1 or sstatus.MXR = 1 turns senvcfg.PMM pointer masking off for HLV and HSV in HS-mode with hstatus.SPVP = 0 (access as VU)
    description: |-
      Same test environment and loop as cp_hlv_hs_spvp0_pmm, except:
       - all PMM fields are set to the same value, the largest supported (11, else 10), so a masked result can only mean MXR was ignored (outermost);
       - inside it, for each (vsstatus.MXR, sstatus.MXR) in {(0,1), (1,0), (1,1)}, HS-mode sets both bits;
       - A_upper_bits is in {0x0000, 0x0400} (PMM 10) or {0x0000, 0xFFFF} (PMM 11) and (vsatp.MODE, hgatp.MODE) is in {BARE_PAIR, PAGED_PAIR}.
    expectation: |-
      No masking for every MXR combination.  Tag 0x0000 reaches the test data (the control).  Every other tag is used
      unmasked: the access faults or reaches a page other than A'.
    bins: |-
      priv_mode HS x {hlv.d, hsv.d} x hstatus.SPVP = 0 x (vsstatus.MXR, sstatus.MXR) {(0,1), (1,0), (1,1)} x senvcfg.PMM {largest supported of 10, 11} x tag (PMM 10 {0x0000, 0x0400}, PMM 11 {0x0000, 0xFFFF}) x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 11 when PMLEN 16 is supported, otherwise 10 when PMLEN 7 is supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_mxr_exception
      - pm_mprv_spvp
    notes: vsstatus.MXR = 0 and sstatus.MXR = 0 is cp_hlv_hs_spvp0_pmm.
  - name: cp_hlv_u_spvp1_pmm
    goal: HLV and HSV in U-mode with hstatus.SPVP = 1 (access as VS) take henvcfg.PMM
    description: |-
      Same test environment and loop as cp_hlv_hs_spvp1_pmm, except:
       - hstatus.HU = 1; HS-mode sets hstatus.SPVP and henvcfg.PMM, then switches to U-mode for the accesses.
    expectation: As cp_hlv_hs_spvp1_pmm, with the PMLEN of henvcfg.PMM.
    bins: |-
      priv_mode U x hstatus.HU = 1 x {hlv.d, hsv.d} x hstatus.SPVP = 1 x henvcfg.PMM {00, 10, 11} x tag {5 patterns} x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_mprv_spvp
      - henvcfg_pmm_op
      - hstatus_hu_op
  - name: cp_hlv_u_spvp0_pmm
    goal: HLV and HSV in U-mode with hstatus.SPVP = 0 (access as VU) take hstatus.HUPMM
    description: |-
      Same test environment and loop as cp_hlv_hs_spvp1_pmm, except:
       - hstatus.HU = 1 and hstatus.SPVP = 0; HS-mode sets hstatus.HUPMM, then switches to U-mode for the accesses;
       - the field under test is hstatus.HUPMM;
       - the VS-stage data pages have PTE.U = 1.
    expectation: As cp_hlv_hs_spvp1_pmm, with the PMLEN of hstatus.HUPMM.
    bins: |-
      priv_mode U x hstatus.HU = 1 x {hlv.d, hsv.d} x hstatus.SPVP = 0 x hstatus.HUPMM {00, 10, 11} x tag {5 patterns} x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_mprv_spvp
      - hstatus_hu_op
    notes: |-
      This is the one VU access that does not use senvcfg.PMM: in U-mode senvcfg.PMM holds the host's own U-mode
      setting, so the guest's VU setting is copied into hstatus.HUPMM.  The HUPMM paragraph has no normative tag.
  - name: cp_hlvx_hs_pmm
    goal: HLVX in HS-mode is never masked
    description: |-
      With every PMM field enabled (henvcfg.PMM = senvcfg.PMM = hstatus.HUPMM), hlvx.wu in HS-mode for
      hstatus.SPVP = 0 and 1 at the test data with each tag set.

      Test Environment:
       Identity map the test image in both stages, with the data page executable (X = 1) in both stages so the
       untagged HLVX succeeds; the VS-stage page has PTE.U = 1 when SPVP = 0 and PTE.U = 0 when SPVP = 1.
       Seed pm_lo_page with value_old.
      For each PMM in {10, 11} under (vsatp.MODE, hgatp.MODE) in {BARE_PAIR, PAGED_PAIR}:
      For each hstatus.SPVP in {0, 1}:
      For each A_upper_bits in the 5 tag patterns:
      Set A = A' with upper bits replaced by A_upper_bits
       hlvx.wu: read from A, sigupd(value) + record any traps.
    expectation: |-
      Tag 0x0000 returns the data (the control: without it a hart where HLVX always faults would pass).
      Every other tag is used unmasked: the access faults or reaches a page other than A'.  When the faulting address
      is valid, stval holds it untransformed; for an invalid address stval may be a different invalid address and is
      not checked.
    bins: |-
      priv_mode HS x hlvx.wu x hstatus.SPVP {0, 1} x henvcfg.PMM = senvcfg.PMM = hstatus.HUPMM {10, 11} x tag {5 patterns} x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    notes: The HLVX sentence in hypervisor.adoc ("not subject to pointer masking") has no normative tag.
  - name: cp_hlvx_u_pmm
    goal: HLVX in U-mode is never masked
    description: |-
      Same test environment and loop as cp_hlvx_hs_pmm, except hstatus.HU = 1 and the accesses run in U-mode
      (HS-mode sets hstatus.SPVP and the PMM fields, then switches to U-mode).
    expectation: As cp_hlvx_hs_pmm.
    bins: |-
      priv_mode U x hstatus.HU = 1 x hlvx.wu x hstatus.SPVP {0, 1} x henvcfg.PMM = senvcfg.PMM = hstatus.HUPMM {10, 11} x tag {5 patterns} x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - hstatus_hu_op
  - name: cp_vs_mxr_pmm
    goal: vsstatus.MXR = 1 or sstatus.MXR = 1 turns henvcfg.PMM pointer masking off in VS-mode
    description: |-
      With vsstatus.MXR = 1 or sstatus.MXR = 1 (or both) and henvcfg.PMM enabled, ld and sd in VS-mode at the test data
      with each tag set.  vsstatus.MXR applies to the VS stage only; sstatus.MXR applies to both stages.  Either one is
      MXR in effect for a guest access.

      Test Environment:
       In HS-mode, identity map the test image in both stages; the VS-stage data pages have PTE.U = 0.
       Seed pm_lo_page with value_old.
      For the largest supported PMM (11, else 10), written to henvcfg.PMM, senvcfg.PMM, hstatus.HUPMM and, when implemented, menvcfg.PMM and mseccfg.PMM (outermost):
      For each (vsstatus.MXR, sstatus.MXR) in {(0,1), (1,0), (1,1)}, under (vsatp.MODE, hgatp.MODE) in {BARE_PAIR, PAGED_PAIR}: set both MXR bits in HS-mode.
      Switch to VS-mode and execute the following loop:
      For each A_upper_bits in {0x0000, 0x0400} (PMM 10) or {0x0000, 0xFFFF} (PMM 11):
      Set A = A' with upper bits replaced by A_upper_bits
       ld from A, sigupd(value) + record any traps.
       sd unique value_new to A, then read back from A' (untagged), sigupd(value) + record any traps.
    expectation: |-
      No masking for every MXR combination.  Tag 0x0000 reaches the test data (the control).  Every other tag is used
      unmasked: the access faults or reaches a page other than A'.
    bins: |-
      priv_mode VS x {ld, sd} x (vsstatus.MXR, sstatus.MXR) {(0,1), (1,0), (1,1)} x henvcfg.PMM {largest supported of 10, 11} x tag (PMM 10 {0x0000, 0x0400}, PMM 11 {0x0000, 0xFFFF}) x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 11 when PMLEN 16 is supported, otherwise 10 when PMLEN 7 is supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_mxr_exception
    notes: vsstatus.MXR = 0 and sstatus.MXR = 0 is cp_vs_pmm.
  - name: cp_vu_mxr_pmm
    goal: vsstatus.MXR = 1 or sstatus.MXR = 1 turns senvcfg.PMM pointer masking off in VU-mode
    description: |-
      Same test environment and loop as cp_vs_mxr_pmm, except:
