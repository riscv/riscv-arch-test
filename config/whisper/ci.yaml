# CI configuration for Whisper simulator

# SsstrictSm, unknown
# Smstateen Sail does not yet support 1P13 bit
# Sdtrig* not yet implemented in Sail
# Sscofpmf* will be added back in CI once Sail increments HPM counters
#   (https://github.com/riscv/sail-riscv/issues/1733); whisper counts events, so every
#   result that depends on a real overflow diverges from the Sail reference.
ci_enabled: true
exclude_extensions: "SsstrictSm,SsstrictS,SsstrictU,ExceptionsSvZalrsc,Smstateen,SdtrigSm,SdtrigS,SdtrigU,SscofpmfSm,SscofpmfS,SscofpmfU"
exclude_configs:
  - whisper-rv32-max-spike-ref
  - whisper-rv64-max-spike-ref
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 1
config_shards:
  whisper-rv64-max: 2
