# CI configuration for the cve4 family: CV32E40P, CV32E40S, and CV32E40X

ci_enabled: true
exclude_extensions:
  # cv32e40p-rv32imcf DUT bug - https://github.com/openhwfoundation/cv32e40p/issues/1060
  - Sm_F
  # Throwing access fault instead of misaligned fault.
  # See https://github.com/openhwfoundation/cv32e40x/issues/1000 and
  # https://github.com/riscv/riscv-arch-test/pull/1710#issuecomment-5444172186
  - Exceptions_Zalrsc
  - Exceptions_Zaamo
exclude_configs:
  # With PMP_NUM_REGIONS = 0, CV32E40S implements 64 read-only-zero PMP entries, so no rule can
  # grant U-mode access; ACT runs unprivileged tests in U-mode and requires >= 8 usable PMP entries.
  - cv32e40s-rv32imc
  - cv32e40s-rv32imc-pma
apt_packages: "autoconf flex bison help2man libfl-dev ccache"
install_script: ".github/scripts/install-cve4.sh"
setup_script: ".github/scripts/setup-cve4.sh"
