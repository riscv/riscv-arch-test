# CI configuration for Imperas simulator
# Imperas is proprietary and cannot run in public CI.

# These exclusions don't affect CI because it doesn't run, but they help tracking incomplete features
# - SsstrictSm/S/U: on the vector configs, Imperas does not enforce the vector register-group
#   overlap constraints, so it executes reserved widening encodings such as
#   vwmaccu.vv v14, v9, v15, v0.t instead of raising an illegal instruction:
#   https://solvnetplus.synopsys.com/s/case/500WQ0000230O4P/imperas-treats-vwmaccuvv-v14-v9-v15-v0t-as-legal
#   SsstrictSm additionally trips on hcontext (0x6a8) on rv64-max, which Imperas implements
#   and Sail does not. The rv32 configs pass SsstrictS/U entirely, and rv32gck passes all three.
# - InterruptsSm/S/SSm/U: Imperas does not implement external interrupts
# - Smstateen: Sail does not implement all state yet to match
# - ExceptionsVx: https://solvnetplus.synopsys.com/s/case/500WQ000023l1CPYAY/vmvnrrv-does-not-raise-an-illegalinstruction-exception-when-vtypevill-1
# - ZicfissU/S/Sm: three model bugs, seen on imperas-rv64-max and imperas-rv32gck with ImperasDV
#   Y-2026.03-DEV-20260612 against Sail 0.14.1 (ZicfissV passes):
#   1. A memory fault does not outrank the SSPOPCHK software check. With PMP read-only on the
#      shadow stack (ZicfissSm, cp_ss_pmp_permissions) or on an xwr=001 page (ZicfissS,
#      cp_ss_instr_target_page_s), SSPOPCHK raises a software check (cause 18, xtval 3) instead of
#      the store/AMO access fault or store/AMO page fault.
#   2. An S-mode SS access to a U=1 page with SUM=0 raises a store/AMO access fault instead of a
#      store/AMO page fault (ZicfissS, cp_ss_page_perm_priority).
#   3. The SS page encoding pte.xwr=010 is treated as a non-leaf PTE ("Page table entry non-leaf
#      and U!=0"), so ZicfissU never reaches its signature.
#
ci_enabled: false
exclude_extensions: "SsstrictSm,SsstrictS,SsstrictU,SsstrictV,InterruptsSm,InterruptsS,InterruptsSSm,InterruptsU,Smstateen,ExceptionsVx,SdtrigSm,SdtrigS,SdtrigU,ZicfissU,ZicfissS,ZicfissSm"
