# yaml-language-server: $schema=testplan.schema.json
suite: Shcounterenw
source: https://docs.google.com/spreadsheets/d/1DWBEoprndjQzLTXQTzPI8jW1HydtkYRR3tg58q59fdk/edit?gid=359491363#gid=359491363
coverpoints:
  - heading: Following tests are done in HS-mode
  - name: cp_shcounterenw
    goal: which hcounteren bits are writable
    description: Set and clear each bit of hcounteren, then write all 1s and all 0s, as Sscounterenw does for scounteren.
    expectation: |-
      0 writes 32 bits of 0
      -1 writes 1s to every bit with a non-read-only-zero hpmcounter (HPM_COUNTER_EN); the other bits match the reference model
    bins: "2"
    rules:
      - Shcounterenw_hpmcounter_hcounteren
