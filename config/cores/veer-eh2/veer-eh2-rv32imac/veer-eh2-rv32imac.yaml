# UDB Architecture Configuration for the CHIPS Alliance VeeR EH2 core.
#
# Written against Cores-VeeR-EH2 commit bd52450b144db1c2bb441e53b442c2af5a8e7b59.
# Every parameter below cites the supporting text and a permalink to the original.
# Sources, in order of preference: the PRM markdown under docs/source/ (the source of
# the published "RISC-V VeeR EH2 Programmer's Reference Manual", Revision 1.9), then
# configs/veer.config, then the RTL under design/.
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: veer-eh2-rv32imac
description: CHIPS Alliance VeeR EH2 - RV32IMAC, machine mode only, single hart

# misa reads 0x4000_1104: MXL=1 (RV32), plus C (bit 2), I (bit 8) and M (bit 12).
#   Quote: "0x301 | MRW | misa | ISA and extensions (**Note:** writes ignored) | 0x4000_1104"
#   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/csrs.md#L15
# Quote: "RV32IMC-compliant RISC-V core with branch predictor"
#   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/overview.md
# The bundled tests are built -march=rv32imc_zicsr_zifencei, confirming Zicsr and Zifencei.
#   Quote: "ABI = -mabi=ilp32 -march=rv32imc_zicsr_zifencei"
#   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/tools/Makefile#L23
# There is no A, no F/D, no bit-manipulation and no U-mode in EH2: configs/veer.config
# contains no atomic_enable, bitmanip_* or user_mode knob, so this IS the maximum
# feature set for this core.
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: C, version: "= 2.0" }
  # EH2 adds the A extension, on by default and enabled in this build (ATOMIC_ENABLE=1).
  #   Quote: "0x4000_1105 (with atomics support) 0x4000_1104 (without atomics support)"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/csrs.md#L27
  #   Quote: "Atomics support is selected with the ATOMIC_ENABLE build argument when the VeeR
  #   EH2 core is built."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/csrs.md#L476
  # NOTE: AMOs are illegal outside the DCCM on this core, and the ACT image lives in system
  # memory, so every AMO the tests execute is expected to fault.
  #   Quote: "# Make atomic instructions illegal outside of DCCM."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/configs/veer.config#L2604
  - { name: A, version: "= 2.1" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  - { name: Zca, version: "= 1.0.0" }
  - { name: Zicsr, version: "= 2.0" }
  # Zihpm is NOT implemented: it provides the unprivileged hpmcounter3..31 shadows for
  # S/U-mode access, and EH2 is machine-mode only. The M-mode mhpmcounter3..6 /
  # mhpmevent3..6 that EH2 does implement belong to Sm, and which of them exist is
  # carried by HPM_COUNTER_EN below.
  #   Quote: "VeeR EH2 is a machine-mode (M-mode) only, 32-bit CPU core"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/overview.md
  - { name: Zifencei, version: "= 2.0" }
  # VeeR EH2 implements privileged spec 1.11, not 1.12. mstatush, which 1.12 added, does
  # not exist on this core, and ACT already guards every mstatush access behind
  # SM1P12P0_OR_LATER_SUPPORTED, so declaring 1.11 is both accurate and necessary.
  #   Quote: "The RISC-V Instruction Set Manual Volume II: Privileged Architecture |
  #   20190608-Priv-MSU-Ratified | Specification ratified"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/intro.md
  - { name: Sm, version: "= 1.11.0" }

params:
  # XLEN
  # Quote: "VeeR EH2 is a machine-mode (M-mode) only, 32-bit CPU core"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/overview.md
  MXLEN: 32
  # Quote (32-bit physical address space, 16 regions of 256 MB):
  #   "The VeeR EH2 core has a 32-bit address space which is divided into 16 fixed
  #    regions of 256 MB each."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/memory-map.md
  PHYS_ADDR_WIDTH: 32

  # MISA: implemented but read-only ("writes ignored"), so no extension can be
  # turned off through misa.
  #   Quote: "misa | ISA and extensions | 0x4000_1105 (with atomics support)"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/csrs.md#L15
  MISA_CSR_IMPLEMENTED: true
  MUTABLE_MISA_M: false
  MUTABLE_MISA_C: false
  MUTABLE_MISA_A: false

  # Endianness: RISC-V little-endian; EH2 implements no mstatus.MBE/SBE/UBE fields.
  M_MODE_ENDIANNESS: little

  # Trap behavior.
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  # !VERIFIED - the PRM does not state what an access to an unimplemented CSR does.
  # Set to true (the ordinary RISC-V behaviour) pending an RTL read of
  # design/dec/dec_decode_ctl.sv; if wrong it shows up as a Zicsr discrepancy.
  TRAP_ON_UNIMPLEMENTED_CSR: true
  TRAP_ON_ILLEGAL_WLRL: false

  # MTVAL reporting. !VERIFIED for EH2 in detail: the PRM has no section enumerating
  # which exceptions write mtval. These values follow the RISC-V defaults implemented
  # by the TLU (design/dec/dec_tlu_ctl.sv); mismatches surface as Sm discrepancies.
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true
  MTVAL_WIDTH: 32

  # Misaligned load/store: handled in hardware for ordinary (idempotent) memory.
  #   Quote: "The core performs a misalignment check during the address calculation."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/memory-map.md#L355
  # Known deviation, accepted for this configuration: misaligned accesses to
  # side-effect regions raise a misaligned exception where the priv spec recommends an
  # access fault.
  #   Quote: "The RISC-V Privileged specification recommends that misaligned accesses
  #   to regions with potential side-effects should trigger an access fault exception,
  #   instead of a misaligned exception ... Note that VeeR EH2 triggers a misaligned
  #   exception in this case."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/memory-map.md#L1060
  MISALIGNED_LDST: true
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low
  MISALIGNED_MAX_ATOMICITY_GRANULE_SIZE: 0 # AMOs are DCCM-only; no wider atomicity guarantee
  MISALIGNED_SPLIT_STRATEGY: custom

  # Machine ID CSRs.
  #   Quote: "0xF11 | MRO | mvendorid | Vendor ID | 0x0000_0045"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/csrs.md#L20
  # UDB splits mvendorid into (BANK << 7) | OFFSET; 0x45 has no continuation bytes.
  VENDOR_ID_BANK: 0x0
  VENDOR_ID_OFFSET: 0x45
  #   Quote: "0xF12 | MRO | marchid | Architecture ID | 0x0000_0011"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/csrs.md#L25
  MARCHID_IMPLEMENTED: true
  ARCH_ID_VALUE: 0x11
  #   Quote: "0xF13 | MRO | mimpid | Implementation ID | 0x0000_0003"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/csrs.md#L30
  MIMPID_IMPLEMENTED: true
  IMP_ID_VALUE: 0x3

  # MTVEC. The TLU stores bits [31:2] and bit [0], dropping bit 1, so both Direct
  # (MODE=0) and Vectored (MODE=1) are representable and BASE is 4-byte aligned.
  #   Quote: "assign mtvec_ns[30:0] = {dec_csr_wrdata_wb[31:2], dec_csr_wrdata_wb[0]} ;"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/design/dec/dec_tlu_ctl.sv#L1145
  # Vectored mode is used by the PRM's own interrupt example.
  #   Quote: "trap_vector:            // Interrupt trap starts here when MTVEC[mode]=1"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/external-interrupts.md#L963
  MTVEC_MODES: [0, 1]
  MTVEC_ACCESS: rw
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom # bit 1 of a write is discarded, not retained
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_BASE_ALIGNMENT_VECTORED: 4

  # Sm parameters.
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  # No PMA hardware: region attributes come from mrac, whose granularity is one
  # 256 MB region, but the natural access granule on the 64-bit AHB/AXI bus is 8 bytes.
  PMA_GRANULARITY: 3
  # CONFIG_PTR_ADDRESS is omitted: mconfigptr was added in privileged spec 1.12 and this
  # core implements 1.11, so UDB does not define the parameter for this config.

  # PMP: EH2 has no RISC-V PMP at all. Memory protection is a non-standard MPU of
  # 8 instruction and 8 data access windows configured by build arguments, not CSRs.
  #   Quote: "If at least one data access window is enabled, non-speculative load/store
  #   requests which are not within the address range of any enabled data access window
  #   cause a precise load/store address misaligned or access fault exception."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/memory-map.md#L198
  NUM_PMP_ENTRIES: 0

  # Hardware performance monitors: mhpmcounter3-6 / mhpmevent3-6 only (4 counters).
  #   Quote: "0xB03 ... mhpmcounter3" through "0xB06 ... mhpmcounter6"
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/csrs.md
  HPM_EVENTS: [0]
  HPM_COUNTER_EN:
    [
      false,
      false,
      false,
      true,
      true,
      true,
      true,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]

  # mcountinhibit (0x320) exists on EH2, unlike EH1 which had the non-standard mgpmc.
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/csrs.md
  MCOUNTINHIBIT_IMPLEMENTED: true

  # mcounteren (0x306) does not exist on EH2: it is absent from the CSR map, and with
  # no U-mode there is no lower privilege level whose counter access it could gate.
  # UDB still requires the parameter, so every bit is false.
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/docs/source/csrs.md
  MCOUNTENABLE_EN:
    [
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]

  # Atomics parameters. EH2 permits AMOs only inside the DCCM, and the reservation/misaligned
  # details are not documented in the PRM, so these follow the RISC-V defaults and are
  # !VERIFIED - a wrong value shows up as a Zaamo/Zalrsc discrepancy.
  #   Quote: "# Make atomic instructions illegal outside of DCCM."
  #   https://github.com/chipsalliance/Cores-VeeR-EH2/blob/bd52450b/configs/veer.config#L2604
  MISALIGNED_AMO: false
  LRSC_MISALIGNED_BEHAVIOR: "always raise access fault"
  LRSC_RESERVATION_STRATEGY: "reserve exactly enough to cover the access"
  LRSC_FAIL_ON_VA_SYNONYM: false
  LRSC_FAIL_ON_NON_EXACT_LRSC: false

  # mcountinhibit exists on EH2 (EH1 used the non-standard mgpmc). Bit 1 (TM) is read-only zero
  # per the spec; bits 3..6 track the four implemented mhpmcounters.
  COUNTINHIBIT_EN:
    [
      true,
      false,
      true,
      true,
      true,
      true,
      true,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]
