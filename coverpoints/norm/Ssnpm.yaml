# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # If the Ssnpm extension is implemented, the PMM field enables or disables pointer
  # masking (see ) for the next-lower privilege mode (U/VU), according to the values
  # in . If Ssnpm is not implemented, PMM is read-only zero. The PMM field is
  # read-only zero for RV32.
  - name: senvcfg_pmm_ssnpm
    coverpoint: [""]

  # Changing senvcfg.PMM takes effect immediately, without the need to execute an
  # SFENCE.VMA instruction.
  - name: senvcfg_pmm_immediate
    coverpoint:
      [
        "TODO: change senvcfg.PMM, then access memory from U-mode with no intervening SFENCE.VMA",
      ]

  # Value|Description === 00|Pointer masking is disabled (PMLEN = 0)¶01|Reserved¶10|Pointer
  # masking is enabled with PMLEN = XLEN - 57 (PMLEN = 7 on RV64)¶11|Pointer masking is
  # enabled with PMLEN = XLEN - 48 (PMLEN = 16 on RV64) ===
  - name: senvcfg_pmm_enc
    coverpoint:
      [
        "Ssnpm_cg/cp_pmlen_masking",
        "S_scsr_cg/cp_scsrwalk/senvcfg (the walk writes the reserved PMM=0b01)",
      ]
