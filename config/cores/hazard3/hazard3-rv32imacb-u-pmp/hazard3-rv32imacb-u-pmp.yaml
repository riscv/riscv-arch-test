# UDB architecture configuration for Hazard3 at Wren6991/Hazard3 commit
# ba0c83c657a21f2e9946cf02cbc6c8d3d9a7dab6, built with the config_act.vh that
# .github/scripts/install-hazard3.sh writes. CSR behavior is from doc/sections/csr.adoc
# and hdl/hazard3_csr.v.
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: hazard3-rv32imacb-u-pmp
description: Hazard3 (RP2350 CPU) - RV32IMACB_Zicsr_Zifencei with U-mode and 16 PMP regions

implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: A, version: "= 2.1.0" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  - { name: C, version: "= 2.0" }
  - { name: Zca, version: "= 1.0.0" }
  - { name: Zcb, version: "= 1.0.0" }
  - { name: B, version: "= 1.0.0" }
  - { name: Zba, version: "= 1.0.0" }
  - { name: Zbb, version: "= 1.0.0" }
  - { name: Zbs, version: "= 1.0.0" }
  - { name: Zbc, version: "= 1.0.0" }
  - { name: Zbkc, version: "= 1.0.0" }
  - { name: Zbkb, version: "= 1.0.0" }
  - { name: Zbkx, version: "= 1.0.0" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zifencei, version: "= 2.0" }
  - { name: Zicntr, version: "= 2.0" }
  # The decoder accepts every FENCE encoding, so pause runs as a fence that orders nothing,
  # and ntl.* and c.ntl.* are adds to x0.
  # https://github.com/Wren6991/Hazard3/blob/ba0c83c657a21f2e9946cf02cbc6c8d3d9a7dab6/hdl/hazard3_decode.v#L520
  # https://github.com/Wren6991/Hazard3/blob/ba0c83c657a21f2e9946cf02cbc6c8d3d9a7dab6/hdl/hazard3_instr_decompress.v#L236-L238
  - { name: Zihintntl, version: "= 1.0.0" }
  - { name: Zihintpause, version: "= 2.0.0" }
  - { name: U, version: "= 1.0.0" }
  - { name: Sm, version: "= 1.12.0" }

params:
  MXLEN: 32
  PHYS_ADDR_WIDTH: 32

  # misa is read-only. misa.X is set for the custom Xh3misa extension.
  MISA_CSR_IMPLEMENTED: true
  NON_STANDARD_EXTENSION_IMPLEMENTED: true
  MUTABLE_MISA_A: false
  MUTABLE_MISA_B: false
  MUTABLE_MISA_C: false
  MUTABLE_MISA_M: false
  MUTABLE_MISA_U: false

  M_MODE_ENDIANNESS: little
  U_MODE_ENDIANNESS: little
  UXLEN: [32]

  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_ECALL_FROM_U: true
  TRAP_ON_EBREAK: true
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_CSR: true
  TRAP_ON_ILLEGAL_WLRL: false

  # mtval is read-only zero.
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: false
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: false
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: false
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: false
  MTVAL_WIDTH: 0

  PRECISE_SYNCHRONOUS_EXCEPTIONS: true

  MEI_INTR_IMPL: true
  MSI_INTR_IMPL: true
  MTI_INTR_IMPL: true

  WFI_U_MODE: true
  WFI_FINITE: false

  MISALIGNED_LDST: false
  MISALIGNED_LDST_EXCEPTION_PRIORITY: high
  MISALIGNED_AMO: false
  LRSC_MISALIGNED_BEHAVIOR: "always raise misaligned exception"
  # The testbench's global exclusive monitor compares addresses masked to 64 bytes.
  LRSC_RESERVATION_STRATEGY: "reserve naturally-aligned 64-byte region"
  LRSC_FAIL_ON_NON_EXACT_LRSC: false
  LRSC_FAIL_ON_VA_SYNONYM: false

  VENDOR_ID_BANK: 0x0
  VENDOR_ID_OFFSET: 0x0
  MARCHID_IMPLEMENTED: true
  ARCH_ID_VALUE: 0x1b
  # mimpid[7:4] is the eco_version input, which the testbench ties to 0xa.
  MIMPID_IMPLEMENTED: true
  IMP_ID_VALUE: 0x810200a0
  CONFIG_PTR_ADDRESS: 0

  # MODE bit 1 is hardwired to 0, so a write of MODE = 2 or 3 selects Direct or Vectored.
  MTVEC_MODES: [0, 1]
  MTVEC_ACCESS: rw
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_BASE_ALIGNMENT_VECTORED: 4

  PMA_GRANULARITY: 2

  NUM_PMP_ENTRIES: 16
  NUM_USABLE_PMP_ENTRIES: 16
  PMP_GRANULARITY: 2
  PMP_NA4_SUPPORTED: true
  PMP_NAPOT_SUPPORTED: true
  PMP_TOR_SUPPORTED: true

  # mhpmcounter3..31 and mhpmevent3..31 are read-only zero.
  HPM_COUNTER_EN:
    [
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]

  MCOUNTINHIBIT_IMPLEMENTED: true
  COUNTINHIBIT_EN:
    [
      true,
      false,
      true,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]

  MCOUNTENABLE_EN:
    [
      true,
      true,
      true,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]

  # There is no time CSR. ACT emulates reads of time from the testbench's mtime.
  TIME_CSR_IMPLEMENTED: false
