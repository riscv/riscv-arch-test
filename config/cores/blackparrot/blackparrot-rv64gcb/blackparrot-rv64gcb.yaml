  # There is no time CSR; M-mode emulates it from the CLINT's mtime (RVMODEL_MTIME_ADDRESS).
  TIME_CSR_IMPLEMENTED: false
  # mcountinhibit, mcounteren and scounteren hold only CY and IR (https://github.com/black-parrot/black-parrot/blob/909619a68f3541a4cd0973767daf2a561d1f8c95/bp_common/src/include/bp_common_rv64_csr_defines.svh#L906-L917, #L1011-L1020);
  # mhpmcounter3-31 and mhpmevent3-31 read as zero (https://github.com/black-parrot/black-parrot/blob/909619a68f3541a4cd0973767daf2a561d1f8c95/bp_be/src/v/bp_be_calculator/bp_be_csr.sv#L144).
  HPM_COUNTER_EN:
    [
      false,
      false,
      false,
