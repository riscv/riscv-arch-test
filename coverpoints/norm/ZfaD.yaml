# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  - name: fcvtmod-w-d_op
    # The FCVTMOD.W.D instruction is defined similarly to the FCVT.W.D instruction, with the following differences. FCVTMOD.W.D always rounds towards zero. Bits 31:0 are taken from the rounded, unbounded two&#8217;s complement result, then sign-extended to XLEN bits and written to integer register rd. ±∞ and NaN are converted to zero.
    coverpoint:
      ["ZfaD_fcvtmod_w_d_cg/{cp_rd, cp_fs1, cp_fs1_edges_D, cp_csr_fflags_vn}"]
  # Floating-point exception flags are raised the same as they would be for FCVT.W.D with the
  # same input operand.
  - name: fcvtmod-w-d_flags
    coverpoint: ["ZfaD_fcvtmod_w_d_cg/{cp_fs1_edges_D, cp_csr_fflags_vn}"]
  # If the ext:d[] extension is implemented, insn:fleq.d[] and insn:fltq.d[] instructions
  # are analogously defined to operate on double-precision numbers.
  - name: fleq-d_fltq-d_op
    coverpoint:
      [
        "ZfaD_fleq_d_cg/{cp_rd, cp_fs1, cp_fs2, cp_csr_fflags_v, cr_fs1_fs2_edges_D}",
        "ZfaD_fltq_d_cg/{cp_rd, cp_fs1, cp_fs2, cp_csr_fflags_v, cr_fs1_fs2_edges_D}",
      ]
  # If the Q extension is implemented, FLEQ.Q and FLTQ.Q instructions are
  # analogously defined to operate on quad-precision numbers.
  - name: fleq-q_fltq-q_op
    coverpoint: ["TODO: needs a Q test suite"]
  - name: fli-d_op
    # If the D extension is implemented, FLI.D performs the analogous operation, but loads a double-precision value into floating-point register rd. Note that entry 1 (corresponding to the minimum positive normal value) has a numerically different value for double-precision than for single-precision. FLI.D is encoded like FLI.S, but with fmt=D.
    coverpoint: ["ZfaD_fli_d_cg/{cp_rs1_fli, cp_fd}"]
  # If the Q extension is implemented, FLI.Q performs the analogous operation, but loads
  # a quad-precision value into floating-point register rd. Note that entry 1 (corresponding to the
  # minimum positive normal value) has a numerically different value for quad-precision. FLI.Q
  # is encoded like FLI.S, but with fmt=Q.
  - name: fli-q_op
    coverpoint: ["TODO: needs a Q test suite"]
  # If the ext:d[] extension is implemented, insn:fminm.d[] and insn:fmaxm.d[]
  # instructions are analogously defined to operate on double-precision numbers.
  - name: fmaxm-d_fminm-d_op
    coverpoint:
      [
        "ZfaD_fmaxm_d_cg/{cp_fs1, cp_fs2, cp_fd, cp_csr_fflags_v, cr_fs1_fs2_edges_D}",
        "ZfaD_fminm_d_cg/{cp_fs1, cp_fs2, cp_fd, cp_csr_fflags_v, cr_fs1_fs2_edges_D}",
      ]
  # If the Q extension is implemented, FMINM.Q and FMAXM.Q instructions are
  # analogously defined to operate on quad-precision numbers.
  - name: fmaxm-q_fminm-q_op
    coverpoint: ["TODO: needs a Q test suite"]
  # If the D extension is implemented, FROUND.D and FROUNDNX.D instructions are
  # analogously defined to operate on double-precision numbers. They are encoded like FCVT.D.S,
  # but with rs2=4 and 5, respectively,
  - name: fround-d_froundnx-d_op
    # Representative coverpoints; also cp_fs1, cp_fd, cp_csr_fflags_v(n), and cp_csr_frm
    coverpoint:
      ["{ZfaD_fround_d_cg, ZfaD_froundnx_d_cg}/{cp_fs1_edges_D, cp_frm_2}"]
  # If the Q extension is implemented, FROUND.Q and FROUNDNX.Q instructions are
  # analogously defined to operate on quad-precision numbers. They are encoded like FCVT.Q.S,
  # but with rs2=4 and 5, respectively,
  - name: fround-q_froundnx-q_op
    coverpoint: ["TODO: needs a Q test suite"]
  - name: fmvh-x-d_op
    # For RV32 only, if the D extension is implemented, the FMVH.X.D instruction moves bits 63:32 of floating-point register rs1 into integer register rd. It is encoded in the OP-FP major opcode with funct3=0, rs2=1, and funct7=1110001.
    coverpoint: ["ZfaD_fmvh_x_d_cg/{cp_rd, cp_fs1, cp_fs1_edges_D}"]
  # For RV64 only, if the Q extension is implemented, the FMVH.X.Q instruction moves bits
  # 127:64 of floating-point register rs1 into integer register rd. It is encoded in the OP-FP major
  # opcode with funct3=0, rs2=1, and funct7=1110011.
  - name: fmvh-x-q_op
    coverpoint: ["TODO: needs a Q test suite"]
  - name: fmvp-d-x_op
    # For RV32 only, if the D extension is implemented, the FMVP.D.X instruction moves a double-precision number from a pair of integer registers into a floating-point register. Integer registers rs1 and rs2 supply bits 31:0 and 63:32, respectively; the result is written to floating-point register rd. FMVP.D.X is encoded in the OP-FP major opcode with funct3=0 and funct7=1011001.
    coverpoint:
      ["ZfaD_fmvp_d_x_cg/{cp_rs1, cp_rs2, cp_rs1_edges, cp_rs2_edges, cp_fd}"]
  # For RV64 only, if the Q extension is implemented, the FMVP.Q.X instruction moves a
  # double-precision number from a pair of integer registers into a floating-point register. Integer
  # registers rs1 and rs2 supply bits 63:0 and 127:64, respectively; the result is written to
  # floating-point register rd. FMVP.Q.X is encoded in the OP-FP major opcode with funct3=0 and
  # funct7=1011011.
  - name: fmvp-q-x_op
    coverpoint: ["TODO: needs a Q test suite"]
  # The insn:fleq.s[] and insn:fltq.s[] instructions are defined like the insn:fle.s[] and
  # insn:flt.s[] instructions, except that quiet NaN inputs do not cause the invalid
  # operation exception flag to be set.
  - name: fleq-s_fltq-s_op
    coverpoint:
      [
        "ZfaD_fleq_s_cg/{cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "ZfaD_fltq_s_cg/{cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
      ]
  - name: fli-s_op
    # The FLI.S instruction loads one of 32 single-precision floating-point constants, encoded in the rs1 field, into floating-point register rd. The correspondence of rs1 field values and single-precision floating-point values is shown in . FLI.S is encoded like FMV.W.X, but with rs2=1.
    coverpoint: ["ZfaD_fli_s_cg/{cp_NaNBox_D_S}"]
  # The insn:fminm.s[] and insn:fmaxm.s[] instructions are defined like the insn:fmin.s[]
  # and insn:fmax.s[] instructions, except that if either input is NaN, the result is the
  # canonical NaN.
  - name: fmaxm-s_fminm-s_op
    coverpoint:
      [
        "ZfaD_fmaxm_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
        "ZfaD_fminm_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S, cp_fs2_badNB_D_S}",
      ]
  - name: fround-s_op
    # The FROUND.S instruction rounds the single-precision floating-point
    # number in floating-point register rs1 to an integer, according to the
    # rounding mode specified in the instruction's rm field. It then writes
    # that integer, represented as a single-precision floating-point number,
    # to floating-point register rd
    coverpoint: ["ZfaD_fround_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S}"]
  - name: froundnx-s_op
    # The FROUNDNX.S instruction is defined similarly, but it also sets the inexact exception flag if the input differs from the rounded result and is not NaN. FROUNDNX.S is encoded like FCVT.S.D, but with rs2=5.
    coverpoint: ["ZfaD_froundnx_s_cg/{cp_NaNBox_D_S, cp_fs1_badNB_D_S}"]
