# CI configuration for Whisper simulator

# SsstrictSm, SsstrictS, SsstrictU excluded because of sail-riscv#1882, sail-riscv#1880
#   Should be fixed in Sail 0.14
# Smstateen Sail does not yet support 1P13 bit
# ExceptionsSvZalrsc: Whisper reports page faults where Sail expects access faults.
# Vx excluded because of https://github.com/tenstorrent/whisper/issues/35
# Sdtrig* not yet implemented in Sail
# ZicfissU, ZicfissS, ZicfissSm excluded due to a Whisper bug (to be reported upstream):
# menvcfg.SSE and senvcfg.SSE are not writable -- a csrs of bit 3 reads back 0 -- even
# though zicfiss is in the config's isa string and Whisper implements the instructions
# (enableZicfiss/execSspush are present in the binary). Zicfiss can therefore never be
# activated, so every shadow stack instruction and every ssp CSR access raises an
# illegal-instruction exception where Sail takes the architectural memory fault.
ci_enabled: true
# TODO: Remove SsstrictV when sail SsstrictV is implemented
exclude_extensions: "SsstrictSm,SsstrictS,SsstrictU,ExceptionsSvZalrsc,SsstrictV,Smstateen,Vx8,Vx16,Vx32,Vx64,SdtrigSm,SdtrigS,SdtrigU,ZicfissU,ZicfissS,ZicfissSm"
exclude_configs:
  - whisper-rv32-max-spike-ref
  - whisper-rv64-max-spike-ref
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 1
config_shards:
  whisper-rv64-max: 2
