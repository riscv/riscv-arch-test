  # any further modifications to its associated configuration or address registers are ignored until
  # a PMP reset, unless mseccfg.RLB is set.
  - name: mseccfg_mml_m_rule_op
    coverpoint: ["TODO: Smepmp is not yet tested"]

  # An S/U-mode-only rule is enforced on accesses whose effective privilege mode is Supervisor or
  # User and denied to accesses whose effective privilege mode is Machine.
  - name: mseccfg_mml_soru_rule_op
    coverpoint: ["TODO: Smepmp is not yet tested"]

  # A Shared-Region rule is enforced on all modes, with restrictions depending on the pmpcfg.L and
  # pmpcfg.X bits:
  - name: mseccfg_mml_shared_rule_op
    coverpoint: ["TODO: Smepmp is not yet tested"]

  # A Shared-Region rule where pmpcfg.L is not set can be used for sharing data between M-mode and
  # S/U-mode, so is not executable. M-mode has read/write access to that region, and S/U-mode has
  # read access if pmpcfg.X is not set, or read/write access if pmpcfg.X is set.
  - name: mseccfg_mml_shared_l0_op
    coverpoint: ["TODO: Smepmp is not yet tested"]

  # A Shared-Region rule where pmpcfg.L is set can be used for sharing code between M-mode and
  # S/U-mode, so is not writable. Both M-mode and S/U-mode have execute access on the region, and
  # M-mode also has read access if pmpcfg.X is set. The rule remains locked so that any further
  # modifications to its associated configuration or address registers are ignored until a PMP
  # reset, unless mseccfg.RLB is set.
  - name: mseccfg_mml_shared_l1_op
    coverpoint: ["TODO: Smepmp is not yet tested"]

  # The encoding pmpcfg.LRWX=1111 can be used for sharing data between M-mode and S/U mode, where
