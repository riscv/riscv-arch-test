    rules:
      - pmp_check_pagetable_access
      - pmp_with_paging
      - pmp_sfence_required
      - pmp_a_field_tor
  - name: pmp0_pte_nowrite_s
    goal: Verify PMP applies to the implicit page-table read of a store from S-mode
    description: "PMP_NAPOT_SUPPORTED only. S-mode: PMP entry 0 (NAPOT) covers the page table used by the walk, at each level, with R=0; the background PMP region allows everything else. Store (sw) to the page through va_data."
