# CI configuration for the Rocket family (Rocket + Saturn + H, Chipyard 1.14.0).
#
# Measured on act4 ae6f7d362 with #2649, #2655, #2657 and #2658 (3071 tests selected, 2805 pass)
# and on act4 96493a914 (the CI selection: 1777 tests, all pass), with the simulator from
# .github/scripts/install-rocket.sh: RC = chipsalliance/rocket-chip@55bcad0f with PR #3820
# (d1d2c5e7) and the TLB superpage-refill fix, SAT = ucb-bar/saturn-vectors@8ef05c9c with the
# acc_done fix. With the exclusions below every remaining test passes.

ci_enabled: true

#   Vx8, Vx16, Vx32, Vx64
#                 vsadd/vsaddu/vssub/vssubu .vx at each SEW (16 tests): csrr vxsat is not ordered
#                 after in-flight vector instructions (RC rocket/RocketCore.scala:1066), so vxsat
#                 reads back as 0.
#   Vf16, Vf32, Vf64, Zvfhmin, SmVF
#                 csrr/csrw fflags/fcsr are not ordered after in-flight vector FP instructions
#                 (RC rocket/RocketCore.scala:1065). Also: inactive elements set fflags
#                 (SAT exu/fp/SharedFPFMA.scala:148, exu/fp/FPDiv.scala:300), FPComp raises NV
#                 for quiet NaNs and for vfsgnj (SAT exu/fp/FPComp.scala:60,98,156), widening ops
#                 drop NV for signaling NaNs (SAT exu/fp/SharedFPFMA.scala:79-102), FP sum
#                 reductions start at +0 (SAT insns/Instructions.scala:177-180) and conversions
#                 round RMM as RNE (SAT exu/fp/FPConv.scala:33).
#   ExceptionsVx, ExceptionsVf16, ExceptionsVf32, ExceptionsVf64, ExceptionsVfmin
#                 The vstart != 0 illegal-instruction trap writes the PC to mtval
#                 (SAT frontend/PipelinedFaultCheck.scala:221).
#   ExceptionsVls Passes, but runs about 300 s on its own, at run_tests.py's 300 s per-test limit.
#   SmV           SmV_vset: vsetvli x0, x0 right after another vset uses the stale vl; the
#                 rd = rs1 = x0 form reads the CSR in EX before the earlier vset writes it in WB
#                 (RC rocket/RocketCore.scala:498-504,1032-1035).
#   SsstrictV     Selected without Ssstrict until #2657; Saturn does not trap reserved vector
#                 encodings, which is legal without Ssstrict.
#   Sm            mhpmcounter3..31 are 40 bits wide (RC rocket/CSR.scala:212) and mie.SGEIE is
#                 read-only zero with GEILEN = 0; the reference model cannot express either.
#   Sv, Sstvecd   Rocket converts non-canonical addresses written to stval/stvec into other
#                 invalid addresses (bit 51 sign-extended), which the reference model does
#                 not model.
exclude_extensions: "Vx8,Vx16,Vx32,Vx64,Vf16,Vf32,Vf64,Zvfhmin,SmVF,ExceptionsVx,ExceptionsVf16,ExceptionsVf32,ExceptionsVf64,ExceptionsVfmin,ExceptionsVls,SmV,SsstrictV,Sm,Sv,Sstvecd"

apt_packages: "autoconf flex bison help2man libfl-dev ccache device-tree-compiler"
install_script: ".github/scripts/install-rocket.sh"
setup_script: ".github/scripts/setup-rocket.sh"
shards: 4
