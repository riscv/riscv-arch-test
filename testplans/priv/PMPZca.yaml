# yaml-language-server: $schema=testplan.schema.json
suite: PMPZca
source: https://docs.google.com/spreadsheets/d/1VuBt-H9VVWh8k-USAJEplrgEJETjQ-iNjD4Iq_ZOnN0/edit?gid=1336315481#gid=1336315481
coverpoints:
  - heading: "See PMPM for general information.\nTests run in M mode.\nIn this suite, loads = c.lw, c.lwsp; stores = c.sw; c.swsp, fetch = c.jalr\nIgnore c.jr, c.j, c.jal because these are a hassle to test and their uncompressed forms were tested in PMPM.\nRV64 only: loads += c.ld, c.ldsp; stores += c.sd; c.sdsp\nZcf only: loads += c.flw, c.flwsp; stores += c.fsw, c.fswsp\nZcd only: loads += c.fld, c.fldsp; stores += c.fsd, c.fsdsp\nZcb only: loads += c.lbu, c.lh, c.lhu; stores +=  c.sb; c.sh"
  - name: cp_cfg_RW
    goal: The R, W, ...bits, when set, indicate that the PMP entry permits read, write
    description: |-
      Check that WR bits control write/read access for every type of load and store.
      Attempt all types of reads and writes with pmpcfg_i.L=1, all legal pmpcfg_i.XWR
      Observe proper access faults for restricted read/write regions
    bins: 6 XWR * (~6 loads + ~6 stores)
    id: |-
      pmp_cfg_permissions

      pmp_access_fault_exception

      pmp_l_bit_m_mode_enforcement
  - name: cp_misaligned_napot
    goal: |-
      The lowest-numbered PMP entry that matches any byte of an access determines whether that access succeeds or fails.  The matching PMP entry must match all bytes of an access, or the access fails... On some implementations, misaligned loads, stores, and instruction fetches may also be decomposed
      into multiple accesses, some of which may succeed
    description: |-
      Check that misaligned 32-bit fetches that cross a NAPOT PMP boundary fail.
      Set up a 3 standard consecutive NAPOT PMP regions with L=1, XWR=111 (XWR = 000 for region 3).
      Place an uncompressed ret = jalr ra inside first region, inside second region, and misaligned straddling the start and end of the second regions.
      Attempt jalr to each ret.  Observe possible instr access fault on fetches straddling region boundaries.
    expectation: May succeed if decomposed
    bins: 4 addresses
    id: |-
      pmp_entry_priority

      pmp_full_match_required

      pmp_access_fault_exception

      pmp_misaligned_access_behavior
  - name: cp_cret_napot
    goal: |-
      The lowest-numbered PMP entry that matches any byte of an access determines whether that access succeeds or fails.  The matching PMP entry must match all bytes of an access, or the access fails... On some implementations, misaligned loads, stores, and instruction fetches may also be decomposed
      into multiple accesses, some of which may succeed
    description: |-
      Check that 16-bit fetches adjacent to a NAPOT PMP boundary succeed.
      Set up a standard NAPOT PMP region with L=1, XWR = 111.
      Place four c.ret = c.jr ra statements just below, at bottom, at top, and just above PMP region, half of which are on 16-bit boundaries. Attempt jalr to each c.ret.
      Observe success on all jumps
    bins: 4 addresses
    id: |-
      pmp_entry_priority

      pmp_full_match_required

      pmp_access_fault_exception
  - name: cp_misaligned_tor
    goal: |-
      The lowest-numbered PMP entry that matches any byte of an access determines whether that access succeeds or fails.  The matching PMP entry must match all bytes of an access, or the access fails... On some implementations, misaligned loads, stores, and instruction fetches may also be decomposed
      into multiple accesses, some of which may succeed
    description: |-
      Check that misaligned 32-bit fetches that cross a TOR boundary fail.
      Set up a 3 standard consecutive TOR PMP regions with L=1, XWR=111 (XWR = 000 for region 3)
      Place an uncompressed ret = jalr ra inside first region, inside second region, and misaligned straddling the start and end of the second regions.
      Attempt jalr to each ret.  Observe instr access fault on fetches straddling region boundaries.
    bins: 4 addresses
    id: |-
      pmp_entry_priority

      pmp_full_match_required

      pmp_access_fault_exception

      pmp_misaligned_access_behavior
  - name: cp_cret_tor
    goal: |-
      The lowest-numbered PMP entry that matches any byte of an access determines whether that access succeeds or fails.  The matching PMP entry must match all bytes of an access, or the access fails... On some implementations, misaligned loads, stores, and instruction fetches may also be decomposed
      into multiple accesses, some of which may succeed
    description: |-
      Check that 16-bit fetches adjacent to a TOR PMP boundary succeed.
      Set up a standard TOR PMP region with L=1, XWR = 111.
      Place four c.ret = c.jr ra statements just below, at bottom, at top, and just above PMP region, half of which are on 16-bit boundaries. Attempt jalr to each c.ret.
      Observe success on all jumps
    bins: 4 addresses
    id: |-
      pmp_entry_priority

