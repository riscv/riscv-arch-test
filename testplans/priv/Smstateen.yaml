# yaml-language-server: $schema=testplan.schema.json
suite: Smstateen
source: https://docs.google.com/spreadsheets/d/1zm67nLKLn_tszDTzJQ9BIMOB7wuiskcuj3Mql4TOciA/edit?gid=1207083655#gid=1207083655
coverpoints:
  - name: cp_mstateen_reset_val
    goal: On reset all mstateen CSRs' bits are initialized to zeros.
    description: As first test after reset, read mstateen0-3.  For RV32, also read msstateen0-3h
    expectation: "0"
    bins: 4-8 CSRs
    rules:
      - mstateen_zero_initialization
  - name: cp_walking_ones
    goal: Bits are accessible
    description: |-
      Write mstateen0-3 with walking ones & walking zero, and read each back.
      For RV32, also write msstateen0-3h.
    expectation: Access successful
    bins: 4-8 CSRs * 128-64 walking ones/zero
    rules:
      - mstateen_rv64_csrs
      - stateen_rv32_upper_bits_csrs
      - stateen_warl_access
      - stateen_unimplemented_state_roz
      - stateen_reserved_roz
      - mstateen0_fcsr_roz
  - name: cp_csr_illegal_accesses
    goal: Each stateen CSR allows read/write access from its own and higher privilege modes and denies read/writeaccess from lower privilege modes
    description: |-
      In U-mode (and S, VS and VU-mode if supported), write mstateen0-3 with all ones, and read it back.
      For RV32, also write msstateen0-3h
    expectation: Illegal instruction
    bins: 4-8CSRs
    rules:
      - stateen_op
      - stateen_illegal_state_access
  - name: cp_fcsr
    goal: fcsr controls access to fcsr when misa.F = 0
    description: |-
      If Zfinx is supported, with misa.F = 0: With mstateen0.FCSR = 0, mstateen0.FCSR = 1 with the hstateen0 and
      sstateen0 bit set, and mstateen0.FCSR = 1 with the hstateen0 and sstateen0 bit clear, read and write fcsr, frm
      and fflags from M, S, U, VS and VU-mode (S, VS and VU where supported).
    expectation: |-
      Always successful from M-mode, whatever the bits are. With mstateen0.FCSR = 0, illegal instruction from S, U,
      VS and VU-mode. With mstateen0.FCSR = 1, as hstateen0 and sstateen0 and the usual CSR privilege rules allow; a
      clear hstateen0 and sstateen0 bit restricts only the modes below its own level.
    bins: "3 states (fewer without H or S) x 5 modes x 3 accesses x 3 CSRs"
    rules:
      - stateen0_fcsr_op
      - stateen0_fcsr0_misa_f0_illegal_fpu_instr
  - name: cp_jvt_access
    goal: jvt controls access
    description: |-
      If Zcmt is supported: With mstateen0.JVT = 0, mstateen0.JVT = 1 with the hstateen0 and sstateen0 bit set, and
      mstateen0.JVT = 1 with the hstateen0 and sstateen0 bit clear, read and write jvt from M, S, U, VS and VU-mode
      (S, VS and VU where supported).
    expectation: |-
      Always successful from M-mode, whatever the bits are. With mstateen0.JVT = 0, illegal instruction from S, U,
      VS and VU-mode. With mstateen0.JVT = 1, as hstateen0 and sstateen0 and the usual CSR privilege rules allow; a
      clear hstateen0 and sstateen0 bit restricts only the modes below its own level.
    rules:
      - stateen0_jvt_op
  - name: cp_envcfg
    goal: envcfg controls access to senvcfg
    description: |-
      With mstateen0.ENVCFG = 0, mstateen0.ENVCFG = 1 with the hstateen0 bit set, and mstateen0.ENVCFG = 1 with the
      hstateen0 bit clear, read and write senvcfg (and henvcfg with H) from M, S, U, VS and VU-mode (S, VS and VU
      where supported).
    expectation: |-
      Always successful from M-mode, whatever the bits are. With mstateen0.ENVCFG = 0, illegal instruction from S,
      U, VS and VU-mode. With mstateen0.ENVCFG = 1, as hstateen0 and the usual CSR privilege rules allow; a clear
      hstateen0 bit restricts only the modes below its own level.
    bins: "3 states (2 without H) x 5 modes x 3 accesses x CSRs"
    rules:
      - mstateen0_envcfg_op
  - name: cp_csrind
    goal: csrind controls access
    description: |-
      If Sscsrind is supported: With mstateen0.CSRIND = 0, mstateen0.CSRIND = 1 with the hstateen0 bit set, and
      mstateen0.CSRIND = 1 with the hstateen0 bit clear, read and write siselect and sireg, sireg2-6 from M, S, U,
      VS and VU-mode (S, VS and VU where supported).
    expectation: |-
      Always successful from M-mode, whatever the bits are. With mstateen0.CSRIND = 0, illegal instruction from S,
      U, VS and VU-mode. With mstateen0.CSRIND = 1, as hstateen0 and the usual CSR privilege rules allow; a clear
      hstateen0 bit restricts only the modes below its own level.
    bins: "3 states (2 without H) x 5 modes x 3 accesses x 7 CSRs"
    rules:
      - mstateen0_csrind_op
  - name: cp_aia
    goal: aia controls access
    description: |-
      If Ssaia is supported: With mstateen0.AIA = 0, mstateen0.AIA = 1 with the hstateen0 bit set, and mstateen0.AIA
      = 1 with the hstateen0 bit clear, read and write the state Ssaia adds from M, S, U, VS and VU-mode (S, VS and
      VU where supported).
    expectation: |-
      Always successful from M-mode, whatever the bits are. With mstateen0.AIA = 0, illegal instruction from S, U,
      VS and VU-mode. With mstateen0.AIA = 1, as hstateen0 and the usual CSR privilege rules allow; a clear
      hstateen0 bit restricts only the modes below its own level.
    bins: "3 states (2 without H) x 5 modes x 3 accesses x CSRs"
    rules:
      - mstateen0_aia_op
  - name: cp_imsic
    goal: ismic controls access
    description: |-
      If an IMSIC is supported: With mstateen0.IMSIC = 0, mstateen0.IMSIC = 1 with the hstateen0 bit set, and
      mstateen0.IMSIC = 1 with the hstateen0 bit clear, read and write stopei from M, S, U, VS and VU-mode (S, VS
      and VU where supported).
    expectation: |-
      Always successful from M-mode, whatever the bits are. With mstateen0.IMSIC = 0, illegal instruction from S, U,
      VS and VU-mode. With mstateen0.IMSIC = 1, as hstateen0 and the usual CSR privilege rules allow; a clear
      hstateen0 bit restricts only the modes below its own level.
    bins: "3 states (2 without H) x 5 modes x 3 accesses x CSRs"
    rules:
      - mstateen0_imsic_op
  - name: cp_context
    goal: sdtrig controls access
    description: |-
      If Sdtrig is supported: With mstateen0.CONTEXT = 0, mstateen0.CONTEXT = 1 with the hstateen0 bit set, and
      mstateen0.CONTEXT = 1 with the hstateen0 bit clear, read and write scontext (and hcontext where implemented)
      from M, S, U, VS and VU-mode (S, VS and VU where supported).
    expectation: |-
      Always successful from M-mode, whatever the bits are. With mstateen0.CONTEXT = 0, illegal instruction from S,
      U, VS and VU-mode. With mstateen0.CONTEXT = 1, as hstateen0 and the usual CSR privilege rules allow; a clear
      hstateen0 bit restricts only the modes below its own level.
    bins: "3 states (2 without H) x 5 modes x 3 accesses x CSRs"
    rules:
      - mstateen0_context_op
  - name: cp_p1p13
    goal: hedelegh controls access
    description: |-
      If Sm1p13 and H are supported, on RV32: With mstateen0.P1P13 = {0,1}, read and write hedelegh from M, S, U, VS
      and VU-mode (S, VS and VU where supported).
    expectation: |-
      Always successful from M-mode. With mstateen0.P1P13 = 0, illegal instruction from the other modes; with it 1,
      as the usual CSR privilege rules allow.
    bins: "2 states x 5 modes x 3 accesses"
    rules:
      - mstateen0_p1p13_op
  - name: cp_srmcfg
    goal: srmcfg controls access
    description: |-
      If Ssqosid is supported: With mstateen0.SRMCFG = {0,1}, read and write srmcfg from M, S, U, VS and VU-mode (S,
      VS and VU where supported).
    expectation: |-
      Always successful from M-mode. With mstateen0.SRMCFG = 0, illegal instruction from the other modes; with it 1,
      as the usual CSR privilege rules allow.
    bins: "2 states x 5 modes x 3 accesses"
    rules:
      - mstateen0_srmcfg_op
  - name: cp_ctr
    goal: ctr controls access
    description: |-
      If Ssctr is supported: With mstateen0.CTR = 0, mstateen0.CTR = 1 with the hstateen0 bit set, and mstateen0.CTR
      = 1 with the hstateen0 bit clear, read and write sctrdepth and sctrstatus from M, S, U, VS and VU-mode (S, VS
      and VU where supported).
    expectation: |-
      Always successful from M-mode, whatever the bits are. With mstateen0.CTR = 0, illegal instruction from S, U,
      VS and VU-mode. With mstateen0.CTR = 1, as hstateen0 and the usual CSR privilege rules allow; a clear
      hstateen0 bit restricts only the modes below its own level.
    bins: "3 states (2 without H) x 5 modes x 3 accesses x 2 CSRs"
    rules:
      - mstateen_ctr1
      - mstateen_ctr0
  - name: cp_fcsr_fp_instrs
    goal: fcsr controls floating-point instructions when misa.F = 0
    description: |-
      If Zfinx is supported, with misa.F = 0: With mstateen0.FCSR = 0, mstateen0.FCSR = 1 with the hstateen0 and
      sstateen0 bit set, and mstateen0.FCSR = 1 with the hstateen0 and sstateen0 bit clear, execute fadd.s,
      fcvt.w.s, fcvt.s.w and fclass.s from M, S, U, VS and VU-mode (S, VS and VU where supported).
    expectation: |-
      Same as cp_fcsr.
    bins: "3 states (fewer without H or S) x 5 modes x 4 instructions"
    rules:
      - stateen0_fcsr0_misa_f0_illegal_fpu_instr
  - name: cp_mstateen_se_controls_sstateen
    goal: Bit 63 of mstateen0-3 controls access to sstateen0-3
    description: |-
      For N = 0-3: with mstateenN bit 63 = 0, = 1 with hstateenN bit 63 set, and (if H is supported) = 1 with
      hstateenN bit 63 clear, read and write sstateenN from M, S and (if H is supported) VS-mode, and check the
      value read. For RV32, bit 63 is bit 31 of mstateenNh and hstateenNh.
    expectation: |-
      Always successful from M-mode. Otherwise illegal instruction if mstateenN bit 63 = 0; if it is 1, successful
      from S-mode, and from VS-mode virtual instruction if hstateenN bit 63 = 0, else successful. sstateen1-3 read 0
      (they have no defined bits). Bit 63 may be read-only zero without the hypervisor extension; the bit = 1 bins
      are then unreachable.
    bins: "4 CSRs * 3 states (2 without H) * 3 modes (2 without H) * 3 ops"
    rules:
      - mstateen_bit_63_op
      - mstateen0_se0_op
      - stateen_illegal_state_access
      - stateen_reserved_roz
      - sstateen_vsmode_access_roz
  - name: cp_mstateen_se_controls_hstateen
    goal: Bit 63 of mstateen0-3 controls access to hstateen0-3
    description: |-
      If H is supported, for N = 0-3 and mstateenN bit 63 = {0,1}, read and write hstateenN from M-mode and HS-mode.
      For RV32, also access hstateenNh, where bit 63 is bit 31 of mstateenNh.
    expectation: |-
      Always successful from M-mode. From HS-mode, illegal instruction if 0, else successful.
    bins: "4-8 CSRs * 2 states * 2 modes * 3 ops"
    rules:
      - mstateen_bit_63_op
      - stateen_illegal_state_access
  - name: cp_mstateen0_se0_only_sstateen0
    goal: Bits that are zero in mstateen0 are read-only zero in sstateen0
    description: |-
      With only mstateen0.SE0 set, set a walking one in sstateen0 with csrs and clear a walking zero with csrc, from M-mode and S-mode.
    expectation: Every sstateen0 bit other than read-only ones stays zero.
    rules:
      - mstateen_lower_priv_roz
  - name: cp_mstateen0_se0_only_hstateen0
    goal: Bits that are zero in mstateen0 are read-only zero in hstateen0
    description: |-
      If H is supported, with only mstateen0.SE0 set, set a walking one in hstateen0 with csrs and clear a walking zero with csrc, from M-mode and HS-mode.
    expectation: Every hstateen0 bit other than read-only ones stays zero.
    rules:
      - mstateen_lower_priv_roz
  - heading: "Note: All of these tests are performed in M-mode unless otherwise noted."
  - heading: "Note: The feature and sstateen tests set and clear the mstateen bit and run from M, S, U, and (with H) VS and VU-mode. Each sets the bit in hstateen0 and sstateen0 after changing the mstateen bit, so only the mstateen bit changes the result. The coverpoints sample the bit in all three CSRs."
  - heading: "Note: Tests that set mstateen to all ones and vary hstateen0 and sstateen0 are in Ssstateen."
  - heading: "Note: Smstateen implies U-mode (otherwise there is no need for this extension)"
