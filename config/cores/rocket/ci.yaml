  # Sm_V_vset_M, S_V_vset_S, U_V_vset_U, H_V_vset_VU: vsetvli x0, x0 right after another vset uses the
  # stale vl; the rd = rs1 = x0 form reads the CSR in EX before the earlier vset writes it in WB
  # (RC rocket/RocketCore.scala:498-504,1032-1035).
  - Sm_V_vset
  - S_V_vset
  - U_V_vset
  - H_V_vset_VU
  # Sm_VF_M, S_VF_S, U_VF_U, H_VF_VS, H_VF_VU: fflags is not ordered after vector FP instructions
  # (above).
  - Sm_VF
  - S_VF
  - U_VF
  - H_VF
  # mcause bit 4 is not writable, so exception code 20 reads back as 4. mcause is WLRL, but with H
  # the guest-page-fault codes 20-23 are supported values, so they must read back.
  - Sm_mcause
  # cp_mtime_write reads time, which is not implemented, without checking for Zicntr (a test bug,
  # fixed by riscv-arch-test PR #3114).
  - Sm_mcsr_cntr
  # ebreak from VS/VU writes the guest PC to mtval/stval but leaves mstatus.GVA/hstatus.GVA 0: CSR.scala
  # takes tval = epc for ebreak (RC rocket/CSR.scala:1035) but GVA from io.gva, which RocketCore sets
  # only for pipeline exceptions, not for ebreak (RC rocket/RocketCore.scala:880).
  - Exceptions_HSm_ecall
  - Exceptions_HSm_hedeleg_vs
  - Exceptions_HSm_hedeleg_vu
  - Exceptions_HSm_xtinst
  - Exceptions_H_hedeleg_vs
  - Exceptions_H_hedeleg_vu
  - Exceptions_H_xtinst
  # The vstart != 0 illegal-instruction trap writes the PC to mtval/stval instead of the instruction
  # (SAT frontend/PipelinedFaultCheck.scala:221).
  - ExceptionsVx
  # wfi in VU-mode with mstatus.TW = 1 raises a virtual-instruction exception instead of an
  # illegal-instruction exception (RC rocket/CSR.scala:954 ignores TW when V = 1 and the mode is U).
  - InterruptsS_wfi_timeout_VU
  - InterruptsSm_wfi_timeout_VU
  # A misaligned load whose second page has a guest-page fault raises load address misaligned:
  # Rocket translates only the first page before raising misaligned, while the reference model
  # with MISALIGNED_LDST_EXCEPTION_PRIORITY = low translates both and reports the guest-page fault.
  - Shtvala_straddle
  # Hypervisor address translation:
  #  - Sv_H_*_gpa_wide: htval on a guest-page fault during the VS-stage walk is not the guest physical
  #    address of the PTE >> 2 (Sv39x4: 0x...800 where the model has 0x...802; Sv48x4: bit 48 dropped).
  #  - Sv_H_sv39x4_gpa_width: with vsatp = Bare, htval for a guest physical address with bits above 40
  #    set has a spurious bit 50.
  #  - Sv_H_sv48x4_gpa_width: with vsatp = Bare, stval on the guest-page fault is the address
  #    sign-extended from bit 51 (0xfff8... for 0x0008...).
  #  - Sv_H_*_hlv: hlvx.wu with SPVP = 1 and vsstatus.SUM = 1 raises a load page fault on a U page;
  #    HLVX checks execute permission in place of read permission but is otherwise the same as HLV,
  #    so SUM applies.
  - Sv_H_sv39x4_gpa_wide
  - Sv_H_sv48x4_gpa_wide
  - Sv_H_sv39x4_gpa_width
  - Sv_H_sv48x4_gpa_width
  - Sv_H_sv39x4_hlv
  - Sv_H_sv48x4_hlv

apt_packages: "autoconf flex bison help2man libfl-dev ccache device-tree-compiler"
install_script: ".github/scripts/install-rocket.sh"
setup_script: ".github/scripts/setup-rocket.sh"
shards: 4
