  # mcounteren exists because U-mode is implemented. CY (0), TM (1) and IR (2) are all
  # writable - TM has no hardware effect because there is no time CSR, but the field still
  # exists so that M-mode software can decide whether to emulate U-mode time reads, which
  # is exactly what ACT's invisible trap handler does. Bits 3..31 are RES0.
  #   Quote: "| 31:3 | - | RES0 | 2 | `ir` | If 1, U-mode is permitted to access the
  #   `instret`/`instreth` ... | 1 | `tm` | No hardware effect, as the `time`/`timeh` CSRs
  #   are not implemented. However, this field still exists, as M-mode software can use it
  #   to track whether it should emulate U-mode attempts to access those CSRs. | 0 | `cy` |"
  #   https://github.com/Wren6991/Hazard3/blob/8af992930f71a69b0e06c38734c1094f41a05ca0/doc/sections/csr.adoc#L273-L277
