  MUTABLE_MISA_D: true
  MUTABLE_MISA_F: true
  MUTABLE_MISA_M: true
  MUTABLE_MISA_S: true
  MUTABLE_MISA_U: true
  MSTATUS_FS_LEGAL_VALUES: [0, 1, 2, 3]
  MSTATUS_VS_LEGAL_VALUES: [0]
  HW_MSTATUS_FS_DIRTY_UPDATE: precise
  M_MODE_ENDIANNESS: little
  S_MODE_ENDIANNESS: little
  SXLEN: [64]
  UXLEN: [64]
  U_MODE_ENDIANNESS: little
  MTVEC_ACCESS: rw
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_BASE_ALIGNMENT_VECTORED: 4
  MTVEC_MODES: [0, 1]
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: retain
  MTVAL_WIDTH: 64
  STVEC_MODES: [0, 1]
  STVEC_BASE_ALIGNMENT_VECTORED: 4
  STVAL_WIDTH: 64
  # mie.MEIE and mie.SEIE are writable. ACT's testbench drives their external inputs
  # independently through byte registers at 0x20004 and 0x20005; mip.SEIP is also writable.
  MEI_INTR_IMPL: true
  MSI_INTR_IMPL: true
  MTI_INTR_IMPL: true
  SEI_INTR_IMPL: true
  SSI_INTR_IMPL: true
  STI_INTR_IMPL: true
