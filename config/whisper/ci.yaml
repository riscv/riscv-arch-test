# CI configuration for Whisper simulator

# SsstrictSm: Sail 0.15 lacks Smaia and Smrnmi, whose CSRs Whisper implements; Whisper also
#   exposes CSRs that do not exist on the configured hart (ssp without Zicfiss, S-level AIA CSRs
#   without S-mode, hidelegh without H, RV32 mhpmevent<n>h without Sscofpmf)
# Smstateen: the -mu configs pass. On the max configs Whisper implements Sscsrind and Ssaia, so
#   mstateen0.CSRIND, AIA and IMSIC are writable, but Sail does not model those extensions
#   (https://github.com/riscv/sail-riscv/issues/1134, https://github.com/riscv/sail-riscv/pull/1874).
# SsstrictS: Sail traps on siselect/stopi accesses that Whisper permits with mstateen0 enabled.
# Sdtrig*: Sail does not implement mcontrol6 (https://github.com/riscv/sail-riscv/issues/222), so the Mcontrol6 and
#   AExt tests have no reference. The icount tests pass, and the -spike-ref configs pass all Sdtrig tests.
# Ssnpm,SsnpmSm,Smmpm,SmnpmS,SmnpmSSm,SmnpmU,SmnpmUSm : Failing due to mismatch in stval/mtval ,Issue Link (https://github.com/riscv/sail-riscv/issues/1962)
# Sm: mstatus.SPELP is writable without S (https://github.com/tenstorrent/whisper/issues/104)
ci_enabled: true
exclude_extensions: "SsstrictSm,SsstrictS,Smstateen,SdtrigSm,SdtrigS,SdtrigU,Ssnpm,SsnpmSm,Smmpm,SmnpmS,SmnpmSSm,SmnpmU,SmnpmUSm,Sm"
exclude_configs:
  - whisper-rv32-max-spike-ref
  - whisper-rv64-max-spike-ref
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 1
config_shards:
  whisper-rv64-max: 2
