# Mapping of normative rules to coverpoints for a test suite
#
# Zvkb is the general home for normative rules that apply across all vector-crypto (Zvk*)
# extensions: data-independent timing, EGS/EGW/vl/vstart constraints, and shared
# extension-dependency facts. Zvkb's own instructions (vandn, vbrev8, vrev8, vrol, vror)
# are the same instructions as Zvbb's under a different extension gate; their functional
# _op rules are homed in Zvbb.yaml and are not duplicated here.

normative_rule_definitions:
  # All instructions shall be implemented with data-independent timing. That is, the latency
  # of the execution of these instructions shall not vary with different input values.
  - name: zvk_dataindep_timing
    coverpoint:
      [
        "TODO: data-independent execution timing (a side-channel-resistance property) cannot be observed from a final-state signature comparison",
      ]

  # For all of the vector crypto instructions in this specification, EEW=SEW.
  - name: veccrypto_eeweqsew
    coverpoint:
      [
        "TODO: EEW=SEW is inherent in every vector-crypto instruction's encoding; no dedicated coverpoint isolates it",
      ]

  # Since vl and vstart refer to elements, Vector Crypto instructions that use element
  # groups require that these values are an integer multiple of the Element Group Size
  # (EGS).
  - names: [veccrypto_vl_egsconstr, veccrypto_vstart_egsconstr]
    coverpoint:
      [
        "TODO: no coverpoint verifies vl/vstart are rejected when not a multiple of EGS - the functional suites only ever generate compliant values",
      ]

  # Instructions that violate the vl or vstart requirements are reserved.
  - names: [veccrypto_vl_rsv, veccrypto_vstart_rsv]
    coverpoint:
      [
        "TODO: no Ssstrict-equivalent suite exists for the vector-crypto extensions to exercise vl/vstart values that violate the EGS constraint",
      ]

  # For element-group instructions, LMUL*VLEN must always be at least as large as EGW,
  # otherwise an illegal-instruction exception is raised, even if vl=0.
  - name: veccrypto_lmul_egwconstr
    coverpoint:
      [
        "TODO: no ExceptionsZvk-style suite exists yet to exercise the LMUL*VLEN<EGW illegal-instruction condition",
      ]

  # Some Vector Crypto instructions are only defined for a specific SEW. In such a case all
  # other SEW values are reserved.
  - name: veccrypto_sew_rsv
    coverpoint:
      [
        "Out-of-Scope: reserved because of CSR state (vtype.sew); no Ssstrict-equivalent suite exists to exercise these reserved SEW encodings; see the per-instruction _sewn32_rsv/_sewn64_rsv rules in each extension's own file",
      ]

  # In the case of the *.vs instructions defined in this specification, vs2 holds a 128-bit
  # scalar element group. These instructions enable a single key, specified as a scalar
  # element group in vs2, to be applied to each element group of register group vd.
  - name: veccrypto_vsins_vs2
    coverpoint: ["Zvkned_vaesdf_vs_cg/cp_vs2_egs4"]

  # For implementations with VLEN >= 128, vs2 refers to a single register. Thus, the vd
  # register group must not overlap the vs2 register. However, in implementations where VLEN
  # < 128, vs2 refers to a register group comprised of the number of registers needed to
  # hold the 128-bit scalar element group. In this case, the vd register group must not
  # overlap this vs2 register group.
  - name: veccrypto_vsins_vdvs2overlap
    coverpoint:
      [
        "TODO: this is an SsstrictV-style reserved-encoding test; no register-overlap coverpoint exists yet for the *.vs instruction forms (e.g. Zvkned_vaesdf_vs_cg has no cmp_vd_vs2-style coverpoint)",
      ]

  # they return vector results to vd, which is also a source vector operand.
  - name: veccrypto_vsins_vd
    coverpoint: ["Zvkg_vghsh_vv_cg/cp_vd_egs4"]

  # The Zvknhb, Zvkn, Zvknc, Zvkng, and Zvksc extensions depend on ext:zve64x[].
  - names:
      [
        Zvknhb_depZve64x,
        Zvkn_depZve64x,
        Zvknc_depZve64x,
        Zvkng_depZve64x,
        Zvksc_depZve64x,
      ]
    coverpoint:
      [
        "TODO: extension-composition fact; no dedicated coverpoint exists for it (Zvkn/Zvknc/Zvkng/Zvksc are not separate suites in this repo)",
      ]

  # All of the other Vector Crypto Extensions depend on ext:zve32x[].
  - names:
      [
        Zvkb_depZve32x,
        Zvkg_depZve32x,
        Zvkned_depZve32x,
        Zvknha_depZve32x,
        Zvksed_depZve32x,
        Zvksh_depZve32x,
        Zvks_depZve32x,
        Zvksc_depZve32x,
        Zvksg_depZve32x,
        Zvkt_depZve32x,
      ]
    coverpoint:
      [
        "TODO: extension-composition fact; no dedicated coverpoint exists for it (Zvks/Zvksc/Zvksg/Zvkt are not separate suites in this repo)",
      ]

  # It is important to note that the Vector Crypto instructions are independent of the
  # implementation of the ext:zkt[] extension and do not require that ext:zkt[] is
  # implemented.
  - name: veccrypto_indepZkt
    coverpoint:
      [
        "TODO: independence from an unrelated extension's implementation is not something a coverpoint can assert one way or the other",
      ]

  # All of the other Vector Crypto Extensions depend on Zve32x.
  - name: Zvkb_Zvkg_Zvkned_Zvknha_Zvksed_Zvksh_Zvks_Zvksc_Zvksg_Zvkt_depZve32x
    coverpoint: ["Definition, checked through UDB"]

  # Each bit of Op1 is inverted and logically ANDed with the corresponding bits in vs2.
  - name: vandn_op
    # Representative coverpoints; also Zvkb16, Zvkb32 and the Zvbb vandn covergroups
    coverpoint:
      [
        "Zvkb8_vandn_vv_cg/cr_vs2_vs1_edges",
        "Zvkb8_vandn_vx_cg/cr_vs2_rs1_edges",
        "Zvkb64_vandn_vv_cg/cr_vs2_vs1_edges",
        "Zvkb64_vandn_vx_cg/cr_vs2_rs1_edges",
      ]

  # In the vector-scalar version, Op1 is the sign-extended or truncated value in scalar register
  # rs1.
  - name: vandn-vx_rs1
    # Representative coverpoints; also the Zvbb vandn.vx covergroups
    coverpoint:
      [
        "Zvkb8_vandn_vx_cg/cr_vs2_rs1_edges",
        "Zvkb16_vandn_vx_cg/cr_vs2_rs1_edges",
        "Zvkb32_vandn_vx_cg/cr_vs2_rs1_edges",
        "Zvkb64_vandn_vx_cg/cr_vs2_rs1_edges",
      ]

  # In the vector-vector version, Op1 is vs1.
  - name: vandn-vv_vs1
    # Representative coverpoints; also the Zvbb vandn.vv covergroups
    coverpoint:
      [
        "Zvkb8_vandn_vv_cg/cr_vs2_vs1_edges",
        "Zvkb16_vandn_vv_cg/cr_vs2_vs1_edges",
        "Zvkb32_vandn_vv_cg/cr_vs2_vs1_edges",
        "Zvkb64_vandn_vv_cg/cr_vs2_vs1_edges",
      ]

  # A bit reversal is performed on the bits of each byte.
  - name: vbrev8-v_op
    # Representative coverpoints; also Zvkb16, Zvkb32 and the Zvbb vbrev8 covergroups
    coverpoint:
      [
        "Zvkb8_vbrev8_v_cg/{cp_vs2_edges, cr_vl_lmul_sew8}",
        "Zvkb64_vbrev8_v_cg/{cp_vs2_edges, cr_vl_lmul_sew64}",
      ]

  # A byte reversal is performed on each element of vs2, effectively performing an endian swap.
  - name: vrev8-v_op
    # Representative coverpoints; also Zvkb16, Zvkb32 and the Zvbb vrev8 covergroups
    coverpoint:
      [
        "Zvkb8_vrev8_v_cg/{cp_vs2_edges, cr_vl_lmul_sew8}",
        "Zvkb64_vrev8_v_cg/{cp_vs2_edges, cr_vl_lmul_sew64}",
      ]

  # The elements in vs2 are rotated left by the rotate amount specified by either the corresponding
  # elements of vs1 (vector-vector), or integer register rs1 (vector-scalar). Only the low log2(SEW)
  # bits of the rotate-amount value are used, all other bits are ignored.
  - name: vrol_op
    # Representative coverpoints; also Zvkb16, Zvkb32 and the Zvbb vrol covergroups
    coverpoint:
      [
        "Zvkb8_vrol_vv_cg/cr_vs2_vs1_edges",
        "Zvkb8_vrol_vx_cg/cr_vs2_rs1_edges",
        "Zvkb64_vrol_vv_cg/cr_vs2_vs1_edges",
        "Zvkb64_vrol_vx_cg/cr_vs2_rs1_edges",
      ]

  # The elements in vs2 are rotated right by the rotate amount specified by either the corresponding
  # elements of vs1 (vector-vector), integer register rs1 (vector-scalar), or an immediate value
  # (vector-immediate). Only the low log2(SEW) bits of the rotate-amount value are used, all other
  # bits are ignored.
  - name: vror_op
    # Representative coverpoints; also Zvkb16, Zvkb32, Zvkb64 and the Zvbb vror covergroups
    coverpoint:
      [
        "Zvkb8_vror_vv_cg/cr_vs2_vs1_edges",
        "Zvkb8_vror_vx_cg/cr_vs2_rs1_edges",
        "Zvkb8_vror_vi_cg/cr_vs2_imm_edges",
        "Zvkb64_vror_vi_cg/cr_vs2_imm_edges",
        "TODO: vror.vi with i5=1 (rotate amounts 32-63 at SEW=64)",
      ]

  # The Zvkt extension requires all implemented instructions from the following list to be executed
  # with data-independent execution latency as defined in the RISC-V Scalar Cryptography Extensions
  # specification.
  - name: Zvkt_req
    coverpoint: ["Untestable: microarchitectural timing"]

  # Data-independent execution latency (DIEL) applies to all data operands of an instruction, even
  # those that are not a part of the body or that are inactive. However, DIEL does not apply to
  # other values such as vl, vtype, and the mask (when used to control execution of a masked vector
  # instruction).
  - name: Zvkt_diel_def
    coverpoint: ["Untestable: microarchitectural timing"]

  # Also, DIEL does not apply to constant values specified in the instruction encoding such as the
  # use of the zero register (x0), and, in the case of immediate forms of an instruction, the values
  # in the immediate fields (i.e., imm and uimm).
  - name: Zvkt_diel_constants_exempt
    coverpoint: ["Untestable: microarchitectural timing"]

  # In some cases—which are explicitly specified in the lists below—operands that are used as
  # control rather than data are exempt from DIEL.
  - name: Zvkt_diel_control_exempt
    coverpoint: ["Untestable: microarchitectural timing"]
