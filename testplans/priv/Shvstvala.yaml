# yaml-language-server: $schema=testplan.schema.json
suite: Shvstvala
source: https://docs.google.com/spreadsheets/d/1DWBEoprndjQzLTXQTzPI8jW1HydtkYRR3tg58q59fdk/edit?gid=970539312#gid=970539312
notes: |
  Following tests are done in from VU-mode and VS-mode into VS-mode
coverpoints:
  - heading: Initialize vstval to some random value before each test
  - name: cp_load_page_fault
    goal: Fault writes VA to vstval
    description: Load from bad page
    expectation: vstval written with VA
    bins: '2'
    rules:
      - vstval must be written with the faulting virtual address for load, store, and instruction page-fault, access-fault, and misaligned exceptions, and for breakpoint exceptions other than those caused by execution of the EBREAK or C.EBREAK instructions. For virtual-instruction and illegal-instruction exceptions, stval must be written with the faulting instruction.
  - name: cp_store_page_fault
    goal: Fault writes VA to vstval
    description: Store to bad page
    expectation: vstval written with VA
    bins: '2'
  - name: cp_instr_page_fault
    goal: Fault writes VA to vstval
    description: Fetch from bad page
    expectation: vstval written with VA
    bins: '2'
  - name: cp_load_access_fault
    goal: Fault writes VA to vstval
    description: Load from ACCESS_FAULT_ADDRESS+4
    expectation: vstval written with VA
    bins: '2'
    rules:
      - don't use ACCESS_FAULT_ADDR because it is probably 0 and doesn't prove hvstval is writable
  - name: cp_store_access_fault
    goal: Fault writes VA to vstval
    description: Store to ACCESS_FAULT_ADDRESS+4
    expectation: vstval written with VA
    bins: '2'
  - name: cp_instr_access_fault
    goal: Fault writes VA to vstval
    description: Fetch from ACCESS_FAULT_ADDRESS+4
    expectation: vstval written with VA
    bins: '2'
  - name: cp_misaligned_load
    goal: Fault writes VA to vstval
    description: lw from scratch+2
    expectation: no fault, or vstval written with VA
    bins: '2'
    rules:
      - No fault when misaligned load/store supported (e.g. Zicclsm)
  - name: cp_misaligned_store
    goal: Fault writes VA to vstval
    description: sw to scratch+2.  Scratch should be 8 bytes
    expectation: no fault, or vstval written with VA
    bins: '2'
    rules:
      - No fault when misaligned load/store supported (e.g. Zicclsm)
  - name: cp_misaligned_instr
    goal: Fault writes VA to vstval
    description: fetch ret from scratch+2.
    expectation: no fault, or vstval written with VA
    bins: '2'
    rules:
      - No fault when Zca is supported
  - name: cp_virt_instr
    goal: Fault writes instr to vstval
    description: Cause virtual instruction fault
    expectation: vstval written with instr
    bins: '2'
  - name: cp_illegal_instr
    goal: Fault writes instr to vstval
    description: Cause illegal instruction fault
    expectation: vstval written with instr
    bins: '2'
  - heading: Note that debug breakpoint vstval is checked in Sdtrig ***confirm when written
