    coverpoint: ["NOT TESTED"]

  # Some HINT instructions are encoded as integer computational instructions that
  # overwrite their destination register with its current value, e.g., c.addi x8, 0.
  # When such a HINT is executed with XLEN &lt; MXLEN and bits MXLEN..XLEN of the
  # destination register not all equal to bit XLEN-1, it is implementation-defined
  # whether bits MXLEN..XLEN of the destination register are unchanged or are
  # overwritten with copies of bit XLEN-1. This definition allows implementations to
  # elide register write-back for some HINTs, while allowing them to execute other
  # HINTs in the same manner as other integer computational instructions. The
  # implementation choice is observable only by privilege modes with an XLEN setting
  # greater than the current XLEN; it is invisible to the current privilege mode.
  - name: xlen_reduction_hint_op
    coverpoint: ["Out of scope"]

  # Instruction fetches are always little-endian.
  - name: endianness_inst_fetch_little
    coverpoint: ["Tested by executing instructions"]

  # Reset and NMI vector locations are given in a platform specification.
  - name: rst_and_nmi_addr
    coverpoint: ["Tested with linker script", "Out of scope"]

  # When a trap is delegated to S-mode The mcause, mepc, and mtval registers and the
  # MPP and MPIE fields of mstatus are not written.
  - name: trap_del_s_mode_no_m_mode
    coverpoint:
      [
        "Untested; S-mode handler does not have access to M-mode CSRs and changing to M-mode disturbs CSRs",
      ]

  # Attempts to write a read-only register raise illegal-instruction exceptions.
  - name: Zicsr_illegal_acc
    coverpoint: ["Sm_mcsr_cg/cp_csr_ro"]

  # Attempts to access a CSR without appropriate privilege level raise
  # illegal-instruction exceptions or, as described in &lt;&lt;sec:hcauses&gt;&gt;,
  # virtual-instruction exceptions.
  - name: Zicsr_illegal_mode
    coverpoint: ["Sm_mcsr_cg/cp_csr_insufficient_priv"]

  # 0x7B0-0x7BF are only visible to debug mode. Implementations must raise
  # illegal-instruction exceptions on machine-mode access to the latter set of
  # registers.
  - name: Zicsr_debug_illegal
    coverpoint: ["Sm_mcsr_cg/cp_csr_insufficient_priv"]

  # A read/write register might also contain some bits that are read-only, in which
  # case writes to the read-only bits are ignored.
  - name: Zicsr_write_ro
    coverpoint: ["Sm_mcsr_cg/{cp_mcsr_access, cp_misa_mxl}"]

  # For forward compatibility, implementations that do not furnish these fields must
  # make them read-only zero. These fields are labeled WPRI in the register
  # descriptions.
  - name: Zicsr_wpri_roz
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access (e.g. mstatus)"]

  # Software should not write anything other than legal values to such a field, and
  # should not assume a read will return a legal value unless the last write was of
  # a legal value, or the register has not been written since another operation
  # (e.g., reset) set the register to a legal value. These fields are labeled WLRL
  # in the register descriptions.
  - name: Zicsr_wlrl
    coverpoint:
      ["Sm_mcause_cg/{cp_mcause_write_exception, cp_mcause_write_interrupt}"]

  # Implementations will not raise an exception on writes of unsupported values to a
  # WARL field.
  - name: Zicsr_warl
    coverpoint: ["Sm_mcsr_cg/cp_mcsr_access"]

  # Platforms provide a real-time counter, exposed as a memory-mapped machine-mode read-write
  # register, mtime.
  - name: mtime_acc
    coverpoint: ["Sm_mcsr_cg/{cp_mtime_write, cp_mtime_wraparound}"]

  # mtime must increment at constant frequency
  - name: mtime_op
    coverpoint:
      [
        "Sm_mcsr_cg/cp_mtime_wraparound",
        "Constant frequency is untestable without an independent time reference",
      ]

  # the platform must provide a mechanism for determining the period of an mtime tick.
  - name: mtime_tick_period
    coverpoint: ["Platform requirement outside the ISA; not tested"]

  # The mtime register will wrap around if the count overflows.
  - name: mtime_wrap
    coverpoint: ["Sm_mcsr_cg/cp_mtime_wraparound"]

  # The mtime register has a 64-bit precision on all RV32 and RV64 systems.
  - name: mtime_sz
    coverpoint:
      [
        "Sm_mcsr_cg/{cp_mtimeh_write, cp_mtimeh_wraparound}",
        "TODO: on RV64, check that mtime bits 63:32 are writable",
      ]

  # Platforms provide a 64-bit memory-mapped machine-mode timer compare register (mtimecmp).
  - name: mtimecmp_sz
    coverpoint: ["TODO: write and read back all 64 bits of mtimecmp"]

  - name: mtime_enc_img
    coverpoint: ["Sm_mcsr_cg/{cp_mtime_write, cp_mtime_wraparound}"]

  - name: mtimecmp_enc_img
    coverpoint: ["TODO: write and read back all 64 bits of mtimecmp"]

  # In RV32, memory-mapped writes to mtimecmp modify only one 32-bit part of the register.
  - name: mtimecmp_rv32_wr
    coverpoint:
      ["TODO: on RV32, write each half of mtimecmp and read back both halves"]

  # For RV64, naturally aligned 64-bit memory accesses to the mtime and mtimecmp registers are
  # additionally supported and are atomic.
  - name: mtime_mtimecmp_rv64_wr
    coverpoint:
      [
        "Sm_mcsr_cg/cp_mtime_wraparound",
        "ZawrsSm_cg/cp_wrs_resume",
        "Atomicity is not observable in a single-hart test",
      ]

  # When mtime changes, it is guaranteed to be reflected in time and timeh eventually, but not
  # necessarily immediately.
  - name: time_timeh_visibility_mtime
    coverpoint: ["Sm_mcsr_cg/{cp_mtime_write, cp_mtimeh_write}"]

  # ECALL and EBREAK cause the receiving privilege mode’s epc register to be set to the address of
  # the ECALL or EBREAK instruction itself, not the address of the following instruction.
  - name: ecall_ebreak_epc_value
    coverpoint:
      [
        "Sm_mprivinst_cg/cp_mprivinst",
        "ExceptionsSm_cg/{cp_ecall_m, cp_breakpoint}",
      ]

  - name: xret_enc_img
    coverpoint: ["Sm_mprivinst_cg/{cp_mret, cp_sret}"]

  # MRET is always provided.
  - name: mret_presence
    coverpoint: ["Sm_mprivinst_cg/cp_mret"]

  # If the Zalrsc extension is supported, the xRET instruction is allowed to clear any outstanding
  # LR address reservation but is not required to.
  - name: xret_clr_lr_resv
    coverpoint: ["Either behavior is legal; not tested"]

  # Upon reset, a hart’s privilege mode is set to M.
  - name: m_mode_priv_at_reset
    coverpoint:
      ["Sm_mcsr_cg/cp_mcsr_access runs right after booting and requires M-mode"]

  # The mstatus fields MIE and MPRV are reset to 0.
  - name: mstatus_mie_mprv_rst
    coverpoint:
      ["TODO: record mstatus.MIE and MPRV before the boot code writes mstatus"]

  # If little-endian memory accesses are supported, the mstatus/mstatush field MBE is reset to 0.
  - name: mstatus_mstatush_mbe_rst
    coverpoint:
      ["TODO: record mstatus/mstatush.MBE before the boot code writes it"]

  # For implementations with the Zalrsc standard extension, there is no valid load reservation.
  - name: ld_rsv_rst
    coverpoint:
      ["TODO: execute an SC before any LR after reset and check that it fails"]

  # The pc is set to an implementation-defined reset vector.
  - name: pc_rst
    coverpoint: ["Tested with linker script"]

  # The mcause register is set to a value indicating the cause of the reset.
  - name: mcause_rst1_val
    coverpoint: ["Implementation-specific reset cause; not tested"]

  # Writable PMP registers’ A and L fields are set to 0, unless the platform mandates a different
  # reset value for some PMP registers’ A and L fields.
  - name: pmp_a_l_rst
    coverpoint:
      [
        "TODO: record the writable pmpcfg A and L fields before the boot code writes them",
      ]

  # If the hypervisor extension is implemented, the hgatp.MODE and vsatp.MODE fields are reset to 0.
  - name: hgatp_vsatp_mode_rst
    coverpoint:
      ["TODO: record hgatp.MODE and vsatp.MODE after reset, before any write"]

  # No WARL field contains an illegal value.
  - name: warl_rst
    coverpoint:
      [
        "TODO: check that WARL fields hold legal values before the boot code writes them",
      ]

  # All other hart state is UNSPECIFIED.
  - name: rst_other_state_unspec
    coverpoint: ["Behavior is UNSPECIFIED by the specification; not tested"]

  # The MML, MMWP, and RLB fields of the mseccfg register are set to 0, unless the platform mandates
  # a different reset value.
  - name: mseccfg_mml_mmwp_rlb_rst
    coverpoint:
      ["TODO: record mseccfg.MML, MMWP, and RLB after reset, before any write"]

  # The mcause values after reset have implementation-specific interpretation
  - name: mcause_rst2_val
    coverpoint: ["Implementation-specific reset cause; not tested"]

  # the value 0 should be returned on implementations that do not distinguish different reset
  # conditions. Implementations that distinguish different reset conditions should only use 0 to
  # indicate the most complete reset.
  - name: mcause_rst_zero
    coverpoint: ["Implementation-specific reset cause; not tested"]

  # The USEED and SSEED fields of the mseccfg CSR must have defined reset values. The system must
  # not allow them to be in an undefined state after reset.
  - name: mseccfg_useed_sseed_rst
    coverpoint:
      ["TODO: record mseccfg.USEED and SSEED after reset, before any write"]

  # mcause reset values may alias mcause values following synchronous exceptions
  - name: mcause_rst_alias_ok
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # cause an immediate jump to an implementation-defined NMI vector running in M-mode regardless of
  # the state of a hart’s interrupt enable bits. The mepc register is written with the virtual
  # address of the instruction that was interrupted,
  - name: nmi_op
    coverpoint:
      ["TODO: needs a platform mechanism (RVMODEL macro) to raise an NMI"]

  # mcause is set to a value indicating the source of the NMI.
  - name: nmi_mcause_source
    coverpoint:
      ["TODO: needs a platform mechanism (RVMODEL macro) to raise an NMI"]

  # The values written to mcause on an NMI are implementation-defined.
  - name: nmi_mcause_impl_def
    coverpoint: ["Implementation-defined; not tested"]

  # The high Interrupt bit of mcause should be set to indicate that this was an interrupt. An
  # Exception Code of 0 is reserved to mean unknown cause and implementations that do not
  # distinguish sources of NMIs via the mcause register should return 0 in the Exception Code.
  - name: nmi_mcause_restrictions
    coverpoint:
      ["TODO: needs a platform mechanism (RVMODEL macro) to raise an NMI"]

  # NMIs do not reset processor state
  - name: nmi_no_rst
    coverpoint:
      ["TODO: needs a platform mechanism (RVMODEL macro) to raise an NMI"]
