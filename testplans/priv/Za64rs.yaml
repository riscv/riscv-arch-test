# yaml-language-server: $schema=testplan.schema.json
suite: Za64rs
source: https://docs.google.com/spreadsheets/d/10NX0T4MgueqA4p7JNg4whCq2k3YZ9R73UCV88MtcIUA/edit?gid=910803819#gid=910803819
coverpoints:
  - name: cp_za64rs
    goal: An SC outside the naturally aligned 64-byte block containing the LR fails
    description: "base = scratch+64. lr.w at every word of that block. sc.w at base+64 and base-4. The SC address is filled with the complement of the SC data and read back."
    expectation: "rd matches the reference model (failure code 1) and the canary is unchanged. The outcome inside the block is not checked."
    bins: "16 LR offsets x {next block, previous block}"
    rules:
      - Reservation sets are contiguous, naturally aligned, and a maximum of 64 bytes.
  - name: cp_za64rs_d
    goal: The same block boundary for lr.d/sc.d on RV64
    description: "Same block. lr.d at every doubleword. sc.d at base+64 and base-8. The SC address is filled with the complement of the SC data and read back."
    expectation: "rd matches the reference model (failure code 1) and the doubleword canary is unchanged."
    bins: "8 LR offsets x {next block, previous block}"
    rules:
      - Reservation sets are contiguous, naturally aligned, and a maximum of 64 bytes.
