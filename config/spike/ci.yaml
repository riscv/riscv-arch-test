# CI configuration for Spike simulator
# Shared across all Spike configs

ci_enabled: true
# Run experimental extensions in their dedicated workflow job.
exclude_configs:
  - spike-rv64-experimental
exclude_extensions:
  # Sail lacks Ssaia/Sscsrind, so expects illegal instead of virtual instruction for their CSRs from VU-mode
  # (https://github.com/riscv/sail-riscv/issues/1134).
  - H_vucsr
  # spike-rv32-max only: scontext is 16 bits wide on RV32 in Spike but 32 bits in Sail (cp_context).
  # https://github.com/riscv/sail-riscv/issues/2054
  # The exclusion applies to every Spike config, so the other configs, which pass, lose Smstateen too until
  # exclusions can be given per config.
  - Smstateen
  - Ssstateen
  # Sscofpmf_Sm_access fails on rv32-max only; the other Sscofpmf groups pass. Spike hardwires mhpmcounter3..31
  # to 0 but keeps mhpmevent3..31 writable (https://github.com/riscv-software-src/riscv-isa-sim/issues/2370). Sail's
  # writable_hpm_counters makes both or neither writable, so no reference config matches.
  - Sscofpmf_Sm_access
  - Sscofpmf_Sm_inhibit
  - Sscofpmf_Sm_mcounteren
  - Sscofpmf_Sm_overflow
  - Sscofpmf_Sm_shadow
  - Sscofpmf_S_inhibit
  - Sscofpmf_S_mcounteren
  - Sscofpmf_S_overflow
  - Sscofpmf_S_shadow
  - Sscofpmf_U_inhibit
  - Sscofpmf_U_overflow
install_script: ".github/scripts/install-spike.sh"
apt_packages: "device-tree-compiler libboost-regex-dev libboost-system-dev"
shards: 1
config_shards:
  spike-rv32-mu: 2
  spike-rv32-max: 2
  spike-rv64-m: 2
  spike-rv64-mu: 2
  spike-rv64-max: 2
