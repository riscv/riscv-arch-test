# Mapping of normative rules to coverpoints for a test suite
#
# Zicclsm (Main Memory Misaligned Accesses) has a single normative rule. It is
# exercised by every suite that performs misaligned loads and stores to main
# memory and expects them to complete: the Misalign* suites (scalar integer,
# compressed, F/D floating point, and vector loads/stores at misaligned
# addresses), and the misaligned-load/store coverpoints of the exception suites,
# which check that no address-misaligned exception is raised. In UDB, Zicclsm
# requires MISALIGNED_LDST=true, which is the parameter those suites key on.
# The rule excludes AMOs, LR/SC and other Za* accesses, so ExceptionsZaamo,
# ExceptionsZalrsc and Zama16b are deliberately not listed.
#
# This file also maps the rules of the other Zicc* main-memory PMA extensions
# (Ziccif, Ziccrse, Ziccamoa, Ziccamoc), which have no suites of their own. Every
# suite runs code and data from main memory, so the suites whose instructions a
# rule requires main memory to support are the ones cited.

normative_rule_definitions:
  # If the Zicclsm extension is implemented, then misaligned loads and stores to main memory
  # regions with both the coherence and cacheability PMAs must be supported.
  - name: Zicclsm_misaligned_support
    # Representative coverpoints; also cp_misalign of the other Misalign, MisalignZca, MisalignF and
    # MisalignD covergroups, cp_misalignv_ls_element_misaligned and cp_misalignv_ls_wholereg_misaligned
    # of the other MisalignV covergroups, and cp_load/store_address_misaligned of the Exceptions*
    # suites, which with MISALIGNED_LDST=true must complete without an address-misaligned exception
    coverpoint:
      [
        "{Misalign_lw_cg, Misalign_sw_cg}/cp_misalign",
        "MisalignZca_c_lw_cg/cp_misalign",
        "MisalignV_vle32_v_cg/cp_misalignv_ls_element_misaligned",
      ]

  # If the Ziccif extension is implemented, main memory regions with both the coherence
  # and cacheability PMAs must support instruction fetch, and any instruction fetches of
  # naturally aligned power-of-2 sizes of at most min(ILEN,XLEN) bits are atomic.
  - name: Ziccif_if_atomicity
    coverpoint:
      [
        "Instruction fetch from main memory is exercised by every test; fetch atomicity is OUT-OF-SCOPE for single hart",
      ]
  # An implementation with the Ziccif extension fetches instructions in a manner
  # equivalent to the following state machine.
  - name: Ziccif_fetch_mechanism
    coverpoint: ["OUT-OF-SCOPE for single hart"]
  # Memory protection and executability PMAs are applied only to bytes that are not discarded
  # by this algorithm.
  - name: Ziccif_pma_application
    # TODO: execute an instruction that ends at the top of an executable PMP or PMA region,
    # below a non-executable region, and check that it does not fault
    coverpoint: [""]
  # If the Ziccrse extension is implemented, then main memory regions with both the
  # coherence and cacheability PMAs must support the RsrvEventual PMA.
  - name: Ziccrse_rsrv_eventual
    coverpoint: ["{Zalrsc_sc_w_cg, Zalrsc_sc_d_cg}/cp_sc_pass_fail"]
  # The Ziccrse extension requires RsrvEventual support to main memory regions with both the
  # coherence and cacheability PMAs.
  - name: Ziccrse_pma_rsrv_req
    coverpoint: ["{Zalrsc_sc_w_cg, Zalrsc_sc_d_cg}/cp_sc_pass_fail"]
  # If the Ziccamoa extension is implemented, then main memory regions with both the
  # coherence and cacheability PMAs must provide AMOArithmetic-level PMA support.
  - name: Ziccamoa_amo_pma
    # Representative coverpoints; also cp_asm_count of the other Zaamo_amo*_cg covergroups
    coverpoint:
      [
        "Zaamo_amoswap_w_cg/cp_asm_count",
        "Zaamo_amoand_w_cg/cp_asm_count",
        "Zaamo_amoadd_w_cg/cp_asm_count",
        "Zaamo_amomax_w_cg/cp_asm_count",
      ]
  # The Ziccamoa extension requires AMOArithmetic-level support to main memory regions with
  # both the coherence and cacheability PMAs.
  - name: Ziccamoa_pma_amo_req
    # Representative coverpoints; also cp_asm_count of the other Zaamo_amo*_cg covergroups
    coverpoint:
      [
        "Zaamo_amoswap_w_cg/cp_asm_count",
        "Zaamo_amoand_w_cg/cp_asm_count",
        "Zaamo_amoadd_w_cg/cp_asm_count",
        "Zaamo_amomax_w_cg/cp_asm_count",
      ]
  # If the Ziccamoc extension is implemented, then main memory regions with both the
  # coherence and cacheability PMAs must provide AMOCASQ-level PMA support.
  - name: Ziccamoc_casq_pma
    coverpoint:
      [
        "Zacas_amocas_w_cg/cp_asm_count",
        "Zacas_amocas_d_cg/cp_asm_count",
        "Zacas_amocas_q_cg/cp_asm_count",
      ]
  # The Ziccamoc extension requires AMOCASQ-level support to main memory regions with both the
  # coherence and cacheability PMAs.
  - name: Ziccamoc_pma_amo_req
    coverpoint:
      [
        "Zacas_amocas_w_cg/cp_asm_count",
        "Zacas_amocas_d_cg/cp_asm_count",
        "Zacas_amocas_q_cg/cp_asm_count",
      ]
