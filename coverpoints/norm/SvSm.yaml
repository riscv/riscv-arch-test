# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # The satp CSR is an SXLEN-bit read/write register, formatted as shown in  for
  # SXLEN=32 and  for SXLEN=64, which controls supervisor-mode address translation and
  # protection. This register holds the physical page number (PPN) of the root page
  # table, i.e., its supervisor physical address divided by 4 KiB; an address space
  # identifier (ASID), which facilitates address-translation fences on a per-address-
  # space basis; and the MODE field, which selects the current address-translation
  # scheme. Further details on the access to this register are described in .
  - names: [satp_sz, satp_acc, satp_op, satp_mode]
    coverpoint: ["SvSm_satp_cg/cp_access_m"]

  # When csr::[mprv]=0, explicit memory accesses behave as normal, using the translation
  # and protection mechanisms of the current privilege mode. When csr::[mprv]=1, load
  # and store memory addresses are translated and protected, and endianness is applied,
  # as though the current privilege mode were set to csr::[mpp].
  - name: mstatus_mprv_ldst_op
    coverpoint: ["SvSm_mstatus_mprv_cg/cp_mprv_{load,store}"]

  # Instruction address-translation and protection are unaffected by the setting of
  # csr::[mprv].
  - name: mstatus_mprv_inst_xlat_op
    coverpoint: ["SvSm_mstatus_mprv_cg/cp_mprv_ins"]

  # When csr::[sum]=0, S-mode memory accesses to pages that are accessible by U-mode
  # (U=1 in <<sv32pte>>) will fault. When csr::[sum]=1, these accesses are permitted.
  - names: [mstatus_sum_op, mstatus_sum_op_mprv_mpp]
    coverpoint: ["SvSm_mstatus_mprv_cg/cp_mprv_upage_smode_sumunset_{noread,nowrite,noexec}", "SvSm_mstatus_mprv_cg/cp_mprv_upage_smode_sumset_{exec,read,write}"]

  # The csr::[tvm] (Trap Virtual Memory) bit is a WARL field that supports intercepting
  # supervisor virtual-memory management operations. When csr::[tvm]=1, attempts to read
  # or write the csr:satp[] CSR or execute an insn:sfence.vma[] or insn:sinval.vma[]
  # instruction while executing in S-mode will raise an illegal-instruction exception.
  # When csr::[tvm]=0, these operations are permitted in S-mode. csr::[tvm] is read-only
  # 0 when S-mode is not supported or if csr:satp[mode] is read-only 0; otherwise, it
  # must be writable.
  - names: [mstatus_tvm_op, MSTATUS_TVM_WARL]
    coverpoint: ["SvSm_mstatus_mprv_cg/cp_tvm_exception_s", "SvinvalSm_cg/cr_svinival"]

  # The csr::[mbe], csr::[sbe], and csr::[ube] bits in csr:mstatus[] and csr:mstatush[]
  # are WARL fields that control the endianness of memory accesses other than
  # instruction fetches. Each may be read/write or read-only.
  - names: [MSTATUS_SBE_WARL, MSTATUSH_SBE_WARL, mstatus_sbe_implicit]
    coverpoint: ["SvSm_mstatus_mprv_cg/cp_mstatus_sbe_{read,write}", "NORUN: needs big-endian implicit page-table accesses"]

  # If mtval is written with a nonzero value when a breakpoint, address-misaligned,
  # access-fault, page-fault, or hardware-error exception occurs on an instruction
  # fetch, load, or store, then mtval will contain the faulting virtual address.
  - name: mtval_vaddr_wr1
    coverpoint: ["SvSm_mstatus_mprv_cg/{load_page_fault,store_page_fault}", "mtval is checked by the trap signature"]
