# yaml-language-server: $schema=testplan.schema.json
suite: Svinval
source: https://docs.google.com/spreadsheets/d/1LGwD2e01j4SN9tg85nt6gPwpp7nXyXMF7hqbw3jvXko/edit?gid=1207540560#gid=1207540560
coverpoints:
  - heading: "General Test Environment (Svinval):\n- T-SBI suite: boots to S-mode; the U-mode case uses RVTEST_TSBI_GOTO_UMODE / _SMODE. mstatus.TVM=0."
  - name: cr_svinival
    goal: Verify the Svinval instructions in S-mode and U-mode with mstatus.TVM=0
    description: "S-mode: execute sfence.w.inval, sinval.vma x0, x0, sfence.inval.ir and sfence.vma x0, x0. Switch to U-mode with RVTEST_TSBI_GOTO_UMODE and execute the same four instructions."
    expectation: "S-mode: all four execute without exception. U-mode: illegal-instruction exception (scause = 2) for each."
    bins: |-
      cp_instr x cp_priv x cp_tvm
      = 8 bins on RV64, 8 on RV32
    id: Svinval_illegal_instruction_u_mode Svinval_sfence_w_inval_inval_u_mode Svinval_sfence_w_inval_inval_s_vs_mode
    rules:
      - "[norm:Svinval_illegal_instruction_u_mode] [norm:Svinval_sfence_w_inval_inval_u_mode] [norm:Svinval_sfence_w_inval_inval_s_vs_mode]"
  - name: cp_sinval_vma
    goal: The Svinval sequence removes a stale S-mode translation
    description: "Sv39 on RV64, Sv32 on RV32, with every implemented satp.ASID bit set.  In S-mode, map a virtual address to page A and load from it.  Point the leaf at page B and run sfence.w.inval, sinval.vma rs1, rs2 and sfence.inval.ir, with rs1 = x0 or the address and rs2 = x0 or the current ASID, and the address with all ASIDMAX bits set in rs2.  Load again."
    expectation: The load after the sequence reads page B.  Both loads are recorded.  A hart that caches no translation passes.
    bins: S x sinval.vma x satp paged x rs1 {x0, register} x rs2 {x0, register} = 4 bins
    rules:
      - Svinval_sinval_vma_invalidates_same_as_sfence_vma
      - Svinval_sfence_w_inval_orders_before_sinval_vma
      - Svinval_sequence_rs1_rs2
