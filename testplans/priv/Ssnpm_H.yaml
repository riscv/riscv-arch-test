      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_misaligned_equivalence
  - name: cp_vs_hardware_csr_writes_fault_load
    goal: Pointer masking is applied to the addresses that hardware writes to stval and htval on a faulting access in VS-mode
    description: |-
      When a fault occurs on an explicit memory access under pointer masking, the stval written by hardware holds the
      masked effective address, not the raw tagged address.  On a guest-page fault, htval holds the GPA of that address
      shifted right by 2.  htval is not an address on other faults (zero),
      so it is read on every fault and the signature records which case it was.

      Test Environment:
       In HS-mode, identity map the test image in both stages; the VS-stage data pages have PTE.U = 0.
       Set henvcfg.PMM and the other PMM fields as in the notes, then HFENCE.GVMA x0, x0 and HFENCE.VVMA x0, x0.
       Leave hedeleg clear and delegate the load and store access faults, page faults and guest-page faults to HS-mode with medeleg, so every fault is taken in HS-mode.
       Use two base addresses and construct the addresses by applying the tags below to each.  Only 0x0000 and fully
       masked tags are used, so the faulting address is valid and stval and htval are deterministic: on a guest-page
       fault htval is zero or the GPA shifted right by 2, and on any other fault htval is zero.
        - fault base: RVMODEL_ACCESS_FAULT_ADDRESS_LOAD, if defined, identity mapped in both stages and unmapped after
          the accesses, which take a load access fault.  It is used only where masking leaves it unchanged (bits
          63:XLEN-PMLEN-1 clear with vsatp paged, bits 63:XLEN-PMLEN with vsatp = Bare), and where it fits that
          mapping: inside the width of each stage (a low-half address of the VS stage, and below 2^48 with Sv57x4,
          whose root entry for the test image is split), and outside the entries (root, or level 3 with Sv57x4) that
          map the guest code alias and the guest-page-fault base.
        - guest-page-fault base (hgatp paged only): with vsatp = Bare, the GPA 0x17F_C000_0000, inside every G-stage
          width and left unmapped; with vsatp paged, a guest virtual address that the VS stage maps to it
          (0x3F_C000_0000 for Sv39 and 0x7FFF_C000_0000 for Sv48, each with a root entry of its own, and
          0x17F_C000_0000 itself for Sv57).  The accesses take a load guest-page fault.  The test image must lie below
          255 GiB, outside these entries.
       Switch to VS-mode and execute the following loop:
      For each henvcfg.PMM in {10, 11} (outermost loop; the other PMM fields as in the notes) under (vsatp.MODE, hgatp.MODE) in {BARE_PAIR, PAGED_PAIR}:
      For each A_upper_bits in {0x0000, 0x0400} (PMM 10) or {0x0000, 0xFFFF} (PMM 11):
       lw from the constructed address.
       In the HS-mode trap handler, read stval and htval and sigupd both.
    expectation: |-
      A fault is taken in HS-mode.  stval holds the masked effective address (upper PMLEN bits zero-extended with
      vsatp = Bare, sign-extended with vsatp paged), not the tagged address the program used.
      Guest-page fault: htval is zero or the GPA of the masked address shifted right by 2.
      Any other fault: htval is zero.
    bins: |-
      priv_mode VS x lw x base {fault, guest-page-fault (hgatp paged only)} x henvcfg.PMM {10, 11} x tag (PMM 10 {0x0000, 0x0400}, PMM 11 {0x0000, 0xFFFF}) x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_csr_hw_apply
      - pm_no_trap_vector_mask
  - name: cp_vs_hardware_csr_writes_fault_store
    goal: Pointer masking is applied to the addresses that hardware writes to stval and htval on a faulting store in VS-mode
    description: |-
      Same test environment and loop as cp_vs_hardware_csr_writes_fault_load, except sw to the constructed address in
      place of lw, and the fault base is RVMODEL_ACCESS_FAULT_ADDRESS_STORE.
    expectation: As cp_vs_hardware_csr_writes_fault_load.
    bins: |-
      priv_mode VS x sw x base {fault, guest-page-fault (hgatp paged only)} x henvcfg.PMM {10, 11} x tag (PMM 10 {0x0000, 0x0400}, PMM 11 {0x0000, 0xFFFF}) x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_csr_hw_apply
      - pm_no_trap_vector_mask
  - name: cp_vu_hardware_csr_writes_fault_load
    goal: Pointer masking is applied to the addresses that hardware writes to stval and htval on a faulting load in VU-mode
    description: |-
      Same test environment and loop as cp_vs_hardware_csr_writes_fault_load, except:
       - the field under test is senvcfg.PMM;
       - the VS-stage data pages have PTE.U = 1;
       - the accesses run in VU-mode.
    expectation: As cp_vs_hardware_csr_writes_fault_load, with the PMLEN of senvcfg.PMM.
    bins: |-
      priv_mode VU x lw x base {fault, guest-page-fault (hgatp paged only)} x senvcfg.PMM {10, 11} x tag (PMM 10 {0x0000, 0x0400}, PMM 11 {0x0000, 0xFFFF}) x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_csr_hw_apply
      - pm_no_trap_vector_mask
  - name: cp_vu_hardware_csr_writes_fault_store
    goal: Pointer masking is applied to the addresses that hardware writes to stval and htval on a faulting store in VU-mode
    description: |-
      Same test environment and loop as cp_vu_hardware_csr_writes_fault_load, except sw to the constructed address in
      place of lw, and the fault base is RVMODEL_ACCESS_FAULT_ADDRESS_STORE.
    expectation: As cp_vu_hardware_csr_writes_fault_load.
    bins: |-
      priv_mode VU x sw x base {fault, guest-page-fault (hgatp paged only)} x senvcfg.PMM {10, 11} x tag (PMM 10 {0x0000, 0x0400}, PMM 11 {0x0000, 0xFFFF}) x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_csr_hw_apply
      - pm_no_trap_vector_mask
  - name: cp_henvcfg_pmm_change_hfence
    goal: After henvcfg.PMM changes to or from a PMLEN where (XLEN - PMLEN) < GPA width, HFENCE.GVMA x0 makes VS-mode accesses follow the new PMLEN
    description: |-
      In these cases some GPA bits are also masked bits, so the hart may keep TLB entries that are wrong after the
      PMM change.  The hypervisor must execute HFENCE.GVMA with rs1 = x0; this test checks that no stale entry is used
      after that fence.

      Test Environment:
       vsatp = Bare.  senvcfg.PMM = hstatus.HUPMM = 00.  A' = pm_lo_page, pre-loaded with value_old.
       Ti = A' with bits 63:48 replaced by the tag:
         Case 1: PMLEN 7  (PMM = 10), hgatp = Sv57x4    tags {0x0400}           (bit 58)
         Case 2: PMLEN 16 (PMM = 11), hgatp = Sv57x4    tags {0x0002, 0x0400}   (bits 49, 58)
         Case 3: PMLEN 16 (PMM = 11), hgatp = Sv48x4    tags {0x0002}           (bit 49)
         Case 4: PMLEN 7 <-> PMLEN 16 (PMM = 10 <-> 11), hgatp = Sv57x4    tags {0x0002}   (bit 49)
       In the G stage, identity map the test image and map every Ti to one alias page, pm_gpa_alias_page (pre-loaded
       with value_diff), so an unmasked access to Ti succeeds and is cached instead of faulting.  One page serves
       every Ti: A' and the alias page hold different values, so a stale entry makes step 3 return the old value.

      For each case, for each direction {00 -> PMM, PMM -> 00}; for case 4, {10 -> 11, 11 -> 10}:
       1. In HS-mode set henvcfg.PMM = old, HFENCE.GVMA x0, x0.  In VS-mode: ld from each Ti, sigupd(value).
       2. In HS-mode set henvcfg.PMM = new, HFENCE.GVMA x0, x0.
       3. In VS-mode: ld from each Ti, sigupd(value).
       4. In VS-mode: sd value_new to each Ti, read back A' and the alias page untagged, sigupd(value); restore both.
    expectation: |-
      No traps.  PMM = 00: Ti reaches the alias page (value_diff).  PMM = 10/11: Ti reaches A' (value_old).
      Case 4: bit 49 is masked by PMLEN 16 only, so PMM = 10 reaches the alias page and PMM = 11 reaches A'.
      So step 3 always differs from step 1; getting the step 1 value again means a stale entry survived the fence.
    bins: |-
      cp_henvcfg_pmm_change_hfence: priv_mode HS x HFENCE.GVMA with rs1 = x0, in the instruction right after a write to henvcfg, x hgatp.MODE = Sv57x4 x henvcfg.PMM before and after the write {00 -> 10, 10 -> 00, 00 -> 11, 11 -> 00, 10 -> 11, 11 -> 10}
      cp_henvcfg_pmm_change_hfence_sv48x4: the same cross with hgatp.MODE = Sv48x4 x henvcfg.PMM before and after the write {00 -> 11, 11 -> 00}
      The test writes henvcfg and executes HFENCE.GVMA x0, x0 immediately.  The stale-entry check is not sampled; the signature checks it.
      PMM 10 and 11 only when PMLEN 7 and 16 are supported.  Only when vsatp = Bare is supported, cp_henvcfg_pmm_change_hfence only when Sv57x4 is supported and cp_henvcfg_pmm_change_hfence_sv48x4 only when Sv48x4 and PMLEN 16 are supported
    rules:
      - henvcfg_pmm_op
    notes: The HFENCE.GVMA paragraph (hypervisor.adoc, Interaction with Pointer Masking) has no normative tag.
  - name: cp_hupmm_change_hfence
    goal: After hstatus.HUPMM changes to or from a PMLEN where (XLEN - PMLEN) < GPA width, HFENCE.GVMA x0 makes HLV/HSV in U-mode follow the new PMLEN
    description: |-
      Same test environment, cases, addresses and steps as cp_henvcfg_pmm_change_hfence, except:
       - the field changed is hstatus.HUPMM, with henvcfg.PMM = senvcfg.PMM = 00;
       - hstatus.HU = 1 and hstatus.SPVP = 0;
       - the accesses run in U-mode, with hlv.d in place of ld and hsv.d in place of sd.
    expectation: Same as cp_henvcfg_pmm_change_hfence, with hstatus.HUPMM in place of henvcfg.PMM.
    bins: |-
      cp_hupmm_change_hfence: priv_mode HS x HFENCE.GVMA with rs1 = x0, in the instruction right after a write to hstatus, x hgatp.MODE = Sv57x4 x hstatus.HUPMM before and after the write {00 -> 10, 10 -> 00, 00 -> 11, 11 -> 00, 10 -> 11, 11 -> 10}
      cp_hupmm_change_hfence_sv48x4: the same cross with hgatp.MODE = Sv48x4 x hstatus.HUPMM before and after the write {00 -> 11, 11 -> 00}
      cp_hlv_u_spvp0_sv48x4_pmm, case 3 accesses: priv_mode U x hstatus.HU = 1 x hstatus.SPVP = 0 x {hlv.d, hsv.d} x hstatus.HUPMM {00, 11} x tag {0x0002} x (vsatp, hgatp) {(Bare, Sv48x4)}.  It is cp_hlv_u_spvp0_pmm at (Bare, Sv48x4); cp_hlv_u_spvp0_pmm samples only the widest bare pair, which is Sv57x4 when it is supported.
      The stale-entry check is not sampled; the signature checks it.
      PMM 10 and 11 only when PMLEN 7 and 16 are supported.  Only when vsatp = Bare is supported, cp_hupmm_change_hfence only when Sv57x4 is supported and cp_hupmm_change_hfence_sv48x4 and cp_hlv_u_spvp0_sv48x4_pmm only when Sv48x4 and PMLEN 16 are supported
    rules:
      - pm_mprv_spvp
    notes: The HUPMM paragraph and the HFENCE.GVMA paragraph have no normative tags.
  - name: cp_henvcfg_pmm_change_no_hfence
    goal: After henvcfg.PMM changes in a case the HFENCE.GVMA rule does not list, VS-mode accesses follow the new PMLEN without any HFENCE
    description: |-
      The spec requires HFENCE.GVMA only when (XLEN - PMLEN) < GPA width, where a masked bit can also be a GPA bit.
      Otherwise the masked bits are never part of a translation, so the new PMLEN must take effect with no fence.
      This is the twin of cp_henvcfg_pmm_change_hfence with every HFENCE after the PMM change removed.

      Test Environment:
       senvcfg.PMM = hstatus.HUPMM = 00.  A' = pm_lo_page, pre-loaded with value_old.
       Ti = A' with bits 63:48 replaced by the tag:
         Case 1: vsatp = Bare, hgatp = Sv39x4, PMLEN 7  (PMM = 10)   tags {0x0400}          (bit 58)
         Case 2: vsatp = Bare, hgatp = Sv39x4, PMLEN 16 (PMM = 11)   tags {0x0002, 0x0400}  (bits 49, 58)
         Case 3: vsatp = Bare, hgatp = Sv48x4, PMLEN 7  (PMM = 10)   tags {0x0400}          (bit 58)
         Case 4: vsatp = Sv57, hgatp = Sv57x4, PMLEN 7  (PMM = 10)   tags {0x0400}          (bit 58)
         Case 5: vsatp = Sv57, hgatp = Sv57x4, PMLEN 16 (PMM = 11)   tags {0x0002, 0x0400}  (bits 49, 58)
       Cases 1 to 3: no G-stage mapping exists for Ti, so an unmasked access to Ti faults.
       Cases 4 and 5: the VS stage maps the canonical Ti (tag 0x0002) to the alias page, pm_gpa_alias_page
       (pre-loaded with value_diff), so an unmasked access succeeds and is cached.  Tag 0x0400 is non-canonical in
       Sv57 and faults.

      For each case, for each direction {00 -> PMM, PMM -> 00}:
       1. In HS-mode set henvcfg.PMM = old, then HFENCE.GVMA x0, x0 and HFENCE.VVMA x0, x0 (setup only).
          In VS-mode: ld from each Ti, sigupd(value) + record any traps.
       2. In HS-mode set henvcfg.PMM = new.  Execute no HFENCE.GVMA, HFENCE.VVMA or SFENCE.VMA.
       3. In VS-mode: ld from each Ti, sigupd(value) + record any traps.
       4. In VS-mode: sd value_new to each Ti, read back A' (and the alias page where mapped) untagged, sigupd(value) + record
          any traps; restore.
    expectation: |-
      PMM = 00: Ti is used unmasked (a fault, or the alias page for tag 0x0002 in case 5).  PMM = 10/11 with the tag within
      PMLEN: Ti reaches A' (value_old), no trap.  Step 3 follows the new PMM.  Getting the step 1 result again
      means the hart kept a translation keyed by the old PMLEN.
    bins: |-
      priv_mode HS x the instruction right after a write to henvcfg is not HFENCE.GVMA x (vsatp, hgatp) x henvcfg.PMM before and after the write: (Bare, Sv39x4) {00 <-> 10, 00 <-> 11}, (Bare, Sv48x4) {00 <-> 10}, (Sv57, Sv57x4) {00 <-> 10, 00 <-> 11}
      That no fence came later is not sampled; the signature checks it.
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each case only when its vsatp and hgatp modes are supported
    rules:
      - henvcfg_pmm_op
    notes: The HFENCE.GVMA paragraph (hypervisor.adoc, Interaction with Pointer Masking) lists only the cases of cp_henvcfg_pmm_change_hfence.
  - name: cp_pmm_vsxl_clear
    goal: Setting hstatus.VSXL = 01 (RV32 VS-mode) clears henvcfg.PMM
    description: |-

      Test Environment:
       In HS-mode, with hstatus.VSXL = 10 (RV64):
       1. Write henvcfg.PMM = {10, 11}, read it back, sigupd(value).
       2. Write hstatus.VSXL = 01, read henvcfg.PMM, sigupd(value).
       3. Write hstatus.VSXL = 10, read henvcfg.PMM, sigupd(value).
    expectation: |-
      Step 1 reads back the value written.  Step 2 reads henvcfg.PMM = 00.  Step 3 reads henvcfg.PMM = 00, because
      returning VSXL to RV64 does not restore the previous PMM.  The write to hstatus.VSXL does not trap.
    bins: |-
      priv_mode HS x csrw hstatus x henvcfg.PMM before the write {10, 11} x hstatus.VSXL after the write = 01
      Sampled on the csrw that sets the field.  That henvcfg.PMM reads 00 afterwards is checked by the signature.
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; only when hstatus.VSXL = 01 is writable
    rules:
      - pm_uxl_clear
      - pmlen_illegal_warl
  - name: cp_pmm_vsuxl_clear
    goal: Setting vsstatus.UXL = 01 (RV32 VU-mode) clears senvcfg.PMM
    description: |-
      vsstatus.UXL gives the XLEN of VU-mode, and senvcfg.PMM is the field
      that masks VU-mode.  Gated on vsstatus.UXL being writable.

      Test Environment:
       With hstatus.VSXL = 10 and vsstatus.UXL = 10 (RV64), and VS-mode on BARE_PAIR and on PAGED_PAIR:
       1. Write senvcfg.PMM = {10, 11}, read it back, sigupd(value).
       2. Write vsstatus.UXL = 01, read senvcfg.PMM, sigupd(value).
       3. Write vsstatus.UXL = 10, read senvcfg.PMM, sigupd(value).
    expectation: |-
      Step 1 reads back the value written.  Step 2 reads senvcfg.PMM = 00.  Step 3 reads senvcfg.PMM = 00.  The write
      to vsstatus.UXL does not trap.
    bins: |-
      writer {csrw vsstatus in HS-mode, csrw sstatus in VS-mode} x senvcfg.PMM before the write {10, 11} x vsstatus.UXL after the write = 01
      Sampled on the csrw that sets the field.  That senvcfg.PMM reads 00 afterwards is checked by the signature.
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; only when vsstatus.UXL = 01 is writable
    rules:
      - pm_uxl_clear
      - pmlen_illegal_warl
