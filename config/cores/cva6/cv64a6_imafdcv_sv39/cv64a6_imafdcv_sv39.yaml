  # ---------------------------------------------------------------- Vector params
  # VLEN and ELEN.  VLEN is a build-time -G parameter of the Verilator model and this
  # config is built with vlen=512; ELEN is 64 for the RV64 Ara.
  #   Quote (the build): "-GVLEN=$(vlen)" with "vlen ?= 4096" overridden to 512
  #   https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/Makefile#L191
  #   Verified at run time: vlenb reads 0x40 (64 bytes = 512 bits).
  VLEN: 512
  ELEN: 64
  SEW_MIN: 8
  # mstatus.VS is a full four-state field, written unmasked from M-mode, and set to
  # Dirty in the cycle a vector instruction commits.
  #   Quote: "mstatus_d.vs = riscv::Dirty;"
  #   https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/csr_regfile.sv#L1936
  MSTATUS_VS_LEGAL_VALUES: [0, 1, 2, 3]
  HW_MSTATUS_VS_DIRTY_UPDATE: precise
  # vtype resets with vill set, which is the reset value the V spec recommends.
  #   Quote: "`FF(csr_vtype_q, csr_vtype_d, '{vill: 1'b1, default: '0})"
  #   https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/src/ara_dispatcher.sv#L80
  FOLLOW_VTYPE_RESET_RECOMMENDATION: true
  # vl = min(AVL, VLMAX): the only clamp applied is a saturate to vlmax, so when
  # VLMAX < AVL < 2*VLMAX the result is VLMAX, not ceil(AVL/2).
  #   Quote: "csr_vl_d = ((|acc_req_i.rs1[$bits(acc_req_i.rs1)-1:$bits(csr_vl_d)]) ||
  #           (vlen_t'(acc_req_i.rs1) > vlmax)) ? vlmax : vlen_t'(acc_req_i.rs1);"
  #   https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/src/ara_dispatcher.sv#L680
  RVV_VL_WHEN_AVL_LT_DOUBLE_VLMAX: VLMAX
  # Fractional LMUL 1/2, 1/4 and 1/8 are all decoded, and the legality check is exactly
  # the spec's LMUL >= SEW/ELEN rule, so nothing beyond the required set is supported.
  #   Quote: "LMUL_1_2: vlmax >>= 1; LMUL_1_4: vlmax >>= 2; LMUL_1_8: vlmax >>= 3;"
  #   https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/src/ara_dispatcher.sv#L663
  SUPPORT_FRACTIONAL_LMUL_BEYOND_REQUIRED: "no_unrequired_supported"
  # A reserved vtype sets vill and zeroes the rest of vtype, and zeroes vl.
  #   Quote: "csr_vtype_d = '{vill: 1'b1, vsew: EW8, vlmul: LMUL_1, default: '0}; csr_vl_d = '0;"
  #   https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/src/ara_dispatcher.sv#L650
  VILL_SET_ON_RESERVED_VTYPE: true
  # vsetvl{i} with rd=x0 and rs1=x0 simply keeps the old vl.  Ara does NOT set vill in
  # that case, even when the new SEW/LMUL ratio changes VLMAX - which the spec reserves.
  #   Quote: "if (insn.vsetvl_type.rs1 == '0 && insn.vsetvl_type.rd == '0) begin
  #           // Do not update the vector length
  #           csr_vl_d = csr_vl_q;"
  #   https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/src/ara_dispatcher.sv#L673
  RESERVED_VSET_X0X0_VILL_SET: "never"
  RESERVED_VSET_X0X0_VLMAX_CHANGE: "always"
  # Indexed load/store index EEW is not restricted below ELEN = XLEN = 64.
  VECTOR_LS_INDEX_MAX_EEW: "XLEN"
  # Misaligned vector element accesses are NOT legal.  Measured: vle64.v from
  # scratch+1 raises mcause 2 (illegal instruction) with mtval 0, rather than
  # completing or raising a load-address-misaligned exception.
  VECTOR_LS_MISALIGNED_LEGAL: false
  # Whole-register vector loads DO tolerate misalignment, unlike element accesses:
  # measured, vl1re64.v from scratch+1 retired with no exception.
  VECTOR_LS_WHOLEREG_MISALIGNED_LEGAL: true
  VECTOR_LOAD_PAST_TRAP: false
  VECTOR_LS_SEG_PARTIAL_ACCESS: false
  # Fault-only-first: on a fault at element > 0 Ara trims vl to the faulting element
  # and does not write anything past the trim point.
  #   Quote: "// In case of exception, modify vstart or vl, depending if the insn ...
  #           csr_vl_d = ara_resp.exception_vstart;"
  #   https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/src/ara_dispatcher.sv#L3107
  VECTOR_FF_UPDATE_PAST_TRIM: "update_none"
  VECTOR_FF_SEG_EXCEPTION_PARTIAL_LOAD: "no_subsegment_loaded"
  VECTOR_LOAD_SEG_FF_OVERWRITE_ELEMENTS_AFTER_FAULT: "no_overwrite"
  VECTOR_FF_NO_EXCEPTION_TRIM: false
  # vstart is a plain register with no stride restriction: any value can be written and
  # is honoured, so every vstart is legal.
  #   Quote: "riscv::CSR_VSTART: begin csr_vstart_d = vlen_t'(acc_req_i.rs1);"
  #   https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/src/ara_dispatcher.sv#L3492
  LEGAL_VSTART: "1_stride"
  # vfredusum: Ara reduces with a balanced binary tree at full SEW precision and uses
  # the additive identity for inactive lanes.
  VFREDUSUM_NAN: "no_change"
  VFREDUSUM_NODE_ROUNDING_BEHAVIOR: "SEW_precision"
  VFREDUSUM_INACTIVE_NODE_ELEMENT_BEHAVIOR: "additive_identity"
  VFREDUSUM_FINAL_NODE_ELEMENT_BEHAVIOR: "additive_identity"
  # No hypervisor extension, so there is no vsstatus CSR at all.
  VSSTATUS_VS_EXISTS: false
  # Vector traps are precise; there is no imprecise-trap control CSR.
  IMPRECISE_VECTOR_TRAP_SETTABLE: false
