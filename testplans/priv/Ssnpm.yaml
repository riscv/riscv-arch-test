# yaml-language-server: $schema=testplan.schema.json
suite: Ssnpm
source: https://docs.google.com/spreadsheets/d/15yJhyhBB5X9cq4SDQ-YCPzo2oPQnDBh5wEIZhi0-9Ps/edit?gid=0#gid=0
coverpoints:
  - description: |-
      A supervisor-level extension that provides pointer masking for the next lower privilege
      mode (U-mode) by enabling senvcfg.PMM bits. Pointer masking applies for RV64 only.
    notes: "todo: ADD UDB parameters of PMLEN7_SUPPORTED and PMLEN16_SUPPORTED"
  - heading: "For all test entries in this sheet, the following address patterns are used to exercise pointer masking behavior:\n\nBase addresses (A bits 63:48):  \n0x0000 unaffected by pointer masking\n0x0001 bit 48 masked if PMLEN=16 but not 7\n0x0100 bit 56 masked if PMLEN = 16 but not 7\n0x0200 bit 57 masked if PMLEN = 16 or 7\n0x8000 bit 63 masked if PMLEN = 16 or 7\n0xFFFF bits 63:48 are masked if PMLEN = 16, only partially if PMLEN=7\n0xFE00 bits 63:57 are masked if PMLEN = 16 or 7\n0xFF00  bits 63:56 are masked if PMLEN=16, only partially if PMLEN=7\n\nMasked address :\nFor PMLEN= 16 ( PMM=11)\nBare mode (PA): {0x0000} → upper bits forced to zero\nSv39 / Sv48/Sv57 (VA): {0x0000, 0xFFFF} → upper bits follow sign bit (XLEN-PMLEN-1 = 64-16-1 = 47 bit )\n\nFor PMLEN= 7 (PMM= 10): \nBare mode (PA): {0x00 / 7'b0} → upper bits forced to zero\nSv39 / Sv48Sv57 (VA): {7'b0, 0x7F} → upper bits follow sign bit ( XLEN-PMLEN-1 = 64 - 7 -1 = 56 bit )\n\nAll virtual A_masked addresses map to physical addresses with upper bits = 0x0000. \nThe lower bits of the address being tested point to a scratch memory location that can safely be read and written.\nVirtual addresses with leading 0s are identity mapped to the same physical address.\nVirtual addresses with leading 1s are mapped to another scratch memory location containing a different data value so that it can be distinguished whether the upper bits are handled correctly."
  - heading: "Why do  we need a different page than scratch to map the VA with leading 1s? \n\nA' = scratch page (upper bits = 0x0000), pre-loaded with value_old, identity-mapped with VA with leading 0s(VA == PA). \n\nVAs with leading 1s are explicitly PTE-mapped to a separate  page pre-loaded with value_different. This separation is necessary because if both VAs mapped to the same PA, a read would return value_old regardless of whether masking actually occurred;  the page table itself would resolve both addresses to scratch, making it impossible to tell if the hardware masked the upper bits or simply followed the mapping. \n\nWith a separate page holding a distinct value, the outcome is unambiguous: returning value_old proves the upper bits were stripped and scratch was reached via masking; returning value_different proves the upper bits were used as-is and other different page was accessed instead.\n\nNOTE : We will take sv tests as reference to setup PTE to map VA with leading ones to a dedicated physical region."
  - name: cp_pmlen_masking
    goal: Verify that upper PMLEN bits are ignored for every memory-accessing instruction when pointer masking is enabled
    description: |-
      If pointer masking is enabled, addresses differing only in upper PMLEN bits access the same physical location.

      Test Environment:
       In S-mode set senvcfg.PMM={00 (PMLEN=0), 10(PMLEN=7), 11(PMLEN=16)}. Place known value_old in scratch memory.
       Let A' = scratch (upper bits = 0x0000). For VA with upper bits = 1: mapped to a separate page from scratch.
      Enable SUM bit so we can access user-space pages from S-mode
       Switch to U-mode and execute the following loop:
      For each PMM in {00, 10, 11} under SAT.MODES = { Bare,  Sv39, Sv48, Sv57 } :
      For each A_upper_bits in {0x0000, 0x0001, 0x0100, 0x0200, 0x8000, 0xFFFF, 0xFE00, 0xFF00}:
      Set A = A' with upper bits replaced by A_upper_bits
      For each read instruction: read directly from A, sigupd(value) +  record any traps.
      For each write instruction: write unique known  value_new to A, then read back from scratch (A'), sigupd(value) +  record any traps.
      Instructions covered under this loop:

      (LOAD/STORE): Reads: {lb/lbu, lh/lhu, lw/lwu, ld}. Writes: {sb, sh, sw, sd}.

      (ATOMIC OPS): Each AMO is both a read and write, we will treat it as write: perform AMO at A, read back from scratch. If RV64A: {AMOSWAP.W/D, AMOADD.W/D, AMOXOR.W/D, AMOAND.W/D, AMOOR.W/D, AMOMIN.W/D, AMOMAX.W/D, AMOMINU.W/D, AMOMAXU.W/D}.
       If Zacas: {AMOCAS.W/D/Q}.
       If Zabha: {AMOSWAP.B/H, AMOADD.B/H, AMOXOR.B/H, AMOAND.B/H, AMOOR.B/H, AMOMIN.B/H, AMOMAX.B/H, AMOMINU.B/H, AMOMAXU.B/H}.

      (FLOATING POINT OPS): Reads: { FLW (F), FLD (D), FLQ (Q) } . Writes: {  FSW (F), FSD (D), FSQ (Q). }

      (COMPRESSED OPS): If Zca , Reads: {C.LW, C.LD, C.LWSP, C.LDSP}. Writes: {C.SW, C.SD, C.SWSP, C.SDSP}.
       If Zcd , Read: C.FLDSP. Write: C.FSDSP.

      (CACHE MANAGEMENT OPS): If Zicboz: perform CBO.ZERO at A  (write), read back from scratch using lw/ld.
       If Zicbom: perform {CBO.CLEAN, CBO.FLUSH} at A (write), read back from scratch.
       If CBIE enabled: perform CBO.INVAL at A, read back from scratch.
       If Zicbop: perform {PREFETCH.R, PREFETCH.W, PREFETCH.I} at A, then do a normal load/store at Scratch to observe cache effect.

      (VECTOR OPS): If ZVL32b/RVV 1.0,  Reads: {vleXX.v, vlseXX.v, vluxeiXX.v, vloxeiXX.v, vlsegNfXX.v, vl1r.v, vleXXff.v} from A, sigupd. Writes: {vseXX.v, vsseXX.v, vsuxeiXX.v, vsoxeiXX.v, vssegNfXX.v, vs1r.v} to A, read back from scratch sigupd(value) +  record any traps.

      (SHADOW STACK : Zicfiss): Writes/AMOs: SSPUSH/C.SSPUSH at A, then SSPOPCHK/C.SSPOPCHK from scratch to verify. SSAMOSWAP.W/D at A, read back from scratch.
    expectation: "When PMM=10/11: all 8 A patterns whose upper bits fall within PMLEN resolve to scratch , reads return known value_old, write readbacks return known value_new. When PMM=00: masking disabled : only A=0x0000 resolves to scratch; all other patterns either access a different location (returning old/unrelated value) or cause a trap."
    bins: "3 PMM × 8 address variants × 1 mode (U) × satp supported modes (Bare, Sv39, Sv48, Sv57) × [Base: 4r×4w] + [RV64A if implemented: 9 AMO variants × 2 widths] + [Zacas if implemented: 3] + [Zabha if implemented: 9 AMO variants × 2 widths] + [FP if implemented: per F/D/Q] + [Zca if implemented: 4r×4w regular + 4r×4w SP-relative] + [Zcd if implemented: 1r×1w SP-relative] + [RVV if implemented: vector load/store variants] + [Zicfiss if implemented: SSPUSH, SSPOPCHK, SSAMOSWAP.W/D] + [Zicbom if implemented: CBO.CLEAN, CBO.FLUSH, CBO.INVAL] + [Zicboz if implemented: CBO.ZERO] + [Zicbop if implemented: PREFETCH.R, PREFETCH.W, PREFETCH.I]"
    rules:
      - pm_ignore_upper_bits
      - pm_deterministic_effect
      - ssnpm_definition
      - pm_all_priv_modes
      - pm_per_mode_control
      - pm_config_next_higher
      - pm_apply_explicit
      - pm_cpu_only
      - pm_mode_only_dependency
      - "UPDATED WITH CTP :"
      - pm_rv64_only
      - pmlen_supported_values
      - pmlen_mode_depend
      - pm_ignore_va
      - pm_ignore_pa
  - name: |-
      cp_pmm_mxr
      cp_pmm_jalr
    goal: Verify pointer masking behavior across all combinations of PMM, MXR, address pairs, and VM modes using representative explicit load/store and implicit fetch accesses.
    description: |-
      When MXR is in effect at the effective privilege mode where explicit memory
      access is performed, pointer masking does not apply.
      For implicit memory accesses such as page-table walks or instruction fetches, pointer masking does not apply.

      Test Environment:
      In S-mode set senvcfg.PMM={ 00 (PMLEN=0 ), 10(PMLEN=7), 11(PMLEN=16)}, sstatus.MXR = { 0, 1}.
       Let A' = scratch (upper bits = 0x0000). For VA with upper bits = 1: mapped to a separate page from scratch.
       Switch to U-mode and execute the following loop:
      For each PMM in {00, 10, 11} under all satp. modes = { Bare , Sv39, Sv48, Sv57 } :
      For each A_upper_bits in {0x0000, 0x0001, 0x0100, 0x0200, 0x8000, 0xFFFF, 0xFE00, 0xFF00}:
      Set A = A' with upper bits replaced by A_upper_bits

      For MXR Scenario : Perform sw to A and then read back using scratch (A') , signupd + record traps under satp.MODE ∈ {Bare, Sv39, Sv48, Sv57}.

      For JALR : Place valid executable instructions at A' , execute jalr to A, sigupd result, record any traps. Since pointer masking never applies to instruction fetch, A is always sent raw to PMP/MMU regardless of PMM or MXR.
    expectation: |-
      1- PMM=00: masking disabled; only A_upper_bits=0x0000 resolves to scratch; all other patterns access different location or cause trap.
      2-- PMM=10/11, MXR=0: masking applied; write readbacks return known value_new for all A patterns whose upper bits fall within PMLEN.
      3- PMM=10/11, MXR=1, in Sv39/Sv48/Sv57: MXR suppresses masking; A used raw, causing a trap or sw to location other than A'
      4- PMM=10/11, MXR=1 in Bare: MXR suppresses masking even though MXR has no permission effect in bare mode.
      5- jalr: no masking applied regardless of PMM or MXR; non-zero upper bits always sent raw resulting in fault.
    bins: 3 PMM × 2 MXR × 8 A patterns 3 instructions (lw, sw, jalr) × 4 VM modes (Bare, Sv39, Sv48, Sv57) × 1 mode (U)
    rules:
      - pm_mxr_exception
      - pm_not_apply_implicit
  - name: cp_pmlen_misaligned_word
    goal: Verify correct pointer masking behavior for misaligned memory accesses.
    description: |-
      Test Environment:
       In S-mode set senvcfg.PMM={ 10(PMLEN=7)}. Place known value_old at scratch+1 (naturally misaligned for word access).
      Let A' = scratch+1 (upper bits = 0x0000). For VA with upper bits = 1: mapped to a separate page from scratch+1.
       Switch to U-mode.
      For each PMM in {00, 10, 11} under all satp. modes = { Bare , Sv39, Sv48, Sv57 } :
      For each A_upper_bits in  {0x0000, 0x0001, 0x0100, 0x0200, 0x8000, 0xFFFF, 0xFE00, 0xFF00}::
      Set A = A' with upper bits replaced by A_upper_bits
      For read (lw): read directly from A, sigupd(value), record any traps.
      For write (sw): write unique known value_new to A, read back from scratch+1 (A'), sigupd(value), record any traps.
    expectation: No trap. Masking applied to the misaligned address before access, A and A' resolve to the same physical location. Read returns known value_old. Write readback from A' returns known value_new. Misalignment does not interfere with pointer masking.
    bins: 1 PMM × 2 address variants (upper 7 bits = 0/1) × 1 misaligned write (sw) × 1 misaligned read (lw) × 1 mode (U) ×
    rules:
      - pm_misaligned_equivalence
  - name: cp_hardware_csr_writes_fault
    goal: |-
      Verify pointer masking is applied to hardware-written CSR address values.
      Verify that stval contains the masked effective address when a fault occurs on a pointer-masked access.
    description: |-
      When a fault occurs on an explicit memory access under pointer masking, the hardware-written stval reflects the masked effective address, not the raw tagged address.
      Test Environment:
      In S-mode set senvcfg.PMM={10(PMLEN=7), 11(PMLEN=16)}.
      Set medeleg[12,13,15]=1 to delegate U-mode load/store/access faults to S-mode.
      If RVMODEL_ACCESS_FAULT_ADDRESS is defined, use it as the base illegal address across all modes. Construct addresses by applying upper-16-bit patterns {0x0000, 0x0001, 0x0100, 0x0200, 0x8000, 0xFFFF, 0xFE00, 0xFF00} to this illegal base address.
      Switch to U-mode.
       Perform one lw and one sw to each constructed illegal address under satp.MODE={Bare, Sv39, Sv48, Sv57}.
      In the S-mode trap handler, read stval and verify it contains the correctly masked effective address.
    expectation: Fault is taken; stval written by hardware contains the masked effective address (upper PMLEN bits correctly zeroed in bare mode or sign-extended in VA modes), not the original unmasked address used by the program.
    bins: 2 PMM × 8 address patterns × 1 lw × 1 sw × 1 mode (U) × satp supported modes (Bare, Sv39, Sv48, Sv57)
    rules:
      - pm_csr_hw_apply
      - pm_no_trap_vector_mask
  - name: cp_pmm_uxl_clear
    goal: Verify that setting sstatus.UXL=01 (RV32) clears senvcfg.PMM bits
    description: |-
      When sstatus.UXL is set to 01 (indicating U-mode is RV32), the pointer masking configuration bits in senvcfg.PMM must be cleared automatically by hardware.
       Test Environment:
      In S-mode, write senvcfg.PMM={10(PMLEN=7), 11(PMLEN=16)} and confirm the written value is retained by reading back senvcfg.PMM. Then set sstatus.UXL=01 (RV32). Read back senvcfg.PMM and verify it has been cleared to 00 (if UXL is writable).
    expectation: "When sstatus.UXL is set to 01: senvcfg.PMM is cleared to 00 regardless of its previously written value."
    bins: 2 PMM values (10, 11) × 1 UXL  × 1 mode (U)
    rules:
      - pm_uxl_clear
      - pmlen_illegal_warl
