  MXLEN: 64
  VENDOR_ID_BANK: 0
  VENDOR_ID_OFFSET: 0
  MARCHID_IMPLEMENTED: true
  ARCH_ID_VALUE: 5
  MIMPID_IMPLEMENTED: false
  MISA_CSR_IMPLEMENTED: true
  NON_STANDARD_EXTENSION_IMPLEMENTED: false
  MUTABLE_MISA_A: true
