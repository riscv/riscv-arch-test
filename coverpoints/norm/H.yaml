# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # The hstatus register is an HSXLEN-bit read/write register formatted as shown in when
  # HSXLEN=32 and when HSXLEN=64. The hstatus register provides facilities analogous to
  # the mstatus register for tracking and controlling the exception behavior of a VS-mode
  # guest.
  - name: hstatus_sz_acc_op
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # Register hedeleg is a 64-bit read/write register, formatted as shown in
  # &lt;&lt;norm:hedeleg_img&gt;&gt;.
  - name: hedeleg_sz_acc
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # Each bit of hedeleg shall be either writable or read-only zero.
  - name: hedeleg_acc
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  - name: hedeleg_img
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # Register hideleg is an HSXLEN-bit read/write register, formatted as shown in
  # &lt;&lt;norm:hideleg_img&gt;&gt;.
  - name: hideleg_sz_acc
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # Among bits 15:0 of hideleg, bits 10, 6, and 2 (corresponding to the standard VS-level
  # interrupts) are writable, and bits 12, 9, 5, and 1 (corresponding to the standard
  # S-level interrupts) are read-only zeros.
  - name: hideleg_acc
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  - name: hideleg_img
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # Register hvip is an HSXLEN-bit read/write register that a hypervisor can write to
  # indicate virtual interrupts intended for VS-mode. Bits of hvip that are not writable
  # are read-only zeros.
  - name: hvip_sz_op
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # The standard portion (bits 15:0) of hvip is formatted as shown in . Bits VSEIP, VSTIP,
  # and VSSIP of hvip are writable. Setting VSEIP=1 in hvip asserts a VS-level external
  # interrupt; setting VSTIP asserts a VS-level timer interrupt; and setting VSSIP asserts
  # a VS-level software interrupt.
  - name: hvip_acc
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  - name: hvip_img
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # Registers hip and hie are HSXLEN-bit read/write registers that supplement HS-level’s
  # sip and sie respectively.
  - name: hip_hie_sz_acc
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  - name: hip_img
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  - name: hie_img
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # If bit i of sie is read-only zero, the same bit in register hip may be writable or may
  # be read-only. When bit i in hip is writable, a pending interrupt i can be cleared by
  # writing 0 to this bit. If interrupt i can become pending in hip but bit i in hip is
  # read-only, then either the interrupt can be cleared by clearing bit i of hvip, or the
  # implementation must provide some other mechanism for clearing the pending interrupt
  # (which may involve a call to the execution environment).
  - name: hip_acc
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # A bit in hie shall be writable if the corresponding interrupt can ever become pending
  # in hip. Bits of hie that are not writable shall be read-only zero.
  - name: hie_acc
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # The hgeip register is an HSXLEN-bit read-only register, formatted as shown in
  # &lt;&lt;hgeipreg&gt;&gt;, that indicates pending guest external interrupts for this
  # hart.
  - name: hgeip_sz_acc_op
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # The hgeie register is an HSXLEN-bit read/write register, formatted as shown in
  # &lt;&lt;norm:hgeie_img&gt;&gt;, that contains enable bits for the guest external
  # interrupts at this hart.
  - name: hgeie_sz_acc_op
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # Register hgeie selects the subset of guest external interrupts that cause a
  # supervisor-level (HS-level) guest external interrupt. The enable bits in hgeie do not
  # affect the VS-level external interrupt signal selected from hgeip by hstatus.VGEIN.
  - name: hgeie_op
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  - name: hgeie_img
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # The number of bits implemented in hgeip and hgeie for guest external interrupts is
  # UNSPECIFIED and may be zero. This number is known as GEILEN. The least-significant
  # bits are implemented first, apart from bit 0. Hence, if GEILEN is nonzero, bits
  # GEILEN:1 shall be writable in hgeie, and all other bit positions shall be read-only
  # zeros in both hgeip and hgeie.
  - name: geilen
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # The henvcfg CSR is a 64-bit read/write register, formatted as shown in , that controls
  # certain characteristics of the execution environment when virtualization mode V=1.
  - name: henvcfg_sz_acc_op
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # The counter-enable register hcounteren is a 32-bit register that controls the
  # availability of the hardware performance monitoring counters to the guest virtual
  # machine.
  - name: hcounteren_sz
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # In addition, when the TM bit in the hcounteren register is clear, attempts to access
  # the vstimecmp register (via stimecmp) while executing in VS-mode will cause a
  # virtual-instruction exception if the same bit in mcounteren is set. When this bit and
  # the same bit in mcounteren are both set, access to the vstimecmp register (if
  # implemented) is permitted in VS-mode.
  - name: hcounteren_acc
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # hcounteren must be implemented. However, any of the bits may be read-only zero,
  # indicating reads to the corresponding counter will cause an exception when V=1. Hence,
  # they are effectively WARL fields.
  - name: hcounteren_warl
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # The htimedelta CSR is a 64-bit read/write register that contains the delta between the
  # value of the time CSR and the value returned in VS-mode or VU-mode. That is, reading
  # the time CSR in VS or VU mode returns the sum of the contents of htimedelta and the
  # actual value of time.
  - name: htimedelta_sz_acc_op
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # The htval register is an HSXLEN-bit read/write register formatted as shown in . When a
  # trap is taken into HS-mode, htval is written with additional exception-specific
  # information, alongside stval, to assist software in handling the trap.
  - name: htval_sz_acc_op
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
        "H_inst_cg/cp_guest_page_fault",
      ]
  # htval is a WARL register that must be able to hold zero and may be capable of holding
  # only an arbitrary subset of other 2-bit-shifted guest physical addresses, if any.
  - name: htval_val
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
        "H_hscsr_cg/cp_hcsr_access_zero/htval",
      ]
  # The htinst register is an HSXLEN-bit read/write register formatted as shown in . When
  # a trap is taken into HS-mode, htinst is written with a value that, if nonzero,
  # provides information about the instruction that trapped, to assist software in
  # handling the trap. The values that may be written to htinst on a trap are documented
  # in .
  - name: htinst_sz_acc_op
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
        "H_inst_cg/cp_guest_page_fault",
      ]
  # htinst is a WARL register that need only be able to hold the values that the
  # implementation may automatically write to it on a trap.
  - name: htinst_val
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # The hgatp register is an HSXLEN-bit read/write register, formatted as shown in
  # &lt;&lt;rv32hgatp&gt;&gt; for HSXLEN=32 and &lt;&lt;rv64hgatp&gt;&gt; for HSXLEN=64,
  # which controls G-stage address translation and protection, the second stage of
  # two-stage translation for guest virtual addresses (see
  # &lt;&lt;two-stage-translation&gt;&gt;).
  - name: hgatp_sz_acc_op
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # When HSXLEN=32, the only other valid setting for MODE is Sv32x4, which is a
  # modification of the usual Sv32 paged virtual-memory scheme, extended to support 34-bit
  # guest physical addresses. When HSXLEN=64, modes Sv39x4, Sv48x4, and Sv57x4 are defined
  # as modifications of the Sv39, Sv48, and Sv57 paged virtual-memory schemes. All of
  # these paged virtual-memory schemes are described in .
  - name: hgatp_mode_Sv
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
        "H_hscsr_cg/cp_hcsr_access_zero",
        "H_hscsr_cg/cp_hcsr_access_masked",
        "H_hscsr_cg/cp_hcsr_access_ro",
        "H_hscsr_cg/cp_hcsrwalk",
        "H_hscsr_cg/cp_hcsrwalk_masked",
        "H_hscsr_cg/cp_atpwalk1/hgatp",
        "H_hscsr_cg/cp_atpwalk0/hgatp",
      ]
  # In these modes, the lowest two bits of the physical page number (PPN) in hgatp always
  # read as zeros.
  - name: hgatp_ppn_op
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsr_access",
