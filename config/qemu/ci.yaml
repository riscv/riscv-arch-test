# CI configuration for QEMU simulator
# Shared across all QEMU configs

ci_enabled: true
# Status as of QEMU v11.1.2, by test group (other groups of these suites pass):
# Sm_mcsr_access, Sm_mcsr_cntr, Sm_mcsr_walk, Sm_shadow, Sm_xret: Multiple issues:
#     menvcfg.CBIE can be written with reserved 0b10 QEMU #4216
#     minstret one too high after wraparound (still fails with QEMU #4087 closed)
#     mcycleh write dropped (#4219)
#     mstatus.MPELP not writable (#4220)
# S-, S_scsr-: sie mismatches on bit 13 (LCOFIE) https://gitlab.com/qemu-project/qemu/-/work_items/3969;
#     QEMU accepts UXL=1, which Sail cannot model yet (https://github.com/riscv/sail-riscv/issues/1150)
# Zacas: amocas with rd=x0 corrupts subsequent branch on x0 (https://gitlab.com/qemu-project/qemu/-/work_items/3526)
# InterruptsSm/InterruptsS _enable, _priority, _trigger: https://gitlab.com/qemu-project/qemu/-/work_items/3969 seems to apply to mip.LCOFIP not writable either
# ExceptionsZalrsc/ExceptionsSvZalrsc/ExceptionsSvZalrscSm_sv{32,39}_exceptions: sc.w to no-permission region returns failure instead of raising
#        store/AMO access fault (https://gitlab.com/qemu-project/qemu/-/work_items/4100, still failing in v11.1.1)
# ExceptionsZicboU/S/Sm, SvZicbo (zicbom groups, sv32 zicbop/zicboz Umode): Zicbom CBOs skip PMA/PMP permission checks (https://gitlab.com/qemu-project/qemu/-/work_items/3501)
# ExceptionsZaamo/Zama16b: QEMU zama16b handling is incomplete: misaligned Zabha/Zacas AMOs fault,
#        but cross-granule word/doubleword AMOs execute instead of trapping
#        (https://gitlab.com/qemu-project/qemu/-/work_items/4101).
# Ssstrict_Sm/Ssstrict_S _CSR and _IllegalInstr, Ssstrict_U_IllegalInstr: qemu#4200, qemu#4201
# TODO: Remove SsstrictV when sail SsstrictV is implemented
# Smstateen: mstateen0 bits are writable for state the hart lacks: P1P13 on RV64 and on RV32 without H
#     (https://gitlab.com/qemu-project/qemu/-/work_items/4495), and ENVCFG, CSRIND, AIA and IMSIC without S
#     (https://gitlab.com/qemu-project/qemu/-/work_items/4655). On the max configs CSRIND, AIA and IMSIC are
#     legally writable, but Sail does not model Sscsrind or Ssaia.
# Ssstateen (and Smstateen): on RV64, reserved bit 63 of sstateen1-3 is writable while mstateenN bit 63 is set,
#     but sstateen1-3 have no defined bits and must read zero (https://gitlab.com/qemu-project/qemu/-/work_items/4726).
# Zawrs_U and Zawrs_S fail on qemu due to stval mismatching, filed QEMU issue https://gitlab.com/qemu-project/qemu/-/work_items/4080
# Sdtrig*: QEMU's trigger implementation has too many problems (tdata1 writes of 0 ignored, reserved types abort, icount hangs: https://gitlab.com/qemu-project/qemu/-/work_items/4665); revisit when QEMU's Sdtrig matures.
# Sscofpmf_{Sm,S,U}_interrupt: mie/sie drop LCOFIE and sip neither writes nor reads LCOFIP, so LCOFI is never taken
#   (https://gitlab.com/qemu-project/qemu/-/work_items/3969); on RV32 overflows are also lost
#   (https://gitlab.com/qemu-project/qemu/-/work_items/4723).
# Sscofpmf_{Sm,S,U}_overflow: overflow needs 3969 fixed, and on RV32 also 4723 and
#   https://gitlab.com/qemu-project/qemu/-/work_items/4724 (mhpmcounterNh reads wrong).
# Sscofpmf_Sm_access (RV32): mhpmevent[57:56] (WPRI) are writable (https://gitlab.com/qemu-project/qemu/-/work_items/4722).
#   The other Sscofpmf groups pass.
# H: mstatus.MPV and mstatus.GVA are read-only zero, so mret never enters VS/VU: a guest's
#    ecall is reported as cause 9/8 instead of 10, and a hypervisor CSR access from VS raises
#    an illegal instruction instead of a virtual instruction exception
#    (https://gitlab.com/qemu-project/qemu/-/issues/4620). QEMU has further hypervisor bugs
#    filed the same day, 4611 through 4617, so this exclusion will be needed for a while.
# Svadu_sv39/48/57_Svadu_fault: with ADUE=1, QEMU sets A/D on a PTE with a reserved Svnapot encoding before raising the page fault
#    (https://gitlab.com/qemu-project/qemu/-/work_items/4636)
# Ssnpm_*/Smnpm_S_* (bare pmm00/pmm10 and sv* pmm10/pmm11 sweep groups), Smmpm_pmm00/pmm10 sweeps, Smnpm_U, Smnpm_USm: QEMU CBOs do not fault on inaccessible addresses in bare mode, shifting trap signatures;
# same issue as ExceptionsZicboU/S and SvZicbo (https://gitlab.com/qemu-project/qemu/-/work_items/3501).
# Ssnpm_sv*_pmm00_sweep, Smnpm_S_sv*_pmm00_sweep: on a store/AMO page fault from ssamoswap.w, QEMU writes a
# transformed instruction to htinst, but SSAMOSWAP has no defined transformation, so it must be 0
# (https://gitlab.com/qemu-project/qemu/-/work_items/4721).
# Sm_Zicntr fails on qemu because ecall, ebreak and illegal instruction increments minstret/instret. Filed QEMU issue: https://gitlab.com/qemu-project/qemu/-/work_items/4227
# Sm_Zicntr fails on qemu because minstret/instret overcounts by 1 for wfi with a pending or taken interrupt. Filed QEMU issue: https://gitlab.com/qemu-project/qemu/-/work_items/4230
# Zicfilp_Sm: an RV32 mstatus write clears mstatush.MPELP, so MRET does not restore ELP
#     (https://gitlab.com/qemu-project/qemu/-/work_items/4488), and mstatush.MPELP is not
#     writable (https://gitlab.com/qemu-project/qemu/-/work_items/4220).
# Zicfilp_S, Zicfilp_U: on RV32 a write to mstateen0 clears mstateen0h.ENVCFG
#     (https://gitlab.com/qemu-project/qemu/-/issues/4611). Boot writes mstateen0, so an
#     S-mode access to senvcfg then raises an illegal instruction (cause 2, xtval holding the
#     csrrc encoding) and the landing-pad tests diverge from the reference on senvcfg.LPE.
# All three suites pass on qemu-rv64-max, but exclusions apply to every QEMU config.
exclude_extensions: "Sm_mcsr_access,Sm_mcsr_cntr,Sm_mcsr_walk,Sm_shadow,Sm_xret,S-,S_scsr-,Ssstrict_Sm_CSR,Ssstrict_Sm_IllegalInstr,Ssstrict_S_CSR,Ssstrict_S_IllegalInstr,Ssstrict_U_IllegalInstr,Zacas,InterruptsSm_enable,InterruptsSm_priority,InterruptsSm_trigger,InterruptsS_enable,InterruptsS_priority,InterruptsS_trigger,ExceptionsZalrsc,ExceptionsZicboU,ExceptionsZicboS,ExceptionsZicboSm,SvZicbo_sv32_zicbom,SvZicbo_sv32_zicbop_Umode,SvZicbo_sv32_zicboz_exceptions_Umode,SvZicbo_sv39_zicbom,SvZicbo_sv48_zicbom,SvZicbo_sv57_zicbom,ExceptionsZaamo,ExceptionsSvZalrsc,ExceptionsSvZalrscSm_sv32_exceptions,ExceptionsSvZalrscSm_sv39_exceptions,Zama16b,SsstrictV,Smstateen,Ssstateen,Zawrs_S,Zawrs_U,SdtrigSm,SdtrigS,SdtrigU,H,Svadu_sv39_Svadu_fault,Svadu_sv48_Svadu_fault,Svadu_sv57_Svadu_fault,Ssnpm_bare_pmm00_sweep,Ssnpm_bare_pmm10_sweep,Ssnpm_sv39_pmm00_sweep,Ssnpm_sv39_pmm10_sweep,Ssnpm_sv39_pmm11_sweep,Ssnpm_sv48_pmm00_sweep,Ssnpm_sv48_pmm10_sweep,Ssnpm_sv48_pmm11_sweep,Ssnpm_sv57_pmm00_sweep,Ssnpm_sv57_pmm10_sweep,Ssnpm_sv57_pmm11_sweep,Smmpm_pmm00_sweep,Smmpm_pmm10_sweep,Smnpm_S_bare_pmm00_sweep,Smnpm_S_bare_pmm10_sweep,Smnpm_S_sv39_pmm00_sweep,Smnpm_S_sv39_pmm10_sweep,Smnpm_S_sv39_pmm11_sweep,Smnpm_S_sv48_pmm00_sweep,Smnpm_S_sv48_pmm10_sweep,Smnpm_S_sv48_pmm11_sweep,Smnpm_S_sv57_pmm00_sweep,Smnpm_S_sv57_pmm10_sweep,Smnpm_S_sv57_pmm11_sweep,Smnpm_U,Smnpm_USm,Sm_Zicntr,Sscofpmf_Sm_access,Sscofpmf_Sm_interrupt,Sscofpmf_Sm_overflow,Sscofpmf_S_interrupt,Sscofpmf_S_overflow,Sscofpmf_U_interrupt,Sscofpmf_U_overflow,Zicfilp_Sm,Zicfilp_S,Zicfilp_U"
# qemu-rv32-mu, qemu-rv64-mu: U-mode cbo.zero/clean/flush/inval raise illegal-instruction without S-mode
#   because check_zicbo_envcfg() also requires senvcfg, which does not exist
#   (https://gitlab.com/qemu-project/qemu/-/work_items/4596)
# qemu-rv64-m, qemu-rv64-mu: mstatus.SXL/UXL read as 64-bit when S/U are not implemented
#   (https://gitlab.com/qemu-project/qemu/-/work_items/4456)
exclude_configs:
  - qemu-rv32-mu
  - qemu-rv64-m
  - qemu-rv64-mu
install_script: ".github/scripts/install-qemu.sh"
apt_packages: "libglib2.0-dev libfdt-dev libpixman-1-dev zlib1g-dev ninja-build"
shards: 1
config_shards:
  qemu-rv64-max: 2
  qemu-rv32-max: 2
  qemu-rv32-m: 2
