  # "mask = riscv_pkg::MSTATEEN0_SE | riscv_pkg::MSTATEEN0_ENVCFG;"
  #   https://github.com/bsc-loca/csr/blob/c5c8a1d1302b62cbb5fd88863a446bfb3312adb9/rtl/csr_bsc.sv#L1612-L1631
  MSTATEEN_ENVCFG_TYPE: rw
  # ---------------- H ----------------
  MUTABLE_MISA_H: false
  # hstatus.VSXL is forced to 64 every cycle ("hstatus_d.vsxl = riscv_pkg::XLEN_64;",
  # csr_bsc.sv#L1837), and vsstatus.UXL likewise.
  VSXLEN: [64]
  VUXLEN: [64]
  # hstatus.VSBE is in HSTATUS_WRITE_MASK (def_pkg.sv#L123), but nothing in rtl/ reads it, so
  # every access is little-endian.
  VS_MODE_ENDIANNESS: little
  VU_MODE_ENDIANNESS: little
  # "parameter VMID_WIDTH = 11" (csr_bsc.sv#L28), and top_drac.sv does not override it.
  VMID_WIDTH: 11
  # hgeip and hgeie read 0 and ignore writes (csr_bsc.sv#L581-L586, #L1376-L1380).
  NUM_EXTERNAL_GUEST_INTERRUPTS: 0
  # "if ((hgatp.mode != def_pkg::MODE_OFF) && (hgatp.mode != def_pkg::MODE_SV39x4))
  #    hgatp_d.mode = hgatp_q.mode;"  (csr_bsc.sv#L1409-L1410)
  GSTAGE_MODE_BARE: true
  SV39X4_TRANSLATION: true
  SV48X4_TRANSLATION: false
  SV57X4_TRANSLATION: false
  # "if ((vsatp.mode == def_pkg::MODE_OFF) || (vsatp.mode == def_pkg::MODE_SV39)) vsatp_d = vsatp;"
  # (csr_bsc.sv#L1510-L1511): a write with any other mode is dropped.
