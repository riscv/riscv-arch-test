  - name: nonleaf_PTE_pbmt_write_s
    goal: Verify PBMT set in a non-leaf PTE raises a store/AMO page fault on a store from S-mode
    description: "S-mode: menvcfg.PBMTE=1 (set through T-SBI). Non-leaf PTE with PBMT = 1, 2 and 3 above a valid leaf with PTE.U=0. Store (sw) to the page through va_data."
    expectation: Store/AMO page fault (scause = 15); stval = faulting virtual address.
    bins: |-
      nonleaf_PTE_pbmt_d x PBMTE_set x PageType_d x sw x store_page_fault x mode {S-mode}
