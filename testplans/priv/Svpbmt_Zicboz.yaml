# yaml-language-server: $schema=testplan.schema.json
suite: Svpbmt_Zicboz
coverpoints:
  - heading: "General Test Environment (Svpbmt_Zicboz):\n- T-SBI suite: boots to S-mode (BOOT_TO_SMODE) and drives the test from the boot identity map. U-mode accesses use RVTEST_TSBI_GOTO_UMODE / RVTEST_TSBI_GOTO_SMODE.\n- Sv39 4 KiB pages: va_data maps a data page with PBMT = 0 (cacheable) and va_alias and va_zero map the same physical page with PBMT = NC or IO. The cbo.zero is the first access through va_zero, so it walks the page table.\n- menvcfg.PBMTE, menvcfg.CBCFE and menvcfg.CBZE are set through T-SBI; U-mode tests also set senvcfg.CBCFE and senvcfg.CBZE. Requires Zicbom as well as Zicboz. RV64 only."
  - name: cp_cbo_zero_pbmt_s
    goal: Verify cbo.flush through a PBMT = NC or IO alias removes a cached copy of a block that cbo.zero through another alias zeroed in memory, from S-mode
    description: "S-mode: sd through va_data (PBMT = 0, PTE.U=0); fence iorw, iorw; cbo.flush through va_alias (PBMT = NC, then IO); fence iorw, iorw; cbo.zero through va_zero (same PBMT); fence iorw, iorw; cbo.flush through va_alias; fence iorw, iorw; ld through va_data."
    expectation: "The cacheable load returns 0: the fence, cbo.flush, fence sequences restore coherence between the aliases around the uncached cbo.zero, and cache-block management instructions ignore the PBMT downgrade to non-cacheable."
    bins: |-
      cbo_zero x leaf_PTE_pbmt_s_d {NC, IO} x PBMTE_set x PageType_d {sv39_kilo} x mode {S-mode}
      = 2 bins on RV64 (RV64 only)
    id: Svpbmt_cacheable_aliasing_fence_flush_fence_required
    rules:
      - Svpbmt_cacheable_aliasing_fence_flush_fence_required
  - name: cp_cbo_zero_pbmt_u
    goal: Verify cbo.flush through a PBMT = NC or IO alias removes a cached copy of a block that cbo.zero through another alias zeroed in memory, from U-mode
    description: "U-mode: sd through va_data (PBMT = 0, PTE.U=1); fence iorw, iorw; cbo.flush through va_alias (PBMT = NC, then IO, PTE.U=1); fence iorw, iorw; cbo.zero through va_zero (same PBMT); fence iorw, iorw; cbo.flush through va_alias; fence iorw, iorw; ld through va_data."
    expectation: "The cacheable load returns 0: the fence, cbo.flush, fence sequences restore coherence between the aliases around the uncached cbo.zero, and cache-block management instructions ignore the PBMT downgrade to non-cacheable."
    bins: |-
      cbo_zero x leaf_PTE_pbmt_u_d {NC, IO} x PBMTE_set x PageType_d {sv39_kilo} x mode {U-mode}
      = 2 bins on RV64 (RV64 only)
    id: Svpbmt_cacheable_aliasing_fence_flush_fence_required
    rules:
      - Svpbmt_cacheable_aliasing_fence_flush_fence_required
