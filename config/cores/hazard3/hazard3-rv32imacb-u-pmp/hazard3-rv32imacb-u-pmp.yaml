  # mcountinhibit exists with only CY (bit 0) and IR (bit 2) implemented; bit 1 (TM) is
  # read-only zero as the spec requires, and bits 3..31 are hardwired 0 because no HPM
  # counter exists. Both implemented bits RESET TO 1, so the counters are stopped out of
  # reset and rvmodel_macros.h clears the register in RVMODEL_BOOT.
  #   Quote: "| 2 | `ir` | When 1, inhibit counting of `minstret`/`minstreth`. Resets to 1.
  #   | 0 | `cy` | When 1, inhibit counting of `mcycle`/`mcycleh`. Resets to 1."
  #   https://github.com/Wren6991/Hazard3/blob/8af992930f71a69b0e06c38734c1094f41a05ca0/doc/sections/csr.adoc#L371-L372
