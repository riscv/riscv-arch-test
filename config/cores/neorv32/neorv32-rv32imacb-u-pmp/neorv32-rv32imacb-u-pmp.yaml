# UDB Architecture Configuration for the NEORV32 processor in the microcontroller configuration of
# .github/scripts/neorv32-act-top.vhd (see ../README.md for every generic).
#
# Written against stnolting/neorv32 v1.13.7, commit b1f307244928161a3fca1a010af11d5a736b5339.
# Paths below are under
#   https://github.com/stnolting/neorv32/blob/b1f307244928161a3fca1a010af11d5a736b5339/
# Sources, in order of preference: the data sheet under docs/datasheet/, then the RTL under
# rtl/core/. cpu_control.vhd is rtl/core/neorv32_cpu_control.vhd.
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: neorv32-rv32imacb-u-pmp
description: NEORV32 v1.13.7 microcontroller configuration - RV32IMACB_Zbc_Zcb_Zcmop_Zicond_Zimop_Zkn_Zks with U-mode, 16 PMP regions and 4 HPM counters

# misa reads 0x40901107: MXL=1, A, B, C, I, M, U and X (cpu_control.vhd#L1217-L1227).
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  # A is reported in misa when Zaamo and Zalrsc are both enabled.
  #   Quote: "The `A` extension is shorthand for the following set of other extensions:
  #   Zaamo ... Zalrsc"
  #   docs/datasheet/cpu_isa.adoc#L103-L111
  - { name: A, version: "= 2.1.0" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  # B is reported in misa when Zba, Zbb and Zbs are all enabled.
  #   docs/datasheet/cpu_isa.adoc#L121-L131
  - { name: B, version: "= 1.0.0" }
  - { name: Zba, version: "= 1.0.0" }
  - { name: Zbb, version: "= 1.0.0" }
  - { name: Zbs, version: "= 1.0.0" }
  - { name: Zbc, version: "= 1.0.0" }
  # Scalar cryptography: RISCV_ISA_Zbkb/Zbkc/Zbkx/Zknd/Zkne/Zknh/Zksed/Zksh are all set, so mxisa
  # also reports the Zkn and Zks suites (cpu_control.vhd#L1295-L1304).
  #   Quote: "constant riscv_zkn_c : boolean := RISCV_ISA_Zbkb and RISCV_ISA_Zbkc and
  #   RISCV_ISA_Zbkx and RISCV_ISA_Zkne and RISCV_ISA_Zknd and RISCV_ISA_Zknh;"
  #   rtl/core/neorv32_cpu.vhd#L117-L120
  #   docs/datasheet/cpu_isa.adoc#L542-L700
  # Zbkb (pack, packh, zip, unzip, brev8 on top of the Zbb rotates, rev8 and andn/orn/xnor),
  # Zbkc (clmul, clmulh, shared with Zbc) and Zbkx (xperm4, xperm8) are decoded in
  # rtl/core/neorv32_cpu_alu_bitmanip.vhd#L191-L222.
  - { name: Zbkb, version: "= 1.0.0" }
  - { name: Zbkc, version: "= 1.0.0" }
  - { name: Zbkx, version: "= 1.0.0" }
  # AES, SHA-2, SM3 and SM4 are decoded in rtl/core/neorv32_cpu_alu_crypto.vhd#L217-L233.
  - { name: Zkn, version: "= 1.0.0" }
  - { name: Zknd, version: "= 1.0.0" }
  - { name: Zkne, version: "= 1.0.0" }
  - { name: Zknh, version: "= 1.0.0" }
  - { name: Zks, version: "= 1.0.0" }
  - { name: Zksed, version: "= 1.0.0" }
  - { name: Zksh, version: "= 1.0.0" }
  # Quote: "Note that the NEORV32 `C` ISA extension only includes the `Zca` instructions"
  #   docs/datasheet/cpu_isa.adoc#L151-L152
  - { name: C, version: "= 2.0" }
  - { name: Zca, version: "= 1.0.0" }
  - { name: Zcb, version: "= 1.0.0" }
  - { name: Zicond, version: "= 1.0.0" }
  # Zcmop needs C and Zimop (rtl/core/neorv32_cpu.vhd#L115); the decompressor expands c.mop.n
  # to mop.r.n with rd = rs1 = x0 (rtl/core/neorv32_cpu_decompressor.vhd#L167-L181).
  - { name: Zcmop, version: "= 1.0.0" }
  # mop.r.n and mop.rr.n are legal SYSTEM instructions with funct3 = 100 (cpu_control.vhd#L773-L778)
  # that read no CSR and write none (cpu_control.vhd#L412, #L470), so rd gets the all-zero CSR
  # read data (cpu_control.vhd#L1202).
  - { name: Zimop, version: "= 1.0.0" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zifencei, version: "= 2.0" }
  # cycle, time and instret all exist; time shadows the CLINT MTIMER.
  #   Quote: "The `time[h]` CSRs are user-mode shadow copies the memory-mapped machine timer"
  #   docs/datasheet/cpu_csr.adoc#L601-L602
  - { name: Zicntr, version: "= 2.0" }
  # hpmcounter3..31 are readable from U-mode when the mcounteren bit is set.
  #   docs/datasheet/cpu_csr.adoc#L740-L741
  - { name: Zihpm, version: "= 2.0.0" }
  # PAUSE is FENCE with pred=W, succ=0, and FENCE accepts every value of the unused fields
  # (only funct3 is decoded, cpu_control.vhd#L755-L758). The NTL hints are ADD with rd=x0.
  - { name: Zihintpause, version: "= 2.0.0" }
  - { name: Zihintntl, version: "= 1.0.0" }
  # Zkt is reported in mxisa whenever CPU_FAST_SHIFT_EN is set, which this configuration does.
  #   Quote: "constant riscv_zkt_c   : boolean := CPU_FAST_SHIFT_EN;"
  #   rtl/core/neorv32_cpu.vhd#L116
  #   docs/datasheet/cpu_isa.adoc#L702-L726
  - { name: Zkt, version: "= 1.0.0" }
  - { name: U, version: "= 1.0.0" }
  # Privileged 1.12: mstatush (read-only zero), menvcfg/menvcfgh (read-only zero) and mconfigptr
  # all exist.
  #   docs/datasheet/cpu_csr.adoc#L321-L331, #L451-L476, #L907-L917
  - { name: Sm, version: "= 1.12.0" }
  # mcyclecfgh/minstretcfgh hold MINH (bit 30) and UINH (bit 28).
  #   docs/datasheet/cpu_csr.adoc#L776-L825
  - { name: Smcntrpmf, version: "= 1.0.0" }

params:
  MXLEN: 32
  # pmpaddr bits 31:30 (address bits 33:32) are hardwired to zero.
  #   docs/datasheet/cpu_csr.adoc#L558-L565
  PHYS_ADDR_WIDTH: 32

  # misa is read-only, and writes are ignored without a trap.
  #   Quote: "The NEORV32 `misa` CSR is read-only. ... any write access to this CSR is simply
  #   ignored and will _not_ cause an illegal instruction exception."
  #   docs/datasheet/cpu_csr.adoc#L214-L217
  MISA_CSR_IMPLEMENTED: true
  MUTABLE_MISA_A: false
  MUTABLE_MISA_B: false
  MUTABLE_MISA_C: false
  MUTABLE_MISA_M: false
  MUTABLE_MISA_U: false
  # misa.X is always set.
  #   Quote: "**X**: bit is always set to indicate non-standard / NEORV32-specific extensions"
  #   docs/datasheet/cpu_csr.adoc#L225
  NON_STANDARD_EXTENSION_IMPLEMENTED: true

  # mstatush is read-only zero, so MBE is 0; mstatus has no UBE.
  M_MODE_ENDIANNESS: little
  U_MODE_ENDIANNESS: little
  UXLEN: [32]

  # Trap listing: docs/datasheet/cpu.adoc#L725-L761
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_ECALL_FROM_U: true
  TRAP_ON_EBREAK: true
  # Quote: "All reserved, unsupported, unavailable, or illegal instructions always raise a
  # precise exception"
  #   docs/datasheet/cpu.adoc#L324-L325
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  # Quote: "Any access to such a CSR will raise an illegal instruction exception."
  #   docs/datasheet/cpu_csr.adoc#L13-L17
  TRAP_ON_UNIMPLEMENTED_CSR: true
  # Writes to WLRL fields are masked, not trapped: mcause keeps bits 31 and 4:0 only.
  #   Quote: "csr.mcause <= csr_wdata(31) & csr_wdata(4 downto 0);"
  #   cpu_control.vhd#L1077
  TRAP_ON_ILLEGAL_WLRL: false

  # mtval values per cause, from the trap listing (docs/datasheet/cpu.adoc#L725-L740) and the
  # trap-entry logic (cpu_control.vhd#L1114-L1131): the access address for load/store
  # misaligned and access faults, the instruction word for illegal instructions (zero-extended
  # for a compressed one), and zero for everything else, including breakpoints and instruction
  # access faults.
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  # With C enabled no instruction-address-misaligned exception is ever raised.
  #   Quote: "If the `C` extension is implemented there will **never** be a misaligned
  #   instruction exception at all."
  #   docs/datasheet/cpu.adoc#L680-L682
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: false
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true
  MTVAL_WIDTH: 32

  # Every misaligned load, store, AMO, LR or SC raises a misaligned exception.
  #   Quote: "Any unaligned access will raise a bus load/store unaligned address exception."
  #   docs/datasheet/cpu.adoc#L187-L191
  #   Quote: "Accessing an unaligned address will raise an alignment exception (and not a bus
  #   fault exception which is also valid according to the RISC-V spec)."
  #   docs/datasheet/cpu_isa.adoc#L113-L118
  MISALIGNED_LDST: false
  # The misaligned check is made before the access, so a misaligned access never reaches PMP
  # or the bus, and the trap priority encoder ranks misaligned above access faults.
  #   Quote: "exceptions caused by a misaligned memory address a physical memory protection
  #   fault do not trigger a memory access request at all."
  #   docs/datasheet/cpu.adoc#L677-L678
  #   cpu_control.vhd#L886-L896
  MISALIGNED_LDST_EXCEPTION_PRIORITY: high
  MISALIGNED_AMO: false
  LRSC_MISALIGNED_BEHAVIOR: "always raise misaligned exception"

  # One reservation set: the naturally aligned 64-byte granule of the LR address. An SC to any
  # address in the same granule succeeds while the reservation is valid.
  #   Quote: "In NEORV32 a reservation is defined by a 64-byte address granule ... If the
  #   reservation is still valid (same owner core ... and same address granule) the
  #   write access performed by the `SC` instruction is finally executed"
  #   docs/datasheet/soc.adoc#L700-L705
  LRSC_RESERVATION_STRATEGY: "reserve naturally-aligned 64-byte region"
  LRSC_FAIL_ON_NON_EXACT_LRSC: false
  LRSC_FAIL_ON_VA_SYNONYM: false

  # mvendorid is OCD_JEDEC_ID, left at its default of zero; marchid is 19; mimpid is the
  # BCD version 01.13.07.00; mconfigptr is read-only zero.
  #   docs/datasheet/cpu_csr.adoc#L839-L917
  #   Quote: "constant hw_version_c  : std_ulogic_vector(31 downto 0) := x"01130700";"
  #   rtl/core/neorv32_package.vhd#L23
  VENDOR_ID_BANK: 0x0
  VENDOR_ID_OFFSET: 0x0
  MARCHID_IMPLEMENTED: true
  ARCH_ID_VALUE: 0x13
  MIMPID_IMPLEMENTED: true
  IMP_ID_VALUE: 0x01130700
  CONFIG_PTR_ADDRESS: 0x0

  # mtvec: Direct with a 4-byte-aligned BASE, or Vectored with a 128-byte-aligned BASE whose low
  # bits are forced to zero. A reserved MODE is written as Direct with the new BASE, which is
  # neither "retain" behavior.
  #   Quote: "in VECTORED mode = 128-byte-aligned base address of trap vector table ...
  #   `00` = DIRECT, `01` = VECTORED; other encodings are _reserved_ and will fall back to DIRECT
  #   mode; the lowest address bits are hardwired to zero in VECTORED mode"
  #   docs/datasheet/cpu_csr.adoc#L285-L289
  #   cpu_control.vhd#L1060-L1065
  MTVEC_MODES: [0, 1]
  MTVEC_ACCESS: rw
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_BASE_ALIGNMENT_VECTORED: 128

  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  # MEI comes from the irq_mei_i pin (driven by the testbench), MTI and MSI from the CLINT.
  #   docs/datasheet/cpu_csr.adoc#L427-L436
  MEI_INTR_IMPL: true
  MSI_INTR_IMPL: true
  MTI_INTR_IMPL: true
  # WFI in U-mode is legal unless mstatus.TW is set, and sleeps until an enabled interrupt is
  # pending.
  #   Quote: "when funct12_wfi_c    => illegal_cmd <= (not csr.prv_level) and csr.mstatus_tw;"
  #   cpu_control.vhd#L769
  #   docs/datasheet/cpu.adoc#L295-L300
  WFI_U_MODE: true
  WFI_FINITE: false
  # Bus transfers are 32 bits wide with byte enables.
  PMA_GRANULARITY: 2

  # PMP_NUM_REGIONS=16, PMP_MIN_GRANULARITY=4 (G=0, so NA4 is available), and TOR, NA4 and
  # NAPOT all implemented (PMP_TOR_MODE_EN, PMP_NAP_MODE_EN).
  #   docs/datasheet/cpu_isa.adoc#L766-L784
  NUM_PMP_ENTRIES: 16
  NUM_USABLE_PMP_ENTRIES: 16
  PMP_GRANULARITY: 2
  PMP_TOR_SUPPORTED: true
  PMP_NA4_SUPPORTED: true
  PMP_NAPOT_SUPPORTED: true

  TIME_CSR_IMPLEMENTED: true

  # HPM_NUM_CNTS=4 makes mhpmcounter3..6 real 64-bit counters (HPM_CNT_WIDTH=64); 7..31 are
  # read-only zero and do not trap.
  #   Quote: "If trying to access an HPM-related CSR beyond `HPM_NUM_CNTS` **no illegal
  #   instruction exception is triggered**. These CSRs are read-only, writes are ignored and
  #   reads always return zero."
  #   docs/datasheet/cpu_csr.adoc#L668-L675
  HPM_EVENTS: [0]
  HPM_COUNTER_EN: [
      false,
      false,
      false, # 0 (mcycle), 1 (time), 2 (minstret) are not mhpmcounters
      true,
      true,
      true,
      true, # mhpmcounter3..6
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false, # 7..15
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false, # 16..23
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false, # 24..31
    ]
  HPM_COUNTER3_WIDTH: 64
  HPM_COUNTER4_WIDTH: 64
  HPM_COUNTER5_WIDTH: 64
  HPM_COUNTER6_WIDTH: 64

  # mcountinhibit: CY, IR and the four implemented HPM counters; TM is read-only zero.
  #   docs/datasheet/cpu_csr.adoc#L764-L773
  MCOUNTINHIBIT_IMPLEMENTED: true
  COUNTINHIBIT_EN: [
      true,
      false,
      true,
      true,
      true,
      true,
      true, # 0..6
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false, # 7..15
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false, # 16..23
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false, # 24..31
    ]

  # mcounteren is a plain 32-bit register: every bit is writable, including those of the
  # read-only-zero HPM counters.
  #   Quote: "when csr_mcounteren_c => -- machine counter access enable
  #   csr.mcounteren <= csr_wdata;"
  #   cpu_control.vhd#L1067-L1068
  MCOUNTENABLE_EN: [
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true, # 0..7
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true, # 8..15
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true, # 16..23
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true, # 24..31
    ]
