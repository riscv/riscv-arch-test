# CI configuration for the cve4 family: CV32E40P and CV32E40X

ci_enabled: true
# Sm_F: cv32e40p-rv32imcf DUT bug - https://github.com/openhwfoundation/cv32e40p/issues/1060
# Sm_mcsr_access, Sm_mcsr_addr: mtval is read-only zero, which Sail cannot model.
# Exceptions_Zalrsc/Exceptions_Zaamo: Throwing access fault instead of misaligned fault.
# See https://github.com/openhwfoundation/cv32e40x/issues/1000 and
# https://github.com/riscv/riscv-arch-test/pull/1710#issuecomment-5444172186
exclude_extensions: "Sm_F,Sm_mcsr_access,Sm_mcsr_addr,Exceptions_Zalrsc,Exceptions_Zaamo"
apt_packages: "autoconf flex bison help2man libfl-dev ccache"
install_script: ".github/scripts/install-cve4.sh"
setup_script: ".github/scripts/setup-cve4.sh"
