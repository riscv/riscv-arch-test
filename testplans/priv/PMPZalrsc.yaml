# yaml-language-server: $schema=testplan.schema.json
suite: PMPZalrsc
source: https://docs.google.com/spreadsheets/d/1VuBt-H9VVWh8k-USAJEplrgEJETjQ-iNjD4Iq_ZOnN0/edit?gid=613653829#gid=613653829
coverpoints:
  - heading: "See PMPM for general information.\nTests run in M mode.\nIn this suite, loads = lr.w, stores = sc.w\nRV64 adds lr.d, sc.d"
  - name: cp_cfg_RW
    goal: The R, W, ...bits, when set, indicate that the PMP entry permits read, write
    description: |-
      Check that WR bits control write/read access for every type of load and store.
      Attempt all types of reads and writes with pmpcfg_i.L=1, all legal pmpcfg_i.XWR
      Observe proper access faults for restricted read/write regions
    bins: 6 XWR * (2-4 ops)
    notes: For stores that are expected to succeed, a constrained LRSC loop must be used
