# CI configuration for the Shakti C-class core

ci_enabled: true

# shaktiproject/cores/c-class f527753 (6.1.0); paths are under
# https://gitlab.com/shaktiproject/cores/c-class/-/blob/f52775317b0e6c16272f5c42d3dd7d52282f0e65/
exclude_extensions:
  # mcounteren is never checked: S-mode and U-mode can read cycle, instret and every hpmcounter
  # whatever its mcounteren bit (src/decoder.bsv#L63-L74;
  # https://gitlab.com/shaktiproject/cores/c-class/-/issues/325).
  - S_Zicntr
  - U_Zicntr
  # dcsr (0x7B0) is readable in M-mode outside Debug mode: the CSR permission check looks only at
  # the privilege level and read-only bits (src/decoder.bsv#L48-L56). The privileged
  # specification requires an illegal-instruction exception on machine-mode access to
  # 0x7B0-0x7BF
  # (https://github.com/riscv/riscv-isa-manual/blob/b3967cd97c2c32c4fe010ea969d73c647ecec14b/src/priv/csrs.adoc#L62-L64,
  # https://github.com/riscv/riscv-isa-manual/pull/3323, which changed "should" to "must").
  - Sm_csr_insufficient_priv
  # sip and sie show bits that mideleg does not delegate, which priv 1.11 says "appear to be
  # hardwired to zero"
  # (https://github.com/riscv/riscv-isa-manual/blob/f467e5dfd4acb4391870b8bfcfd687a0e5d8eddc/src/machine.tex#L1212-L1219;
  # https://gitlab.com/shaktiproject/cores/csrbox/-/issues/8). Writing sip.SSIP with mideleg = 0
  # sets mip.SSIP, so InterruptsSm_trigger_M, _S and _U take an M-mode software interrupt.
  - Sm_scsr_from_m
  - Sm_shadow
  - InterruptsSm_trigger_M
  - InterruptsSm_trigger_S
  - InterruptsSm_trigger_U
  # wfi in U-mode waits forever instead of raising illegal instruction (src/decoder.bsv#L533;
  # https://gitlab.com/shaktiproject/cores/c-class/-/issues/324).
  - InterruptsS_wfi_timeout_U
  - InterruptsSm_wfi_timeout_U
  # A pending interrupt delegated to S-mode is taken before a pending M-mode interrupt
  # (https://gitlab.com/shaktiproject/cores/c-class/-/issues/327).
  - InterruptsSm_priority_mideleg_S
  - InterruptsSm_priority_mideleg_U
  # mie and mip bits 2, 6 and 10 (the hypervisor VS interrupts) are writable without H:
  # riscv-config gives them the S-mode default
  # (https://gitlab.com/shaktiproject/cores/riscv-config/-/issues/5). Of Sm_mcsr_walk only parts
  # -01 and -02 fail, but its parts cannot be excluded one at a time.
  - Sm_mcsr_access
  - Sm_mcsr_walk
  # misa.I can be cleared, leaving I = E = 0
  # (https://gitlab.com/shaktiproject/cores/c-class/-/issues/326).
  - Sm_misa
  # A platform deviation in test_soc, not a core bug: a store to the CLINT's mtime faults,
  # because the CLINT has no write path for mtime
  # (https://gitlab.com/shaktiproject/uncore/devices/-/blob/60d9dee9090f0015ccd14de47dd09277c3d608a7/clint/clint.bsv#L149-L199),
  # whereas the privileged specification makes mtime a machine-mode read-write register
  # (https://github.com/riscv/riscv-isa-manual/blob/f467e5dfd4acb4391870b8bfcfd687a0e5d8eddc/src/machine.tex#L1444-L1445).
  - Sm_mcsr_cntr
  # An LR at a misaligned address raises store-address-misaligned, and an LR denied by PMP raises
  # a store access fault (src/stage3.bsv#L598-L599;
  # https://gitlab.com/shaktiproject/cores/c-class/-/issues/323; the page-fault case was
  # https://gitlab.com/shaktiproject/cores/c-class/-/issues/227).
  - Exceptions_Zalrsc
  - PMP_Zalrsc_cfg_wr
  - Sv_ExceptionsZalrsc
  - Sv_ExceptionsZalrscSm_sv39_exceptions_Zalrsc_mprv
  # Waived: a pmpcfg write with a reserved bit set leaves the entry unchanged, which the WARL
  # rules allow and Sail cannot model (the riscv-config "wr_illegal: Unchanged" that csrbox
  # generates, sample_config/c64/rv64i_isa.yaml).
  - PMP_Sm_pmpcfg_walk_02
  - PMP_Sm_pmpcfg_walk_03
  - PMP_Sm_pmpcfg_walk_04
  - PMP_Sm_pmpcfg_walk_05
  - PMP_Sm_pmpcfg_walk_06
  - PMP_Sm_pmpcfg_walk_07
  - PMP_Sm_pmpcfg_walk_08
  - PMP_Sm_pmpcfg_walk_09
  # TOR and NAPOT entries match one granule too many: both compare the request with the top
  # pmpaddr using <=
  # (https://gitlab.com/shaktiproject/uncore/caches_mmu/-/blob/787102aba7af7afeff0755a7bf8ddbfb86ea936b/src/pmp/pmp_func.bsv#L100-L106;
  # https://gitlab.com/shaktiproject/uncore/caches_mmu/-/issues/55; open caches_mmu MR !87 fixes
  # TOR only).
  - PMP_S_napot_legal_lxwr-01-
  - PMP_S_napot_legal_lxwr-02-
  - PMP_Sm_napot_legal_lxwr-01-
  - PMP_Sm_napot_legal_lxwr-02-
  - PMP_U_napot_legal_lxwr-01-
  - PMP_U_napot_legal_lxwr-02-
  - PMP_S_tor_legal_lxwr-02-
  - PMP_Sm_tor_legal_lxwr-02-
  - PMP_U_tor_legal_lxwr-02-
  - PMP_Sm_cfg_A_tor_bot
  - PMP_Sm_cfg_napot_all
  - PMP_Sm_cfg_tor_all
  - PMP_Sm_cfg_tor_check-01-
  - PMP_Sm_priority-
  - PMP_Sv_sv39_pmp_on_pa_Smode
  - PMP_Sv_sv39_pmp_on_pa_Umode
  - PMP_Zca_misaligned_tor
  # With a grain of 8 bytes, pmpaddr[0] is read-only zero in NAPOT mode too, so no NAPOT region
  # larger than 8 bytes can be encoded (sample_config/c64/rv64i_isa.yaml, pmpaddr bitmask
  # 0x3FFFFFFE). pmpaddr is WARL, so this is a sample-configuration choice rather than a clear
  # bug; open c-class MR !225 changes the sample to G = 0.
  - PMP_Sm_grain-
  # FENCE and FENCE.I write 0 to a nonzero rd (src/decoder.bsv#L300-L307;
  # https://gitlab.com/shaktiproject/cores/c-class/-/issues/322; the FENCE.I case was
  # https://gitlab.com/shaktiproject/cores/c-class/-/issues/48, closed).
  - I-fence
  - Zifencei-fence.i
  # An SC pairs with an older LR after a newer LR to an address 256 bytes away. Legal: the
  # reservation compares only address bits 2:0, and the spec allows an arbitrarily large
  # reservation set. Asked whether the mask is meant to be inverted in
  # https://gitlab.com/shaktiproject/uncore/caches_mmu/-/issues/56.
  - Zalrsc-sc.d
  - Zalrsc-sc.w

apt_packages: "autoconf flex bison help2man libfl-dev ccache libgmp10 python3-venv"
install_script: ".github/scripts/install-shakti.sh"
setup_script: ".github/scripts/setup-shakti.sh"
