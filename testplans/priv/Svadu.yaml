# yaml-language-server: $schema=testplan.schema.json
suite: Svadu
source: https://docs.google.com/spreadsheets/d/1LGwD2e01j4SN9tg85nt6gPwpp7nXyXMF7hqbw3jvXko/edit?gid=1484908158#gid=1484908158
coverpoints:
  - name: |-
      Abit_unset_exec
      Abit_unset_read
      Abit_unset_write
    goal: Access bit implementation
    description: |-
      With menfcfg.ADUE = {0/1}: Test in supervisor and user privilege mode for leaf PTE on all levels.
      Test Environment:
       Set satp.mode=sv32, 39, 48 and 57
       All PMP permissions on targated pages if PMP is enabled
       Valid leaf PTE, with no invalid RWX encoding
       Execute sfence.vma before accessign the PTE.

      Test Cases:
       Set PTE.R=1  & pte.a=0 and test the read access.
       Set PTE.W=1&PTE.R=1 & pte.a=0 and test the write access.
       Set PTE.X=1  & pte.a=0 and test the execute access.

      Note:
       For testing at level0, set all the pte perimssions at higher levels to 0 except PTE.v, so that nonleaf level points to level0.
       Set PTE.U=0 when test in Supervisor mode and Set pte.U=1 when testing in user mode.
    expectation: |-
      if ADUE = 0:load/store/fetch page fault
      If ADUE = 1: PTE.A bit is set after accessing; no page fault occurs
    bins: 2 ADUE * 2 priv modes * (3 Sv39 +4 Sv48 + 5 Sv57) levels * 3 access
  - name: Dbit_unset_write
    goal: Dirty bit Implementation
    description: |-
      With menfcfg.ADUE = {0/1}: Test in supervisor and user privilege mode for leaf PTE on all levels.
      Test Environment:
       Set satp.mode=sv32, 39, 48 and 57.
       All PMP permissions on targated pages if PMP is enabled
       PTE.V = 1, PTE.A = 1, with no invalid RWX encoding
       Execute sfence.vma before accessign the PTE.

      Test Case:
       Set PTE.W=1 & PTE.R=1 & PTE.D=0 and test the write access.

      Note:
       For testing at level0, set all the pte perimssions at higher levels to 0 except PTE.V, so that nonleaf level points to level0.
       Set PTE.U=0 when test in Supervisor mode and Set pte.U=1 when testing in user mode.
    expectation: |-
      if ADUE = 0: store page fault
      If ADUE = 1: PTE.A bit is set after accessing; no page fault occurs
    bins: 2 ADUE * 2 priv modes * (3 Sv39 +4 Sv48 + 5 Sv57) levels
