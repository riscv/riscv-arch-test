  NON_STANDARD_EXTENSION_IMPLEMENTED: false
  # 64-byte cache blocks (Zic64b); cbo.inval is not upgraded to a flush.
  CACHE_BLOCK_SIZE: 64
  FORCE_UPGRADE_CBO_INVAL_TO_FLUSH: false
  # menvcfg.PMM takes 00, 10 and 11, i.e. pointer masking off, PMLEN 7 and PMLEN 16.
  #   Quote: "override protected def legalValues: Seq[EnumType] = Seq(Disable, PMLEN7, PMLEN16)"
  #   https://github.com/OpenXiangShan/XiangShan/blob/e7bab53e66dfb3c4a1d11cf9519b0396f8576cae/src/main/scala/xiangshan/backend/fu/NewCSR/CSRDefines.scala#L194-L200
  SUPPORTED_PMLEN_SMMPM: [0, 7, 16]
  SUPPORTED_PMLEN_SMNPM: [0, 7, 16]
  SUPPORTED_PMLEN_SSNPM: [0, 7, 16]
  # Misaligned scalar accesses to cacheable memory are performed by hardware ("Supports unaligned
  # access to Cacheable space"), but not atomically, and the extractor measured misaligned
  # exceptions taking priority over access faults, which requires a granule of 0.
  #   https://github.com/OpenXiangShan/XiangShan-User-Guide/blob/015f7d3402cc989d10dbca6ad6c0c8f07805dfa0/docs/en/introduction.md#L56
  MISALIGNED_MAX_ATOMICITY_GRANULE_SIZE: 0
  # A misaligned access that faults partway is not split into sequential bytes (measured
  # "custom"); sequential_bytes is the only value UDB can model.
  MISALIGNED_SPLIT_STRATEGY: custom
  # Fault-only-first segment loads: the extractor measured neither UDB option.
  VECTOR_FF_SEG_EXCEPTION_PARTIAL_LOAD: custom
  # mtval reports the faulting virtual address for misaligned accesses ("Access start address").
  #   https://github.com/OpenXiangShan/XiangShan-User-Guide/blob/015f7d3402cc989d10dbca6ad6c0c8f07805dfa0/docs/en/exception-and-interrupt.md#L72-L74
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_VSTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_VSTVAL_ON_STORE_AMO_MISALIGNED: true
  # With C always enabled there are no instruction-address-misaligned exceptions ("Xiangshan does
  # not actually have instruction address misalignment exceptions").
  #   https://github.com/OpenXiangShan/XiangShan-User-Guide/blob/015f7d3402cc989d10dbca6ad6c0c8f07805dfa0/docs/en/exception-and-interrupt.md#L96-L97
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_MISALIGNED: true
