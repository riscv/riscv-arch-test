# CI configuration for the CHIPS Alliance VeeR EL2 core

ci_enabled: true

# Cores-VeeR-EL2 @ 925f3a34, https://github.com/chipsalliance/Cores-VeeR-EL2/blob/925f3a34/
exclude_extensions:
  # Writes to the read-only cycle CSR do not trap, in M-mode or in U-mode with mcounteren.CY set
  # (https://github.com/chipsalliance/Cores-VeeR-EL2/issues/563): design/dec/el2_dec_tlu_ctl.sv#L2918-L2921
  - Sm_csr_ro
  - U_ucsr_ro
  # mstatus.TW is read-only 0 although U-mode exists
  # (https://github.com/chipsalliance/Cores-VeeR-EL2/issues/600). The numbered Sm_mcsr_walk
  # files cannot be excluded one at a time.
  - Sm_mcsr_access
  - Sm_mcsr_walk
  # Legal behavior Sail cannot model: EL2 writes mtval = 0 for a U-mode mret or CSR privilege trap
  # and the encoding for other illegal instructions, as the spec allows (norm:mtval_instr_bits_lead_in),
  # but Sail has one xtval_nonzero.illegal_instruction flag for all of them: design/dec/el2_dec_tlu_ctl.sv#L1889
  - U-
  - U_ucsr-
  - PMP_U_csr
  # PMP checks only a fetch's start, missing a non-executable second half: design/el2_veer.sv#L1097
  - PMP_Zca_misaligned_na4
  - PMP_Zca_misaligned_napot
  - PMP_Zca_misaligned_tor
  # Testbench: stores never reach instruction memory, so fence.i fetches stale code
  - Zifencei
  # FENCE with a reserved fm raises an illegal instruction instead of executing as a normal FENCE
  # (https://github.com/chipsalliance/Cores-VeeR-EL2/issues/604): design/dec/decode#L229
  - I-fence

apt_packages: "autoconf flex bison help2man libfl-dev ccache"
install_script: ".github/scripts/install-veer-el2.sh"
setup_script: ".github/scripts/setup-veer-el2.sh"
