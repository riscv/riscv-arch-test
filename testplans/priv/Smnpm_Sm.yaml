# yaml-language-server: $schema=testplan.schema.json
suite: Smnpm_SSm
title: Smnpm Coverpoints (S mode, M-mode with MPRV)
source: https://docs.google.com/spreadsheets/d/15yJhyhBB5X9cq4SDQ-YCPzo2oPQnDBh5wEIZhi0-9Ps/edit?gid=645084995#gid=645084995
notes: |
  Smnpm provides pointer masking for S-mode (if implemented) via menvcfg.PMM.
  In this sheet , test plan is for the M-mode part of SmnpmS: M-mode accesses memory as S-mode via MPRV.
  - tests run in M-mode with mstatus.MPRV=1 and mstatus.MPP=S
  - The suite requires Smnpm and S-mode because menvcfg.PMM governs the access. mseccfg.PMM is swept only if Smmpm is supported, to show that it does not apply.
coverpoints:
  - name: cp_pm_mprv_mpp_s
    goal: Verify that menvcfg.PMM governs pointer masking when M-mode accesses memory as S-mode via MPRV.
    description: |-
      MPRV affect pointer masking as well, causing the pointer masking settings of the effective privilege mode to be applied.
      With MPP=S the effective privilege mode is S, so menvcfg.PMM applies and mseccfg.PMM does not.

      Test Environment:
       In M-mode set mstatus.MPRV=1 and mstatus.MPP=S
       Set mstatus.SUM=1 so the setup code can access user-space pages.
       Place known value_old in scratch. Let A' = scratch (upper bits = 0x0000).
      Page tables configured for valid mappings under satp.MODE ∈ {Bare, Sv39}, with the data pages user-accessible.
      For each mstatus.MXR in {0, 1}:
      For each mseccfg.PMM in {00, 10, 11} if Smmpm supported:
      For each menvcfg.PMM in {00, 10, 11}:
      For each satp.MODE in {Bare, Sv39}:
      For each A_upper_bits in {0x0000, 0x0001, 0x0200}:
      Set A = A' with upper bits replaced by A_upper_bits
      For read (lw): read directly from A in M-mode with MPRV=1, sigupd(value), record any traps.
      For write (sw): write unique known value_new to A in M-mode with MPRV=1, read back from scratch (A'), sigupd(value), record any traps.
    expectation: "When menvcfg.PMM=10/11 and MXR=0: A patterns whose upper bits fall within PMLEN resolve to scratch, reads return known value_old, write readbacks return known value_new, regardless of mseccfg.PMM. When menvcfg.PMM=00 or MXR=1: masking disabled : only A=0x0000 resolves to scratch; all other patterns cause a trap."
    bins: 2 MXR * 3 mseccfg.PMM * 3 menvcfg.PMM * 1 MPRV * 1 MPP (S) * 2 satp.MODE * 3 addresses * 2 instructions (lw, sw)
    rules:
      - pm_mprv_spvp
  - name: cp_menvcfg_pmm_rsv
    goal: Verify that the reserved menvcfg.PMM = 01 is never stored, and that an access under it works.
    description: |-
      In M-mode with menvcfg.PMM = 00: csrrw menvcfg with PMM = 01 and its other bits unchanged, read menvcfg.PMM back
      and record whether it is 00 or a supported value. Then write PMM = 01 again and, with MPRV = 1 and MPP = S, load
      through an untagged pointer.
    expectation: menvcfg.PMM reads back 00 or a supported value. The load returns the seeded value.
    bins: "1"
    rules:
      - pmlen_future_reserved
      - pmlen_illegal_warl
  - name: cp_menvcfg_pmm_unsupported
    goal: Verify that menvcfg.PMM does not store a PMM value whose PMLEN is not supported.
    description: |-
      In M-mode with menvcfg.PMM = 00, for each of PMM = 10 (PMLEN 7) and 11 (PMLEN 16) whose PMLEN is not supported:
      csrrw menvcfg with that PMM and its other bits unchanged, read menvcfg.PMM back and record whether it is 00 or a
      supported value.
    expectation: The field reads back 00 or a supported value (WARL).
    bins: 1 per unsupported PMLEN (0-2)
    rules:
      - pmlen_illegal_warl
