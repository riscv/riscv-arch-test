      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]
  # U74 mhpmcounter3 and mhpmcounter4 have 40 bits of implemented precision.
  HPM_COUNTER3_WIDTH: 40
  HPM_COUNTER4_WIDTH: 40
  HPM_EVENTS: [0]
  COUNTINHIBIT_EN:
