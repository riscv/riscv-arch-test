  - name: hideleg_acc
    coverpoint: ["H_mcsr/{cp_hcsr_access/hideleg , cp_hcsrwalk/hideleg } , H_hscsr/ {cp_hcsr_access/hideleg , cp_hcsrwalk/hideleg}"]

