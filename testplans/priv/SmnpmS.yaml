# yaml-language-server: $schema=testplan.schema.json
suite: SmnpmS
title: Smnpm Coverpoints (S mode)
source: https://docs.google.com/spreadsheets/d/15yJhyhBB5X9cq4SDQ-YCPzo2oPQnDBh5wEIZhi0-9Ps/edit?gid=720514871#gid=720514871
notes: |
  Smnpm is a machine level extension which  enables pointer maksing for lower privilege level S mode (if implemented ) or otherwise U-mode via menvcfg.
  In this sheet , test plan is for S-mode  implementation (SmnpmS)
  Similar to Ssnpm except:
  Run the same coverpoints as Ssnpm in S-mode except
  - MXR bit is sampled from mstatus csr
  - remove cp_pmm_uxl_clear
coverpoints:
  - heading: "- add the following cp_pm_csr_software_access_* coverpoints"
  - name: cp_pm_csr_software_access
    goal: Ensure pointer masking is not applied to software CSR reads and writes
    description: |-
      Pointer masking is not applied to software CSR reads and writes.


      Test Environment:
      In M-mode , set menvcfg.PMM={10(PMLEN=7),11(PMLEN=16)}
      switch to S-mode;
       Write XLEN test patterns with upper PMLEN bits set to RW CSRs {sepc, stvec, sscratch} using {csrrw}. Read back the same CSR using CSR read instructions then compare written and read values.
    expectation: |-
      No masking applied; read-back value matches written value (subject to WARL constraints).
      The implemented WARL width of CSRs is unaffected by pointer masking
    bins: 2 PMM * 4 CSR ops * 1 mode (S) * 3 CSR * satp supported modes (Bare, Sv39, Sv48, Sv57)
    rules:
      - pm_no_csr_sw
      - pm_warl_unaffected
