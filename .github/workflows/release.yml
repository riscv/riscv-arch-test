# SPDX-License-Identifier: Apache-2.0

name: Create Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match a heading in CHANGELOG.md, e.g. 4.0.0). Defaults to latest in CHANGELOG.md."
        required: false
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true

permissions:
  contents: write

# Serialize release creation so concurrent pushes can't race to create the same tag/release.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  # Resolve the target version and short-circuit if its release already exists,
  # so the whole workflow is idempotent (re-runs / repeated pushes are no-ops).
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version
        id: version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version=$(awk -F'[][]' '/^## \[/ { print $2; exit }' CHANGELOG.md)
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not determine release version from CHANGELOG.md."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::notice::Release ${{ steps.version.outputs.version }} already exists; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="$VERSION"
          notes=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md)
          # Strip leading/trailing blank lines.
          notes=$(printf "%s" "$notes" | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)
          if [ -z "$notes" ]; then
            echo "::error::No release notes found for version '$version' in CHANGELOG.md. Add a '## [$version] - <date>' section before releasing."
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4

      - run: git submodule update --init docs/docs-resources

      - name: Build CTP
        run: cd docs/ctp && make -j2

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          draft: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.draft == 'true' }}
          prerelease: false
          make_latest: true
          tag_name: ${{ env.VERSION }}
          name: "${{ env.VERSION }}"
          body: ${{ steps.notes.outputs.notes }}
          fail_on_unmatched_files: true
          files: |
            docs/ctp/build/ctp.pdf
            docs/ctp/build/ctp.html
            README.md
