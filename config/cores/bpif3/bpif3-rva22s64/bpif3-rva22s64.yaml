  TRAP_ON_ECALL_FROM_S: true
  MSTATUS_VS_LEGAL_VALUES: [0, 1, 2, 3]
  MSTATUS_TVM_IMPLEMENTED: true
  # Sm params
  MXLEN: 64
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true
  # NOTE: mvendorid, marchid, mimpid must be read from real K1 hardware via csrr.
  # Set to false until verified values are available. When set to true, add
  # ARCH_ID_VALUE, IMP_ID_VALUE, VENDOR_ID_BANK, VENDOR_ID_OFFSET from hardware.
  MARCHID_IMPLEMENTED: false
  MIMPID_IMPLEMENTED: false
  VENDOR_ID_BANK: 0
  VENDOR_ID_OFFSET: 0
  MISALIGNED_LDST: true          # scalar misaligned loads/stores supported on K1
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low
  MISALIGNED_MAX_ATOMICITY_GRANULE_SIZE: 4096
  MISALIGNED_SPLIT_STRATEGY: sequential_bytes
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
