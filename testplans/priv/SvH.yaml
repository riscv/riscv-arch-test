# yaml-language-server: $schema=testplan.schema.json
suite: SvH
source: https://docs.google.com/spreadsheets/d/1DWBEoprndjQzLTXQTzPI8jW1HydtkYRR3tg58q59fdk/edit?gid=747120884#gid=747120884
coverpoints:
  - goal: note that BARE-only implementations would likely make whole of satp read only 0
    description: |-
      This test plan verifies functional behavior of RISC-V Hypervisor extension features, including memory translation across privilege modes, page fault handling, permission enforcement, and legal instruction execution in virtual environments. It includes both synchronous and asynchronous exception tests, and exercises fields like SPVP, HU, SUM, MPRV, and MXR under a variety of mode settings (M, HS, VS, VU). The plan ensures coverage of MMU, privilege enforcement, access faults, and instruction legality across different translation stages and address spaces.

      - All tests must be run with the Hypervisor extension (H) enabled and two-stage translation (vsatp + hgatp) configured where applicable.
      - For vsatp tests, hgatp.MODE = Bare.  For hgatp tests, vsatp.MODE = Bare.
      - Unless explicitly stated, translation and trap delegation should be enabled where needed to observe expected behavior.
      - Set privilege bits such as MPRV, MPV, SPVP, SUM, MXR, and VU carefully per test requirement.
      - After modifying hgatp, vsatp, or page tables, always execute sfence.vma (and vma.all) to flush stale TLBs.
      - Run in VS-mode unless otherwise specified.

      Valid Perms means XWRV=1111, A/D = 11 unless otherwise specified.  MODE is Sv32 for RV32 or Sv39 for RV64 when exercising virtual memory, unless otherwise specified.  Access means Read, Write, and Execute.
  - name: cp_vsatp_mode_field
    goal: supported/unsupported MODE encodings
    description: |-
      RV64 Only:
      Test Case: For x = {0...15} In HS-mode: First write vsatp with {Bare, Sv39}.  Then write vsatp.MODE field = {x} and read back.
    expectation: write to vsatp with an unsupported MODE value is either ignored as it is for satp, or the fields of vsatp are treated as WARL in the normal way.
    bins: "{16 x} * 2 starting modes"
    id: vsatp_mode_unsupported_v0_param
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_satp_mode_field
    goal: supported/unsupported MODE encodings
    description: |-
      RV64 Only:
      Test Case: For x = {0...15} In VS-mode: First write satp with {Bare, Sv39}.  Then write satp.MODE field = {x} and read back.
    expectation: write to satp with an unsupported MODE value is ignored, so the old value is preserved
    bins: "{16 x} * 2 starting modes"
    id: vsatp_mode_unsupported_v1
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_vsatp_ppn_field
    goal: programmability of PPN field
    description: |-
      Environment: in HS mode, Set vsatp.MODE = Sv32 or Sv39.
      Test Case: Write all-zeros, all legal ones, and legal walking-ones to vsatp.PPN.
      Note: satp-ppn_sz_param defines # of legal bits
    expectation: PPN field retains patterns (at least for legal PPNs).
    bins: "{0s,1s,22 or 44 PPN walknig 1s}"
    id: vsatp-ppn_sz_param
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_vsatp_asidlen_detect
    goal: implemented ASID length
    description: |-
      Environment: Set vsatp.MODE vsatp.MODE Sv32 or Sv39.
      Test Case: Write 1s to all ASID bits, read back to determine implemented ASIDLEN.
    expectation: Only implemented bits writable; readback equals ASIDLEN.
    bins: "1"
    id: vsatp-asidlen
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_vsatp_mprv_effects
    goal: MPRV effects on address translation
    description: |-
      Environment: While in M-mode, set MPRV=1, mstatus.MPP={S,U}, mstatus.MPV=1, vsatp.MODE = Sv32 or Sv39, hgatp.MODE=BARE, satp.MODE=BARE, page table with no read/write permission.
      Test Case: Do load/store from M-mode. Instruction fetches unaffected, only data accesses translated (and throwing page fault).
    expectation: Data accesses translated via VS page tables, causing fault; instructions bypass and don't fault.
    bins: "{read,write} × {MPP=S,U}"
    id: |-
      mstatus_mprv_hypervisor, add tag to machine.adoc Instruction address-translation and protection are unaffected by the
      setting of MPRV.
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_vsatp_sum_effects
    goal: SUM=0 restriction and SUM=1 behavior
    description: |-
      Environment: Valid PTE.U=1. Set vsstatus.SUM={0,1}, mode=VS.
      Test Case: From VS, do read/write/exec. Test at leaf PTE with valid perms.
    expectation: Page fault raised for all access types for SUM=0. Read/write succeed; exec raises page fault for SUM=1.
    bins: "{read,write,exec}x{SUM=0,1}"
    id: norm:H_vscsrs_sub, add tag to supervisor instruction.adoc related to status.SUM & PTE.U
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: vsatp_sum_set
    goal: SUM=1 behavior
    description: |-
      Environment: Valid PTE.U=1. Set vsstatus.SUM=1, mode=VS.
      Test Case: From VS, do read/write/exec. Test at leaf PTE with valid perms.
    expectation: Read/write succeed; exec raises page fault.
    bins: "{read,write,exec}"
    id: H_vscsrs_sub, add tag to supervisor instruction.adoc related to status.SUM & PTE.U
    notes: "reviewed: y"
  - name: cp_vsatp_endianess
    goal: SBE endianness
    description: |-
      Environment: In VS mode, Set vsatp.MODE={Sv32 or Sv39}. Enable PTE perms.
      Test Case: Set hstatus.VSBE=0 (little), then hstatus.VSBE=1 (big). Do load/store.

      Notes: Ensure SFENCE.VMA after endian change.
    expectation: RW succeeds; endian swap affects data ordering.
    bins: "{SBE=0,SBE=1} × {read,write}"
    id: hstatus-vsbe_op
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_vsatp_pte_rsw
    goal: reserved RSW bits ignored
    description: |-
      Environment: Construct valid PTE with RSW set to {00,01,10,11}.
      Test Case: Write/read PTE.
    expectation: RSW reads as written
    bins: "{00,01,10,11}"
    id: H_vscsrs_sub, add tag to the supervisor instruction.adoc related to RSW set of PTE
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_vsatp_invalid_pte
    goal: invalid PTE behavior
    description: |-
      Environment: PTE.V=0, vsatp.MODE={Sv32 orSv39}.
      Test Case: Try read/write/exec VA.
    expectation: Page fault on all access types.
    bins: "{read,write,exec}"
    id: H_vscsrs_sub, add tag to the supervisor instruction.adoc related to PTE.V
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_vsatp_nonleaf_lvl0
    goal: non-leaf L0 PTE fault
    description: |-
      Environment: PTE at L0 with RWX=0.
      Test Case: read/write/exec VA.
    expectation: Page fault.
    bins: "{read,write,exec}"
    id: H_vscsrs_sub, add tag to the supervisor instruction.adoc related to non-leaf L0 PTE
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_vsatp_spages_sum_rwx
    goal: RWX on VS-mode pages, vsstaus.SUM=0
    description: |-
      Environment: PTE.U=0. vsstatus.SUM=0. RWX = {001, 011, 100, 101, 111} vsatp.MODE={Sv32 orSv39}
      Test Case: Do RWX accesses.
    expectation: Allowed if perms; else page fault.
    bins: "{read,write,exec} * 5 RWX"
    id: H_vscsrs_sub, add tag to supervisor instruction.adoc related to status.SUM & PTE.U
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_vsstatus_mxr_sum
    goal: MXR=0 on exec-only page
    description: |-
      Environment: RWX = {001, 111} PTE.U = {0/1}.  vsatp.MODE={Sv32 or Sv39}.
      Test Case: Do {read, write, exec} in {VS, VU}-mode with vsstatus.MXR={0,1}, vsstatus.SUM={0,1}
    expectation: Depends on case
    bins: "{read, write, exec} * 2 RWX * 2 U * 2 SUM * 2 MXR * 2 modes"
    id: vsstatus-mxr_vm
    rules:
      - The vsstatus field MXR, which makes execute-only pages readable by explicit loads, only overrides VS-stage page protection. Setting MXR at VS-level does not override guest-physical page protections.
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_vsatp_svpbmt
    goal: SVpbmt extension
    description: |-
      Environment: If  RV64 & !SVPBMT_SUPPORTED, PTE[62:61] = {0...3}
      Test Case: Access page
    expectation: Page fault if nonzero, else normal.
    bins: "{read,write,exec} * 4 PTE[62:61]"
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_vsatp_reserved_fields
    goal: reserved PTE bits
    description: |-
      Environment: RV64 & PTE[60:54]: Walking 1s, all 1s, all 0s
      Test Case: Access page
    expectation: Page fault if nonzero, else normal.
    bins: "{read,write,exec} * 9 values"
    id: H_vscsrs_sub, add tag to the supervisor instruction.adoc related to RSW set of PTE
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_hgatp_mode_field
    goal: supported/unsupported MODE encodings for hgatp
    description: |-
      "RV64 Only:
      Test Case: For x = {0...15} In HS-mode: First write hgatp with {Bare, Sv39x4}.  Then write hgatp.MODE field = {x} and read back. "
    expectation: Supported MODEs accepted and retained; unsupported encodings get WARL handling (fields may be masked/unchanged).
    bins: 2^4
    id: hgatp-mode_warl
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_hgatp_ppn_field
    goal: programmability of PPN in hgatp
    description: |-
      Environment: hgatp.MODE != Sv39x4 or Sv32x4.
      Test Case: Write patterns (all-0, all-1, walking-1) to hgatp.PPN, read back. For paged modes lowest two PPN bits read zero; root must be 16KiB-aligned for Sv*x4 modes.
    expectation: PPN retains written pattern within WARL constraints; PPN[1:0]=0 in paged modes.
    bins: |-
      2 + 44 (RV64) or
      2 + 22 (RV64)
    id: hgatp-ppn_op
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_hgatp_vmidlen_detect
    goal: implemented VMIDLEN via hgatp.VMID
    description: |-
      Environment: Set hgatp.MODE Sv32x4 or Sv39x4.
      Test Case: Write 1s to all VMID bits.
    expectation: Only implemented bits writable
    bins: "{RV32: 7, RV64:14}"
    id: hgatp-vmid_param
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_hgatp_tvm_effects
    goal: TVM gating on hgatp
    description: |-
      Environment: Set mstatus.TVM={0,1} in HS.
      Test Case: Attempt to write hgatp.
    expectation: Access to hgatp from HS cause illegal-instruction trap when TVM=1.
    bins: "{TVM=0,1}"
    id: hgatp_tvm_illegal
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_hgatp_mprv_effects
    goal: MPRV behavior when G-stage present
    description: |-
      Environment: While in M-mode, set MPRV={0/1}, mstatus.MPP/MPV={M, HS, VS, U, VU}, hgatp.MODE = Sv32x4 or Sv39x4, identity page table with no read/write permission.
      Test Case: Perform loads/stores and hypervisor load/store that should be translated by G-stage when MPV=1 & MPP in {S,U}. Notes: MPRV affects explicit memory accesses; HLV/HSV unaffected.
    expectation: When MPRV=1 and MPV=1, data accesses via basic load/store instructions translated via HS page tables, causing fault; instructions bypass and don't fault, HLV/HSV don't fault. When MPRV=0 or MPV=0, no faults.
    bins: 2 MPRV x 5 MPP/MPV x {lw,sw, hlv.w, hsv.w}
    id: mstatus_mprv_hypervisor
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_hgatp_gpa_width_checks
    goal: guest-physical address width limits
    description: |-
      RV64 Only
      Environment: In VS-mode, For each supported hgatp.MODE in {Sv39x4, Sv48x4, Sv57x4}, set up G-stage PTEs with walking 1s in GPA[63:37].  Then VS-stage kilopage PTE translates to some arbitrary valid address if possible.
      Test Case: Attempt accesses that require translating those GPAs. For Sv39x4 etc, ensure top bits canonicality rules apply to GPA.
    expectation: |-
      Sv39x4: guest page fault if GPA bits 63:41 are nonzero.
      Sv48x4: guest page fault if GPA bits 63:50 are nonzero.
      Sv57x4: guest page fault if GPA bits 63:50 are nonzero
    bins: up to 3 modes x (63-37) bits GPA
    id: H_vm_gpatrans
    notes: "reviewed: y"
  - name: cp_hgatp_perm_checks
    goal: G-stage permissions enforcement
    description: |-
      Environment: Create G-stage PTEs with URWX = {0111, 1111, 0000, 1000}.
      Test Case: From guest (VS/VU) perform accesses where VS-stage allows but G-stage denies. Access allowed only if both VS and G stage permit.
    expectation: Access blocked if G-stage denies; guest page fault raised with appropriate cause.
    bins: 2 modes * 4 URWX combinations
    id: H_vm_gpatrans
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: hgatp_pte_g_bit
    goal: PTE.G bit is reserved in G-stage PTEs
    description: |-
      Environment: Set G-stage PTE.G i(bit not used by Sv*x4).
      Test Case: Access GPA mapped by this PTE. It must be ignored by hardware..
    expectation: Normal.
    bins: "{read,write,exec}"
    id: H_vm_gpa_g
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_hgatp_svpbmt
    goal: Svpbmt extension in G-stage
    description: |-
      Environment: If  RV64 & !SVPBMT_SUPPORTED, G-stage PTE[62:61] = {0...3}
      Test Case: Access page
    expectation: Guest page fault if nonzero, else normal.
    bins: "{read,write,exec} * 4 PTE[62:61]"
    id: "*** US add rule"
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_hgatp_reserved_fields
    goal: reserved PTE bits in G-stage
    description: |-
      Environment: RV64 & G-stage PTE[60:54]: Walking 1s, all 1s, all 0s
      Test Case: Access page
    expectation: Guest page fault if nonzero, else normal.
    bins: "{read,write,exec} * 9 values"
    id: H_vm_gpatrans, add tag to the supervisor instruction.ado related to PTE.RSV bits
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_hgatp_pte_rsw
    goal: reserved RSW bits ignored
    description: |-
      Environment: Construct valid G-stage PTE with RSW set to {00,01,10,11}.
      Test Case: Access page
    expectation: Normal.
    bins: "{read,write,exec} * 4 PTE[9:8]"
    id: H_vm_gpatrans, add tag to the supervisor instruction.adoc related to RSW set of PTE
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_hgatp_invalid_pte
    goal: invalid PTE behavior
    description: |-
      Environment: G-stage PTE.V=0, hgatp.MODE={Sv32x4 or Sv39x4}.
      Test Case: Try read/write/exec VA.
    expectation: Guest page fault on all access types.
    bins: "{read,write,exec}"
    id: H_vm_gpatrans, add tag to the supervisor instruction.adoc related to PTE.V
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_hgatp_nonleaf_lvl0
    goal: non-leaf L0 PTE fault
    description: |-
      Environment: PTE at L0 with RWX=0.
      Test Case: read/write/exec VA.
    expectation: Guest page fault.
    bins: "{read,write,exec}"
    id: H_vm_gpatrans, add tag to the supervisor instruction.adoc related to non-leaf L0 PTE
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: hgatp_misaligned_superpage
    goal: misaligned superpage detection in G-stage
    description: |-
      Environment: Create G-stage superpage PTE with PPN low bits != 0 at given level.
      Test Case: Access mapped GPA.
    expectation: Page fault raised for misaligned superpage.
    bins: "{level-specific tests per mode}"
    id: H_vm_gpatrans, add tag to the supervisor instruction.adoc related to misaligned superpage
    notes: "reviewed: y"
  - name: cp_hgatp_vmid_scoping
    goal: implemented VMID length
    description: |-
      Environment: Set hgatp.MODE to Sv32 or Sv39.
      Test Case: Write 1s to all VMID bits, read back to determine implemented VMIDLEN.
    expectation: Only implemented bits writable; readback equals VMIDLEN.
    bins: "1"
    id: hgatp-vmid_param
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: hgatp_root_table_alignment_and_size
    goal: Validate root page table expansion and alignment for G-stage translation in Sv{32,39,48,57}x4 modes
    description: |-
      Environment: Set hgatp.MODE = {Sv32x4 or Sv39x4}. Configure G-stage root page table at both {4 KiB-,16 KiB-}aligned addresses.

      Test Case: Attempt to set hgatp.PPN such that root page table is only {4 KiB, 16KiB} aligned. Perform guest address translation to trigger G-stage walk.
    expectation: When root page table is not 16 KiB aligned, translation fails with guest page fault.
    bins: "{mode = 1 for HXLEN=32, 3 for HXLEN=64} × {4KiB aligned, 16 KiB aligned}"
    id: hgatp-mode_x4, hgatp-mode_sv32x4, hgatp-mode_sv39x4, hgatp-mode_sv48x4, hgatp-mode_sv57x4
    notes: "reviewed: y"
  - name: cp_hgatp_u_mode_access
    goal: Verify that all G-stage memory accesses are treated as U-mode accesses, including those made from VS-mode
    description: |-
      Environment: In HS-mode, Configure G-stage page tables, Mark a G-stage PTE with U=0 (not user-accessible). Set vsatp=BARE.

      Test Case: From VS-mode, makel access (e.g., load, store, and instruction fetch) that requires walking through this G-stage page table.
    expectation: Since G-stage accesses are treated as U-mode, a guest-page fault should occur due to lack of user access permission, even though access was from VS-mode.
    bins: "{access_type = inst_fetch, load, store} × {U-bit = 0, 1}"
    id: H_vm_gpapriv
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: cp_hgatp_adbit_behavior
    goal: Verify that A/D bits in G-stage PTEs are updated for implicit page table accesses (not the original access type)
    description: |-
      Environment: Configure a G-stage PTE with A=0, D=0. Configure VS-stage PTE with A=D={00, 11}. Do a sfence.vma to clear the TLB.
      Test Case: Trigger a VS-stage page table walk (load/store/fetch) so that the hardware implicitly performs memory accesses using that G-stage PTE to read VS-level PTEs.
    expectation: |-
      If Svade is supported and menvcfg.adue = 1, then the G-stage PTE should set A=1 because it is implicitly accessed.  If the VS-stage PTE had A=D=00, then those bits are set to 1, which causes an implicit write, which sets D=1 in the G-stage PTE.

      If Svade is not supported, then a {load/store/fetch} guest page fault occurs to update the G-stage PTE A/D bits.  The type of fault depends on the original access.  If VS-stage AD=00, there is also a regular page fault to update the VS-stage PTE A/D bits.
    bins: "{implicit_access = read, write} × {A/D bits before/after}"
    id: H_vm_gpapriv
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: hgatp_exception_reporting
    goal: Verify that G-stage page faults are reported with respect to the original access type
    description: |-
      Environment: Configure G-stage PTEs to deny R/W/X permissions. Perform VS-stage instruction fetch, load, and store operations that trigger G-stage translation faults.

      Test Case: Monitor the trap cause reported to HS-mode.
    expectation: Even though all G-stage accesses are treated as U-mode, the trap cause (e.g., instruction guest page fault, load guest page fault, store/AMO guest page fault) must match the original access type.
    bins: "{access_type = inst_fetch, load, store} × {permission_fault}"
    id: H_vm_gpapriv
  - name: cp_vsatp_perm_checks
    goal: VS-stage permissions enforcement
    description: |-
      Environment: Create VS-stage PTEs with URWX = {0111, 1111, 0000, 1000}.
      Test Case: From guest (VS/VU) perform accesses where G-stage allows but VS-stage denies. Access allowed only if both VS and G stage permit.
    expectation: Access blocked if VS-stage denies; page fault raised with appropriate cause.
    bins: 2 modes * 4 URWX combinations
    notes: |-
      reviewed: y
      coverpoint done: ✅ Done
  - name: two_stage_read
    goal: Verify two-stage read translation (GVA to GPA to SPA) across all page sizes
    description: |-
      Environment: In M-mode, initialize a known pattern in memory at a physical address (PA). Configure vsatp.MODE = {Sv32 or Sv39} with a non-identity VS page table mapping guest virtual addresses (GVAs) to guest physical addresses (GPAs), Configure hgatp.MODE = {Sv32x4 or Sv39x4} with a non-identity G-stage page table mapping GPAs to system physical addresses (SPAs). Ensure all PTEs are valid, readable. G stage accessible in U-mode and VS-stage accessible in S-mode.

      Test Case: Switch to VS-mode. Perform naturally aligned reads from GVAs that traverses both VS and G stages. Repeat for each supported page size ({4 KiB, 2 MiB, 1 GiB} or equivalent in Sv32/Sv39).
    expectation: The read value at GVA in VS-mode must match the initialized PA value in M-mode after GVA→GPA→SPA translation. No page faults or access faults should occur.
    bins: 3 VS-stage pages sizes x 3 G-stage page sizes
    id: hgatp-mode_x4, hgatp-mode_sv32x4, hgatp-mode_sv39x4, hgatp-mode_sv48x4, hgatp-mode_sv57x4
  - name: two_stage_write
    goal: Verify two-stage write translation and data propagation through both stages
    description: |-
      Environment: Same VS and G-stage mappings as the read test. Ensure G-stage and VS-stage PTEs are writable.  G stage accessible in U-mode and VS-stage accessible in S-mode.

      Test Case: In VS-mode, perform a store to a GVA mapped through both stages. Switch to M-mode and directly read from the corresponding PA (or SPA) to check for data integrity. Repeat for different page sizes ({4 KiB, 2 MiB, 1 GiB}).
    expectation: The data written in VS-mode must be visible when read from the same SPA in M-mode. No faults or misaligned accesses should occur.
    bins: 3 VS-stage pages sizes x 3 G-stage page sizes
    id: hgatp-mode_x4, hgatp-mode_sv32x4, hgatp-mode_sv39x4, hgatp-mode_sv48x4, hgatp-mode_sv57x4
  - name: two_stage_ifetch
    goal: Verify instruction fetch through two-stage translation (GVA, GPA, SPA) and interplay with MXR and X-permissions
    description: |-
      Environment: Setup executable code region at a known PA. Configure VS-stage page table with executable PTE mapping GVA to GPA. Configure G-stage page table mapping GPA to SPA with executable permission. Also create variations where VS or G-stage PTEs have only R=1, X=0 to test MXR behavior.  G stage accessible in U-mode and VS-stage accessible in S-mode. Repeat for different page sizes.

      Test Case: Jump to the GVA and execute an instruction. Repeat with MXR=0 and MXR=1 in {mstatus,hstatus}. Observe whether instruction fetches succeed or fault based on combined permissions.
    expectation: Instruction fetch should succeed only when both VS and G-stage PTEs permit execute or when MXR allows read-as-execute. If either stage denies execute, a guest instruction page fault should occur.
    bins: 3 VS-satge page sizes x 3 G-stage page sizes x (1 executable + 2 mstatus.MXR x 2 hstatus.MXR) x (2 VS-stage X vs R) x (2 G-stage X vs R) = 180
    id: hgatp-mode_x4, hgatp-mode_sv32x4, hgatp-mode_sv39x4, hgatp-mode_sv48x4, hgatp-mode_sv57x4
  - name: stage_both_bare
    goal: Validate direct VA to SPA mapping when both stages are Bare
    description: |-
      Environment: Set vsatp.MODE = Bare and hgatp.MODE = Bare. Disable all address translation stages.

      Test Case:  Access arbitrary virtual addresses (GVAs). Compare the physical address used by memory access (SPA) with the original VA.
    expectation: VA must be treated as SPA directly with no translation applied. No page walks or faults must occur.
    bins: "{vsatp.MODE = Bare, hgatp.MODE = Bare}"
    id: hgatp-mode_x4, hgatp-mode_sv32x4, hgatp-mode_sv39x4, hgatp-mode_sv48x4, hgatp-mode_sv57x4
