# yaml-language-server: $schema=testplan.schema.json
suite: Svade
source: https://docs.google.com/spreadsheets/d/1LGwD2e01j4SN9tg85nt6gPwpp7nXyXMF7hqbw3jvXko/edit?gid=119646056#gid=119646056
coverpoints:
  - heading: "General Test Environment (Svade):\n- T-SBI suite: boots to S-mode (BOOT_TO_SMODE) and drives the test from the boot identity map. The page under test is mapped at va_data. S-mode accesses run from the identity map. U-mode accesses use RVTEST_TSBI_GOTO_UMODE / RVTEST_TSBI_GOTO_SMODE; the handler moves execution to the U-accessible code alias va_rvtest_code_begin (registered with SAVE_AREA_SETUP) and back. menvcfg is written through T-SBI CSR calls. Page faults are delegated to S-mode, so causes are sampled from scause/stval.\n- menvcfg.ADUE (menvcfgh.ADUE on RV32) is cleared through T-SBI so A/D bits are not updated by hardware.\n- Run for every supported translation mode: Sv32 on RV32; Sv39, Sv48 and Sv57 on RV64, as selected by the UDB configuration."
  - name: Abit_unset_exec_s
    goal: Verify an instruction fetch through a PTE with A=0 raises an instruction page fault from S-mode (Svade)
    description: "S-mode: menvcfg.ADUE=0 (cleared through T-SBI). Leaf PTE with A=0 (with D=0 and D=1) and PTE.U=0, at every page-table level (4 KiB page and each superpage size of the Sv mode). Jump (jalr) into the page through va_data."
    expectation: Instruction page fault (scause = 12); stval = faulting virtual address.
    bins: |-
      PTE_Abit_unset_s_i x PageType_i x Svade_enabled x ins_page_fault x exec_acc x mode {S-mode}
      = 7 bins on RV64, 2 on RV32
    id: svade_access_ad_bit_clear Svadu_disabled_hw_update_falls_back_to_svade menvcfg_adue_op
    rules:
      - "[norm:svade_access_ad_bit_clear] [norm:Svadu_disabled_hw_update_falls_back_to_svade] [norm:menvcfg_adue_op]"
  - name: Abit_unset_exec_u
    goal: Verify an instruction fetch through a PTE with A=0 raises an instruction page fault from U-mode (Svade)
    description: "U-mode: menvcfg.ADUE=0 (cleared through T-SBI). Leaf PTE with A=0 (with D=0 and D=1) and PTE.U=1, at every page-table level (4 KiB page and each superpage size of the Sv mode). Jump (jalr) into the page through va_data."
    expectation: Instruction page fault (scause = 12); stval = faulting virtual address.
    bins: |-
      PTE_Abit_unset_u_i x PageType_i x Svade_enabled x ins_page_fault x exec_acc x mode {U-mode}
      = 7 bins on RV64, 2 on RV32
    id: svade_access_ad_bit_clear Svadu_disabled_hw_update_falls_back_to_svade menvcfg_adue_op
    rules:
      - "[norm:svade_access_ad_bit_clear] [norm:Svadu_disabled_hw_update_falls_back_to_svade] [norm:menvcfg_adue_op]"
  - name: Abit_unset_read_s
    goal: Verify a load through a PTE with A=0 raises a load page fault from S-mode (Svade)
    description: "S-mode: menvcfg.ADUE=0 (cleared through T-SBI). Leaf PTE with A=0 (with D=0 and D=1) and PTE.U=0, at every page-table level (4 KiB page and each superpage size of the Sv mode). Load (lw) from the page through va_data."
    expectation: Load page fault (scause = 13); stval = faulting virtual address.
    bins: |-
      PTE_Abit_unset_s_d x PageType_d x Svade_enabled x load_page_fault x read_acc x mode {S-mode}
      = 7 bins on RV64, 2 on RV32
    id: svade_access_ad_bit_clear Svadu_disabled_hw_update_falls_back_to_svade menvcfg_adue_op
    rules:
      - "[norm:svade_access_ad_bit_clear] [norm:Svadu_disabled_hw_update_falls_back_to_svade] [norm:menvcfg_adue_op]"
  - name: Abit_unset_read_u
    goal: Verify a load through a PTE with A=0 raises a load page fault from U-mode (Svade)
    description: "U-mode: menvcfg.ADUE=0 (cleared through T-SBI). Leaf PTE with A=0 (with D=0 and D=1) and PTE.U=1, at every page-table level (4 KiB page and each superpage size of the Sv mode). Load (lw) from the page through va_data."
    expectation: Load page fault (scause = 13); stval = faulting virtual address.
    bins: |-
      PTE_Abit_unset_u_d x PageType_d x Svade_enabled x load_page_fault x read_acc x mode {U-mode}
      = 7 bins on RV64, 2 on RV32
    id: svade_access_ad_bit_clear Svadu_disabled_hw_update_falls_back_to_svade menvcfg_adue_op
    rules:
      - "[norm:svade_access_ad_bit_clear] [norm:Svadu_disabled_hw_update_falls_back_to_svade] [norm:menvcfg_adue_op]"
  - name: Abit_unset_write_s
    goal: Verify a store through a PTE with A=0 raises a store/AMO page fault from S-mode (Svade)
    description: "S-mode: menvcfg.ADUE=0 (cleared through T-SBI). Leaf PTE with A=0 (with D=0 and D=1) and PTE.U=0, at every page-table level (4 KiB page and each superpage size of the Sv mode). Store (sw) to the page through va_data."
    expectation: Store/AMO page fault (scause = 15); stval = faulting virtual address.
    bins: |-
      PTE_Abit_unset_s_d x PageType_d x Svade_enabled x store_page_fault x write_acc x mode {S-mode}
      = 7 bins on RV64, 2 on RV32
    id: svade_access_ad_bit_clear Svadu_disabled_hw_update_falls_back_to_svade menvcfg_adue_op
    rules:
      - "[norm:svade_access_ad_bit_clear] [norm:Svadu_disabled_hw_update_falls_back_to_svade] [norm:menvcfg_adue_op]"
  - name: Abit_unset_write_u
    goal: Verify a store through a PTE with A=0 raises a store/AMO page fault from U-mode (Svade)
    description: "U-mode: menvcfg.ADUE=0 (cleared through T-SBI). Leaf PTE with A=0 (with D=0 and D=1) and PTE.U=1, at every page-table level (4 KiB page and each superpage size of the Sv mode). Store (sw) to the page through va_data."
    expectation: Store/AMO page fault (scause = 15); stval = faulting virtual address.
    bins: |-
      PTE_Abit_unset_u_d x PageType_d x Svade_enabled x store_page_fault x write_acc x mode {U-mode}
      = 7 bins on RV64, 2 on RV32
    id: svade_access_ad_bit_clear Svadu_disabled_hw_update_falls_back_to_svade menvcfg_adue_op
    rules:
      - "[norm:svade_access_ad_bit_clear] [norm:Svadu_disabled_hw_update_falls_back_to_svade] [norm:menvcfg_adue_op]"
  - name: Dbit_unset_write_s
    goal: Verify a store through a PTE with D=0 raises a store/AMO page fault from S-mode (Svade)
    description: "S-mode: menvcfg.ADUE=0. Leaf PTE with A=1, D=0 and PTE.U=0, at every page-table level (4 KiB page and each superpage size of the Sv mode). Store (sw) to the page; loads and fetches of the same page are also done."
    expectation: Store/AMO page fault (scause = 15); the load and fetch succeed.
    bins: |-
      PTE_Dbit_unset_s_d x PageType_d x Svade_enabled x store_page_fault x write_acc x mode {S-mode}
      = 7 bins on RV64, 2 on RV32
    id: svade_access_ad_bit_clear Svadu_disabled_hw_update_falls_back_to_svade menvcfg_adue_op
    rules:
      - "[norm:svade_access_ad_bit_clear] [norm:Svadu_disabled_hw_update_falls_back_to_svade] [norm:menvcfg_adue_op]"
  - name: Dbit_unset_write_u
    goal: Verify a store through a PTE with D=0 raises a store/AMO page fault from U-mode (Svade)
    description: "U-mode: menvcfg.ADUE=0. Leaf PTE with A=1, D=0 and PTE.U=1, at every page-table level (4 KiB page and each superpage size of the Sv mode). Store (sw) to the page; loads and fetches of the same page are also done."
    expectation: Store/AMO page fault (scause = 15); the load and fetch succeed.
    bins: |-
      PTE_Dbit_unset_u_d x PageType_d x Svade_enabled x store_page_fault x write_acc x mode {U-mode}
      = 7 bins on RV64, 2 on RV32
    id: svade_access_ad_bit_clear Svadu_disabled_hw_update_falls_back_to_svade menvcfg_adue_op
    rules:
      - "[norm:svade_access_ad_bit_clear] [norm:Svadu_disabled_hw_update_falls_back_to_svade] [norm:menvcfg_adue_op]"
