  - name: Sdtrig_tmexttrigger_inputs
    coverpoint:
      ["External trigger inputs are implementation-specific and unspecified"]

  # Hardware may support none or just a few TM external trigger inputs (starting
  # with TM external trigger input 0 and continuing sequentially).
  - name: Sdtrig_tmexttrigger_subset
    coverpoint:
      ["External trigger inputs are implementation-specific and unspecified"]

  # Unsupported inputs are hardwired to be inactive.
  - name: Sdtrig_tmexttrigger_unsupported
    coverpoint:
      ["External trigger inputs are implementation-specific and unspecified"]

  # If the trigger fires with action=0 then zero is written to the tval CSR on the
  # breakpoint trap.
  - name: Sdtrig_tmexttrigger_action0
    coverpoint:
      ["External trigger inputs are implementation-specific and unspecified"]

  # This trigger fires asynchronously but it is subject to delegation by medeleg[3]
  # like the other triggers.
  - name: Sdtrig_tmexttrigger_async
    coverpoint:
      ["External trigger inputs are implementation-specific and unspecified"]

