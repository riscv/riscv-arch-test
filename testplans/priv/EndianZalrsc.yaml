coverpoints:
  - name: cp_endianness_lrsc
    goal: Read from memory in an endian fashion
    description: Write 0x0102030405060708 to scratch.  For each endianness, lr.w from scratch and sc.w a different value back to scratch.  For RV64, also lr.d  and sc.d
    notes: |-
      restore endianness to normal afterward
      MBE
      when mstatus.MPRV=0
