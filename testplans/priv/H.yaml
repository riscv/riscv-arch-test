# yaml-language-server: $schema=testplan.schema.json
suite: H
source: https://docs.google.com/spreadsheets/d/1DWBEoprndjQzLTXQTzPI8jW1HydtkYRR3tg58q59fdk/edit?gid=262865576#gid=262865576
notes: |
  Definitions:
  Machine H-Extension CSRs: mtval2, mtinst
  HS H-Extension CSRs: hstatus, hedeleg, hideleg, hie, hcounteren, hgeie, henvcfg, htval, hip, hvip, htinst, hgatp, hgeip (+ htimedelta for Zicntr) (+ hedelegh, htimedeltah, henvcfgh for RV32)
  VS H-Extension CSRs: vsstatus, vsie, vstval,  vsip, vstvec, vsscratch, vsepc, vscause, vsatp (+ vstimecmp for SSTC, vstimecmph with RV32)
  High-half H-extension CSRs (RV32 only; illegal on RV64): hedelegh, htimedeltah, henvcfgh, vstimecmph
  S CSRs with VS replicas: sstatus, sie, stvec, sscratch, sepc, scause, stval, sip, satp
  S CSRs without VS replicas: scounteren, senvcfg, scountinhibit
  The suite boots to HS-mode, and the HS-mode handler takes traps from U, VS and VU (hedeleg = 0).  Tests that run in M-mode or need mstatus.TVM = 1 are in the Sm suite's Sm_H group.
  Each trap record holds xstatus[17:0] with hstatus.GVA/SPV/SPVP (mstatus.GVA/MPV in M-mode), and, for an M-mode or HS-mode exception, mtval2/htval and mtinst/htinst.
coverpoints:
  - heading: Tests executed in HS-mode (H_hscsr_cg)
  - name: |-
      cp_hcsr_access
      cp_hcsr_access_zero
      cp_hcsr_access_masked
      cp_hcsr_access_ro
    goal: All H-extension CSRs are able to read, write, set, and clear
    description: |-
      Write all 1s and all 0s, then set all bits, then clear all bits, then read each {HS/VS} H-Extension CSR.
      cp_hcsr_access_zero: htval, htinst, hgatp and vsatp need only hold zero, so their readback is checked only after writing 0 and after clearing every bit.  Every bit of hedelegh (RV32, Priv 1.13) is reserved, so cp_hcsr_access and cp_hcsrwalk check that each reads zero, as for medelegh in Sm.
      cp_hcsr_access_masked: hstatus and henvcfg (and henvcfgh on RV32) are written only with their checked fields, because the others are WLRL, WARL with reserved encodings, or change the endianness or XLEN.
      cp_hcsr_access_ro: hgeip is read-only.
      hedeleg bits 1-8, 12, 13 and 15 must be writable and 9-11, 16 and 20-23 read-only zero; bits 14 and 17 are not checked.  With Priv 1.13, writing all 1s also checks that bits 18 and 19 are writable; without Zca (IALIGN = 32), that bit 0 is writable.  hie.SGEIE is checked by InterruptsH, because it is writable only if GEILEN > 0.
    expectation: All registers are accessible, and checked fields read back as written. Writes to hgeip raise illegal instruction.
    bins: 5 * (14-17 + 9-11)
    rules:
      - hstatus_sz_acc_op
      - hedeleg_sz_acc
      - hideleg_sz_acc
      - hip_hie_sz_acc
      - htimedelta_sz_acc_op
      - hcounteren_sz
      - hgeie_sz_acc_op
      - henvcfg_sz_acc_op
      - htval_sz_acc_op
      - hvip_sz_op
      - htinst_sz_acc_op
      - hgatp_sz_acc_op
      - hgeip_sz_acc_op
      - hedelegh_sz_acc_op
      - htimedeltah_sz_acc_op
      - henvcfgh_sz_acc_op
      - vsstatus_sz_acc_op
      - vsip_vsie_sz_acc_op
      - vstval_sz_acc_op
      - vstvec_sz_acc_op
      - vsscratch_sz_acc_op
      - vsepc_sz_acc_op
      - vscause_sz_acc_op
      - vsatp_sz_acc_op
  - name: |-
      cp_hcsrwalk
      cp_hcsrwalk_masked
    goal: Exercise each bit of H-extension CSRs
    description: Set and clear each bit of each {HS/VS} H-Extension CSR that holds more than zero. hstatus is walked over GVA, SPV, SPVP, HU, VTVM, VTW and VTSR, and henvcfg over FIOM, LPE, SSE, CBIE, CBCFE, CBZE, PMM, ADUE, PBMTE and STCE (cp_hcsrwalk_masked); hstatus.VGEIN is in cp_hstatus_vgein, and VSXL and UXL are out of scope. vsstatus is walked with the sstatus fields that S checks. The CSRs of cp_hcsr_access_zero are not walked, and hgatp and vsatp are walked by cp_atpwalk1/0. vsepc and vstval are not walked, because an invalid address may legally be converted; cp_vsepc_vaddr_* and cp_vstval_vaddr_* write them with valid addresses.
    expectation: All registers are accessible.  Some fields are WARL and will not change.
    bins: 64 * 2 * (13-16 + 8-10)
    rules:
      - hedeleg_sz_acc
      - hideleg_sz_acc
      - hip_hie_sz_acc
      - htimedelta_sz_acc_op
      - hcounteren_sz
      - hgeie_sz_acc_op
      - henvcfg_sz_acc_op
      - hvip_sz_op
      - htimedeltah_sz_acc_op
      - henvcfgh_sz_acc_op
      - vsip_vsie_sz_acc_op
      - vstvec_sz_acc_op
      - vsscratch_sz_acc_op
  - name: |-
      cp_atpwalk1
      cp_atpwalk0
    goal: hgatp and vsatp hold each PPN, VMID and ASID bit
    description: With MODE = Sv39x4/Sv39 (RV64) or Sv32x4/Sv32 (RV32), write hgatp and vsatp with a walking 1 and a walking 0 through every non-MODE bit. MODE = Bare with nonzero fields is UNSPECIFIED and unsupported MODEs are legalized in an implementation-defined way, so MODE is held at a paged mode.
    expectation: Each bit reads back as written, except PPN bits at and above the physical address width, which are not checked, VMID and ASID bits above VMIDLEN and ASIDLEN, and hgatp.PPN[1:0], which may be read-only zero.
    bins: 2 CSRs * (60 (RV64) or 31 (RV32)) each
  - name: |-
      cp_vsepc_vaddr_walk1
      cp_vsepc_vaddr_walk0
      cp_vsepc_vaddr_pc
      cp_vsepc_vaddr_scratch
      cp_vstval_vaddr_walk1
      cp_vstval_vaddr_walk0
      cp_vstval_vaddr_pc
      cp_vstval_vaddr_scratch
    goal: vsepc and vstval hold every valid address
    description: In HS-mode, csrrw vsepc and vstval with each canonical virtual address with a walking 1 (0s in the msbs) and a walking 0 (1s in the msbs) through bits 0 to VALEN-2 of the largest supported Sv mode, and with two physical addresses, the current pc and the scratch area. Only valid addresses are written, because an invalid address may legally be converted.
    expectation: Each value reads back as written (vsepc bit 0 reads 0, and bit 1 reads 0 unless 2-byte instruction alignment is allowed).
    bins: |-
      walk1, walk0: 2 CSRs * (32 (Sv32), 38 (Sv39), 47 (Sv48) or 56 (Sv57)) each
      pc, scratch: 2 CSRs * 1 each
  - name: |-
      cp_vstval_zero
      cp_vstval_ilen_walk1
      cp_vstval_ilen_ones
    goal: vstval holds 0 and every ILEN-bit value
    description: In HS-mode, csrrw vstval with 0 and, when the illegal instruction encoding is reported in vstval (REPORT_ENCODING_IN_VSTVAL_ON_ILLEGAL_INSTRUCTION), with a walking 1 through bits 0 to 31 and with all 32 bits set, as cp_stval_zero, cp_stval_ilen_walk1 and cp_stval_ilen_ones in S.
    expectation: Each value reads back as written
    bins: 1 + 32 + 1
  - name: cp_replica
    goal: In HS, writing to S/VS-mode CSRs doesn't affect replica
    description: In HS-mode, write different random values into S-mode CSRs and their VS-mode replicas (satp and vsatp only when vsatp supports Sv39 (RV64) or Sv32 (RV32); satp always does), read both, write new random values, and read both back.
    expectation: Each CSR should have value written.
    bins: "9"
    rules:
      - H_vscsrs_v0
  - name: cp_hstatus_vgein
    goal: VGEIN can hold values between 0 and GEILEN
    description: Write {0, 1, GEILEN-1, GEILEN} to hstatus.VGEIN; only 0 when GEILEN = 0.  Larger values are WLRL, so they are not written.
    expectation: Each value reads back as written
    bins: 4 (1 with GEILEN = 0)
    rules:
      - hstatus_vgein_wlrl
  - heading: Tests executed in HS-mode (H_vscause_cg)
  - name: |-
      cp_vscause_write_exception
      cp_vscause_write_interrupt
    goal: vscause WLRL fields writable
    description: |-
      Write each exception code 0-31 with interrupt = 0 and each interrupt code 0-31 with interrupt = 1, and read back.
      Without Priv 1.12, only the codes that are defined in Priv 1.11.  Codes 32 and up are reserved or custom, so they are WLRL values that need not be held.
    expectation: Each value reads back as written
    bins: 32 exceptions + 32 interrupts (13 + 6 before Priv 1.12)
  - heading: Tests executed in VS-mode (H_vscsr_cg)
  - name: cp_csr_insufficient_priv
    goal: M-mode CSRs are inaccessible from VS-mode
    description: In VS-mode, attempt to read each CSR number in the M-mode ranges (0x300-0x3FF, 0x700-0x7FF except 0x7AA mscontext, 0xB00-0xBFF, 0xF00-0xFFF) with a nonzero rd, as S_scsr_cg/cp_csr_insufficient_priv in S-mode
    expectation: Illegal instruction fault, and rd is unchanged
    bins: 1023 CSRs
    rules:
      - Zicsr_illegal_mode
  - name: cp_hcsr_virtualinstructionfault
    goal: HS and VS registers cause virtual instruction fault from VS-mode
    description: csrrw, csrrc, csrrs, csrr each {HS/VS} H-Extension CSR
    expectation: Virtual instruction fault, or illegal instruction for an access that HS-mode could not perform (a write to hgeip)
    bins: 5 * (14-17 + 9-11)
    rules:
      - H_csrs_hs_not_vs
      - H_vscsrs_acc_vs
  - name: cp_illegalupper
    goal: In RV64, h half of CSRs are illegal.
    description: "RV64 ONLY: csrrw, csrrs, csrrc, csrr  each h H-extension CSR"
    expectation: Illegal instruction fault
    bins: 5 * 4
    notes: |-
      "When XLEN>32, an attempt to access a high-half CSR always raises an illegal-instruction exception."
      The other high-half addresses are accessed by SsstrictSm.
  - name: cp_replica
    goal: In VS, writing to S-mode CSRs affects replica instead
    description: In HS-mode, write different random values into S-mode CSRs and their VS-mode replicas.  Switch to VS-mode and write and readback S CSRs. Switch back to HS-mode and read back both the S-mode CSRs and VS replicas.  The return to HS-mode is a trap, which needs stvec and sscratch and rewrites sepc, scause and stval, so those S CSRs are left alone and only their replicas are checked.  satp and vsatp stay Bare, because the test code is not mapped.
    expectation: VS replica should have changed but S CSR does not change.
    bins: "9"
    rules:
      - H_vscsrs_v0
      - H_vscsrs_sub
  - name: cp_nonreplica
    goal: In VS, accessing nonreplicated S-mode CSRs behaves normally
    description: csrrw, csrrc, csrrs, csrr each S CSR without VS replica (scounteren, senvcfg).  scountinhibit is in cp_scountinhibit_vs.
    expectation: Normal access
    bins: 5 * 2
    rules:
      - H_scsrs_nomatch
  - name: cp_scountinhibit_vs
    goal: In VS, scountinhibit access depends on menvcfg.CDE
    description: "If Ssccfg is supported: csrrw, csrrc, csrrs, csrr scountinhibit in VS-mode with menvcfg.CDE = {0/1}.  The test currently runs only CDE = 0 (the boot value), because Sail does not implement menvcfg.CDE."
    expectation: Illegal instruction fault if CDE = 0, virtual instruction fault if CDE = 1
    bins: 5 * 2 CDE
  - heading: Tests executed in VS-mode (H_vsstatus_cg)
  - name: cp_vsstatus_sd_write
    goal: vsstatus.SD affected by vsstatus.FS/XS/VS
    description: In VS-mode, write sstatus (which accesses vsstatus) with the cross-product of SD, FS, XS and VS.
    expectation: vsstatus.SD = 1 if FS, XS or VS is nonzero
    bins: 2 * 4 * 4 * 4
  - heading: Tests executed in VU-mode (H_vucsr_cg)
  - name: cp_csr_insufficient_priv
    goal: CSRs other than user CSRs are inaccessible from VU-mode
    description: In VU-mode, attempt to read each CSR number that is not a user CSR (0x100-0x3FF, 0x500-0x7FF except 0x7AA mscontext, which may be accessible from S-mode, 0x900-0xBFF, 0xD00-0xFFF) with a nonzero rd, as U_ucsr_cg/cp_csr_insufficient_priv in U-mode.  U-mode accesses are covered by the U suite.
    expectation: Virtual instruction fault for an implemented supervisor, hypervisor or VS CSR whose access HS-mode could perform; otherwise illegal instruction fault.  rd is unchanged
    bins: 3071 CSRs
    rules:
      - H_vscsrs_acc_vs
      - Zicsr_illegal_mode
  - name: cp_csr_ro
    goal: User read-only CSRs cannot be written from VU-mode
    description: In VU-mode, attempt to write all 1s to each CSR number from 0xC00 to 0xCFF, as U_ucsr_cg/cp_csr_ro in U-mode
    expectation: Illegal instruction fault, and rd is unchanged
    bins: 256 CSRs
  - heading: Instructions (H_inst_cg)
  - name: cp_hlv
    goal: Basic load
    description: "Set up non-identity G and VS-stage page tables (Sv39x4 and Sv39, or Sv32x4 and Sv32). With hstatus.HU = 1, in {HS, U}: Write a value with the sign bit of every access size set to scratch. hlv.b, hlv.bu, hlv.h,  hlv.hu, hlv.w from scratch.  For rv64, also test hlv.wu, hlv.d.  Random source and destination registers."
    expectation: Read and sign/zero extend
    bins: 2 modes * 5 instr (7 on RV64)
  - name: cp_hlvx
    goal: Basic load
    description: "Set up non-identity G and VS-stage page tables. With hstatus.HU = 1, in {HS, U}: Write a value to scratch. hlvx.hu, hlvx.wu from scratch.  Random source and destination registers."
    expectation: Read and sign/zero extend
    bins: 2 modes * 2 instr
  - name: cp_hsv
    goal: Basic store
    description: "Set up non-identity G and VS-stage page tables. With hstatus.HU = 1, in {HS, U}: hsv.b, hsv.h, hsv.w to scratch, and read scratch through its physical address.  For rv64, also test hsv.d.  Random source and destination registers."
    expectation: Stores the low bytes of the source register
    bins: 2 modes * 3 instr (4 on RV64)
  - name: cp_guest_page_fault
    goal: hlv and hsv guest-page faults record htval and htinst
    description: In HS-mode with an empty G-stage root table, hlv.w and hsv.w with vsatp = Bare (a fault on the final translation) and with the VS-stage root table at an unmapped guest physical address (a fault on an implicit VS-stage access).
    expectation: Load or store guest-page fault into HS-mode. htval holds zero or the guest physical address >> 2. htinst holds zero or the transformed instruction on the final translation, and the pseudoinstruction on the implicit access when htval is nonzero.
    bins: 2 instr * 2 vsatp
  - name: cp_mret_illegal
    goal: mret unavailable below M mode
    description: Execute mret in {HS, VS, VU} modes.
    expectation: Illegal instruction
    bins: 3 modes
  - name: cp_sret_illegal
    goal: sret unavailable in VU mode
    description: Execute sret in VU mode.
    expectation: Virtual instruction
    bins: 1 mode
  - name: cp_hfence
    goal: Hypervisor fences execute only in HS-mode (and M-mode)
    description: With mstatus.TVM = 0 and hstatus.VTVM = 0, execute hfence.vvma and hfence.gvma (rs1 = rs2 = x0) in {HS, VS, VU, U} modes, as S_sprivinst_cg executes sfence.vma.  Sm_H_tvm_cg/cp_hfence crosses them with M-mode, mstatus.TVM and hstatus.VTVM, and SvH checks that they remove stale VS-stage and G-stage translations.
    expectation: Executes in HS-mode; virtual instruction in VS-mode and VU-mode; illegal instruction in U-mode
    bins: 4 modes * 2 instr
  - name: |-
      cp_vtvm_sfence
      cp_vtvm_satp
      cp_vtvm_hfence_vvma
    goal: hstatus.VTVM traps VS-mode sfence.vma and satp accesses, but not hfence.vvma
    description: With hstatus.VTVM = {0, 1}, execute hfence.vvma in HS-mode, and sfence.vma, csrr satp and csrw satp (writing zero, so vsatp stays Bare) in VS-mode.  sinval.vma is in Svinval, and mstatus.TVM, which needs M-mode, in Sm_H.
    expectation: With VTVM = 1, the VS-mode instructions raise virtual instruction; otherwise they execute.  hfence.vvma executes with either VTVM.
    bins: |-
      cp_vtvm_sfence: 2 VTVM
      cp_vtvm_satp: 2 accesses * 2 VTVM
      cp_vtvm_hfence_vvma: 2 VTVM
  - name: cp_sret_hs
    goal: sret from HS mode
    description: Execute sret in HS-mode with cross-product of sstatus.SPP / SPIE / hstatus.SPV.  After the sret, a read of mscratch traps to HS-mode, and the trap record shows the mode reached.  Then check sstatus.SPP, SIE, SPIE and hstatus.SPV in HS-mode; the trap and the return to HS-mode rewrite them from the mode and SIE that the sret produced.
    expectation: Goes to appropriate mode
    bins: 2 SPP * 2 SPIE * 2 SPV
  - name: cp_sret_vs
    goal: sret from VS mode
    description: Execute sret in VS-mode with cross-product of sstatus.SPP / SPIE  / hstatus.VTSR. After the sret, a read of mscratch traps and the trap record shows the mode reached. Then check sstatus.SPP, SIE, SPIE in VS-mode.
    expectation: Goes to appropriate mode, or virtual-instruction exception if VTSR=1.
    bins: 2 SPP * 2 SPIE * 2 VTSR
  - heading: "H_F tests (H_F-NN.S): the floating-point CSRs and vsstatus.FS from VS-mode and VU-mode, run when F is also supported."
  - name: cp_fcsr_access
    goal: |-
      Writing to the CSR field
      (WARL)
    description: Write 0s and 1s to fcsr, frm, fflags cross with vsstatus.FS init/clean/dirty
  - name: cp_vsstatus_FS_transition
    goal: |-
      Writing to the CSR field
      (WARL)
    description: Each different type of floating-point instruction crossed with four values of FS. Includes integer-result instructions that raise a flag after fflags is cleared (feq.s with a signaling NaN, fcvt.w.s of an inexact value, fcvt.wu.s of an out-of-range value, fcvtmod.w.d of a NaN).
    rules:
      - check FS becomes dirty where appropriate
      - instructions that set fflags must set FS to dirty even if they write no floating-point register
  - name: cp_vsstatus_FS_transition_nondeterministic
    goal: |-
      Writing to the CSR field
      (WARL)
    description: Floating-point instructions that need not modify floating-point state (fsw, fmv.x.w, fclass.s, csrr of the FP CSRs, fmvh.x.d) crossed with vsstatus.FS = Off and Dirty
    expectation: Illegal-instruction trap when FS = Off; FS stays Dirty when Dirty. Initial and Clean are omitted because these instructions may dirty FS imprecisely.
  - heading: "H_V tests (H_V_vcsr-NN.S, H_V_vset-NN.S, H_V_vl_walk-NN.S): the vector CSRs, vset{i}vl{i}, vstart and vsstatus.VS from VS-mode and VU-mode, run when Zve32x is also supported."
  - name: cp_vcsrrswc
    goal: Confirm that all vector CSR properties are properly set with regards to read write, clear, and set privileges with the csr instructions
    description: With each of the vector CSRs conduct a read, write, clear, and set operation on the CSR
    expectation: Will abide by spec's read and write permissions for each csr
    bins: 3 csr instructions * 7 CSRs
    notes: |-
      test written: yes
      spec: The vector extension adds 32 vector registers, and seven unprivileged CSRs (vstart, vxsat, vxrm, vcsr, vtype, vl, vlenb) to a base scalar RISC-V ISA.
      read-only CSR vlenb
      The XLEN-bit-wide read-only vl CSR can only be updated by the vset{i}vl{i} instructions, and the fault-only-first vector load instruction variants.
      read-only XLEN-wide vector type CSR, vtype provides the default type used to interpret the contents of the vector register file, and can only be updated by vset{i}vl{i}
  - name: cp_vcsrs_walking1s
    goal: Confirm that that all writable vector CSRs have the correct bits writeable
    description: With each of the vector CSRs that are writable, write all XLEN 1-hot values to the csr
    expectation: csrs will be updated based on which bits they support to be writable
    bins: 4 CSRs * XLEN 1-hot values
    notes: |-
      test written: yes
      spec: vstart, vxrm, vxsat, vcsr are all writable
  - name: cp_vsstatus_vs_set_dirty_arithmetic
    goal: Confirm that after running an arithmetic vector instruction that vsstatus.VS is set to dirty when set to "clean" or "initial"
    description: Run a .vv vector arithmetic instruction with vsstatus.VS = {clean, initial}
    expectation: vsstatus.VS is set to dirty
    bins: 2 vsstatus.VS bins
    notes: |-
      test written: yes
      spec: When mstatus.VS is set to Initial or Clean, executing any instruction that changes vector state, including the vector CSRs, will change mstatus.VS to Dirty.
  - name: cp_vsstatus_vs_set_dirty_csr
    goal: Confirm that after running a vsetvli instruction that vsstatus.VS is set to dirty when set to "clean" or "initial"
    description: Run a vsetvli instruction with vsstatus.VS = {clean, initial}
    expectation: vsstatus.VS is set to dirty
    bins: 2 vsstatus.VS bins
    notes: |-
      test written: yes
      spec: When mstatus.VS is set to Initial or Clean, executing any instruction that changes vector state, including the vector CSRs, will change mstatus.VS to Dirty.
  - description: Analogous to the way in which the floating-point unit is handled, the vsstatus.VS field may exist even if misa.V is clear.
    notes: "feature (coverpoint written): Untestable"
  - name: cp_vsstatus_vs_off_arithmetic
    goal: Confirm that when misa.V is 1 and vsstatus.VS is off, an arithmetic vector instruction raises an illegal instruction exception
    description: With misa.V = 1 (its reset value), set vsstatus.VS = {00} and run a .vv vector instruction
    expectation: illegal instruction exception
    bins: "1"
    notes: |-
      test written: yes, confirm sig
      spec: Attempts to execute any vector instruction, or to access the vector CSRs, raise an illegal-instruction exception when mstatus.VS is set to Off.
  - name: cp_vsstatus_vs_off_csr
    goal: Confirm that when misa.V is 1 and vsstatus.VS is off, an csr vector instruction raises an illegal instruction exception
    description: With misa.V = 1 (its reset value), set vsstatus.VS = {00} and run a vsetvli
    expectation: illegal instruction exception
    bins: "1"
    notes: |-
      test written: yes, confirm sig
      spec: Attempts to execute any vector instruction, or to access the vector CSRs, raise an illegal-instruction exception when mstatus.VS is set to Off.
  - description: For implementations with a writable misa.V field, the vsstatus.VS field may exist even if misa.V is clear.
    notes: "feature (coverpoint written): Untestable"
  - heading: Vset{i}vl{i}
  - name: cp_sew_lmul_vset_i_vli
    goal: Confirm that all combinations of lmul crossed with sew correctly set the vtype register in accordance with the vill field
    description: Use all vset{i}vli instructions to cross eSEW={8/16/32/64} with mLMUL = {f8/f4/f2/1/2/4/8} rd and uimm can be any nonzero value
    expectation: vtype.vill becomes 1 and other bits become 0 on illegal combinations, such as sew = 1xx.
    bins: 2 instructions * 7 lmul bins * 4 sew bins
    notes: |-
      test written: yes
      spec: Implementations must consider all bits of the vtype value to determine if the configuration is supported. An unsupported value in any location within the vtype value must result in vill being set. In particular, all XLEN bits of the register vtype argument to the vsetvl instruction must be checked. Implementations cannot ignore fields they do not implement. All bits must be checked to ensure that new code assuming unsupported vector features in vtype traps instead of executing incorrectly on an older implementation....The supported element width may vary with LMUL
      The use of vtype encodings with LMUL < SEWMIN/ELEN is reserved, but implementations can set vill if they do not support these configurations.
  - name: cp_sew_lmul_vsetvl
    goal: Confirm that all combinations of lmul crossed with sew correctly set the type register in accordance with the vill field
    description: |-
      Use vsetvl to cross rs2.sew= [3'b000:3'b011] with rs2.lmul = [000, 001, 010, 011, 101, 110, 111]. rd and uimm can be any nonzero value. Make sure rs2_val[`XLEN-1:8] = 0

      rs2 must be this way to be a legal setting
    expectation: vtype.vill becomes 1 and other bits become 0 on illegal combinations, such as sew = 1xx.
    bins: 7 lmul bins * 4 sew bins
    notes: |-
      test written: yes
      spec: Implementations must consider all bits of the vtype value to determine if the configuration is supported. An unsupported value in any location within the vtype value must result in vill being set. In particular, all XLEN bits of the register vtype argument to the vsetvl instruction must be checked. Implementations cannot ignore fields they do not implement. All bits must be checked to ensure that new code assuming unsupported vector features in vtype traps instead of executing incorrectly on an older implementation....The supported element width may vary with LMUL
      The use of vtype encodings with LMUL < SEWMIN/ELEN is reserved, but implementations can set vill if they do not support these configurations.
