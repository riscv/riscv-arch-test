# CI configuration for the XuanTie OpenC910

# Disabled: too slow for a GitHub runner. Run locally with `make c910-openc910`.
ci_enabled: false

# T-head-Semi/openc910 @ b91c909:
#   D, F           FMA does not raise UF for subnormal results under rup/rdn; fmin/fmax with one
#                  sNaN operand return the canonical NaN instead of the other operand.
#   ExceptionsF, ExceptionsS, ExceptionsSm, ExceptionsU, ExceptionsZc
#                  Load access fault from a bus error is imprecise: xepc points past the load.
#   ExceptionsSv, ExceptionsSvZalrsc
#                  Imprecise load access fault; a store to the error responder raises no fault.
#   ExceptionsZalrsc
#                  Misaligned LR raises mcause 6 instead of 4.
#   PMPSm          pmpaddr[8:0] reads as zero in NAPOT mode instead of all ones (G = 10).
#   PMPZalrsc      PMP-denied LR reports mcause 7 instead of 5.
#   Sm             Privileged 1.10: mret does not clear mstatus.MPRV; mstatus.MPP and mip bit 0
#                  WARL differences; MTIP not software-settable; mcycle wraparound; sip/mip
#                  shadow differs (mxstatus.CLINTEE gating, custom interrupts 16 and 17).
#   Sv             Hardware-written xtval is truncated to 40 bits; Sv39 SUM test fails at
#                  test1_exec.
#   SvPMP          PMP load violation on a PTE read reports mtval 0.
#   ZicntrS, ZicntrU
#                  minstret counts six more instructions across a trap than the reference.
exclude_extensions: "D,F,ExceptionsF,ExceptionsS,ExceptionsSm,ExceptionsSv,ExceptionsSvZalrsc,ExceptionsU,ExceptionsZalrsc,ExceptionsZc,PMPSm,PMPZalrsc,Sm,Sv,SvPMP,ZicntrS,ZicntrU"

apt_packages: "autoconf flex bison help2man libfl-dev libelf-dev ccache patch"
install_script: ".github/scripts/install-c910.sh"
setup_script: ".github/scripts/setup-c910.sh"
