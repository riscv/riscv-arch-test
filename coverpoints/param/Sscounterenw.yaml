# Parameter mappings for Sscounterenw
#
# Neither parameter is read by the generator. The walking signature comes from the
# reference model's scounteren legalization. The mhpmcounter self-check does not use them.

parameter_definitions:
  - name: SCOUNTENABLE_EN
    coverpoint: ["cp_scounteren_writable"]
    effect:
      - >-
        Expected results of the reference-model walk only. Sail validate_config requires
        scounteren_writable_bits to be a superset of writable_hpm_counters.
  - name: HPM_COUNTER_EN
    coverpoint: ["cp_scounteren_writable"]
    effect:
      - >-
        Expected results of the reference-model walk only. The self-check writes
        mhpmcounter and does not consult this list.
