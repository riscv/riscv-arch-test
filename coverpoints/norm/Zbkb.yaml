  - name: packh_op
    coverpoint: ["Zbkb_packh_cg/cr_rs1_rs2_edges"]

  - name: packw_enc
    coverpoint: ["Zbkb_packw_cg/cr_rs1_rs2_edges"]

  - name: packw_op
    coverpoint: ["Zbkb_packw_cg/cr_rs1_rs2_edges"]

  - name: brev8_enc
    coverpoint: ["Zbkb_brev8_cg/cp_rs1_edges"]

  - name: brev8_op
    coverpoint: ["Zbkb_brev8_cg/cp_rs1_edges"]

  - name: unzip_enc
    coverpoint: ["Zbkb_unzip_cg/cp_rs1_edges"]

  - name: unzip_op
    coverpoint: ["Zbkb_unzip_cg/cp_rs1_edges"]

  - name: zip_enc
