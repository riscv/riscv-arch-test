  - name: hfence-vvma_hfence-gvma_exceptions
    coverpoint:
      [
        "Exceptions_H_cg/cp_virtual_instr_vs_execute_hypervisor",
        "Exceptions_H_cg/cp_virtual_instr_vu_execute_h",
      ]

  # Field HU (Hypervisor in U-mode) controls whether the virtual-machine load/store
  # instructions, HLV, HLVX, and HSV, can be used also in U-mode. When HU=1, these
  # instructions can be executed in U-mode the same as in HS-mode. When HU=0, all
  # hypervisor instructions cause an illegal-instruction exception in U-mode.
  - name: hstatus_hu_op
    coverpoint:
      ["Exceptions_H_cg/cp_loadstore_priv", "Exceptions_H_cg/cp_priority"]

  # Attempts to execute one of these same instructions from U-mode when hstatus.HU=0 cause
