# yaml-language-server: $schema=testplan.schema.json
suite: ZicfilpSm
source: https://docs.google.com/spreadsheets/d/1ED9ontJZP-Dg2MAF-4mkhqKFgpjf6Fp6yeXKuW61FOY/edit?gid=2113591295#gid=2113591295
description: |
  In this sheet, all Zicfilp tests from the Zicfilp_Common sheet are
  executed in Machine Mode (M-mode).

  Environment:
  - Zicfilp extension enabled, Zicsr enabled.
  - Landing Pad Enabled (LPE) controlled by mseccfg.MLPE.
  - Tests execute in M-mode.

  Execution Notes:
  - All indirect branch instructions (JALR, C.JALR, C.JR) are exercised
    as in the Common sheet.
  - LPAD behavior, label matching, immediate encoding, and software-check
    exceptions are tested as per normative rules defined in the spec.
  - ELP state is observed via mstatus.MPELP (RV64) or mstatush.MPELP (RV32).
  - This sheet additionally covers M-mode specific trap entry and return
    coverpoints not present in other sheets:
      cp_elp_state_preservation_zicfilp
      cp_pelp_trap_entry_m_zicfilp
      cp_pelp_trap_entry_m_guarded_zicfilp
      cp_pelp_trap_return_m_zicfilp
  - All other assumptions, instruction types, and execution conditions
    are identical to the Zicfilp_Common sheet.

  Excluded (Debug testplan — separate file):
  - cp_elp_state_preservation_debug_zicfilp
  - cp_pelp_debug_mode_zicflip
  - cp_pelp_debug_mode_r_zicflip

  Excluded (Redundant — standard ISA traps already cover these):
  - cp_lpad_misaligned_address_exception_zicfilp
  - cp_lpad_alignment_exception_zicflip
coverpoints:
  - name: cp_elp_state_preservation_zicfilp
    goal: Verify M-mode trap saves and restores previous ELP using MPELP
    description: |-
      Test Environment:
      xLPE=1 in the origin mode and medeleg=0. Execute an indirect branch in S- or U-mode (rs1 != {x1,x5,x7}) to a non-LPAD instruction: the software-check exception is taken in M-mode with ELP=LP_EXPECTED.
      An ECALL cannot be used for the LP_EXPECTED case, because an ECALL at the target of an ELP-setting branch raises the software-check exception first. The ECALL back to M-mode covers the ELP=NO_LP_EXPECTED case.
    expectation: Trap is delivered to M-mode. Previous ELP value (LP_EXPECTED) is saved in mstatus.MPELP. After executing MRET, ELP is restored to LP_EXPECTED in the returning privilege mode
    bins: Origin mode (U/S) × Trap target (M-mode) × ELP states
    id: cfi_mstatus-mpelp_op
    rules:
      - "[norm:mstatus-mpelp_op]"
  - name: cp_pelp_trap_entry_m_zicfilp
    goal: Verify xPELP and ELP on trap entry to M-mode
    description: |-
      Test Environment:
      mseccfg.MLPE=1. Execute an ECALL in M-mode with ELP=NO_LP_EXPECTED (no Indirect_CT before it), followed by a non-LPAD instruction.
      The ELP=LP_EXPECTED case (software-check exception at a non-LPAD target) is covered by cp_zicfilp_lpad_label_exception_delivery.
    expectation: "On trap entry: mstatus.MPELP (mstatush.MPELP on RV32) = NO_LP_EXPECTED and ELP = NO_LP_EXPECTED. MRET therefore leaves ELP clear, so the non-LPAD instruction after the ECALL does not trap."
    bins: 1 (ECALL in M-mode with ELP=NO_LP_EXPECTED)
    id: Zicfilp_pelp_trap
    rules:
      - "[norm:Zicfilp_pelp_trap]"
  - name: cp_pelp_trap_entry_m_guarded_zicfilp
    goal: Verify xPELP and ELP on trap entry from software-guarded branch
    description: |-
      Test Environment:
      mseccfg.MLPE=1. Execute an Indirect_CT through x1, x5 and x7 in M-mode to an ECALL.
      No landing pad is required at the target, so the ECALL is taken instead of a software-check exception.
    expectation: "On trap entry: mstatus.MPELP = NO_LP_EXPECTED and ELP remains NO_LP_EXPECTED."
    bins: 3 rs1 registers {x1,x5,x7} x 3 Indirect_CT types (JALR, plus C.JR and C.JALR when Zca is implemented) = 3 + 6
    id: Zicfilp_pelp_trap
    rules:
      - "[norm:Zicfilp_pelp_trap]"
  - name: cp_pelp_trap_return_m_zicfilp
    goal: Verify behavior of return from trap via MRET
    description: |-
      Test Environment:
      In M-mode set mstatus.MPP to M, S or U, set mstatus.MPELP (mstatush.MPELP on RV32) to 0 or 1, set mepc to a non-LPAD instruction, and execute MRET.
      Sweep every combination of mseccfg.MLPE, menvcfg.LPE and senvcfg.LPE for each target mode.
      After an MRET to M-mode, read MPELP back.
    expectation: On MRET, ELP is set to MPELP if the xLPE of the mode being returned to is 1, otherwise NO_LP_EXPECTED. MPELP is set to NO_LP_EXPECTED. A software-check exception occurs only when MPELP=1 and the new mode's xLPE=1. MPELP read back after an MRET to M-mode is 0.
    bins: "3 target modes (M/S/U) x 8 (mseccfg.MLPE x menvcfg.LPE x senvcfg.LPE) x 2 MPELP = 48. Without S-mode: 2 target modes (M/U) x 4 (mseccfg.MLPE x menvcfg.LPE) x 2 = 16. M-mode only: 1 x 2 x 2 = 4."
    id: Zicfilp_pelp_trap_return
    rules:
      - "[norm:Zicfilp_pelp_trap_return]"
