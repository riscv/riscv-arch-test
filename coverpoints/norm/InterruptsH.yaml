# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # Register hvip is an HSXLEN-bit read/write register that a hypervisor can write to
  # indicate virtual interrupts intended for VS-mode. Bits of hvip that are not writable
  # are read-only zeros.
  - name: hvip_sz_op
    coverpoint: ["InterruptsH_hs_cg/cp_trigger_{vsei, vsti, vssi}"]
  # The standard portion (bits 15:0) of hvip is formatted as shown in . Bits VSEIP, VSTIP,
  # and VSSIP of hvip are writable. Setting VSEIP=1 in hvip asserts a VS-level external
  # interrupt; setting VSTIP asserts a VS-level timer interrupt; and setting VSSIP asserts
  # a VS-level software interrupt.
  - name: hvip_acc
    coverpoint: ["InterruptsH_hs_cg/cp_trigger_{vsei, vsti, vssi}"]
  # The hip register indicates pending VS-level and hypervisor-specific interrupts
  - name: hip_op
    coverpoint: ["InterruptsH_hs_cg/cp_trigger_{vsei, vsti, vssi}"]
  # hie contains enable bits for the same interrupts
  - name: hie_op
    coverpoint: ["InterruptsH_hs_cg/cp_trigger_{vsei, vsti, vssi}"]
  # An interrupt that has been delegated to HS-mode (using mideleg) is further delegated
  # to VS-mode if the corresponding hideleg bit is set.
  - name: hideleg_op
    coverpoint:
      [
        "InterruptsH_hs_cg/cp_trigger_{vsei, vsti, vssi}",
        "InterruptsH_hs_cg/cp_{hideleg_hip_vs, hideleg_hie_vs, hip_hie_vs, sie_vs}",
        "InterruptsH_hs_cg/cp_{hideleg_hip_vu, hideleg_hie_vu, hip_hie_vu}",
      ]
  # An interrupt i will trap to HS-mode whenever all of the following are true: (a) either
  # the current operating mode is HS-mode and the SIE bit in the sstatus register is set,
  # or the current operating mode has less privilege than HS-mode; (b) bit i is set in
  # both sip and sie, or in both hip and hie; and (c) bit i is not set in hideleg.
  - name: hideleg_hs
    coverpoint:
      [
        "InterruptsH_hs_cg/cp_trigger_{vsei, vsti, vssi}",
        "InterruptsH_hs_cg/cp_{hideleg_hip_vs, hideleg_hie_vs, hip_hie_vs, sie_vs}",
        "InterruptsH_hs_cg/cp_{hideleg_hip_vu, hideleg_hie_vu, hip_hie_vu}",
        "InterruptsH_hs_cg/cp_vsint_disabled_u",
      ]
  # Bits hip.VSEIP and hie.VSEIE are the interrupt-pending and interrupt-enable bits for
  # VS-level external interrupts. VSEIP is read-only in hip, and is the logical-OR of
  # these interrupt sources:
  - name: hip_vseip_vseie_op
    coverpoint: ["InterruptsH_hs_cg/cp_trigger_{vsei, vsti, vssi}"]
  # Bits csr:hip[vstip] and csr:hie[vstie] are the interrupt-pending and interrupt-enable
  # bits for VS-level timer interrupts.
  - name: hip_vstip_vstie_acc_op
    coverpoint:
      [
        "InterruptsH_hs_cg/cp_trigger_{vsei, vsti, vssi}",
        "InterruptsH_hs_cg/cp_trigger_vsti",
        "InterruptsH_hs_cg/cp_hip_write",
        "H_hscsr_cg/cp_hcsrwalk",
      ]
  # csr::[vstip] is read-only in csr:hip[], and is the logical-OR of csr:hvip[vstip] and,
  # when the ext:sstc[] extension is implemented, the timer interrupt signal resulting
  # from csr:vstimecmp[].
  - name: hip_vstip_acc
    coverpoint: ["InterruptsH_hs_cg/cp_trigger_{vsei, vsti, vssi}"]
  # Bits hip.VSSIP and hie.VSSIE are the interrupt-pending and interrupt-enable bits for
  # VS-level software interrupts. VSSIP in hip is an alias (writable) of the same bit in
  # hvip.
  - name: hip_vssip_vssie_op
    coverpoint:
      [
        "InterruptsH_hs_cg/cp_trigger_{vsei, vsti, vssi}",
        "InterruptsH_hs_cg/cp_hip_write",
      ]

  # If bit i of sie is read-only zero, the same bit in register hip may be writable or may
  # be read-only. When bit i in hip is writable, a pending interrupt i can be cleared by
  # writing 0 to this bit. If interrupt i can become pending in hip but bit i in hip is
  # read-only, then either the interrupt can be cleared by clearing bit i of hvip, or the
  # implementation must provide some other mechanism for clearing the pending interrupt
  # (which may involve a call to the execution environment).
  - name: hip_acc
    coverpoint: ["InterruptsH_hs_cg/cp_hip_write"]
  - name: hip_img
    coverpoint: ["InterruptsH_hs_cg/cp_hip_write"]

  # Simultaneous interrupts destined for HS-mode are taken in the order SEI, SSI, STI, SGEI, VSEI, VSSI, VSTI
  - names: [hsint_priority]
    coverpoint: ["InterruptsH_hs_cg/cp_priority_{en_vsi, deleg_vsi, s}"]

  # Bits SGEIP, VSEIP, VSTIP, and VSSIP in mip are aliases for the same bits in hypervisor
  # CSR hip, while SGEIE, VSEIE, VSTIE, and VSSIE in mie are aliases for the same bits in
  # hie.
  - name: mip_mie_alias
    coverpoint: ["InterruptsH_hs_cg/cp_{hie, hip, vsie, vsip, vsie_from_hie}"]
  # For each writable bit in sie, the corresponding bit shall be read-only zero in both
  # hip and hie. Hence, the nonzero bits in sie and hie are always mutually exclusive, and
  # likewise for sip and hip.
  - name: sie_hip_hie_mutex
    coverpoint: ["InterruptsH_hs_cg/cp_{hie, hip, vsie, vsip, vsie_from_hie}"]
  # The vsip and vsie registers are VSXLEN-bit read/write registers that are VS-mode’s
  # versions of supervisor CSRs sip and sie, formatted as shown in and respectively. When
  # V=1, vsip and vsie substitute for the usual sip and sie, so instructions that normally
  # read or modify sip/sie actually access vsip/vsie instead. However, interrupts directed
  # to HS-level continue to be indicated in the HS-level sip register, not in vsip, when
  # V=1.
  - name: vsip_vsie_sz_acc_op
    coverpoint:
      [
        "InterruptsH_hs_cg/cp_{hie, hip, vsie, vsip, vsie_from_hie}",
        "InterruptsH_hs_cg/cp_{hideleg_hip_vs, hideleg_hie_vs, hip_hie_vs, sie_vs}",
        "InterruptsH_hs_cg/cp_{hideleg_hip_vu, hideleg_hie_vu, hip_hie_vu}",
      ]
  # When bit 10 of hideleg is zero, vsip.SEIP and vsie.SEIE are read-only zeros. Else,
  # vsip.SEIP and vsie.SEIE are aliases of hip.VSEIP and hie.VSEIE.
  - name: vsip_vsie_sei
    coverpoint: ["InterruptsH_hs_cg/cp_{hie, hip, vsie, vsip, vsie_from_hie}"]
  # When bit 6 of hideleg is zero, vsip.STIP and vsie.STIE are read-only zeros. Else,
  # vsip.STIP and vsie.STIE are aliases of hip.VSTIP and hie.VSTIE.
  - name: vsip_vsie_sti
    coverpoint: ["InterruptsH_hs_cg/cp_{hie, hip, vsie, vsip, vsie_from_hie}"]
  # When bit 2 of hideleg is zero, vsip.SSIP and vsie.SSIE are read-only zeros. Else,
  # vsip.SSIP and vsie.SSIE are aliases of hip.VSSIP and hie.VSSIE.
  - name: vsip_vsie_ssi
    coverpoint: ["InterruptsH_hs_cg/cp_{hie, hip, vsie, vsip, vsie_from_hie}"]

  # Register hideleg is an HSXLEN-bit read/write register, formatted as shown in
  # &lt;&lt;norm:hideleg_img&gt;&gt;.
  - name: hideleg_sz_acc
    coverpoint: ["InterruptsH_hs_cg/cp_hideleg"]
  # Among bits 15:0 of hideleg, bits 10, 6, and 2 (corresponding to the standard VS-level
  # interrupts) are writable, and bits 12, 9, 5, and 1 (corresponding to the standard
  # S-level interrupts) are read-only zeros.
  - name: hideleg_acc
    coverpoint: ["InterruptsH_hs_cg/cp_hideleg"]
  - name: hideleg_img
    coverpoint: ["InterruptsH_hs_cg/cp_hideleg"]

  # hie.SGEIE is writable when guest external interrupts can become pending
  - names: [hie_acc, hie_img]
    coverpoint: ["InterruptsH_hs_cg/cp_hie_gilen"]

  # An interrupt writes zero to htinst
  - names: [H_trap_xtinst_interrupt, htinst_val]
    coverpoint: ["InterruptsH_hs_cg/cp_htinst"]

  # When a virtual supervisor external interrupt (code 10) is delegated to VS-mode, it is
  # automatically translated by the machine into a supervisor external interrupt (code 9)
  # for VS-mode, including the value written to vscause on an interrupt trap. Likewise, a
  # virtual supervisor timer interrupt (6) is translated into a supervisor timer interrupt
  # (5) for VS-mode, and a virtual supervisor software interrupt (2) is translated into a
  # supervisor software interrupt (1) for VS-mode.
  - name: hideleg_trans
    coverpoint:
      [
        "InterruptsH_hs_cg/cp_{hideleg_hip_vs, hideleg_hie_vs, hip_hie_vs, sie_vs}",
        "InterruptsH_hs_cg/cp_{hideleg_hip_vu, hideleg_hie_vu, hip_hie_vu}",
        "InterruptsH_hs_cg/cp_vsint_vectored",
      ]

  - name: vstvec_img
    coverpoint: ["InterruptsH_hs_cg/cp_vsint_vectored"]
  # The vstvec register is a VSXLEN-bit read/write register that is VS-mode’s version of
  # supervisor register stvec, formatted as shown in . When V=1, vstvec substitutes for
  # the usual stvec, so instructions that normally read or modify stvec actually access
  # vstvec instead. When V=0, vstvec does not directly affect the behavior of the machine.
  - name: vstvec_sz_acc_op
    coverpoint: ["InterruptsH_hs_cg/cp_vsint_vectored"]

  # Shlcofideleg makes hideleg bit 13 writable; while it is zero, vsip.LCOFIP and vsie.LCOFIE are read-only zero,
  # and otherwise they alias sip.LCOFIP and sie.LCOFIE
  - names: [vsip_vsie_lcofi]
    coverpoint:
      [
        "H_hscsr_cg/cp_hcsrwalk (vsie and vsip bit 13 read zero while hideleg bit 13 is zero)",
        "Not tested: Shlcofideleg, which UDB and the reference model do not describe",
      ]
