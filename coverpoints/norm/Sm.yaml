  # modifications to its associated configuration or address registers are ignored until a PMP
  # reset, unless mseccfg.RLB is set.
  - name: mseccfg_mml_shared_lrwx_1111_op
    coverpoint: ["TODO: Smepmp is not yet tested"]

  # Adding a rule with executable privileges that either is M-mode-only or a locked Shared-Region is
