  # ---------------- F/D ----------------
  # mstatus.FS is a normal two-bit field, forced to Dirty when an FP instruction writes:
  #   csr_bsc.sv#L1980
  HW_MSTATUS_FS_DIRTY_UPDATE: precise
  MSTATUS_FS_LEGAL_VALUES: [0, 1, 2, 3]
  # mstatus.VS is writable (it is in SMODE_STATUS_WRITE_MASK, def_pkg.sv#L115-L121) even
  # though the vector unit is not modelled in this configuration.
  MSTATUS_VS_LEGAL_VALUES: [0, 1, 2, 3]
  # ---------------- A ----------------
  # The HPDcache reserves the naturally aligned 8-byte word (hpdcache_uncached.sv#L285-L286;
  # Sail reservation_set_size_exp = 3).
  LRSC_RESERVATION_STRATEGY: "reserve exactly enough to cover the access"
  LRSC_FAIL_ON_VA_SYNONYM: false
  # A misaligned LR/SC raises the misaligned exception like any other access:
  # load_store_queue.sv#L203-L216 covers AMO/LR/SC through is_amo_store_or_cmo.
  LRSC_MISALIGNED_BEHAVIOR: "always raise misaligned exception"
  LRSC_FAIL_ON_NON_EXACT_LRSC: false
  # ---------------- Zawrs ----------------
  # WRS.NTO is not a no-op: with mstatus.TW = 1 below M-mode (or hstatus.VTW = 1 in VS-mode) it
  # raises illegal (virtual) instruction at once, i.e. its bounded time limit is zero:
  #   "end else if (insn_wrs_nto && mstatus_q.tw && (priv_lvl_q != riscv_pkg::PRIV_LVL_M)) begin"
  #   https://github.com/bsc-loca/csr/blob/40a00a0ed81e8323ddb2110b9d64e4b6e497fe69/rtl/csr_bsc.sv#L2917-L2930
  # Otherwise it sleeps until the reservation-lost input rises, which the tile ACT builds (without
  # HPDCACHE_OPENPITON) ties high ("`else .rs_lost_i(1'b1)", https://github.com/bsc-loca/core_tile/blob/1b9529b556b2fb88d73f1b76e790743572500efb/rtl/top_tile.sv#L411-L416),
  # so it retires at once.
  ZAWRS_NTO_IS_NOP: false
  # ---------------- Ssnpm/Supm ----------------
  # PMM = 2 (PMLEN 7) and PMM = 3 (PMLEN 16) are both implemented:
  #   "riscv_pkg::PMM_XLEN_57:  begin ... riscv_pkg::PMM_XLEN_48:  begin"
  #   https://github.com/bsc-loca/sargantana/blob/8db4398bd91a42e581c1ba83858d420ddfa6e923/rtl/datapath/rtl/exe_stage/rtl/load_store_queue.sv#L164-L181
  SUPPORTED_PMLEN_SSNPM: [0, 7, 16]
  # ---------------- CBO ----------------
  # "DCacheLineWidth: 512" (drac_pkg.sv#L1337) = 64 bytes.
  CACHE_BLOCK_SIZE: 64
  FORCE_UPGRADE_CBO_INVAL_TO_FLUSH: false
  # ---------------- Zicntr ----------------
  # csr_bsc.sv#L823: "riscv_pkg::CSR_TIME: begin csr_rdata = reg_time_q;"
  TIME_CSR_IMPLEMENTED: true
  # ---------------- S ----------------
  # "parameter ASID_WIDTH = drac_pkg::ASID_SIZE," (csr_bsc.sv#L27) with "parameter ASID_SIZE = 7;"
  #   https://github.com/bsc-loca/sargantana/blob/8db4398bd91a42e581c1ba83858d420ddfa6e923/includes/drac_pkg.sv#L149
  # satp.asid is masked to that width on write ("satp.asid = satp_temp.asid &
  # {{(16-ASID_WIDTH){1'b0}}, {ASID_WIDTH{1'b1}}};", csr_bsc.sv#L1371), and the TLB compares it
  # ("assign dtlb_comm_o.req.asid = ... csr_satp_asid_i[drac_pkg::ASID_SIZE-1:0];", load_store_queue.sv#L445).
  ASID_WIDTH: 7
  # "stvec_d     = {csr_wdata[63:2], 1'b0, csr_wdata[0]};
  #  // vectored mode (mode[0]=1) requires the same 64*4-byte base
  #  // alignment as mtvec; without this stvec accepts a base mtvec rejects
  #  if (csr_wdata[0]) stvec_d = {csr_wdata[63:8], 7'b0, csr_wdata[0]};"
  #   https://github.com/bsc-loca/csr/blob/40a00a0ed81e8323ddb2110b9d64e4b6e497fe69/rtl/csr_bsc.sv#L1338-L1343
  STVEC_MODES: [0, 1]
  STVEC_BASE_ALIGNMENT_VECTORED: 256
  # satp accepts only MODE 0 and MODE 8.
  SATP_MODE_BARE: true
  REPORT_VA_IN_STVAL_ON_BREAKPOINT: true
  REPORT_VA_IN_STVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_LOAD_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_PAGE_FAULT: true
  REPORT_ENCODING_IN_STVAL_ON_ILLEGAL_INSTRUCTION: true
  STVAL_WIDTH: 64
  # mie.SEIE/SSIE/STIE are writable (same mask, csr_bsc.sv#L1693-L1705), mideleg.SEI/SSI/STI
  # are writable ("mask = riscv_pkg::MIP_SSIP | riscv_pkg::MIP_STIP | riscv_pkg::MIP_SEIP | riscv_pkg::MIP_LCOFIP;",
  # https://github.com/bsc-loca/csr/blob/40a00a0ed81e8323ddb2110b9d64e4b6e497fe69/rtl/csr_bsc.sv#L1685-L1691),
  # and M-mode software can set mip.SEIP/SSIP, and mip.STIP while menvcfg.STCE = 0
  # ("| ((menvcfg_q[63] == 0) ? riscv_pkg::MIP_STIP : '0)", csr_bsc.sv#L1729-L1740); with STCE = 1,
  # STIP follows stimecmp (Sstc).  SEIP is also driven by the core's irq_i[1] input, which the
  # standalone testbench ties to zero (core_tile simulator/sim_top.sv#L298-L304).
  SEI_INTR_IMPL: true
  SSI_INTR_IMPL: true
  STI_INTR_IMPL: true
