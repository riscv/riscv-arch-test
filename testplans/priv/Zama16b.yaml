# yaml-language-server: $schema=testplan.schema.json
suite: Zama16b
source: https://docs.google.com/spreadsheets/d/10NX0T4MgueqA4p7JNg4whCq2k3YZ9R73UCV88MtcIUA/edit?gid=907997467#gid=907997467
coverpoints:
  - name: cp_zama16b_1byte
    goal: Misaligned accesses are atomic
    description: |-
      For each 1-byte op in {lb, lbu, sb} + {amoswap.b, amoadd.b, amoand.b, amoor.b, amoxor.b, amomax.b, amomaxu.b, amomin.b, amominu.b for Zabha}:
      Pick base address as multiple of 16
      Issue instruction with offsets of [0, 15]
    expectation: No address-misaligned fault
    bins: Up to 12 ops * 16 offsets
    rules:
      - Misaligned loads, stores, and AMOs to main memory regions that do not cross a naturally aligned 16-byte boundary are atomic.
  - name: cp_zama16b_2byte
    goal: Misaligned accesses are atomic
    description: |-
      For each 2-byte op in {lh, lhu, sh} + {flh, fsh for Zfh} + {amoswap.h, amoadd.h, amoand.h, amoor.h, amoxor.h, amomax.h, amomaxu.h, amomin.h, amominu.h for Zabha}:
      Pick base address as multiple of 16
      Issue instruction with offsets of [0, 14]
    expectation: No address-misaligned fault
    bins: Up to 14 ops * 15 offsets
    rules:
      - Misaligned loads, stores, and AMOs to main memory regions that do not cross a naturally aligned 16-byte boundary are atomic.
  - name: cp_zama16b_4byte
    goal: Misaligned accesses are atomic
    description: |-
      For each 4-byte op in {lw, sw} + {lwu for RV64} + {flw, fsw for F} + {amoswap.w, amoadd.w, amoand.w, amoor.w, amoxor.w, amomax.w, amomaxu.w, amomin.w, amominu.w for Zaamo} + {amocas.w for Zacas}:
      Pick base address as multiple of 16
      Issue instruction with offsets of [0, 12]
    expectation: No address-misaligned fault
    bins: Up to 15 ops * 13 offsets
    rules:
      - Misaligned loads, stores, and AMOs to main memory regions that do not cross a naturally aligned 16-byte boundary are atomic.
  - name: cp_zama16b_8byte
    goal: Misaligned accesses are atomic
    description: |-
      For each 8-byte op in {ld, sd for RV64} + {fld, fsd for D on RV64} + {amoswap.d, amoadd.d, amoand.d, amoor.d, amoxor.d, amomax.d, amomaxu.d, amomin.d, amominu.d for Zaamo on RV64} + {amocas.d for Zacas}:
      Pick base address as multiple of 16
      Issue instruction with offsets of [0, 8]
    expectation: No address-misaligned fault
    bins: Up to 14 ops * 9 offsets
    rules:
      - Misaligned loads, stores, and AMOs to main memory regions that do not cross a naturally aligned 16-byte boundary are atomic.
  - name: cp_zama16b_16byte
    goal: Misaligned accesses are atomic
    description: |-
      For each 16-byte op in {amocas.q for Zacas on RV64}:
      Pick base address as multiple of 16
      Issue instruction at offset 0 (the only offset that does not cross a 16-byte boundary)
    expectation: No address-misaligned fault
    bins: "1"
    rules:
      - Misaligned loads, stores, and AMOs to main memory regions that do not cross a naturally aligned 16-byte boundary are atomic.
  - heading: "Note:"
  - heading: This test only checks for no misaligned fault.  Multimaster testing will be required to verify atomicity.
  - heading: The misaligned atomicity granule applies only to F/D/Q loads and stores of at most XLEN bits, so flq/fsq (and fld/fsd on RV32) are not tested.
