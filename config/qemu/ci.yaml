# Jordan Carlin jcarlin@hmc.edu April 2026
# CI configuration for QEMU simulator
# Shared across all QEMU configs

ci_enabled: true
# Status as of QEMU v11.1.2, by test group (other groups of these suites pass).
exclude_extensions:
  # Multiple issues:
  #     menvcfg.CBIE can be written with reserved 0b10 QEMU #4216
  #     minstret one too high after wraparound (still fails with QEMU #4087 closed)
  #     mcycleh write dropped (#4219)
  #     mstatus.MPELP not writable (#4220)
  - Sm_mcsr_access
  - Sm_mcsr_cntr
  - Sm_mcsr_walk
  - Sm_shadow
  - Sm_xret
  # sie mismatches on bit 13 (LCOFIE) https://gitlab.com/qemu-project/qemu/-/work_items/3969;
  # QEMU accepts UXL=1, which Sail cannot model yet (https://github.com/riscv/sail-riscv/issues/1150)
  - S-
  - S_scsr-
  # qemu#4200, qemu#4201
  - Ssstrict_Sm_CSR
  - Ssstrict_Sm_IllegalInstr
  - Ssstrict_S_CSR
  - Ssstrict_S_IllegalInstr
  - Ssstrict_U_IllegalInstr
  # TODO: Remove SsstrictV when sail SsstrictV is implemented
  - SsstrictV
  # amocas with rd=x0 corrupts subsequent branch on x0 (https://gitlab.com/qemu-project/qemu/-/work_items/3526)
  - Zacas
  # https://gitlab.com/qemu-project/qemu/-/work_items/3969 seems to apply to mip.LCOFIP not writable either
  - InterruptsSm_enable
  - InterruptsSm_priority
  - InterruptsSm_trigger
  - InterruptsS_enable
  - InterruptsS_priority
  - InterruptsS_trigger
  # Interrupt WFI tests never enter VS/VU; the tests record SPV/MPV = 0, and InterruptsS_wfi_VS then waits in HS-mode
  # for a timer interrupt that SIE = 0 masks (https://gitlab.com/qemu-project/qemu/-/issues/4620)
  - InterruptsSm_wfi_VS
  - InterruptsSm_wfi_timeout_VS
  - InterruptsSm_wfi_timeout_VU
  - InterruptsS_wfi_VS
  - InterruptsS_wfi_timeout_VS
  - InterruptsS_wfi_timeout_VU
  # sc.w to no-permission region returns failure instead of raising
  # store/AMO access fault (https://gitlab.com/qemu-project/qemu/-/work_items/4100, still failing in v11.1.1)
  - Exceptions_Zalrsc
  - Sv_ExceptionsZalrsc
  - Sv_ExceptionsZalrscSm_sv32_exceptions
  - Sv_ExceptionsZalrscSm_sv39_exceptions
  # Zicbom CBOs skip PMA/PMP permission checks (https://gitlab.com/qemu-project/qemu/-/work_items/3501)
  - Exceptions_ZicboU
  - Exceptions_ZicboS
  - Exceptions_ZicboSm
  - Sv_Zicbo_sv32_zicbom
  - Sv_Zicbo_sv32_zicbop_Umode
  - Sv_Zicbo_sv32_zicboz_exceptions_Umode
  - Sv_Zicbo_sv39_zicbom
  - Sv_Zicbo_sv48_zicbom
  - Sv_Zicbo_sv57_zicbom
  # QEMU zama16b handling is incomplete: misaligned Zabha/Zacas AMOs fault,
  # but cross-granule word/doubleword AMOs execute instead of trapping
  # (https://gitlab.com/qemu-project/qemu/-/work_items/4101).
  - Exceptions_Zaamo
  - Zama16b
  # mstateen0 bits are writable for state the hart lacks: P1P13 on RV64 and on RV32 without H
  # (https://gitlab.com/qemu-project/qemu/-/work_items/4495), and ENVCFG, CSRIND, AIA and IMSIC without S
  # (https://gitlab.com/qemu-project/qemu/-/work_items/4655).
  - Smstateen
  # On RV64, reserved bit 63 of sstateen1-3 is writable while mstateenN bit 63 is set, but sstateen1-3 have no
  # defined bits and must read zero (https://gitlab.com/qemu-project/qemu/-/work_items/4726). Smstateen fails too.
  - Ssstateen
  # Fail on qemu due to stval mismatching, filed QEMU issue https://gitlab.com/qemu-project/qemu/-/work_items/4080
  - Zawrs_S
  - Zawrs_U
  # QEMU's trigger implementation has too many problems (tdata1 writes of 0 ignored, reserved types abort, icount
  # hangs: https://gitlab.com/qemu-project/qemu/-/work_items/4665); revisit when QEMU's Sdtrig matures.
  - SdtrigSm
  - SdtrigS
  - SdtrigU
  # mstatus.MPV and mstatus.GVA are read-only zero, so mret never enters VS/VU: a guest's
  # ecall is reported as cause 9/8 instead of 10, and a hypervisor CSR access from VS raises
  # an illegal instruction instead of a virtual instruction exception
  # (https://gitlab.com/qemu-project/qemu/-/issues/4620). QEMU has further hypervisor bugs
  # filed the same day, 4611 through 4617, so this exclusion will be needed for a while.
  - H
  - Exceptions_H
  - Exceptions_HSm
  # The same mstatus.MPV bug breaks the mret and mstatus.TVM tests, and every vsstatus bit is
  # writable (https://gitlab.com/qemu-project/qemu/-/work_items/4589).
  - Sm_H
  # mstatus.MPV is read-only, so no VS/VU-mode (https://gitlab.com/qemu-project/qemu/-/work_items/4588);
  # hlvx.wu raises the wrong fault (https://gitlab.com/qemu-project/qemu/-/work_items/4595)
  - Shtvala
  - Shvstvala
  # The same mstatus.MPV and GVA bug: traps from VS and VU report the wrong status
  # (https://gitlab.com/qemu-project/qemu/-/issues/4620).
  - Svinval_H
  - Svinval_SmH
  # The same mstatus.MPV bug keeps the VS-mode and VU-mode sweeps in HS-mode
  # (https://gitlab.com/qemu-project/qemu/-/work_items/4588).
  - Ssstrict_H
  # Runs in VS-mode and VU-mode, which QEMU never enters (see H above).
  - Ssnpm_H
  # With ADUE=1, QEMU sets A/D on a PTE with a reserved Svnapot encoding before raising the page fault
  # (https://gitlab.com/qemu-project/qemu/-/work_items/4636)
  - Svadu_sv39_Svadu_fault
  - Svadu_sv48_Svadu_fault
  - Svadu_sv57_Svadu_fault
  # QEMU CBOs do not fault on inaccessible addresses in bare mode, shifting trap signatures;
  # same issue as Exceptions_ZicboU/Exceptions_ZicboS and Sv_Zicbo (https://gitlab.com/qemu-project/qemu/-/work_items/3501).
  - Ssnpm_bare_pmm00_sweep
  - Ssnpm_bare_pmm10_sweep
  - Smmpm_pmm00_sweep
  - Smmpm_pmm10_sweep
  - Smnpm_S_bare_pmm00_sweep
  - Smnpm_S_bare_pmm10_sweep
  # On a store/AMO page fault from ssamoswap.w, QEMU writes a transformed instruction to htinst, but SSAMOSWAP
  # has no defined transformation, so it must be 0 (https://gitlab.com/qemu-project/qemu/-/work_items/4721).
  # The pmm00 sweeps fail only on this; the pmm10 sweeps also fail on the SSPUSH/SSPOPCHK bug below.
  - Ssnpm_sv39_pmm00_sweep
  - Ssnpm_sv48_pmm00_sweep
  - Ssnpm_sv57_pmm00_sweep
  - Smnpm_S_sv39_pmm00_sweep
  - Smnpm_S_sv48_pmm00_sweep
  - Smnpm_S_sv57_pmm00_sweep
  # SSPUSH and SSPOPCHK do not apply pointer masking to ssp, so a shadow-stack access through a tag that PMLEN
  # masks raises a store/AMO page fault (https://gitlab.com/qemu-project/qemu/-/work_items/4758). PMLEN = 16
  # masks every tag, so the pmm11 sweeps fail only on this.
  - Ssnpm_sv39_pmm10_sweep
  - Ssnpm_sv39_pmm11_sweep
  - Ssnpm_sv48_pmm10_sweep
  - Ssnpm_sv48_pmm11_sweep
  - Ssnpm_sv57_pmm10_sweep
  - Ssnpm_sv57_pmm11_sweep
  - Smnpm_S_sv39_pmm10_sweep
  - Smnpm_S_sv39_pmm11_sweep
  - Smnpm_S_sv48_pmm10_sweep
  - Smnpm_S_sv48_pmm11_sweep
  - Smnpm_S_sv57_pmm10_sweep
  - Smnpm_S_sv57_pmm11_sweep
  # Selected only on qemu-rv64-mu, where U-mode CBOs raise illegal-instruction without S-mode because QEMU also
  # requires senvcfg (https://gitlab.com/qemu-project/qemu/-/work_items/4596).
  - Smnpm_U
  # Fails on qemu because ecall, ebreak and illegal instruction increments minstret/instret. Filed QEMU issue: https://gitlab.com/qemu-project/qemu/-/work_items/4227
  # Also fails because minstret/instret overcounts by 1 for wfi with a pending or taken interrupt. Filed QEMU issue: https://gitlab.com/qemu-project/qemu/-/work_items/4230
  - Sm_Zicntr
  # RV32: mhpmevent[57:56] (WPRI) are writable (https://gitlab.com/qemu-project/qemu/-/work_items/4722).
  # The other Sscofpmf groups pass.
  - Sscofpmf_Sm_access
  # mie/sie drop LCOFIE and sip neither writes nor reads LCOFIP, so LCOFI is never taken
  # (https://gitlab.com/qemu-project/qemu/-/work_items/3969); on RV32 overflows are also lost
  # (https://gitlab.com/qemu-project/qemu/-/work_items/4723).
  - Sscofpmf_Sm_interrupt
  - Sscofpmf_S_interrupt
  - Sscofpmf_U_interrupt
  # Overflow needs 3969 fixed, and on RV32 also 4723 and
  # https://gitlab.com/qemu-project/qemu/-/work_items/4724 (mhpmcounterNh reads wrong).
  - Sscofpmf_Sm_overflow
  - Sscofpmf_S_overflow
  - Sscofpmf_U_overflow
  # An RV32 mstatus write clears mstatush.MPELP, so MRET does not restore ELP
  # (https://gitlab.com/qemu-project/qemu/-/work_items/4488), and mstatush.MPELP is not
  # writable (https://gitlab.com/qemu-project/qemu/-/work_items/4220).
  - Zicfilp_Sm
  # On RV32 a write to mstateen0 clears mstateen0h.ENVCFG
  # (https://gitlab.com/qemu-project/qemu/-/issues/4611). Boot writes mstateen0, so an
  # S-mode access to senvcfg then raises an illegal instruction (cause 2, xtval holding the
  # csrrc encoding) and the landing-pad tests diverge from the reference on senvcfg.LPE.
  # All three Zicfilp suites pass on qemu-rv64-max, but exclusions apply to every QEMU config.
  - Zicfilp_S
  - Zicfilp_U
  # Zicfiss_U, Zicfiss_S, Zicfiss_Sm excluded due to QEMU bugs:
  #  1. sspopchk raises a software-check exception where a store/AMO access fault must take priority
  #     (https://gitlab.com/qemu-project/qemu/-/work_items/4379)
  #  2. the M-mode SSAMOSWAP access fault leaves mtval=0, while QEMU's other store/AMO access faults
  #     report the address (REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT)
  #     (https://gitlab.com/qemu-project/qemu/-/work_items/4380)
  #  3. ssp bits [1:0] are writable (https://gitlab.com/qemu-project/qemu/-/issues/4621)
  #  4. sspush and ssamoswap write RW/RWX pages and page-fault on X/RX pages
  #     (https://gitlab.com/qemu-project/qemu/-/issues/4622)
  #  5. sspopchk from a PMP read-only region does not fault
  #     (https://gitlab.com/qemu-project/qemu/-/issues/4623)
  #  6. cbo.clean/flush/inval to a shadow stack page execute once the page is in the TLB
  #     (https://gitlab.com/qemu-project/qemu/-/issues/4624)
  #  7. SSPOPCHK with satp.MODE=Bare below M does not fault (https://gitlab.com/qemu-project/qemu/-/work_items/4432)
  #  8. senvcfg.SSE keeps 1 after menvcfg.SSE is cleared (https://gitlab.com/qemu-project/qemu/-/work_items/4224)
  #  9. on RV32, a write to mstateen0 clears mstateen0h.ENVCFG, so the S-mode senvcfg setup in Zicfiss_U and
  #     Zicfiss_S raises an illegal instruction (https://gitlab.com/qemu-project/qemu/-/issues/4611)
  #  10. SSAMOSWAP from M-mode with mstatus.MPRV=1, MPP=S raises a store/AMO access fault, and the xwr=010
  #     encoding is decoded with the current mode's SSE enable, so MPRV loads and U-mode accesses with
  #     senvcfg.SSE=0 page-fault on an SS page (Zicfiss_Sm; https://gitlab.com/qemu-project/qemu/-/work_items/4674)
  - Zicfiss_U
  - Zicfiss_S
  - Zicfiss_Sm
# qemu-rv32-mu, qemu-rv64-mu: U-mode cbo.zero/clean/flush/inval raise illegal-instruction without S-mode
#   because check_zicbo_envcfg() also requires senvcfg, which does not exist
#   (https://gitlab.com/qemu-project/qemu/-/work_items/4596)
# qemu-rv64-m, qemu-rv64-mu: mstatus.SXL/UXL read as 64-bit when S/U are not implemented
#   (https://gitlab.com/qemu-project/qemu/-/work_items/4456)
exclude_configs:
  - qemu-rv32-mu
  - qemu-rv64-m
  - qemu-rv64-mu
install_script: ".github/scripts/install-qemu.sh"
apt_packages: "libglib2.0-dev libfdt-dev libpixman-1-dev zlib1g-dev ninja-build"
shards: 1
config_shards:
  qemu-rv64-max: 2
  qemu-rv32-max: 2
  qemu-rv32-m: 2
