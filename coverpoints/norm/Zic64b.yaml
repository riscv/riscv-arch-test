# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # If the ext:zic64b[] extension is implemented, then cache blocks must be 64 bytes
  # in size, naturally aligned in the address space.
  - name: Zic64b_cache_block_size
    # cp_zic64b reads every byte of the block. The Sv and PMP crosses check the same
    # 64-byte extent on either side of a page or PMP boundary. cbo.clean/flush/inval
    # do not expose a block extent in the signature.
    coverpoint:
      [
        "Zic64b_cg/cp_zic64b",
        "Zic64b_cg/{cp_zic64b_sv_ok,cp_zic64b_sv_fault,cp_zic64b_pmp_fault}",
      ]
