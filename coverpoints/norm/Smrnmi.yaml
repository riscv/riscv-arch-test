normative_rule_definitions:
  # When the ext:smdbltrp[] extension is implemented, the insn:mnret[] instruction,
  # provided by the ext:smrnmi[] extension, sets the csr::[mdt] bit to 0 if the new
  # privilege mode is not M.
  - name: mstatus_mdt_clr_mnret
    coverpoint: [""]
  # If the ext:ssdbltrp[] extension is also implemented, and the new privilege mode is U,
  # VS, or VU, then csr:sstatus[sdt] is also set to 0.
  - name: sstatus_sdt_clr_mnret
    coverpoint: [""]

  # Additionally, if it is VU, then vsstatus.SDT is also set to 0.
  - name: vsstatus_sdt_clr_mnret
    coverpoint: ["TODO: MNRET to VU-mode with Smdbltrp, Ssdbltrp, and H"]

  # When the Smrnmi extension is implemented, a trap caused by an RNMI is not
  # considered an unexpected trap irrespective of the state of the MDT bit.
  - name: trap_unexp_rnmi
    coverpoint: [""]

  # a trap that occurs when executing in M-mode with mnstatus.NMIE set to 0 is an
  # unexpected trap.
  - name: trap_unexp_mnstatus_nmie_0
    coverpoint: [""]

  # In the event of a unexpected trap, the handling is as follows:
  - name: trap_unexp_hndl_lead_in
    coverpoint: [""]
  # When the Smrnmi extension is implemented and csr:mnstatus[nmie] is 1, the hart traps
  # to the RNMI interrupt trap handler. To deliver this trap, the csr:mnepc[] and
  # csr:mncause[] registers are written with the values that the unexpected trap would
  # have written to the csr:mepc[] and csr:mcause[] registers respectively. The privilege
  # mode information fields in the csr:mnstatus[] register are written to indicate M-mode
  # and its csr::[nmie] field is set to 0.
  - name: trap_unexp_hndl_rnmi
    coverpoint: [""]

  # When the ext:smrnmi[] extension is not implemented, or if the ext:smrnmi[] extension
  # is implemented and csr:mnstatus[nmie] is 0, the hart enters a critical-error state
  # without updating any architectural state, including the pc. This state involves
  # ceasing execution, disabling all interrupts (including NMIs), and asserting a
  # critical-error signal to the platform.
  - name: trap_unexp_hndl_no_rnmi
    coverpoint: [""]

  # The actions performed by the platform when a hart asserts a critical-error
  # signal are platform-specific. The range of possible actions include restarting
  # the affected hart or restarting the entire platform, among others.
  - name: critical_error
    coverpoint: [""]

  # Prior to writing mnepc, implementations may convert an invalid address into some
  # other invalid address that mnepc is capable of holding.
  - name: mnepc_invalid_convert
    # ["Sm_mcsr_cg/cp_mnepc_vaddr_walk1, Sm_mcsr_cg/cp_mnepc_vaddr_walk0"] once the Sail reference model supports Smrnmi
    coverpoint: [""]

  # If the Smrnmi extension is implemented, the mnstatus.NMIE field is reset to 0.
  - name: mnstatus_nmie_rst
    coverpoint: ["TODO: record mnstatus.NMIE before the boot code sets it"]
