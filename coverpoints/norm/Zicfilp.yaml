normative_rule_definitions:
  # The ext:zicfilp[] extension adds the csr::[spelp] and csr::[mpelp] fields that hold
  # the previous csr::[elp], and are updated as specified in
  # &lt;&lt;ZICFILP_FORWARD_TRAPS&gt;&gt;.
  - name: mstatus_spelp_mpelp_op
    coverpoint: [""]
  # To store the previous ELP state on trap delivery to S/HS-mode, an csr::[spelp] bit is
  # provided in the csr:mstatus[] CSR.
  - name: cfi_mstatus_spelp_op
    coverpoint: [""]
  # To store the previous ELP state on trap delivery to M-mode, an csr::[mpelp] bit is
  # provided in the csr:mstatus[] CSR.
  - name: cfi_mstatus_mpelp_op
    coverpoint: [""]

  # The x`PELP` fields are encoded as follows:
  - name: mstatus_spelp_mpelp_enc_lead_in
    coverpoint: [""]
  # 0 - NO_LP_EXPECTED - no landing pad instruction expected. 1 - LP_EXPECTED - a landing
  # pad instruction is expected.
  - name: mstatus_spelp_mpelp_enc_list
    coverpoint: [""]

  # Access to the SPELP field, added by Zicfilp, accesses the homonymous fields of mstatus
  # when V=0, and the homonymous fields of vsstatus when V=1.
  - name: sstatus_spelp
    coverpoint: [""]

  # The Zicfilp extension adds the LPE field in senvcfg. When the LPE field is set to 1,
  # the Zicfilp extension is enabled in VU/U-mode. When the LPE field is 0, the Zicfilp
  # extension is not enabled in VU/U-mode and the following rules apply to VU/U-mode:
  - name: senvcfg_lpe_Zicfilp
    coverpoint: [""]

  # Asynchronous interrupts.
  - name: Zicfilp_forward_trap_async_interrupt
    coverpoint: [""]
  # Synchronous exceptions with priority higher than that of a software-check exception
  # with xtval set to landing pad fault (code=2) (See &lt;&lt;norm:exc_priority&gt;&gt; of
  # Privileged Specification).
  - name: Zicfilp_forward_trap_async_exception
    coverpoint: [""]

  # The software-check exception caused by Zicfilp has higher priority than an
  # illegal-instruction exception but lower priority than instruction access-fault.
  - name: Zicfilp_exception_priority
    coverpoint: [""]

  # The software-check exception due to the instruction not being an LPAD
  # instruction when ELP is LP_EXPECTED or a software-check exception caused by the
  # LPAD instruction itself leads to a trap being delivered to the same or to a
  # higher privilege mode.
  - name: lpad_sw_exception
    coverpoint: [""]

  # The csr::[spelp] bit in mstatus can be accessed through the csr:sstatus[] CSR.
  - name: cfi_sstatus_spelp_op
    coverpoint: [""]

  # To store the previous ELP state on traps to VS-mode, a SPELP bit is defined in
  # the vsstatus (VS-modes version of sstatus).
  - name: vsstatus_spelp_exists
    coverpoint: [""]

  # To store the previous ELP state on transition to Debug Mode, a csr::[pelp] bit is
  # defined in the csr:dcsr[] register.
  - name: dcsr_pelp_op
    coverpoint: [""]
  # Upon entry into Debug Mode, the csr::[pelp] bit in csr:dcsr[] is updated with the ELP
  # at the privilege level the hart was previously in, and the ELP is set to
  # NO_LP_EXPECTED. When a hart resumes from Debug Mode, if the new privilege mode is y,
  # then ELP is set to the value of csr::[pelp] if yLPE (see ) is 1; otherwise, it is set
  # to NO_LP_EXPECTED.
  - name: Zicfilp_pelp_debug_mode
    coverpoint: [""]

  # When a trap is taken into privilege mode x, the xPELP is set to ELP and ELP is
  # set to NO_LP_EXPECTED.
  - name: Zicfilp_pelp_trap
    coverpoint: [""]

  # An MRET or SRET instruction is used to return from a trap in M-mode or S-mode,
  # respectively. When executing an xRET instruction, if the new privilege mode is
  # y, then ELP is set to the value of xPELP if yLPE (see ) is 1; otherwise, it is
  # set to NO_LP_EXPECTED; xPELP is set to NO_LP_EXPECTED.
  - name: Zicfilp_pelp_trap_return
    coverpoint: [""]

  # On a trap caused by a software-check exception, the stval register holds the
  # cause for the exception. The following encodings are defined:
  - name: stval_exception_info
    coverpoint:
      ["TODO: Zicfilp and Zicfiss should both cause exceptions and read xtval"]
