# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # In Sv39, Sv48, and Sv57, bits 62-61 of a leaf page table entry indicate the use of
  # page-based memory types that override the PMA(s) for the associated memory pages.
  - name: Svpbmt_pte_bits
    # Representative coverpoints; also leaf_PTE_pbmt_{exec,write}_u
    coverpoint:
      [
        "Svpbmt_cg/{leaf_PTE_pbmt_exec_s, leaf_PTE_pbmt_read_s, leaf_PTE_pbmt_write_s, leaf_PTE_pbmt_read_u}",
      ]

  # The Svpbmt extension depends on the Sv39 extension
  - name: Svpbmt_depends_Sv39
    coverpoint:
      [
        "Configuration requirement: Svpbmt requires Sv39, directly or through Sv48/Sv57; checked by UDB (https://github.com/riscv/riscv-unified-db/blob/25c483067a6575b7c9592094b13cc0c9d0c75bab/spec/std/isa/ext/Svpbmt.yaml#L18[Svpbmt.requirements], https://github.com/riscv/riscv-unified-db/blob/25c483067a6575b7c9592094b13cc0c9d0c75bab/spec/std/isa/ext/Sv48.yaml#L16[Sv48.requirements], https://github.com/riscv/riscv-unified-db/blob/25c483067a6575b7c9592094b13cc0c9d0c75bab/spec/std/isa/ext/Sv57.yaml#L16[Sv57.requirements]).",
      ]

  # Mode|Value|Requested Memory Attributes === PMA NC IO -|0 1 2 3|None Non-cacheable,
  # idempotent, weakly-ordered (RVWMO), main memory Non-cacheable, non-idempotent,
  # strongly-ordered (I/O ordering), I/O Reserved for future standard use ===
  - name: Svpbmt_enc_tbl
    # Representative coverpoints; also the other leaf_PTE_pbmt_{exec,read,write}_{s,u} and leaf_PTE_pbmt_reserved_enc_{exec,read,write}_{s,u}
    coverpoint:
      [
        "Svpbmt_cg/{leaf_PTE_pbmt_read_s, leaf_PTE_pbmt_write_u, leaf_PTE_pbmt_reserved_enc_read_s, leaf_PTE_pbmt_reserved_enc_exec_u}",
      ]

  # Until their use is defined by a standard extension, they must be cleared by software
  # for forward compatibility, or else a page-fault exception is raised.
  - name: Svpbmt_nonleaf_pte_pbmt_must_be_zero
    # Representative coverpoints; also nonleaf_PTE_pbmt_{exec,write}_u
    coverpoint:
      [
        "Svpbmt_cg/{nonleaf_PTE_pbmt_exec_s, nonleaf_PTE_pbmt_read_s, nonleaf_PTE_pbmt_write_s, nonleaf_PTE_pbmt_read_u}",
      ]

  # Until this value is defined by a standard extension, using this reserved value in a
  # leaf PTE raises a page-fault exception.
  - name: Svpbmt_leaf_pte_pbmt_reserved_3_fault
    # Representative coverpoints; also leaf_PTE_pbmt_reserved_enc_{exec,write}_u
    coverpoint:
      [
        "Svpbmt_cg/{leaf_PTE_pbmt_reserved_enc_exec_s, leaf_PTE_pbmt_reserved_enc_read_s, leaf_PTE_pbmt_reserved_enc_write_s, leaf_PTE_pbmt_reserved_enc_read_u}",
      ]

  # The PBMTE bit controls whether the Svpbmt extension is available for use in S-mode
  # and G-stage address translation (i.e., for page tables pointed to by satp or hgatp).
  # When PBMTE=1, Svpbmt is available for S-mode and G-stage address translation. When
  # PBMTE=0, the implementation behaves as though Svpbmt were not implemented.
  - name: menvcfg_pbmte_op
    coverpoint:
      [
        "Svpbmt_cg/PBMTE_set",
        "Sv_add_feature_cg/cp_svpbmt_{read,write,exec}_fault",
      ]

  # After changing menvcfg.PBMTE, executing an SFENCE.VMA instruction with rs1=x0 and
  # rs2=x0 suffices to synchronize address-translation caches with respect to the
  # altered interpretation of page-table entries' PBMT fields.
  - name: menvcfg_pbmte_fence
    coverpoint: ["Svpbmt_cg/PBMTE_set"]

  # If Svpbmt is not implemented, PBMTE is read-only zero.
  # On a configuration without Svpbmt, the Sm menvcfg walk checks that bit 62 (menvcfgh bit 30 on RV32) reads 0.
  - name: menvcfg_pbmte_rdonly0
    coverpoint: ["Sm_mcsr_cg/cp_mcsrwalk_masked/menvcfg"]

  # Implementations may override additional PMAs not explicitly listed in <<pbmt>>.
  - name: Svpbmt_impl_may_override_pmas
    coverpoint:
      [
        "No independent assertion: permits additional implementation-defined PMA overrides; it does not require an override to occur.",
      ]

  # memory accesses to such pages obey the memory ordering rules of the final effective
  # attribute,
  - name: Svpbmt_obeys_mem_ordering
    coverpoint:
      [
        "Needs infrastructure: RAM mapped with PBMT=IO or PBMT=NC supplies the effective attributes; concurrent harts or an access monitor are needed to check ordering. I/O-to-memory overrides also need a physical I/O region.",
      ]
  - name: Svpbmt_io_pma_nc_pbmt_obey_rvwmo
    coverpoint:
      [
        "Needs infrastructure: a physical I/O region mapped with PBMT=NC and concurrent harts or an access monitor; RAM mapped with PBMT=IO does not exercise this underlying-I/O case.",
      ]
  - name: Svpbmt_io_pma_nc_pbmt_treated_as_io_and_memory
    coverpoint:
      [
        "Needs infrastructure: a physical I/O region mapped with PBMT=NC and observation of FENCE/aq/rl ordering in both domains; PBMT=IO mappings of RAM do not exercise this case.",
      ]
  - name: Svpbmt_memory_pma_io_pbmt_strong_io_ordering
    coverpoint:
      [
        "Needs infrastructure: PBMT=IO mappings of RAM supply channel 0 I/O attributes; concurrent harts or an access monitor are needed to observe ordering violations.",
      ]
  - name: Svpbmt_memory_pma_io_pbmt_treated_as_io_and_memory
    coverpoint:
      [
        "Needs infrastructure: PBMT=IO mappings of RAM and concurrent harts or an access monitor to check that FENCE/aq/rl treat these accesses as both memory and I/O.",
      ]
  - name: Svpbmt_aliasing_attribute
    coverpoint:
      [
        "No independent assertion: this clause permits loss of ordering or coherence under conflicting aliases; it does not require such loss to occur.",
      ]
  - name: Svpbmt_noncacheable_aliasing_no_coherence_loss
    coverpoint:
      [
        "Needs infrastructure: PBMT=NC and PBMT=IO aliases of the same RAM, with concurrent harts or a coherence monitor; no physical I/O device is needed for this case.",
      ]
  - name: Svpbmt_noncacheable_aliasing_may_weaken_ordering
    coverpoint:
      [
        "No independent assertion: this clause permits loss of ordering or coherence under conflicting aliases; it does not require such loss to occur.",
      ]
  - name: Svpbmt_noncacheable_aliasing_fence_prevents_ordering_loss
    coverpoint:
      [
        "Needs infrastructure: PBMT=NC and PBMT=IO aliases of the same RAM, with concurrent harts or an access monitor to check ordering across the prescribed FENCE sequence.",
      ]
  - name: Svpbmt_cacheable_aliasing_may_cause_coherence_loss
    coverpoint:
      [
        "No independent assertion: this clause permits loss of ordering or coherence under conflicting aliases; it does not require such loss to occur.",
      ]
  - name: Svpbmt_cacheable_aliasing_fence_flush_fence_required
    coverpoint:
      [
        "Needs infrastructure: cacheable and non-cacheable PBMT aliases of the same RAM, with concurrent harts or a memory/cache-access monitor to check the FENCE/CBO.FLUSH/FENCE sequence.",
      ]

  # if hgatp.MODE is not equal to zero, non-zero G-stage PTE PBMT bits override the
  # attributes in the PMA to produce an intermediate set of attributes.
  - names: [Svpbmt_hgatp_stage_override_rule, Svpbmt_vsatp_stage_override_rule]
    coverpoint: ["Svpbmt_H_cg/{cp_vsatp_pbmt,cp_hgatp_pbmt}"]

  - name: menvcfg_pbmte_henvcfg_pbmte_rdonly0
    coverpoint: ["Svpbmt_H_cg/cp_henvcfg_menvcfg"]
