# Mapping of normative rules to coverpoints for a test suite
#
# Zvbb exercises the vector bit-manipulation extension. General vector-crypto-wide
# normative rules (data-independent timing, EGS/EGW/vl/vstart constraints shared across
# all Zvk* extensions) are homed in Zvkb.yaml; the entries below are specific to Zvbb's
# own instructions (vandn, vbrev, vbrev8, vclz, vcpop, vctz, vrev8, vrol, vror, vwsll).
# Zvkb reuses several of these same instructions (vandn, vbrev8, vrev8, vrol, vror) under
# its own extension gate; their _op rules are not duplicated in Zvkb.yaml.

normative_rule_definitions:
  # ext:zvbb[] depends upon the ext:zve32x[] extension.
  - name: Zvbb_dependent_Zve32x
    coverpoint: ["Definition, checked through UDB"]

  # ext:zvbb[] provides support for EEW of 8, 16, and 32. If ext:zve64x[] is supported then
  # ext:zvbb[] also adds support for EEW=64.
  - name: Zvbb_eew
    # Representative coverpoints; cp_asm_count in every Zvbb8, Zvbb16 and Zvbb32 covergroup
    coverpoint:
      [
        "Zvbb8_vclz_v_cg/cp_asm_count",
        "Zvbb16_vclz_v_cg/cp_asm_count",
        "Zvbb32_vclz_v_cg/cp_asm_count",
      ]

  # Each bit of Op1 is inverted and logically ANDed with the corresponding bits in vs2.
  - name: vandn_op
    coverpoint: ["Zvbb16_vandn_vv_cg/cp_vd"]

  # In the vector-scalar version, Op1 is the sign-extended or truncated value in scalar
  # register rs1.
  - name: vandn-vx_rs1
    coverpoint: ["Zvbb16_vandn_vx_cg/cp_rs1_edges"]

  # In the vector-vector version, Op1 is vs1.
  - name: vandn-vv_vs1
    coverpoint: ["Zvbb16_vandn_vv_cg/cp_vs1"]

  # A bit reversal is performed on the bits of each element.
  - name: vbrev-v_op
    coverpoint:
      [
        "Zvbb8_vbrev_v_cg/cp_vs2_edges",
        "Zvbb8_vbrev_v_cg/cr_vl_lmul_sew8",
        "Zvbb64_vbrev_v_cg/cp_vs2_edges",
        "Zvbb64_vbrev_v_cg/cr_vl_lmul_sew64",
      ]

  # A bit reversal is performed on the bits of each byte.
  - name: vbrev8-v_op
    coverpoint: ["Zvbb16_vbrev8_v_cg/cp_vd"]

  # A leading zero count is performed on each element. The result for zero-valued inputs is
  # the value SEW.
  - name: vclz-v_op
    coverpoint:
      [
        "Zvbb16_vclz_v_cg/cp_vs2_edges",
        "Zvbb8_vclz_v_cg/cp_vs2_edges",
        "Zvbb8_vclz_v_cg/cr_vl_lmul_sew8",
        "Zvbb64_vclz_v_cg/cp_vs2_edges",
        "Zvbb64_vclz_v_cg/cr_vl_lmul_sew64",
      ]

  # A population count is performed on each element.
  - name: vcpop-v_op
    coverpoint:
      [
        "Zvbb16_vcpop_v_cg/cp_vd",
        "Zvbb8_vcpop_v_cg/cp_vs2_edges",
        "Zvbb8_vcpop_v_cg/cr_vl_lmul_sew8",
        "Zvbb64_vcpop_v_cg/cp_vs2_edges",
        "Zvbb64_vcpop_v_cg/cr_vl_lmul_sew64",
      ]

  # A trailing zero count is performed on each element.
  - name: vctz-v_op
    coverpoint:
      [
        "Zvbb16_vctz_v_cg/cp_vd",
        "Zvbb8_vctz_v_cg/cp_vs2_edges",
        "Zvbb8_vctz_v_cg/cr_vl_lmul_sew8",
        "Zvbb64_vctz_v_cg/cp_vs2_edges",
        "Zvbb64_vctz_v_cg/cr_vl_lmul_sew64",
      ]

  # A byte reversal is performed on each element of vs2, effectively performing an endian
  # swap.
  - name: vrev8-v_op
    coverpoint: ["Zvbb16_vrev8_v_cg/cp_vd"]

  # The elements in vs2 are rotated left by the rotate amount specified by either the
  # corresponding elements of vs1 (vector-vector), or integer register rs1 (vector-scalar).
  # Only the low log2(SEW) bits of the rotate-amount value are used, all other bits are
  # ignored.
  - name: vrol_op
    coverpoint:
      ["Zvbb16_vrol_vv_cg/cp_vs1_edges", "Zvbb16_vrol_vx_cg}/cp_rs1_edges"]

  # The elements in vs2 are rotated right by the rotate amount specified by either the
  # corresponding elements of vs1 (vector-vector), integer register rs1 (vector-scalar), or
  # an immediate value (vector-immediate). Only the low log2(SEW) bits of the rotate-amount
  # value are used, all other bits are ignored.
  - name: vror_op
    coverpoint: ["Zvbb16_vror_vx_cg/cp_rs1_edges"]

  # The elements in vs2 are zero-extended to 2*SEW bits, then shifted left by the shift
  # amount specified by either the corresponding elements of vs1 (vector-vector), integer
  # register rs1 (vector-scalar), or an immediate value (vector-immediate). Only the low
  # log2(2*SEW) bits of the shift-amount value are used, all other bits are ignored.
  - name: vwsll_op
    coverpoint:
      [
        "Zvbb16_vwsll_vx_cg/cp_rs1_edges",
        "Zvbb8_vwsll_vv_cg/cr_vs2_vs1_edges",
        "Zvbb8_vwsll_vx_cg/cr_vs2_rs1_edges",
        "Zvbb8_vwsll_vi_cg/cr_vs2_imm_edges",
        "Zvbb32_vwsll_vv_cg/cr_vs2_vs1_edges",
      ]

  # If Zve64x is supported then Zvbb also adds support for EEW=64.
  - name: Zvbb_eew_Zve64x
    # Representative coverpoints; cp_asm_count in every Zvbb64 covergroup
    coverpoint: ["Zvbb64_vclz_v_cg/cp_asm_count"]

  # The result for zero-valued inputs is the value SEW.
  - name: vclz-v_op_zeroinput
    coverpoint:
      [
        "Zvbb8_vclz_v_cg/cp_vs2_edges",
        "Zvbb16_vclz_v_cg/cp_vs2_edges",
        "Zvbb32_vclz_v_cg/cp_vs2_edges",
        "Zvbb64_vclz_v_cg/cp_vs2_edges",
      ]
