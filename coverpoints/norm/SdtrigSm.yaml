  - name: Sdtrig_etrigger_fire
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # Those causes are configured by writing the corresponding bit in tdata2.
  - name: Sdtrig_etrigger_config
    coverpoint: ["SdtrigSm_etrigger_cg/cp_sdtrig_etrigger"]

  # If XLEN is 32, then it is not possible to set a trigger on Exception Codes
  # higher than 31.
  - name: Sdtrig_etrigger_xlen32
    coverpoint: ["XLEN-dependent behavior not tested; single XLEN assumed"]

  # When the trigger matches, it fires after the trap occurs, just before the first
  # instruction of the trap handler is executed.
  - name: Sdtrig_etrigger_timing
    coverpoint: ["SdtrigSm_etrigger_cg/cp_sdtrig_etrigger"]

  # If action=0, the standard CSRs are updated for taking the breakpoint trap, and
  # zero is written to the relevant tval CSR.
  - name: Sdtrig_etrigger_action0
    coverpoint: ["SdtrigSm_etrigger_cg/cp_sdtrig_etrigger"]

  # If textra32 or textra64 are implemented for this trigger, it only matches when
  # the conditions set there are satisfied.
  - name: Sdtrig_etrigger_textra
    coverpoint:
      [
        "SdtrigSm_textra_cg/cp_sdtrig_textra_mcontext",
        "SdtrigSm_textra_cg/cp_sdtrig_textra_scontext",
        "SdtrigSm_textra_cg/cp_sdtrig_textra_asid",
      ]

  # If this bit is implemented, the hardware sets it when this trigger matches. The
  # trigger's user can set or clear it at any time. It is used to determine which
  # trigger(s) matched. If the bit is not implemented, it is always 0 and writing it
  # has no effect.
  - name: Sdtrig_etrigger_hit
    coverpoint: ["Optional WARL field (hit/uncertain bits); not tested"]

  # When set, enable this trigger for exceptions that are taken from VS mode. This
  # bit is hard-wired to 0 if the hart does not support virtualization mode.
  - name: Sdtrig_etrigger_vs
    coverpoint: ["Hypervisor extension not implemented, so not testable"]

  # When set, enable this trigger for exceptions that are taken from VU mode. This
