# CI configuration for Whisper simulator

# SsstrictSm: Sail does not implement the Smaia/Ssaia, Smcsrind, Smrnmi and Sdtrig CSRs that whisper implements (no issue filed)
# Smstateen: Sail does not yet support the P1P13 bit (no issue filed)
# SdtrigSm, SdtrigS, SdtrigU: Sdtrig is not yet implemented in Sail (https://github.com/riscv/sail-riscv/issues/222)
ci_enabled: true
exclude_extensions: "SsstrictSm,Smstateen,SdtrigSm,SdtrigS,SdtrigU"
exclude_configs:
  - whisper-rv32-max-spike-ref
  - whisper-rv64-max-spike-ref
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 1
config_shards:
  whisper-rv64-max: 2
