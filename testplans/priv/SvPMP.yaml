# yaml-language-server: $schema=testplan.schema.json
suite: SvPMP
source: https://docs.google.com/spreadsheets/d/1LGwD2e01j4SN9tg85nt6gPwpp7nXyXMF7hqbw3jvXko/edit?gid=2063348244#gid=2063348244
coverpoints:
  - heading: "General Test Environment (SvPMP):\n- Boots to M-mode (legacy mode hops) because each test programs PMP entries, which are M-mode CSRs. Unchanged by the T-SBI conversion. Run for every supported translation mode: Sv32 on RV32; Sv39, Sv48 and Sv57 on RV64, as selected by the UDB configuration."
  - name: mode
    goal: Verify each supported translation mode is exercised with PMP
    description: Sampled while the SvPMP tests run under satp.MODE = Sv32, Sv39, Sv48 or Sv57.
    expectation: Every supported mode is observed.
    bins: |-
      mode {sv57, sv48, sv39, sv32}
      = 3 bins on RV64, 1 on RV32
  - name: pmp0_pte_noread_s
    goal: Verify PMP applies to the implicit page-table read of a load from S-mode
    description: "S-mode: PMP entry 0 (NAPOT) covers the page table used by the walk, at each level, with R=0; the background PMP region allows everything else. Load (lw) from the page through va_data."
    expectation: Load access fault (mcause = 5); mtval = faulting virtual address.
    bins: |-
      PageType_d x PMP0_PTE x load_acc_fault x lw x mode {S-mode}
      = 7 bins on RV64, 2 on RV32
    id: pmp_check_pagetable_access pmp_with_paging pmp_sfence_required
    rules:
      - "[norm:pmp_check_pagetable_access] [norm:pmp_with_paging] [norm:pmp_sfence_required]"
  - name: pmp0_pte_noread_u
    goal: Verify PMP applies to the implicit page-table read of a load from U-mode
    description: "U-mode: PMP entry 0 (NAPOT) covers the page table used by the walk, at each level, with R=0; the background PMP region allows everything else. Load (lw) from the page through va_data."
    expectation: Load access fault (mcause = 5); mtval = faulting virtual address.
    bins: |-
      PageType_d x PMP0_PTE x load_acc_fault x lw x mode {U-mode}
      = 7 bins on RV64, 2 on RV32
    id: pmp_check_pagetable_access pmp_with_paging pmp_sfence_required
    rules:
      - "[norm:pmp_check_pagetable_access] [norm:pmp_with_paging] [norm:pmp_sfence_required]"
  - name: pmp0_pte_nowrite_s
    goal: Verify PMP applies to the implicit page-table read of a store from S-mode
    description: "S-mode: PMP entry 0 (NAPOT) covers the page table used by the walk, at each level, with R=0; the background PMP region allows everything else. Store (sw) to the page through va_data."
    expectation: Store/AMO access fault (mcause = 7); mtval = faulting virtual address.
    bins: |-
      PageType_d x PMP0_PTE x store_acc_fault x sw x mode {S-mode}
      = 7 bins on RV64, 2 on RV32
    id: pmp_check_pagetable_access pmp_with_paging pmp_sfence_required
    rules:
      - "[norm:pmp_check_pagetable_access] [norm:pmp_with_paging] [norm:pmp_sfence_required]"
  - name: pmp0_pte_nowrite_u
    goal: Verify PMP applies to the implicit page-table read of a store from U-mode
    description: "U-mode: PMP entry 0 (NAPOT) covers the page table used by the walk, at each level, with R=0; the background PMP region allows everything else. Store (sw) to the page through va_data."
    expectation: Store/AMO access fault (mcause = 7); mtval = faulting virtual address.
    bins: |-
      PageType_d x PMP0_PTE x store_acc_fault x sw x mode {U-mode}
      = 7 bins on RV64, 2 on RV32
    id: pmp_check_pagetable_access pmp_with_paging pmp_sfence_required
    rules:
      - "[norm:pmp_check_pagetable_access] [norm:pmp_with_paging] [norm:pmp_sfence_required]"
  - name: pmp0_pte_noexec_s
    goal: Verify PMP applies to the implicit page-table read of an instruction fetch from S-mode
    description: "S-mode: PMP entry 0 (NAPOT) covers the page table used by the walk, at each level, with R=0; the background PMP region allows everything else. Jump (jalr) into the page through va_data."
    expectation: Instruction access fault (mcause = 1); mtval = faulting virtual address.
    bins: |-
      PageType_i x PMP0_PTE x ins_acc_fault x jalr x mode {S-mode}
      = 7 bins on RV64, 2 on RV32
    id: pmp_check_pagetable_access pmp_with_paging pmp_sfence_required
    rules:
      - "[norm:pmp_check_pagetable_access] [norm:pmp_with_paging] [norm:pmp_sfence_required]"
  - name: pmp0_pte_noexec_u
    goal: Verify PMP applies to the implicit page-table read of an instruction fetch from U-mode
    description: "U-mode: PMP entry 0 (NAPOT) covers the page table used by the walk, at each level, with R=0; the background PMP region allows everything else. Jump (jalr) into the page through va_data."
    expectation: Instruction access fault (mcause = 1); mtval = faulting virtual address.
    bins: |-
      PageType_i x PMP0_PTE x ins_acc_fault x jalr x mode {U-mode}
      = 7 bins on RV64, 2 on RV32
    id: pmp_check_pagetable_access pmp_with_paging pmp_sfence_required
    rules:
      - "[norm:pmp_check_pagetable_access] [norm:pmp_with_paging] [norm:pmp_sfence_required]"
  - name: pmp0_PA_noread_s
    goal: Verify PMP applies to the translated physical address of a load from S-mode
    description: "S-mode: valid leaf PTE with PTE.U=0 at every page-table level (4 KiB page and each superpage size of the Sv mode); PMP entry 0 removes R from the translated physical page. Load (lw) from the page through va_data."
    expectation: Load access fault (mcause = 5); mtval = faulting virtual address.
    bins: |-
      PTE_d x PageType_d x PMP0_PA x load_acc_fault x read_acc x mode {S-mode}
      = 7 bins on RV64, 2 on RV32
    id: mtval_vaddr_not_paddr
    rules:
      - "[norm:mtval_vaddr_not_paddr]"
  - name: pmp0_PA_noread_u
    goal: Verify PMP applies to the translated physical address of a load from U-mode
    description: "U-mode: valid leaf PTE with PTE.U=1 at every page-table level (4 KiB page and each superpage size of the Sv mode); PMP entry 0 removes R from the translated physical page. Load (lw) from the page through va_data."
    expectation: Load access fault (mcause = 5); mtval = faulting virtual address.
    bins: |-
      PTE_d x PageType_d x PMP0_PA x load_acc_fault x read_acc x mode {U-mode}
      = 7 bins on RV64, 2 on RV32
    id: mtval_vaddr_not_paddr
    rules:
      - "[norm:mtval_vaddr_not_paddr]"
  - name: pmp0_PA_nowrite_s
    goal: Verify PMP applies to the translated physical address of a store from S-mode
    description: "S-mode: valid leaf PTE with PTE.U=0 at every page-table level (4 KiB page and each superpage size of the Sv mode); PMP entry 0 removes W from the translated physical page. Store (sw) to the page through va_data."
    expectation: Store/AMO access fault (mcause = 7); mtval = faulting virtual address.
    bins: |-
      PTE_d x PageType_d x PMP0_PA x store_acc_fault x write_acc x mode {S-mode}
      = 7 bins on RV64, 2 on RV32
    id: mtval_vaddr_not_paddr
    rules:
      - "[norm:mtval_vaddr_not_paddr]"
  - name: pmp0_PA_nowrite_u
    goal: Verify PMP applies to the translated physical address of a store from U-mode
    description: "U-mode: valid leaf PTE with PTE.U=1 at every page-table level (4 KiB page and each superpage size of the Sv mode); PMP entry 0 removes W from the translated physical page. Store (sw) to the page through va_data."
    expectation: Store/AMO access fault (mcause = 7); mtval = faulting virtual address.
    bins: |-
      PTE_d x PageType_d x PMP0_PA x store_acc_fault x write_acc x mode {U-mode}
      = 7 bins on RV64, 2 on RV32
    id: mtval_vaddr_not_paddr
    rules:
      - "[norm:mtval_vaddr_not_paddr]"
  - name: pmp0_PA_noexec_s
    goal: Verify PMP applies to the translated physical address of an instruction fetch from S-mode
    description: "S-mode: valid leaf PTE with PTE.U=0 at every page-table level (4 KiB page and each superpage size of the Sv mode); PMP entry 0 removes X from the translated physical page. Jump (jalr) into the page through va_data."
    expectation: Instruction access fault (mcause = 1); mtval = faulting virtual address.
    bins: |-
      PTE_i x PageType_i x PMP0_PA x ins_acc_fault x exec_acc x mode {S-mode}
      = 7 bins on RV64, 2 on RV32
    id: mtval_vaddr_not_paddr
    rules:
      - "[norm:mtval_vaddr_not_paddr]"
  - name: pmp0_PA_noexec_u
    goal: Verify PMP applies to the translated physical address of an instruction fetch from U-mode
    description: "U-mode: valid leaf PTE with PTE.U=1 at every page-table level (4 KiB page and each superpage size of the Sv mode); PMP entry 0 removes X from the translated physical page. Jump (jalr) into the page through va_data."
    expectation: Instruction access fault (mcause = 1); mtval = faulting virtual address.
    bins: |-
      PTE_i x PageType_i x PMP0_PA x ins_acc_fault x exec_acc x mode {U-mode}
      = 7 bins on RV64, 2 on RV32
    id: mtval_vaddr_not_paddr
    rules:
      - "[norm:mtval_vaddr_not_paddr]"
