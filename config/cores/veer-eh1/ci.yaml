# CI configuration for the CHIPS Alliance VeeR EH1 core

ci_enabled: true

# chipsalliance/Cores-VeeR-EH1 @ d04b1c7a:
#   Zifencei  The testbench's instruction memory never sees stores, so fence.i fetches stale code
#   I         fence.tso is illegal: the decoder requires fm = 0
#             https://github.com/chipsalliance/Cores-VeeR-EH1/blob/d04b1c7a/design/dec/decode#L56
exclude_extensions: "Zifencei,I"

apt_packages: "autoconf flex bison help2man libfl-dev ccache"
install_script: ".github/scripts/install-veer-eh1.sh"
setup_script: ".github/scripts/setup-veer-eh1.sh"
