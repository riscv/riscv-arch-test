# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions
#
# The rules about the mstateen and hstateen CSRs, and the rules that apply to every level of
# stateen CSR (stateen_*, stateen0_*), are in Smstateen.yaml.

normative_rule_definitions:
  - name: sstateen_rv64_csrs
    coverpoint:
      ["Ssstateen_cg/cp_csr_illegal_accesses", "Ssstateen_cg/cp_walking_ones"]

  - name: sstateen_user_access_control
    coverpoint: ["Ssstateen_cg/{cp_jvt, cp_fcsr_lower}"]

  - name: sstateen_ro1_bits
    coverpoint: ["Ssstateen_cg/cp_walking_ones"]

  # Figure: Supervisor State Enable 0 Register (sstateen0).
  - name: sstateen0_enc_img
    coverpoint: ["Ssstateen_cg/cp_walking_ones"]
