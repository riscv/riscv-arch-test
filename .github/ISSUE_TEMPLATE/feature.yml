name: Feature request
description: Suggest an improvement to the project.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ACT gets architectural parameters from [UDB](https://github.com/riscv/riscv-unified-db) and expected results from the [Sail reference model](https://github.com/riscv/sail-riscv).
        If you need a new UDB parameter or a new Sail model configuration option, or the Sail model behaves incorrectly, open an issue in that repository first.
        Open an issue here only for changes that ACT must make.
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Select the area most directly related to the request.
      options:
        - "Tests — Test generation or individual test files"
        - "Test Environment — Trap handler, boot code, signature checking, etc."
        - "Test Framework — Test selection or compilation"
        - "Coverpoints — Coverage model or coverage generation"
        - "Other — An improvement not listed above"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem would this solve? Include concrete use cases.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
  - type: textarea
    id: context
    attributes:
      label: Additional context
