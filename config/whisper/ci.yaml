# CI configuration for Whisper simulator

# SsstrictSm, unknown
# Smstateen Sail does not yet support 1P13 bit
# Sdtrig* not yet implemented in Sail
# H: whisper.json does not enable h, and enabling it exposes incomplete H support:
#    the mie/mip VS interrupt bits (2, 6, 10, 12) read as zero, which fails the Sm
#    mcsr access/walk/shadow tests. Re-enable once whisper implements them.
ci_enabled: true
exclude_extensions: "SsstrictSm,Smstateen,SdtrigSm,SdtrigS,SdtrigU,H"
exclude_configs:
  - whisper-rv32-max-spike-ref
  - whisper-rv64-max-spike-ref
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 1
config_shards:
  whisper-rv64-max: 2
