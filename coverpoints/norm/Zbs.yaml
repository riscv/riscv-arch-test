# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  - name: Zbs_single_bit_functionality
    # Representative coverpoints; also the other Zbs register and immediate forms
    coverpoint:
      [
        "{Zbs_bset_cg, Zbs_bclr_cg, Zbs_binv_cg}/cr_rs1_rs2_edges",
        "Zbs_bexti_cg/cr_rs1_imm_edges_uimm",
      ]

  - name: bclr_enc
    coverpoint: ["Zbs_bclr_cg/cr_rs1_rs2_edges"]

  - name: bclr_op
    coverpoint: ["Zbs_bclr_cg/cr_rs1_rs2_edges"]

  # Encoding (RV32)
  - name: bclri_rv32_enc
    coverpoint: ["Zbs_bclri_cg/cr_rs1_imm_edges_uimm"]
  # Encoding (RV64)
  - name: bclri_rv64_enc
    coverpoint: ["Zbs_bclri_cg/cr_rs1_imm_edges_uimm"]

  - name: bclri_op
    coverpoint: ["Zbs_bclri_cg/cr_rs1_imm_edges_uimm"]

  - name: bext_enc
    coverpoint: ["Zbs_bext_cg/cr_rs1_rs2_edges"]

  - name: bext_op
    coverpoint: ["Zbs_bext_cg/cr_rs1_rs2_edges"]

  # Encoding (RV32)
  - name: bexti_rv32_enc
    coverpoint: ["Zbs_bexti_cg/cr_rs1_imm_edges_uimm"]
  # Encoding (RV64)
  - name: bexti_rv64_enc
    coverpoint: ["Zbs_bexti_cg/cr_rs1_imm_edges_uimm"]

  - name: bexti_op
    coverpoint: ["Zbs_bexti_cg/cr_rs1_imm_edges_uimm"]

  - name: binv_enc
    coverpoint: ["Zbs_binv_cg/cr_rs1_rs2_edges"]

  - name: binv_op
    coverpoint: ["Zbs_binv_cg/cr_rs1_rs2_edges"]

  # Encoding (RV32)
  - name: binvi_rv32_enc
    coverpoint: ["Zbs_binvi_cg/cr_rs1_imm_edges_uimm"]
  # Encoding (RV64)
  - name: binvi_rv64_enc
    coverpoint: ["Zbs_binvi_cg/cr_rs1_imm_edges_uimm"]

  - name: binvi_op
    coverpoint: ["Zbs_binvi_cg/cr_rs1_imm_edges_uimm"]

  - name: bset_enc
    coverpoint: ["Zbs_bset_cg/cr_rs1_rs2_edges"]

  - name: bset_op
    coverpoint: ["Zbs_bset_cg/cr_rs1_rs2_edges"]

  # Encoding (RV32)
  - name: bseti_rv32_enc
    coverpoint: ["Zbs_bseti_cg/cr_rs1_imm_edges_uimm"]
  # Encoding (RV64)
  - name: bseti_rv64_enc
    coverpoint: ["Zbs_bseti_cg/cr_rs1_imm_edges_uimm"]

  - name: bseti_op
    coverpoint: ["Zbs_bseti_cg/cr_rs1_imm_edges_uimm"]

  # RV32|RV64|Mnemonic|Instruction === ✓|✓|insn:bclr[rd,rs1,rs2]|<<insns-bclr>>¶
  # ✓|✓|insn:bclri[rd,rs1,imm]|<<insns-bclri>>¶ ✓|✓|insn:bext[rd,rs1,rs2]|<<insns-bext>>¶
  # ✓|✓|insn:bexti[rd,rs1,imm]|<<insns-bexti>>¶ ✓|✓|insn:binv[rd,rs1,rs2]|<<insns-binv>>¶
  # ✓|✓|insn:binvi[rd,rs1,imm]|<<insns-binvi>>¶ ✓|✓|insn:bset[rd,rs1,rs2]|<<insns-bset>>¶
  # ✓|✓|insn:bseti[rd,rs1,imm]|<<insns-bseti>> ===
  - name: Zbs_insns_tbl
    coverpoint:
      ["Zbs_{bclr,bclri,bext,bexti,binv,binvi,bset,bseti}_cg/cp_asm_count"]
