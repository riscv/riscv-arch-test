# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions
#
# The Zkr seed CSR tests run once per privilege mode: ZkrSm in M-mode, ZkrS in S-mode, ZkrU in U-mode.

normative_rule_definitions:
  # The entropy source extension defines the seed CSR at address 0x015. This CSR
  # provides up to 16 physical entropy bits that can be used to seed cryptographic
  # random bit generators.
  - name: zkr_seed_addr
    coverpoint: ["{ZkrSm_cg,ZkrS_cg,ZkrU_cg}/{cp_zkr_seed_csrrw}"]

  # Attempts to access seed with a read-only CSR-access instruction (csrrs/csrrc
  # with rs1=x0, or csrrsi/csrrci with uimm=0) raise an illegal-instruction
  # exception; any other CSR-access instruction may access seed.
  - name: seed_ro_illegal
    coverpoint: ["{ZkrSm_cg,ZkrS_cg,ZkrU_cg}/{cp_zkr_seed_illegal_csr_op}"]

  # The write value (in rs1 or uimm) must be ignored by implementations.
  - name: seed_write_ignore
    coverpoint: ["{ZkrSm_cg,ZkrS_cg,ZkrU_cg}/{cp_zkr_seed_csrrw}"]

  # seed is an unprivileged CSR located at address 0x015.
  - name: seed_csr_unpriv
    coverpoint: ["ZkrU_cg/cp_zkr_seed_csrrw"]

  # seed is also access controlled by execution mode: read/write outside M-mode
  # raises an illegal-instruction exception unless access is explicitly granted
  # via mseccfg.sseed/useed.
  - name: seed_exec_mode_control
    coverpoint: ["{ZkrSm_cg,ZkrS_cg,ZkrU_cg}/{cp_zkr_seed_csrrw}"]

  # Each returned seed[15:0] entropy value represents unique randomness when
  # OPST=ES16.
  - name: seed_entropy_unique
    coverpoint: ["Not tested"]

  # When OPST is not ES16, entropy must be 0.
  - name: seed_entropy_zero_non_es16
    coverpoint:
      ["{ZkrSm_cg,ZkrS_cg,ZkrU_cg}/{cp_zkr_seed_entropy_zero_non_es16}"]

  # For security reasons, the interface guarantees that secret entropy
  # words are not made available multiple times. Hence polling (reading) must
  # also have the side effect of clearing (wipe-on-read) the entropy contents and
  # changing the state to WAIT (unless there is entropy immediately
  # available for ES16). Other states (BIST, WAIT, and DEAD) may be unaffected by polling.
  - name: seed_wipe_on_read
    coverpoint: ["Not tested"]

  # A BIST alarm must be latched until polled at least once.
  - name: seed_bist_latch
    coverpoint: ["Not tested"]

  # An implementation that limits security strength shall not reduce it below
  # 256 bits.
  - name: seed_min_security_256
    coverpoint: ["Not tested"]

  # If the security level is under 256 bits, the interface must not be available.
  - name: seed_disable_if_weak
    coverpoint: ["Not tested"]
