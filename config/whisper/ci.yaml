# CI configuration for Whisper simulator

# SsstrictSm: Sail 0.15 lacks Smaia and Smrnmi, whose CSRs Whisper implements
# Smstateen: the -mu configs pass. On the max configs Whisper implements Sscsrind and Ssaia, so
#   mstateen0.CSRIND, AIA and IMSIC are writable, but Sail does not model those extensions
#   (https://github.com/riscv/sail-riscv/issues/1134, https://github.com/riscv/sail-riscv/pull/1874).
# SsstrictS: Sail traps on siselect/stopi accesses that Whisper permits with mstateen0 enabled.
# Sdtrig* not yet implemented in Sail (https://github.com/riscv/sail-riscv/issues/222)
# ZicfissU: with H implemented and V=0, U-mode ssp CSR access is gated on henvcfg.SSE
#   (https://github.com/tenstorrent/whisper/issues/109).
# ZicfissSm, ZicfissU: on a TLB miss, an ordinary load from a shadow stack page raises a page fault,
#   and the walk lacks the store/CBO access-fault check (https://github.com/tenstorrent/whisper/issues/110).
# Ssnpm,SsnpmSm,Smmpm,SmnpmS,SmnpmSSm,SmnpmU,SmnpmUSm : Failing due to mismatch in stval/mtval ,Issue Link (https://github.com/riscv/sail-riscv/issues/1962)
ci_enabled: true
exclude_extensions: "SsstrictSm,SsstrictS,Smstateen,SdtrigSm,SdtrigS,SdtrigU,Ssnpm,SsnpmSm,Smmpm,SmnpmS,SmnpmSSm,SmnpmU,SmnpmUSm,ZicfissU,ZicfissSm"
exclude_configs:
  - whisper-rv32-max-spike-ref
  - whisper-rv64-max-spike-ref
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 2
