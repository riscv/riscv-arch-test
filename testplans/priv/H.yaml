# yaml-language-server: $schema=testplan.schema.json
suite: H
source: https://docs.google.com/spreadsheets/d/1DWBEoprndjQzLTXQTzPI8jW1HydtkYRR3tg58q59fdk/edit?gid=262865576#gid=262865576
notes: |
  Definitions:
  Machine H-Extension CSRs: mtval2, mtinst
  HS H-Extension CSRs: hstatus, hedeleg, hideleg, hie, hcounteren, hgeie, henvcfg, htval, hip, hvip, htinst, hgatp, hgeip (+ htimedelta for Zicntr) (+ hedelegh, htimedeltah, henvcfgh for RV32)
  VS H-Extension CSRs: vsstatus, vsie, vstval,  vsip, vstvec, vsscratch, vsepc, vscause, vsatp (+ vstimecmp for SSTC, vstimecmph with RV32)
  h H-extension CSRS (RV64 only): hedelegh, htimedeltah, henvcfgh, vstimecmph
  S CSRs with VS replicas: sstatus, sie, stvec, sscratch, sepc, scause, stval, sip, satp
  S CSRs without VS replicas: scounteren, senvcfg, scountinhibit
  Note: *** trap handler should also record hstatus, m/s status in signature
coverpoints:
  - heading: Tests executed in M-mode (H_mcsr_cg)
  - name: cp_hcsr_access
    goal: All H-extension CSRs are able to read, write, set, and clear
    description: Write all 1s and all 0s, then set all bits, then clear all bits, then read each {Machine/HS/VS} H-Extension CSR.
    expectation: All registers are accessible. hgeip is read-only.
    bins: 5 * (2 + 14-17 + 9-11)
    rules:
      - norm:csr:mtval2:reg, norm:csr:mtinst:reg, norm:csr:hstatus:reg, norm:csr:hedeleg:reg, norm:csr:hideleg:reg, norm:csr:hie:reg, norm:csr:htimedelta:reg, norm:csr:hcounteren:reg; norm:csr:hgeie:reg, norm:csr:henvcfg:reg, norm:csr:htval:reg, norm:csr:hip:reg, norm:csr:hvip:reg, norm:csr:htinst:reg, norm:csr:hgatp:reg, norm:csr:hgeip:reg, norm:csr:hedelegh:reg, norm:csr:htimedeltah:reg, norm:csr:henvcfgh:reg, norm:csr:vsstatus:reg, norm:csrsvsip_vsie:reg, norm:csr:vstval:reg, norm:csr:vstvec:reg, norm:csr:vsscratch:reg, norm:csr:vsepc:reg, norm:csr:vscause:reg, norm:csr:vsatp:reg, norm:ext:H:vscsrs-m-hs-perm, norm:ext:Zicsr:higher-priv, norm:ext:Zicsr:rw
      - '*** also capture 2.7 >xlen,2 "accessible at higher priv levels"'
  - name: cp_hcsrwalk
    goal: Exercise each bit of H-extension CSRs
    description: Set and clear each bit of each Machine H-Extension CSR.
    expectation: All registers are accessible.  Some fields are WARL and will not change.
    bins: 64*2*(2 + 13-16 + 8-10)
    rules:
      - norm:csr:mtval2:reg, norm:csr:mtinst:reg
      - '*** make sure each bit of hstatus, vsstatus are tested elsehwere'
  - name: cp_replica
    goal: Writing to S/VS-mode CSRs doesn't affect replica
    description: Write different random values into S-mode CSRs and their VS-mode replicas.  Read back
    expectation: Each CSR should have value written.
    bins: '9'
    rules:
      - norm:ext:H:vscsrs-v0
  - name: cp_mtvala
    goal: mtval must not be read-only zero
    description: Write 1s to mtval
    expectation: nonzero
    bins: '1'
    rules:
      - norm:csr:mtval:h-nrz
      - CSR `mtval` must not be read-only zero
  - heading: Tests executed in HS-mode (H_hscsr_cg)
  - name: cp_hcsr_access
    goal: All H-extension CSRs are able to read, write, set, and clear
    description: Write all 1s and all 0s, then set all bits, then clear all bits, then read each {HS/VS} H-Extension CSR.
    expectation: All registers are accessible. hgeip is read-only.
    bins: 5 * (14-17 + 9-11)
    rules:
      - norm:csr:hstatus:reg, norm:csr:hedeleg:reg, norm:csr:hideleg:reg, norm:csr:hie:reg, norm:csr:htimedelta:reg, norm:csr:hcounteren:reg; norm:csr:hgeie:reg, norm:csr:henvcfg:reg, norm:csr:htval:reg, norm:csr:hip:reg, norm:csr:hvip:reg, norm:csr:htinst:reg, norm:csr:hgatp:reg, norm:csr:hgeip:reg, norm:csr:hedelegh:reg, norm:csr:htimedeltah:reg, norm:csr:henvcfgh:reg, norm:csr:vsstatus:reg, norm:csrsvsip_vsie:reg, norm:csr:vstval:reg, norm:csr:vstvec:reg, norm:csr:vsscratch:reg, norm:csr:vsepc:reg, norm:csr:vscause:reg, norm:csr:vsatp:reg
  - name: cp_hcsrwalk
    goal: Exercise each bit of H-extension CSRs
    description: Set and clear each bit of each {HS/VS} H-Extension CSR. Exclude hstatus, vsstatus because of WPRI bits.
    expectation: All registers are accessible.  Some fields are WARL and will not change.
    bins: 64 * 2 * (13-16 + 8-10)
    rules:
      - norm:csr:hedeleg:reg, norm:csr:hideleg:reg, norm:csr:hie:reg, norm:csr:htimedelta:reg, norm:csr:hcounteren:reg; norm:csr:hgeie:reg, norm:csr:henvcfg:reg, norm:csr:htval:reg, norm:csr:hip:reg, norm:csr:hvip:reg, norm:csr:htinst:reg, norm:csr:hgatp:reg, norm:csr:hgeip:reg, norm:csr:hedelegh:reg, norm:csr:htimedeltah:reg, norm:csr:henvcfgh:reg, norm:csrsvsip_vsie:reg, norm:csr:vstval:reg, norm:csr:vstvec:reg, norm:csr:vsscratch:reg, norm:csr:vsepc:reg, norm:csr:vscause:reg, norm:csr:vsatp:reg
      - The ...X bits, when set, indicate that the PMP entry permits ... instruction execution
  - name: cp_hcsr_inaccessible
    goal: M-mode H-extension registers are inaccessible from HS-mode
    description: csrrw, csrrs, csrrc, csrr each Machine H-Extension CSR
    expectation: Illegal instruction fault
    bins: 5 * 2
    rules:
      - norm:ext:Zicsr:insufficient-privlege
  - name: cp_replica
    goal: In HS, writing to S/VS-mode CSRs doesn't affect replica
    description: In M-mode, write different random values into S-mode CSRs and their VS-mode replicas.  Switch to HS-mode and read, write random, and readback S and VS CSRs. Switch back to M-mode and read back both the S-mode CSRs and VS replicas.
    expectation: Each CSR should have value written.
    bins: '9'
    rules:
      - norm:ext:H:vscsrs-v0
  - name: cp_hstatus_vgein
    goal: VGEIN can hold values between 0 and GEILEN
    description: Write {0, 1, GEILEN-1, GEILEN, GEILEN+1, 63} to hstatus.VGEIN
    expectation: Only write legal values
    bins: '6'
    rules:
      - norm:csrfld:hstatus:vgein:op
  - name: cp_vscause_write
    goal: vscause WLRL fields writable
    description: |-
      Write values
      (WLRL)
    expectation: |-
      with interrupt = 1: 0-15
      with interrupt = 0: 0-64
    bins: '81'
  - name: cp_tvm
    goal: TVM traps access to satp and hgatp
    description: With mstatus.TVM = {0/1} read and write satp and hgatp
    expectation: Illegal instruction fault if TVM = 1
    bins: 2 TVM * 2 accesses * 2 regs
  - heading: '*** check if any other bitfields need special cases, including hstatus, vsstatus'
  - heading: Tests executed in VS-mode (H_vscsr_cg)
  - name: cp_hcsr_inaccessible
    goal: M-mode H-extension registers are inaccessible from VS-mode
    description: csrrw, csrrs, csrrc, csrr each Machine H-Extension CSR
    expectation: Illegal instruction fault
    bins: 5 * 2
    rules:
      - norm:ext:Zicsr:insufficient-privlege
  - name: cp_hcsr_virtualinstructionfault
    goal: HS and VS registers cause virtual instruction fault from VS-mode
    description: csrrw, csrrc, csrrs, csrr each {HS/VS} H-Extension CSR
    expectation: Virtual instruction fault
    bins: 5 * (13-16 + 8-10)
    rules:
      - norm:ext:H:csrs-hs-not-vs
      - norm:ext:H:vscsrs-vs-perm
      - '"When V=1, an attempt to read or write a VS CSR directly by its own separate CSR address causes a virtual-instruction exception."'
  - name: cp_illegalupper
    goal: In RV64, h half of CSRs are illegal.
    description: 'RV64 ONLY: csrrw, csrrs, csrrc, csrr  each h H-extension CSR'
    expectation: |-
      Illegal instruction fault
      *** may need to remove vstimecmp from all cp_illegalupper coverpoints if not implemented
    bins: 5 * 4
    rules:
      - '"When XLEN>32, an attempt to access a high-half CSR always raises an illegal-instruction exception."'
      - '*** should this be every h register, not just these, and at lesat the unpriv counters?'
  - name: cp_replica
    goal: In VS, writing to S-mode CSRs affects replica instead
    description: In M-mode, write different random values into S-mode CSRs and their VS-mode replicas.  Switch to VS-mode and write and readback S CSRs. Switch back to M-mode and read back both the S-mode CSRs and VS replicas.
    expectation: VS replica should have changed but S CSR does not change.
    bins: '9'
    rules:
      - norm:ext:H:vscsrs-v0
      - '"When V=1, the VS CSRs substitute for the corresponding supervisor CSRs, taking over all functions of the usual supervisor CSRs except as specified otherwise. Instructions that normally read or modify a supervisor CSR shall instead access the corresponding VS CSR."'
  - name: cp_nonreplica
    goal: In VS, accessing nonreplicated S-mode CSRs behaves normally
    description: csrrw, csrrc, csrrs, csrr each S CSR without VS replica
    expectation: Normal access
    bins: 5 * 3
    rules:
      - norm:ext:H:scsrs-nomatch
  - name: cp_vsstatus_sd_write
    goal: vstatus.SD affected by vstatus.FS/VS
    description: Write 1 and 0 to SD with FS/VS all 0.  Write cross-product of all bits of vsstatus.SD/ FS/ VS.
    expectation: vsstatus.SD = 1 if FS or VS are nonzero
    bins: 2 * 4 * 4
  - name: cp_tvm
    goal: VTVM traps access to satp
    description: With mstatus.TVM = {0/1} cross hstatus.VTVM = {0/1} read and write satp
    expectation: Virtual instruction fault if VTVM = 1. TVM does not affect VS-mode.
    bins: 2 TVM * 2 VTVM * 2 accesses
  - heading: Tests executed in U-mode (H_ucsr_cg)
  - name: cp_hcsr_inaccessible
    goal: All H-extenion CSRs are inaccessible from U-mode
    description: csrrw, csrrc, csrrs, csrr each {Machine/HS/VS} H-Extension CSR
    expectation: Illegal instruction fault
    bins: 5 * (2 + 14-17 + 9-11)
    rules:
      - norm:ext:Zicsr:insufficient-privlege
  - name: cp_illegalupper
    goal: In RV64, h half of CSRs are illegal.
    description: 'RV64 ONLY: csrrw, csrrs, csrrc, csrr  each h H-extension CSR'
    expectation: Illegal instruction fault
    bins: 5 * 4
    rules:
      - norm:ext:Zicsr:insufficient-privlege
      - '***'
  - name: cp_scsr
    goal: Illegal instruction fault on U access to supervisor CSRs
    description: csrrw, csrrc, csrrs, csrr each S CSRs {with/without VS replicas}*** this should get tested in ZicsrS, along with other illegal instruction faults for CSRs of too much priv
    expectation: Illegal instruction fault
    bins: 5 * (9 + 3)
    rules:
      - norm:ext:Zicsr:insufficient-privlege
  - heading: Tests executed in VU-mode (H_vucsr_cg)
  - name: cp_hcsr_inaccessible
    goal: M-mode H-extension registers are inaccessible from VS-mode
    description: csrrw, csrrs, csrrc, csrr each {Machine/HS/VS} H-Extension and {Machine/Supervisor} CSR
    expectation: Illegal instruction fault
    bins: 5 * (2 + 14-17 + 9-11)
    rules:
      - norm:ext:Zicsr:insufficient-privlege
  - name: cp_illegalupper
    goal: In RV64, h half of CSRs are illegal.
    description: 'RV64 ONLY: csrrw, csrrs, csrrc, csrr  each h H-extension CSR'
    expectation: Illegal instruction fault
    bins: 5 * 4
    rules:
      - norm:ext:Zicsr:insufficient-privlege
  - name: cp_scsr
    goal: Virtual instruction fault on VU access to hypervisor CSRs
    description: csrrw, csrrc, csrrs, csrr each {HS/VS/S} CSRs {with/without VS replicas}
    expectation: Virtual instruction fault or illegal instruction
    bins: 5 * (9 + 3)
    rules:
      - norm:ext:H:vscsrs-vs-perm
      - norm:ext:Zicsr:insufficient-privlege
  - heading: Seems Zicsr* should write all 0s and all 1s to each standard CSR and read the CSR.  Applies to all Zicsr* tabs. *** maybe already done?
  - heading: Instructions (H_inst_cg)
  - name: cp_hlv
    goal: Basic load
    description: 'Set up non-identity G and VS-stage page tables. In {M, HS, U (with hstatus.HU = 1)}: Write a random value to scratch. hlv.b, hlv.bu, hlv.h,  hlv.hu, hlv.w from scratch.  For rv64, also test hlv.wu, hlv.d.  Random source and destination registers.'
    expectation: Read and sign/zero extend
    bins: 3 modes * 7 instr
  - name: cp_hlvx
    goal: Basic load
    description: 'Set up non-identity G and VS-stage page tables. In {M, HS, U (with hstatus.HU = 1): Write a random value to scratch. hlvx.hu, hlvx.wu from scratch.  Random source and destination registers.'
    expectation: Read and sign/zero extend
    bins: 3 modes * 2 instr
  - name: cp_hsv
    goal: Basic store
    description: 'Set up non-identity G and VS-stage page tables. In {M, HS, U (with hstatus.HU = 1): Write a random value to scratch. hsv.b, hsv.h, hsv.w to scratch.  For rv64, also test hsv.d.  Random source and destination registers and values.'
    expectation: Read and sign/zero extend
    bins: 3 modes * 4 instr
  - name: cp_hfence
    goal: Basic fence
    description: Execute hfence.vvma, hfence.gvma in {M, HS mode} cross with mstatus.TVM = {0,1} and with hstatus.VTVM = {0,1}
    expectation: Only exception for HFENCE.GVMA in HS-mode with mstatus.TVM=1
    bins: 2 modes * 2 instr * 2 TVM * 2 VTVM
  - name: cp_sfence
    goal: Basic fence
    description: Execute sfence.vma in {M, HS, VS mode} cross with mstatus.TVM = {0,1} and with hstatus.VTVM = {0,1}
    expectation: Only exception in HS mode when TVM = 1 or in VS-mode when VTMV = 1
    bins: 3 modes * 2 TVM * 2 VTVM
  - name: cp_mret_m
    goal: mret uses MPV
    description: Execute mret in machine mode with cross-product of mstatus.MPP / MPV / MPIE.
    expectation: Goes to appropriate mode
    bins: 2 MPP * 2 MPV * 2 MPIE
  - name: cp_mret_illegal
    goal: mret unavailable below M mode
    description: Execute mret in {HS, VS, VU} modes.
    expectation: Illegal instruction
    bins: 3 modes
  - name: cp_sret_illegal
    goal: sret unavailable in VU mode
    description: Execute sret in VU mode.
    expectation: Virtual instruction
    bins: 1 mode
  - name: cp_sret_m
    goal: sret from M mode
    description: Execute sret in machine mode with cross-product of mstatus.SPP / SPV / SPIE.
    expectation: Goes to appropriate mode
    bins: 2 SPP * 2 SPV * 2 SPIE
  - name: cp_sret_hs
    goal: sret from HS mode
    description: Execute sret in HS-mode with cross-product of sstatus.SPP / SPIE  / hstatus.SPV. Check sstatus.SPP, SIE, SPIE, hstatus.SPV.
    expectation: Goes to appropriate mode
    bins: 2 SPP * 2 SPIE * 2 SPV
  - name: cp_sret_vs
    goal: sret from VS mode
    description: Execute sret in VS-mod ewith cross-product of sstatus.SPP / SPIE  / hstatus.VTSR. Check sstatus.SPP, SIE, SPIE.
    expectation: Goes to appropriate mode, or virtual-instruction exception if VTSR=1.
    bins: 2 SPP * 2 SPIE * 2 VTSR
