[settings]
experimental = true

[tools]
prek = "0.5.2"
ruby = "3.4.10"
shellcheck = "0.11.0"
uv = "0.12.11"
"gem:bundler" = "4.0.20"

[settings.ruby]
compile = false

[deps.uv]
auto = true

[deps.bundler]
auto = true
dir = "framework/src/act/data"

[deps.prek]
auto = true
depends = ["uv"]
sources = [".pre-commit-config.yaml"]
outputs = [".git/hooks/pre-commit"]
run = "prek install --prepare-hooks"

[tasks.prek]
description = "Run prek hooks on all files"
run = "prek run --all-files"

[tasks.prek-install]
description = "Install prek git hooks"
run = "prek install"
