# CI configuration for the XiangShan core
#
# XiangShan is not run in CI: Chisel elaboration of KunminghuV2Config needs about 22 GB of memory,
# and the emulator runs at a few hundred cycles per second, so one ACT run takes days. Run it
# manually as described in README.md.

ci_enabled: false

# OpenXiangShan/XiangShan @ e7bab53 (kunminghu-v2), KunminghuV2Config, against Sail 0.16. The full suite was
# measured on 2026-10-01 (3564 of 3631 tests pass). On 2026-10-20 the suites affected by later config changes
# (M, F, U, S, Sm, Zicntr, Zifencei, PMP_Sm, Sscofpmf*, Smstateen, Ssstateen, Sdtrig*, Ssstrict*) were rerun:
# 473 of 557 pass, and every remaining failure is in one of these suites.
# On 2026-11-02 the exclusions were narrowed to the failing groups. Every test this frees was rerun, with the
# Sm_H_hcsr, Zicntr and Sm_mcsr_cntr groups: all pass except the groups excluded below. The other excluded
# groups are those that failed on 2026-10-20.
exclude_extensions:
  # menvcfg.FIOM and senvcfg.FIOM are read-only zero although satp.MODE is not
  # always Bare (norm:menvcfg_fiom_rdonly0_ok); NewCSR/CSRBundles.scala L79. mstatus.SDT
  # stays writable, and writing 1 clears SIE, while menvcfg.DTE = 0, when the hart must
  # behave as though Ssdbltrp is not implemented (norm:menvcfg_dte_op); NewCSR/MachineLevel.scala
  # L584 gates only the sstatus view on DTE. Only Sm_mcsr_walk-00 and -10 fail, but numbered
  # files cannot be excluded singly. Filed upstream as
  # https://github.com/OpenXiangShan/XiangShan/issues/6794 (FIOM) and
  # https://github.com/OpenXiangShan/XiangShan/issues/6381 (SDT with DTE = 0).
  - Sm_mcsr_access
  - Sm_mcsr_walk
  - Sm_scsr
  - S_scsr-
  # henvcfg.FIOM is read-only zero in the same way (also
  # https://github.com/OpenXiangShan/XiangShan/issues/6794).
  - Sm_H_hcsr_access
  - Sm_H_hcsr_walk
  # Counter reads are not ordered after older instructions (norm:csr_access_order):
  # two instret reads 8 instructions apart differ by 0-21, and mhpmcounter11 read right
  # after the counted load is still 0 (and its overflow bit still clear). Counters are
  # missing from CSROoORead.waitForwardInOrderCsrReadList
  # (https://github.com/OpenXiangShan/XiangShan/issues/6852).
  - Zicntr
  - Sm_Zicntr-
  - Sscofpmf_Sm_inhibit_lo
  - Sscofpmf_Sm_overflow
  # rdtime right after a store to mtime and fence o,i still differs from the value written
  # by 100 or more ticks (Sm_mcsr_cntr cp_mtime_write).
  - Sm_mcsr_cntr
  # Reserved vector encodings that read one register with two EEWs execute instead of
  # raising illegal-instruction (norm:vreg_source_eew_rsv): v0 as both mask and source
  # (vadd.vv v4,v0,v8,v0.t; vsseg5e32.v v0,(t1),v0.t) and a widening multiply-add whose
  # vs2 is the upper half of vd (vwmaccu.vv v14,v9,v15,v0.t).
  - Ssstrict_S_VectorInstr
  - Ssstrict_Sm_VectorInstr
  - Ssstrict_U_VectorInstr
  # The CSR walks differ on the AIA, Sscsrind and Smrnmi CSRs (mtopi, stopi, vstopi,
  # miselect/mireg, siselect/sireg, vsiselect/vsireg, mn*), which XiangShan implements and
  # Sail 0.16 does not. With menvcfg.STCE = 0, vstimecmp is still accessible from HS-mode
  # (NewCSR/CSRPermitModule.scala L225-L227;
  # https://github.com/OpenXiangShan/XiangShan/issues/6464, closed as not planned).
  - Ssstrict_S_CSR
  - Ssstrict_Sm_CSR
  # mstateen0.CSRIND, AIA and IMSIC are writable (XiangShan implements Sscsrind and
  # Smaia), but Sail 0.16 has no Sscsrind or Smaia and no sail.json setting for these bits,
  # so it reads them as zero.
  - Smstateen
  # PMP_Sm_cfg_A_tor_zero stores to and loads from physical address 0. The SimTop PMA
  # table makes 0x0-0x0FFF_FFFF readable and writable I/O with no device behind it, and
  # the bus error is not reported: the store is dropped and the load returns 0. Sail has
  # no memory there and takes an access fault.
  - PMP_Sm_cfg_A_tor_zero
  # XiangShan implements no tdata3, so an access raises illegal-instruction. tdata3 "is
  # optional if no implemented triggers use it", and mcontrol6 uses it (textra32/64 is
  # tdata3 for types 2-6), so riscv-unified-db requires TDATA3_IMPLEMENTED with mcontrol6
  # and the config claims it (the spec's inconsistency on this is
  # https://github.com/riscv/riscv-isa-manual/issues/3491). In SdtrigS and SdtrigU the
  # trapping T-SBI access never returns, so those tests time out. Separately, a load or
  # store trigger on a vector element after the first reports the first active byte of the
  # 16-byte flow in xtval instead of the element's address
  # (https://github.com/OpenXiangShan/XiangShan/issues/6851).
  - SdtrigSm
  - SdtrigS
  - SdtrigU

apt_packages: "autoconf flex bison help2man libfl-dev ccache clang"
install_script: ".github/scripts/install-xiangshan.sh"
setup_script: ".github/scripts/setup-xiangshan.sh"
