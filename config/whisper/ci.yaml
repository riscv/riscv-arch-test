# CI configuration for Whisper simulator

# SsstrictSm, SsstrictS, SsstrictU excluded because not all instructions in whisper-max supported by Sail
# Smstateen will be added back once issue related srmcfg in whisper is resolved
# S (S_scsr-00, S_scsr_from_m-00) excluded because of https://github.com/tenstorrent/whisper/issues/39
# ExceptionsSvZalrsc: Whisper reports page faults where Sail expects access faults.
# Vx excluded because of https://github.com/tenstorrent/whisper/issues/35
ci_enabled: true
# TODO: Remove SsstrictV when sail SsstrictV is implemented
exclude_extensions: "S,Sm,SsstrictSm,SsstrictS,SsstrictU,ExceptionsSvZalrsc,SsstrictV,Smstateen,Vx8,Vx16,Vx32,Vx64,SdtrigSm,SdtrigS,SdtrigU"
exclude_configs:
  - whisper-rv32-max-spike-ref
  - whisper-rv64-max-spike-ref
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 1
config_shards:
  whisper-rv64-max: 2
