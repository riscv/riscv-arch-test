      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
      true,
    ]
  # Every mhpmcounter is a full 64-bit register:
  #   "logic [63:0] mhpmcounter_d[HPM_NUM_COUNTERS+3-1:3];"
  #   https://github.com/bsc-loca/csr/blob/c5c8a1d1302b62cbb5fd88863a446bfb3312adb9/rtl/hpm_counters.sv#L73-L74
  HPM_COUNTER3_WIDTH: 64
  HPM_COUNTER4_WIDTH: 64
  HPM_COUNTER5_WIDTH: 64
  HPM_COUNTER6_WIDTH: 64
  HPM_COUNTER7_WIDTH: 64
  HPM_COUNTER8_WIDTH: 64
  HPM_COUNTER9_WIDTH: 64
  HPM_COUNTER10_WIDTH: 64
  HPM_COUNTER11_WIDTH: 64
  HPM_COUNTER12_WIDTH: 64
  HPM_COUNTER13_WIDTH: 64
  HPM_COUNTER14_WIDTH: 64
  HPM_COUNTER15_WIDTH: 64
  HPM_COUNTER16_WIDTH: 64
  HPM_COUNTER17_WIDTH: 64
  HPM_COUNTER18_WIDTH: 64
  HPM_COUNTER19_WIDTH: 64
  HPM_COUNTER20_WIDTH: 64
  HPM_COUNTER21_WIDTH: 64
  HPM_COUNTER22_WIDTH: 64
  HPM_COUNTER23_WIDTH: 64
  HPM_COUNTER24_WIDTH: 64
  HPM_COUNTER25_WIDTH: 64
  HPM_COUNTER26_WIDTH: 64
  HPM_COUNTER27_WIDTH: 64
  HPM_COUNTER28_WIDTH: 64
  HPM_COUNTER29_WIDTH: 64
  HPM_COUNTER30_WIDTH: 64
  HPM_COUNTER31_WIDTH: 64
  # "Event 0 is hardwired to always zero, as per the spec."
  #   https://github.com/bsc-loca/sargantana/blob/403975c8a3c64c8eb369021a1ac2a374e5df441b/events.md#L47
  HPM_EVENTS: [0]
  # "riscv_pkg::CSR_MCOUNTINHIBIT:      mcountinhibit_d = csr_wdata[31:0];" (csr_bsc.sv#L1588)
  # read back with bit 1 forced to zero, as the spec requires:
  #   "csr_rdata = {{32{1'b0}}, mcountinhibit_q[31:2], 1'b0, mcountinhibit_q[0]};" (csr_bsc.sv#L679)
  MCOUNTINHIBIT_IMPLEMENTED: true
  COUNTINHIBIT_EN:
