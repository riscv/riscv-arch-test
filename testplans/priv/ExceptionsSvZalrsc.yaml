# yaml-language-server: $schema=testplan.schema.json
suite: ExceptionsSvZalrsc
source: https://docs.google.com/spreadsheets/d/1W95I4jPbuQBnXzDdIZtOG4kae8vi7djpKtJXWCXPxMU/edit?gid=287426144#gid=287426144
description: |
  This testplan is for systems supporting supervisor mode and virtual memory.
  Also requires Zalrsc
  The following coverpoints should be exercised in supervisor mode
coverpoints:
  - name: cp_misaligned_priority_s
    goal: Priority of exceptions
    description: Attempt lr.w and sc.w from memory location causing {access fault and page fault}, {page fault and misaligned}, {access fault, page fault, misaligned}
  - heading: The following coverpoints should be exercised in user mode
  - name: cp_misaligned_priority_u
    goal: Priority of exceptions
    description: Attempt lr.w and sc.w from memory location causing {access fault and page fault}, {page fault and misaligned}, {access fault, page fault, misaligned}
