# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  - name: mul_op
    coverpoint: ["M_mul_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  # insn:mulh[], insn:mulhu[], and insn:mulhsu[] perform the same multiplication but
  # return the upper XLEN bits of the full 2×XLEN-bit product, for signed×signed,
  # unsigned×unsigned, and rs1×unsigned rs2 multiplication.
  - name: mulh_mulhu_mulhsu_op
    coverpoint:
      [
        "{M_mulh_cg, M_mulhu_cg, M_mulhsu_cg}/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}",
      ]
  # insn:div[] and insn:divu[] perform an XLEN bits by XLEN bits signed and unsigned
  # integer division of rs1 by rs2, rounding towards zero.
  - name: div_divu_op
    coverpoint:
      ["{M_div_cg, M_divu_cg}/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  # insn:divw[] and insn:divuw[] are RV64 instructions that divide the lower 32 bits of
  # rs1 by the lower 32 bits of rs2, treating them as signed and unsigned integers,
  # placing the 32-bit quotient in rd, sign-extended to 64 bits.
  - name: divw_divuw_op
    coverpoint:
      ["{M_divw_cg, M_divuw_cg}/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  # insn:rem[] and insn:remu[] provide the remainder of the corresponding division
  # operation.
  - name: rem_remu_op
    coverpoint:
      ["{M_rem_cg, M_remu_cg}/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  # insn:remw[] and insn:remuw[] are RV64 instructions that provide the corresponding
  # signed and unsigned remainder operations.
  - name: remw_remuw_op
    coverpoint:
      ["{M_remw_cg, M_remuw_cg}/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]
  - name: div_by_zero
    coverpoint: ["{M_div_cg, M_divu_cg}/{cr_rs1_rs2_edges}"]
  - name: rem_by_zero
    coverpoint: ["{M_rem_cg, M_remu_cg}/{cr_rs1_rs2_edges}"]
  - name: signed_div_overflow
    coverpoint: ["{M_div_cg, M_rem_cg}/cr_rs1_rs2_edges"]
  - name: rem_result_sign
    coverpoint: ["{M_rem_cg}/{cr_rs1_rs2_edges}"]
  # Both insn:remw[] and insn:remuw[] always sign-extend the 32-bit result to 64 bits,
  # including on a divide by zero.
  - name: remw_remuw_result_sign
    coverpoint: ["{M_remw_cg, M_remuw_cg}/cr_rs1_rs2_edges"]
  - name: mulw_op
    coverpoint: ["M_mulw_cg/{cp_rs1, cp_rs2, cp_rd, cr_rs1_rs2_edges}"]

  # RV32M and RV64M encodings (RV32/64G Instruction Set Listings)
  # MUL
  - name: mul_enc
    coverpoint: ["M_mul_cg/cp_asm_count"]
  # MULH
  - name: mulh_enc
    coverpoint: ["M_mulh_cg/cp_asm_count"]
  # MULHSU
  - name: mulhsu_enc
    coverpoint: ["M_mulhsu_cg/cp_asm_count"]
  # MULHU
  - name: mulhu_enc
    coverpoint: ["M_mulhu_cg/cp_asm_count"]
  # DIV
  - name: div_enc
    coverpoint: ["M_div_cg/cp_asm_count"]
  # DIVU
  - name: divu_enc
    coverpoint: ["M_divu_cg/cp_asm_count"]
  # REM
  - name: rem_enc
    coverpoint: ["M_rem_cg/cp_asm_count"]
  # REMU
  - name: remu_enc
    coverpoint: ["M_remu_cg/cp_asm_count"]
  # MULW
  - name: mulw_enc
    coverpoint: ["M_mulw_cg/cp_asm_count"]
  # DIVW
  - name: divw_enc
    coverpoint: ["M_divw_cg/cp_asm_count"]
  # DIVUW
  - name: divuw_enc
    coverpoint: ["M_divuw_cg/cp_asm_count"]
  # REMW
  - name: remw_enc
    coverpoint: ["M_remw_cg/cp_asm_count"]
  # REMUW
  - name: remuw_enc
    coverpoint: ["M_remuw_cg/cp_asm_count"]
