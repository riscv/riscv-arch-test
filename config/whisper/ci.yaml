# CI configuration for Whisper simulator

ci_enabled: true
exclude_extensions:
  # Sail lacks Ssaia/Sscsrind, so expects illegal instead of virtual instruction for their CSRs from VU-mode.
  - H_vucsr
  # Max configs: Whisper implements tcontrol while using mstatus.MIE/SIE for breakpoint
  # reentrancy, which Sail cannot model (it has tcontrol only with Use_tcontrol,
  # https://github.com/riscv/sail-riscv/issues/2039), so the reference traps on the tcontrol accesses.
  - SdtrigSm_csr_access_common
  - SdtrigSm_csr_access_global
  - SdtrigSm_tcontrol
  - SdtrigS_csr_access_global
  # Sail 0.16 lacks Smaia and Smrnmi, whose CSRs Whisper implements
  - Ssstrict_Sm_CSR
  # Sail traps on siselect/stopi accesses that Whisper permits with mstateen0 enabled.
  # In VS-mode, Whisper raises virtual instruction on the AIA and Sscsrind CSRs (siselect/sireg, stopi,
  # vsiselect, vstopi, vstopei, hvien), where Sail raises illegal instruction because it lacks them.
  - Ssstrict_S_CSR
  - Ssstrict_H_vs_CSR
  # Zicfiss_H: Sail completes HLVX on a VS-stage shadow stack page, which is not executable
  # (https://github.com/riscv/sail-riscv/issues/2081), and keeps a TLB-cached VS-stage shadow stack page valid
  # after henvcfg.SSE is cleared without a fence (cp_ss_sse_change_no_fence), so Whisper's load page faults mismatch.
  - Zicfiss_H-
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 2
