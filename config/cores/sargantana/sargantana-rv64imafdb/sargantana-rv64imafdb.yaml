  # "riscv_pkg::CSR_MCOUNTEREN:         mcounteren_d = {csr_wdata[31:0]};" (csr_bsc.sv#L1587)
  # — all 32 bits are writable, unmasked.
  MCOUNTENABLE_EN:
    [
      true,
      true,
      true,
      true,
      true,
      true,
      true,
