# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # Attempting to execute a store, store-conditional, AMO, or cache-block zero
  # instruction that accesses a physical address within a PMP region without write
  # permissions raises a store access-fault exception.
  - name: pmp_store_fault
    coverpoint: ["PMPZicbo_cg/cp_cbo_zero"]

  # The permissions required for a cache-block management instruction to access a PMP
  # region are defined in &lt;&lt;cmo&gt;&gt;; when such access is not permitted, the
  # instruction raises a store access-fault exception.
  - name: pmp_cbm_fault
    coverpoint: ["PMPZicbo_cg/{cp_cbo_clean, cp_cbo_flush, cp_cbo_inval}"]

  # A cache-block zero instruction is permitted to access the specified cache block
  # whenever a store instruction is permitted to access the corresponding physical
  # addresses and when the PMAs indicate that cache-block zero instructions are a
  # supported access type.
  - name: cbz_access
    coverpoint: ["PMPZicbo_cg/cp_cbo_zero"]

  # If access to the cache block is not permitted, a cache-block zero instruction raises
  # a store page-fault or store guest-page-fault exception if address translation does
  # not permit write access or raises a store access-fault exception otherwise.
  - name: cbz_unperm_fault
    coverpoint: ["PMPZicbo_cg/cp_cbo_zero"]

  # When a page-fault, guest-page-fault, or access-fault exception is taken, the
  # relevant *tval CSR is written with the faulting effective address (i.e. the value of
  # rs1).
  - name: fault_excep_csr
    # rs1 is always block-aligned here, so a DUT that reports the block address also passes
    coverpoint:
      ["PMPZicbo_cg/{cp_cbo_zero, cp_cbo_clean, cp_cbo_flush, cp_cbo_inval}"]

  # A cache-block management instruction is permitted to access the specified cache
  # block whenever a load instruction or store instruction is permitted to access the
  # corresponding physical addresses.
  - name: cbm_access
    coverpoint: ["PMPZicbo_cg/{cp_cbo_clean, cp_cbo_flush, cp_cbo_inval}"]

  # If access to the cache block is not permitted, a cache-block management instruction
  # raises a store page-fault or store guest-page-fault exception if address translation
  # does not permit any access or raises a store access-fault exception otherwise.
  - name: cbm_unperm_fault
    coverpoint: ["PMPZicbo_cg/{cp_cbo_clean, cp_cbo_flush, cp_cbo_inval}"]

  # If access to the cache block is not permitted, a cache-block prefetch instruction
  # does not raise any exceptions and shall not access any caches or memory.
  - name: cbp_unperm_noexcep
    coverpoint: ["PMPZicbo_cg/{cp_prefetch_i, cp_prefetch_r, cp_prefetch_w}"]
