# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # The misaligned atomicity granule PMA optionally relaxes this alignment requirement. If present,
  # the misaligned atomicity granule PMA specifies the size of a misaligned atomicity granule, a
  # power-of-two number of bytes. The misaligned atomicity granule PMA applies only to AMOs; loads and
  # stores defined in the base ISAs; loads and stores of no more than XLEN bits defined in the
  # F, D, and Q extensions; the load-acquire and store-release instructions defined
  # in the Zalasr extension; and compressed encodings of the foregoing loads and stores. For an
  # instruction in that set, if all accessed bytes lie within the same misaligned atomicity granule,
  # the instruction will not raise an exception for reasons of address alignment, and the instruction
  # will give rise to only one memory operation for the purposes of RVWMO--i.e., it will execute
  # atomically.
  - name: misaligned_atomicity_granule_size
    # Loads, stores, FP loads and stores, and AMOs of each size at every in-granule offset
    coverpoint:
      [
        "Zama16b_cg/{cp_zama16b_2byte, cp_zama16b_4byte, cp_zama16b_8byte}",
        "atomicity OUT-OF-SCOPE for single hart",
      ]

  # The Zama16b extension requires MAG16 support to main memory regions.
  - name: Zama16b_pma_mag_req
    # Loads, stores, FP loads and stores, and AMOs of each size at every in-granule offset
    coverpoint:
      [
        "Zama16b_cg/{cp_zama16b_2byte, cp_zama16b_4byte, cp_zama16b_8byte}",
        "atomicity OUT-OF-SCOPE for single hart",
      ]
  # If the ext:zama16b[] extension is implemented, then the
  # &lt;&lt;sec:misaligned-atomicity-granule,misaligned atomicity granule&gt;&gt; in main
  # memory regions with both the coherence and cacheability PMAs is 16 bytes.
  - name: Zama16b_mag
    # Loads, stores, FP loads and stores, and AMOs of each size at every in-granule offset
    coverpoint:
      [
        "Zama16b_cg/{cp_zama16b_2byte, cp_zama16b_4byte, cp_zama16b_8byte}",
        "atomicity OUT-OF-SCOPE for single hart",
      ]

  # The misaligned atomicity granule PMA provides constrained support for misaligned AMOs. This PMA,
  # if present, specifies the size of a misaligned atomicity granule, a naturally aligned power-of-two
  # number of bytes. Specific supported values for this PMA are represented by MAGNN, e.g., MAG16
  # indicates the misaligned atomicity granule is at least 16 bytes.
  - name: pma_mag_def
    coverpoint: ["Descriptive spec text with no separately testable behavior"]

  # The misaligned atomicity granule PMA applies only to AMOs; loads and stores defined in the base
  # ISAs; loads and stores of no more than XLEN bits defined in the F, D, and Q
  # extensions; the load-acquire and store-release instructions defined in the Zalasr extension;
  # and compressed encodings of the foregoing loads and stores.
  - name: pma_mag_insts
    # Loads, stores, FP loads and stores, and AMOs of each size at every in-granule offset
    coverpoint:
      [
        "Zama16b_cg/{cp_zama16b_1byte, cp_zama16b_2byte, cp_zama16b_4byte, cp_zama16b_8byte}",
        "TODO: compressed loads and stores within a 16-byte granule",
      ]

  # if all accessed bytes lie within the same misaligned atomicity granule, the instruction will not
  # raise an exception for reasons of address alignment, and the instruction will give rise to only
  # one memory operation for the purposes of RVWMO--i.e., it will execute atomically.
  - name: pma_mag_op_within
    # Loads, stores, FP loads and stores, and AMOs of each size at every in-granule offset
    coverpoint:
      [
        "Zama16b_cg/{cp_zama16b_2byte, cp_zama16b_4byte, cp_zama16b_8byte}",
        "atomicity OUT-OF-SCOPE for single hart",
      ]

  # For regular loads and stores that access such a region or for which not all accessed bytes lie
  # within the same atomicity granule, then either an exception is raised, or the access proceeds but
  # is not guaranteed to be atomic.
  - name: pma_mag_op_ldst
    # TODO: misaligned loads and stores that cross a 16-byte boundary
    coverpoint: [""]

  # Misaligned loads, stores and AMOs to those regions that do not cross a naturally
  # aligned 16-byte boundary are atomic.
  - name: Zama16b_atomic_ops
    # 1-byte accesses are always aligned and the 16-byte amocas.q is tested only aligned
    coverpoint:
      [
        "Zama16b_cg/{cp_zama16b_2byte, cp_zama16b_4byte, cp_zama16b_8byte}",
        "atomicity OUT-OF-SCOPE for single hart",
      ]
