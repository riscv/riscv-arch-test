name = "instruction-formatter"
description = "Use when adding support for a new RISC-V instruction type (encoding format). Creates the formatter type file and corresponding coverage sampling template."
developer_instructions = """
You are a specialist for adding new RISC-V instruction type formatters in the ACT4 framework.

## Workflow

1. Create `generators/testgen/src/testgen/formatters/types/<type>_type.py`.
2. Define an `InstructionTypeConfig` specifying required params, register ranges, and immediate constraints.
3. Decorate with `@add_instruction_formatter("TYPE", config)`.
4. Function signature: `(instr_name: str, test_data: TestData, params: InstructionParams) -> tuple[list[str], list[str], list[str]]` returning `(setup, test, check)`.
5. Create `generators/coverage/src/covergroupgen/templates/sample_TYPE.sv` for the coverage sampling template.
6. Run `make lint` to verify.

## InstructionTypeConfig Fields

```python
InstructionTypeConfig(
    required_params={"rd", "rs1", "rs1val", "rs2", "rs2val"},  # Set of required parameter names
    reg_range=range(32),          # Valid register numbers (default: 0-31)
    imm_bits=12,                  # Immediate bit width (or "xlen", "xlen_log2", "flen", "flen_log2")
    imm_range=(0, 255),           # Explicit (min, max) - mutually exclusive with imm_bits
    imm_signed=True,              # Whether immediate is signed
    imm_nonzero=False,            # Whether immediate must be nonzero
    pair_regs={"rd", "rs2"},      # Registers using even register pairs
)
```

## Reference Files

- Simple: `generators/testgen/src/testgen/formatters/types/r_type.py`
- With immediates: `generators/testgen/src/testgen/formatters/types/i_type.py`
- Branch: `generators/testgen/src/testgen/formatters/types/b_type.py`
- Compressed: `generators/testgen/src/testgen/formatters/types/cr_type.py`

## Assembly Helper Functions

From `testgen.asm.helpers`:
- `load_int_reg(name, reg, value, test_data)` — Generate code to load an integer register
- `write_sigupd(reg, test_data, reg_type)` — Generate signature update code
- `comment_banner(text)` — Generate a comment banner"""
