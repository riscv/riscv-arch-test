# UDB architecture configuration for the Shakti C-class core at shaktiproject/cores/c-class commit
# 6feeb421f02f5f76dacba3c44caa61cfba60b56f, built from sample_config/c64 with the changes
# install-shakti.sh lists (paths below are under
# https://gitlab.com/shaktiproject/cores/c-class/-/blob/6feeb421f02f5f76dacba3c44caa61cfba60b56f/).
# C-class's CSRs are generated by csrbox from sample_config/c64/rv64i_isa.yaml, a riscv-config
# specification, which is the source for most parameters here. The values were checked by the
# UDB feature extractor (riscv-arch-test #2442) run on this simulator; ../README.md lists where
# this file departs from what it measured.
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: shakti-cclass-rv64gc
description: Shakti C-class - RV64IMAFDC_Zicsr_Zifencei_Zicntr_Zihpm with S and U modes, Sv39 and 16 PMP entries (8 usable)

# sample_config/c64/rv64i_isa.yaml: "ISA: RV64IMAFDCSUZicsr_Zifencei", misa reset 0x800000000014112d.
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: A, version: "= 2.1.0" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  - { name: F, version: "= 2.2.0" }
  - { name: D, version: "= 2.2.0" }
  - { name: C, version: "= 2.0" }
  - { name: Zca, version: "= 1.0.0" }
  - { name: Zcd, version: "= 1.0.0" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zifencei, version: "= 2.0.0" }
  # cycle, time and instret, and hpmcounter3..6 (sample_config/c64/csr_grouping64.yaml).
  - { name: Zicntr, version: "= 2.0" }
  - { name: Zihpm, version: "= 2.0.0" }
  # FENCE decodes with every field but funct3 a don't-care, so pause runs as a FENCE, and ntl.*
  # and c.ntl.* are adds to x0 (src/decoder.defines#L68).
  - { name: Zihintntl, version: "= 1.0.0" }
  - { name: Zihintpause, version: "= 2.0.0" }
  - { name: U, version: "= 1.0.0" }
  - { name: S, version: "= 1.11.0" }
  # Sm 1.11: there is no mconfigptr, which 1.12 requires, although menvcfg and senvcfg exist
  # (sample_config/c64/rv64i_isa.yaml).
  - { name: Sm, version: "= 1.11.0" }
  # satp.MODE takes 0 (Bare) and 8 (Sv39) (sample_config/c64/rv64i_isa.yaml, satp).
  - { name: Sv39, version: "= 1.0" }
  - { name: Svbare, version: "= 1.0.0" }
  # stvec MODE takes 0 and 1; SXLEN and UXLEN are fixed at 64.
  - { name: Sstvecd, version: "= 1.0.0" }
  - { name: Sstvecv, version: "= 1.0.0" }
  - { name: Ssu64xl, version: "= 1.0.0" }

