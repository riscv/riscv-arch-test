# yaml-language-server: $schema=testplan.schema.json
suite: SvinvalSm
source: https://docs.google.com/spreadsheets/d/1LGwD2e01j4SN9tg85nt6gPwpp7nXyXMF7hqbw3jvXko/edit?gid=1611339746#gid=1611339746
coverpoints:
  - heading: "General Test Environment (SvinvalSm):\n- Sm suite: boots to M-mode (BOOT_TO_MMODE) because each coverpoint needs M-mode state (mstatus.MPRV/MPP, mstatus.TVM, mstatus.SBE or an M-mode CSR access). Mode changes use RVTEST_TSBI_GOTO_*. Runs the Svinval instructions in M, S and U mode, first with mstatus.TVM=0 and then with mstatus.TVM=1.\n- Split from Svinval: the M-mode and mstatus.TVM=1 bins of cr_svinival. The suite also repeats the S-mode and U-mode cases with TVM=0 so the cross closes without ignore_bins."
  - name: cr_svinival
    goal: Verify the Svinval instructions in M-mode, S-mode and U-mode with mstatus.TVM clear and set
    description: Execute sfence.w.inval, sinval.vma x0, x0, sfence.inval.ir and sfence.vma x0, x0 in M-mode, then in S-mode (RVTEST_TSBI_GOTO_SMODE) and U-mode (RVTEST_TSBI_GOTO_UMODE); repeat the whole sequence after setting mstatus.TVM in M-mode and reading mstatus back.
    expectation: "M-mode: all execute for either TVM. S-mode with TVM=0: all execute; with TVM=1 sinval.vma and sfence.vma raise illegal instruction (mcause = 2) while sfence.w.inval and sfence.inval.ir execute. U-mode: illegal instruction for each, for either TVM."
    bins: |-
      cp_instr x cp_priv x cp_tvm
      = 24 bins on RV64, 24 on RV32
    id: mstatus_tvm_op MSTATUS_TVM_WARL Svinval_sfence_w_inval_inval_s_vs_mode Svinval_illegal_instruction_tvm
    rules:
      - "[norm:mstatus_tvm_op] [norm:MSTATUS_TVM_WARL] [norm:Svinval_sfence_w_inval_inval_s_vs_mode] [norm:Svinval_illegal_instruction_tvm]"
