# SPDX-License-Identifier: Apache-2.0
# CI configuration for the OpenHW CVA6 Verilator testharness.
# cv32a65x, cv32a60x and fpga_linux_cv32a6 share this file: one ci.yaml covers every run_cmd.txt
# in this directory.

ci_enabled: true

# On CVA6 master_candidate, cv32a65x and cv32a60x use the OBI memory subsystem, and the Verilator
# testharness supports only AXI targets. Run them again once CVA6 has an OBI Verilator testbench.
# https://github.com/openhwfoundation/cva6/blob/e9b8e8e7d0093d8fa5e160e23cb68cae65d49f3a/flows/recipes/verilator_testharness_comp.py#L15-L17
exclude_configs:
  - cv32a65x
  - cv32a60x

exclude_extensions:
  # PMP_Sm_cfg_A_tor_zero stores to, loads from and jumps to address 0. In the testharness
  # address 0 is the debug module (DebugBase=0x0, DebugLength=0x1000), which answers every
  # access with OKAY, while Sail expects an access fault because there is no memory at 0.
  # CVA6 has no data-side PMA check, so the DUT raises no fault and the load returns 0.
  # Remove this exclusion once riscv-arch-test#2963 drops the address-0 probes.
  # https://github.com/openhwfoundation/cva6/blob/e9b8e8e7d0093d8fa5e160e23cb68cae65d49f3a/corev_apu/tb/ariane_soc_pkg.sv#L58
  # https://github.com/riscv/riscv-arch-test/issues/2963
  - PMP_Sm_cfg_A_tor_zero
  # LR faults use store causes: a misaligned lr.w raises cause 6 instead of 4, an lr.w page fault
  # cause 15 instead of 13, and an lr.w PMP fault cause 7 instead of 5. The decoder sends every
  # A instruction, LR included, to the store unit, and the LSU and MMU pick the cause from that unit.
  # https://github.com/openhwfoundation/cva6/blob/e9b8e8e7d0093d8fa5e160e23cb68cae65d49f3a/core/decoder.sv#L1590-L1592
  # https://github.com/openhwfoundation/cva6/blob/e9b8e8e7d0093d8fa5e160e23cb68cae65d49f3a/core/load_store_unit.sv#L704-L722
  # https://github.com/openhwfoundation/cva6/issues/2455
  # https://github.com/openhwfoundation/cva6/issues/3394
  # https://github.com/openhwfoundation/cva6/issues/3606
  - Exceptions_Zalrsc
  - PMP_Zalrsc_cfg_wr
  - Sv_ExceptionsZalrsc_sv32
  - Sv_ExceptionsZalrscSm_sv32
  # A write to mie does not flush the pipeline, so the 2-3 already decoded instructions retire
  # before the newly enabled interrupt is taken. Here they clear mip.SEIP first, so the handler
  # sees the wrong mip or takes STI instead of SEI. mstatus writes flush; mie, mip and mideleg
  # writes do not, and the decoder attaches interrupts at decode time.
  # https://github.com/openhwfoundation/cva6/blob/e9b8e8e7d0093d8fa5e160e23cb68cae65d49f3a/core/csr_regfile.sv#L1764-L1854
  # https://github.com/openhwfoundation/cva6/blob/e9b8e8e7d0093d8fa5e160e23cb68cae65d49f3a/core/decoder.sv#L1896-L1981
  # https://github.com/openhwfoundation/cva6/issues/3175
  # https://github.com/openhwfoundation/cva6/issues/3651
  - InterruptsSm_priority_mideleg_M
  # With a delegated SEI and a non-delegated STI both pending in S- or U-mode, CVA6 takes SEI to
  # S-mode, but the M-level STI must be taken first. The decoder picks one cause in a fixed order
  # and only then applies mideleg.
  # https://github.com/openhwfoundation/cva6/blob/e9b8e8e7d0093d8fa5e160e23cb68cae65d49f3a/core/decoder.sv#L1920-L1981
  # https://github.com/openhwfoundation/cva6/issues/3199
  - InterruptsSm_priority_mideleg_S
  - InterruptsSm_priority_mideleg_U
  # With pmpcfg.A = NAPOT, pmpaddr bit 0 reads as 1. With G = 1 no bit is forced, so a written 0
  # must read back as 0. CVA6 applies the G = 2 rule in NAPOT mode and the G = 1 rule otherwise.
  # The trailing "-" keeps PMP_Sm_grain_check, which passes.
  # https://github.com/openhwfoundation/cva6/blob/e9b8e8e7d0093d8fa5e160e23cb68cae65d49f3a/core/csr_regfile.sv#L1050-L1056
  # https://github.com/openhwfoundation/cva6/issues/2656
  - PMP_Sm_grain-
  # A PMP fault on a PTE read during a store raises a load access fault (5) instead of a store
  # access fault (7). The store cause is used only for Sv39 (PtLevels == 3).
  # https://github.com/openhwfoundation/cva6/blob/e9b8e8e7d0093d8fa5e160e23cb68cae65d49f3a/core/cva6_mmu/cva6_mmu.sv#L758-L783
  # https://github.com/openhwfoundation/cva6/issues/3299
  - PMP_Sv_sv32_pmp_on_pte
  - PMP_SvZicbo_sv32_pmp_on_pte
  # A fetch from a page with X = 0 executes when a load or store has put the page in the shared
  # TLB. The ITLB hit check tests the U bit but not X.
  # https://github.com/openhwfoundation/cva6/blob/e9b8e8e7d0093d8fa5e160e23cb68cae65d49f3a/core/cva6_mmu/cva6_mmu.sv#L402-L404
  # https://github.com/openhwfoundation/cva6/issues/3573
  - Sv_sv32_spage_Smode
  - Sv_sv32_spage_mstatus_sum_set_Smode
  - Sv_sv32_upage_Umode
  # cbo.clean and cbo.flush to a page with R = 1 and W = 0 raise a store page fault. A CBO is
  # permitted wherever a load or a store is, but CVA6 checks it as a store.
  # https://github.com/openhwfoundation/cva6/issues/3431
  # https://github.com/openhwfoundation/cva6/pull/3592
  - Sv_Zicbo_sv32_zicbom_exceptions
  # When the next sequential 32-bit fetch block is not executable, the instruction access fault is
  # reported on the instruction before it, which is executable: a ret at 0x80009004 traps with
  # mepc = mtval = 0x80009004 when only 0x80009008 and up are no-execute. Passes at 81245a4 (master).
  # The trailing "-" keeps PMP_Sm_priority_off, which passes.
  - PMP_S_napot_legal_lxwr-01
  - PMP_Sm_napot_legal_lxwr-01
  - PMP_U_napot_legal_lxwr-01
  - PMP_Sm_priority-
  - PMP_Zca_misaligned_napot

# device-tree-compiler and the Boost libraries are required by CVA6's Spike build
# (verif/regress/install-spike.sh). Without them fesvr is not installed and the
# testharness fails to compile with "fesvr/dtm.h: No such file or directory".
apt_packages: "autoconf flex bison help2man libfl-dev ccache zlib1g-dev device-tree-compiler libboost-regex-dev libboost-system-dev"
install_script: ".github/scripts/install-cva6.sh"
setup_script: ".github/scripts/setup-cva6.sh"
config_shards:
  fpga_linux_cv32a6: 2
