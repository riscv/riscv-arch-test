    notes: vsstatus.MXR = 0 and sstatus.MXR = 0 is cp_vu_pmm.
  - name: cp_vs_pmlen_masking
    goal: henvcfg.PMM ignores the upper PMLEN bits of the address for every kind of memory-accessing instruction in VS-mode
    description: |-
      If pointer masking is enabled, addresses differing only in upper PMLEN bits access the same location.  This is
      cp_pmlen_masking of Ssnpm run in VS-mode with henvcfg.PMM.  Each instruction is tested in one variant only, the .D
      form where there is one.

      Test Environment:
       In HS-mode, identity map the test image in both stages; the VS-stage data pages have PTE.U = 0.
       Seed pm_lo_page with value_old.
       Enable the state the instruction groups need: FS and VS in mstatus and vsstatus, menvcfg.CBZE, menvcfg.CBCFE, henvcfg.CBZE and henvcfg.CBCFE.
       Set henvcfg.PMM and the other PMM fields as in the notes, then HFENCE.GVMA x0, x0 and HFENCE.VVMA x0, x0.
       Switch to VS-mode and execute the following loop:
      For each henvcfg.PMM in {00, 10, 11} (outermost loop; the other PMM fields as in the notes) under (vsatp.MODE, hgatp.MODE) in {BARE_PAIR, PAGED_PAIR}:
      For each A_upper_bits in {0x0000, 0x0400, 0xFFFF}:
      Set A = A' with upper bits replaced by A_upper_bits
      For each read instruction: read from A, sigupd(value) + record any traps.
      For each write instruction: write unique value_new to A, then read back from A' (untagged), sigupd(value) + record any traps.
      Instructions covered under this loop:

      (ATOMIC OPS): Each AMO is both a read and a write, so treat it as a write: perform the AMO at A, read back from A'.
       If RV64A: amoadd.d.  If Zacas: amocas.d.  If Zabha: amoadd.h (Zabha has only byte and halfword forms).

      (FLOATING POINT OPS): If D, Read: fld.  Write: fsd.

      (COMPRESSED OPS): If Zca, Reads: c.ld, c.ldsp.  Writes: c.sd, c.sdsp.  If Zcd, Read: c.fldsp.  Write: c.fsdsp.

      (CACHE MANAGEMENT OPS): If Zicboz: cbo.zero at A (write), read back from A'.
       If Zicbom: cbo.clean at A (write), read back from A'.
       prefetch.w at A, not gated on Zicbop.  It is a hint with no architectural effect, so no cache effect is observed;
       the bin only records that the instruction executed at the tagged address.

      (VECTOR OPS): If RVV 1.0, Reads: vle64.v, vlse64.v, vluxei64.v, vloxei64.v, vlseg2e64.v, vl1re64.v, vle64ff.v from A, sigupd.
       Writes: vse64.v, vsse64.v, vsuxei64.v, vsoxei64.v, vsseg2e64.v, vs1r.v to A, read back from A', sigupd(value) + record any traps.
    expectation: As cp_vs_pmm, with the PMLEN of henvcfg.PMM, for every instruction in the loop.
    bins: |-
      priv_mode VS x {{amoadd.d (RV64A), amocas.d (Zacas), amoadd.h (Zabha)} + {fld, fsd (D)} + {c.ld, c.sd, c.ldsp, c.sdsp (Zca), c.fldsp, c.fsdsp (Zcd)} + {cbo.zero (Zicboz), cbo.clean (Zicbom), prefetch.w (coverage only)} + {vle64.v, vlse64.v, vluxei64.v, vloxei64.v, vlseg2e64.v, vl1re64.v, vle64ff.v, vse64.v, vsse64.v, vsuxei64.v, vsoxei64.v, vsseg2e64.v, vs1r.v (RVV)}} x henvcfg.PMM {00, 10, 11} x tag {0x0000, 0x0400, 0xFFFF} x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported; each instruction group only when its extension is implemented (prefetch.w always)
    rules:
      - henvcfg_pmm_op
      - ssnpm_definition
      - pm_ignore_upper_bits
      - pm_deterministic_effect
      - pm_per_mode_control
      - pm_apply_explicit
      - pm_cpu_only
      - pm_mode_only_dependency
      - pm_rv64_only
      - pmlen_supported_values
      - pm_ignore_va
      - pm_ignore_pa
  - name: cp_vu_pmlen_masking
    goal: senvcfg.PMM ignores the upper PMLEN bits of the address for every kind of memory-accessing instruction in VU-mode
    description: |-
      Same test environment and loop as cp_vs_pmlen_masking, except:
       - the field under test is senvcfg.PMM;
       - the VS-stage data pages have PTE.U = 1;
       - senvcfg.CBZE and senvcfg.CBCFE are also enabled;
       - the accesses run in VU-mode.
    expectation: As cp_vs_pmlen_masking, with the PMLEN of senvcfg.PMM.
    bins: |-
      priv_mode VU x {{amoadd.d (RV64A), amocas.d (Zacas), amoadd.h (Zabha)} + {fld, fsd (D)} + {c.ld, c.sd, c.ldsp, c.sdsp (Zca), c.fldsp, c.fsdsp (Zcd)} + {cbo.zero (Zicboz), cbo.clean (Zicbom), prefetch.w (coverage only)} + {vle64.v, vlse64.v, vluxei64.v, vloxei64.v, vlseg2e64.v, vl1re64.v, vle64ff.v, vse64.v, vsse64.v, vsuxei64.v, vsoxei64.v, vsseg2e64.v, vs1r.v (RVV)}} x senvcfg.PMM {00, 10, 11} x tag {0x0000, 0x0400, 0xFFFF} x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported; each instruction group only when its extension is implemented (prefetch.w always)
    rules:
      - senvcfg_pmm_ssnpm
      - senvcfg_pmm_enc
      - ssnpm_definition
      - pm_ignore_upper_bits
      - pm_ignore_pa
      - pm_ignore_va
      - pm_apply_explicit
      - pm_per_mode_control
  - name: cp_vs_pmlen_zicfiss_amo
    goal: henvcfg.PMM ignores the upper PMLEN bits of the SSAMOSWAP address in VS-mode
    description: |-
      If pointer masking is enabled, SSAMOSWAP.W/D addresses differing only in upper PMLEN bits access the same shadow
      stack location.  This is cp_pmlen_zicfiss_amo of Ssnpm run in VS-mode with henvcfg.PMM.
      SSAMOSWAP needs an address in a shadow stack page, so vsatp = Bare is not tested: there it always faults.

      Test Environment:
       Gated on Zicfiss.  In HS-mode, identity map the test image in both stages.
       Map ss_page (A', upper bits 0x0000) in the VS stage as a shadow stack page (PTE.xwr = 010, PTE.U = 0) and in the
       G stage with R = W = 1.
       Set menvcfg.SSE = 1 and henvcfg.SSE = 1.
       Set henvcfg.PMM and the other PMM fields as in the notes, then HFENCE.GVMA x0, x0 and HFENCE.VVMA x0, x0.
       Switch to VS-mode and execute the following loop:
      For each henvcfg.PMM in {00, 10, 11} (outermost loop; the other PMM fields as in the notes) under (vsatp.MODE, hgatp.MODE) = PAGED_PAIR:
      For each A_upper_bits in {0x0000, 0x0400, 0xFFFF}:
      Set A = A' with upper bits replaced by A_upper_bits
      Place known value_old in ss_page with SSAMOSWAP.D at A'.
      For each of {SSAMOSWAP.W, SSAMOSWAP.D}: swap unique value_new at A, sigupd(rd), then read back from ss_page (A'), sigupd(value) + record any traps.
    expectation: |-
      When henvcfg.PMM = 10/11 and every tag bit is within PMLEN: rd returns value_old, the readback returns value_new, no
      trap.  Otherwise (PMM = 00, or a tag bit outside PMLEN): the access takes a store/AMO page fault or reaches a page
      other than ss_page, rd is unchanged and the readback returns value_old.
    bins: |-
      priv_mode VS x {ssamoswap.w, ssamoswap.d} (Zicfiss) x henvcfg.PMM {00, 10, 11} x tag {0x0000, 0x0400, 0xFFFF} x (vsatp, hgatp) {PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; only when a paged pair is supported
    rules:
      - henvcfg_pmm_op
      - pm_ignore_upper_bits
      - pm_apply_explicit
      - pm_ignore_va
  - name: cp_vu_pmlen_zicfiss_amo
    goal: senvcfg.PMM ignores the upper PMLEN bits of the SSAMOSWAP address in VU-mode
    description: |-
      Same test environment and loop as cp_vs_pmlen_zicfiss_amo, except:
       - the field under test is senvcfg.PMM;
       - the VS-stage shadow stack page has PTE.U = 1;
       - senvcfg.SSE is also enabled;
       - the accesses run in VU-mode.
    expectation: As cp_vs_pmlen_zicfiss_amo, with the PMLEN of senvcfg.PMM.
    bins: |-
      priv_mode VU x {ssamoswap.w, ssamoswap.d} (Zicfiss) x senvcfg.PMM {00, 10, 11} x tag {0x0000, 0x0400, 0xFFFF} x (vsatp, hgatp) {PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; only when a paged pair is supported
    rules:
      - senvcfg_pmm_ssnpm
      - senvcfg_pmm_enc
      - pm_ignore_upper_bits
      - pm_apply_explicit
      - pm_ignore_va
  - name: cp_vs_pmlen_zicfiss_ssp
    goal: henvcfg.PMM ignores the upper PMLEN bits of the ssp address of shadow stack pushes and pops in VS-mode
    description: |-
      SSPUSH and SSPOPCHK address memory through the ssp CSR instead of rs1.  If pointer masking is enabled, ssp values
      differing only in upper PMLEN bits access the same shadow stack location.  This is cp_pmlen_zicfiss_ssp of Ssnpm
      run in VS-mode with henvcfg.PMM.  vsatp = Bare is not tested: there pushes and pops always fault.

      Same test environment as cp_vs_pmlen_zicfiss_amo.  Execute the following loop in VS-mode:
      For each henvcfg.PMM in {00, 10, 11} (outermost loop; the other PMM fields as in the notes) under (vsatp.MODE, hgatp.MODE) = PAGED_PAIR:
      For each A_upper_bits in {0x0000, 0x0400, 0xFFFF}:
      Set A = A' with upper bits replaced by A_upper_bits
      Place known value_old in ss_page with SSAMOSWAP.D at A'.
      For each push {sspush x1, sspush x5, c.sspush x1 (if Zcmop)}: set ssp = A + 8 and the link register = value_new, push, sigupd(ssp), then read back from ss_page (A'), sigupd(value) + record any traps.
      For each pop {sspopchk x1, sspopchk x5, c.sspopchk x5 (if Zcmop)}: the pushes left value_new at A', so first reseed
       value_old in ss_page with SSAMOSWAP.D at A' (untagged).  Then set ssp = A and the link register = value_old, pop, sigupd(ssp) + record any traps.
    expectation: |-
      When henvcfg.PMM = 10/11 and every tag bit is within PMLEN: a push writes value_new and leaves ssp = A, a pop
      matches value_old and leaves ssp = A + 8, no trap.  Otherwise: the access takes a store/AMO page fault or reaches
      a page other than ss_page, ssp is unchanged and the readback returns value_old.
    bins: |-
      priv_mode VS x {sspush x1, sspush x5, sspopchk x1, sspopchk x5} (Zicfiss) + {c.sspush x1, c.sspopchk x5} (Zcmop) x henvcfg.PMM {00, 10, 11} x tag {0x0000, 0x0400, 0xFFFF} x (vsatp, hgatp) {PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; only when a paged pair is supported
    rules:
      - henvcfg_pmm_op
      - pm_ignore_upper_bits
      - pm_apply_explicit
      - pm_ignore_va
  - name: cp_vu_pmlen_zicfiss_ssp
    goal: senvcfg.PMM ignores the upper PMLEN bits of the ssp address of shadow stack pushes and pops in VU-mode
    description: |-
      Same test environment and loop as cp_vs_pmlen_zicfiss_ssp, except:
       - the field under test is senvcfg.PMM;
       - the VS-stage shadow stack page has PTE.U = 1;
       - senvcfg.SSE is also enabled;
       - the accesses run in VU-mode.
    expectation: As cp_vs_pmlen_zicfiss_ssp, with the PMLEN of senvcfg.PMM.
    bins: |-
      priv_mode VU x {sspush x1, sspush x5, sspopchk x1, sspopchk x5} (Zicfiss) + {c.sspush x1, c.sspopchk x5} (Zcmop) x senvcfg.PMM {00, 10, 11} x tag {0x0000, 0x0400, 0xFFFF} x (vsatp, hgatp) {PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; only when a paged pair is supported
    rules:
      - senvcfg_pmm_ssnpm
      - senvcfg_pmm_enc
      - pm_ignore_upper_bits
      - pm_apply_explicit
      - pm_ignore_va
  - name: cp_vs_pmm_jalr
    goal: Pointer masking never applies to instruction fetch, so a JALR through a tagged pointer in VS-mode is not masked
    description: |-
      For implicit memory accesses such as instruction fetches, pointer masking does not apply.

      Test Environment:
       In HS-mode, identity map the test image in both stages; the VS-stage code pages have PTE.U = 0.
       Place valid executable instructions at A'.  Map the alias pages non-executable (X = 0) in each paged stage, so a
       fetch that reaches one takes an instruction page fault or guest-page fault instead of executing.
       Set henvcfg.PMM and the other PMM fields as in the notes, then HFENCE.GVMA x0, x0 and HFENCE.VVMA x0, x0.
       Switch to VS-mode and execute the following loop:
      For each henvcfg.PMM in {00, 10, 11} (outermost loop; the other PMM fields as in the notes) under (vsatp.MODE, hgatp.MODE) in {BARE_PAIR, PAGED_PAIR}:
      For each A_upper_bits in the 5 tag patterns:
      Set A = A' with upper bits replaced by A_upper_bits
       jalr to A, sigupd(result) + record any traps.
    expectation: |-
      No masking for any henvcfg.PMM.  Tag 0x0000 reaches the code at A' (the control).  Every other tag is fetched
      unmasked: instruction page fault (vsatp paged), instruction guest-page fault (vsatp = Bare, hgatp paged), or
      instruction access fault (hgatp Bare), including a fetch that reaches a non-executable alias page.
    bins: |-
      priv_mode VS x jalr x henvcfg.PMM {00, 10, 11} x tag {5 patterns} x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_not_apply_implicit
  - name: cp_vu_pmm_jalr
    goal: Pointer masking never applies to instruction fetch, so a JALR through a tagged pointer in VU-mode is not masked
    description: |-
      Same test environment and loop as cp_vs_pmm_jalr, except:
       - the field under test is senvcfg.PMM;
       - the VS-stage code pages have PTE.U = 1;
       - the jalr runs in VU-mode.
    expectation: As cp_vs_pmm_jalr.
    bins: |-
      priv_mode VU x jalr x senvcfg.PMM {00, 10, 11} x tag {5 patterns} x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_not_apply_implicit
  - name: cp_vs_pmlen_misaligned_word
    goal: Pointer masking is applied to the address of a misaligned access in VS-mode
    description: |-
      Only the enabled PMM values and fully masked tags are used, as in cp_pmlen_misaligned_word of Ssnpm.  Whether a
      misaligned access reports a misaligned, page or access fault first is implementation-defined, so a faulting
      misaligned access has no single expected trap on a hart without misaligned support.

      Test Environment:
       In HS-mode, identity map the test image in both stages; the VS-stage data pages have PTE.U = 0.
       Place known value_old at pm_lo_page+1, which is misaligned for a word access.  Let A' = pm_lo_page+1.
       Set henvcfg.PMM and the other PMM fields as in the notes, then HFENCE.GVMA x0, x0 and HFENCE.VVMA x0, x0.
       Switch to VS-mode and execute the following loop:
      For each henvcfg.PMM in {10, 11} (outermost loop; the other PMM fields as in the notes) under (vsatp.MODE, hgatp.MODE) in {BARE_PAIR, PAGED_PAIR}:
      For A_upper_bits = 0x0400 (PMM 10) or 0xFFFF (PMM 11), a tag fully within PMLEN:
      Set A = A' with upper bits replaced by A_upper_bits
       lw from A, sigupd(value) + record any traps.
       sw unique value_new to A, then read back from A' (untagged), sigupd(value) + record any traps.
    expectation: |-
      No trap: masking is applied to the misaligned address before the access, so A and A' resolve to the same location,
      lw returns value_old and the readback returns value_new.  Misalignment does not interfere with pointer masking.
      A hart without misaligned support instead takes a load or store address-misaligned or access-fault trap, which is
      not checked against a single expected trap.
    bins: |-
      priv_mode VS x {lw, sw} x misaligned (address + 1) x henvcfg.PMM {10, 11} x tag (PMM 10 {0x0400}, PMM 11 {0xFFFF}) x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_misaligned_equivalence
  - name: cp_vu_pmlen_misaligned_word
    goal: Pointer masking is applied to the address of a misaligned access in VU-mode
    description: |-
      Same test environment and loop as cp_vs_pmlen_misaligned_word, except:
       - the field under test is senvcfg.PMM;
       - the VS-stage data pages have PTE.U = 1;
       - the accesses run in VU-mode.
    expectation: As cp_vs_pmlen_misaligned_word, with the PMLEN of senvcfg.PMM.
    bins: |-
      priv_mode VU x {lw, sw} x misaligned (address + 1) x senvcfg.PMM {10, 11} x tag (PMM 10 {0x0400}, PMM 11 {0xFFFF}) x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_misaligned_equivalence
  - name: cp_vs_hardware_csr_writes_fault
    goal: Pointer masking is applied to the addresses that hardware writes to stval and htval on a faulting access in VS-mode
    description: |-
      When a fault occurs on an explicit memory access under pointer masking, the stval written by hardware holds the
      masked effective address, not the raw tagged address.  On a guest-page fault, htval holds the GPA of that address
      shifted right by 2.  htval is not an address on other faults (zero),
      so it is read on every fault and the signature records which case it was.

      Test Environment:
       In HS-mode, identity map the test image in both stages; the VS-stage data pages have PTE.U = 0.
       Set henvcfg.PMM and the other PMM fields as in the notes, then HFENCE.GVMA x0, x0 and HFENCE.VVMA x0, x0.
       Leave hedeleg clear and delegate the load and store access faults, page faults and guest-page faults to HS-mode with medeleg, so every fault is taken in HS-mode.
       Use two base addresses and construct the addresses by applying the tags below to each.  Only 0x0000 and fully
       masked tags are used, so the faulting address is valid and stval and htval are deterministic: on a guest-page
       fault htval is zero or the GPA shifted right by 2, and on any other fault htval is zero.
        - fault base: RVMODEL_ACCESS_FAULT_ADDRESS, if defined, identity mapped in both stages; the accesses take a
          load or store access fault.
        - guest-page-fault base: an address with no G-stage mapping (hgatp paged only); the accesses take a load or store
          guest-page fault.
       Switch to VS-mode and execute the following loop:
      For each henvcfg.PMM in {10, 11} (outermost loop; the other PMM fields as in the notes) under (vsatp.MODE, hgatp.MODE) in {BARE_PAIR, PAGED_PAIR}:
      For each A_upper_bits in {0x0000, 0x0400} (PMM 10) or {0x0000, 0x0400, 0xFFFF} (PMM 11):
       lw from the constructed address, then sw to it.
       In the HS-mode trap handler, read stval and htval and sigupd both.
    expectation: |-
      A fault is taken in HS-mode.  stval holds the masked effective address (upper PMLEN bits zero-extended with
      vsatp = Bare, sign-extended with vsatp paged), not the tagged address the program used.
      Guest-page fault: htval is zero or the GPA of the masked address shifted right by 2.
      Any other fault: htval is zero.
    bins: |-
      priv_mode VS x {lw, sw} x base {fault, guest-page-fault (hgatp paged only)} x henvcfg.PMM {10, 11} x tag (PMM 10 {0x0000, 0x0400}, PMM 11 {0x0000, 0x0400, 0xFFFF}) x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_csr_hw_apply
      - pm_no_trap_vector_mask
  - name: cp_vu_hardware_csr_writes_fault
    goal: Pointer masking is applied to the addresses that hardware writes to stval and htval on a faulting access in VU-mode
    description: |-
      Same test environment and loop as cp_vs_hardware_csr_writes_fault, except:
       - the field under test is senvcfg.PMM;
       - the VS-stage data pages have PTE.U = 1;
       - the accesses run in VU-mode.
    expectation: As cp_vs_hardware_csr_writes_fault, with the PMLEN of senvcfg.PMM.
    bins: |-
      priv_mode VU x {lw, sw} x base {fault, guest-page-fault (hgatp paged only)} x senvcfg.PMM {10, 11} x tag (PMM 10 {0x0000, 0x0400}, PMM 11 {0x0000, 0x0400, 0xFFFF}) x (vsatp, hgatp) {BARE_PAIR, PAGED_PAIR}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; each vsatp and hgatp mode only when supported
    rules:
      - pm_csr_hw_apply
      - pm_no_trap_vector_mask
  - name: cp_henvcfg_pmm_change_hfence
    goal: After henvcfg.PMM changes to or from a PMLEN where (XLEN - PMLEN) < GPA width, HFENCE.GVMA x0 makes VS-mode accesses follow the new PMLEN
    description: |-
      In these cases some GPA bits are also masked bits, so the hart may keep TLB entries that are wrong after the
      PMM change.  The hypervisor must execute HFENCE.GVMA with rs1 = x0; this test checks that no stale entry is used
      after that fence.

      Test Environment:
       vsatp = Bare.  senvcfg.PMM = hstatus.HUPMM = 00.  A' = pm_lo_page, pre-loaded with value_old.
       Ti = A' with bits 63:48 replaced by the tag:
         Case 1: PMLEN 7  (PMM = 10), hgatp = Sv57x4    tags {0x0400}           (bit 58)
         Case 2: PMLEN 16 (PMM = 11), hgatp = Sv57x4    tags {0x0002, 0x0400}   (bits 49, 58)
         Case 3: PMLEN 16 (PMM = 11), hgatp = Sv48x4    tags {0x0002}           (bit 49)
         Case 4: PMLEN 7 <-> PMLEN 16 (PMM = 10 <-> 11), hgatp = Sv57x4    tags {0x0002}   (bit 49)
       In the G stage, identity map the test image and map each Ti to its own page alias_i (pre-loaded with
       value_alias_i), so an unmasked access to Ti succeeds and is cached instead of faulting.

      For each case, for each direction {00 -> PMM, PMM -> 00}; for case 4, {10 -> 11, 11 -> 10}:
       1. In HS-mode set henvcfg.PMM = old, HFENCE.GVMA x0, x0.  In VS-mode: ld from each Ti, sigupd(value).
       2. In HS-mode set henvcfg.PMM = new, HFENCE.GVMA x0, x0.
       3. In VS-mode: ld from each Ti, sigupd(value).
       4. In VS-mode: sd value_new to each Ti, read back A' and alias_i untagged, sigupd(value); restore both.
    expectation: |-
      No traps.  PMM = 00: Ti reaches alias_i (value_alias_i).  PMM = 10/11: Ti reaches A' (value_old).
      Case 4: bit 49 is masked by PMLEN 16 only, so PMM = 10 reaches alias_i and PMM = 11 reaches A'.
      So step 3 always differs from step 1; getting the step 1 value again means a stale entry survived the fence.
    bins: |-
      priv_mode VS x {ld, sd} x case {1, 2, 3, 4} x direction (cases 1-3 {00 -> PMM, PMM -> 00}, case 4 {10 -> 11, 11 -> 10}) x tag (case 1 {0x0400}, case 2 {0x0002, 0x0400}, case 3 {0x0002}, case 4 {0x0002})
      Each case only when its PMLEN and hgatp mode are supported (case 4 needs both PMLEN 7 and 16)
    rules:
      - henvcfg_pmm_op
    notes: The HFENCE.GVMA paragraph (hypervisor.adoc, Interaction with Pointer Masking) has no normative tag.
  - name: cp_hupmm_change_hfence
    goal: After hstatus.HUPMM changes to or from a PMLEN where (XLEN - PMLEN) < GPA width, HFENCE.GVMA x0 makes HLV/HSV in U-mode follow the new PMLEN
    description: |-
      Same test environment, cases, addresses and steps as cp_henvcfg_pmm_change_hfence, except:
       - the field changed is hstatus.HUPMM, with henvcfg.PMM = senvcfg.PMM = 00;
       - hstatus.HU = 1 and hstatus.SPVP = 0;
       - the accesses run in U-mode, with hlv.d in place of ld and hsv.d in place of sd.
    expectation: Same as cp_henvcfg_pmm_change_hfence, with hstatus.HUPMM in place of henvcfg.PMM.
    bins: |-
      priv_mode U x hstatus.HU = 1 x hstatus.SPVP = 0 x {hlv.d, hsv.d} x case {1, 2, 3, 4} x direction (cases 1-3 {00 -> HUPMM, HUPMM -> 00}, case 4 {10 -> 11, 11 -> 10}) x tag (case 1 {0x0400}, case 2 {0x0002, 0x0400}, case 3 {0x0002}, case 4 {0x0002})
      Each case only when its PMLEN and hgatp mode are supported (case 4 needs both PMLEN 7 and 16)
    rules:
      - pm_mprv_spvp
    notes: The HUPMM paragraph and the HFENCE.GVMA paragraph have no normative tags.
  - name: cp_henvcfg_pmm_change_no_hfence
    goal: After henvcfg.PMM changes in a case the HFENCE.GVMA rule does not list, VS-mode accesses follow the new PMLEN without any HFENCE
    description: |-
      The spec requires HFENCE.GVMA only when (XLEN - PMLEN) < GPA width, where a masked bit can also be a GPA bit.
      Otherwise the masked bits are never part of a translation, so the new PMLEN must take effect with no fence.
      This is the twin of cp_henvcfg_pmm_change_hfence with every HFENCE after the PMM change removed.

      Test Environment:
       senvcfg.PMM = hstatus.HUPMM = 00.  A' = pm_lo_page, pre-loaded with value_old.
       Ti = A' with bits 63:48 replaced by the tag:
         Case 1: vsatp = Bare, hgatp = Sv39x4, PMLEN 7  (PMM = 10)   tags {0x0400}          (bit 58)
         Case 2: vsatp = Bare, hgatp = Sv39x4, PMLEN 16 (PMM = 11)   tags {0x0002, 0x0400}  (bits 49, 58)
         Case 3: vsatp = Bare, hgatp = Sv48x4, PMLEN 7  (PMM = 10)   tags {0x0400}          (bit 58)
         Case 4: vsatp = Sv57, hgatp = Sv57x4, PMLEN 7  (PMM = 10)   tags {0x0400}          (bit 58)
         Case 5: vsatp = Sv57, hgatp = Sv57x4, PMLEN 16 (PMM = 11)   tags {0x0002, 0x0400}  (bits 49, 58)
       Cases 1 to 3: no G-stage mapping exists for Ti, so an unmasked access to Ti faults.
       Cases 4 and 5: the VS stage maps the canonical Ti (tag 0x0002) to its own page alias_i (pre-loaded with
       value_alias_i), so an unmasked access succeeds and is cached.  Tag 0x0400 is non-canonical in Sv57 and faults.

      For each case, for each direction {00 -> PMM, PMM -> 00}:
       1. In HS-mode set henvcfg.PMM = old, then HFENCE.GVMA x0, x0 and HFENCE.VVMA x0, x0 (setup only).
          In VS-mode: ld from each Ti, sigupd(value) + record any traps.
       2. In HS-mode set henvcfg.PMM = new.  Execute no HFENCE.GVMA, HFENCE.VVMA or SFENCE.VMA.
       3. In VS-mode: ld from each Ti, sigupd(value) + record any traps.
       4. In VS-mode: sd value_new to each Ti, read back A' (and alias_i where mapped) untagged, sigupd(value) + record
          any traps; restore.
    expectation: |-
      PMM = 00: Ti is used unmasked (a fault, or alias_i for tag 0x0002 in case 5).  PMM = 10/11 with the tag within
      PMLEN: Ti reaches A' (value_old), no trap.  Step 3 follows the new PMM.  Getting the step 1 result again
      means the hart kept a translation keyed by the old PMLEN.
    bins: |-
      priv_mode VS x {ld, sd} x case {1, 2, 3, 4, 5} x direction {00 -> PMM, PMM -> 00} x tag (case 1 {0x0400}, case 2 {0x0002, 0x0400}, case 3 {0x0400}, case 4 {0x0400}, case 5 {0x0002, 0x0400})
      Each case only when its PMLEN and vsatp and hgatp modes are supported
    rules:
      - henvcfg_pmm_op
    notes: The HFENCE.GVMA paragraph (hypervisor.adoc, Interaction with Pointer Masking) lists only the cases of cp_henvcfg_pmm_change_hfence.
  - name: cp_pmm_vsxl_clear
    goal: Setting hstatus.VSXL = 01 (RV32 VS-mode) clears henvcfg.PMM
    description: |-

      Test Environment:
       In HS-mode, with hstatus.VSXL = 10 (RV64):
       1. Write henvcfg.PMM = {10, 11}, read it back, sigupd(value).
       2. Write hstatus.VSXL = 01, read henvcfg.PMM, sigupd(value).
       3. Write hstatus.VSXL = 10, read henvcfg.PMM, sigupd(value).
    expectation: |-
      Step 1 reads back the value written.  Step 2 reads henvcfg.PMM = 00.  Step 3 reads henvcfg.PMM = 00, because
      returning VSXL to RV64 does not restore the previous PMM.  The write to hstatus.VSXL does not trap.
    bins: |-
      priv_mode HS x henvcfg.PMM {10, 11} x hstatus.VSXL {01, then 10}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; only when hstatus.VSXL = 01 is writable
    rules:
      - pm_uxl_clear
      - pmlen_illegal_warl
  - name: cp_pmm_vsuxl_clear
    goal: Setting vsstatus.UXL = 01 (RV32 VU-mode) clears senvcfg.PMM
    description: |-
      vsstatus.UXL gives the XLEN of VU-mode, and senvcfg.PMM is the field
      that masks VU-mode.  Gated on vsstatus.UXL being writable.

      Test Environment:
       With hstatus.VSXL = 10 and vsstatus.UXL = 10 (RV64):
       1. Write senvcfg.PMM = {10, 11}, read it back, sigupd(value).
       2. Write vsstatus.UXL = 01, read senvcfg.PMM, sigupd(value).
       3. Write vsstatus.UXL = 10, read senvcfg.PMM, sigupd(value).
    expectation: |-
      Step 1 reads back the value written.  Step 2 reads senvcfg.PMM = 00.  Step 3 reads senvcfg.PMM = 00.  The write
      to vsstatus.UXL does not trap.
    bins: |-
      writer {HS-mode (csrw vsstatus), VS-mode (csrw sstatus)} x senvcfg.PMM {10, 11} x vsstatus.UXL {01, then 10}
      PMM 10 and 11 only when PMLEN 7 and 16 are supported; only when vsstatus.UXL = 01 is writable
    rules:
      - pm_uxl_clear
      - pmlen_illegal_warl
  - name: |-
      cp_henvcfg_pmm_rsv
      cp_hstatus_hupmm_rsv
    goal: Verify that the reserved PMM = 01 is never stored in henvcfg.PMM or hstatus.HUPMM.
    description: |-
      In HS-mode with vsatp and hgatp Bare: csrrw henvcfg with PMM = 01, and csrrw hstatus with HUPMM = 01, each with
      the other bits unchanged; read the field back and record whether it is 00 or a supported value. Then write
      henvcfg.PMM = 01 again and, with hstatus.SPVP = 1, hlv.d through an untagged pointer.
    expectation: Each field reads back 00 or a supported value. hlv.d returns the seeded value.
    bins: 2 (henvcfg.PMM, hstatus.HUPMM)
    rules:
      - henvcfg_pmm_op
      - pmlen_illegal_warl
