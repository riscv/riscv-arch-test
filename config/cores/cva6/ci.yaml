# CI configuration for the cva6 family (only cv64a6_imafdcv_sv39 is runnable)

ci_enabled: true

# pulp-platform/ara @ 34bd3bc, cva6 @ 99eac9a:
#   Vx*, Vls*       vfirst.m and vcpop.m ignore vl, so the vector self-check fails; vrgather,
#                   vrgatherei16, vmadc, vmsbc and vcompress tests hang.
#   S, U, SmF, SmVF, Sstvala, Sstvecd, Ssu64xl, ZicsrF
#                   sstatus.VS reads as 0 (the S-mode status read mask omits VS).
#   UV, SmV         the acc_dispatcher "Too many pending stores" assertion aborts the
#                   simulation; SmV also: vsetvl with vill set in rs2 returns vl = 1.
#   Exceptions{F,S,Sm,Sv,U,Zc}
#                   PMP entries are tied to zero, so no data access fault can be raised; an
#                   access to an undecoded address deadlocks. ExceptionsSm does not build
#                   (riscv/riscv-arch-test#2457 item A2, fixed by #2460).
#   D, F            wrong fflags or results in fdiv, fsqrt, fused multiply-add and
#                   fcvt.d.s/fcvt.s.d (e.g. fcvt.d.s of +inf sets NX).
#   Sm              mstatus WPRI bits 38..62 are writable; mstatus.SD ignores mstatus.VS.
#   Sv, Svade       sstatus.VS reads as 0; a non-leaf PTE with A, D or U set does not fault.
#   ExceptionsSvSm  misaligned mprv loads trip a load_unit assertion; medeleg tests record
#                   mstatus.SPIE = 0 where the model has 1.
#   InterruptsS, InterruptsSm
#                   all interrupt pins are tied to zero.
exclude_extensions: "Vx8,Vx16,Vx32,Vx64,Vls8,Vls16,Vls32,Vls64,S,U,UV,SmF,SmVF,Sstvala,Sstvecd,Ssu64xl,ZicsrF,ExceptionsF,ExceptionsS,ExceptionsSm,ExceptionsSv,ExceptionsU,ExceptionsZc,D,F,Sm,Sv,Svade,ExceptionsSvSm,InterruptsS,InterruptsSm,SmV"

apt_packages: "autoconf flex bison help2man libfl-dev ccache libelf-dev"
install_script: ".github/scripts/install-ara.sh"
setup_script: ".github/scripts/setup-ara.sh"
