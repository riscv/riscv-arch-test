# CI configuration for the CHIPS Alliance VeeR EL2 core

ci_enabled: true

# Cores-VeeR-EL2 @ 925f3a34, https://github.com/chipsalliance/Cores-VeeR-EL2/blob/925f3a34/
exclude_extensions:
  # mstatus.TW is read-only 0; writes to cycle do not trap: design/dec/el2_dec_tlu_ctl.sv#L2919-L2926
  - Sm_csr_ro
  - Sm_mcsr_access
  - Sm_mcsr_walk
  # mtval lacks the encoding for U-mode mret and CSR privilege traps: design/dec/el2_dec_tlu_ctl.sv#L1889
  - U
  # Testbench: stores never reach instruction memory, so a jump to stored code fetches stale data
  - PMP_Sm_cfg_A_tor_zero
  # mtval is 0, not the encoding, for a U-mode CSR privilege trap: design/dec/el2_dec_tlu_ctl.sv#L1889
  - PMP_U_csr
  # PMP checks only a fetch's start, missing a non-executable second half: design/el2_veer.sv#L1097
  - PMP_Zca_misaligned_na4
  - PMP_Zca_misaligned_napot
  - PMP_Zca_misaligned_tor
  # Testbench: stores never reach instruction memory, so fence.i fetches stale code
  - Zifencei
  # FENCE with a reserved fm raises an illegal instruction: design/dec/decode#L229
  - I-fence

apt_packages: "autoconf flex bison help2man libfl-dev ccache"
install_script: ".github/scripts/install-veer-el2.sh"
setup_script: ".github/scripts/setup-veer-el2.sh"
