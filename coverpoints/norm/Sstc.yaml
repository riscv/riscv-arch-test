normative_rule_definitions:
  # This extension adds the S-level stimecmp CSR
  - name: stimecmp_exist
    coverpoint: ["Sstc_cg/{cp_supervisor_stce, cp_supervisor_tm}"]
  # This extension adds the STCE bit to the menvcfg and henvcfg CSRs.
  - name: stce_bit_exist
    coverpoint:
      [
        "Sstc_cg/{cp_supervisor_stce, cp_user_stce}",
        "SstcH_vs_cg/cp_vs_stimecmp_accessible (henvcfg.STCE)",
      ]

  # The Sstc extension adds the STCE (STimecmp Enable) bit to menvcfg CSR.
  - name: menvcfg_stce_exists
    coverpoint: ["Sstc_cg/cp_{supervisor,user}_stce.  See also SstcH"]
  # When the Sstc extension is not implemented, STCE is read-only zero.
  - name: menvcfg_stce_rdonly0
    coverpoint: ["Sstc_cg/cp_{supervisor,user}_stce.  See also SstcH"]
  # The STCE bit enables stimecmp for S-mode when set to one.
  - name: menvcfg_stce_enable_op
    coverpoint: ["Sstc_cg/cp_{supervisor,user}_stce.  See also SstcH"]
  # When this extension is implemented and STCE in menvcfg is zero, an attempt to access
  # stimecmp or vstimecmp in a mode other than M-mode raises an illegal-instruction
  # exception, STCE in henvcfg is read-only zero, and STIP in mip and sip reverts to its
  # defined behavior as if this extension is not implemented.
  - name: menvcfg_stce_zero_op
    coverpoint: ["Sstc_cg/cp_{supervisor,user}_stce.  See also SstcH"]
  # Further, if the H extension is implemented, then hip.VSTIP also reverts its defined
  # behavior as if this extension is not implemented.
  - name: menvcfg_stce_zero_vstip
    coverpoint: ["Sstc_cg/cp_{supervisor,user}_stce.  See also SstcH"]

  # when the TM bit in the mcounteren register is clear, attempts to access the
  # stimecmp or vstimecmp register while executing in a mode less privileged than M
  # will cause an illegal-instruction exception.
  - name: mcounteren_tm_clr
    coverpoint: ["Sstc_cg/cp_{supervisor,user}_tm, see also SstcH"]

  # When this bit is set, access to the stimecmp or vstimecmp register is permitted
  # in S-mode if implemented, and access to the vstimecmp register (via stimecmp) is
  # permitted in VS-mode if implemented and not otherwise prevented by the TM bit in
  # hcounteren.
  - name: mcounteren_tm_set
    coverpoint: ["Sstc_cg/cp_{supervisor,user}_tm, see also SstcH"]

  # A supervisor timer interrupt becomes pending, as reflected in the STIP bit in the mip
  # and sip registers whenever time contains a value greater than or equal to stimecmp,
  # treating the values as unsigned integers. If the result of this comparison changes, it
  # is guaranteed to be reflected in STIP eventually, but not necessarily immediately. The
  # interrupt remains posted until stimecmp becomes greater than time, typically as a
  # result of writing stimecmp. The interrupt will be taken based on the standard
  # interrupt enable and delegation rules.
  - name: mip_sip_stip_op
    coverpoint: ["InterruptsSm_cg/cp_trigger_sti_sstc"]
  # Bits sip.STIP and sie.STIE are the interrupt-pending and interrupt-enable bits for
  # supervisor-level timer interrupts. If implemented, STIP is read-only in sip. When the
  # Sstc extension is not implemented, STIP is set and cleared by the execution
  # environment. When the Sstc extension is implemented, STIP reflects the timer interrupt
  # signal resulting from stimecmp. The sip.STIP bit, in response to timer interrupts
  # generated by stimecmp, is set by writing stimecmp with a value that is less than or
  # equal to time, and is cleared by writing stimecmp with a value greater than time.
  - name: sip_stip_sie_stie
    coverpoint: ["InterruptsSm_cg/cp_trigger_sti_sstc"]
