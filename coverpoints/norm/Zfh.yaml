      ]
  # Rounding Mode|Mnemonic|Meaning === 000|RNE|Round to Nearest, ties to
  # Even¶001|RTZ|Round towards Zero¶010|RDN|Round Down (towards −∞)¶011|RUP|Round Up
  # (towards +∞)¶100|RMM|Round to Nearest, ties to Max Magnitude¶101||Reserved for future
  # use.¶110||Reserved for future use.¶111|DYN|In instruction&#8217;s rm field, selects
  # dynamic rounding mode; In Rounding Mode register, reserved. ===
  - name: dyn_round_enc
    coverpoint:
      [
        "Zfh_fadd_h_cg/{cp_fs1, cp_fs2, cp_fd, cp_frm_3, cp_csr_fflags_von, cp_csr_frm, cr_fs1_fs2_edges_frm_H, cp_NaNBox_S_H, cp_fs1_badNB_S_H, cp_fs2_badNB_S_H}",
        "Zfh_fcvt_h_l_cg/{cp_rs1, cp_rs1_edges, cp_fd, cp_frm_2, cp_csr_fflags_on, cp_csr_frm, cp_NaNBox_S_H}",
