# yaml-language-server: $schema=testplan.schema.json
suite: Ss1p13
source: https://docs.google.com/spreadsheets/d/10NX0T4MgueqA4p7JNg4whCq2k3YZ9R73UCV88MtcIUA/edit?gid=108970394#gid=108970394
coverpoints:
  - name: cp_sxlen_ge_uxlen
    goal: sxlen >= uxlen, and UXL is WARL
    description: On RV64, from S-mode, write sstatus.UXL = (0, 1, 2, 3) and read UXL back.  Not gated on Ss1p13, because UXL is a WARL field encoding UXLEN in Priv 1.12 too.
    expectation: UXL reads 2 when UXLEN is fixed at 64, and 1 or 2 (a legal UXLEN no larger than SXLEN) otherwise
    bins: "4"
    rules:
      - mstatus_uxl_legal_vals_smode
  - name: cp_scause
    goal: scause accepts sofware-check and hardware error
    description: Write scause = 18, 19, read back
    expectation: Match ref model
    bins: "2"
    notes: |-
      NOTE : Already covered in cp_scause_write_exception
  - heading: "NOTE : Tests and coverage files are under the S.py and S_coverage.svh respectively; cp_sxlen_ge_uxlen runs on every RV64 S-mode hart"
