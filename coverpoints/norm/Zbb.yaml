# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  - name: bitmanip_w_suffix_semantics
    # Representative coverpoints; also Zbb_ctzw_cg, Zbb_rorw_cg and the Zbkb W forms
    coverpoint:
      [
        "Zbb_clzw_cg/cp_rs1_edges_walkonew",
        "Zbb_cpopw_cg/cp_rs1_edges_walkmaskw",
        "Zbb_rolw_cg/cr_rs1_rs2_edges",
        "Zbb_roriw_cg/cr_rs1_imm_edges_uimmw",
      ]

  - name: bitmanip_bhw_suffix_semantics
    coverpoint:
      [
        "Zbb_orc_b_cg/cp_rs1_edges_orcb",
        "{Zbb_sext_b_cg, Zbb_sext_h_cg}/cp_rs1_edges",
      ]

  - name: B_extension_composition
    coverpoint: ["Definition, checked through UDB"]

  - name: Zbb_sign_zero_extension_function
    coverpoint: ["{Zbb_sext_b_cg, Zbb_sext_h_cg, Zbb_zext_h_cg}/cp_rs1_edges"]

  - name: Zbb_rotate_semantics
    # Representative coverpoints; also the W forms
    coverpoint:
      [
        "{Zbb_rol_cg, Zbb_ror_cg}/cr_rs1_rs2_edges",
        "Zbb_rori_cg/cr_rs1_imm_edges_uimm",
      ]

  - name: Zbb_orc-b_semantics
    coverpoint: ["Zbb_orc_b_cg/cp_rs1_edges_orcb"]

  - name: andn_enc
    coverpoint: ["Zbb_andn_cg/cr_rs1_rs2_edges"]

  - name: andn_op
    coverpoint: ["Zbb_andn_cg/cr_rs1_rs2_edges"]

  - name: clz_enc
    coverpoint: ["Zbb_clz_cg/cp_rs1_edges_walkone"]

  - name: clz_op
    coverpoint: ["Zbb_clz_cg/cp_rs1_edges_walkone"]

  - name: clzw_enc
    coverpoint: ["Zbb_clzw_cg/cp_rs1_edges_walkonew"]

  - name: clzw_op
    coverpoint: ["Zbb_clzw_cg/cp_rs1_edges_walkonew"]

  - name: cpop_enc
    coverpoint: ["Zbb_cpop_cg/cp_rs1_edges_walkmask"]

  - name: cpop_op
    coverpoint: ["Zbb_cpop_cg/cp_rs1_edges_walkmask"]

  - name: cpopw_enc
    coverpoint: ["Zbb_cpopw_cg/cp_rs1_edges_walkmaskw"]

  - name: cpopw_op
    coverpoint: ["Zbb_cpopw_cg/cp_rs1_edges_walkmaskw"]

  - name: ctz_enc
    coverpoint: ["Zbb_ctz_cg/cp_rs1_edges_walkone"]

  - name: ctz_op
    coverpoint: ["Zbb_ctz_cg/cp_rs1_edges_walkone"]

  - name: ctzw_enc
    coverpoint: ["Zbb_ctzw_cg/cp_rs1_edges_walkonew"]

  - name: ctzw_op
    coverpoint: ["Zbb_ctzw_cg/cp_rs1_edges_walkonew"]

  - name: max_enc
    coverpoint: ["Zbb_max_cg/cr_rs1_rs2_edges"]

  - name: max_op
    coverpoint: ["Zbb_max_cg/cr_rs1_rs2_edges"]

  - name: maxu_enc
    coverpoint: ["Zbb_maxu_cg/cr_rs1_rs2_edges"]

  - name: maxu_op
    coverpoint: ["Zbb_maxu_cg/cr_rs1_rs2_edges"]

  - name: min_enc
    coverpoint: ["Zbb_min_cg/cr_rs1_rs2_edges"]

  - name: min_op
    coverpoint: ["Zbb_min_cg/cr_rs1_rs2_edges"]

  - name: minu_enc
    coverpoint: ["Zbb_minu_cg/cr_rs1_rs2_edges"]

  - name: minu_op
    coverpoint: ["Zbb_minu_cg/cr_rs1_rs2_edges"]

  - name: orc-b_enc
    coverpoint: ["Zbb_orc_b_cg/cp_rs1_edges_orcb"]

  - name: orc-b_op
    coverpoint: ["Zbb_orc_b_cg/cp_rs1_edges_orcb"]

  - name: orn_enc
    coverpoint: ["Zbb_orn_cg/cr_rs1_rs2_edges"]

  - name: orn_op
    coverpoint: ["Zbb_orn_cg/cr_rs1_rs2_edges"]

  # Encoding (RV32)
  - name: rev8_rv32_enc
    coverpoint: ["Zbb_rev8_cg/cp_rs1_edges"]
  # Encoding (RV64)
  - name: rev8_rv64_enc
    coverpoint: ["Zbb_rev8_cg/cp_rs1_edges"]

  - name: rev8_op
    coverpoint: ["Zbb_rev8_cg/cp_rs1_edges"]

  - name: rol_enc
    coverpoint: ["Zbb_rol_cg/cr_rs1_rs2_edges"]

  - name: rol_op
    coverpoint: ["Zbb_rol_cg/cr_rs1_rs2_edges"]

  - name: rolw_enc
    coverpoint: ["Zbb_rolw_cg/cr_rs1_rs2_edges"]

  - name: rolw_op
    coverpoint: ["Zbb_rolw_cg/cr_rs1_rs2_edges"]

  - name: ror_enc
    coverpoint: ["Zbb_ror_cg/cr_rs1_rs2_edges"]

  - name: ror_op
    coverpoint: ["Zbb_ror_cg/cr_rs1_rs2_edges"]

  # Encoding (RV32)
  - name: rori_rv32_enc
    coverpoint: ["Zbb_rori_cg/cr_rs1_imm_edges_uimm"]
  # Encoding (RV64)
  - name: rori_rv64_enc
    coverpoint: ["Zbb_rori_cg/cr_rs1_imm_edges_uimm"]

  - name: rori_op
    coverpoint: ["Zbb_rori_cg/cr_rs1_imm_edges_uimm"]

  - name: roriw_enc
    coverpoint: ["Zbb_roriw_cg/cr_rs1_imm_edges_uimmw"]

  - name: roriw_op
    coverpoint: ["Zbb_roriw_cg/cr_rs1_imm_edges_uimmw"]

  - name: rorw_enc
    coverpoint: ["Zbb_rorw_cg/cr_rs1_rs2_edges"]

  - name: rorw_op
    coverpoint: ["Zbb_rorw_cg/cr_rs1_rs2_edges"]

  - name: sext-b_enc
    coverpoint: ["Zbb_sext_b_cg/cp_rs1_edges"]

  - name: sext-b_op
    coverpoint: ["Zbb_sext_b_cg/cp_rs1_edges"]

  - name: sext-h_enc
    coverpoint: ["Zbb_sext_h_cg/cp_rs1_edges"]

  - name: sext-h_op
    coverpoint: ["Zbb_sext_h_cg/cp_rs1_edges"]

  - name: xnor_enc
    coverpoint: ["Zbb_xnor_cg/cr_rs1_rs2_edges"]

  - name: xnor_op
    coverpoint: ["Zbb_xnor_cg/cr_rs1_rs2_edges"]

  # Encoding (RV32)
  - name: zext-h_rv32_enc
    coverpoint: ["Zbb_zext_h_cg/cp_rs1_edges"]
  # Encoding (RV64)
  - name: zext-h_rv64_enc
    coverpoint: ["Zbb_zext_h_cg/cp_rs1_edges"]

  - name: zext-h_op
    coverpoint: ["Zbb_zext_h_cg/cp_rs1_edges"]

  # RV32|RV64|Mnemonic|Instruction === ✓|✓|insn:andn[rd,rs1,rs2]|&lt;&lt;insns-
  # andn&gt;&gt;¶✓|✓|insn:orn[rd,rs1,rs2]|&lt;&lt;insns-
  # orn&gt;&gt;¶✓|✓|insn:xnor[rd,rs1,rs2]|&lt;&lt;insns-xnor&gt;&gt; ===
  - name: Zbb_logical_insns_tbl
    coverpoint: ["Zbb_{andn,orn,xnor}_cg/cp_asm_count"]

  # RV32|RV64|Mnemonic|Instruction === ✓|✓|insn:clz[rd,rs]|&lt;&lt;insns-
  # clz&gt;&gt;¶|✓|insn:clzw[rd,rs]|&lt;&lt;insns-clzw&gt;&gt;¶✓|✓|insn:ctz[rd,rs]|&lt;&lt;insns-
  # ctz&gt;&gt;¶|✓|insn:ctzw[rd,rs]|&lt;&lt;insns-ctzw&gt;&gt; ===
  - name: Zbb_count_zeros_insns_tbl
    coverpoint: ["Zbb_{clz,clzw,ctz,ctzw}_cg/cp_asm_count"]

  # RV32|RV64|Mnemonic|Instruction === ✓|✓|insn:cpop[rd,rs]|&lt;&lt;insns-
  # cpop&gt;&gt;¶|✓|insn:cpopw[rd,rs]|&lt;&lt;insns-cpopw&gt;&gt; ===
  - name: Zbb_cpop_insns_tbl
    coverpoint: ["Zbb_{cpop,cpopw}_cg/cp_asm_count"]

  # RV32|RV64|Mnemonic|Instruction === ✓|✓|insn:max[rd,rs1,rs2]|&lt;&lt;insns-
  # max&gt;&gt;¶✓|✓|insn:maxu[rd,rs1,rs2]|&lt;&lt;insns-
  # maxu&gt;&gt;¶✓|✓|insn:min[rd,rs1,rs2]|&lt;&lt;insns-
  # min&gt;&gt;¶✓|✓|insn:minu[rd,rs1,rs2]|&lt;&lt;insns-minu&gt;&gt; ===
  - name: Zbb_min_max_insns_tbl
    coverpoint: ["Zbb_{min,minu,max,maxu}_cg/cp_asm_count"]

  # RV32|RV64|Mnemonic|Instruction === ✓|✓|insn:sext.b[rd,rs]|&lt;&lt;insns-
  # sext_b&gt;&gt;¶✓|✓|insn:sext.h[rd,rs]|&lt;&lt;insns-
  # sext_h&gt;&gt;¶✓|✓|insn:zext.h[rd,rs]|&lt;&lt;insns-zext_h&gt;&gt; ===
  - name: Zbb_sext_zext_insns_tbl
    coverpoint: ["Zbb_{sext_b,sext_h,zext_h}_cg/cp_asm_count"]

  # RV32|RV64|Mnemonic|Instruction === ✓|✓|insn:rol[rd,rs1,rs2]|&lt;&lt;insns-
  # rol&gt;&gt;¶|✓|insn:rolw[rd,rs1,rs2]|&lt;&lt;insns-
  # rolw&gt;&gt;¶✓|✓|insn:ror[rd,rs1,rs2]|&lt;&lt;insns-
  # ror&gt;&gt;¶✓|✓|insn:rori[rd,rs1,shamt]|&lt;&lt;insns-
  # rori&gt;&gt;¶|✓|insn:roriw[rd,rs1,shamt]|&lt;&lt;insns-
  # roriw&gt;&gt;¶|✓|insn:rorw[rd,rs1,rs2]|&lt;&lt;insns-rorw&gt;&gt; ===
  - name: Zbb_rotate_insns_tbl
    coverpoint: ["Zbb_{rol,rolw,ror,rorw,rori,roriw}_cg/cp_asm_count"]

  # RV32|RV64|Mnemonic|Instruction === ✓|✓|insn:orc.b[rd,rs]|&lt;&lt;insns-orc_b&gt;&gt; ===
  - name: Zbb_orc-b_insns_tbl
    coverpoint: ["Zbb_{orc_b}_cg/cp_asm_count"]
