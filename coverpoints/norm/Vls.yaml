# Mapping of normative rules to coverpoints for a test suite

normative_rule_definitions:
  # Vector loads and stores move values between vector registers and memory.
  - name: vector_load_store_semantics
    # Representative coverpoints; cr_vl_lmul in every Vls covergroup
    coverpoint:
      [
        "Vls8_vle8_v_cg/cr_vl_lmul_e8_sew8",
        "Vls8_vse8_v_cg/cr_vl_lmul_e8_sew8",
        "Vls64_vle64_v_cg/cr_vl_lmul_e64_sew64",
        "Vls64_vse64_v_cg/cr_vl_lmul_e64_sew64",
      ]

  # Vector loads and stores can be masked, and they only access memory or raise exceptions for
  # active elements.
  - name: vector_masked_memory_access
    # Representative coverpoints; cp_masking_edges in every maskable Vls covergroup
    coverpoint:
      [
        "Vls8_vle8_v_cg/cp_masking_edges",
        "Vls8_vse8_v_cg/cp_masking_edges",
        "TODO: masked store leaves inactive memory unchanged; masked-off faulting element does not trap",
      ]

  # Masked vector loads do not update inactive elements in the destination vector register group,
  # unless masked agnostic is specified (vtype.vma=1).
  - name: vector_masked_inactive_behavior
    # Representative coverpoints; cr_vtype_agnostic in every maskable Vls load covergroup
    coverpoint:
      [
        "Vls8_vle8_v_cg/cr_vtype_agnostic_e8",
        "Vls16_vle16_v_cg/cr_vtype_agnostic_e16",
        "Vls32_vle32_v_cg/cr_vtype_agnostic_e32",
        "Vls64_vle64_v_cg/cr_vtype_agnostic_e64",
      ]
