# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # If the Sstvecd extension is implemented, then stvec.MODE must be capable of
  # holding the value 0 (Direct).
  # S also writes stvec only with MODE = Direct: its address walks cover this too.
  - name: Sstvecd_stvec_mode_direct
    coverpoint:
      [
        "Sstvecd_cg/cp_stvec_mode",
        "S_scsr_cg/cp_stvec_vaddr_walk1",
        "S_scsr_cg/cp_stvec_vaddr_walk0",
      ]

  # Furthermore, when stvec.MODE=Direct, stvec.BASE must be capable of holding any
  # valid four-byte-aligned address.
  # S walks every valid virtual address (walk1/walk0) and writes two known-valid physical
  # addresses (pc: the address of the code being executed; scratch: an address in the
  # test's scratch data area).
  - name: Sstvecd_stvec_base_aligned_address
    coverpoint:
      [
        "Sstvecd_cg/cp_stvec_mode",
        "S_scsr_cg/cp_stvec_vaddr_walk1",
        "S_scsr_cg/cp_stvec_vaddr_walk0",
        "S_scsr_cg/cp_stvec_vaddr_pc",
        "S_scsr_cg/cp_stvec_vaddr_scratch",
      ]
