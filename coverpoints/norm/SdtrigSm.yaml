  # trigger(s) fires. If the bit is not implemented, it is always 0 and writing it
  # has no effect.
  - name: Sdtrig_icount_hit
    coverpoint: ["Optional WARL field (hit/uncertain bits); not tested"]

  # When set, enable this trigger in M-mode.
  - name: Sdtrig_icount_m
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_instr"]

  # This bit becomes set when count is decremented from 1 to 0. It is cleared when
  # the trigger fires, which will happen just before executing the next instruction
  # in one of the enabled modes.
  - name: Sdtrig_icount_pending_set
    coverpoint: ["SdtrigSm_icount_cg/cp_sdtrig_icount_instr"]

  # When set, enable this trigger in S/HS-mode. This bit is hard-wired to 0 if the
