        "Exceptions_Zc_cg/cp_store_address_misaligned",
        "Exceptions_F_cg/cp_load_address_misaligned",
        "Exceptions_F_cg/cp_store_address_misaligned",
      ]
    effect:
      [
        "When true, misaligned loads and stores to main memory complete without a trap. When false, they raise an address-misaligned exception. At the access-fault address, true always gives an access fault.",
      ]
  - name: MISALIGNED_SPLIT_STRATEGY
