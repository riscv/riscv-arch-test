# UDB Architecture Configuration for LiteX's "imac" VexRiscv.
#
# The netlist is pythondata_cpu_vexriscv/verilog/VexRiscv_IMAC.v at
# litex-hub/pythondata-cpu-vexriscv commit 642ecfed1c84460555d6d803d660cc60cfc1ecb6, generated by
#   sbt compile "runMain vexriscv.GenCoreDefault --csrPluginConfig all --atomics true
#     --compressedGen true --outputFile VexRiscv_IMAC"
# (pythondata_cpu_vexriscv/verilog/Makefile#L24-L25). Below, GCD = that repository's
#   https://github.com/litex-hub/pythondata-cpu-vexriscv/blob/642ecfed1c84460555d6d803d660cc60cfc1ecb6/pythondata_cpu_vexriscv/verilog/
#   (src/main/scala/vexriscv/GenCoreDefault.scala, VexRiscv_IMAC.v), and VEX = the VexRiscv
#   source it builds, its ext/VexRiscv submodule:
#   https://github.com/SpinalHDL/VexRiscv/blob/b6118e5cc2a33323425df6455697139021d50c72/src/main/scala/vexriscv/
# The values were measured on the netlist with the UDB feature extractor and checked against
# the source; every value that is not the ordinary one says why.
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: vexriscv-imac
description: LiteX VexRiscv "imac" variant (GenCoreDefault --csrPluginConfig all --atomics true --compressedGen true) - RV32IMAC, machine mode only

# I with M (--mulDiv defaults to true: MulPlugin + DivPlugin, GCD GenCoreDefault.scala#L232-L239),
# A (--atomics true: withLrSc and withAmo in the data cache, GCD GenCoreDefault.scala#L154-L155),
# C (--compressedGen true, GCD GenCoreDefault.scala#L113) and Zifencei (the instruction cache
# flushes on fence.i, VEX plugin/IBusCachedPlugin.scala).
# Zicntr: cycle and instret are readable (CsrPluginConfig.all sets ucycleAccess/uinstretAccess to
# READ_ONLY, VEX plugin/CsrPlugin.scala#L220-L239); time is not implemented (utimeAccess defaults
# to NONE), so it is emulated from the testbench's mtime (TIME_CSR_IMPLEMENTED below).
# Zihpm is not claimed: the core is machine-mode only (userGen and supervisorGen default to false
# in CsrPluginConfig.all), so there is no less-privileged mode to read hpmcounter3-31 from.
# Not claimed although the feature extractor reported them: U (mstatus.MPP reads 3 whatever is
# written, and there is no privilege register without userGen), and Zcb and Zcmop (their
# encodings are reserved in this core, which executes some of them as other instructions instead
# of raising an illegal-instruction exception, e.g. c.not as c.and and c.mop.1 as c.lui x1, 0).
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: A, version: "= 2.1.0" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  - { name: C, version: "= 2.0" }
  - { name: Zca, version: "= 1.0.0" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zicntr, version: "= 2.0.0" }
  - { name: Zifencei, version: "= 2.0.0" }
  # Privileged 1.11: there is no mstatush (RV32), mconfigptr or menvcfg, all of which 1.12 added;
  # accesses to them raise an illegal-instruction exception.
  - { name: Sm, version: "= 1.11.0" }

params:
  MXLEN: 32
  PHYS_ADDR_WIDTH: 32

  # misa exists and reads 0x4000_0042: MXL = 1, and the extension field is the constant
  # misaExtensionsInit = 66 (bits B and G) of CsrPluginConfig.all, which matches none of the
  # implemented extensions (VEX plugin/CsrPlugin.scala#L226, #L973-L976;
  # GCD VexRiscv_IMAC.v#L4311-L4312). Writes are ignored.
  MISA_CSR_IMPLEMENTED: true
  MUTABLE_MISA_A: false
  MUTABLE_MISA_C: false
  MUTABLE_MISA_M: false
  NON_STANDARD_EXTENSION_IMPLEMENTED: false
  M_MODE_ENDIANNESS: little

  # mvendorid = 11, marchid = 22, mimpid = 33 (CsrPluginConfig.all, VEX plugin/CsrPlugin.scala#L222-L224).
  VENDOR_ID_BANK: 0
  VENDOR_ID_OFFSET: 11
  MARCHID_IMPLEMENTED: true
  ARCH_ID_VALUE: 22
  MIMPID_IMPLEMENTED: true
  IMP_ID_VALUE: 33

  # mtvec: only BASE is mapped (xtvecModeGen is false), so MODE reads 0 and a write of MODE 1
  # or 3 sets BASE and leaves MODE 0 (VEX plugin/CsrPlugin.scala#L1038-L1041). mtvec has no
  # reset value (--machineTrapVector is not given).
  MTVEC_ACCESS: rw
  MTVEC_MODES: [0]
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom
  MTVAL_WIDTH: 32

  # Machine timer and software interrupts come from the core's timerInterrupt and
  # softwareInterrupt inputs, and the external interrupt from externalInterruptArray AND the
  # mask in CSR 0xBC0 (GCD GenCoreDefault.scala#L252-L259). The testbench drives all three.
  MEI_INTR_IMPL: true
  MSI_INTR_IMPL: true
  MTI_INTR_IMPL: true

  # Traps. ebreak is not decoded: CsrPluginConfig.all leaves ebreakGen at its default, false
  # (VEX plugin/CsrPlugin.scala#L63), and the generator warns "This VexRiscv configuration is set
  # without software ebreak instruction support" (VEX plugin/CsrPlugin.scala#L557). ebreak and
  # c.ebreak therefore raise an illegal-instruction exception, with the encoding in mtval. UDB
  # cannot express that (TRAP_ON_EBREAK false means ebreak is handled without any trap), so the
  # value is the one the specification requires and the failing tests are excluded in ci.yaml.
  TRAP_ON_EBREAK: true
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_CSR: true
  TRAP_ON_ILLEGAL_WLRL: false
  # Illegal instructions report the instruction (VEX plugin/DecoderSimplePlugin.scala#L189,
  # plugin/CsrPlugin.scala#L1539); misaligned and faulting loads and stores the address.
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: true
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  # In-order pipeline; exceptions are taken in order at writeback.
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true

  # Misaligned loads, stores and AMOs raise address-misaligned exceptions (catchUnaligned = true,
  # GCD GenCoreDefault.scala#L153; VEX plugin/DBusCachedPlugin.scala#L542-L544).
  MISALIGNED_LDST: false
  MISALIGNED_AMO: false
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low
  LRSC_MISALIGNED_BEHAVIOR: always raise misaligned exception
  # The data cache keeps one reservation bit and no address: lr sets it, any store clears it,
  # and an sc succeeds while it is set, whatever its address (VEX ip/DataCache.scala#L883-L889).
  LRSC_RESERVATION_STRATEGY: custom
  LRSC_FAIL_ON_NON_EXACT_LRSC: false
  LRSC_FAIL_ON_VA_SYNONYM: false

  # wfi stalls until an enabled interrupt is pending (wfiGenAsWait, VEX plugin/CsrPlugin.scala#L1516-L1524).
  WFI_FINITE: false
  WFI_U_MODE: false

  # The only physical attribute boundary is bit 31, which selects uncached I/O (ioRange = _.msb,
  # GCD GenCoreDefault.scala#L187-L189).
  PMA_GRANULARITY: 31

  # No PMP (--pmpRegions defaults to 0). pmpcfg0-3 and pmpaddr0-15 read 0 and ignore writes.
  NUM_PMP_ENTRIES: 0

  # mcycle and minstret are 64-bit and writable (CsrPluginConfig.all). time is not implemented.
  TIME_CSR_IMPLEMENTED: false
  # mhpmcounter3-31 and mhpmevent3-31 read 0 and ignore writes. mcountinhibit and mcounteren are
  # not implemented (an access raises an illegal-instruction exception).
  HPM_COUNTER_EN:
    [
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]
  MCOUNTINHIBIT_IMPLEMENTED: false
  MCOUNTENABLE_EN:
    [
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]
