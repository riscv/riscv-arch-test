# Normative rule to coverpoint mappings
# Generated from riscv-isa-manual normative rule definitions

normative_rule_definitions:
  # If S-mode is implemented, the set of legal values that the UXL field may assume
  # excludes those that would cause UXLEN to be greater than SXLEN.
  # With SXLEN=64 the only excluded value is the reserved UXL=3; cp_sxlen_ge_uxlen writes it and
  # checks that UXL reads back 1 or 2.
  - name: mstatus_uxl_legal_vals_smode
    coverpoint: ["S_sstatus_cg/cp_sxlen_ge_uxlen"]
