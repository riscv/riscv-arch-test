# CI configuration for Whisper simulator

ci_enabled: true
exclude_extensions:
  # Sail lacks Ssaia/Sscsrind, so expects illegal instead of virtual instruction for their CSRs from VU-mode.
  - H_vucsr
  # Max configs: Whisper keeps tcontrol.mte and mpte writable while using mstatus.MIE/SIE for breakpoint
  # reentrancy, but Sail hard-wires them to 0 unless breakpoint_reentrancy is Use_tcontrol.
  - SdtrigSm_tcontrol
  # Sail 0.16 lacks Smaia and Smrnmi, whose CSRs Whisper implements
  - Ssstrict_Sm_CSR
  # Sail traps on siselect/stopi accesses that Whisper permits with mstateen0 enabled.
  # In VS-mode, Whisper raises virtual instruction on the AIA and Sscsrind CSRs (siselect/sireg, stopi,
  # vsiselect, vstopi, vstopei, hvien), where Sail raises illegal instruction because it lacks them.
  - Ssstrict_S_CSR
  - Ssstrict_H_vs_CSR
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 2
