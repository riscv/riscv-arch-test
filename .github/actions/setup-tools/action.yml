# jcarlin@hmc.edu 2 July 2026
# SPDX-License-Identifier: Apache-2.0
#
# Shared job setup: mise (Ruby + uv), uv package cache, and the UDB gem cache.

# Caches are saved only on the act4 branch. PR and merge-queue refs cannot share
# caches with each other, so saving there only fills the repository cache limit.

name: Set up tools
description: Set up mise and cache CI tools, uv packages, and UDB gems

inputs:
  install-architecture-tools:
    description: Install Sail, GCC, and LLVM
    required: false
    default: "false"
  sail-version:
    description: Sail RISC-V version
    required: false
    default: "0.16"
  riscv-toolchain-version:
    description: RISC-V GCC toolchain version
    required: false
    default: "2026.10.29"
  llvm-version:
    description: LLVM version
    required: false
    default: "23.1.5"

runs:
  using: composite
  steps:
    - name: Set up mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

    - name: Cache prek hook environments
      id: prek-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/prek
        key: prek-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', '.pre-commit-config.yaml') }}

    - name: Prepare architecture tool directories
      if: inputs.install-architecture-tools == 'true'
      shell: bash
      run: |
        sudo mkdir -p /opt/act4-tools/{sail,gcc,llvm}
        sudo chown -R "$USER:$USER" /opt/act4-tools

    - name: Cache Sail RISC-V
      if: inputs.install-architecture-tools == 'true'
      id: sail-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /opt/act4-tools/sail
        key: act4-sail-${{ runner.os }}-${{ runner.arch }}-${{ inputs.sail-version }}

    - name: Cache RISC-V GCC
      if: inputs.install-architecture-tools == 'true'
      id: gcc-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /opt/act4-tools/gcc
        key: act4-gcc-${{ runner.os }}-${{ runner.arch }}-${{ inputs.riscv-toolchain-version }}

    - name: Cache LLVM packages
      if: inputs.install-architecture-tools == 'true'
      id: llvm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /opt/act4-tools/llvm
        key: act4-llvm-${{ runner.os }}-${{ runner.arch }}-${{ inputs.llvm-version }}

    - name: Install sail-riscv model
      if: inputs.install-architecture-tools == 'true' && steps.sail-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SAIL_VERSION: ${{ inputs.sail-version }}
      run: |
        tool_dir="/opt/act4-tools/sail"
        archive="$tool_dir/sail-riscv-${SAIL_VERSION}.tar.gz"
        runner_uname=$(uname)
        runner_arch=$(arch)
        curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
          "https://github.com/riscv/sail-riscv/releases/download/${SAIL_VERSION}/sail-riscv-${runner_uname}-${runner_arch}.tar.gz" \
          --output "$archive"
        tar xzf "$archive" --directory="$tool_dir" --strip-components=1
        rm -f "$archive"

    - name: Install RISC-V GCC toolchain
      if: inputs.install-architecture-tools == 'true' && steps.gcc-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        RISCV_TOOLCHAIN_VERSION: ${{ inputs.riscv-toolchain-version }}
      run: |
        tool_dir="/opt/act4-tools/gcc"
        archive="$tool_dir/riscv64-elf-ubuntu-24.04-gcc-${RISCV_TOOLCHAIN_VERSION}.tar.xz"
        curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
          "https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/${RISCV_TOOLCHAIN_VERSION}/riscv64-elf-ubuntu-24.04-gcc.tar.xz" \
          --output "$archive"
        tar xJf "$archive" --directory="$tool_dir" --strip-components=1
        rm -f "$archive"

    - name: Install LLVM
      if: inputs.install-architecture-tools == 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        tool_dir="/opt/act4-tools/llvm"
        case "$(arch)" in
          x86_64) llvm_arch=X64 ;;
          aarch64) llvm_arch=ARM64 ;;
          *) echo "No LLVM release for $(arch)"; exit 1 ;;
        esac
        release="LLVM-${LLVM_VERSION}-Linux-${llvm_arch}"
        archive="$tool_dir/${release}.tar.zst"
        curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${release}.tar.zst" \
          --output "$archive"
        major="${LLVM_VERSION%%.*}"
        members=(lib/clang)
        for tool in clang "clang-${major}" clang++ ld.lld lld llvm-objdump llvm-objcopy llvm-ar llvm-nm llvm-readelf llvm-readobj; do
          members+=("bin/${tool}")
        done
        tar --use-compress-program="zstd -d --long=31" -xf "$archive" --directory="$tool_dir" --strip-components=1 \
          --exclude="${release}/lib/clang/*/lib" "${members[@]/#/${release}/}"
        rm -f "$archive"
        "$tool_dir/bin/clang" --version

    - name: Add architecture tools to PATH
      if: inputs.install-architecture-tools == 'true'
      shell: bash
      run: | # zizmor: ignore[github-env]
        {
          echo /opt/act4-tools/sail/bin
          echo /opt/act4-tools/gcc/bin
          echo /opt/act4-tools/llvm/bin
        } >> "$GITHUB_PATH"

    - name: Cache uv packages
      id: uv-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

    # Install UDB gems into a dedicated directory so they can be cached
    # independently of the mise-managed Ruby installation.
    - name: Configure Bundler path
      shell: bash
      run: bundle config set --global path "${GITHUB_WORKSPACE}/.bundle-gems"

    # ~/.cache/udb holds the z3/espresso binaries that the udb gem downloads
    # at install time; a restored gem cache skips `bundle install`, so the
    # binaries must be cached along with the gems.
    - name: Cache UDB gems
      id: udb-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          .bundle-gems
          ~/.cache/udb
        key: udb-gems-${{ runner.os }}-${{ hashFiles('.mise.toml', 'framework/src/act/data/Gemfile.lock') }}

    - name: Install project dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if mise deps; then
            exit 0
          fi
          if [[ "${attempt}" -eq 3 ]]; then
            exit 1
          fi
          delay=$((attempt * 10))
          echo "mise deps failed; retrying in ${delay}s (attempt $((attempt + 1))/3)..."
          sleep "${delay}"
        done

    - name: Save prek hook cache
      if: github.ref == 'refs/heads/act4' && steps.prek-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/prek
        key: prek-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', '.pre-commit-config.yaml') }}

    - name: Save Sail cache
      if: inputs.install-architecture-tools == 'true' && github.ref == 'refs/heads/act4' && steps.sail-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /opt/act4-tools/sail
        key: act4-sail-${{ runner.os }}-${{ runner.arch }}-${{ inputs.sail-version }}

    - name: Save GCC cache
      if: inputs.install-architecture-tools == 'true' && github.ref == 'refs/heads/act4' && steps.gcc-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /opt/act4-tools/gcc
        key: act4-gcc-${{ runner.os }}-${{ runner.arch }}-${{ inputs.riscv-toolchain-version }}

    - name: Save LLVM cache
      if: inputs.install-architecture-tools == 'true' && github.ref == 'refs/heads/act4' && steps.llvm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /opt/act4-tools/llvm
        key: act4-llvm-${{ runner.os }}-${{ runner.arch }}-${{ inputs.llvm-version }}

    - name: Save uv cache
      if: github.ref == 'refs/heads/act4' && steps.uv-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

    - name: Save UDB gems cache
      if: github.ref == 'refs/heads/act4' && steps.udb-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          .bundle-gems
          ~/.cache/udb
        key: udb-gems-${{ runner.os }}-${{ hashFiles('.mise.toml', 'framework/src/act/data/Gemfile.lock') }}
